q: 10
answer: エ
category: コンピュータ構成要素
theme: |
  キャッシュメモリに主記憶のデータをどこに置くかを決める「マッピング方式」のうち、フルアソシエイティブ方式の特徴を問う問題です。
basics: |
  主記憶もキャッシュも、<b>ブロック</b>という一定の大きさの単位に区切って管理します。主記憶のブロックをキャッシュのどのブロックに置けるかで、3つの方式があります。
  - <b>ダイレクトマッピング方式</b>：主記憶の各ブロックは、キャッシュの<b>決まった1か所</b>にしか置けない。仕組みは簡単だが、同じ場所を取り合うと入れ替えが頻発する。
  - <b>セットアソシエイティブ方式</b>：キャッシュをいくつかの<b>セット</b>（ブロックのグループ）に分け、主記憶の各ブロックは決まったセットの中なら空いている場所に置ける。
  - <b>フルアソシエイティブ方式</b>：主記憶のブロックを、キャッシュの<b>どのブロックにでも</b>置ける。最も柔軟で無駄が少ないが、探すときにキャッシュ全体を調べる必要があり、回路が複雑になる。
reasoning: |
  1. 「フル（完全に）アソシエイティブ（連想的）」＝場所の制限がまったくない方式です。
  2. 「任意のキャッシュメモリのブロックを主記憶のどの部分にも割り当てられる」という<b>エ</b>が、場所の制限がないことを表しています。
  3. アはセットアソシエイティブ方式、イはダイレクトマッピング方式に近い説明です。
choices:
  ア: キャッシュの各ブロックに主記憶の「セット」が固定されているのは、<b>セットアソシエイティブ方式</b>の考え方です。誤り。
  イ: キャッシュの各ブロックに主記憶のブロックが固定されている（置き場所が決まっている）のは、<b>ダイレクトマッピング方式</b>です。誤り。
  ウ: 主記憶の特定の1ブロックに専用のキャッシュを割り当てる方式は、一般的なマッピング方式ではありません。誤り。
  エ: 任意のキャッシュブロックを主記憶のどの部分にも割り当てられる（場所の制限がない）のは、<b>フルアソシエイティブ方式</b>です。<b>正解</b>。
example: |
  駐車場で例えると、ダイレクトマッピングは「車のナンバーの末尾で駐車位置が1つに決まっている」方式、セットアソシエイティブは「末尾の数字ごとに決まったエリアの中なら自由に停められる」方式、フルアソシエイティブは「空いていればどこに停めてもよい」方式です。どこでも停められる代わりに、自分の車を探すときは全部の区画を見て回る必要があります。
review:
  - フルアソシエイティブ＝主記憶のブロックをキャッシュのどこにでも置ける（柔軟だが検索回路が複雑）。
  - ダイレクトマッピング（置き場所が1つに固定）、セットアソシエイティブ（決まったセット内なら自由）と区別する。
