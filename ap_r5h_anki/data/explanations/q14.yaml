q: 14
answer: イ
category: システム構成要素
theme: |
  2つのジョブがCPUと磁気ディスク装置を順番に使うとき、全体の時間に対して各装置が働いていた割合（使用率）を、時間の流れを追って求める問題です。
basics: |
  <b>使用率</b>：全体の時間のうち、その装置が処理をしていた（使われていた）時間の割合です。
  | 使用率 ＝ 装置が使われていた時間 ÷ 全体の時間（全ジョブが終わるまで）

  問題の条件
  - CPUも磁気ディスク装置も、同時に1つの要求しか処理できず、発生した順に処理する。
  - 各ジョブは「CPUの処理 → 磁気ディスク装置の処理」の順に実行する。
  - A、Bの順に実行する。
  CPUと磁気ディスク装置は別の装置なので、<b>Aがディスクを使っている間に、BがCPUを使う</b>ことができます。
reasoning: |
  時間の流れを追います（単位：秒）。
  | 0〜3：CPUでジョブAを処理
  | 3〜10：ディスクでジョブAを処理（3＋7）
  | 3〜15：CPUでジョブBを処理（Aの CPU 処理が終わった3秒から、3＋12）
  | 15〜25：ディスクでジョブBを処理（Bの CPU 処理が終わった15秒から、15＋10）
  ※ディスクは10秒にAの処理を終えて空いていますが、BのCPU処理が終わる15秒までは使われません。

  全体の時間：<b>25秒</b>
  | CPUの使用時間：3 ＋ 12 ＝ 15秒 → 15 ÷ 25 ＝ <b>0.60</b>
  | ディスクの使用時間：7 ＋ 10 ＝ 17秒 → 17 ÷ 25 ＝ <b>0.68</b>
  正解は<b>イ</b>です。
choices:
  ア: 0.47・0.53 は 15÷32、17÷32 で、全体の時間を全処理時間の単純合計（3＋7＋12＋10＝32秒）としてしまった値です。CPUとディスクは並行して動けるので、実際の全体時間は25秒です。誤り。
  イ: CPU 0.60、磁気ディスク装置 0.68。全体25秒に対して、CPU 15秒・ディスク17秒使われたときの値です。<b>正解</b>。
  ウ: 0.79・0.89 は 15÷19、17÷19 で、全体の時間を19秒としてしまった値です。ディスクがBの処理を始められるのはBのCPU処理が終わる15秒からなので、全体は25秒です。誤り。
  エ: 0.88・1.00 は 15÷17、17÷17 で、ディスクの使用時間17秒を全体の時間としてしまった値です。実際にはディスクは0〜3秒と10〜15秒に空いています。誤り。
example: |
  2人で料理をするとき、1人目が下ごしらえ（CPU）を終えて加熱（ディスク）に移ったら、2人目がまな板（CPU）を使い始められます。ただし、2人目の下ごしらえが長いと、コンロ（ディスク）はその間空いて待つことになります。各道具が全体のうちどれだけ使われたかが使用率です。
review:
  - 使用率＝装置が使われていた時間÷全ジョブが終わるまでの時間。
  - CPUとディスクは別装置なので並行して使える。各装置の開始時刻（前の処理の終了・自ジョブの前段の終了の遅い方）を時系列で追う。
