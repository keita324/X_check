q: 39
answer: ア
category: セキュリティ
theme: |
  デジタル署名で使う「署名鍵（送信者の秘密鍵）」の正しい使い方を、暗号化（秘匿）の仕組みと混同せずに選ぶ問題です。
basics: |
  <b>公開鍵暗号</b>では、ペアになった2つの鍵を使います。
  - <b>秘密鍵</b>：本人だけが持つ鍵。デジタル署名では「署名鍵」とも呼ばれる。
  - <b>公開鍵</b>：誰でも入手できる鍵。署名の検証に使う（「検証鍵」）。

  <b>デジタル署名の流れ</b>
  1. 送信者は、メッセージ（通常はそのハッシュ値）に対して、<b>自分の署名鍵（秘密鍵）</b>で署名を作り、メッセージに付けて送る。
  2. 受信者は、<b>送信者の公開鍵</b>で署名を検証する。検証できれば「本当に送信者が署名した」こと（なりすましがない）と、「途中で改ざんされていない」ことが確認できる。
  署名は<b>内容を隠す（秘匿する）ためのものではありません</b>。内容を隠すには、受信者の公開鍵で暗号化します。
reasoning: |
  1. 署名鍵は送信者本人しか持っていないので、それで作った署名は「送信者本人が作った」証拠になります。
  2. 「送信者が送信者の署名鍵を使ってメッセージに対する署名を作成し、メッセージに付加することによって、受信者が送信者による署名であることを確認できる」という<b>ア</b>が正しい使い方です。
choices:
  ア: 送信者が自分の署名鍵で署名を作ってメッセージに付けることで、受信者は送信者の署名であることを確認できます。<b>正解</b>。
  イ: 受信者が「受信者の署名鍵」で元に戻すという説明が誤りです。送信者の署名鍵で処理したものを検証できるのは<b>送信者の公開鍵</b>で、受信者の鍵ではありません。誤り。
  ウ: 送信者の署名鍵で処理したものは、誰でも入手できる送信者の公開鍵で検証（復元）できてしまうので、内容を関係者以外から隠すことはできません。秘匿したいなら受信者の公開鍵で暗号化します。誤り。
  エ: デジタル署名で分かるのは「改ざんされたかどうか」であり、<b>どこが</b>改ざんされたか（改ざん部位）までは特定できません。誤り。
example: |
  署名鍵は「本人だけが持つ印鑑（実印）」、公開鍵は「役所に登録された印鑑証明」のようなものです。書類に実印を押せば、受け取った人は印鑑証明と照らし合わせて本人が押したと確認できます。ただし、実印を押しても書類の中身は誰にでも読めます（秘密にはならない）。
review:
  - デジタル署名＝送信者の署名鍵（秘密鍵）で署名し、受信者は送信者の公開鍵で検証する。本人確認と改ざん検知ができる。
  - 署名は内容の秘匿には使えず、改ざんの「有無」は分かるが「場所」は特定できない。
