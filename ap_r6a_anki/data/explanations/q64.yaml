q: 64
answer: イ
category: システム戦略
theme: |
  BPR（業務の抜本的な見直し）の4つのシナリオについて、人件費の削減、外部委託の費用、空いた時間で得られる利益を計算し、金額面の効果が最も高いシナリオを選ぶ問題です。
basics: |
  <b>BPR（ビジネスプロセスリエンジニアリング）</b>：業務のやり方を根本から見直し、効率や効果を大きく高める取組みです。
  条件の整理
  | 現状：5人×1,800時間＝9,000時間
  | BPR後：業務は7,000時間で済み、そのうち2,000時間分は外部委託できる
  | 1人の年間人件費600万円、1人の年間の作業可能時間1,800時間
  | 外部委託の年間費用700万円（固定）
  | 空いた時間：100時間当たり20万円の利益（＝1時間当たり0.2万円）
  | 4人で行う場合、1人は異動 → 600万円の人件費削減効果
  各シナリオの金額面の効果は、
  | 効果 ＝ 人件費の削減 ＋ 空いた時間の利益 − 外部委託の費用
reasoning: |
  各シナリオを計算します（単位：万円）。
  <b>シナリオa</b>（4人、外部委託する）
  | 社内で行う時間：7,000 − 2,000 ＝ 5,000時間
  | 4人の作業可能時間：4 × 1,800 ＝ 7,200時間 → 空き時間 2,200時間
  | 効果：600（1人分の削減）＋ 2,200×0.2（440）− 700 ＝ <b>340</b>
  <b>シナリオb</b>（4人、外部委託しない）
  | 社内で行う時間：7,000時間、空き時間：7,200 − 7,000 ＝ 200時間
  | 効果：600 ＋ 200×0.2（40）＝ <b>640</b>
  <b>シナリオc</b>（5人、外部委託する）
  | 社内で行う時間：5,000時間、空き時間：9,000 − 5,000 ＝ 4,000時間
  | 効果：4,000×0.2（800）− 700 ＝ <b>100</b>
  <b>シナリオd</b>（5人、外部委託しない）
  | 社内で行う時間：7,000時間、空き時間：9,000 − 7,000 ＝ 2,000時間
  | 効果：2,000×0.2 ＝ <b>400</b>
  効果が最も高いのはシナリオb（640万円）です。正解は<b>イ</b>です。
choices:
  ア: シナリオaの効果は、600＋440−700＝340万円です。外部委託費700万円が、空き時間の利益の増加分（2,000時間×0.2＝400万円）を上回るため、bより低くなります。誤り。
  イ: シナリオbの効果は、1人分の人件費削減600万円＋空き時間200時間分の利益40万円＝640万円で、最も高くなります。<b>正解</b>。
  ウ: シナリオcの効果は、空き時間4,000時間分の利益800万円−外部委託費700万円＝100万円で、最も低くなります。誤り。
  エ: シナリオdの効果は、空き時間2,000時間分の利益400万円です。人件費の削減がないため、bより低くなります。誤り。
example: |
  家事代行を頼むかどうかの判断に似ています。代行費（外部委託費）が、空いた時間で稼げるお金より高ければ、頼まない方が得です。また、家族の1人が別の仕事に移れば（異動）、その分の負担（人件費）がまるごと減ります。
review:
  - 各シナリオで「社内作業時間→空き時間→利益」と「人件費削減」「外部委託費」を整理し、効果＝削減＋利益−費用で比較する。
  - 外部委託は、委託費（700万円）と、それで生まれる空き時間の利益（2,000時間×0.2＝400万円）を比べると判断しやすい。
