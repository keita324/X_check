q: 62
answer: ア
category: システム戦略
theme: |
  顧客一人ひとりに合わせたマーケティング（ワントゥワンマーケティング）を実現するための情報システムのソリューションを、HRM・SCM・財務管理と区別する問題です。
basics: |
  <b>ワントゥワンマーケティング</b>：顧客を一括りにせず、<b>一人ひとりの好みや購買履歴に合わせて</b>、個別に商品の提案やサービスを行うマーケティング手法です。
  企業向けの主なソリューション（業務システム）
  - <b>CRM（Customer Relationship Management：顧客関係管理）</b>：顧客の属性、購買履歴、問合せ履歴などを一元管理し、顧客との関係を深めて満足度や生涯価値を高める。ワントゥワンマーケティングの基盤になる。
  - <b>HRM（Human Resource Management：人的資源管理）</b>：社員の採用、評価、育成、配置などを管理する。
  - <b>SCM（Supply Chain Management：供給連鎖管理）</b>：原材料の調達から生産、物流、販売までの流れを、企業の枠を越えて最適化する。
  - <b>財務管理</b>：会計、資金、予算などのお金の流れを管理する。
reasoning: |
  1. ワントゥワンマーケティングには、顧客ごとの情報を集めて管理し、個別の対応に活用する仕組みが必要です。
  2. それを実現するのは<b>CRMソリューション</b>です。正解は<b>ア</b>です。
choices:
  ア: CRMソリューションは、顧客情報を一元管理し、顧客ごとに最適な対応をすることで、ワントゥワンマーケティングを実現します。<b>正解</b>。
  イ: HRMソリューションは、社員（人的資源）の管理のためのもので、顧客へのマーケティングとは関係ありません。誤り。
  ウ: SCMソリューションは、調達から販売までの供給の流れを最適化するもので、顧客ごとのマーケティングを目的としたものではありません。誤り。
  エ: 財務管理ソリューションは、会計や資金を管理するもので、マーケティングの実現が目的ではありません。誤り。
example: |
  ネット通販で「この商品を買った人には、こちらもおすすめ」「前回の購入から1か月たったので、消耗品の補充はいかがですか」と、自分に合わせた案内が届くのは、CRMで顧客ごとの購買履歴を管理し、活用しているからです。
review:
  - CRM＝顧客情報を一元管理し、顧客との関係を強化する（ワントゥワンマーケティングの基盤）。
  - HRM（人材管理）、SCM（調達〜販売の供給連鎖の最適化）、財務管理と区別する。
