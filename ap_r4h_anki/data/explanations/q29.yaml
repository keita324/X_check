q: 29
answer: ア
category: データベース
theme: |
  データベースの障害回復方式「undo/redo方式」で、ログに更新前情報と更新後情報の両方が必要かどうかを問う問題です。
basics: |
  <b>ログ（ジャーナル）</b>：データベースの更新の履歴を記録したものです。各更新について、
  - <b>更新前情報（前イメージ）</b>：更新する前の値
  - <b>更新後情報（後イメージ）</b>：更新した後の値
  を記録できます。

  <b>2つの回復処理</b>
  - <b>undo（ロールバック）</b>：コミットしていない（未確定の）トランザクションの更新を取り消し、元に戻す。→ <b>更新前情報</b>が必要。
  - <b>redo（ロールフォワード）</b>：コミット済み（確定済み）なのにディスクに反映されていない更新をやり直す。→ <b>更新後情報</b>が必要。
  <b>undo/redo方式</b>：障害時に、未コミットの更新はundoで取り消し、コミット済みの更新はredoで再実行する方式です。
reasoning: |
  1. undo/redo方式は、undoとredoの<b>両方</b>を行う方式です。
  2. undoには更新前情報、redoには更新後情報が必要です。
  3. よって、ログには更新前情報・更新後情報の<b>両方が必要</b>です。正解は<b>ア</b>です。
choices:
  ア: undoのための更新前情報、redoのための更新後情報の両方が必要です。<b>正解</b>。
  イ: 更新前情報だけでは、undo（取消し）はできても、redo（コミット済みの更新のやり直し）ができません。更新前情報だけで済むのはundoだけを行う方式です。誤り。
  ウ: 更新後情報だけでは、redoはできても、未コミットの更新をundoで取り消せません。更新後情報だけで済むのはredoだけを行う方式です。誤り。
  エ: ログ情報が不要では、障害時に取消しもやり直しもできません。誤り。
example: |
  文書作成ソフトの「元に戻す（undo）」と「やり直し（redo）」を思い浮かべてください。元に戻すには「変更前の文章」、やり直すには「変更後の文章」が記録されている必要があります。両方の操作をしたいなら、両方の記録が必要です。
review:
  - undo（取消し）＝更新前情報を使う、redo（再実行）＝更新後情報を使う。
  - undo/redo方式は両方行うので、ログに更新前・更新後の両方の情報が必要。
