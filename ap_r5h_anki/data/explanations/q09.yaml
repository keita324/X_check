q: 9
answer: ウ
category: コンピュータ構成要素
theme: |
  命令の処理を流れ作業のように重ねて実行する「パイプライン制御」で、20個の命令を実行するのに必要なサイクル数を計算する問題です。
basics: |
  <b>ステージ</b>：1つの命令の処理を分割した工程です（例：命令の取出し→解読→オペランドの取出し→実行→結果の書込み）。この問題では1命令が5ステージで、各ステージは1サイクルで終わります。
  <b>パイプライン制御</b>：1つ目の命令が2つ目のステージに進んだら、空いた1つ目のステージで次の命令の処理を始める、というように、複数の命令を<b>1サイクルずつずらして重ねて</b>実行する方式です。
  | パイプラインでの総サイクル数 ＝ ステージ数 ＋ (命令数 − 1)
  （最初の命令が終わるまでにステージ数のサイクルがかかり、その後は1サイクルごとに1命令ずつ完了する）
reasoning: |
  1. 1つ目の命令は、5ステージを通過して<b>5サイクル目</b>に完了します。
  2. 2つ目以降の命令は、1サイクル遅れで追いかけてくるので、6サイクル目に2つ目、7サイクル目に3つ目…と、<b>1サイクルごとに1命令</b>ずつ完了します。
  3. 残りの 20 − 1 ＝ 19 命令が完了するのに19サイクルかかります。
  | 総サイクル数 ＝ 5 ＋ (20 − 1) ＝ 5 ＋ 19 ＝ <b>24サイクル</b>
  4. 正解は<b>ウ</b>です。
  （参考：パイプラインを使わず1命令ずつ順に実行すると、5 × 20 ＝ 100サイクルかかります。）
choices:
  ア: 20サイクルは、1サイクルに1命令ずつ完了するという点だけを考え、最初の命令が5ステージを通過するまでの時間を考慮していません。誤り。
  イ: 21サイクルは、計算結果の24サイクルと一致しません。誤り。
  ウ: 24サイクル。5 ＋ (20 − 1) で、計算結果と一致します。<b>正解</b>。
  エ: 25サイクルは、ステージ数＋命令数（5＋20）で、−1 を忘れた値です。誤り。
example: |
  洗濯→乾燥→たたみ→アイロン→収納 の5工程（各1時間）で20回分の洗濯物を処理するとき、1回目の洗濯が終わったらすぐ2回目の洗濯を始めれば、1回目が5時間で終わった後は、1時間ごとに1回分ずつ完成します。合計は 5＋19＝24時間です。
review:
  - パイプラインの総サイクル数＝ステージ数＋（命令数−1）。
  - 1つ目の命令の完了にステージ数分、以降は1サイクルごとに1命令完了、と分けて考える。
