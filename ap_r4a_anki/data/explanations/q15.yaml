q: 15
answer: ア
theme: |
  サーバの処理能力とネットワークの転送能力の両方を計算し、遅い方（ボトルネック）がシステム全体の処理件数を決めることを理解する問題です。
basics: |
  <b>MIPS</b>：Million Instructions Per Second。1秒間に何百万（10<sup>6</sup>）個の命令を実行できるかを表すCPUの性能指標です。100MIPSなら、1秒間に 100×10<sup>6</sup>＝10<sup>8</sup>（1億）命令を実行できます。
  <b>ビットとバイト</b>：1バイト＝8ビット。ネットワークの速度は「ビット/秒」で表すことが多いので、バイトで与えられたデータ量はビットに直して計算します。
  <b>ボトルネック</b>：処理の流れの中で一番遅い部分。瓶の首（ネック）が細いと中身がゆっくりしか出ないことに由来します。全体の速さは一番遅い部分で決まります。
reasoning: |
  <b>(1) サーバの処理能力</b>
  | サーバは1秒に 100MIPS ＝ 100×10<sup>6</sup> ＝ 10<sup>8</sup> 命令
  | 1件あたり 100万命令 ＝ 10<sup>6</sup> 命令
  | 10<sup>8</sup> ÷ 10<sup>6</sup> ＝ <b>100件/秒</b>

  <b>(2) ネットワークの転送能力</b>
  | 1件あたりのデータ量 ＝ 2×10<sup>5</sup> バイト × 8 ＝ 16×10<sup>5</sup> ＝ 1.6×10<sup>6</sup> ビット
  | 回線速度 ＝ 8×10<sup>7</sup> ビット/秒
  | 8×10<sup>7</sup> ÷ (1.6×10<sup>6</sup>) ＝ 80×10<sup>6</sup> ÷ (1.6×10<sup>6</sup>) ＝ <b>50件/秒</b>

  <b>(3) システム全体</b>
  サーバは100件/秒こなせても、ネットワークが50件/秒しか運べないため、全体では遅い方の<b>50件/秒</b>しか処理できません。正解は<b>ア</b>です。
choices:
  ア: 50件。ネットワークがボトルネックとなり、システム全体で処理できるのは50件/秒です。<b>正解</b>。
  イ: 100件はサーバの処理能力だけを見た値です。ネットワークの制約を無視しています。誤り。
  ウ: 200件は、サーバの能力（100件/秒）もネットワークの能力（50件/秒）も上回っており、どちらの処理能力でも実現できない値です。誤り。
  エ: 400件は 8×10<sup>7</sup> ÷ (2×10<sup>5</sup>) で、<b>バイトをビットに換算し忘れた</b>値です。誤り。
example: |
  レストランで、厨房（サーバ）は1時間に100皿作れても、配膳係（ネットワーク）が50皿しか運べなければ、お客さんに届くのは1時間に50皿です。全体の速さは一番遅い工程で決まります。
review:
  - 処理件数＝能力÷1件あたりの量。サーバ（命令数）とネットワーク（ビット数）の両方を計算し、小さい方が答えになる。
  - ネットワーク計算では「バイト×8＝ビット」の換算を忘れない（忘れると400件のひっかけになる）。
  - MIPS＝100万命令/秒（100MIPS＝10<sup>8</sup>命令/秒）を即座に変換できるようにする。
