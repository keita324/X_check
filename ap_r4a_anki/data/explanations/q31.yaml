q: 31
answer: ウ
theme: |
  PCがネットワークに接続したときにIPアドレスなどを自動で設定する仕組み「DHCP」の特徴を問う問題です。
basics: |
  <b>IPアドレス</b>：ネットワーク上の機器の住所にあたる番号（例：192.168.1.10）。通信するには、IPアドレスのほかに次の設定も必要です。
  - <b>サブネットマスク</b>：IPアドレスのどこまでがネットワークの番号かを示す値。
  - <b>デフォルトゲートウェイ</b>：外部のネットワークへ出るときの出口（ルーター）のアドレス。
  - <b>DNSサーバのアドレス</b>：ドメイン名をIPアドレスに変換するサーバの場所。

  <b>DHCP（Dynamic Host Configuration Protocol）</b>：これらの設定を、DHCPサーバがPCに自動で配る仕組みです。
  <b>DHCPの流れ</b>：PCはまだ自分のIPアドレスもDHCPサーバの場所も知らないので、ネットワーク全体に「DHCPサーバはいますか？」と<b>ブロードキャスト</b>（全員宛ての一斉送信）で呼びかけます（DHCPDISCOVER）。DHCPサーバがそれに応えて設定を貸し出します。
  <b>リース</b>：IPアドレスは期限付きの「貸出し」で、使われなくなれば回収され、他のPCに貸されることがあります。
reasoning: |
  1. PCはブロードキャストでDHCPサーバを探すので、事前にDHCPサーバのアドレスを知っている必要はありません。
  2. よって「DHCPサーバのアドレスを設定しておく必要はない」という<b>ウ</b>が適切です。
  3. 他の選択肢を確認すると、ア（サブネットマスク等も配れる）、イ（混在できる）、エ（同じアドレスとは限らない）はいずれも誤りです。
choices:
  ア: DHCPでは、IPアドレスだけでなく、サブネットマスク、デフォルトゲートウェイ、DNSサーバのアドレスなども自動設定できます。誤り。
  イ: DHCPで自動設定するPCと、IPアドレスを手動で固定したPC（サーバやプリンターなど）は混在できます。DHCPサーバ側で、固定用のアドレスを配布範囲から外しておけばよいだけです。誤り。
  ウ: PCはブロードキャストでDHCPサーバを探すため、DHCPサーバのアドレスをPCに設定しておく必要はありません。<b>正解</b>。
  エ: IPアドレスはリース（期限付きの貸出し）なので、電源が切れていた間に期限が切れて回収されると、次は別のアドレスが割り当てられることがあります。「必ず同じ」は誤り。
example: |
  ホテルのフロントのようなものです。到着した客（PC）は、フロントの場所を知らなくても「チェックインしたいです」とロビーで声を上げれば（ブロードキャスト）、フロント係（DHCPサーバ）が部屋番号（IPアドレス）とWi-Fiの案内（ゲートウェイなど）をくれます。次に泊まるときは別の部屋になることもあります（リース）。
review:
  - DHCPクライアントはブロードキャストでDHCPサーバを探すので、サーバのアドレス設定は不要。
  - DHCPはIPアドレス以外（サブネットマスク、デフォルトゲートウェイ、DNSサーバ）も配布できる。
  - アドレスはリース（期限付き貸出し）なので、毎回同じとは限らない。固定IPのPCとの混在も可能。
