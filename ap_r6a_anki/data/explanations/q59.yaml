q: 59
answer: ア
category: システム監査
theme: |
  システム監査基準（令和5年）で、本調査の前に行う「予備調査」の内容として正しいものを選ぶ問題です。
basics: |
  システム監査は、おおまかに次の流れで行います。
  | 監査計画 → <b>予備調査</b> → <b>本調査</b> → 評価・結論 → 監査報告 → フォローアップ
  - <b>予備調査</b>：本調査の前に、監査対象の<b>実態を把握</b>する調査です。監査対象部門の事務手続やマニュアル、業務内容、業務分掌（役割分担）の体制などを、資料の閲覧や関係者への質問を通じて確認し、本調査で何を重点的に調べるかを決めます。現地に行かず、資料の入手や質問だけで行うこともあります。
  - <b>本調査</b>：監査の結論を裏付けるために、<b>十分かつ適切な監査証拠</b>を入手し、評価する調査です。
reasoning: |
  1. ア：監査対象先の事務手続やマニュアルなどを通じて、業務内容や業務分掌の体制を把握するのは、予備調査の内容として適切です。
  2. イ：予備調査は、必ずしも現地に赴く必要はなく、資料の入手やアンケート、質問などでも行えます。「必ず」は誤り。
  3. ウ：監査の結論を裏付ける十分な監査証拠を入手するのは、<b>本調査</b>の目的です。
  4. エ：予備調査の範囲は監査対象先に限らず、関連する部門などから情報を得ることもあります。「だけに限定する」は誤り。
  5. 正解は<b>ア</b>です。
choices:
  ア: 監査対象先の事務手続やマニュアルなどを通じて、業務内容や業務分掌の体制などを把握するのは、予備調査の内容です。<b>正解</b>。
  イ: 予備調査は、資料の入手や質問、アンケートなどでも行えるので、必ず現地に赴く必要はありません。誤り。
  ウ: 監査の結論を裏付けるために十分な監査証拠を入手するのは、<b>本調査</b>で行うことです。誤り。
  エ: 予備調査では、必要に応じて監査対象先以外（関連部門など）からも情報を集めます。監査対象先だけに限定するものではありません。誤り。
example: |
  家の健康診断（ホームインスペクション）に例えると、まず図面や修繕履歴の書類を取り寄せて、家の構造やどこが古いかをざっと把握するのが予備調査です。それを踏まえて、実際に床下や屋根裏に入って細かく調べ、証拠となる写真や測定値を集めるのが本調査です。
review:
  - 予備調査＝本調査の前に、事務手続・マニュアル・業務分掌などから監査対象の実態を把握する。必ずしも現地調査は不要。
  - 十分かつ適切な監査証拠の入手は本調査の役割。
