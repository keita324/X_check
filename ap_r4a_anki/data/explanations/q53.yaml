q: 53
answer: エ
theme: |
  工数（人月）と要員数から各工程の期間を計算し、要員を追加したときに全体の期間が何か月短縮できるかを求める問題です。技術者ごとの生産性の違いがポイントです。
basics: |
  <b>人月（にんげつ）</b>：作業量の単位。1人が1か月かけてこなす作業量が1人月です。12人月の作業は、1人なら12か月、2人なら6か月かかります。
  | 期間（か月） ＝ 工数（人月） ÷ 1か月にこなせる工数（人数×生産性）

  <b>この問題の条件</b>
  - 表1の見積工数は<b>上級技術者</b>の生産性が基準。
  - プログラム作成・単体テストでは、上級技術者は初級技術者の2倍の生産性 → 初級技術者は上級の<b>0.5人分</b>として数える。
  - 工程は重ならない（順番に実施）ので、全体の期間＝各工程の期間の合計。
reasoning: |
  <b>(1) 現在の期間</b>
  | 設計：6人月 ÷ 上級2人 ＝ 3か月
  | プログラム作成・単体テスト：上級2人＋初級2人×0.5 ＝ 3人分
  | 　12人月 ÷ 3 ＝ 4か月
  | 結合テスト：12人月 ÷ 上級2人 ＝ 6か月
  | 合計：3 ＋ 4 ＋ 6 ＝ <b>13か月</b>

  <b>(2) 全工程に上級技術者を1人追加した後</b>
  | 設計：6 ÷ 3人 ＝ 2か月
  | プログラム作成・単体テスト：上級3人＋初級2人×0.5 ＝ 4人分
  | 　12 ÷ 4 ＝ 3か月
  | 結合テスト：12 ÷ 3人 ＝ 4か月
  | 合計：2 ＋ 3 ＋ 4 ＝ <b>9か月</b>

  <b>(3) 短縮できる期間</b>
  | 13 − 9 ＝ <b>4か月</b>
  正解は<b>エ</b>です。
choices:
  ア: 1か月。工程ごとの短縮は、設計1か月（3→2）、プログラム作成・単体テスト1か月（4→3）、結合テスト2か月（6→4）で、合計4か月です。1工程分だけでは足りません。誤り。
  イ: 2か月。結合テストの短縮分（6→4か月）だけに相当する値です。全工程の短縮を合計する必要があります。誤り。
  ウ: 3か月。正しく計算した短縮量4か月と一致しません。初級技術者の生産性（上級の0.5人分）を正しく換算しているか確認しましょう。誤り。
  エ: 4か月（13か月→9か月）。計算結果と一致します。<b>正解</b>。
example: |
  12個の段ボールを運ぶのに、ベテラン（1時間に1個）2人と新人（1時間に0.5個）2人なら、1時間に3個運べるので4時間かかります。ベテランを1人増やすと1時間に4個運べるので3時間。人数を数えるときは、能力の違いを「何人分か」に換算するのがコツです。
review:
  - 期間＝工数÷（人数×生産性）。初級技術者は上級の0.5人分として換算する。
  - 工程が重ならない場合、全体の期間は各工程の期間の合計。追加前（13か月）と追加後（9か月）の両方を計算して差を取る。
  - 生産性の差は「プログラム作成・単体テスト」だけに適用される点に注意する。
