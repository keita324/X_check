q: 42
answer: ウ
category: セキュリティ
theme: |
  PCの起動時に、OSが正規のものかをデジタル署名で確かめる「セキュアブート」の説明を、BIOSパスワードやHDDパスワードなどと区別する問題です。
basics: |
  <b>ブート（起動）の流れ</b>：電源を入れると、ファームウェア（BIOSやUEFI）が動き、ブートローダ、OSのカーネル、ドライバの順に読み込まれていきます。
  <b>ブートキット・ルートキット</b>：この起動の途中に入り込み、OSより先に動いてしまうマルウェア。OSが起動した後に動くマルウェア対策ソフトでは見つけにくいのが問題です。
  <b>セキュアブート</b>：UEFIの機能で、起動時に読み込むOSのプログラムやドライバの<b>デジタル署名を検証</b>し、<b>署名が有効な（正規の）ものだけを実行</b>します。改ざんされたプログラムや署名のないマルウェアは起動されないので、OSの起動完了前に動くマルウェアを防げます。
reasoning: |
  1. セキュアブートのキーワードは「起動時に」「デジタル署名を検証」「有効なものだけ実行」「OS起動完了前のマルウェアの実行を防ぐ」です。
  2. これを述べているのは<b>ウ</b>です。
choices:
  ア: BIOSにパスワードを設定して起動時に入力を求めるのは、<b>BIOSパスワード</b>による不正利用の防止で、起動するプログラムが正規のものかを確かめるセキュアブートではありません。誤り。
  イ: HDDやSSDにパスワードを設定して起動時に入力を求めるのは、<b>ディスクパスワード</b>（ドライブロック）で、セキュアブートではありません。誤り。
  ウ: 起動時にOSのプログラムやドライバのデジタル署名を検証し、有効なものだけを実行して、OS起動完了前のマルウェアの実行を防ぐのは<b>セキュアブート</b>です。<b>正解</b>。
  エ: マルウェア対策ソフトをスタートアッププログラムに登録して起動時にスキャンする方法では、OSが起動した<b>後</b>にしかスキャンできず、それより前に動くマルウェアは防げません。セキュアブートの説明ではありません。誤り。
example: |
  ライブ会場の入場で、出演者やスタッフ一人ひとりの「公式の通行証（デジタル署名）」を確認して、本物の通行証を持つ人だけを中に入れるのがセキュアブートです。会場の扉を開けた後に見回りをする（OS起動後のスキャン）より前の段階で、怪しい人の侵入を防ぎます。
review:
  - セキュアブート＝起動時にOS・ドライバのデジタル署名を検証し、正規のものだけを実行してOS起動前のマルウェアを防ぐ。
  - BIOSパスワード・ディスクパスワード（利用者の認証）、起動後のマルウェアスキャンとは区別する。
