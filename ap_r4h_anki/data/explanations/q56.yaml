q: 56
answer: エ
category: サービスマネジメント
theme: |
  ITサービス管理の手引きITILで、可用性管理の指標のうち「保守性」（故障から早く回復できる性質）を表すものを選ぶ問題です。
basics: |
  <b>ITIL</b>：ITサービスを管理するためのベストプラクティス（成功事例）を体系化したガイドです。
  <b>可用性管理</b>：ITサービスを、合意したレベルで使える状態に保つための管理です。ITILでは可用性に関係する性質を次のように分けています。
  - <b>信頼性</b>：サービスが中断せずに機能し続ける能力（故障しにくさ）。指標例：<b>平均故障間隔（MTBF）</b>、<b>平均サービス・インシデント間隔（MTBSI）</b>。
  - <b>保守性</b>：サービスが中断したときに、どれだけ速く元の状態に回復できるか（直しやすさ）。指標例：<b>平均サービス回復時間（MTRS）</b>。
  KPIとして「保守性を表す指標値の<b>短縮</b>」を挙げているので、短いほど良い「時間」の指標を探します。
reasoning: |
  1. 保守性は「中断してから回復するまでの速さ」なので、その指標は回復にかかる時間です。
  2. 「平均サービス回復時間（MTRS）」は、サービスが中断してから完全に回復するまでの平均時間で、これを短縮することが保守性の向上です。
  3. 正解は<b>エ</b>です。
choices:
  ア: 一定期間内での中断の数は、サービスがどれだけ止まりにくいか（信頼性・可用性）を表す指標です。回復の速さ（保守性）ではありません。誤り。
  イ: 平均故障間隔（MTBF）は、故障から次の故障までの平均時間で、<b>信頼性</b>の指標です。また、長いほど良い指標なので「短縮」はKPIになりません。誤り。
  ウ: 平均サービス・インシデント間隔（MTBSI）は、インシデント（中断）から次のインシデントまでの平均間隔で、<b>信頼性</b>の指標です。誤り。
  エ: 平均サービス回復時間（MTRS）は、中断から回復までの平均時間で、<b>保守性</b>の指標です。短縮するほど保守性が高いといえます。<b>正解</b>。
example: |
  路線バスで考えると、「1か月に何回運休したか」「運休と運休の間が平均何日空いているか」は止まりにくさ（信頼性）、「運休してから運行再開まで平均何時間かかったか」は直しやすさ（保守性）の指標です。
review:
  - 保守性の指標＝平均サービス回復時間（MTRS）。短縮するほど良い。
  - 信頼性の指標＝MTBF（平均故障間隔）、MTBSI（平均サービス・インシデント間隔）。長いほど良い。
