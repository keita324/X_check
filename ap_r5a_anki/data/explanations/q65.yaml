q: 65
answer: ア
category: システム企画
theme: |
  成果物が要求事項を満たしていることを確かめる検証手法（インスペクション、分析又はシミュレーション、デモンストレーション、テスト）のうち、「文書」を検査するものを選ぶ問題です。
basics: |
  JIS X 0166（要求エンジニアリング）では、成果物が要求事項を満たしているという客観的な証拠を得る検証手法として、次の4つを挙げています。
  - <b>インスペクション</b>：成果物となる<b>文書</b>（仕様書、設計書など）や、目視で確認できるものを<b>検査</b>し、要求事項への遵守度合いを確認する。
  - <b>分析又はシミュレーション</b>：モデルや計算、シミュレーションによって、要求事項を満たすかを確認する（実物で確かめるのが難しい場合など）。
  - <b>デモンストレーション</b>：実際にシステムを動かして見せ、機能が要求どおりに働くことを<b>実演</b>で確認する（主に定性的な確認）。
  - <b>テスト</b>：決められた条件でシステムを動作させ、結果を<b>測定・記録</b>して、要求事項を満たすことを確認する（定量的な確認）。
reasoning: |
  1. 問題は「成果物となる<b>文書</b>について、要件への遵守度合いを<b>検査</b>するもの」を問うています。
  2. 文書を検査する手法は<b>インスペクション</b>です。正解は<b>ア</b>です。
choices:
  ア: インスペクションは、成果物となる文書などを検査して、要件への遵守度合いを確認する手法です。<b>正解</b>。
  イ: テストは、システムを実際に動作させ、その結果を測定・記録して要件を満たすか確認する手法で、文書の検査ではありません。誤り。
  ウ: デモンストレーションは、システムを動かして機能を実演して見せる手法で、文書の検査ではありません。誤り。
  エ: 分析又はシミュレーションは、モデルや計算によって要件を満たすかを確認する手法で、文書の検査ではありません。誤り。
example: |
  家を建てるときに例えると、図面や仕様書が施主の要望どおりかを読み合わせてチェックするのがインスペクション、構造計算で地震に耐えられるかを確かめるのが分析・シミュレーション、完成した家でドアや窓の動きを見せるのがデモンストレーション、断熱性能を測定器で測るのがテストです。
review:
  - インスペクション＝成果物の文書などを検査して要件への遵守度合いを確認する検証手法。
  - 分析・シミュレーション（モデル・計算）、デモンストレーション（実演）、テスト（動作させて測定）と区別する。
