q: 42
answer: イ
category: セキュリティ
theme: |
  DNSサーバに偽の情報を覚え込ませる「DNSキャッシュポイズニング攻撃」に対して有効な対策を選ぶ問題です。攻撃者に「本物の応答」と見分けられないような偽の応答を作らせない工夫がポイントです。
basics: |
  <b>DNSキャッシュサーバ</b>：利用者の代わりにドメイン名をIPアドレスに変換し、その結果を一定時間<b>キャッシュ</b>（記憶）しておくサーバです。
  <b>DNSキャッシュポイズニング</b>：キャッシュサーバが権威DNSサーバに問い合わせている間に、攻撃者が<b>偽の応答</b>を先に送り込み、偽のIPアドレスをキャッシュさせる攻撃です。以後、利用者は偽サイトに誘導されてしまいます。
  キャッシュサーバは、応答が本物かを主に次の2つが問合せと一致するかで判断します。
  | DNSヘッダー内の<b>ID</b>（16ビット）
  | 問合せに使った<b>送信元ポート番号</b>
  これらが<b>推測しやすい</b>と、攻撃者は一致する偽の応答を簡単に作れてしまいます。そこで、<b>IDや送信元ポート番号をランダムに変える</b>ことで、偽の応答を当てにくくします。
reasoning: |
  1. DNS問合せのIDを固定せずランダムに変えれば、攻撃者は正しいIDを推測しにくくなり、偽の応答が受け入れられにくくなります。
  2. 正解は<b>イ</b>です。
  3. 逆に、ウのように送信元ポート番号を53番に固定すると、推測しやすくなって危険です（送信元ポート番号のランダム化も重要な対策）。
choices:
  ア: マルウェアのリアルタイム隔離は、DNSサーバのマルウェア対策で、外部から偽の応答を送り込むキャッシュポイズニングへの対策にはなりません。誤り。
  イ: DNS問合せのIDを固定せずにランダムに変更すれば、攻撃者がIDを推測しにくくなり、偽の応答を受け入れる可能性を下げられます。<b>正解</b>。
  ウ: 送信元ポート番号を53番に固定すると、攻撃者が推測しやすくなり、かえって攻撃が成功しやすくなります。対策としては、送信元ポート番号をランダムにします。誤り。
  エ: 宛先ポート番号53の問合せだけに応答するのはDNSとして通常の動作で、キャッシュポイズニングへの対策になりません（外部からの問合せ自体を制限する方が有効です）。誤り。
example: |
  合言葉で本人確認をするとき、合言葉が毎回「山」と「川」に決まっていると、他人でも簡単に答えられます。毎回ランダムな合言葉にすれば、なりすましは難しくなります。DNSのIDや送信元ポート番号のランダム化は、この「毎回違う合言葉」にあたります。
review:
  - キャッシュポイズニング対策：DNS問合せのIDと送信元ポート番号をランダム化し、偽の応答を推測しにくくする。DNSSECの導入も有効。
  - 送信元ポートの固定は逆効果。外部からの再帰問合せの制限なども合わせて行う。
