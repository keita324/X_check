q: 72
answer: イ
category: ビジネスインダストリ
theme: |
  インターネットを通じて単発の仕事を個人が請け負う働き方と、それによる経済の形を何と呼ぶかを問う用語問題です。
basics: |
  - <b>ギグエコノミー</b>：ギグ（gig）は、ミュージシャンが1回限りで行う演奏を指す言葉です。個人が、インターネット上のプラットフォーム（仲介サービス）を通じて、<b>単発の仕事</b>を請け負う働き方や、それによって成り立つ経済の形を指します。例：料理の配達、短期のデザインやプログラミングの仕事、家事代行など。
  - <b>APIエコノミー</b>：企業が自社のサービスをAPIとして公開し、他社のサービスと連携させることで生まれる経済圏。
  - <b>シャドーエコノミー</b>：税金の申告や公的な統計に表れない、非公式な経済活動（地下経済）。
  - <b>トークンエコノミー</b>：ブロックチェーン上のトークン（デジタル上の代用通貨）を使って、価値をやり取りする経済の仕組み。
reasoning: |
  1. 問題文のキーワードは「個人が」「インターネットを介して」「単発の仕事を受託」です。
  2. これは<b>ギグエコノミー</b>です。正解は<b>イ</b>です。
choices:
  ア: APIエコノミーは、APIを公開・利用して企業の枠を越えてサービスがつながることで生まれる経済圏のことで、個人の働き方を表すものではありません。誤り。
  イ: 個人がインターネットを介して単発の仕事を受託する働き方や、それによって形成される経済形態は<b>ギグエコノミー</b>です。<b>正解</b>。
  ウ: シャドーエコノミーは、公的な統計や課税の対象にならない非公式な経済活動のことです。誤り。
  エ: トークンエコノミーは、暗号資産などのトークンを使って価値を流通させる経済の仕組みです。誤り。
example: |
  空いている時間に、スマホのアプリで料理の配達を1件ずつ引き受けたり、クラウドソーシングサイトでロゴデザインの依頼を1件だけ受けたりする働き方がギグエコノミーです。会社に雇われるのではなく、仕事ごとに契約します。
review:
  - ギグエコノミー＝個人がネットのプラットフォームを通じて単発の仕事を請け負う働き方・経済形態。
  - APIエコノミー（API連携の経済圏）、シャドーエコノミー（非公式経済）、トークンエコノミー（トークンによる価値流通）と区別する。
