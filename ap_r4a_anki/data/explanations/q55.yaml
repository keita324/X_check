q: 55
answer: イ
theme: |
  ITサービスマネジメントの「問題管理」の目的を、インシデント管理・サービス継続管理・変更管理と区別する問題です。
basics: |
  <b>ITサービスマネジメント</b>：ITサービス（社内システム、Webサービスなど）を安定して提供するための管理の仕組みです（ITILやJIS Q 20000で体系化）。
  <b>インシデント</b>：サービスの中断や品質低下（例：「メールが送れない」）。
  <b>問題</b>：1つ以上のインシデントの<b>根本原因</b>（例：メールサーバの設定ミス）。

  - <b>インシデント管理</b>：とにかく<b>早くサービスを元に戻す</b>（暫定対応でもよい）。
  - <b>問題管理</b>：インシデントの<b>根本原因を突き止め</b>、恒久的な対策で<b>発生や再発を防ぐ</b>。
  - <b>サービス継続管理</b>：災害などの重大事態でも、合意したレベルでサービスを継続できるようにする。
  - <b>変更管理</b>：システムの変更を、影響とリスクを評価した上で、安全に実施・レビューする。
reasoning: |
  1. 問題管理のキーワードは「根本原因の特定」と「再発防止」です。
  2. 「インシデントの未知の根本原因を特定し、インシデントの発生又は再発を防ぐ」という<b>イ</b>がこれに当たります。
  3. アはインシデント管理、ウはサービス継続管理、エは変更管理の目的です。
choices:
  ア: インシデントを、合意したサービスレベル目標の時間内に解決する（早く復旧する）のは<b>インシデント管理</b>の目的です。誤り。
  イ: インシデントの未知の根本原因を特定し、発生又は再発を防ぐのは<b>問題管理</b>の目的です。<b>正解</b>。
  ウ: 合意した目標の中で、サービス継続のコミットメント（約束）を果たすのは<b>サービス継続管理</b>の目的です。誤り。
  エ: 変更の影響を評価し、リスクを最小にして実施し、レビューするのは<b>変更管理</b>の目的です。誤り。
example: |
  水道管から水漏れしたとき、とりあえずバケツを置いて床を拭く（早く元に戻す）のがインシデント管理です。その後、なぜ漏れたのかを調べて、劣化した管を交換し、二度と漏れないようにする（根本原因の除去）のが問題管理です。
review:
  - インシデント管理＝早期復旧、問題管理＝根本原因の特定と再発防止。この違いを必ず区別する。
  - サービス継続管理（災害時の継続）、変更管理（変更の評価・実施・レビュー）の目的も一言で言えるようにする。
