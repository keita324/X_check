q: 56
answer: イ
category: サービスマネジメント
theme: |
  サービスマネジメントの規格JIS Q 20000-1で、サービスレベル目標に照らしたパフォーマンスのレビューを「いつ」行うと規定しているかを問う問題です。
basics: |
  <b>SLA（サービスレベル合意書）</b>：サービスの提供者と顧客の間で、サービスの内容と品質の目標（<b>サービスレベル目標</b>：例「稼働率99.9%以上」「問合せに1時間以内に回答」）を合意した文書です。
  <b>パフォーマンスの監視とレビュー</b>：実際のサービスが目標を満たしているかを測定し（監視）、評価して（レビュー）、顧客に報告します。

  <b>JIS Q 20000-1の考え方</b>：マネジメントシステムの規格では、監視・レビュー・内部監査・マネジメントレビューなどを、<b>あらかじめ定めた間隔で</b>（計画的・定期的に）実施することを求めるのが基本です。問題が起きたときだけ行うのでは、改善の機会を逃してしまうからです。
reasoning: |
  1. JIS Q 20000-1では、組織は、サービスレベル目標に照らしたパフォーマンスを、<b>あらかじめ定めた間隔で</b>監視し、レビューし、報告しなければならない、と規定しています。
  2. 正解は<b>イ</b>です。
choices:
  ア: SLAに大きな変更があったときだけに実施するのでは、日々のサービスの状況を定期的に確認できません。規格はあらかじめ定めた間隔での実施を求めています。誤り。
  イ: パフォーマンスのレビューは、あらかじめ定めた間隔で（定期的に）実施すると規定されています。<b>正解</b>。
  ウ: 間隔を定めず必要に応じて実施するのでは、計画的な管理になりません。誤り。
  エ: サービス目標の未達成が続いたときだけに実施するのでは、問題が大きくなってからの対応になってしまいます。誤り。
example: |
  健康診断に例えると、「体調が悪くなったときだけ」「病気が続いたときだけ」受けるのではなく、「毎年4月」のように時期を決めて定期的に受けることで、異常の兆しを早く見つけられます。サービスのレビューも、決めた間隔で定期的に行うのが基本です。
review:
  - JIS Q 20000-1では、サービスレベル目標に照らしたパフォーマンスの監視・レビュー・報告を「あらかじめ定めた間隔で」行う。
  - マネジメントシステム規格の監視・レビュー・監査は、問題発生時だけでなく計画的・定期的に行うのが原則。
