q: 32
answer: イ
category: ネットワーク
theme: |
  NAPT（IPマスカレード）を使うルータで、インターネット上のWebサーバからPCに返ってくる<b>応答</b>パケットのうち、どのヘッダー情報が書き換えられるかを問う問題です。
basics: |
  <b>プライベートIPアドレス</b>：社内や家庭のLANの中だけで使うアドレス（192.168.x.x など）。インターネットでは使えません。
  <b>NAPT（IPマスカレード）</b>：ルータが、内部のPCの「プライベートIPアドレス＋ポート番号」を、ルータの「グローバルIPアドレス＋ポート番号」に変換して通信させる仕組みです。ルータは変換の対応表を覚えておきます。
  | 行き（PC→サーバ）：<b>送信元</b>IPアドレスと<b>送信元</b>ポート番号を、ルータのものに書き換える
  | 帰り（サーバ→PC）：<b>宛先</b>IPアドレスと<b>宛先</b>ポート番号を、対応表を見て元のPCのものに書き換える
  サーバ側（帰りの送信元）のIPアドレスとポート番号は書き換えません。
reasoning: |
  1. Webサーバからの応答パケットの宛先は、ルータのグローバルIPアドレスと、ルータが割り当てたポート番号になっています。
  2. ルータは対応表を見て、これを内部のPCのプライベートIPアドレスと元のポート番号に書き換えて転送します。
  3. つまり、書き換えられるのは<b>宛先IPアドレスと宛先ポート番号</b>です。正解は<b>イ</b>です。
choices:
  ア: 送信元IPアドレス（Webサーバのアドレス）は書き換えません。また、NAPTではポート番号も変換されるので、宛先ポート番号も書き換わります。誤り。
  イ: 応答パケットの宛先IPアドレスと宛先ポート番号を、PCのプライベートIPアドレスと元のポート番号に書き換えます。<b>正解</b>。
  ウ: 送信元IPアドレスと送信元ポート番号を書き換えるのは、PCからサーバへの<b>行き</b>のパケットの場合です。応答パケットではありません。誤り。
  エ: 送信元ポート番号（Webサーバのポート番号）は書き換えません。また、宛先IPアドレスも書き換える必要があります。誤り。
example: |
  マンションの受付（ルータ）で、住人が出す手紙の差出人を「〇〇マンション 受付 12番」と書き換え、どの部屋の手紙かを控えておきます。返事が「〇〇マンション 受付 12番」宛てに届いたら、受付は控えを見て「305号室」に宛先を書き換えて届けます。差出人（相手の住所）はそのままです。
review:
  - NAPTの行き（PC→外部）は送信元IP・送信元ポートを、帰り（外部→PC）は宛先IP・宛先ポートを書き換える。
  - NAPTはIPアドレスだけでなくポート番号も変換するので、複数のPCが1つのグローバルIPアドレスを共有できる。
