q: 46
answer: ア
category: セキュリティ
theme: |
  「エクスプロイトコード」が何かを、マルウェア定義ファイル（シグネチャ）・メッセージ認証コード（MAC）・ワンタイムパスワードと区別する問題です。
basics: |
  <b>エクスプロイト（exploit）</b>：「（弱点を）利用する、つけ込む」という意味です。
  <b>エクスプロイトコード</b>：ソフトウェアの<b>脆弱性を悪用する</b>ために作られたプログラム（<b>攻撃コード</b>）です。攻撃者に使われれば攻撃の道具になりますが、セキュリティ担当者が、自社のシステムに本当にその脆弱性があるか、修正プログラムが効いているかを<b>検証</b>するために使うこともあります。

  紛らわしい用語
  - <b>マルウェア定義ファイル（シグネチャ、パターンファイル）</b>：マルウェアを見分けるための特徴的なコードを集めたもので、マルウェア対策ソフトの検知に使う。
  - <b>MAC（メッセージ認証コード）</b>：メッセージと秘密の鍵（シークレットデータ）から計算する値で、メッセージの改ざん検知に使う（HMACなど）。
  - <b>ワンタイムパスワード</b>：ログインのたびに変わる認証コードで、盗まれても再利用できない。
reasoning: |
  1. エクスプロイトコードは「攻撃コードとも呼ばれ、ソフトウェアの脆弱性を悪用するコード」で、脆弱性の検証に使われることもあります。
  2. 正解は<b>ア</b>です。
choices:
  ア: 攻撃コードとも呼ばれ、ソフトウェアの脆弱性を悪用するコードであり、使い方によっては脆弱性の検証にも役立つのは、<b>エクスプロイトコード</b>です。<b>正解</b>。
  イ: マルウェアを特定するための特徴的なコードで、マルウェア対策ソフトの検知に使われるのは、<b>マルウェア定義ファイル（シグネチャ）</b>です。誤り。
  ウ: メッセージとシークレットデータから計算され、改ざん検知に用いられるのは、<b>メッセージ認証コード（MAC）</b>です。誤り。
  エ: ログインのたびに変化し、不正に取得しても再利用できない認証コードは、<b>ワンタイムパスワード</b>です。誤り。
example: |
  錠前の欠陥（脆弱性）を突いて開けてしまう特殊な道具がエクスプロイトコードです。泥棒が使えば犯罪の道具ですが、錠前メーカーや防犯の専門家が「本当にこの欠陥で開くのか」「修理後は開かなくなったか」を確かめるためにも使われます。
review:
  - エクスプロイトコード＝脆弱性を悪用する攻撃コード。脆弱性の検証に使われることもある。
  - マルウェア定義ファイル（検知用の特徴）、MAC（改ざん検知）、ワンタイムパスワード（使い捨て認証コード）と区別する。
