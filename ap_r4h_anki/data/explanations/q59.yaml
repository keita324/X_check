q: 59
answer: イ
category: システム監査
theme: |
  システム監査で作成する記録「監査調書」の役割と取扱いについて、正しい記述を選ぶ問題です。
basics: |
  <b>監査調書</b>：システム監査人が、監査の過程で実施した手続、入手した監査証拠、その評価、そして<b>監査人の判断や所見</b>などを記録した文書です。
  監査調書の主な役割
  - 監査の結論（監査報告書の内容）を支える<b>合理的な根拠</b>となる。
  - 何をどう調べたかを記録することで、監査の<b>客観性</b>を確保し、後から検証できるようにする。
  取扱いのポイント
  - 監査対象の機密情報を含むので、<b>機密を保持</b>して適切に管理する（むやみに公開しない）。
  - 紛失・破損に備えて、電子媒体ならバックアップを取るなど、<b>適切に保存</b>する。
reasoning: |
  1. 監査調書は、監査報告書に書いた結論が「なぜそう言えるのか」を裏付ける証拠の記録です。
  2. 「監査実施内容の客観性を確保し、監査の結論を支える合理的な根拠とする」という<b>イ</b>が、監査調書の役割を正しく述べています。
choices:
  ア: 監査調書には監査対象の機密情報が含まれるため、全社に公開すべきではありません。機密を保持して適切に管理します。誤り。
  イ: 監査調書の役割として、監査実施内容の客観性の確保と、監査の結論を支える合理的な根拠とすることが挙げられます。<b>正解</b>。
  ウ: 監査調書は監査の結論の根拠となる重要な記録なので、紛失や破損に備えてバックアップを取り、安全に保管すべきです。「バックアップを作成すべきでない」は誤り。
  エ: 監査調書には、入手した事実だけでなく、それを評価した<b>監査担当者の所見</b>（判断や意見）も記録します。誤り。
example: |
  理科の実験レポートに例えると、監査報告書が「結論」、監査調書が「実験ノート」です。何を使い、どんな手順で、どんな結果が出て、自分はそれをどう考えたか（所見）を記録しておくから、結論に説得力が生まれ、後から誰でも確かめられます。
review:
  - 監査調書＝監査の客観性を確保し、監査結論を支える合理的な根拠となる記録。監査人の所見も記載する。
  - 機密を保持して管理し（全社公開しない）、バックアップなどで適切に保存する。
