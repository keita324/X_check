q: 75
answer: イ
category: 業務分析・データ利活用
theme: |
  ゲーム理論の「ナッシュ均衡」を、2社の戦略と市場シェアの表（利得表）から見つける問題です。
basics: |
  <b>ゲーム理論</b>：複数のプレイヤーが、互いの行動を考えながら意思決定する状況を分析する理論です。
  <b>ナッシュ均衡</b>：どのプレイヤーも、<b>相手が戦略を変えない限り、自分だけ戦略を変えても得をしない</b>組合せです。互いに「相手の戦略に対する最適な応答」になっている状態です。
  見つけ方
  - 相手の各戦略に対して、自分の最適な戦略に印を付ける。
  - A社・B社の両方の印が付いたマスがナッシュ均衡です。
  表の各欄は「A社のシェア、B社のシェア」の順です。
reasoning: |
  <b>① A社の最適な応答</b>（B社の戦略ごとに、A社のシェアを比べる）
  | B社がb1のとき：a1＝40、a2＝30 → <b>a1</b>
  | B社がb2のとき：a1＝50、a2＝25 → <b>a1</b>
  <b>② B社の最適な応答</b>（A社の戦略ごとに、B社のシェアを比べる）
  | A社がa1のとき：b1＝20、b2＝30 → <b>b2</b>
  | A社がa2のとき：b1＝10、b2＝25 → <b>b2</b>
  <b>③ 両方が最適になっている組合せ</b>
  | (a1, b2)：A社はa1が最適、B社もb2が最適 → <b>ナッシュ均衡</b>
  正解は<b>イ</b>です。
choices:
  ア: (a1, b1)では、B社はb2に変えるとシェアが20%から30%に増えるので、B社にとって最適ではありません。誤り。
  イ: (a1, b2)では、A社はa2に変えると50%→25%に下がり、B社はb1に変えると30%→20%に下がるため、どちらも戦略を変える理由がありません。<b>ナッシュ均衡</b>です。<b>正解</b>。
  ウ: (a2, b1)では、A社はa1に変えると30%→40%に、B社はb2に変えると10%→25%に増えるため、均衡ではありません。誤り。
  エ: (a2, b2)では、A社はa1に変えるとシェアが25%から50%に増えるので、均衡ではありません。誤り。
example: |
  向かい合う2軒のパン屋が「値下げする・しない」を決める場面で、相手がどちらを選んでも自分は「値下げしない」方が得、相手も同様なら、両店とも「しない」で落ち着きます。どちらも自分だけ変えても得をしない、この落ち着いた状態がナッシュ均衡です。
review:
  - ナッシュ均衡＝相手の戦略を固定したとき、どちらも自分だけ戦略を変えても得をしない組合せ。
  - 相手の戦略ごとに自分の最適応答に印を付け、両者の印が重なるマスを探す。
