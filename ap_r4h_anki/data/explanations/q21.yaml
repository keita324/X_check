q: 21
answer: ウ
category: ハードウェア
theme: |
  画面の各画素（ピクセル）がメモリのどの番地に割り当てられているかを、座標と1画素あたりのビット数から計算する問題です。
basics: |
  <b>画素（ピクセル）</b>：画面を構成する小さな点です。640×480の画面は、横640個×縦480個の画素でできています。座標(x, y)は「左からx番目、上からy番目」（どちらも0から数える）です。
  <b>メモリの番地（アドレス）</b>：図より、メモリは<b>1番地＝8ビット（1バイト）</b>です。1画素は16ビットなので、<b>1画素で2番地分</b>を使います。

  <b>割当ての順番</b>（問題の方式）：(0,0)から始めて x方向に (1,0)、(2,0)…(639,0) と並べ、次の行 (0,1) へ進みます。つまり、1行には640画素並んでいます。
  | 画素の通し番号 ＝ y × 640 ＋ x
  | 先頭アドレス ＝ 通し番号 × 2（1画素2番地）
reasoning: |
  1. 始点(5, 4)から終点(9, 8)への直線は、xが1増えるとyも1増える斜めの線です（図の黒丸）。
  | (5,4) → (6,5) → (7,6) → (8,7) → (9,8)
  よって、x＝7 の画素は <b>(7, 6)</b> です。
  2. (7, 6)の前に並んでいる画素の数（通し番号）を求めます。
  | y＝0〜5 の6行分：6 × 640 ＝ 3,840画素
  | y＝6 の行の x＝0〜6 の7画素：7画素
  | 通し番号 ＝ 3,840 ＋ 7 ＝ 3,847
  3. 1画素は2番地分なので、先頭アドレスは
  | 3,847 × 2 ＝ <b>7,694番地</b>
  4. 確認：(0,0)は0〜1番地、(1,0)は2〜3番地（図と一致）。正解は<b>ウ</b>です。
choices:
  ア: 3847は画素の通し番号です。1画素が16ビット＝2番地分であることを考慮し、2倍する必要があります。誤り。
  イ: 7680は 6×640×2 で、y＝6の行の先頭（x＝0）の画素のアドレスです。x＝7の分（7×2＝14番地）を足し忘れています。誤り。
  ウ: 7694。(7, 6)の画素の先頭アドレスで、計算結果と一致します。<b>正解</b>。
  エ: 8978は (7×640＋9)×2 で、座標(9, 7)の画素のアドレスにあたります。x＝7 の画素ではありません。誤り。
example: |
  1行640席の大きな劇場で、前から7列目（y＝6）の左から8番目（x＝7）の席は、前の6列分（3,840席）＋7席で、3,848番目の席（通し番号3,847）です。1席に2枚のチケット（2番地）を割り当てているなら、その席のチケット番号は 3,847×2＝7,694 から始まります。
review:
  - 画素のアドレス＝(y×横の画素数＋x)×1画素のバイト数。行（y）が先、列（x）が後。
  - 1画素16ビット＝2バイト＝2番地（1番地8ビット）なので2倍するのを忘れない。
  - 直線の式（xが1増えるとyも1増える）から、x＝7のときy＝6を求める。
