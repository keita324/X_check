q: 68
answer: ウ
category: 経営戦略マネジメント
theme: |
  顧客から許可（同意）を得てから、その範囲を少しずつ広げながら宣伝を行う「パーミッションマーケティング」を、他のマーケティング手法と区別する問題です。
basics: |
  - <b>パーミッションマーケティング</b>：パーミッション（permission）＝許可。顧客から「情報を受け取ってもよい」という<b>同意を得た上で</b>プロモーション（宣伝）を行う手法。最初はメールマガジンの購読など小さな同意から始め、信頼関係を築きながら、同意の範囲を<b>段階的に広げて</b>いく（例：好みのアンケートに答えてもらい、個別のおすすめを送るなど）。一方的に送りつける広告より、受け入れられやすいのが特徴。
  - <b>アフィリエイトマーケティング</b>：ブログなどに広告主の商品へのリンクを載せ、そこから商品が売れると、サイトの運営者に報酬が支払われる成果報酬型の広告手法。
  - <b>差別型マーケティング</b>：市場をいくつかのセグメントに分け、それぞれに異なる製品やマーケティングを展開する手法。
  - <b>バイラルマーケティング</b>：口コミが人から人へウイルスのように広がる効果を狙う手法。
reasoning: |
  1. 問題文のキーワードは「顧客から得る同意の範囲を段階的に広げながら、プロモーションを行う」です。
  2. これは<b>パーミッションマーケティング</b>の特徴です。正解は<b>ウ</b>です。
choices:
  ア: アフィリエイトマーケティングは、提携サイトに掲載した広告経由の成果に応じて報酬を払う広告手法で、顧客の同意を段階的に広げる手法ではありません。誤り。
  イ: 差別型マーケティングは、市場の各セグメントに合わせて異なる製品やマーケティングを行う手法です。誤り。
  ウ: 顧客から得る同意の範囲を段階的に広げながらプロモーションを行うのは、<b>パーミッションマーケティング</b>です。<b>正解</b>。
  エ: バイラルマーケティングは、口コミによる爆発的な拡散を狙う手法です。誤り。
example: |
  お店の会員登録で「メールでお得な情報を受け取りますか？」にチェックしてもらい（最初の同意）、次に「好きなジャンルを教えてください」と聞いて、好みに合ったおすすめを送る（同意の範囲を広げる）、という進め方がパーミッションマーケティングです。
review:
  - パーミッションマーケティング＝顧客の同意を得てプロモーションを行い、同意の範囲を段階的に広げる。
  - アフィリエイト（成果報酬型広告）、差別型（セグメント別に展開）、バイラル（口コミの拡散）と区別する。
