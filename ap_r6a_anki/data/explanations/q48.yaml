q: 48
answer: イ
category: システム開発技術
theme: |
  ソフトウェアの品質特性のうち「使用性」（使いやすさ）を評価する指標の目標として適切なものを、回復性・保守性・機能適合性の目標と区別する問題です。
basics: |
  ソフトウェアの品質は、いくつかの特性（品質特性）に分けて評価します（JIS X 25010など）。
  - <b>使用性</b>：利用者が<b>分かりやすく、習得しやすく、使いやすい</b>か。例：操作方法を習得するまでの時間、誤操作の少なさ。
  - <b>信頼性（回復性）</b>：障害が起きても、どれだけ早く使える状態に戻せるか。
  - <b>保守性</b>：改善や修正をどれだけ容易・迅速に行えるか。
  - <b>機能適合性</b>：利用者が必要とする機能が、どれだけそろっているか。
reasoning: |
  各目標がどの品質特性の指標かを判断します。
  1. ア：障害発生から1時間以内に使えるようにする → 障害からの回復＝<b>信頼性（回復性）</b>。
  2. イ：使用方法を1時間以内に習得できる → 覚えやすさ＝<b>使用性</b>。
  3. ウ：要望のある機能の改善を1週間以内に完了する → 修正のしやすさ＝<b>保守性</b>。
  4. エ：使用したい機能が100%提供されている → 機能のそろい具合＝<b>機能適合性</b>。
  5. 使用性の目標設定は<b>イ</b>です。
choices:
  ア: 障害発生から1時間以内に使用できるようにする目標は、障害からの回復の速さで、<b>信頼性（回復性）</b>の指標です。誤り。
  イ: 使用方法を利用者が1時間以内に習得できるという目標は、習得のしやすさで、<b>使用性</b>の指標です。<b>正解</b>。
  ウ: 要望のある機能の改善を1週間以内に完了するという目標は、修正のしやすさで、<b>保守性</b>の指標です。誤り。
  エ: 使用したい機能が100%提供されているという目標は、機能のそろい具合で、<b>機能適合性</b>の指標です。誤り。
example: |
  新しいレジシステムで、「新人アルバイトが1時間の練習で操作を覚えられる」は使用性、「故障しても1時間で復旧できる」は信頼性、「メニュー追加の要望に1週間で対応できる」は保守性、「必要な会計機能が全部そろっている」は機能適合性の目標です。
review:
  - 使用性＝習得のしやすさ・使いやすさ（例：操作を1時間以内に習得できる）。
  - 信頼性（障害からの回復）、保守性（改善・修正の容易さ）、機能適合性（必要な機能の充足度）と区別する。
