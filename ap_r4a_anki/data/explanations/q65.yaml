q: 65
answer: エ
theme: |
  リスク管理の用語「コンティンジェンシープラン（緊急時対応計画）」の意味を、リスクを減らす事前対策と区別する問題です。
basics: |
  <b>リスク</b>：まだ起きていないが、起きるかもしれない好ましくない事象です。例：外注先の部品調達が遅れて、製造が止まる。
  リスクへの備えには、2種類あります。
  - <b>予防策（事前の対策）</b>：リスクが<b>起きる前に</b>、発生確率や影響を下げる対策。例：実績のある外注先を選ぶ、品質確認の契約を結ぶ、複数社を比較して選ぶ。
  - <b>コンティンジェンシープラン（緊急時対応計画）</b>：リスクが<b>実際に起きてしまったとき（顕在化したとき）</b>に、どう対処するかを前もって決めておく計画。例：調達が止まったら代替の調達先に切り替える。
reasoning: |
  1. コンティンジェンシー（contingency）＝「万一の事態」。コンティンジェンシープランは、リスクが顕在化した<b>後</b>の対処計画です。
  2. 「部品調達のリスクが顕在化したときに備えて、対処するための計画を策定する」という<b>エ</b>がこれに当たります。
  3. ア・イ・ウは、いずれもリスクが起きる<b>前</b>に発生確率を下げる予防策です。
choices:
  ア: 実績のある外注先を使ってリスクの発生確率を下げるのは、事前のリスク低減策です。リスクが起きたときの対処計画ではないので誤り。
  イ: 製造品質を確認できるよう委託先と契約するのは、品質リスクを事前に抑える予防策です。誤り。
  ウ: 複数社の見積りを比較して委託先を選ぶのは、委託先選定の手続（事前の対策）です。誤り。
  エ: 部品調達のリスクが顕在化したときに備えて、対処の計画を策定する。<b>コンティンジェンシープラン</b>の説明です。<b>正解</b>。
example: |
  遠足の計画で、「天気予報を確認して晴れの日を選ぶ」のは予防策、「もし雨が降ったら体育館でレクリエーションをする」と決めておくのがコンティンジェンシープラン（雨天時の計画）です。
review:
  - コンティンジェンシープラン＝リスクが顕在化した「後」の対処方法を事前に決めた計画。
  - 発生確率を下げる対策（実績ある委託先の選定、品質契約、相見積り）は予防策で、コンティンジェンシープランではない。
