q: 39
answer: ウ
category: セキュリティ
theme: |
  政府機関がクラウドサービスを安全に調達するための制度「ISMAP（イスマップ）」が何かを、プライバシーマーク制度やISMSクラウドセキュリティ認証などと区別する問題です。
basics: |
  <b>クラウドサービス</b>：インターネット経由で提供されるサーバやソフトウェアのサービスです。政府機関も業務でクラウドを使うようになり、そのセキュリティの確保が課題になりました。

  <b>ISMAP（Information system Security Management and Assessment Program：政府情報システムのためのセキュリティ評価制度）</b>：政府が求めるセキュリティ要求を満たしているクラウドサービスを<b>あらかじめ評価・登録</b>しておく制度です。各府省庁は、原則としてこのリストに登録されたクラウドサービスから調達することで、一定のセキュリティ水準を確保します。

  関連する制度
  - <b>プライバシーマーク制度</b>：個人情報を適切に取り扱う体制を整えた事業者に、マークの使用を認める制度。
  - <b>ISMSクラウドセキュリティ認証</b>：ISMS（JIS Q 27001）に、クラウドサービス向けの管理策（ISO/IEC 27017）を追加した基準で、組織を認証する制度。
reasoning: |
  1. ISMAPのポイントは「政府が求めるセキュリティ要求」「クラウドサービスをあらかじめ評価・登録」「政府のクラウドサービス調達」です。
  2. これをすべて述べているのは<b>ウ</b>です。
choices:
  ア: 個人情報の取扱いについて保護措置の体制を整えた事業者を評価し、適合を示すマークを付与する制度は、<b>プライバシーマーク制度</b>に近い説明です。ISMAPはクラウドサービスを評価・登録する制度で、マークの付与や個人情報に限った制度ではありません。誤り。
  イ: 個人データの海外への移転に関する制度は、個人情報保護に関わる別の仕組みです。ISMAPはクラウドサービスのセキュリティを評価する制度で、個人データの海外移転を認める制度ではありません。誤り。
  ウ: 政府が求めるセキュリティ要求を満たしているクラウドサービスをあらかじめ評価・登録し、政府のクラウドサービス調達のセキュリティ水準を確保する制度は<b>ISMAP</b>です。<b>正解</b>。
  エ: ISMSにクラウドサービス向けの管理策を追加した国際規格を基準として管理体制を評価するのは、<b>ISMSクラウドセキュリティ認証</b>（ISO/IEC 27017）の説明です。誤り。
example: |
  学校で使う教材を、先生が毎回1つずつ安全性を調べるのは大変です。そこで、教育委員会が「安全基準を満たした教材リスト」を作っておき、先生はそのリストから選ぶ、という仕組みにするイメージです。ISMAPは、そのリストのクラウドサービス版で、政府機関が使うためのものです。
review:
  - ISMAP＝政府のセキュリティ要求を満たすクラウドサービスを事前に評価・登録し、政府調達で利用する制度。
  - プライバシーマーク（個人情報保護体制のマーク）、ISMSクラウドセキュリティ認証（ISO/IEC 27017）と区別する。
