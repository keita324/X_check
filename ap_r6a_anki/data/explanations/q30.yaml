q: 30
answer: イ
category: データベース
theme: |
  各学生の「最初の実施回」の成績を取り出すSQL文1と同じ結果を、ウィンドウ関数ROW_NUMBER()を使ったSQL文2で得るには、OVER句に何を書けばよいかを問う問題です。
basics: |
  <b>SQL文1の意味</b>：学生番号ごとに実施回の最小値（MIN＝初回）を求め、元の表とその初回で結合して、<b>各学生の初回の成績</b>（学生番号、実施回、得点）を取り出します。
  | 結果：S01の1回目(70)、S02の2回目(85)、S03の3回目(83)、S04の6回目(100)
  <b>ウィンドウ関数 ROW_NUMBER()</b>：行に連番（1, 2, 3…）を付ける関数です。OVER句で番号の付け方を指定します。
  - <b>PARTITION BY 列</b>：その列の値ごとにグループを分け、<b>グループごとに1から</b>番号を振り直す。
  - <b>ORDER BY 列</b>：グループ内で、その列の順に番号を付ける（ASCは小さい順、DESCは大きい順。省略時はASC）。
  SQL文2は、番号が1の行だけを取り出しているので、「各グループで並べたときの先頭の行」が結果になります。
reasoning: |
  1. SQL文1と同じ結果にするには、<b>学生番号ごと</b>に、<b>実施回の小さい順</b>に番号を付け、番号1（初回）の行を取り出せばよいです。
  2. よって a は「PARTITION BY 学生番号 ORDER BY 実施回」です。
  3. 確認：S03は実施回3,9,12の順に番号1,2,3 → 番号1は実施回3（得点83）。SQL文1の結果と一致します。
  4. 正解は<b>イ</b>です。
choices:
  ア: PARTITION BYがないので、表全体に1つの連番が付き、番号1になるのは表全体の先頭（S01の1回目）の1行だけです。各学生の初回は得られません。誤り。
  イ: 学生番号ごとにグループ分けし、実施回の小さい順に番号を付けるので、番号1は各学生の初回の行になり、SQL文1と同じ結果になります。<b>正解</b>。
  ウ: 得点の低い順に番号を付けるので、番号1は各学生の最低得点の行です。例えばS03では得点78（9回目）が選ばれ、初回（3回目）と異なります。誤り。
  エ: 得点の高い順に番号を付けるので、番号1は各学生の最高得点の行です。例えばS01では得点80（7回目）が選ばれ、初回（1回目）と異なります。誤り。
example: |
  クラスごと（PARTITION BY）に、出席番号順（ORDER BY）で並んでもらい、各クラスの先頭の人（番号1）だけ前に出てもらう、というイメージです。並ぶ順番を「身長順」に変えれば、各クラスで一番背の低い人が出てきます。
review:
  - ROW_NUMBER() OVER (PARTITION BY グループ列 ORDER BY 並び順) で、グループごとに1から番号を付ける。番号1で「各グループの先頭」を取り出せる。
  - 「各学生の初回」なら学生番号で分割し、実施回の昇順に並べる。並べる列（得点など）を間違えると別の行が選ばれる。
