q: 6
answer: ウ
category: アルゴリズムとプログラミング
theme: |
  整列の途中経過（状態0→状態1→状態2…）から、使われた整列アルゴリズムを見抜く問題です。
basics: |
  代表的な整列アルゴリズムと、途中経過の特徴
  - <b>バブルソート</b>：隣り合う2つを比べて、順序が逆なら交換する、を端から端まで繰り返す。1回（1パス）終わるごとに、<b>最大値が末尾に</b>（または最小値が先頭に）確定する。
  - <b>挿入ソート</b>：先頭から順に、整列済みの部分に次の要素を正しい位置へ差し込む。1回ごとに<b>先頭側の整列済み部分</b>が1つずつ伸びる。
  - <b>クイックソート</b>：基準値（ピボット）より小さいグループと大きいグループに分割することを繰り返す。
  - <b>ヒープソート</b>：データをヒープ（親が子より大きい木構造）に組み立て、最大値を取り出して末尾に置くことを繰り返す。途中の並びはヒープ構造の形になる。
reasoning: |
  隣どうしの比較・交換を左から行って、状態の変化を確かめます。
  <b>状態0 → 状態1</b>（3, 5, 9, 6, 1, 2）
  | 3と5、5と9：そのまま
  | 9と6：交換 → 3, 5, 6, 9, 1, 2
  | 9と1：交換 → 3, 5, 6, 1, 9, 2
  | 9と2：交換 → 3, 5, 6, 1, 2, <b>9</b>（状態1と一致）
  <b>状態1 → 状態2</b>
  | 3と5、5と6：そのまま
  | 6と1：交換、6と2：交換 → 3, 5, 1, 2, <b>6, 9</b>（状態2と一致）
  1回ごとに最大の値が末尾へ「泡のように浮かび上がって」確定しており、残りの要素の相対的な順序は変わっていません。これはバブルソートの特徴です。正解は<b>ウ</b>です。
choices:
  ア: クイックソートなら、基準値（例えば先頭の3）より小さい値と大きい値に分けられるので、状態1で 1, 2 が3より左に移るなどの変化が起きるはずです。状態1・2は分割の結果になっていません。誤り。
  イ: 挿入ソートなら、先頭側から整列済みの部分が伸びていきます。この例では末尾に9、次に6と、大きい値から末尾に確定しているので、挿入ソートの動きではありません。誤り。
  ウ: 隣どうしの比較・交換により、1回ごとに最大値が末尾に確定していく動きはバブルソートです。<b>正解</b>。
  エ: ヒープソートでは、まずデータをヒープの形（親が子より大きい並び）に組み替えるため、状態1のように元の順序をほぼ保ったまま最大値だけが末尾に移る動きにはなりません。誤り。
example: |
  水の中の泡が、軽いものから順に水面へ上がっていくイメージです。毎回、列の一番重い（大きい）値が隣と入れ替わりながら末尾まで運ばれていくので、末尾から順に大きい値が確定していきます。
review:
  - バブルソートは1パスごとに最大値が末尾に確定し、他の要素の相対順序はほぼ保たれる。途中経過を自分で1回分シミュレーションして確かめる。
  - 挿入ソート（先頭側が整列済みに）、クイックソート（基準値で分割）、ヒープソート（ヒープ構造を作る）の途中経過の特徴を区別する。
