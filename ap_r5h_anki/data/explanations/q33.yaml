q: 33
answer: ウ
category: ネットワーク
theme: |
  TCP/IPの通信データがイーサネットで送られるとき、各層のヘッダーがどの順番で並び、宛先情報（MACアドレス、IPアドレス、ポート番号）がどの順に送り出されるかを問う問題です。
basics: |
  <b>カプセル化</b>：データを送るとき、上の層から下の層へ順にヘッダー（宛先などの情報）を付け足していく仕組みです。
  | アプリケーションのデータ
  | → TCPヘッダー（<b>宛先ポート番号</b>）を付ける（トランスポート層）
  | → IPヘッダー（<b>宛先IPアドレス</b>）を付ける（ネットワーク層）
  | → イーサネットヘッダー（<b>宛先MACアドレス</b>）を付ける（データリンク層）
  後から付けたヘッダーほど<b>外側（先頭）</b>に来るので、イーサネットフレームの先頭から見ると
  | [イーサネットヘッダー][IPヘッダー][TCPヘッダー][データ]
  の順に並び、この順に送出されます。
reasoning: |
  1. イーサネットフレームの先頭はイーサネットヘッダーで、宛先MACアドレスが入っています。
  2. その次がIPヘッダー（宛先IPアドレス）、さらにその次がTCPヘッダー（宛先ポート番号）です。
  3. よって送出順序は「宛先MACアドレス → 宛先IPアドレス → 宛先ポート番号」です。
  4. 正解は<b>ウ</b>です。
choices:
  ア: 宛先IPアドレスが最初になっていますが、イーサネットフレームでは最も外側のイーサネットヘッダー（宛先MACアドレス）が先頭です。誤り。
  イ: IPアドレス→ポート番号→MACアドレスの順ですが、MACアドレスは先頭に来るので誤り。
  ウ: 宛先MACアドレス→宛先IPアドレス→宛先ポート番号。外側のヘッダーから順に送出される順序と一致します。<b>正解</b>。
  エ: ポート番号がIPアドレスより先になっていますが、TCPヘッダーはIPヘッダーの内側（後ろ）にあるので誤り。
example: |
  手紙を何重もの封筒に入れて送るイメージです。一番内側の封筒に「部署名（ポート番号）」、その外の封筒に「会社の住所（IPアドレス）」、一番外の封筒に「今回の配達先の郵便局（MACアドレス）」を書きます。届いた人は外側の封筒から順に開けていくので、読む順番は MAC → IP → ポート番号になります。
review:
  - カプセル化では下位層のヘッダーほど外側（先頭）。イーサネット→IP→TCP→データの順に並ぶ。
  - 宛先情報の順序：MACアドレス（データリンク層）→IPアドレス（ネットワーク層）→ポート番号（トランスポート層）。
