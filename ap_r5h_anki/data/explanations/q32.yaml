q: 32
answer: ウ
category: ネットワーク
theme: |
  速度の違う2つのLANで同じ数のパケットを送ったときの送信時間の差から、パケットの個数を逆算する計算問題です。
basics: |
  <b>伝送速度</b>：1秒間に送れるビット数です。
  | 100Mビット/秒 ＝ 1秒に 100×10<sup>6</sup> ＝ 10<sup>8</sup> ビット
  | 1Gビット/秒 ＝ 1秒に 10<sup>9</sup> ビット
  <b>送信時間</b>＝データ量（ビット）÷伝送速度。1バイト＝8ビットなので、バイトはビットに直してから計算します。
  <b>ミリ秒</b>：1ミリ秒＝1/1000秒＝10<sup>−3</sup>秒。

  この問題では、パケットとパケットの間に1ミリ秒の送信間隔があり、それも送信時間に含めます。ただし、送信間隔は<b>どちらのLANでも同じ</b>なので、2つのLANの差を取ると打ち消し合います。
reasoning: |
  <b>(1) 1パケットのデータ量</b>
  | 1,250バイト × 8 ＝ 10,000ビット ＝ 10<sup>4</sup>ビット
  <b>(2) 1パケットの送信時間</b>
  | 100Mビット/秒：10<sup>4</sup> ÷ 10<sup>8</sup> ＝ 10<sup>−4</sup>秒 ＝ 0.1ミリ秒
  | 1Gビット/秒：10<sup>4</sup> ÷ 10<sup>9</sup> ＝ 10<sup>−5</sup>秒 ＝ 0.01ミリ秒
  | 1パケットあたりの差：0.1 − 0.01 ＝ <b>0.09ミリ秒</b>
  <b>(3) 送信間隔</b>
  パケット間の送信間隔（1ミリ秒 ×（N−1）回）は、どちらのLANでも同じなので、差には影響しません。
  <b>(4) Nを求める</b>
  | 0.09ミリ秒 × N ＝ 9ミリ秒
  | N ＝ 9 ÷ 0.09 ＝ <b>100</b>
  正解は<b>ウ</b>です。
choices:
  ア: N＝10 なら、差は 0.09×10＝0.9ミリ秒で、9ミリ秒になりません。誤り。
  イ: N＝80 なら、差は 0.09×80＝7.2ミリ秒で、9ミリ秒になりません。誤り。
  ウ: N＝100 なら、差は 0.09×100＝9ミリ秒で、条件と一致します。<b>正解</b>。
  エ: N＝800 なら、差は 0.09×800＝72ミリ秒で、9ミリ秒になりません。誤り。
example: |
  同じ荷物100個を、速い車と遅い車で運ぶとします。1個あたりの運搬時間の差が0.09分なら、合計の差は 0.09×100＝9分です。荷物を積み替える休憩時間（送信間隔）が両方の車で同じなら、差には関係しません。
review:
  - 送信時間＝データ量（ビット）÷伝送速度。バイト×8＝ビットの換算と、M＝10<sup>6</sup>・G＝10<sup>9</sup>・ミリ＝10<sup>−3</sup> の単位に注意する。
  - 両方に共通する時間（送信間隔）は差を取ると消える。1パケットあたりの差×N＝全体の差 でNを求める。
