q: 68
answer: ウ
theme: |
  商品の価格の決め方のうち、「ターゲットリターン価格設定」の意味を、競争志向・需要志向などの価格設定と区別する問題です。
basics: |
  価格の決め方は、何を基準にするかで大きく3つに分かれます。
  - <b>コスト志向</b>：かかった費用（コスト）を基準に決める。
  　例：<b>ターゲットリターン価格設定</b>＝投資に対して<b>目標とする投資収益率（ROI）</b>を確保できるように価格を逆算して決める。コストプラス法（原価＋一定の利益）もこの仲間。
  - <b>競争志向</b>：競合他社の価格を基準に決める（実勢価格設定など）。
  - <b>需要志向</b>：顧客がいくらなら買うか（値頃感・知覚価値）を基準に決める。

  <b>投資収益率（ROI）</b>：投資額に対して、どれだけの利益が得られたかの割合。例：1億円投資して1,000万円の利益なら10%。
reasoning: |
  1. 「ターゲット（目標）」とする「リターン（投資からの収益）」が得られるように価格を決める、という名前のとおりです。
  2. 「目標とする投資収益率を実現するように価格を決定する」という<b>ウ</b>が正解です。
choices:
  ア: 競合の価格を十分に考慮して価格を決めるのは、<b>競争志向型</b>の価格設定（実勢価格設定など）です。誤り。
  イ: 顧客層、時間帯、場所など市場セグメントごとに異なる価格を付けるのは、<b>差別型価格設定（価格差別）</b>です。映画の学生割引や、ホテルの平日・休日料金などが例です。誤り。
  ウ: 目標とする投資収益率を実現するように価格を決めるのは、<b>ターゲットリターン価格設定</b>です。<b>正解</b>。
  エ: リサーチなどで調べた消費者の値頃感（このくらいなら買う、と感じる価格）に基づいて決めるのは、<b>需要志向型</b>の価格設定（知覚価値価格設定など）です。誤り。
example: |
  1,000万円かけて新しいパン工房を作り、「年に投資額の20%（200万円）の利益を出したい」と考えたとします。年間の販売数とコストの見込みから、「1個あたりいくらで売れば200万円の利益が出るか」を逆算して価格を決めるのが、ターゲットリターン価格設定です。
review:
  - ターゲットリターン価格設定＝目標の投資収益率（ROI）を実現できるように価格を決める（コスト志向）。
  - 競合基準＝競争志向、値頃感基準＝需要志向、セグメント別価格＝差別型価格設定、と区別する。
