q: 27
answer: ア
category: データベース
theme: |
  関係データベースで使うキーの種類（外部キー、代替キー、候補キー、スーパーキー）の定義を区別する問題です。
basics: |
  <b>関係（リレーション）</b>＝表、<b>タプル</b>＝行、<b>属性</b>＝列 のことです。
  - <b>スーパーキー</b>：タプル（行）を一意に識別できる属性、または属性の組を含む集合。余計な属性が含まれていてもよい。
  - <b>候補キー</b>：スーパーキーのうち<b>極小</b>のもの（1つでも属性を減らすと一意に識別できなくなるもの）。
  - <b>主キー</b>：候補キーの中から1つ選んだもの。
  - <b>代替キー</b>：主キーとして選ばれなかった候補キー（主キー以外で、行を一意に識別できるもの）。
  - <b>外部キー</b>：<b>他の関係（または同じ関係）の候補キー（通常は主キー）を参照する</b>属性、または属性の組。表と表を関連付けるのに使う。
  例：社員表 {社員番号, 氏名, 部門コード} の「部門コード」が、部門表の主キー「部門コード」を参照していれば、社員表の部門コードは外部キーです。
reasoning: |
  1. 外部キーは「ある関係の候補キー（主キー）を参照する属性」です。
  2. 「ある関係の候補キーを参照する属性、又は属性の組」という<b>ア</b>が正解です。
choices:
  ア: ある関係の候補キーを参照する属性、又は属性の組は<b>外部キー</b>です。<b>正解</b>。
  イ: 主キー以外で、タプルを一意に識別できる属性、又は属性の組は<b>代替キー</b>です。誤り。
  ウ: タプルを一意に識別できる属性、又は属性の組の集合のうち極小のものは<b>候補キー</b>です。誤り。
  エ: タプルを一意に識別できる属性、又は属性の組を含む集合は<b>スーパーキー</b>です。誤り。
example: |
  学校で考えると、生徒表では「学籍番号」が主キー、「メールアドレス」も一人ずつ違えば代替キーです。部活の名簿にある「学籍番号」は、生徒表の学籍番号を参照しているので外部キーです。外部キーをたどれば、部員の名前や学年を生徒表から引けます。
review:
  - 外部キー＝他の関係の候補キー（主キー）を参照する属性。表同士を関連付ける。
  - スーパーキー（一意に識別できる集合）→候補キー（その極小）→主キー（1つ選択）と代替キー（残り）の関係を整理する。
