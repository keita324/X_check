q: 16
answer: イ
theme: |
  複数のタスク（処理）が資源を取り合って、お互いに永遠に待ち続ける「デッドロック」を防ぐ方法を問う問題です。
basics: |
  <b>タスク</b>：OS上で動いている1つ1つの処理（プログラムの実行単位）です。
  <b>資源</b>：ファイル、プリンター、データベースの行など、タスクが使うもの。
  <b>排他的に使用</b>：あるタスクが使っている間は、他のタスクは使えない（使い終わるまで待つ）という使い方です。これを実現するために、使う前に資源を「獲得（ロック）」します。

  <b>デッドロック</b>：タスクAが資源1を持ったまま資源2を待ち、タスクBが資源2を持ったまま資源1を待つ…というように、<b>お互いが相手の持つ資源を待ち合って、どちらも永遠に進めなくなる</b>状態です。
reasoning: |
  1. デッドロックが起きる典型例を考えます。
  | タスクA：資源1を獲得 → 資源2を獲得しようとする
  | タスクB：資源2を獲得 → 資源1を獲得しようとする
  Aが資源1、Bが資源2を取った瞬間に、Aは資源2を、Bは資源1を待ち続けて止まります。原因は、2つのタスクが<b>逆の順序</b>で資源を取りに行くことです。
  2. 獲得の順序を両方とも「資源1 → 資源2」に揃えるとどうなるか。
  | 先に資源1を取ったタスクだけが資源2へ進める
  | もう一方は資源1の段階で待つだけで、資源2は持っていない
  3. 「片方が相手の欲しい資源を持ったまま待つ」という循環が起こらないので、デッドロックは発生しません。
  4. よって正解は<b>イ</b>です。
choices:
  ア: 一方の優先度を高くしても、優先度は「どちらを先に実行するか」を決めるだけです。低い方が先に資源を1つ獲得した後に高い方が動けば、同じように待ち合いが起こり得ます。誤り。
  イ: 資源を獲得する順序を両方で同じにすると、循環的な待ち合いが起きないのでデッドロックを防げます。<b>正解</b>。
  ウ: 獲得順序を逆にすることこそ、デッドロックが発生する典型的な原因です。誤り。
  エ: 優先度を同じにしても、資源の取り方は変わらないのでデッドロックは防げません。誤り。
example: |
  細い一本道の両側から車が入ってきて、真ん中で向かい合ってどちらも進めなくなる状態がデッドロックです。「この道は必ず北から南へ一方通行」というルール（獲得順序の統一）を決めれば、向かい合うことはなくなります。
review:
  - デッドロック＝「互いに相手の持つ資源を待ち合って永久に進めない」状態であることを説明できるようにする。
  - 防止策の代表は「資源の獲得順序をすべてのタスクで統一する」こと。順序が逆だと発生する。
  - 優先度の変更ではデッドロックは防げないことを覚える。
