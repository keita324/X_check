q: 37
answer: ウ
category: セキュリティ
theme: |
  セキュリティ機能を強化したOS「セキュアOS」の効果を、シングルサインオン・WAF・二要素認証と区別する問題です。キーワードは「強制アクセス制御」です。
basics: |
  <b>アクセス制御</b>：誰が、どのファイルやプログラムに、どんな操作（読み・書き・実行）をしてよいかを制限する仕組みです。
  - <b>任意アクセス制御（DAC）</b>：ファイルの所有者が自由に権限を設定できる。一般的なOSの方式。管理者（root）権限を奪われると、すべてのファイルを自由に操作されてしまう。
  - <b>強制アクセス制御（MAC）</b>：システム全体で決めたセキュリティポリシーに従って、<b>管理者であっても</b>決められた操作しかできないようにする。
  <b>セキュアOS</b>：強制アクセス制御や、権限を必要最小限に分ける機能（最小特権）を備えたOSです（例：SELinux）。万一侵入されても、被害を限定できます。
reasoning: |
  1. セキュアOSの特徴は、強制アクセス制御によって、侵入者や（乗っ取られた）管理者であっても、ポリシーで禁止された操作ができないことです。
  2. 重要なファイルの更新を強制アクセス制御で禁止しておけば、システムに侵入されても、そのファイルは改ざんされません。
  3. 「強制アクセス制御を設定することによって、ファイルの更新が禁止できるので、システムに侵入されてもファイルの改ざんを防止できる」という<b>ウ</b>が正解です。
choices:
  ア: 1回の利用者認証で複数のシステムを利用できるのは、<b>シングルサインオン</b>の効果です。セキュアOSの効果ではありません。誤り。
  イ: Webサイトへの通信路上で通信を解析し、Webアプリケーションの脆弱性を狙った攻撃をブロックするのは、<b>WAF</b>の効果です。誤り。
  ウ: 強制アクセス制御でファイルの更新を禁止できるので、システムに侵入されてもファイルの改ざんを防止できます。セキュアOSの効果です。<b>正解</b>。
  エ: パスワードに加えて専用トークンで認証するのは、<b>二要素認証（多要素認証）</b>の効果です。誤り。
example: |
  普通のOSは「マスターキーを持つ管理人なら、どの部屋にも入れて何でもできるマンション」です。マスターキーを盗まれると全部屋が危険です。セキュアOSは「管理人でも、金庫室の中身は書き換えられないルールが建物全体に組み込まれているマンション」で、マスターキーを盗まれても金庫室の中身は守られます。
review:
  - セキュアOS＝強制アクセス制御（管理者でもポリシーに反する操作は不可）と最小特権で、侵入後の被害（改ざんなど）を防ぐ。
  - シングルサインオン（認証の一元化）、WAF（Webアプリ攻撃の遮断）、二要素認証（トークン併用）と区別する。
