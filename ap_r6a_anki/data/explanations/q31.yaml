q: 31
answer: イ
category: データベース
theme: |
  DBMSの「チェックポイント」の意味を、制約チェックのタイミング、セーブポイント、2相コミットの判定時点と区別する問題です。
basics: |
  <b>データベースバッファ</b>：DBMSが、ディスク上のデータを読み書きするときに一時的に使う主記憶上の領域です。更新はまずバッファ上で行われ、すぐにはディスクに書かれません。
  <b>チェックポイント</b>：データベースバッファの内容を、<b>二次記憶（ディスク）に書き出す時点</b>です。チェックポイントまでにコミットされたトランザクションの更新はディスクに反映済みなので、障害回復のときに<b>その時点より前の分はやり直す（ロールフォワード）必要がなく</b>、回復作業が短くて済みます。

  紛らわしい用語
  - <b>制約チェックの遅延（DEFERRABLE）</b>：一意性や参照などの制約を、データ操作ごとに即時チェックするか、コミット時までチェックを遅らせるかを指定する仕組み。
  - <b>セーブポイント</b>：トランザクションの途中に設定する目印。そこまでの部分だけをロールバックできる。
  - <b>2相コミットの判定</b>：分散トランザクションで、調停者が全参加者の可否を集めて、コミットかロールバックかを決める処理。
reasoning: |
  1. チェックポイントは「データベースバッファの内容を二次記憶に書き出した時点」で、それ以前にコミットされたトランザクションは障害回復の対象外になります。
  2. これを述べているのは<b>イ</b>です。
choices:
  ア: 制約のチェックを即時に行うか、コミット時まで遅延させるかの指定は、<b>制約の遅延評価</b>の説明です。チェックポイントではありません。誤り。
  イ: データベースバッファの内容を二次記憶に書き出した時点で、障害回復の際にその時点までにコミットされたトランザクションの回復作業を不要にできるのは、<b>チェックポイント</b>です。<b>正解</b>。
  ウ: トランザクションの途中に任意に設定し、その時点まで明示的にロールバックできるのは、<b>セーブポイント</b>です。誤り。
  エ: 分散トランザクションの調停者が全参加者の可否を受けてコミットかロールバックかを判定するのは、<b>2相コミット</b>の手順の説明です。誤り。
example: |
  ゲームの「セーブ」がチェックポイントにあたります。こまめにセーブしておけば、電源が落ちても、セーブ時点より前の進行はやり直す必要がなく、セーブ後の分だけを再現すれば済みます。
review:
  - チェックポイント＝データベースバッファの内容を二次記憶へ書き出す時点。それ以前にコミットした分は障害回復が不要になる。
  - セーブポイント（トランザクション途中までのロールバック）、制約の遅延評価、2相コミットの判定と区別する。
