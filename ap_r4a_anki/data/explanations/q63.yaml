q: 63
answer: ウ
theme: |
  組織全体の業務とシステムを最適化するための設計手法「エンタープライズアーキテクチャ（EA）」の説明を、UML・E-R図・DFDと区別する問題です。
basics: |
  <b>エンタープライズアーキテクチャ（EA）</b>：組織全体（エンタープライズ）の業務と情報システムを、統一的な枠組みで整理・分析し、<b>全体最適</b>の観点から見直すための手法です。
  EAでは、次の<b>4つの体系（アーキテクチャ）</b>で整理します。
  - <b>ビジネスアーキテクチャ（BA）</b>：業務の内容や流れ
  - <b>データアーキテクチャ（DA）</b>：業務で使うデータの構造や関係
  - <b>アプリケーションアーキテクチャ（AA）</b>：業務を支えるシステム（アプリ）の構成
  - <b>テクノロジアーキテクチャ（TA）</b>：ハードウェア、ネットワーク、OSなどの技術基盤

  他の選択肢に出てくる手法
  - <b>UML</b>：オブジェクト指向設計の図法を統一したもの（クラス図、ユースケース図など）。
  - <b>E-R図</b>：エンティティ（実体）とリレーションシップ（関連）でデータ構造を表す図。
  - <b>DFD</b>：データフロー、プロセス、データストア（ファイル）、外部実体（データ源泉/吸収）の4要素で業務の流れを表す図。
reasoning: |
  1. EAの特徴は「業務とシステムを4つのアーキテクチャで分析」「全体最適化」です。
  2. ビジネス・データ・アプリケーション・テクノロジの4体系と全体最適化に触れているのは<b>ウ</b>です。
  3. ア＝UML、イ＝E-R図、エ＝DFDの説明です。
choices:
  ア: オブジェクト指向設計の手法を統一・標準化し、クラス図やユースケース図などで分析・設計するのは<b>UML</b>です。誤り。
  イ: 概念データモデルをエンティティとリレーションシップで表現するのは<b>E-R図（E-Rモデル）</b>です。誤り。
  ウ: 業務と情報システムを、ビジネス・データ・アプリケーション・テクノロジの4つの体系で分析し、全体最適化の観点から見直す。<b>EA</b>の説明です。<b>正解</b>。
  エ: ビジネスプロセスを、データフロー、プロセス、ファイル、データ源泉/データ吸収の4つの基本要素で表すのは<b>DFD（データフローダイアグラム）</b>です。誤り。
example: |
  都市計画に例えると、EAは「街全体の設計図」です。人々の暮らし方（業務）、住民台帳（データ）、役所や病院などの施設（アプリケーション）、道路や電気・水道（技術基盤）を4つの層で整理し、街全体として無駄や重複がないように見直します。
review:
  - EA＝ビジネス（BA）・データ（DA）・アプリケーション（AA）・テクノロジ（TA）の4体系で全体最適化を図る手法。
  - UML（クラス図・ユースケース図）、E-R図（エンティティとリレーションシップ）、DFD（データフロー等4要素）と区別する。
