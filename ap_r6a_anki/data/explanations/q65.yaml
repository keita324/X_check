q: 65
answer: ウ
category: システム企画
theme: |
  システムの要件を考えるときに使う「UXデザイン」の考え方を、プライバシーバイデザイン・SOA・マッシュアップと区別する問題です。
basics: |
  <b>UX（User Experience：ユーザーエクスペリエンス）</b>：利用者がシステムや製品を使うことで得られる<b>体験全体</b>のことです。
  <b>UXデザイン</b>：機能の有効性や操作性（使いやすさ＝UI・ユーザビリティ）だけでなく、<b>快適さ、安心感、楽しさ</b>など、利用者が感じる<b>体験の価値</b>を重視してシステムを設計する考え方です。

  関連する設計思想
  - <b>プライバシーバイデザイン（セキュリティバイデザイン）</b>：設計の段階から、個人情報保護やセキュリティ対策を組み込む考え方。
  - <b>SOA（サービス指向アーキテクチャ）</b>：システムの機能を「サービス」として捉え、その組合せでシステムを構築する考え方。
  - <b>マッシュアップ</b>：仕様が公開されている他社のAPIやサービスを組み合わせて、システムを素早く構築する手法。
reasoning: |
  1. UXデザインのキーワードは「有効性、操作性などに加え、快適さ、安心感、楽しさなどの<b>体験価値</b>を重視」です。
  2. 体験価値を重視すると明記している選択肢は<b>ウ</b>だけです。
choices:
  ア: 設計時から、稼働後の個人情報保護などのセキュリティ対策を組み込む設計思想は、<b>プライバシーバイデザイン（セキュリティバイデザイン）</b>です。誤り。
  イ: 個々のアプリケーションを利用者が享受するサービスとして捉え、その組合せでシステムを構築する設計思想は、<b>SOA</b>です。誤り。
  ウ: システムの機能がもたらす有効性や操作性に加え、快適さ、安心感、楽しさなどの体験価値を重視する設計思想は、<b>UXデザイン</b>です。<b>正解</b>。
  エ: 公開されている他社のアプリケーションを活用してシステムを構築し、開発の生産性を高める考え方は、<b>マッシュアップ</b>です。誤り。
example: |
  同じ「電車の切符を買う」機能でも、ボタンが分かりやすい（操作性）だけでなく、「待たずにスマホで買えて、乗換えも教えてくれて、移動が楽しくなる」と感じられるようにするのがUXデザインです。機能がそろっていても、使っていてストレスを感じるなら、UXは良いとはいえません。
review:
  - UXデザイン＝有効性・操作性に加え、快適さ・安心感・楽しさなどの体験価値を重視する設計思想。
  - プライバシーバイデザイン（設計段階からセキュリティ）、SOA（サービスの組合せ）、マッシュアップ（他社APIの活用）と区別する。
