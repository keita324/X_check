q: 32
answer: ア
theme: |
  TCP/IPのアプリケーションプロトコルのうち、「データ転送用」と「制御用」に別々のウェルノウンポート番号を使うものを選ぶ問題です。
basics: |
  <b>プロトコル</b>：通信するときの約束事です（Webを見るならHTTP、メールを送るならSMTPなど）。
  <b>ポート番号</b>：1台のコンピュータの中で、どのアプリ（サービス）宛ての通信かを区別する番号です。IPアドレスが「建物の住所」なら、ポート番号は「部屋番号」です。
  <b>ウェルノウンポート番号</b>：0〜1023番の、代表的なサービスにあらかじめ決められた番号です。

  主なウェルノウンポート番号
  | FTP：20番（データ転送）、21番（制御）
  | SMTP：25番　 POP3：110番　 SNMP：161番（エージェント）、162番（トラップ）
  | HTTP：80番　 HTTPS：443番
reasoning: |
  1. <b>FTP（File Transfer Protocol）</b>は、ファイルを送受信するプロトコルです。
  2. FTPは、ログインやコマンド（「このファイルを送って」など）をやり取りする<b>制御用のコネクション（21番）</b>と、ファイルの中身を実際に送る<b>データ転送用のコネクション（20番）</b>を分けて使います。
  3. 「データ転送用と制御用とに異なるウェルノウンポート番号が割り当てられている」のはFTPです。正解は<b>ア</b>です。
choices:
  ア: FTPは制御用に21番、データ転送用に20番を使います。<b>正解</b>。
  イ: POP3は、メールサーバから自分宛てのメールを受信するプロトコルで、110番の1つのポートで制御とデータの両方をやり取りします。誤り。
  ウ: SMTPは、メールを送信・転送するプロトコルで、25番（送信用には587番も）を使い、制御とデータを1つのコネクションで扱います。誤り。
  エ: SNMPは、ネットワーク機器の監視・管理用のプロトコルです。161番と162番を使いますが、これは「問合せ用（161）」と「機器からの通知＝トラップ用（162）」の区別で、データ転送用と制御用の区別ではありません。誤り。
example: |
  宅配便の電話窓口（制御用：21番）で「この荷物を送ってください」と依頼し、実際の荷物はトラック（データ用：20番）で運ばれるイメージです。FTPは「話す回線」と「荷物を運ぶ回線」を別々に持っています。
review:
  - FTPは制御用21番・データ転送用20番の2つのポートを使う。
  - SMTP 25番、POP3 110番、SNMP 161/162番、HTTP 80番、HTTPS 443番もセットで覚える。
