q: 59
answer: ア
category: システム監査
theme: |
  システム監査で証拠を集める技法（インタビュー法、現地調査法、コンピュータ支援監査技法、チェックリスト法）の正しい説明を選ぶ問題です。
basics: |
  システム監査基準（平成30年）の解説に示されている主な監査技法
  - <b>インタビュー法</b>：システム監査人が、<b>直接、関係者に口頭で問い合わせ</b>、回答を入手する技法。
  - <b>現地調査法</b>：システム監査人が監査対象部門に<b>直接赴いて</b>、自ら観察・調査する技法。業務の実態を見るため、通常は<b>業務時間中</b>に行う。
  - <b>コンピュータ支援監査技法（CAAT）</b>：コンピュータを利用して監査手続を行う技法。専用のソフトウェアだけでなく、表計算ソフトなどの<b>汎用ソフトウェア</b>も使える。
  - <b>チェックリスト法</b>：<b>システム監査人が</b>チェックリストを作成し、監査対象部門に回答を求める技法。
reasoning: |
  1. ア：インタビュー法の説明として正しい → ○。
  2. イ：現地調査法は、業務の実態を観察するために、通常は業務時間中に行います。「業務時間外に実施しなければならない」は誤り。
  3. ウ：コンピュータ支援監査技法では、専用ソフトに限らず、汎用のソフトウェアも利用できます。「専用ソフトウェアによらなければならない」は誤り。
  4. エ：チェックリストを作成するのは<b>システム監査人</b>で、監査対象部門はそれに回答します。「監査対象部門がチェックリストを作成」は誤り。
  5. 正解は<b>ア</b>です。
choices:
  ア: インタビュー法は、システム監査人が直接、関係者に口頭で問い合わせ、回答を入手する技法です。<b>正解</b>。
  イ: 現地調査法は、業務の実態を自ら観察するための技法なので、通常は業務時間中に行います。業務時間外に限るものではありません。誤り。
  ウ: コンピュータ支援監査技法は、専用ソフトウェアだけでなく、汎用のソフトウェア（表計算ソフトなど）を利用して行うこともできます。誤り。
  エ: チェックリスト法では、<b>システム監査人</b>がチェックリストを作成し、監査対象部門に回答を求めます。監査対象部門がチェックリストを作成するのではありません。誤り。
example: |
  お店の衛生検査に例えると、店長に「消毒はいつしていますか？」と聞くのがインタビュー法、営業中の厨房に入って実際の作業を見るのが現地調査法、POSデータを表計算ソフトで分析するのがコンピュータ支援監査技法、検査員が作った質問票に店側が記入するのがチェックリスト法です。
review:
  - インタビュー法＝監査人が関係者に直接口頭で質問。現地調査法＝監査人が直接赴いて観察（通常は業務時間中）。
  - CAATは汎用ソフトも使える。チェックリストは監査人が作成し、監査対象部門が回答する。
