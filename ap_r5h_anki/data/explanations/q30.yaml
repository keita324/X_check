q: 30
answer: ア
category: データベース
theme: |
  関係データベースの参照制約で、親の表の行を削除したときに、それを参照している子の表の行も自動的に削除させる指定（ON DELETE の削除規則）を選ぶ問題です。
basics: |
  <b>主キー</b>：表の各行を一意に識別する列（図の実線の下線）。
  <b>外部キー</b>：他の表の主キーを参照する列（図の破線の下線）。「注文明細」の注文番号は、「注文」表の注文番号を参照しています。
  <b>参照制約（参照整合性制約）</b>：外部キーの値が、参照先の表に必ず存在するようにする制約です。親（注文）の行を削除するときに、子（注文明細）の行をどうするかを ON DELETE で指定します。
  | <b>CASCADE</b>：親の行を削除すると、それを参照する子の行も<b>連鎖的に自動削除</b>する。
  | <b>RESTRICT</b>（NO ACTION）：参照している子の行があれば、親の行の削除を<b>拒否</b>する。
  | SET NULL：子の外部キーを NULL にする。
reasoning: |
  1. やりたいことは「注文表の行を削除すると、対応する注文明細表の行が自動的に削除される」ことです。
  2. 親の削除に連動して子も削除する削除規則は <b>CASCADE</b>（連鎖）です。
  3. 正解は<b>ア</b>です。
choices:
  ア: CASCADE を指定すると、注文表の行を削除したときに、その注文番号を参照する注文明細表の行も自動的に削除されます。<b>正解</b>。
  イ: INTERSECT は、2つのSELECTの結果の共通部分（積集合）を求めるSQLの演算子で、削除規則ではありません。誤り。
  ウ: RESTRICT は、参照している注文明細の行が存在する場合、注文表の行の削除を拒否する削除規則です。自動削除とは逆の動きです。誤り。
  エ: UNIQUE は、列の値が重複しないようにする一意性制約で、削除規則ではありません。誤り。
example: |
  ネット通販で注文をキャンセルして注文データ（親）を消したとき、その注文に含まれていた商品ごとの明細（子）だけが残っていると、どの注文のものか分からないゴミデータになります。CASCADE を指定しておけば、親を消すと子も一緒に消えるので、そのような不整合が起きません。
review:
  - ON DELETE CASCADE＝親の行の削除に連動して、参照している子の行も自動削除する。
  - RESTRICT＝子があれば親の削除を拒否、SET NULL＝子の外部キーをNULLにする。INTERSECT・UNIQUEは削除規則ではない。
