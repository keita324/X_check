q: 26
answer: エ
category: 情報メディア
theme: |
  圧縮しない動画を配信するのに必要な通信の帯域幅（1秒間に送るデータ量）を、画面の大きさ・色の情報量・フレーム数から計算する問題です。
basics: |
  <b>ピクセル（画素）</b>：画面を構成する点。800×600ピクセルの画面には、800×600＝480,000個の点があります。
  <b>24ビットカラー</b>：1ピクセルの色を24ビットで表すこと（赤・緑・青を各8ビット）。約1,677万色を表現できます。
  <b>フレーム/秒（fps）</b>：1秒間に表示する画像（コマ）の枚数。30フレーム/秒なら、1秒に30枚の静止画を送ります。
  <b>帯域幅</b>：1秒間に送る必要があるビット数。
  | 帯域幅 ＝ 1画面のビット数 × 1秒あたりのフレーム数
  | 1画面のビット数 ＝ 横ピクセル数 × 縦ピクセル数 × 1ピクセルのビット数
  単位：k（キロ）＝10<sup>3</sup>、M（メガ）＝10<sup>6</sup>。
reasoning: |
  1. 1画面（1フレーム）のデータ量：
  | 800 × 600 × 24 ＝ 480,000 × 24 ＝ 11,520,000ビット
  2. 1秒間（30フレーム）のデータ量：
  | 11,520,000 × 30 ＝ 345,600,000ビット/秒 ≒ 345.6Mビット/秒
  3. およそ <b>350Mビット/秒</b> です。正解は<b>エ</b>です。
choices:
  ア: 350kビット/秒は、正しい値（約350Mビット/秒）の1000分の1で、単位（kとM）を取り違えた値です。誤り。
  イ: 3.5Mビット/秒は、正しい値の100分の1です。誤り。
  ウ: 35Mビット/秒は、正しい値の10分の1です。誤り。
  エ: 350Mビット/秒。800×600×24×30 ≒ 345.6×10<sup>6</sup>ビット/秒で、計算結果と一致します。<b>正解</b>。
example: |
  1枚約1.4Mバイト（11.5Mビット）の写真を、1秒間に30枚送り続けるのと同じです。ふだんの動画配信が数Mビット/秒で見られるのは、H.264などで圧縮しているからで、圧縮しないと100倍近い帯域が必要になります。
review:
  - 非圧縮動画の帯域幅＝横×縦×1ピクセルのビット数×フレーム数/秒。
  - 選択肢が10倍ずつ違う問題は、10のべき乗と単位（k＝10<sup>3</sup>、M＝10<sup>6</sup>）を丁寧に確認する。
