q: 59
answer: ウ
theme: |
  システム監査の用語「監査手続」の意味を問う問題です。監査計画や監査報告と混同しないことがポイントです。
basics: |
  <b>システム監査</b>：独立した立場の監査人が、情報システムが適切に管理・運用されているかを点検・評価し、結論や改善の助言をまとめる活動です。
  システム監査は、大きく次の流れで進みます。
  | 監査計画の策定 → 監査の実施（予備調査・本調査）→ 監査報告 → フォローアップ
  <b>監査証拠</b>：監査人の結論を裏付ける根拠（文書、記録、ログ、関係者への聞き取り結果など）。
  <b>監査手続</b>：監査項目ごとに、<b>十分かつ適切な監査証拠を入手するための具体的な手順</b>です。例えば、資料の閲覧、関係者への質問（インタビュー）、現場の観察、記録の突合・照合、処理の再実施などがあります。
reasoning: |
  1. 監査手続は「監査証拠を集めるための手順」です。
  2. 「監査項目について、十分かつ適切な証拠を入手するための手順」という<b>ウ</b>がこれに当たります。
  3. ア（監査計画・進捗管理）、イ（監査報告書の作成）、エ（監査チームの編成）は、監査手続ではなく、監査業務の管理や報告に関する作業です。
choices:
  ア: 監査計画の立案や監査業務の進捗管理は、監査を<b>どう進めるかを管理する</b>作業で、証拠を集める手順（監査手続）ではありません。誤り。
  イ: 監査報告書に結論や指摘事項を書くのは<b>監査報告</b>の段階の作業です。監査手続で集めた証拠を基に行うものです。誤り。
  ウ: 監査項目について、十分かつ適切な証拠を入手するための手順。<b>監査手続</b>の定義です。<b>正解</b>。
  エ: 監査テーマに合わせた監査チームの編成は、監査計画や体制づくりの作業です。誤り。
example: |
  探偵（監査人）の仕事に例えると、「調査計画を立てる」（ア・エ）、「聞き込み・現場検証・書類の照合で証拠を集める」（ウ＝監査手続）、「報告書をまとめる」（イ）という流れです。監査手続は、真ん中の「証拠集めのやり方」にあたります。
review:
  - 監査手続＝監査証拠を入手するための具体的な手順（閲覧、質問、観察、突合、再実施など）。
  - 監査計画（計画・体制）、監査報告（結論・指摘の記述）と、段階ごとに区別する。
