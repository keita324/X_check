q: 16
answer: ウ
category: ソフトウェア
theme: |
  タスク（処理）にCPUを割り当てる順番の決め方（スケジューリング方式）のうち、特定のタスクがいつまでもCPUを割り当ててもらえない「飢餓状態（スタベーション）」が最も起こりやすいものを選ぶ問題です。
basics: |
  <b>スタベーション（飢餓状態）</b>：あるタスクが、他のタスクばかり優先されて、いつまでもCPUを割り当ててもらえない状態です。
  主なスケジューリング方式
  - <b>優先度順＋エージング</b>：優先度の高い順に実行するが、待ち時間が長いタスクの優先度を<b>徐々に上げる</b>（エージング）。待ち続けると最後には優先されるので、飢餓状態を防げる。
  - <b>ラウンドロビン</b>：到着順に実行し、<b>一定時間（タイムクウォンタム）</b>たったら中断して待ち行列の最後尾に回す。全タスクに順番が回ってくる。
  - <b>処理時間順（SPT：Shortest Processing Time first）</b>：処理予定時間が<b>最も短いタスクから</b>実行する。平均待ち時間は短くなるが、短いタスクが次々に到着すると、<b>処理時間の長いタスクはいつまでも後回し</b>になる。
  - <b>到着順（FCFS：First Come First Served）</b>：到着した順に実行する。いずれ必ず順番が来る。
reasoning: |
  1. ア（エージング）、イ（ラウンドロビン）、エ（到着順）は、いずれも待っているタスクにいつかは必ずCPUが割り当てられる仕組みです。
  2. ウ（処理時間順）では、処理時間の短いタスクが次々に到着すると、処理時間の長いタスクは常に後回しにされ、いつまでも実行されない可能性があります。
  3. 待ち続ける可能性が最も高いのは<b>ウ</b>です。
choices:
  ア: 待ち時間に応じて優先度を徐々に上げる（エージング）ので、長く待ったタスクもいずれ優先度が上がって実行されます。飢餓状態を防ぐ方式です。誤り。
  イ: ラウンドロビン方式では、一定時間ごとに実行するタスクを切り替え、全タスクに順番が回るので、待ち続けることはありません。誤り。
  ウ: 処理予定時間が最も短いタスクから実行する方式では、短いタスクが到着し続けると、処理時間の長いタスクがCPUの割当てを待ち続ける可能性が最も高くなります。<b>正解</b>。
  エ: 到着順に実行する方式では、先に到着したタスクから順に必ず実行されるので、待ち続けることはありません。誤り。
example: |
  コピー機の順番待ちで、「枚数が少ない人を優先する」ルールにすると、1枚だけコピーする人が次々来るたびに、100枚コピーしたい人はいつまでも順番が回ってきません。待ち時間に応じて優先順位を上げる（エージング）などの工夫が必要です。
review:
  - 処理時間順（SPT）方式は、短いタスクが続くと長いタスクが待ち続ける（スタベーション）可能性がある。
  - エージング（待ち時間で優先度を上げる）、ラウンドロビン（一定時間で切替え）、到着順（FCFS）は、いずれ必ず実行される。
