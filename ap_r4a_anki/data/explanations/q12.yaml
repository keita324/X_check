q: 12
answer: ウ
theme: |
  1台の物理サーバの上で複数のサーバ環境を動かす「仮想化」の3つの方式（ホスト型・ハイパーバイザ型・コンテナ型）のうち、コンテナ型の特徴を選ぶ問題です。
basics: |
  <b>仮想化</b>：1台の物理的なコンピュータ（物理サーバ）を、ソフトウェアの力で複数台のコンピュータがあるかのように見せる技術です。
  <b>OS</b>：WindowsやLinuxなど、ハードウェアを管理してアプリを動かす基本ソフトです。
  <b>ホストOS</b>：物理サーバに直接インストールされたOS。<b>ゲストOS</b>：仮想サーバの中で動くOS。

  <b>3つの方式</b>
  - <b>ホスト型</b>：ホストOSの上に仮想化ソフトを入れ、その上でゲストOSを動かす（パソコンで使う VirtualBox など）。
  - <b>ハイパーバイザ型</b>：ホストOSを使わず、物理サーバに直接ハイパーバイザ（仮想化ソフト）を入れ、その上でゲストOSを動かす（VMware ESXi など）。
  - <b>コンテナ型</b>：ホストOSの上でコンテナ管理ソフトを動かし、アプリの<b>実行環境だけ</b>を区切って用意する。ゲストOSを持たず、ホストOSのカーネル（OSの中核部分）を共有する（Docker など）。
reasoning: |
  1. コンテナ型の最大の特徴は「仮想サーバごとのゲストOSを持たない」ことです。
  2. ホストOSと仮想化ソフトウェア（コンテナエンジン）によって、プログラムの実行環境（ライブラリや設定など）だけを分離します。
  3. ゲストOSを起動しないので、軽量で起動も速いのが利点です。
  4. この説明に一致するのは<b>ウ</b>です。
choices:
  ア: 「物理サーバと仮想環境がOSを共有するので、どちらかにOSをもてばよい」は不正確です。コンテナ型ではOSは物理サーバ（ホスト）側に必ず必要で、それをコンテナが共有します。「どちらか」に置けばよいというものではありません。誤り。
  イ: ホストOSを持たず、物理サーバに直接入れた仮想化ソフトの上でゲストOSを動かすのは<b>ハイパーバイザ型</b>です。誤り。
  ウ: ホストOSと仮想化ソフトでプログラムの実行環境を仮想化し、仮想サーバにゲストOSを持たない。<b>コンテナ型</b>の説明です。<b>正解</b>。
  エ: ホストOSにインストールした仮想化ソフトで、ゲストOSを持つ仮想サーバを動かすのは<b>ホスト型</b>です。誤り。
example: |
  マンションに例えると、ホスト型・ハイパーバイザ型は「部屋ごとにキッチン・浴室・配管まで全部そろった独立住宅」（ゲストOSあり）。コンテナ型は「建物の配管や電気（ホストOSのカーネル）は共用し、部屋の中だけ仕切ったシェアハウス」です。設備を共用する分、軽くてすぐに部屋を用意できます。
review:
  - コンテナ型＝ゲストOSなし・ホストOSのカーネルを共有・軽量で起動が速い、を押さえる。
  - ホスト型（ホストOSの上に仮想化ソフト）とハイパーバイザ型（ホストOSなし）の違いを、「ホストOSの有無」で区別する。
