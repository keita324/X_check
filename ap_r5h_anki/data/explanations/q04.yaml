q: 4
answer: ウ
category: 基礎理論
theme: |
  動いている物から跳ね返った波の周波数が変わる「ドップラー効果」を利用したセンサーで、何を測定できるかを問う問題です。
basics: |
  <b>ドップラー効果</b>：音や電波、光などの波を出す物や反射する物が<b>動いている</b>と、観測される周波数（音なら高さ）が変わる現象です。
  - 近づいてくる物からの波は周波数が高く、遠ざかる物からの波は低くなる。
  - 救急車のサイレンが、近づくときは高く、遠ざかるときは低く聞こえるのがこの現象です。
  周波数の変化の大きさから、<b>物が動く速さ</b>を計算できます。

  <b>ドップラーセンサーの応用</b>：スピードガン（球速の測定）、自動車のレーダー、医療用の超音波ドップラー（血液の流れの測定）など、<b>動きや速さ・流れ</b>を測る用途に使われます。
reasoning: |
  1. ドップラー効果で分かるのは「動いている物の速さ」です。
  2. 選択肢の中で、動き（流れ）に関するものは「血流量」だけです。体に超音波を当て、血管の中を流れる赤血球から跳ね返った波の周波数の変化から、血液の流れる速さ・量を測ります。
  3. 正解は<b>ウ</b>です。
choices:
  ア: 血中酸素飽和度は、<b>パルスオキシメーター</b>などで、赤色光と赤外光の吸収のされ方の違いから測ります。光の吸収の性質を使うもので、ドップラー効果ではありません。誤り。
  イ: 血糖値は、血液中のブドウ糖と酵素を反応させる<b>酵素センサー</b>などで測ります。動きを測るものではないので誤り。
  ウ: 血流量は、流れる血液（赤血球）から反射した超音波などの周波数の変化（ドップラー効果）から測定できます。<b>正解</b>。
  エ: 体内水分量は、体に微弱な電流を流したときの電気抵抗（<b>生体電気インピーダンス</b>）などから推定します。誤り。
example: |
  野球中継で表示される「球速150km/h」は、スピードガンが電波をボールに当て、跳ね返ってきた電波の周波数のずれ（ドップラー効果）から計算しています。病院の超音波検査で血液の流れが色付きで表示されるのも、同じ原理です。
review:
  - ドップラー効果＝動く物から返ってくる波の周波数が変わる現象。周波数の変化から速さ・流れ（血流、球速、車の速度）を測る。
  - 血中酸素飽和度（光の吸収）、血糖値（酵素反応）、体内水分量（電気抵抗）は別の原理で測る。
