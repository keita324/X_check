q: 49
answer: ア
category: ソフトウェア開発管理技術
theme: |
  アジャイル開発の基本となる「アジャイルソフトウェア開発宣言」の4つの価値で、より重視する側（左側）の項目の組みを選ぶ問題です。
basics: |
  <b>アジャイルソフトウェア開発宣言</b>（2001年）：アジャイル開発の考え方の基礎となる宣言です。「右記のことがらに価値があることを認めながらも、私たちは左記のことがらにより価値をおく」として、次の4つを挙げています。
  | <b>個人と対話</b>　を　プロセスやツール　よりも
  | <b>動くソフトウェア</b>　を　包括的なドキュメント　よりも
  | <b>顧客との協調</b>　を　契約交渉　よりも
  | <b>変化への対応</b>　を　計画に従うこと　よりも
  つまり、右側（プロセスやツール、包括的なドキュメント、契約交渉、計画に従うこと）にも価値はあるが、左側をより重視する、という意味です。
reasoning: |
  1. 問題の「別のことがら」は、「より価値をおく」とされている側＝<b>左側</b>の4項目です。
  2. 左側は「個人と対話」「動くソフトウェア」「顧客との協調」「変化への対応」です。
  3. この組みは<b>ア</b>です。
choices:
  ア: 個人と対話、動くソフトウェア、顧客との協調、変化への対応。アジャイルソフトウェア開発宣言で「より価値をおく」とされる4項目です。<b>正解</b>。
  イ: 「包括的なドキュメント」と「計画に従うこと」は、価値を認めつつも、より重視はしない側（右側）の項目です。誤り。
  ウ: 「プロセスやツール」と「契約交渉」は、右側の項目です。誤り。
  エ: 4項目すべてが、右側（価値は認めるが、より重視はしない側）の項目です。誤り。
example: |
  家族旅行の計画で考えると、「立派な旅行計画書」より「みんなで話し合うこと」、「最初に決めた予定どおり進むこと」より「雨が降ったら臨機応変に行き先を変えること」を大事にする、という考え方です。計画書や予定に価値がないわけではありません。
review:
  - アジャイル宣言の左側（より重視）：個人と対話、動くソフトウェア、顧客との協調、変化への対応。
  - 右側（価値は認める）：プロセスやツール、包括的なドキュメント、契約交渉、計画に従うこと。左右のペアで覚える。
