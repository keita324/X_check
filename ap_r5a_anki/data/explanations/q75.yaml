q: 75
answer: エ
category: 企業活動
theme: |
  リーダーシップ論のうち、F.E.フィードラーが提唱した「コンティンジェンシー理論」の特徴を、特性理論・PM理論・SL理論と区別する問題です。
basics: |
  リーダーシップの考え方は、時代とともに次のように発展してきました。
  - <b>特性理論（資質論）</b>：優れたリーダーは、生まれつきの性格・知性・外観などの<b>個人的資質</b>をもっているとする考え方。
  - <b>行動理論</b>：リーダーの<b>行動のスタイル</b>に注目する考え方。代表例が<b>PM理論</b>（目標達成能力Pと集団維持能力Mの2次元）。
  - <b>状況理論（コンティンジェンシー理論）</b>：最適なリーダーシップは<b>状況によって変わる</b>とする考え方。
  　- <b>フィードラーのコンティンジェンシー理論</b>：リーダーシップの有効性は、<b>リーダーのパーソナリティ</b>（仕事志向か人間関係志向か）と、リーダーが<b>状況をどれだけ統制できるか</b>（部下との関係の良さ、仕事の明確さ、権限の強さ）の組合せで決まるとする。
  　- <b>SL理論</b>（ハーシィとブランチャード）：リーダーシップの有効性は、<b>部下の成熟度</b>（自律性）という状況要因に依存するとする。
reasoning: |
  1. フィードラーの理論のキーワードは「リーダーのパーソナリティ」と「リーダーがどれだけ統制力や影響力を行使できるかという状況要因」です。
  2. これを述べているのは<b>エ</b>です。
choices:
  ア: リーダー個人の性格、知性、外観などの個人的資質の分析に焦点を当てるのは、<b>特性理論（資質論）</b>です。誤り。
  イ: リーダーシップのスタイルを、目標達成能力と集団維持能力の2つの次元で捉えるのは、<b>PM理論</b>です。誤り。
  ウ: リーダーシップの有効性が、部下の成熟（自律性）の度合いという状況要因に依存するとするのは、<b>SL理論</b>です。誤り。
  エ: リーダーシップの有効性が、リーダーのパーソナリティと、リーダーが統制力や影響力をどれだけ行使できるかという状況要因に依存するとするのは、<b>フィードラーのコンティンジェンシー理論</b>です。<b>正解</b>。
example: |
  仕事に厳しいタイプの監督（仕事志向）は、チームが混乱していて強い指示が必要な場面で力を発揮し、選手との関係を大切にするタイプの監督（人間関係志向）は、ほどほどにまとまったチームで力を発揮する、というように、「どんな性格のリーダーが向いているかは状況次第」と考えるのがフィードラーの理論です。
review:
  - フィードラーのコンティンジェンシー理論＝リーダーのパーソナリティ×状況の統制のしやすさで有効性が決まる。
  - 特性理論（個人的資質）、PM理論（P・Mの2次元）、SL理論（部下の成熟度）と区別する。
