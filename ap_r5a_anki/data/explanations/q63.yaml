q: 63
answer: エ
category: システム戦略
theme: |
  業務の機能を「サービス」という部品として組み合わせてシステムを作る考え方「SOA（サービス指向アーキテクチャ）」の説明を、BPR・ERP・SLAと区別する問題です。
basics: |
  - <b>SOA（Service Oriented Architecture：サービス指向アーキテクチャ）</b>：ビジネスプロセスを構成する要素（「受注を登録する」「在庫を引き当てる」など）と、それを支えるIT基盤を、<b>ソフトウェア部品である「サービス」</b>として提供し、それらを組み合わせてシステムを構築するアーキテクチャ（設計の考え方）です。業務の変更に合わせてサービスを組み替えやすく、他システムとの連携や再利用もしやすくなります。
  - <b>BPR（Business Process Reengineering）</b>：既存の組織やビジネスルールを<b>抜本的に見直し</b>、業務フロー、管理機構、情報システムを再設計する手法。
  - <b>ERP（Enterprise Resource Planning）</b>：企業の経営資源を有効活用するため、会計・人事・生産・販売などの<b>基幹業務を統合的に管理</b>するシステム（ERPパッケージ）。
  - <b>SLA（Service Level Agreement：サービスレベル合意書）</b>：サービスの発注者と提供者の間で、<b>サービスの品質</b>（稼働率、対応時間など）について合意した文書。
reasoning: |
  1. SOAのキーワードは「ビジネスプロセスの構成要素」「それを支援するIT基盤」「ソフトウェア部品であるサービスとして提供」「システムアーキテクチャ」です。
  2. これを述べているのは<b>エ</b>です。
choices:
  ア: 既存の組織やビジネスルールを抜本的に見直し、業務フロー、管理機構、情報システムを再構築する手法は<b>BPR</b>です。誤り。
  イ: 経営資源を有効活用して経営の効率を上げるために、基幹業務を統合的に管理する業務システムは<b>ERP</b>です。誤り。
  ウ: 発注者とITアウトソーシングサービス提供者の間で、サービスの品質について合意した文書は<b>SLA</b>です。誤り。
  エ: ビジネスプロセスの構成要素とそれを支援するIT基盤を、ソフトウェア部品であるサービスとして提供するシステムアーキテクチャは<b>SOA</b>です。<b>正解</b>。
example: |
  SOAは、業務システムをレゴブロックで組み立てるようなものです。「顧客を検索する」「請求書を作る」「在庫を確認する」といったブロック（サービス）を用意しておけば、新しい業務が始まっても、ブロックを組み替えるだけで対応でき、他の会社のシステムともつなぎやすくなります。
review:
  - SOA＝業務の構成要素とIT基盤を「サービス（ソフトウェア部品）」として提供し、組み合わせてシステムを作るアーキテクチャ。
  - BPR（業務の抜本的な再設計）、ERP（基幹業務の統合管理）、SLA（サービス品質の合意書）と区別する。
