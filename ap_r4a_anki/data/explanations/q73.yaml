q: 73
answer: ウ
theme: |
  IoTやSociety 5.0の基盤となる「サイバーフィジカルシステム（CPS）」の説明を選ぶ問題です。
basics: |
  <b>フィジカル空間</b>：私たちが暮らす現実の世界（工場、道路、人の体など）。
  <b>サイバー空間</b>：コンピュータやネットワークの中の仮想的な世界。

  <b>サイバーフィジカルシステム（CPS）</b>：次のループを回して、現実世界に新たな価値を生み出す仕組みです。
  1. 現実世界の様々なデータを、センサーなどのIoT機器で<b>収集</b>する。
  2. サイバー空間で、AIなどを使ってそのデータを<b>分析・加工</b>する。
  3. 分析結果を現実世界に<b>リアルタイムにフィードバック</b>して、機械の制御や人の行動の改善に役立てる。
reasoning: |
  1. CPSの要素は「現実世界のデータ収集」→「仮想世界（サイバー空間）での分析・加工」→「現実世界へのフィードバック」です。
  2. これを述べているのは<b>ウ</b>です。
  3. ア＝サーバ仮想化、イ＝VR（バーチャルリアリティ）、エ＝暗号資産（仮想通貨）の説明です。
choices:
  ア: 1台のサーバ上で複数のOSを動かし、複数のサーバとして運用するのは<b>サーバ仮想化</b>です。誤り。
  イ: 仮想世界を現実のように体感させ、複数の感覚を刺激して没入感を与えるのは<b>VR（バーチャルリアリティ）</b>です。誤り。
  ウ: 現実世界のデータを収集し、仮想世界で分析・加工して、現実世界にリアルタイムにフィードバックすることで付加価値を創造する。<b>CPS</b>の説明です。<b>正解</b>。
  エ: 電子データだけでやり取りされ、法定通貨のような強制通用力を持たない通貨は<b>暗号資産（仮想通貨）</b>です。誤り。
example: |
  カーナビの渋滞予測が身近な例です。走っている多数の車から位置と速度のデータを集め（収集）、センターのコンピュータで渋滞を予測し（分析）、各車に空いている道を案内します（フィードバック）。その結果、現実の車の流れが変わります。スマート工場で、センサーデータから故障の兆候を見つけて機械を自動調整するのも同じ仕組みです。
review:
  - CPS＝現実世界のデータ収集→サイバー空間で分析→現実世界へリアルタイムにフィードバック、のループ。
  - サーバ仮想化（ア）、VR（イ）、暗号資産（エ）と区別する。
