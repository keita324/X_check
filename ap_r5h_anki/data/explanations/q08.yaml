q: 8
answer: イ
category: コンピュータ構成要素
theme: |
  CPUの動作周波数と1秒間の命令実行数から、1命令あたりに平均何クロックかかるか（CPI）を計算する問題です。
basics: |
  <b>クロック</b>：CPUの動作の基準となる、一定間隔の信号です。CPUはクロックに合わせて少しずつ処理を進めます。
  <b>動作周波数</b>：1秒間のクロック数です。1.25GHz なら、1秒間に 1.25×10<sup>9</sup>（12.5億）回のクロックがあります（G＝10<sup>9</sup>）。
  <b>CPI（Cycles Per Instruction）</b>：1つの命令を実行するのに、平均で何クロック（サイクル）かかるかを表す値です。
  | CPI ＝ 1秒間のクロック数 ÷ 1秒間に実行する命令数
reasoning: |
  1. 1秒間のクロック数：1.25GHz ＝ 1.25 × 10<sup>9</sup> クロック
  2. 1秒間の命令数：10億回 ＝ 1 × 10<sup>9</sup> 命令
  3. CPIを計算します。
  | CPI ＝ 1.25 × 10<sup>9</sup> ÷ (1 × 10<sup>9</sup>) ＝ <b>1.25</b>
  4. 正解は<b>イ</b>です。
choices:
  ア: 0.8は、命令数÷クロック数（1×10<sup>9</sup>÷1.25×10<sup>9</sup>）で、1クロックあたりの命令数（IPC）にあたる値です。CPIはその逆数です。誤り。
  イ: 1.25。1秒間のクロック数を命令数で割った値で、計算結果と一致します。<b>正解</b>。
  ウ: 2.5は、計算結果の1.25の2倍で、一致しません。誤り。
  エ: 10は、計算結果と一致しません。誤り。
example: |
  1分間に125歩進んで、その間に100段の階段を上れたなら、1段上るのに平均1.25歩かかっています。CPUでいえば、「歩数」がクロック数、「階段の段数」が命令数で、1.25がCPIです。
review:
  - CPI＝1秒間のクロック数÷1秒間の命令数（＝1命令あたりの平均クロック数）。
  - 逆数（命令数÷クロック数）はIPC。0.8と1.25を取り違えない。GHz＝10<sup>9</sup>Hz の単位換算に注意する。
