q: 71
answer: ウ
theme: |
  自社工場を持たずに製造を外部に任せる企業形態「ファブレス」の特徴を、セル生産方式・かんばん方式・ファウンドリと区別する問題です。
basics: |
  <b>ファブレス（fabless）</b>：fab（fabrication facility＝製造工場）を less（持たない）という意味です。製品の<b>企画・設計・開発・販売</b>に集中し、<b>製造は外部の企業に委託</b>する企業形態です。半導体メーカー（設計専門）や、一部の家電・ゲーム機メーカーなどが代表例です。
  <b>固定費</b>：生産量に関係なくかかる費用（工場の建物・設備の維持費、減価償却費など）。工場を持たなければ、この負担が小さくなります。

  関連用語
  - <b>ファウンドリ</b>：ファブレス企業などから製造を請け負う企業（半導体の受託製造など）。
  - <b>セル生産方式</b>：1人または数人が製品の全工程を担当する生産方式。
  - <b>かんばん方式</b>：後工程が必要な部品の時期・数量を書いた「かんばん」を前工程に渡して、必要な分だけ供給を受ける方式（トヨタ生産方式）。
reasoning: |
  1. ファブレスの特徴は「工場を持たない」→「固定費を抑えられる」「需要の変動に柔軟に対応できる（委託量を変えればよい）」「企画・開発に経営資源を集中できる」です。
  2. これをすべて述べているのは<b>ウ</b>です。
  3. ア＝セル生産方式、イ＝かんばん方式、エ＝ファウンドリの説明です。
choices:
  ア: 1人又は数人が全工程を担当し、多品種少量生産に対応しやすいのは<b>セル生産方式</b>です。誤り。
  イ: 後工程から部品納入の時期・数量を示した作業指示書を前工程に渡して部品供給を受け、在庫を圧縮するのは<b>かんばん方式</b>です。誤り。
  ウ: 工場を持たないので固定費を圧縮でき、需給変動にも迅速に対応でき、企画・開発に注力できる。<b>ファブレス</b>の特徴です。<b>正解</b>。
  エ: 生産設備を持たない企業から製造を請け負う事業者は<b>ファウンドリ</b>です。ファブレスはその「委託する側」なので誤り。
example: |
  自分ではパン工場を持たず、レシピとブランドづくりに専念して、製造はパン工場に委託している人気パン屋をイメージしてください。注文が増えれば委託量を増やし、減れば減らせばよいので、工場の維持費に悩まされません。これがファブレスです。
review:
  - ファブレス＝工場を持たず製造を外部委託し、企画・開発・販売に集中する企業形態（固定費削減、需給変動への柔軟性）。
  - 製造を請け負う側はファウンドリ。セル生産方式（少人数で全工程）、かんばん方式（後工程引取り）とも区別する。
