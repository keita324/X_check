q: 23
answer: ウ
theme: |
  「XとYが同じときだけ1を出す」回路（一致回路）を、論理回路図の中から選ぶ問題です。各回路の出力を論理式や真理値表で確かめる力が問われます。
basics: |
  <b>論理ゲート</b>（回路図の記号）
  - <b>AND</b>（平らな背の半円）：両方1のときだけ1。
  - <b>OR</b>（矢じり形）：どちらかが1なら1。
  - <b>NOT</b>（三角＋小さな丸）：0と1を反転。
  - <b>NAND</b>：ANDの出力に丸が付いたもの。ANDの結果を反転（両方1のときだけ0）。
  - <b>NOR</b>：ORの出力に丸が付いたもの。ORの結果を反転（両方0のときだけ1）。

  <b>一致回路</b>：XとYが同じ（0と0、1と1）とき1を出す回路。論理式では
  | Z ＝ X・Y ＋ X̄・Ȳ
  （「両方1」または「両方0」）です。XOR（排他的論理和）の否定なので XNOR とも呼ばれます。

  <b>ド・モルガンの法則</b>：NOT(A・B) ＝ Ā＋B̄、NOT(A＋B) ＝ Ā・B̄。
reasoning: |
  4つの回路はどれも、上のゲートに X と Y、下のゲートに X̄ と Ȳ（NOTで反転したもの）を入れ、その2つの出力を最後のゲートでまとめる形です。

  <b>ウ（NAND 3個）</b>を計算します。
  | 上のNAND：P ＝ NOT(X・Y)
  | 下のNAND：Q ＝ NOT(X̄・Ȳ)
  | 最後のNAND：Z ＝ NOT(P・Q) ＝ P̄ ＋ Q̄（ド・モルガン）
  | ＝ X・Y ＋ X̄・Ȳ
  一致回路の式と同じです。

  真理値表でも確認します。
  | X=0,Y=0：P=1, Q=NOT(1・1)=0 → Z=NOT(1・0)=1
  | X=0,Y=1：P=1, Q=NOT(1・0)=1 → Z=NOT(1・1)=0
  | X=1,Y=0：P=1, Q=1 → Z=0
  | X=1,Y=1：P=NOT(1)=0, Q=NOT(0・0)=1 → Z=NOT(0・1)=1
  同じときだけ1になるので、正解は<b>ウ</b>です。
choices:
  ア: ANDだけの回路です。Z＝(X・Y)・(X̄・Ȳ)。XとX̄が同時に1になることはないので、<b>常に0</b>になります。誤り。
  イ: ORだけの回路です。Z＝(X＋Y)＋(X̄＋Ȳ)。XかX̄のどちらかは必ず1なので、<b>常に1</b>になります。誤り。
  ウ: NANDだけの回路で、Z＝X・Y＋X̄・Ȳ（一致回路）になります。<b>正解</b>。
  エ: NORだけの回路です。上のNOR＝NOT(X＋Y)＝X̄・Ȳ、下のNOR＝NOT(X̄＋Ȳ)＝X・Y、最後のNORでZ＝NOT(X̄・Ȳ＋X・Y)。一致回路を<b>反転</b>したもの、つまり<b>XとYが異なるときだけ1</b>（XOR）になります。誤り。
example: |
  2人の回答が「同じなら正解音が鳴る」クイズの判定機を想像してください。2人とも「○」でも、2人とも「×」でも鳴り、意見が分かれたら鳴りません。これが一致回路（XNOR）です。逆に「意見が分かれたら鳴る」のがXORです。
review:
  - 一致回路（XNOR）の式 X・Y ＋ X̄・Ȳ と、不一致回路（XOR）の違いを区別する。
  - NANDを2段重ねると「AND-OR」になる（ド・モルガンの法則）ことを、式変形で説明できるようにする。
  - 迷ったら4通りの入力（00,01,10,11）を代入して真理値表を作り確かめる。
