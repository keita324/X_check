q: 62
answer: イ
theme: |
  経済産業省の「DX推進指標」で、DXを支えるITシステムに求められる要素として経営者が確認すべき事項を選ぶ問題です。DXに必要なITシステムの方向性を理解しているかが問われます。
basics: |
  <b>DX（デジタルトランスフォーメーション）</b>：データとデジタル技術を活用して、製品・サービスやビジネスモデル、組織そのものを変革し、競争上の優位性を確立することです。
  <b>DX推進指標</b>：企業が自社のDXの進み具合を自己診断するために、経済産業省がまとめた指標です。

  DXを実現するITシステムに求められる主な要素
  - <b>スピード・アジリティ</b>：環境変化に迅速に対応し、求められるスピードで新しい機能を提供（デリバリー）できること。
  - <b>データ活用</b>：データをリアルタイムに使いこなせること。
  - <b>全社最適</b>：部署ごとにバラバラ（個別最適）ではなく、全社でデータやシステムを連携できること。
  逆に、部署ごとに作り込まれて複雑化・ブラックボックス化した古いシステム（レガシーシステム）は、DXの足かせになるとされています。
reasoning: |
  1. DXでは、環境の変化に合わせて素早くサービスを変えられることが重要です。
  2. 「環境変化に迅速に対応し、求められるデリバリースピードに対応できるITシステムとなっているか」は、スピード・アジリティの観点そのものです。
  3. ウ（リアルタイム性より事後分析）、エ（全体最適より個別最適）は、DXが目指す方向と<b>逆</b>です。アは「ITシステムに求められる要素」ではなく、人材についての項目です。
  4. 正解は<b>イ</b>です。
choices:
  ア: ITシステムの全体設計やベンダー選定ができる人材の育成・確保は、DX推進指標では「人材」に関する項目です。「ITシステムに求められる要素」の確認事項ではありません。誤り。
  イ: 環境変化に迅速に対応し、求められるデリバリースピードに対応できるITシステムになっているか。DXのITシステムに求められる「スピード・アジリティ」の確認事項です。<b>正解</b>。
  ウ: DXでは、データを<b>リアルタイムに</b>活用できることが求められます。「リアルタイム性よりも事後の分析を重視」は逆なので誤り。
  エ: DXでは、部署ごとの個別最適ではなく、データを全社で活用できる<b>全体最適</b>が求められます。逆なので誤り。
example: |
  タクシー配車アプリは、利用者の位置情報をリアルタイムで使い、需要の変化に合わせて機能を素早く追加しています。もし部署ごとに別々の古いシステムで、改修に1年かかるようでは、このような変化には対応できません。
review:
  - DXのITシステムに求められる要素＝スピード・アジリティ（迅速な変化対応）、データのリアルタイム活用、全社最適。
  - 「個別最適」「事後分析重視」はDXの方向と逆。人材の確保は「ITシステムの要素」ではなく人材の項目。
