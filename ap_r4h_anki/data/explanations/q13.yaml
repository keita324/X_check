q: 13
answer: ア
category: システム構成要素
theme: |
  ホットスタンバイシステムで、現用系（本番機）の故障を検知して待機系（予備機）に自動で切り替えるきっかけとして、最も適切な仕組みを選ぶ問題です。
basics: |
  <b>デュプレックスシステム</b>：本番で処理を行う<b>現用系</b>と、故障に備えて待つ<b>待機系</b>の2系統で構成するシステムです。
  <b>ホットスタンバイ</b>：待機系をいつでも引き継げる状態で起動させておき、現用系が故障したら<b>すぐに自動で</b>切り替える方式です（すぐ切り替えられない待機方式はコールドスタンバイ）。

  <b>ハートビート</b>：現用系が待機系へ「生きています」というメッセージ（心拍のような信号）を定期的に送る仕組みです。待機系は、この信号が一定時間届かなくなったら現用系が故障したと判断し、処理を引き継ぎます。
reasoning: |
  1. ホットスタンバイでは、人の判断を待たずに自動で、しかも速やかに切り替えることが重要です。
  2. そのための代表的な仕組みが、ハートビート（動作中を示す定期メッセージ）です。メッセージが途切れたことを、現用系の障害とみなして切り替えます。
  3. 「現用系から待機系へ定期的に送信され、現用系が動作中であることを示すメッセージが途切れたとき」という<b>ア</b>が正解です。
choices:
  ア: 現用系が動作中であることを示す定期的なメッセージ（ハートビート）が途切れたら切り替える。ホットスタンバイの代表的な切替え契機です。<b>正解</b>。
  イ: オペレータが障害を認識してコンソール操作を行うのは手動での切替えで、人の対応を待つ分だけ時間がかかります。ホットスタンバイの自動切替えの契機としては最も適切とはいえません。誤り。
  ウ: 処理の残量が一定量を超えるのは、処理が混んでいる（負荷が高い）ことを示すだけで、障害とは限りません。負荷分散の判断材料であり、障害時の切替え契機ではありません。誤り。
  エ: 待機系から診断プログラムを現用系に定期的にロードして実行させるのは、本番処理中の現用系に負担をかけるうえ、現用系が停止していればプログラムを動かすこともできません。一般的な切替え方式ではありません。誤り。
example: |
  一人暮らしの高齢者と家族が「毎朝8時に『おはよう』とメッセージを送る」と約束しておき、メッセージが届かなかったら家族がすぐ駆けつける、という見守りの仕組みと同じです。「連絡が途絶えたら異常」とみなすのがハートビートの考え方です。
review:
  - ホットスタンバイの切替え契機＝ハートビート（現用系からの定期的な生存通知）が途絶えたとき。
  - ホットスタンバイは待機系を起動状態で待たせ、障害時に自動で速やかに切り替える方式。
