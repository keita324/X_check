q: 13
answer: イ
category: システム構成要素
theme: |
  サーバの処理能力を調整する用語「スケールイン」の意味を、スケールアウト・スケールアップ・スケールダウンと区別する問題です。
basics: |
  システムの処理能力を変える方法は、「台数を変える」か「1台の性能を変える」かで4つの用語があります。
  | 台数を増やす：<b>スケールアウト</b>
  | 台数を減らす：<b>スケールイン</b>
  | 1台の性能（CPU・メモリなど）を上げる：<b>スケールアップ</b>
  | 1台の性能を下げる：<b>スケールダウン</b>
  覚え方：「アウト／イン」は外へ広げる・内へ縮める＝<b>台数</b>、「アップ／ダウン」は上げる・下げる＝<b>性能</b>。
  クラウドでは、アクセスの増減に合わせて自動でスケールアウト・スケールインする（オートスケール）ことがよくあります。
reasoning: |
  1. スケールインは「サーバの台数を減らす」ことです。
  2. 「想定される処理量に対してサーバの台数が過剰なとき、サーバの台数を減らすこと」という<b>イ</b>が正解です。
choices:
  ア: CPUの能力（1台の性能）を減らすのは<b>スケールダウン</b>です。誤り。
  イ: 処理量に対してサーバの台数が過剰なときに、台数を減らすのは<b>スケールイン</b>です。<b>正解</b>。
  ウ: サーバの台数が不足するときに、台数を増やすのは<b>スケールアウト</b>です。誤り。
  エ: メモリの容量を増やす（1台の性能を上げる）のは<b>スケールアップ</b>です。誤り。
example: |
  お店のレジに例えると、お客さんが少ない時間にレジを5台から3台に減らすのがスケールイン、混む時間に増やすのがスケールアウトです。レジ係をベテランに替えて1台の処理を速くするのがスケールアップです。
review:
  - スケールイン＝台数を減らす、スケールアウト＝台数を増やす。
  - スケールアップ／ダウン＝1台の性能（CPU・メモリ）を上げる／下げる。
