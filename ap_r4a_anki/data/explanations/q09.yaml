q: 9
answer: イ
theme: |
  キャッシュメモリへの書込み方式のうち「ライトスルー方式」の説明を選ぶ問題です。対になる「ライトバック方式」との違いがポイントです。
basics: |
  <b>主記憶（メインメモリ）</b>：プログラムやデータを置いておく大容量のメモリ。ただしCPUから見ると遅い。
  <b>キャッシュメモリ</b>：CPUと主記憶の間に置く、小容量だが高速なメモリ。よく使うデータのコピーを置いておき、主記憶まで取りに行く回数を減らします。

  データを<b>書き換える</b>とき、キャッシュにあるコピーと主記憶の元データの両方をどう更新するかで2つの方式があります。
  - <b>ライトスルー</b>：書込みのたびに、キャッシュと主記憶の<b>両方に同時に</b>書く。常に内容が一致して安全だが、毎回主記憶へ書くので遅く、バス（データの通り道）が混む。
  - <b>ライトバック</b>：まずキャッシュにだけ書く。そのデータがキャッシュから<b>追い出されるとき</b>にまとめて主記憶へ書き戻す。速いが、一時的に主記憶の内容が古くなる。
reasoning: |
  1. 「スルー（通り抜ける）」という名前のとおり、書込みがキャッシュを通り抜けて主記憶まで届く方式です。
  2. つまり「キャッシュメモリと主記憶の両方に同時にデータを書き込む」が定義です。
  3. これは選択肢<b>イ</b>です。ア・ウ・エはライトバック方式の特徴です。
choices:
  ア: キャッシュメモリ<b>だけ</b>に書き込むのは、ライトバック方式の書込み時の動作です。誤り。
  イ: キャッシュと主記憶の両方に同時に書き込む。ライトスルー方式の定義です。<b>正解</b>。
  ウ: 主記憶の更新をキャッシュから追い出される時に行うのは、ライトバック方式です。誤り。
  エ: 主記憶へのアクセスが少なくバスの占有率が低いのは、ライトバック方式の<b>長所</b>です。ライトスルーは毎回主記憶に書くので、逆にバス占有率が高くなります。誤り。
example: |
  机の上のメモ（キャッシュ）と、事務所の共有台帳（主記憶）を想像してください。
  - ライトスルー：メモを書き直すたびに、すぐ台帳も書き直しに行く。台帳は常に最新だが、毎回歩いて行くので手間がかかる。
  - ライトバック：メモだけ書き直しておき、メモを片付けるときにまとめて台帳に反映する。楽だが、その間、台帳は古いまま。
review:
  - ライトスルー＝「毎回、キャッシュと主記憶の両方に書く」、ライトバック＝「追い出す時に主記憶へ書く」を区別する。
  - バス占有率が低い・主記憶へのアクセスが少ないのはライトバックの長所であることを覚える。
