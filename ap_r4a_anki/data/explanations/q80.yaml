q: 80
answer: ア
theme: |
  ソフトウェアやデータに欠陥があったときに、製造物責任法（PL法）の対象になるのはどれかを問う問題です。PL法の「製造物」の定義がポイントです。
basics: |
  <b>製造物責任法（PL法）</b>：製品の欠陥によって、人の生命・身体や財産に被害が出たとき、被害者が製造業者の過失を証明しなくても、製造業者に損害賠償を求められるようにする法律です。
  <b>製造物</b>：PL法の対象となる「製造物」は、<b>製造又は加工された動産</b>（形のある、持ち運べる物）と定義されています。

  そのため、
  - ソフトウェアやデータ<b>単体</b>は、形のない情報（無体物）なので、PL法の「製造物」には当たりません。
  - ただし、ソフトウェアが組み込まれた<b>機器</b>は動産なので製造物に当たり、ソフトウェアの欠陥が原因でその機器が事故を起こせば、機器の欠陥としてPL法の対象になり得ます。
reasoning: |
  1. 選択肢のうち、形のある「動産」はどれかを考えます。
  2. ア「ROM化したソフトウェアを内蔵した組込み機器」は、機器そのものが動産なので製造物に当たり、内蔵ソフトウェアの欠陥は機器の欠陥としてPL法の対象になります。
  3. イ・ウ・エは、いずれもソフトウェアやデータそのもの（無体物）なので、PL法の製造物には当たりません。
  4. 正解は<b>ア</b>です。
choices:
  ア: ソフトウェアを内蔵した組込み機器は動産（製造物）なので、ソフトウェアの欠陥による事故はPL法の対象になり得ます。<b>正解</b>。
  イ: アプリケーションソフトウェアパッケージは、ソフトウェアそのものなので、PL法の製造物には当たりません（記録媒体に入っていても、問題となるのは媒体ではなくソフトウェアの内容です）。誤り。
  ウ: 利用者がPCにインストールしたOSも、ソフトウェア単体なので製造物に当たりません。誤り。
  エ: ネットワークからダウンロードされたデータは無体物で、製造物に当たりません。誤り。
example: |
  電子レンジの制御プログラムにバグがあって加熱が止まらず火事になった場合、電子レンジ（動産）の欠陥としてメーカーはPL法の責任を問われ得ます。一方、スマホのアプリにバグがあってデータが消えても、アプリそのものはPL法の対象外です（契約上の責任など、別の法律の問題になります）。
review:
  - PL法の製造物＝製造又は加工された「動産」。ソフトウェアやデータ単体は対象外。
  - ソフトウェアを組み込んだ機器は製造物に当たり、ソフトウェアの欠陥も機器の欠陥としてPL法の対象になり得る。
