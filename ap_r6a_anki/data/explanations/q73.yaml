q: 73
answer: イ
category: 業務分析・データ利活用
theme: |
  部品の構成表と在庫表から、製品を作るのに本当に追加で必要な部品の数「正味所要量」を求める問題です（MRP：資材所要量計画の基本計算）。
basics: |
  <b>構成表</b>：製品1個を作るのに、どの部品が何個必要かを示す表です。この問題では、製品Aは「部品a 3個＋部品b 2個」、部品aは「部品b 1個＋部品c 2個」でできています（部品aは中間部品）。
  <b>総所要量</b>：作るために必要な数の合計。
  <b>正味所要量</b>：総所要量から<b>在庫量を差し引いた</b>、新たに用意する必要がある数。
  | 正味所要量 ＝ 総所要量 − 在庫量（引当残などがない場合）
  計算は、<b>上位の品目から順に</b>行います。上位の品目の在庫を先に差し引くことで、下位の部品の必要数が減るためです。
reasoning: |
  <b>① 製品A</b>
  | 総所要量300個 − 在庫100個 ＝ 正味所要量 <b>200個</b>（実際に組み立てる数）
  <b>② 部品a</b>（A 1個に3個）
  | 総所要量：200 × 3 ＝ 600個
  | 正味所要量：600 − 在庫100 ＝ <b>500個</b>（実際に作る数）
  <b>③ 部品b</b>（A 1個に2個、a 1個に1個）
  | Aの組立て用：200 × 2 ＝ 400個
  | aの製造用：500 × 1 ＝ 500個
  | 総所要量：400 ＋ 500 ＝ 900個
  | 正味所要量：900 − 在庫300 ＝ <b>600個</b>
  正解は<b>イ</b>です。
choices:
  ア: 200個は、製品Aの正味所要量（300−100）と同じ値で、部品bの必要数ではありません。誤り。
  イ: Aの組立て用400個と部品aの製造用500個を合わせた総所要量900個から、bの在庫300個を引いた600個が正味所要量です。<b>正解</b>。
  ウ: 900個は部品bの総所要量で、在庫300個を差し引いていません。誤り。
  エ: 1,500個は、製品A・部品a・部品bの在庫を一切差し引かずに計算した値（A 300個×2＋a 900個×1）です。在庫を考慮していないので誤り。
example: |
  カレーを300皿出すのに、作り置きが100皿あれば、新たに作るのは200皿です。1皿にじゃがいも2個が必要なら400個、さらに付け合わせのポテトサラダ（中間品）にもじゃがいもを使う…と、上から順に在庫を差し引きながら計算するのが正味所要量の考え方です。
review:
  - 正味所要量＝総所要量−在庫量。上位品目（製品→中間部品→部品）の順に在庫を差し引いて計算する。
  - 部品bはAの直接使用分とaの製造用の両方に使われる。両方を合計してから在庫を引く。
