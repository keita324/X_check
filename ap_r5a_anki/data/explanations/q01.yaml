q: 1
answer: ウ
category: 基礎理論
theme: |
  2桁の2進数 x<sub>1</sub>x<sub>2</sub> の桁を入れ替えた数 x<sub>2</sub>x<sub>1</sub> を、元の数 x と int（切捨て）を使った式で表す問題です。
basics: |
  <b>2進数の値</b>：2桁の2進数 x<sub>1</sub>x<sub>2</sub>（x<sub>1</sub>が上の桁、x<sub>2</sub>が下の桁）の値は
  | x ＝ 2 × x<sub>1</sub> ＋ x<sub>2</sub>
  です（10進数の「23 ＝ 10×2＋3」と同じ考え方で、2進数では上の桁の重みが2）。

  <b>int(r)</b>：小数点以下を切り捨てた整数。例：int(3/2) ＝ int(1.5) ＝ 1。
  x を2で割って切り捨てると、上の桁 x<sub>1</sub> だけが取り出せます。
  | int(x/2) ＝ x<sub>1</sub>　（x<sub>2</sub> は0か1なので、2で割ると0.5以下になり切り捨てられる）
reasoning: |
  1. 各桁を x で表します。
  | x<sub>1</sub> ＝ int(x/2)
  | x<sub>2</sub> ＝ x − 2x<sub>1</sub> ＝ x − 2int(x/2)
  2. 桁を入れ替えた数 x<sub>2</sub>x<sub>1</sub> の値は、x<sub>2</sub>が上の桁になるので
  | 2 × x<sub>2</sub> ＋ x<sub>1</sub>
  3. 1の式を代入します。
  | ＝ 2{x − 2int(x/2)} ＋ int(x/2)
  | ＝ 2x − 4int(x/2) ＋ int(x/2)
  | ＝ <b>2x − 3int(x/2)</b>
  4. 検算：x＝2（10₂）なら、入れ替えると 01₂＝1。式は 2×2 − 3×int(1) ＝ 4 − 3 ＝ 1 で一致。
  | x＝1（01₂）→ 10₂＝2：2×1 − 3×int(0.5) ＝ 2 − 0 ＝ 2 で一致。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 2x ＋ 4int(x/2) は、x＝2 のとき 4 ＋ 4 ＝ 8 となり、正しい値1と一致しません。誤り。
  イ: 2x ＋ 5int(x/2) は、x＝2 のとき 4 ＋ 5 ＝ 9 となり、一致しません。誤り。
  ウ: 2x − 3int(x/2)。x＝0,1,2,3 のすべてで、桁を入れ替えた値（0,2,1,3）と一致します。<b>正解</b>。
  エ: 2x − 4int(x/2) は、x＝2 のとき 4 − 4 ＝ 0 となり、正しい値1と一致しません（x<sub>1</sub>の分を足し忘れた式です）。誤り。
example: |
  10進数で考えると、2桁の数 x ＝ 47 の桁を入れ替えた 74 は、上の桁 int(47/10)＝4 と下の桁 47−10×4＝7 を取り出して、10×7＋4 と計算できます。この問題は、同じことを2進数（重みが2）で行っています。
review:
  - 2進数2桁の値は x ＝ 2x<sub>1</sub>＋x<sub>2</sub>。上の桁は int(x/2)、下の桁は x−2int(x/2) で取り出せる。
  - 式を選ぶ問題は、x＝0〜3 などの具体的な値を代入して検算する。
