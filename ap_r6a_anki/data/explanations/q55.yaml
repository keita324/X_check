q: 55
answer: エ
category: サービスマネジメント
theme: |
  サービスの中断からの復旧目標を表す3つの指標（RTO・RPO・RLO）のうち、RTOとRLOの2つを定めた例を選ぶ問題です。
basics: |
  - <b>RTO（Recovery Time Objective：目標復旧時間）</b>：サービスの中断から、<b>どれだけの時間以内に</b>復旧させるか。例：「中断から1日以内に」「1時間以内に」。
  - <b>RPO（Recovery Point Objective：目標復旧時点）</b>：<b>どの時点の状態までデータを</b>戻すか（どれだけのデータ損失を許容するか）。例：「中断の3時間前の状態に」「直前の状態に」。
  - <b>RLO（Recovery Level Objective：目標復旧レベル）</b>：<b>どの程度のレベル（範囲・水準）まで</b>サービスを復旧させるか。例：「重要なサービスに限定して」「利用者の50%以上に」。
reasoning: |
  各選択肢に含まれる指標を見分けます。
  1. ア：「中断する3時間前の時点の状態にデータを復旧」＝RPO、「利用者の50%以上にサービスを提供」＝RLO → RPOとRLO。
  2. イ：「中断する直前の状態にデータを復旧」＝RPO、「サービス終了時刻を延長」は運用上の対応 → RTOを定めていない。
  3. ウ：「中断から1時間以内に」＝RTO、「1時間前の状態にデータを復旧」＝RPO → RTOとRPO。
  4. エ：「中断から1日以内に」＝RTO、「重要なサービスに限定して復旧」＝RLO → <b>RTOとRLO</b>。
  5. 正解は<b>エ</b>です。
choices:
  ア: 「3時間前の時点の状態にデータを復旧」はRPO、「利用者の50%以上に提供」はRLOで、RTO（復旧までの時間）が定められていません。誤り。
  イ: 「直前の状態にデータを復旧」はRPOで、復旧までの時間（RTO）も、復旧のレベル（RLO）も定められていません。誤り。
  ウ: 「1時間以内に」はRTO、「1時間前の状態にデータを復旧」はRPOで、RLOが定められていません。誤り。
  エ: 「中断から1日以内に」はRTO、「重要なサービスに限定して復旧」はRLOで、RTOとRLOを定めた例です。<b>正解</b>。
example: |
  停電したお店の再開計画で考えると、「停電から2時間以内に再開する」がRTO、「レジの記録は停電の1時間前までの分を復元する」がRPO、「まずはお弁当の販売だけ再開する」がRLOです。
review:
  - RTO＝いつまでに（中断からの時間）、RPO＝どの時点のデータまで、RLO＝どのレベル・範囲まで。
  - 選択肢の文を「時間」「データの時点」「サービスの範囲・水準」に分解して、どの指標かを判断する。
