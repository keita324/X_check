q: 29
answer: ウ
theme: |
  データベースの障害回復で、チェックポイントとログを使い「前進復帰（ロールフォワード）」で回復できるトランザクションを、図から判断する問題です。
basics: |
  <b>トランザクション</b>：「振込で口座Aから引いて口座Bに足す」のように、ひとまとまりで実行すべき処理の単位です。
  <b>コミット</b>：トランザクションの処理を確定させること。コミットしたものは、障害が起きても必ず反映させなければなりません。

  <b>チェックポイント</b>：メモリ上の更新内容を、定期的にディスク上のデータベースへ書き出す時点です。チェックポイント時点で確定している内容は、ディスクに安全に保存されています。
  <b>ログ</b>：更新の前後の値を時系列で記録したもの。障害回復に使います。

  <b>システム障害（停電やOSの停止など）時の回復</b>
  - <b>ロールフォワード（前進復帰）</b>：チェックポイント以降にコミットしたトランザクションは、更新がディスクに書かれていない可能性があるので、ログの<b>更新後の値</b>を使ってやり直し、確定させる。
  - <b>ロールバック（後退復帰）</b>：障害発生時にまだコミットしていないトランザクションは、ログの<b>更新前の値</b>で元に戻し、なかったことにする。
reasoning: |
  図の各トランザクションを「いつ始まり、いつコミットしたか」で分類します。
  | T1：チェックポイントより前にコミット → 既にディスクに反映済み。回復処理不要
  | T2：チェックポイント前に開始、障害時に未コミット → ロールバック
  | T3：チェックポイント後に開始、障害時に未コミット → ロールバック
  | T4：チェックポイント前に開始、チェックポイント後・障害前にコミット → ロールフォワード
  | T5：チェックポイント後に開始、障害前にコミット → ロールフォワード
  ロールフォワードで回復するのは、「チェックポイント後、障害発生前にコミットした」T4とT5です。正解は<b>ウ</b>です。
choices:
  ア: T1はチェックポイント前にコミット済みで、その更新はチェックポイントでディスクに書き出されています。回復処理は不要です。誤り。
  イ: T2とT3は障害発生時にコミットしていないので、ロールフォワードではなくロールバック（取り消し）の対象です。誤り。
  ウ: T4とT5は、チェックポイント後・障害前にコミットしているので、ログの更新後の値でロールフォワードします。<b>正解</b>。
  エ: T5は正しいですが、T4もチェックポイント後にコミットしているのでロールフォワードの対象です。「全て挙げた」ことにならないので誤り。
example: |
  ゲームのセーブ（チェックポイント）に例えると、停電でゲームが落ちたとき、セーブ以前の進行は無事です（T1）。セーブ後に「完了」したクエスト（T4、T5）は、冒険の記録（ログ）を見て再現し直します。途中だったクエスト（T2、T3）は、なかったことにしてやり直しです。
review:
  - チェックポイント後〜障害前にコミット → ロールフォワード（ログの更新後情報で再実行）。
  - 障害時に未コミット → ロールバック（ログの更新前情報で取り消し）。チェックポイント前にコミット → 処理不要。
  - 開始時刻ではなく「コミットした時刻」がどこにあるかで判断する（T4は開始がチェックポイント前でも対象）。
