q: 36
answer: ウ
category: セキュリティ
theme: |
  パスワードを破る攻撃手法のうち、「レインボーテーブル攻撃」の仕組みを選ぶ問題です。
basics: |
  <b>ハッシュ値</b>：データをハッシュ関数という計算に通して得られる、決まった長さの値です。元のデータが同じなら同じ値になりますが、ハッシュ値から元のデータを逆算することは困難です。そのため、多くのシステムはパスワードを<b>そのまま保存せず、ハッシュ値にして保存</b>しています。

  <b>レインボー攻撃</b>：攻撃者は、大量の「平文のパスワード候補とそのハッシュ値」の対応表を<b>事前に</b>計算して用意しておきます。この表は、<b>チェーン</b>という工夫で、全部を保存しなくても済むように圧縮されています（レインボーテーブル）。漏えいしたハッシュ値をこの表で照合し、元のパスワードを素早く割り出します。
  対策：パスワードごとに異なるランダムな値（<b>ソルト</b>）を加えてからハッシュ化すると、事前に作った表が使えなくなります。
reasoning: |
  1. レインボー攻撃のキーワードは「平文とハッシュ値をチェーンで管理するテーブル」「不正に入手したハッシュ値から解読」です。
  2. 選択肢の中でこの点を正しく述べているのは<b>ウ</b>です。
choices:
  ア: 事前に入手した利用者IDとパスワードのリストを使い、使い回しを狙って他のシステムにログインを試すのは<b>パスワードリスト攻撃（リスト型攻撃）</b>です。誤り。
  イ: パスワードになり得る文字列のすべてを総当たりで試すのは<b>ブルートフォース攻撃（総当たり攻撃）</b>です。誤り。
  ウ: 平文のパスワードとハッシュ値をチェーンで管理するテーブルを準備しておき、入手したハッシュ値からパスワードを解読するのは<b>レインボー攻撃</b>です。<b>正解</b>。
  エ: 誕生日や電話番号などの個人情報を言葉巧みに聞き出してパスワードを類推するのは、<b>ソーシャルエンジニアリング</b>の手口です。誤り。
example: |
  暗号化された答案（ハッシュ値）を盗んだ人が、あらかじめ作っておいた「答えと暗号の対照表」（レインボーテーブル）を引いて、元の答えを一瞬で見つけるようなものです。答案ごとに違う「おまじない」（ソルト）を混ぜてから暗号化しておけば、事前に作った対照表は役に立たなくなります。
review:
  - レインボー攻撃＝事前に作った「平文とハッシュ値の対応表（チェーンで圧縮）」で、漏えいしたハッシュ値からパスワードを割り出す。対策はソルト。
  - パスワードリスト攻撃（使い回し狙い）、ブルートフォース（総当たり）、ソーシャルエンジニアリング（聞き出し）と区別する。
