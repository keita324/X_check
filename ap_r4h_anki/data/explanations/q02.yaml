q: 2
answer: ア
category: 基礎理論
theme: |
  集合の演算（和集合・積集合・補集合・差集合）を使って、「Aでもなく、Bでもない」部分（A̅∩B̅）と同じ集合を表す式を選ぶ問題です。
basics: |
  <b>全体集合S</b>：考えている要素すべての集まり。A、BはSの一部です。
  - <b>和集合 A∪B</b>：AかBの少なくとも一方に入っている要素（「または」）。
  - <b>積集合 A∩B</b>：AとBの両方に入っている要素（「かつ」）。
  - <b>補集合 A̅</b>：Sの中で、Aに入っていない要素（「Aでない」）。A̅ ＝ S−A です。
  - <b>差集合 A−B</b>：Aに入っていて、Bには入っていない要素。A−B ＝ A∩B̅ です。

  <b>ド・モルガンの法則</b>：A̅∩B̅ ＝ (A∪B)の補集合、A̅∪B̅ ＝ (A∩B)の補集合。
reasoning: |
  1. A̅∩B̅ は「Aでない、かつBでない」要素、つまりAにもBにも入っていない部分（ベン図の外側の部分）です。
  2. 差集合の性質「X−Y ＝ X∩Y̅」を使うと、
  | ア：A̅ − B ＝ A̅ ∩ B̅
  となり、問題の集合と同じです。
  3. 他の選択肢は、いずれも A̅∪B̅（「Aでない、またはBでない」＝A∩Bの外側すべて）に等しく、A̅∩B̅ より広い集合です。
  4. 正解は<b>ア</b>です。
choices:
  ア: A̅−B は「Aでない要素のうち、Bにも入っていないもの」で、A̅∩B̅ と一致します。<b>正解</b>。
  イ: A̅∪B̅ は (A∩B) の外側全部なので、そこから A∩B を除いても何も減らず、結果は A̅∪B̅ です。「Aだけに入っている要素」なども含んでしまうので誤り。
  ウ: (S−A)∪(S−B) ＝ A̅∪B̅ で、「Aでない、<b>または</b>Bでない」要素です。「かつ」ではないので誤り。
  エ: S−(A∩B) は、A∩B 以外のすべての要素で、A̅∪B̅ と同じです。誤り。
example: |
  クラス全員（S）のうち、A＝「犬を飼っている人」、B＝「猫を飼っている人」とすると、A̅∩B̅ は「犬も猫も飼っていない人」です。「犬を飼っていない人の中から、猫を飼っている人を除く」（ア）と同じ人たちになります。「犬か猫のどちらかを飼っていない人」（ウ・エ）では、犬だけ飼っている人も含まれてしまいます。
review:
  - 差集合 X−Y ＝ X∩Y̅ の関係を使って、A̅−B ＝ A̅∩B̅ を導けるようにする。
  - A̅∩B̅（どちらでもない）と A̅∪B̅（少なくとも一方でない）をベン図で区別する。
