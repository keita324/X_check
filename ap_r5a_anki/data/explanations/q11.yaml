q: 11
answer: イ
category: コンピュータ構成要素
theme: |
  画面に表示する画像を置くメモリ（フレームバッファ）を、主記憶と共用する「ユニファイドメモリ方式」の特徴を問う問題です。
basics: |
  <b>フレームバッファ</b>：画面に表示する1画面分の画像データ（各画素の色）を保持するメモリ領域です。ディスプレイは、この内容を一定間隔で読み出して表示します。
  フレームバッファの置き方には2つの方式があります。
  - <b>専用メモリ方式</b>：グラフィックスボード（GPU）に、主記憶とは<b>別の専用メモリ（VRAM）</b>を持つ。高速だが部品が増える。
  - <b>ユニファイドメモリ方式（UMA）</b>：<b>主記憶の一部</b>をフレームバッファ（表示領域）として共用する。部品を減らしてコストや消費電力を抑えられるが、CPUとメモリを取り合うため性能面では不利になることがある。CPU内蔵グラフィックスなどで使われる。
reasoning: |
  1. 「ユニファイド（unified＝統一された）メモリ」は、CPUが使う主記憶と、表示用のメモリを1つにまとめた方式です。
  2. 「主記憶の一部を表示領域として使用する」という<b>イ</b>が正解です。
choices:
  ア: 主記憶とは別に専用のフレームバッファ（VRAM）をもつのは、<b>専用メモリ方式</b>です。ユニファイドメモリ方式の逆です。誤り。
  イ: 主記憶の一部を表示領域（フレームバッファ）として使用するのが、ユニファイドメモリ方式です。<b>正解</b>。
  ウ: シリアル接続した表示デバイスに描画コマンドを送って表示するのは、小型の液晶モジュールなどで使われる方式で、フレームバッファの置き場所に関する方式ではありません。誤り。
  エ: 表示リフレッシュ（フレームバッファの内容を繰り返し読み出して画面を描き直すこと）は、ユニファイドメモリ方式でも必要です。誤り。
example: |
  一人暮らしのワンルーム（ユニファイドメモリ）では、同じ机を勉強にも食事にも使います。部屋は少なくて済みますが、食事中は勉強道具を広げにくくなります。専用の勉強机（専用VRAM）があれば快適ですが、その分スペースとお金がかかります。
review:
  - ユニファイドメモリ方式＝主記憶の一部をフレームバッファとして共用（低コスト・省電力、メモリ帯域を取り合う）。
  - 専用メモリ方式＝主記憶とは別にVRAMを持つ。どちらの方式でも表示リフレッシュは必要。
