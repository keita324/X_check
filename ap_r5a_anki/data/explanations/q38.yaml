q: 38
answer: ウ
category: セキュリティ
theme: |
  自社のメール中継サーバのログから、外部の第三者に勝手にメールの中継をさせられている「第三者中継（オープンリレー）」を見つける問題です。
basics: |
  <b>メール中継サーバ</b>：メールを受け取って、宛先のメールサーバへ転送するサーバです。本来、自社のメールサーバが中継してよいのは次の2つだけです。
  - 自社から外部へ送るメール（送信者が自社）
  - 外部から自社宛てに届くメール（受信者が自社）
  <b>第三者中継</b>：<b>自社とは関係のない外部の人が、外部の宛先へ</b>送るメールを、自社のサーバが中継してしまうことです。スパムメールの送信に悪用され、自社が迷惑メールの発信源とみなされてしまいます。

  この問題の条件
  | 自社のIPアドレス：AAA.168.1.5、AAA.168.1.10、自社のドメイン：a.b.c
  | 社外のIPアドレス：BBB.45.67.89、BBB.45.67.90、他社のドメイン：a.b.d、a.b.e
reasoning: |
  各ログが、どこから来て、誰から誰へのメールかを確認します。
  1. ア：接続元が自社、送信者が自社、受信者が他社 → 自社から外部への<b>通常の送信</b>。
  2. イ：接続元が自社、送信者・受信者とも自社 → <b>社内のメール</b>。
  3. ウ：接続元が<b>社外</b>、送信者が<b>他社</b>（a.b.d）、受信者も<b>他社</b>（a.b.e）→ 自社と無関係な外部から外部へのメールを中継している → <b>第三者中継</b>。
  4. エ：接続元が社外、送信者が他社、受信者が自社 → 外部から自社宛ての<b>通常の受信</b>。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 自社のIPアドレスから、自社ドメインの送信者が他社宛てに送ったメールで、通常の外部への送信です。第三者中継ではありません。誤り。
  イ: 自社のIPアドレスから、自社ドメイン同士でやり取りされたメールで、通常の社内メールです。誤り。
  ウ: 社外のIPアドレスから、他社ドメインの送信者が他社ドメイン宛てに送ったメールを中継しており、外部ネットワークからの第三者中継です。<b>正解</b>。
  エ: 社外から自社ドメイン宛てに届いたメールを受け取ったもので、通常の受信です。第三者中継ではありません。誤り。
example: |
  会社の郵便室が、社員が出す手紙と、社員宛てに届く手紙を扱うのは当然です。しかし、見知らぬ人がやって来て「この手紙を別の会社に届けて」と頼み、郵便室がそれを引き受けてしまうのが第三者中継です。迷惑な手紙を大量に出す人に利用されてしまいます。
review:
  - 第三者中継＝接続元・送信者・受信者のいずれも自社と無関係な（外部→外部の）メールを中継すること。スパムの踏み台になる。
  - ログは「接続元IP」「送信者ドメイン」「受信者ドメイン」の3点で、自社が関係するかを確認する。
