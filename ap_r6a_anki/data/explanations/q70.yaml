q: 70
answer: ウ
category: 技術戦略マネジメント
theme: |
  研究開発から産業化までの各段階の間にある「障壁」の呼び名（魔の川・死の谷・ダーウィンの海）と、マーケティングの「キャズム」を区別する問題です。
basics: |
  技術経営（MOT）では、研究の成果が社会で広く使われる製品になるまでに、乗り越えるべき3つの障壁があるとされます。
  | 研究 →（<b>魔の川</b>）→ 開発 →（<b>死の谷</b>）→ 事業化 →（<b>ダーウィンの海</b>）→ 産業化
  - <b>魔の川</b>：基礎研究の成果を、具体的な製品開発に結び付けるまでの障壁。
  - <b>死の谷</b>：開発した製品を事業化（製造・販売）するまでの障壁。資金や人材の不足で失敗しやすい。
  - <b>ダーウィンの海</b>：事業化した製品が、市場で<b>競合製品との生存競争</b>を勝ち抜き、産業として定着するまでの障壁。生物の自然淘汰（ダーウィンの進化論）になぞらえた名前です。
  別の分野の用語
  - <b>キャズム</b>：新製品が、新しもの好きの初期採用者（アーリーアダプター）から、慎重な多数派（アーリーマジョリティ）へ普及する間にある大きな溝。マーケティング（普及理論）の用語です。
reasoning: |
  1. 問われているのは「<b>事業化 → 産業化</b>」の段階で、「<b>競合製品との競争過程</b>」にある障壁です。
  2. 段階の並びに当てはめると、事業化と産業化の間にあるのは<b>ダーウィンの海</b>です。
  3. 正解は<b>ウ</b>です。
choices:
  ア: キャズムは、新製品の普及過程で初期採用者と多数派の間にある溝を指すマーケティング用語で、研究〜産業化の段階の障壁を表す用語ではありません。誤り。
  イ: 死の谷は、開発から事業化へ進む段階の障壁です。誤り。
  ウ: ダーウィンの海は、事業化から産業化へ進む段階で、競合製品との生存競争に勝ち残るための障壁です。<b>正解</b>。
  エ: 魔の川は、研究から開発へ進む段階の障壁です。誤り。
example: |
  大学で新しい電池材料を発見しても、製品として形にできなければ「魔の川」で止まります。試作品ができても、量産する工場の資金が集まらなければ「死の谷」に落ちます。発売できても、他社の電池との価格・性能の競争に負ければ「ダーウィンの海」で淘汰されます。
review:
  - 研究→（魔の川）→開発→（死の谷）→事業化→（ダーウィンの海）→産業化 の順で覚える。
  - ダーウィンの海＝競合との生存競争。キャズムは普及過程（初期採用者→多数派）の溝で別物。
