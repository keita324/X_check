q: 41
answer: ウ
category: セキュリティ
theme: |
  JVNなどの脆弱性情報サイトで使われている「CVE識別子」が何を識別するものかを問う問題です。
basics: |
  <b>脆弱性</b>：ソフトウェアや製品のセキュリティ上の欠陥です。
  <b>JVN（Japan Vulnerability Notes）</b>：JPCERT/CCとIPAが運営する、日本の脆弱性対策情報ポータルサイトです。
  <b>CVE（Common Vulnerabilities and Exposures）識別子</b>：<b>製品に含まれる個々の脆弱性</b>に付けられる、世界共通の識別番号です。「CVE-2021-44228」（年＋通し番号）のような形式で、同じ脆弱性について、セキュリティ製品・ニュース・ベンダーの情報などで話がかみ合うようにします。

  似た識別子・基準
  - <b>CCE</b>：セキュリティに関係する<b>設定項目</b>を識別するための識別子。
  - <b>CWE</b>：脆弱性の<b>種類（タイプ）</b>を分類する基準。
  - <b>CVSS</b>：脆弱性の<b>深刻度</b>を評価する手法。
reasoning: |
  1. CVE識別子は「製品に含まれる個々の脆弱性を識別するための識別子」です。
  2. 正解は<b>ウ</b>です。
choices:
  ア: コンピュータで必要なセキュリティ設定項目を識別するための識別子は、<b>CCE</b>です。誤り。
  イ: 改ざんされたWebサイトのスクリーンショットを識別する識別子というものは、CVEの役割ではありません。誤り。
  ウ: 製品に含まれる脆弱性を識別するための識別子は、<b>CVE</b>です。<b>正解</b>。
  エ: セキュリティ製品の種別を識別する識別子は、CVEの役割ではありません。誤り。
example: |
  病院のカルテ番号のように、「CVE-2021-44228」と言えば、世界中の誰とでも同じ脆弱性（Log4jの脆弱性）の話ができます。ニュースで「〇〇の脆弱性」と報道されたとき、CVE番号で自社の製品が対象かを調べられます。
review:
  - CVE＝製品に含まれる個々の脆弱性に付ける世界共通の識別番号（CVE-年-番号）。
  - CCE（設定項目）、CWE（脆弱性の種類）、CVSS（深刻度）と区別する。
