q: 73
answer: ア
category: 企業活動
theme: |
  4つの仕事を1台の機械で順番に行うとき、仕事の切替えにかかる「段取り時間」の合計が最小になる順番を見つけ、その合計時間を求める問題です。
basics: |
  <b>NC工作機械</b>：コンピュータ制御で金属などを加工する機械です。
  <b>段取り時間</b>：ある仕事から次の仕事に切り替えるときの、工具の交換や機械の設定変更などの準備時間です。表は「FROM（前の仕事）→TO（次の仕事）」の段取り時間で、<b>向きによって時間が違う</b>点に注意します（例：a→bは2時間、b→aは1時間）。

  4つの仕事を1回ずつ行うと、切替えは<b>3回</b>です。その3回の段取り時間の合計が最小になる順番を探します。
reasoning: |
  1. 表から、段取り時間が短い（1時間の）切替えに注目します。
  | a→c：1時間、b→a：1時間、b→c：1時間
  2. これらをできるだけつなげます。「b→a→c」とすれば、1＋1＝2時間で3つの仕事を回れます。
  3. 残りの仕事dを最後に加えます。c→d は2時間です。
  | b → a → c → d：1 ＋ 1 ＋ 2 ＝ <b>4時間</b>
  4. もっと小さくできないか確認します。3回の切替えをすべて1時間にするには、1時間の切替え（a→c、b→a、b→c）だけで4つの仕事をつなぐ必要がありますが、dへ向かう・dから出る切替えはどれも2時間以上なので不可能です。よって最小値は「1＋1＋2＝4時間」です。
  5. なお、24通りすべての順番を計算しても、最小は b→a→c→d の4時間です。正解は<b>ア</b>です。
choices:
  ア: 4時間。b→a→c→d の順で、1＋1＋2＝4時間となり、これが最小です。<b>正解</b>。
  イ: 5時間は、a→b→c→d（2＋1＋2）や a→c→b→d（1＋2＋2）などの順番の値です。最小の4時間より大きいので誤り。
  ウ: 6時間は、最小の順番を見つけられていない値です。誤り。
  エ: 7時間も、最小の順番ではありません。誤り。
example: |
  1日に「数学→英語→理科→社会」の宿題をやるとき、教科を切り替えるたびに教科書や道具を入れ替える時間がかかるとします。似た道具を使う教科を続けてやれば、切替えの手間が減ります。どの順番なら切替え時間の合計が最小になるかを探すのが、この問題です。
review:
  - FROM→TOの向きで時間が異なる表は、行（FROM）と列（TO）を取り違えないように読む。
  - 4つの仕事なら切替えは3回。短い切替えをつなげて候補を作り、その順番が最小かを確認する。
