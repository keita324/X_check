q: 53
answer: ア
category: プロジェクトマネジメント
theme: |
  アローダイアグラム（作業の順序と日数を矢印で表した図）で、作業Eを3つに分けて並行化したとき、プロジェクト全体が何日短縮できるかを、最早結合点時刻を計算して求める問題です。
basics: |
  <b>アローダイアグラム</b>：矢印が作業、丸（結合点）が作業の区切りを表す図です。ある結合点から出る作業は、その結合点に入る<b>すべての作業が終わってから</b>始められます。
  <b>最早結合点時刻</b>：各結合点に到達できる最も早い日。入ってくる矢印が複数あるときは、その中で<b>最も遅い</b>到着日になります。
  <b>クリティカルパス</b>：開始から終了までの最も長い経路。全体の日数を決めます。
  <b>ダミー作業</b>（点線の矢印）：日数0の作業で、作業の順序関係だけを表します。
reasoning: |
  <b>(1) 当初の計画（図1）</b>
  | A（5）の後：5日目、B（8）の後：13日目
  | D（7）の後：20日目 → G（7）で終点へ：27日目
  | E（9）：13 ＋ 9 ＝ 22日目
  | C（7）→ F（5）：5 ＋ 7 ＋ 5 ＝ 17日目
  | H の開始点：E と F の遅い方 ＝ 22日目 → H（4）：26日目 → I（2）：<b>28日目</b>
  | 終点：G経由27日目、I経由28日目の遅い方 → <b>28日</b>
  <b>(2) 変更後の計画（図2）</b>
  | E1（3）：13 ＋ 3 ＝ 16日目
  | E2（4）：13 ＋ 4 ＝ 17日目 → ダミーで E3 の開始点へ
  | E3 の開始点：E1（16）と E2 経由（17）の遅い方 ＝ 17日目 → E3（2）：19日目
  | H の開始点：E3（19）と F（17）の遅い方 ＝ 19日目 → H（4）：23日目 → I（2）：25日目
  | 終点：G経由27日目、I経由25日目の遅い方 → <b>27日</b>
  <b>(3) 短縮日数</b>
  | 28 − 27 ＝ <b>1日</b>
  E側の経路は3日短くなりますが、今度は A→B→D→G の経路（27日）がクリティカルパスになるため、全体は1日しか短縮できません。正解は<b>ア</b>です。
choices:
  ア: 1日。変更後はD→Gの経路（27日）がクリティカルパスとなり、28日から27日へ1日短縮されます。<b>正解</b>。
  イ: 2日は、計算結果の1日と一致しません。誤り。
  ウ: 3日は、E側の経路（A→B→E→H→I）だけを見た短縮日数（28日→25日）です。D→Gの経路（27日）が新たにクリティカルパスになることを見落としています。誤り。
  エ: 4日は、計算結果の1日と一致しません。誤り。
example: |
  2つの道を通る2人が、同じ場所で待ち合わせるとき、遅い方の到着時刻で集合時刻が決まります。遅かった1人の道を3時間短縮しても、もう1人の到着がその1時間後なら、集合時刻は1時間しか早まりません。
review:
  - 最早結合点時刻は、入ってくる作業の終了日のうち最も遅い日。ダミー作業は日数0で順序だけを表す。
  - クリティカルパス上の作業を短縮すると、別の経路が新たなクリティカルパスになることがある。全経路を計算し直して比べる。
