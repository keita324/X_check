q: 51
answer: ウ
category: プロジェクトマネジメント
theme: |
  プロジェクトマネジメントの知識エリアのうち「スコープ（作業範囲）の管理」に当たる活動を、スケジュール・コスト・資源の管理と区別する問題です。
basics: |
  <b>スコープ</b>：プロジェクトで「何を作るか・どこまでの作業をするか」という範囲のことです。成果物の範囲と、そのために必要な作業の範囲を含みます。
  <b>スコープの管理</b>：スコープを定義し、勝手に広がったり（スコープクリープ）縮んだりしないよう監視し、変更が必要なときは正式な手続きで範囲を変更する活動です。

  プロジェクトマネジメントの主な管理対象（PMBOKの知識エリアなど）
  - <b>スコープ</b>：作業の範囲（何をやるか、やらないか）
  - <b>スケジュール</b>：期間・日程
  - <b>コスト</b>：予算
  - <b>資源</b>：人や設備（要員の割当て・交代など）
reasoning: |
  1. 各選択肢が「何を変更・管理しているか」を見ます。
  2. ア：教育期間を2日延長 → 期間（スケジュール）の管理。
  3. イ：追加予算を確保 → コストの管理。
  4. ウ：外部システムとの連携作業を<b>このプロジェクトから外し</b>、別プロジェクトで行う → 作業範囲そのものの変更＝<b>スコープの管理</b>。
  5. エ：テスト担当者を交代 → 資源（要員）の管理。
  6. 正解は<b>ウ</b>です。
choices:
  ア: 教育期間の延長は、日程の調整なのでスケジュールの管理です。誤り。
  イ: 開発コストの超過に対して追加予算を確保するのは、コストの管理です。誤り。
  ウ: 連携作業を別プロジェクトで行うことにしたのは、このプロジェクトで行う作業の範囲を変更したことになるため、スコープの管理です。<b>正解</b>。
  エ: 期待した成果を出せない担当者を交代させるのは、要員（資源）の管理です。誤り。
example: |
  家のリフォームに例えると、「台所も直す予定だったけれど、今回はお風呂だけにして台所は来年別に頼む」と決めるのがスコープの変更です。工期を延ばす（スケジュール）、予算を増やす（コスト）、職人を替える（資源）とは別の話です。
review:
  - スコープ＝プロジェクトの作業範囲。作業を追加・削除・別プロジェクトへ移すのはスコープの管理。
  - 期間の延長＝スケジュール、予算の追加＝コスト、担当者の交代＝資源、と管理対象で分類する。
