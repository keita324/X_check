q: 40
answer: ア
category: セキュリティ
theme: |
  情報セキュリティの用語規格JIS Q 27000で、「認可されていない者に情報を使用させず、開示しない特性」がどの用語の定義かを問う問題です。
basics: |
  <b>JIS Q 27000</b>：情報セキュリティマネジメントシステム（ISMS）の用語を定義した規格です。主な用語は次のとおりです。
  - <b>機密性</b>：認可されていない個人、エンティティ又はプロセスに対して、情報を使用させず、また、開示しない特性。（見てよい人だけが見られる）
  - <b>完全性</b>：正確さ及び完全さの特性。（改ざんされていない）
  - <b>可用性</b>：認可されたエンティティが要求したときに、アクセス及び使用が可能である特性。（使いたいときに使える）
  - <b>真正性</b>：エンティティは、それが主張するとおりのものであるという特性。（なりすましでない）
  - <b>否認防止</b>：主張された事象又は処置の発生、及びそれを引き起こしたエンティティを証明する能力。（後から「やっていない」と言わせない）
  - <b>認証</b>：エンティティの主張された特性が正しいという保証の提供。
  <b>エンティティ</b>：利用者やシステムなど、情報にアクセスする主体のことです。
reasoning: |
  1. 「認可されていない者に対して、情報を使用させず、開示しない」は、情報を秘密に保つこと＝<b>機密性</b>の定義です。
  2. 正解は<b>ア</b>です。
choices:
  ア: 認可されていない個人、エンティティ又はプロセスに対して、情報を使用させず、また開示しない特性は<b>機密性</b>です。<b>正解</b>。
  イ: 真正性は、エンティティが、それが主張するとおりのものであるという特性（本物であること）です。誤り。
  ウ: 認証は、エンティティの主張された特性が正しいという保証を提供することです。誤り。
  エ: 否認防止は、主張された事象や処置の発生と、それを引き起こしたエンティティを証明する能力です。誤り。
example: |
  病院のカルテで考えると、担当の医師や看護師以外には見せない（機密性）、内容を勝手に書き換えさせない（完全性）、必要なときにすぐ見られる（可用性）、記入したのが本当にその医師か確認できる（真正性）、後から「記入していない」と言い逃れできない（否認防止）、という関係です。
review:
  - 機密性＝認可されていない者に情報を使用させず、開示しない特性（CIAの「C」）。
  - 完全性・可用性・真正性・否認防止・認証の定義も、それぞれ一言で言えるようにする。
