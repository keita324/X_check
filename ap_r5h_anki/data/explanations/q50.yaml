q: 50
answer: エ
category: ソフトウェア開発管理技術
theme: |
  サーバの準備・設定を自動化する「サーバプロビジョニングツール」の目的を、監視ツールや資産管理ツールと区別する問題です。
basics: |
  <b>プロビジョニング</b>：必要に応じてサーバなどのIT資源を用意し、使える状態に設定することです（OSやミドルウェアのインストール、設定ファイルの作成など）。
  <b>サーバプロビジョニングツール</b>：サーバの構成（どのソフトを入れ、どう設定するか）を<b>あらかじめファイルに記述</b>しておき、そのとおりにサーバを<b>自動で構成</b>するツールです（例：Ansible、Chef、Puppet）。
  - 手作業による設定ミスや、サーバごとの設定のばらつきを防げる。
  - 同じ構成のサーバを短時間で何台でも作れる。
  - 構成をコードとして管理する考え方を<b>IaC（Infrastructure as Code）</b>と呼ぶ。
reasoning: |
  1. サーバプロビジョニングツールの目的は「構成をあらかじめ記述しておき、サーバを自動的に構成する」ことです。
  2. 「システム構成をあらかじめ記述しておくことによって、サーバを自動的に構成する」という<b>エ</b>が正解です。
choices:
  ア: サーバ上のサービスが動いているかを、他のシステムからリモートで監視するのは、<b>死活監視ツール</b>の目的です。誤り。
  イ: サーバにインストールされているソフトウェアを一元的に管理するのは、<b>IT資産管理（ソフトウェア資産管理）ツール</b>の目的です。誤り。
  ウ: サーバを監視して、システムやアプリケーションのパフォーマンスを管理するのは、<b>性能監視（APM）ツール</b>の目的です。誤り。
  エ: システム構成をあらかじめ記述しておき、サーバを自動的に構成するのは、<b>サーバプロビジョニングツール</b>の目的です。<b>正解</b>。
example: |
  料理のレシピ（構成を記述したファイル）を一度きちんと書いておけば、誰が作っても、何回作っても同じ味（同じ構成のサーバ）になります。毎回シェフの記憶と勘で作る（手作業で設定する）と、味がばらついたり、手順を忘れたりします。
review:
  - サーバプロビジョニングツール＝構成をあらかじめ記述し、サーバを自動構成する（IaC、例：Ansible）。
  - 死活監視（動作確認）、IT資産管理（ソフトの一元管理）、性能監視（パフォーマンス管理）と区別する。
