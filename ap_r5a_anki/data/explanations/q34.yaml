q: 34
answer: イ
category: ネットワーク
theme: |
  IPアドレスとサブネットマスクから、そのホストが属するサブネットワークのアドレス（ネットワークアドレス）を計算する問題です。
basics: |
  <b>サブネットマスク</b>：IPアドレスのどこまでがネットワーク部（どのネットワークか）かを示す値です。2進数で1が並んでいる部分がネットワーク部、0の部分がホスト部です。
  <b>ネットワークアドレスの求め方</b>：IPアドレスとサブネットマスクを、ビットごとに<b>AND（論理積）</b>します。マスクが1のビットはそのまま残り、0のビットは0になります。
  - マスクが255の部分 → IPアドレスの値がそのまま残る。
  - マスクが0の部分 → 0になる。
  - それ以外（ここでは252）の部分だけ、2進数に直して計算する。
reasoning: |
  1. IPアドレス 172.30.123.45、サブネットマスク 255.255.252.0 です。
  2. 第1・第2オクテットはマスクが255なので、そのまま 172.30。第4オクテットはマスクが0なので 0。
  3. 第3オクテットを2進数でANDします。
  | 123 ＝ 0111 1011
  | 252 ＝ 1111 1100
  | AND ＝ 0111 1000 ＝ 64＋32＋16＋8 ＝ <b>120</b>
  4. ネットワークアドレスは <b>172.30.120.0</b> です。
  （参考：252 は下位2ビットが0なので、第3オクテットは4ずつ区切られます。123を4の倍数に切り捨てると120です。）
  5. 正解は<b>イ</b>です。
choices:
  ア: 172.30.3.0 は、第3オクテットの下位2ビット（123の 11）だけを取り出した値で、ホスト部側を残してしまっています。誤り。
  イ: 172.30.120.0。IPアドレスとサブネットマスクのANDの結果と一致します。<b>正解</b>。
  ウ: 172.30.123.0 は、サブネットマスクを 255.255.255.0 とみなした場合のネットワークアドレスです。誤り。
  エ: 172.30.252.0 は、サブネットマスクの値をそのまま当てはめた値で、ANDの計算をしていません。誤り。
example: |
  住所の「町名・番地」までが同じなら同じ地区、という分け方に似ています。サブネットマスクは「どこまでを地区名として見るか」を決める定規で、IPアドレスにその定規を当てて（AND）、地区名（ネットワークアドレス）だけを取り出します。
review:
  - ネットワークアドレス＝IPアドレス AND サブネットマスク。255・0以外のオクテットだけ2進数で計算する。
  - マスク252は下位2ビットが0なので、そのオクテットは4の倍数単位で区切られる（123→120）。
