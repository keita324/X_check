q: 5
answer: ウ
category: アルゴリズムとプログラミング
theme: |
  配列で実現した双方向リストに要素を挿入したとき、新しい要素の「次の要素」「前の要素」を示す番号がどうなるかを、図から追う問題です。
basics: |
  <b>双方向リスト</b>：各要素が「次の要素の位置（next）」と「前の要素の位置（prev）」の両方を持つリストです。前後どちらにもたどれます。
  この問題では、3つの配列で表しています。
  | elem[i]：要素の値
  | next[i]：次の要素の要素番号（0なら末尾）
  | prev[i]：前の要素の要素番号（0なら先頭）
  新しい要素は配列の末尾（要素番号6）に追加し、前後の要素とのつながり（next・prev）を付け替えます。
reasoning: |
  <b>(1) 現在のリストの順番をたどる</b>
  Head＝1 から next をたどります。
  | 1(A) → next[1]＝4 → 4(B) → next[4]＝3 → 3(D) → next[3]＝5 → 5(E) → next[5]＝2 → 2(F) → next[2]＝0（末尾）
  リストは <b>A → B → D → E → F</b> です。
  <b>(2) D の次に C を挿入する</b>
  挿入後は A → B → D → <b>C</b> → E → F になります。C は要素番号6に入ります。
  | C の次の要素は E（要素番号5）→ <b>next[6] ＝ 5</b>
  | C の前の要素は D（要素番号3）→ <b>prev[6] ＝ 3</b>
  （あわせて next[3] は 6 に、prev[5] は 6 に書き換えます。）
  正解は<b>ウ</b>です。
choices:
  ア: next[6]＝2 は F を、prev[6]＝3 は D を指しています。C の次は E（5）なので誤り。
  イ: next[6]＝3 は D を、prev[6]＝4 は B を指しており、前後が逆で位置もずれています。誤り。
  ウ: next[6]＝5（E）、prev[6]＝3（D）で、D と E の間に C が入った状態と一致します。<b>正解</b>。
  エ: next[6]＝5 は正しいですが、prev[6]＝4 は B を指しています。C の前は D（3）なので誤り。
example: |
  手をつないで並んだ列で、全員が「前の人」と「後ろの人」を覚えているとします。D さんと E さんの間に C さんが入るとき、C さんは「前は D さん、後ろは E さん」と覚え、D さんは「後ろが C さん」、E さんは「前が C さん」と覚え直します。
review:
  - 配列で表したリストは、Head から next をたどって実際の並び順を求めてから考える。
  - 挿入する要素の next は「後ろの要素」、prev は「前の要素」の要素番号。前後の要素の next・prev も付け替える。
