q: 49
answer: イ
category: ソフトウェア開発管理技術
theme: |
  日本の特許権が及ぶ範囲を理解し、特許権者から実施許諾（ライセンス）を受けなければならない場合を選ぶ問題です。
basics: |
  <b>特許権</b>：新しい発明をした人が、特許庁に出願して登録されると得られる権利です。特許権者は、その発明を<b>業として</b>（事業として）独占的に実施でき、他人が無断で実施することを禁止できます。
  <b>実施</b>：特許の発明を使った製品を、生産・使用・販売・輸出・輸入などすることです。他人が実施するには、特許権者の許諾（<b>実施許諾、ライセンス</b>）が必要です。

  特許権が及ばない主な場合
  - <b>業として</b>でない実施：家庭内での個人的な利用など。
  - <b>存続期間の満了後</b>：特許権の存続期間は、原則として<b>出願日から20年</b>で終わる（医薬品などは最長5年延長できる）。期間が終われば誰でも自由に使える。
  - <b>先使用権</b>：他人の特許出願の前から、同じ発明を独自に開発して日本国内で事業として実施（またはその準備）をしていた人は、許諾なしに引き続き実施できる。
reasoning: |
  1. イ：日本国内で製品を<b>製造</b>すること自体が「生産」という実施にあたります。全部を海外に輸出する場合でも、日本国内での生産と輸出は日本の特許権の対象なので、<b>実施許諾が必要</b>です。
  2. ア：家庭内での個人的な利用は「業として」の実施ではないので、許諾は不要です。
  3. ウ：出願日から25年を超えていれば、存続期間（原則20年、延長しても最長25年）は満了しているので、許諾は不要です。
  4. エ：出願日より前から独自に開発し、日本国内で製造販売していた場合は、先使用権により許諾は不要です。
  5. 正解は<b>イ</b>です。
choices:
  ア: 家庭内で個人的に利用するだけなら「業として」の実施ではないので、特許権は及ばず、実施許諾は不要です。誤り。
  イ: 日本国内で製品を製造することは、たとえ全量を輸出する場合でも、日本の特許の実施（生産・輸出）にあたるので、特許権者からの実施許諾が必要です。<b>正解</b>。
  ウ: 特許権の存続期間は原則出願日から20年（延長されても最長25年）なので、出願日から25年を超えた後は特許権が消滅しており、許諾は不要です。誤り。
  エ: 出願日より前から独自に開発し、出願日の時点で国内で製造販売していたことを証明できれば、<b>先使用権</b>が認められ、許諾は不要です。誤り。
example: |
  ある会社が便利な文房具の特許を持っているとします。自分の家で手作りして使うだけならOK（ア）、特許が切れた後に作るのもOK（ウ）、特許出願より前から自社で同じ物を作って売っていたならOK（エ）です。しかし、日本の工場で量産するなら、売り先が海外だけでも、特許権者の許可が必要です（イ）。
review:
  - 特許権は「業として」の実施（生産・使用・販売・輸出など）に及ぶ。国内で生産すれば輸出専用でも許諾が必要。
  - 許諾が不要な例：個人的・家庭的な利用、存続期間（原則出願から20年）の満了後、先使用権がある場合。
