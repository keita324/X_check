q: 78
answer: イ
category: 法務
theme: |
  ソフトウェア開発を下請事業者に委託するとき、下請法（下請代金支払遅延等防止法）で禁止されている行為を選ぶ問題です。
basics: |
  <b>下請法</b>：立場の強い親事業者（発注者）が、立場の弱い下請事業者に不利な取引を押し付けないよう、親事業者の義務と禁止行為を定めた法律です。ソフトウェアなどの情報成果物の作成委託も対象です。
  親事業者の主な<b>義務</b>
  - <b>書面の交付義務</b>：発注したら<b>直ちに</b>、委託内容・下請代金の額・支払期日・支払方法などを記載した<b>書面</b>（いわゆる3条書面）を交付する。
  　内容がその時点で決められない正当な理由がある事項は、記載しなくてもよいが、<b>決まった後に直ちに、その事項を書面で</b>交付しなければならない。
  　継続的な取引で共通する事項（支払条件など）は、あらかじめ書面で通知しておけば、個々の発注書面では省略できる。
  主な<b>禁止行為</b>：下請代金の減額、支払遅延、受領拒否、不当なやり直しなど。
reasoning: |
  1. イ：仕様が未確定で発注時に記載できなかったのは許されますが、仕様が確定した時点で、その内容を<b>書面</b>で交付しなければなりません。口頭で伝えるだけでは書面交付義務に違反します → <b>禁止</b>。
  2. ア：継続的な取引で共通する支払条件などを、あらかじめ書面で交付しておき、個々の発注書面では省略するのは認められています。
  3. ウ：下請事業者と協議して、仕様変更で増える費用を下請代金に加算するのは、適正な取引です。
  4. エ：振込手数料を下請事業者が負担することを、発注前に書面で合意していれば、親事業者が負担した実費の範囲内で差し引くことは認められています（合意がなければ減額にあたる）。
  5. 正解は<b>イ</b>です。
choices:
  ア: 継続的な取引で、支払条件や支払期日などの共通事項をあらかじめ書面で交付しておけば、個々の発注書面での記載を省略できます。禁止されていません。誤り。
  イ: 仕様が確定した時点で、その内容を書面ではなく口頭で伝えるのは、書面の交付義務に違反します。禁止されている行為です。<b>正解</b>。
  ウ: 下請事業者と協議して、仕様変更で発生する費用の増加分を下請代金に加算するのは、適正な対応です。禁止されていません。誤り。
  エ: 振込手数料の負担について発注前に書面で合意していれば、実費の範囲内で差し引くことは認められます。禁止されていません。誤り。
example: |
  親事業者が「仕様は後で電話で伝えるから」と言って、書面で残さずに口頭で指示すると、後から「そんな指示は聞いていない」「その分の代金は払わない」というトラブルになり、立場の弱い下請事業者が泣き寝入りしがちです。下請法は、こうした事態を防ぐために、取引条件を必ず書面に残すことを義務付けています。
review:
  - 下請法では、発注時に取引内容を書面で交付する義務がある。未確定事項は、確定後に直ちに書面で交付する（口頭は不可）。
  - 共通事項の事前書面による省略、協議による代金の増額、事前の書面合意による振込手数料の差引きは認められる。
