q: 6
answer: エ
category: ソフトウェア
theme: |
  プログラムの性質「再入可能（リエントラント）」の意味を、再配置可能・再帰的・オーバーレイと区別する問題です。
basics: |
  <b>タスク</b>：OS上で同時に動いている個々の処理です。複数のタスクが、同じプログラム（共通の関数やライブラリ）を同時に呼び出すことがあります。

  プログラムの性質を表す用語
  - <b>再入可能（リエントラント）</b>：複数のタスクから<b>同時に（並行して）呼び出されても</b>、それぞれに正しい結果を返せる性質。作業用のデータをタスクごとに別々に持ち、共有する変数を書き換えないように作ります。
  - <b>再配置可能（リロケータブル）</b>：主記憶上のどのアドレスに置いても実行できる性質。
  - <b>再帰的（リカーシブ）</b>：手続（関数）の中から自分自身を呼び出せる性質。
  - <b>再使用可能（リユーザブル）</b>：一度実行した後、読み込み直さずに再び実行できる性質。
  - <b>オーバーレイ</b>：プログラム全体が主記憶に入らないとき、必要な部分だけを補助記憶から読み込んで実行する方式。
reasoning: |
  1. 「再入」＝ある呼出しの実行が終わらないうちに、別のタスクから再び「入ってくる」ことです。
  2. それでも正しく動く、つまり「複数のタスクからの呼出しに対して、並行して実行されても、それぞれのタスクに正しい結果を返す」のが再入可能プログラムです。
  3. 正解は<b>エ</b>です。
choices:
  ア: 主記憶上のどのアドレスに配置しても実行できるのは<b>再配置可能（リロケータブル）</b>プログラムの特徴です。誤り。
  イ: 手続の内部から自分自身を呼び出せるのは<b>再帰的（リカーシブ）</b>プログラムの特徴です。誤り。
  ウ: 必要な部分を補助記憶装置から読み込みながら動作するのは<b>オーバーレイ</b>方式の説明です。誤り。
  エ: 複数のタスクから並行して呼び出されても、それぞれに正しい結果を返すのは<b>再入可能（リエントラント）</b>プログラムの特徴です。<b>正解</b>。
example: |
  1冊の料理レシピ（プログラム）を、何人もの料理人（タスク）が同時に見ながら料理するとします。レシピ自体に書き込みをせず、各自が自分の手元のメモ（タスクごとの作業領域）を使えば、全員がそれぞれ正しく料理できます。これが再入可能です。誰かがレシピに「今3番目の手順」と書き込むと、他の人が混乱してしまいます。
review:
  - 再入可能＝複数タスクから並行して呼ばれても正しく動く（作業データをタスクごとに分ける）。
  - 再配置可能（どのアドレスでも実行）、再帰的（自分自身を呼ぶ）、再使用可能（読み直さず再実行）と区別する。
