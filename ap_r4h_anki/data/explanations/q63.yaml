q: 63
answer: イ
category: システム戦略
theme: |
  経営手法の略語「BPO」の説明を、BCP・MRP・ITポートフォリオと区別する用語問題です。
basics: |
  <b>BPO（Business Process Outsourcing：ビジネスプロセスアウトソーシング）</b>：自社の業務のうち、<b>コアビジネス（自社の強みとなる中核事業）ではない</b>業務の一部または全部を、その業務を専門とする<b>外部の企業に委託</b>することです。経理、給与計算、人事事務、コールセンターなどが代表例です。自社は中核業務に人や資金を集中でき、専門企業の効率的な処理でコスト削減も期待できます。

  関連用語
  - <b>BCP（事業継続計画）</b>：災害や事故でも重要事業を中断させない、または中断期間をできるだけ短くするための計画・仕組み。
  - <b>MRP（資材所要量計画）</b>：基準生産計画・部品表・在庫情報から、必要な資材の量と時期を求めて手配を支援する生産管理手法。
  - <b>ITポートフォリオ</b>：IT投資の案件を、戦略との適合性・費用対効果・リスクなどで評価し、投資全体のバランスを最適化する手法。
reasoning: |
  1. BPOの「Outsourcing（外部委託）」と「Business Process（業務プロセス）」から、業務プロセスを外部に委託することだと分かります。
  2. 「社内業務のうちコアビジネスでない事業に関わる業務の一部又は全部を、外部の専門的な企業に委託すること」という<b>イ</b>が正解です。
choices:
  ア: 災害や事故で被害を受けても重要事業を中断させない、又は中断期間を短くする仕組みを構築するのは<b>BCP（事業継続計画）</b>です。誤り。
  イ: コアビジネスでない業務の一部又は全部を、外部の専門的な企業に委託するのは<b>BPO</b>です。<b>正解</b>。
  ウ: 基準生産計画、部品表、在庫情報を基に資材の所要量と時期を求め、資材の手配・納入管理を支援するのは<b>MRP（資材所要量計画）</b>です。誤り。
  エ: プロジェクトを戦略との適合性や費用対効果、リスクの観点から評価し、情報化投資のバランスを管理・最適化するのは<b>ITポートフォリオ</b>管理です。誤り。
example: |
  パン屋さんが、パン作り（コアビジネス）に集中するために、会計の記帳や給与計算は会計事務所に、ネット注文の電話対応はコールセンター会社に任せるのがBPOです。
review:
  - BPO＝コアビジネス以外の業務プロセスを、外部の専門企業に委託すること。
  - BCP（事業継続）、MRP（資材所要量計画）、ITポートフォリオ（IT投資のバランス管理）と略語を区別する。
