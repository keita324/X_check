q: 27
answer: エ
category: データベース
theme: |
  データベースサーバ側に処理を登録しておく「ストアドプロシージャ」の特徴について、<b>誤っている</b>記述を選ぶ問題です。よく似た「トリガ」との違いがポイントです。
basics: |
  <b>ストアドプロシージャ</b>：複数のSQL文などをひとまとまりの手続として、<b>あらかじめデータベース（DBMS）側に登録</b>しておいたものです。
  - クライアント（アプリ）は、<b>CALL文</b>で手続の名前を指定して呼び出すだけでよい。
  - 個々のSQL文を1つずつネットワークで送る必要がないので、<b>通信量（トラフィック）を減らせる</b>。
  - 処理がサーバ側で完結するので、性能や保守性の向上も期待できる。

  <b>トリガ</b>：データの挿入・更新・削除などの<b>イベントが起きたときに、自動的に起動</b>する処理です。呼び出さなくても、データの変更をきっかけに実行されます。
reasoning: |
  1. ア・イ・ウは、いずれもストアドプロシージャの正しい特徴です（SQLを1つずつ送らない、CALL文で実行、通信量の削減）。
  2. エ「データの変更を行うときに、あらかじめDBMSに定義しておいた処理を自動的に起動・実行する」は、<b>トリガ</b>の説明です。ストアドプロシージャは、CALL文で明示的に呼び出したときに実行されるもので、データ変更で自動的に動くものではありません。
  3. 誤っているのは<b>エ</b>です。
choices:
  ア: ストアドプロシージャを使えば、一連のSQL文をまとめてサーバ側で実行できるので、アプリケーションからSQL文を1つずつ送信する必要がなくなります。正しい記述です。
  イ: ストアドプロシージャは、クライアント側からCALL文で呼び出して実行します。正しい記述です。
  ウ: SQL文を個別にやり取りしなくて済むので、サーバとクライアント間の通信トラフィックを減らせます。正しい記述です。
  エ: データの変更をきっかけに、あらかじめ定義した処理を自動的に起動・実行するのは<b>トリガ</b>の機能です。ストアドプロシージャの説明としては誤っています。<b>正解</b>（誤っている記述）。
example: |
  レストランで「Aセット」と注文する（CALL文）と、厨房（DBMS）があらかじめ決められた手順でサラダ・メイン・デザートを全部用意してくれるのがストアドプロシージャです。一品ずつ注文を伝える（SQLを1つずつ送る）より、やり取りが少なく済みます。一方、「在庫が減ったら自動で発注する」のように、出来事をきっかけに勝手に動く仕組みがトリガです。
review:
  - ストアドプロシージャ＝DBMSに登録した手続をCALL文で呼び出す。SQLを1つずつ送らずに済み、通信量を減らせる。
  - データ変更をきっかけに自動実行されるのはトリガ。ストアドプロシージャと区別する。
