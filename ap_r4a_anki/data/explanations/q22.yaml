q: 22
answer: エ
theme: |
  USBメモリやSSDで使われる「フラッシュメモリ」の特徴を、他のメモリ（DRAMや昔のROM）と区別する問題です。
basics: |
  <b>揮発性と不揮発性</b>：電源を切るとデータが消えるメモリを<b>揮発性</b>、消えないメモリを<b>不揮発性</b>と呼びます。
  <b>フラッシュメモリ</b>：電源を切ってもデータが消えない<b>不揮発性</b>の半導体メモリで、回路基板に付けたまま電気的に書き換えられます。USBメモリ、SDカード、SSD、スマホのストレージに使われています。

  <b>フラッシュメモリの書込みの仕組み</b>：データを書き換えるときは、まず<b>ブロック単位でまとめて消去</b>してから書き込みます（上書きはできない）。また、書込み・消去を繰り返すと内部の素子が劣化するため、<b>書換え回数に上限</b>があります。

  <b>DRAM</b>：パソコンの主記憶に使う揮発性メモリ。コンデンサに電荷をためて記憶するので、電荷が漏れないよう定期的に読み書きし直す<b>リフレッシュ</b>が必要です。
reasoning: |
  1. 各選択肢を、フラッシュメモリの特徴（不揮発・ブロック消去後に書込み・書換え回数に上限）と照らし合わせます。
  2. ア「書込み回数は無制限」→ 上限があるので×。
  3. イ「基板から外して専用のROMライターで書込み」→ 基板に付けたまま電気的に書き換えられるので×（これは昔のPROM/EPROMの特徴）。
  4. ウ「定期的にリフレッシュしないとデータが失われる」→ DRAMの特徴なので×。
  5. エ「データを書き換える時には、あらかじめ以前のデータを消去してから書込みを行う」→ フラッシュメモリの特徴そのものなので○。
  6. 正解は<b>エ</b>です。
choices:
  ア: フラッシュメモリには書換え回数の上限があります（製品により数千〜数十万回程度）。「無制限」は誤り。
  イ: 回路基板から外して専用の装置（ROMライター）で書き込むのは、昔のPROMやEPROMの使い方です。フラッシュメモリは基板上で電気的に書き換えられます。誤り。
  ウ: 定期的なリフレッシュが必要なのは<b>DRAM</b>です。フラッシュメモリは不揮発性で、リフレッシュは不要です。誤り。
  エ: 書き換えるときは、以前のデータを（ブロック単位で）消去してから書き込みます。<b>正解</b>。
example: |
  フラッシュメモリは「鉛筆で書くノート」ではなく「ホワイトボード」に近いです。書き直すときは、そのエリアを一度まとめて消してから書きます。何度も消して書くとボードが傷んでくる（書換え回数の上限）点も似ています。
review:
  - フラッシュメモリ＝不揮発性・ブロック単位で消去してから書込み・書換え回数に上限、の3点を覚える。
  - リフレッシュが必要なのはDRAM、ROMライターで書き込むのは昔のPROM/EPROM、と区別する。
