q: 69
answer: エ
category: 経営戦略マネジメント
theme: |
  口コミによる爆発的な広がりを利用する「バイラルマーケティング」の説明を、ワントゥワン・マス・オムニチャネルと区別する問題です。
basics: |
  <b>バイラルマーケティング</b>：バイラル（viral）は「ウイルスのような」という意味です。商品やサービスの良い評判が、<b>人から人へ口コミで</b>、ウイルスが感染するように爆発的に広がることを狙う手法です。SNSでの共有や「友達紹介キャンペーン」など、インターネットの拡散力を生かします。

  他のマーケティング手法
  - <b>ワントゥワンマーケティング</b>：顧客一人ひとりの興味・関心に合わせて、個別にアプローチする。
  - <b>マスマーケティング</b>：市場全体を1つと捉え、すべての人に同じ製品を同じ方法で売る（テレビCMなど）。
  - <b>オムニチャネル</b>：実店舗・ECサイト・アプリなど複数の販売経路（チャネル）を連携させ、顧客がどこでも同じように買える利便性を実現する。
reasoning: |
  1. バイラルマーケティングのキーワードは「人から人へ」「口コミ」「爆発的に広まる」「インターネット」です。
  2. 「人から人へ、プラスの評価が口コミで爆発的に広まりやすいインターネットの特長を生かす手法」という<b>エ</b>が正解です。
choices:
  ア: 顧客一人ひとりの興味関心に合わせてマーケティングを行うのは<b>ワントゥワンマーケティング</b>です。誤り。
  イ: 市場全体をセグメント化せずに一つとして捉え、全購買者に画一的なマーケティングを行うのは<b>マスマーケティング</b>です。誤り。
  ウ: 実店舗やECサイトなど複数のチャネルを連携させ、顧客がチャネルを意識せずに購入できるようにするのは<b>オムニチャネル</b>です。誤り。
  エ: 人から人へ、プラスの評価が口コミで爆発的に広まりやすいインターネットの特長を生かすのは<b>バイラルマーケティング</b>です。<b>正解</b>。
example: |
  「この動画をシェアした人の中から抽選でプレゼント」というキャンペーンや、「友達を招待すると両方に500円分のポイント」という仕組みは、利用者自身に口コミを広げてもらうバイラルマーケティングの例です。
review:
  - バイラルマーケティング＝口コミで人から人へ爆発的に広がる効果をインターネットで狙う手法。
  - ワントゥワン（個別対応）、マス（画一的）、オムニチャネル（複数チャネルの連携）と区別する。
