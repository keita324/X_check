q: 24
answer: ア
theme: |
  3年後の顧客数を計算し、それを英大文字26種類で表すコードに何桁必要かを求める問題です。「何桁で何通り表せるか」というコード設計の基本です。
basics: |
  <b>コードの桁数と表せる数</b>：1桁に使える文字の種類がk種類のとき、n桁のコードで表せる組合せは <b>k<sup>n</sup>通り</b>です。
  - 10進数（0〜9の10種類）で3桁なら 10<sup>3</sup>＝1000通り（000〜999）。
  - 英大文字（A〜Zの26種類）で2桁なら 26<sup>2</sup>＝676通り（AA〜ZZ）。

  <b>前年比で2割ずつ増える</b>：毎年、前の年の1.2倍になるという意味です。3年後は 1.2×1.2×1.2＝1.2<sup>3</sup>倍です。
reasoning: |
  1. 3年後の顧客数を求めます。
  | 1年後：8,000 × 1.2 ＝ 9,600人
  | 2年後：9,600 × 1.2 ＝ 11,520人
  | 3年後：11,520 × 1.2 ＝ <b>13,824人</b>
  2. 26種類の文字で何桁あれば13,824人分のコードを作れるかを調べます。
  | 2桁：26<sup>2</sup> ＝ 676通り（不足）
  | 3桁：26<sup>3</sup> ＝ 17,576通り（13,824以上なので足りる）
  3. よって<b>3桁</b>あれば足ります。正解は<b>ア</b>です。
choices:
  ア: 3桁。26<sup>3</sup>＝17,576通りで、3年後の13,824人を上回ります。<b>正解</b>。
  イ: 4桁なら 26<sup>4</sup>＝456,976通りで足りますが、「少なくとも何桁」なので最小の3桁が答えです。誤り。
  ウ: 5桁（26<sup>5</sup>＝約1,188万通り）も足りますが、必要以上の桁数です。誤り。
  エ: 6桁（26<sup>6</sup>＝約3億889万通り）も当然足りますが、必要な最小の桁数ではありません。誤り。
example: |
  車のナンバーや会員番号を決めるときと同じです。数字だけなら1桁10通りですが、アルファベットなら1桁26通りと表現力が高いため、少ない桁数で多くの人にコードを割り当てられます。
review:
  - k種類の文字でn桁なら k<sup>n</sup> 通りを表せる（26<sup>2</sup>＝676、26<sup>3</sup>＝17,576）。
  - 「前年比2割増」は毎年1.2倍。3年後は 1.2<sup>3</sup>＝1.728倍になることを計算できるようにする。
  - 「少なくとも何桁」は、必要数を上回る最小の桁数を答える。
