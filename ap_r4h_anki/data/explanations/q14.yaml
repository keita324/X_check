q: 14
answer: ア
category: システム構成要素
theme: |
  システムの信頼性の指標MTBF（故障しにくさ）とMTTR（修理の速さ）のうち、MTTRを短くする（早く直す）のに役立つ機能を選ぶ問題です。
basics: |
  <b>MTBF（平均故障間隔）</b>：故障から次の故障までの平均時間。長いほど「故障しにくい」。
  <b>MTTR（平均修理時間）</b>：故障してから修理が完了するまでの平均時間。短いほど「早く直る」。

  対策の考え方
  - <b>MTBFを長くする</b>（故障を起こさない・故障しても止まらない）：部品の品質向上、予防保全、自動でエラーを訂正・回避する機能など。
  - <b>MTTRを短くする</b>（故障したときに早く直す）：故障の原因や場所をすぐ突き止められる仕組み、保守体制の充実、交換しやすい設計など。
reasoning: |
  1. 各選択肢が「故障を防ぐ（MTBF）」のか「故障後の修理を早める（MTTR）」のかを分類します。
  2. ア エラーログ取得機能：故障が起きたときの状況を記録しておくので、原因の調査・特定が早くなり、修理時間が短くなる → <b>MTTR</b>
  3. イ ビット誤り訂正機能：メモリの誤りを自動で直して、システムが止まらないようにする → MTBF
  4. ウ 命令再試行機能：一時的なエラーが出た命令を自動でやり直し、故障として止まらないようにする → MTBF
  5. エ 予防保全：故障する前に点検・部品交換をして、故障を未然に防ぐ → MTBF
  6. 正解は<b>ア</b>です。
choices:
  ア: エラーログ取得機能は、障害発生時の記録から原因箇所を素早く特定できるようにするので、修理時間（MTTR）の短縮に役立ちます。<b>正解</b>。
  イ: 記憶装置のビット誤り訂正機能（ECC）は、誤りを自動で訂正してシステムを止めないための機能で、故障の発生を減らす（MTBFを長くする）対策です。誤り。
  ウ: 命令再試行機能（リトライ）は、一時的なエラーを自動でやり直して回復させ、システム停止を防ぐ機能で、MTBFを長くする対策です。誤り。
  エ: 予防保全は、故障が起こる前に点検・交換して故障を防ぐ活動で、MTBFを長くする対策です。誤り。
example: |
  車に例えると、定期点検（予防保全）やパンクしにくいタイヤ（自動回復機能）は「故障しにくくする」対策（MTBF）です。一方、ドライブレコーダーや故障診断機で「何が起きたか」を記録しておくと、修理工場ですぐに原因が分かり、修理時間が短くなります（MTTR）。
review:
  - MTTR短縮＝故障後の原因特定・修理を早める対策（エラーログ取得、遠隔保守、保守体制の充実など）。
  - MTBF延長＝故障を起こさない・止まらない対策（予防保全、誤り訂正、命令再試行など）。
