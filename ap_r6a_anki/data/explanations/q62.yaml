q: 62
answer: エ
category: システム戦略
theme: |
  行政機関が保有するデータを、最初から公開・活用しやすい形で扱う考え方「オープンデータバイデザイン」の取組みを問う問題です。
basics: |
  <b>オープンデータ</b>：国や自治体などが保有するデータを、<b>誰でも</b>（営利・非営利を問わず）<b>二次利用できる</b>形で、<b>機械判読に適した</b>形式で、<b>無償で</b>公開したものです。
  <b>官民データ活用推進基本法</b>：国や自治体などが保有するデータを、国民が利用しやすいように公開・活用することなどを定めた法律です。
  <b>オープンデータバイデザイン</b>：「設計段階から（by design）オープンデータを前提にする」という考え方です。後から公開用にデータを加工するのではなく、<b>情報システムや業務プロセスを企画・整備・運用する最初の段階から</b>、データを二次利用しやすい形で無償公開することを前提にします。
  なお、個人情報は、原則としてオープンデータの対象外です（個人を特定できない形に加工するなどの配慮が必要）。
reasoning: |
  1. ア：個人情報はオープンデータとして公開する対象ではなく、「個人情報保護委員会への届出を前提に公開する」という仕組みでもありません → ×。
  2. イ：オープンデータは、<b>営利目的を含めて</b>二次利用できるのが原則です → ×。
  3. ウ：オープンデータは国民や企業が広く利用するためのもので、行政機関同士の利用に限定するものではありません → ×。
  4. エ：対象の行政データを、二次利用や機械判読に適した形で無償公開することを前提に、システムや業務プロセスを企画・整備・運用する → <b>オープンデータバイデザイン</b>そのもの → ○。
  5. 正解は<b>エ</b>です。
choices:
  ア: オープンデータバイデザインは、個人情報を公開する仕組みではありません。個人情報は原則として公開の対象外で、「委員会への届出が義務化されている」という記述も誤りです。誤り。
  イ: オープンデータは営利目的・非営利目的を問わず二次利用できるのが原則で、非営利の用途に限定されてはいません。誤り。
  ウ: オープンデータは広く国民や企業が利用するためのもので、行政機関同士の相互利用に限定するものではありません。誤り。
  エ: 対象となる行政データを、二次利用や機械判読に適した形で無償公開することを前提に、情報システムや業務プロセスを企画・整備・運用するのが、オープンデータバイデザインです。<b>正解</b>。
example: |
  市役所が新しいバス運行管理システムを作るとき、最初から「時刻表や運行状況のデータを、誰でもアプリに使える形式で公開する」ことを前提に設計しておけば、民間の企業がそのデータで便利な乗換案内アプリを作れます。後からPDFで公開するのとは使いやすさが大きく違います。
review:
  - オープンデータバイデザイン＝システムや業務の企画・設計段階から、データを二次利用・機械判読可能な形で無償公開することを前提にする。
  - オープンデータは営利目的も含め誰でも利用可能。個人情報は原則対象外。
