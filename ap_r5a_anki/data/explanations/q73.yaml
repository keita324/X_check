q: 73
answer: イ
category: ビジネスインダストリ
theme: |
  IoTやAIを活用した工場（スマートファクトリー）で使われる「マシンビジョン」の目的を、VRによる作業支援や需要予測などと区別する問題です。
basics: |
  <b>スマートファクトリー</b>：IoT機器やAIを使って、生産設備や工程のデータを集め、自動化・最適化を進めた工場です。
  <b>マシンビジョン</b>：カメラで撮影した画像をコンピュータで処理・解析し、製品の<b>外観の検査</b>、部品の位置の認識、文字の読み取りなどを、人間の目の代わりに行う技術です。AI（ディープラーニングによる画像認識）を組み合わせると、傷や汚れ、形の異常などを高い精度で見分けられます。
  これにより、これまで人が目で見て行っていた<b>目視検査を自動化</b>し、検査の速さや精度、安定性を高められます。
reasoning: |
  1. マシンビジョンは「機械の目」で、カメラ画像を解析して検査などを行う技術です。
  2. 「従来の人間の目視検査を自動化し、検査効率を向上させる」という<b>イ</b>が、その目的として適切です。
choices:
  ア: 作業者が装着したVRゴーグルに作業手順を表示して作業効率を上げるのは、<b>VR・ARによる作業支援</b>で、マシンビジョンの目的ではありません。誤り。
  イ: AIを用いたマシンビジョンで、人間の目視検査を自動化し、検査効率を向上させます。<b>正解</b>。
  ウ: クラウドに蓄積した入出荷データで機械学習を行い、需要を予測して生産数を最適化するのは、<b>AIによる需要予測</b>で、画像を扱うマシンビジョンではありません。誤り。
  エ: 設計変更の内容をAIで吟味して製造現場に正確に伝達するのは、設計情報の管理に関する取組みで、マシンビジョンの目的ではありません。誤り。
example: |
  お菓子工場で、ベルトコンベアを流れるクッキーをカメラで撮影し、AIが「割れている」「焦げている」ものを瞬時に見つけて取り除く仕組みがマシンビジョンです。人が何時間も目で見続けるより、速く、疲れることなく検査できます。
review:
  - マシンビジョン＝カメラ画像をコンピュータ（AI）で解析し、外観検査などを行う「機械の目」。目視検査の自動化が主な目的。
  - VR・ARによる作業支援、機械学習による需要予測とは、扱うデータと目的が異なる。
