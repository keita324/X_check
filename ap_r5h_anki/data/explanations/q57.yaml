q: 57
answer: ウ
category: サービスマネジメント
theme: |
  自社運用（オンプレミス）のシステムをクラウドのIaaS、PaaSへ段階的に移行したとき、どの運用作業が自社で不要になるか（クラウド事業者の担当に変わるか）を判断する問題です。
basics: |
  <b>オンプレミス</b>：自社でサーバなどの機器を持ち、すべてを自社で運用する形態です。
  クラウドサービスでは、事業者が管理する範囲がサービスの種類によって違います。
  | <b>IaaS</b>：事業者が、<b>ハードウェア</b>（物理サーバ、ネットワーク、設備）を管理。利用者はOS・ミドルウェア・アプリを管理。
  | <b>PaaS</b>：事業者が、ハードウェアに加えて<b>OS・ミドルウェア</b>まで管理。利用者はアプリとデータを管理。
  | SaaS：事業者がアプリまで全部管理。利用者はサービスを使うだけ。
  クラウドに移行すると、事業者の管理範囲になった作業は、自社では不要になります。
reasoning: |
  4つの運用作業が、どの層の作業かを考えます。
  | ① 業務システムのバッチ処理のジョブ監視 → <b>アプリケーション</b>の運用。IaaSでもPaaSでも自社に残る
  | ② 物理サーバの起動・停止のオペレーション → <b>ハードウェア</b>の運用。IaaSへの移行で不要
  | ③ ハードウェアの保守ランプの目視監視 → <b>ハードウェア</b>の運用。IaaSへの移行で不要
  | ④ ミドルウェアへのパッチ適用 → <b>ミドルウェア</b>の運用。PaaSへの移行で不要
  IaaSへの移行で不要になるのは②・③、PaaSへの移行で（さらに）不要になるのは④です。
  正解は<b>ウ</b>です。
choices:
  ア: ①のジョブ監視は業務システム（アプリケーション）の運用で、IaaSに移行しても自社に残ります。また②の物理サーバの操作は、PaaSを待たずIaaSへの移行の時点で不要になります。誤り。
  イ: ①のジョブ監視はIaaSでも自社に残ります。また②の物理サーバの操作はIaaSへの移行で不要になるので、PaaSの欄に入れるのは誤りです。誤り。
  ウ: IaaSへの移行で②物理サーバの操作と③ハードウェアの監視が、PaaSへの移行で④ミドルウェアのパッチ適用が不要になります。<b>正解</b>。
  エ: ②の物理サーバの起動・停止は、ハードウェアの運用なのでIaaSへの移行の時点で不要になります。PaaSの欄に入れるのは誤りです。誤り。
example: |
  住まいに例えると、オンプレミスは「持ち家」（建物の修繕も設備の点検も自分）、IaaSは「賃貸マンション」（建物と設備は大家さん、家具や家電は自分）、PaaSは「家具・家電付きのマンション」（家電の修理も大家さん）です。どの形でも、部屋で何をするか（業務アプリ）は自分で管理します。
review:
  - IaaS＝ハードウェアまで事業者が管理（物理サーバ操作・ハードの監視が不要に）。PaaS＝ミドルウェア・OSまで事業者が管理（パッチ適用が不要に）。
  - 業務アプリの運用（ジョブ監視など）は、IaaS・PaaSのどちらでも利用者側に残る。
