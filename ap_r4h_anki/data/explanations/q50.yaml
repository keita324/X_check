q: 50
answer: ア
category: ソフトウェア開発管理技術
theme: |
  ソフトウェア開発で使う「IDE（統合開発環境）」が何かを、組込み開発で使う他の道具（デバッガ装置・評価ボード・リアルタイムOS）と区別する問題です。
basics: |
  プログラムを作るには、いくつもの道具が必要です。
  - <b>エディタ</b>：ソースコードを書く・編集する道具。
  - <b>コンパイラ</b>：ソースコードを機械語に変換する道具。
  - <b>リンカ</b>：変換された複数の部品（オブジェクト）をつなぎ合わせ、実行できるプログラムにする道具。
  - <b>デバッガ</b>：プログラムを1行ずつ動かしたり、変数の値を確認したりして、誤り（バグ）を探す道具。
  <b>IDE（Integrated Development Environment：統合開発環境）</b>：これらの道具を<b>1つのソフトウェアにまとめ</b>、同じ画面から使えるようにしたものです。Visual Studio、Eclipse、IntelliJ IDEA などが代表例です。
reasoning: |
  1. IDEの「Integrated（統合された）」が示すとおり、開発に必要な道具が一体になったツールです。
  2. 「エディタ、コンパイラ、リンカ、デバッガなどが一体となったツール」という<b>ア</b>が正解です。
choices:
  ア: エディタ、コンパイラ、リンカ、デバッガなどが一体となったツールは<b>IDE</b>です。<b>正解</b>。
  イ: 専用のハードウェアインタフェース（JTAGなど）を通じてCPUの内部情報を取得する装置は、組込み開発で使う<b>ハードウェアデバッガ（ICE、JTAGデバッガ）</b>です。誤り。
  ウ: ターゲットCPUを搭載した評価ボードなどの実行環境は、組込みソフトを実機に近い環境で動かすための<b>評価ボード（ターゲットボード）</b>です。誤り。
  エ: タスクスケジューリングの仕組みなどを提供するソフトウェアは、<b>OS</b>（組込み機器では<b>リアルタイムOS</b>）です。誤り。
example: |
  料理に例えると、包丁・まな板・コンロ・味見用スプーンがバラバラに置いてあるのではなく、すべてが1つにまとまった「システムキッチン」がIDEです。材料を切る（エディタ）、火を通す（コンパイラ）、盛り付ける（リンカ）、味見して直す（デバッガ）を、同じ場所で流れるように行えます。
review:
  - IDE＝エディタ・コンパイラ・リンカ・デバッガなどを1つにまとめた統合開発環境。
  - ICE/JTAGデバッガ（CPU情報を取得する装置）、評価ボード（実行環境）、リアルタイムOS（スケジューリング）と区別する。
