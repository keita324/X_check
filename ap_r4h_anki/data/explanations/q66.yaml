q: 66
answer: ア
category: システム企画
theme: |
  システム設計で使う図の表記法UMLのうち、業務の流れ（業務フロー）を、分岐や並行処理も含めて表せる図を選ぶ問題です。
basics: |
  <b>UML（Unified Modeling Language）</b>：システムの構造や動きを図で表すための、世界共通の表記ルールです。目的に応じて多くの図があります。
  - <b>アクティビティ図</b>：処理や業務の<b>流れ</b>を表す図。開始・終了、処理（アクティビティ）、<b>分岐</b>（条件で分かれる）、<b>並行処理</b>（同時に進む）、<b>同期</b>（並行した処理が合流するのを待つ）を表現できる。フローチャートの発展版。
  - <b>クラス図</b>：システムを構成するクラス（データと操作のまとまり）と、クラス同士の関係（静的な構造）を表す図。
  - <b>状態マシン図</b>：1つのものの<b>状態</b>が、出来事（イベント）によってどう移り変わるかを表す図。
  - <b>ユースケース図</b>：利用者（アクター）がシステムを使って何ができるか（機能の一覧と関係者）を表す図。
reasoning: |
  1. 問題文の条件は「業務フローを記述する」「処理の分岐や並行処理、処理の同期などを表現できる」です。
  2. 流れ・分岐・並行・同期を表せるのは<b>アクティビティ図</b>です。業務要件定義で、業務の手順を可視化するときによく使われます。
  3. 正解は<b>ア</b>です。
choices:
  ア: アクティビティ図は、業務や処理の流れを、分岐・並行処理・同期も含めて表現できる図です。<b>正解</b>。
  イ: クラス図は、クラスの属性・操作と、クラス間の関係という「静的な構造」を表す図で、処理の流れは表しません。誤り。
  ウ: 状態マシン図は、1つの対象の状態がイベントによってどう遷移するかを表す図で、業務全体の手順の流れを表すものではありません。誤り。
  エ: ユースケース図は、アクターとシステムの機能（ユースケース）の関係を表す図で、処理の順序や分岐は表しません。誤り。
example: |
  ネット通販の注文業務をアクティビティ図で描くと、「注文を受ける」→（在庫あり？で分岐）→「在庫を引き当てる」と「代金を請求する」を並行して進め→両方が終わったら（同期）→「発送する」、のように表せます。
review:
  - アクティビティ図＝業務・処理の流れ（分岐・並行・同期）を表す。業務フローの記述に使う。
  - クラス図（静的構造）、状態マシン図（状態遷移）、ユースケース図（利用者とシステム機能）と区別する。
