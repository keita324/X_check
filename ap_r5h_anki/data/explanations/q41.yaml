q: 41
answer: ア
category: セキュリティ
theme: |
  PCなどに搭載されるセキュリティ用のチップ「TPM」が何かを、送信ドメイン認証・UTM・SIEMと区別する問題です。
basics: |
  <b>TPM（Trusted Platform Module）</b>：PCやサーバのマザーボードなどに搭載される<b>セキュリティ専用のチップ</b>です。
  - 暗号鍵の生成、ハッシュ演算、暗号処理を、チップ内部で行う。
  - 秘密鍵などをチップの中に安全に保管し、外から読み出されにくい（耐タンパ性）。
  - 用途例：ディスク暗号化（BitLocker）の鍵の保護、OSが改ざんされていないかの確認（セキュアブート）。Windows 11 の動作要件にもなっています。

  他の選択肢の技術
  - <b>送信ドメイン認証</b>（SPF、DKIM、DMARCなど）：メールの送信元が詐称されていないか確認する技術。
  - <b>UTM（統合脅威管理）</b>：ファイアウォール、侵入検知、マルウェア対策などを1台にまとめた装置。
  - <b>SIEM</b>：さまざまな機器のログを一元管理し、相関分析して、異常を通知するシステム。
reasoning: |
  1. TPMは「機器に搭載され、鍵生成・ハッシュ演算・暗号処理を行うセキュリティチップ」です。
  2. これを述べているのは<b>ア</b>です。
choices:
  ア: PCなどに搭載され、鍵生成・ハッシュ演算・暗号処理を行うセキュリティチップは<b>TPM</b>です。<b>正解</b>。
  イ: 受信した電子メールが正当な送信者から送信されたことを確認するのは、SPFやDKIMなどの<b>送信ドメイン認証技術</b>です。誤り。
  ウ: ファイアウォール、侵入検知、マルウェア対策などを統合したネットワーク監視装置は<b>UTM</b>です。誤り。
  エ: ログデータを一元管理し、セキュリティイベントの通知や相関分析を行うシステムは<b>SIEM</b>です。誤り。
example: |
  TPMは、パソコンの中に組み込まれた「小さな金庫付きの計算係」です。大事な鍵はこの金庫の中でしか使わせず、外には出しません。ノートPCを盗まれても、TPMで守られた鍵がないとディスクの暗号を解けないので、中のデータは読まれにくくなります。
review:
  - TPM＝機器に搭載され、鍵の生成・保管、ハッシュ演算、暗号処理を行うセキュリティチップ（耐タンパ性）。
  - 送信ドメイン認証（メールの送信元確認）、UTM（複数機能を統合した装置）、SIEM（ログの一元管理と相関分析）と区別する。
