q: 71
answer: イ
category: 技術戦略マネジメント
theme: |
  IoTを支える技術「エネルギーハーベスティング（環境発電）」の説明を、電力の見える化・PoE・間欠動作による省電力と区別する問題です。
basics: |
  <b>IoTデバイス</b>：インターネットにつながるセンサーなどの小さな機器です。山や橋、工場の隅など、電源の配線がしにくい場所に大量に設置されることが多く、<b>電池交換や配線の手間</b>が課題になります。
  <b>エネルギーハーベスティング（Energy Harvesting：環境発電）</b>：harvest＝収穫する。周囲の環境にある<b>振動、熱、光、電磁波（電波）</b>などの微小なエネルギーを集めて電力に変換し、機器に供給する技術です。例：室内の光で動くセンサー、床を踏む振動で発電するスイッチ、体温との温度差で動く機器。
  関連技術
  - <b>PoE（Power over Ethernet）</b>：LANケーブル（カテゴリ5以上）を通じて、データと一緒に電力も供給する技術。
reasoning: |
  1. エネルギーハーベスティングのキーワードは「周囲の環境から」「微小なエネルギーを集めて」「電力に変換」です。
  2. 「周囲の環境から振動、熱、光、電磁波などの微小なエネルギーを集めて電力に変換して、IoTデバイスに供給する技術」という<b>イ</b>が正解です。
choices:
  ア: IoTデバイスのエネルギー使用量や稼働状況を把握して電力使用を最適化するのは、<b>エネルギーマネジメント（電力の見える化）</b>の技術です。発電する技術ではありません。誤り。
  イ: 周囲の環境から振動・熱・光・電磁波などの微小なエネルギーを集めて電力に変換し、供給するのは<b>エネルギーハーベスティング</b>です。<b>正解</b>。
  ウ: カテゴリ5以上のLANケーブルで電力を供給するのは<b>PoE</b>です。誤り。
  エ: 必要なときだけ電源をONにして通信し、省電力化を図るのは、<b>間欠動作（スリープ制御）</b>などの省電力技術です。電力を作り出す技術ではありません。誤り。
example: |
  電卓の小さな太陽電池は、部屋の明かりで動きます。これが身近なエネルギーハーベスティングの例です。電池交換が難しい橋の点検センサーを、車が通るときの振動で発電して動かす、といった使い方もされています。
review:
  - エネルギーハーベスティング＝周囲の振動・熱・光・電磁波などの微小なエネルギーを電力に変換して機器に供給する（環境発電）。
  - PoE（LANケーブルで給電）、エネルギーマネジメント（使用量の最適化）、間欠動作（省電力）と区別する。
