q: 52
answer: ウ
category: プロジェクトマネジメント
theme: |
  アーンドバリューマネジメント（EVM）で、EV − PV（スケジュール差異）が負のとき、プロジェクトがどんな状況かを読み取る問題です。
basics: |
  <b>EVM</b>では、プロジェクトの状況を金額で表します。
  - <b>PV（プランドバリュー）</b>：今の時点までに<b>終わっている予定だった</b>作業の予算額。
  - <b>EV（アーンドバリュー）</b>：今の時点までに<b>実際に終わった</b>作業の予算額（出来高）。
  - <b>AC（実コスト）</b>：今の時点までに<b>実際に使った</b>お金。
  2つの差異
  | <b>SV（スケジュール差異）＝ EV − PV</b>：負なら、予定より作業が終わっていない＝<b>進捗が遅れている</b>
  | <b>CV（コスト差異）＝ EV − AC</b>：負なら、出来高以上にお金を使っている＝<b>予算超過</b>
reasoning: |
  1. EV − PV が負 ⇔ EV ＜ PV、つまり「実際に終わった作業量」が「終わっている予定だった作業量」より少ない状態です。
  2. これは、現時点で<b>進捗が計画より遅れている</b>ことを示します。
  3. 正解は<b>ウ</b>です。
choices:
  ア: スケジュール効率（SPI＝EV÷PV）は、EV＜PV なので1未満になり、計画より<b>悪い</b>状態です。「良い」は誤り。
  イ: 現時点で進捗が遅れていることは分かりますが、今後の挽回などもあり得るため、EV−PVだけで「プロジェクトの完了が計画より遅くなる」と断定はできません。問題が問う「現時点の状況」としてはウが適切です。誤り。
  ウ: EV−PVが負であるのは、実際の出来高が予定より少ない、つまりプロジェクトの進捗が計画より遅れている状況です。<b>正解</b>。
  エ: 進捗が計画より進んでいるなら EV ＞ PV で、EV−PV は正になります。誤り。
example: |
  夏休みの宿題を30日で300ページやる計画で、10日目までに100ページ（PV）終わる予定が、実際は80ページ（EV）しか終わっていなければ、EV−PV＝−20ページで、進捗が遅れています。ここから頑張れば、最終日には間に合うかもしれません。
review:
  - SV（スケジュール差異）＝EV−PV。負なら進捗の遅れ、正なら進捗の前倒し。
  - CV（コスト差異）＝EV−AC。負なら予算超過。SPI＝EV÷PV、CPI＝EV÷AC も合わせて覚える。
