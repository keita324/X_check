q: 56
answer: ウ
category: サービスマネジメント
theme: |
  サービスマネジメントの規格JIS Q 20000-1で、「継続的改善」について定められている内容を正しく理解しているかを問う問題です。
basics: |
  <b>JIS Q 20000-1</b>：ITサービスなどを提供する組織が、サービスを適切に管理する仕組み（SMS：サービスマネジメントシステム）の要求事項を定めた規格です。
  <b>継続的改善</b>：パフォーマンスを向上するために繰り返し行われる活動です。規格では、主に次のことを求めています。
  - SMSと<b>サービスの両方</b>について、適切性・妥当性・有効性を継続的に改善する。
  - 改善の機会に適用する<b>評価基準</b>を決める。その評価基準には、<b>改善とSMSの目的との整合性</b>（改善が目的に沿っているか）を含める。
  - 改善の<b>目標</b>（品質、価値、能力、コスト、生産性などから必要なもの）を設定し、実施した改善を、<b>設定した目標に照らして</b>測定・評価する。
reasoning: |
  1. ア：改善の目標は品質・費用などのうち必要なものについて設定するもので、「品質と費用の両方について必ず設定しなければならない」わけではありません → ×。
  2. イ：継続的改善の対象には、サービスだけでなく<b>SMS自体</b>も含まれます → ×。
  3. ウ：改善の機会に適用する評価基準には、改善とSMSの目的との整合性を含めなければならない → ○。
  4. エ：実施した改善は、<b>設定した目標に照らして</b>測定します → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 改善の目標は、品質、価値、能力、コスト、生産性など、必要な観点について設定するもので、品質と費用の両方を必ず設定するという要求ではありません。誤り。
  イ: 継続的改善では、提供するサービスとともに、サービスマネジメントシステム（SMS）自体も改善の対象になります。誤り。
  ウ: 改善の機会に適用する評価基準には、改善とサービスマネジメントの目的との整合性を含めなければなりません。<b>正解</b>。
  エ: 実施された改善は、設定した目標に照らして測定・評価します。誤り。
example: |
  部活動の改善で考えると、「部の目標（大会で勝つ）に沿っているか」を判断基準にして改善案を選び（評価基準に目的との整合性を含める）、「次の大会でベスト8」という目標を決め、結果をその目標に照らして振り返ります。練習メニュー（サービス）だけでなく、部の運営の仕組み（SMS）も改善の対象です。
review:
  - JIS Q 20000-1の継続的改善：SMSとサービスの両方が対象。改善の評価基準には目的との整合性を含める。
  - 改善の効果は設定した目標に照らして測定する。
