q: 60
answer: エ
category: システム監査
theme: |
  金融庁の「財務報告に係る内部統制の評価及び監査の基準」で、内部統制に関係する人（株主、監査役、経営者、内部監査人など）の役割と責任を正しく理解しているかを問う問題です。
basics: |
  <b>内部統制</b>：会社の業務が適正に行われ、財務報告（決算書など）が信頼できるものになるように、社内に作る仕組み（ルール、チェック体制など）です。
  基準に示されている主な関係者の役割
  - <b>経営者</b>：内部統制の整備・運用について<b>最終的な責任</b>を負う。
  - <b>取締役会</b>：内部統制の整備・運用に係る<b>基本方針を決定</b>する。経営者による整備・運用を監督する。
  - <b>監査役（監査委員会など）</b>：取締役・執行役の職務の執行に対する監査の一環として、<b>独立した立場から</b>、内部統制の整備・運用状況を監視・検証する。
  - <b>内部監査人</b>：<b>モニタリングの一環</b>として、内部統制の整備・運用状況を検討・評価し、必要に応じて改善を促す。
  - 株主などの社外の関係者は、内部統制の整備・運用の責任者ではありません。
reasoning: |
  1. ア：最終的な責任を有するのは<b>経営者</b>で、株主ではありません → ×。
  2. イ：基本方針を決定するのは<b>取締役会</b>で、監査役ではありません → ×。
  3. ウ：独立した立場から監視・検証するのは<b>監査役</b>の役割で、経営者ではありません → ×。
  4. エ：内部監査人は、モニタリングの一環として、内部統制の整備・運用状況を検討・評価し、改善を促す → ○。
  5. 正解は<b>エ</b>です。
choices:
  ア: 内部統制の整備・運用について最終的な責任を有するのは<b>経営者</b>です。株主ではありません。誤り。
  イ: 内部統制の整備・運用に係る基本方針を決定するのは<b>取締役会</b>です。監査役は監視・検証する立場です。誤り。
  ウ: 取締役・執行役の職務の執行に対する監査の一環として、独立した立場から内部統制を監視・検証するのは<b>監査役</b>の役割です。経営者は監査される側です。誤り。
  エ: 内部監査人は、モニタリングの一環として、内部統制の整備・運用状況を検討・評価し、必要に応じて改善を促す職務を担っています。<b>正解</b>。
example: |
  学校に例えると、校長（経営者）は学校運営の最終責任者、理事会（取締役会）は運営の基本方針を決め、監事（監査役）は理事や校長の仕事を外部から独立してチェックし、校内の点検係の先生（内部監査人）は日々のルールが守られているかを点検して改善を促す、という役割分担です。
review:
  - 経営者＝最終責任、取締役会＝基本方針の決定、監査役＝独立した立場から監視・検証、内部監査人＝モニタリングとして評価・改善を促す。
  - 選択肢の「主語（誰が）」と「役割」の組合せが入れ替えられていないかを確認する。
