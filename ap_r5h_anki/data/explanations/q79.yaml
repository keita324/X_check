q: 79
answer: エ
category: 法務
theme: |
  労働者派遣法で定められている義務のうち、「派遣元事業主」（派遣会社）が講ずべき措置を、「派遣先」（派遣労働者を受け入れて指揮命令する会社）の義務と区別する問題です。
basics: |
  <b>労働者派遣</b>：派遣元（派遣会社）に雇われた労働者が、派遣先の会社に行き、<b>派遣先の指揮命令</b>を受けて働く形態です。
  | 派遣元：労働者と<b>雇用契約</b>を結び、給料を払う
  | 派遣先：労働者に<b>指揮命令</b>して仕事をさせる
  役割が違うので、法律上の義務も分かれています。
  - <b>派遣元事業主の主な措置</b>：派遣元管理台帳の作成、派遣元責任者の選任、労働者の<b>教育訓練の機会の確保など福祉の増進</b>、キャリア形成の支援、待遇に関する説明 など
  - <b>派遣先の主な措置</b>：<b>派遣先管理台帳</b>の作成、<b>派遣先責任者</b>の選任、指揮命令する者その他関係者への<b>派遣契約の内容の周知</b>、苦情の処理 など
reasoning: |
  1. ア「派遣先管理台帳の作成」、イ「派遣先責任者の選任」は、名前のとおり<b>派遣先</b>の義務です。
  2. ウ「指揮命令する者その他関係者への派遣契約内容の周知」は、実際に指揮命令する側である<b>派遣先</b>の義務です。
  3. エ「労働者の教育訓練の機会の確保など、福祉の増進」は、労働者を雇用している<b>派遣元事業主</b>が講ずべき措置です。
  4. 正解は<b>エ</b>です。
choices:
  ア: 派遣先管理台帳の作成は、<b>派遣先</b>が講ずべき措置です（派遣元は派遣元管理台帳を作成します）。誤り。
  イ: 派遣先責任者の選任は、<b>派遣先</b>が講ずべき措置です（派遣元は派遣元責任者を選任します）。誤り。
  ウ: 派遣労働者を指揮命令する者などへの派遣契約内容の周知は、<b>派遣先</b>が講ずべき措置です。誤り。
  エ: 労働者の教育訓練の機会の確保など福祉の増進は、<b>派遣元事業主</b>が講ずべき措置です。<b>正解</b>。
example: |
  派遣会社（派遣元）は、登録しているスタッフの「所属事務所」のようなものです。給料を払い、スキルアップの研修を用意し、福利厚生を整えるのは所属事務所の役目です。一方、実際に働く現場（派遣先）は、現場の責任者を決め、誰がいつ働いたかを記録し、現場のメンバーに契約内容を伝える役目を負います。
review:
  - 派遣元事業主の措置：教育訓練など福祉の増進、派遣元管理台帳、派遣元責任者 など（雇用主としての責任）。
  - 派遣先の措置：派遣先管理台帳、派遣先責任者、指揮命令者への契約内容の周知 など（指揮命令する側の責任）。
