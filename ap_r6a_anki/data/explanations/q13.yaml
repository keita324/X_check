q: 13
answer: エ
category: システム構成要素
theme: |
  データの保存・アクセス方式の一つ「オブジェクトストレージ」の特徴を、ファイルストレージ・ブロックストレージと区別する問題です。
basics: |
  ストレージのデータアクセス方式は、大きく3つあります。
  - <b>ファイルストレージ</b>：ファイルシステムを構成し、フォルダ（ディレクトリ）の<b>階層構造</b>の中で、<b>ファイル単位</b>でデータにアクセスする（パソコンのフォルダやNASなど）。
  - <b>ブロックストレージ</b>：ストレージの論理ボリュームを<b>決まったサイズのブロック</b>に分割し、ブロック単位でアクセスする（SANやサーバの内蔵ディスクなど）。高速で、データベースなどに向く。
  - <b>オブジェクトストレージ</b>：データ本体と、そのデータに関する情報（<b>メタデータ</b>：作成日、種類、独自の属性など）をセットにした「<b>オブジェクト</b>」として保存し、<b>固有の識別子（ID）</b>でアクセスする。階層構造をもたないフラットな構造なので、大量のデータを拡張しやすい。クラウドのストレージサービス（Amazon S3など）で広く使われ、HTTPのAPIでアクセスすることが多い。
reasoning: |
  1. オブジェクトストレージのキーワードは「データとメタデータをセットで保存」「固有の識別子でアクセス」（階層構造ではない）です。
  2. 「データとメタデータをセットにして保存し、固有の識別子でデータにアクセスする」という<b>エ</b>が正解です。
choices:
  ア: ファイルシステムを構成してファイル単位でアクセスするのは、<b>ファイルストレージ</b>の説明です。誤り。
  イ: 論理ボリュームを決まったサイズに分割し、その単位でアクセスするのは、<b>ブロックストレージ</b>の説明です。誤り。
  ウ: データとメタデータをセットで保存する点はオブジェクトストレージと同じですが、オブジェクトストレージは階層構造ではなく、フラットな構造で識別子を使ってアクセスします。誤り。
  エ: データとメタデータをセットにして保存し、固有の識別子でアクセスするのは、<b>オブジェクトストレージ</b>です。<b>正解</b>。
example: |
  ファイルストレージは「本棚の段と仕切り（フォルダ）に本を並べる図書館」、オブジェクトストレージは「荷物に番号札と内容のラベル（メタデータ）を付けて、巨大な倉庫に置いておく預かり所」です。預かり所では、番号札（識別子）さえあれば、どこに置いてあっても荷物を取り出せます。
review:
  - オブジェクトストレージ＝データ＋メタデータを「オブジェクト」として保存し、固有の識別子でアクセス（フラットな構造、クラウドで多用）。
  - ファイルストレージ（階層構造・ファイル単位）、ブロックストレージ（固定長ブロック単位）と区別する。
