q: 80
answer: エ
category: 法務
theme: |
  欧州（EU）に電気電子製品を輸出するときに守る必要がある「RoHS指令」の目的を、他の規制（リサイクル、電磁妨害、輸出管理）と区別する問題です。
basics: |
  <b>RoHS指令（Restriction of Hazardous Substances）</b>：EUの規制で、<b>電気電子機器に含まれる有害物質</b>（鉛、水銀、カドミウム、六価クロム、特定の臭素系難燃剤など）の使用を制限するものです。製品の生産から廃棄・処分までのすべての段階で、有害物質が環境や人の健康に及ぼす危険を最小化することを目的としています。EUに輸出する電子部品や製品は、この基準を満たす必要があります。

  紛らわしい規制
  - <b>WEEE指令</b>（EU）や日本の<b>家電リサイクル法</b>：使用済みの家電製品を回収・リサイクルし、廃棄物を減らす。
  - <b>EMC（電磁両立性）規制</b>：機器が出す電磁妨害が、他の機器の動作を妨げないようにする。
  - <b>安全保障貿易管理（外為法など）</b>：大量破壊兵器などに転用されるおそれのある物品・技術の輸出を規制する。
reasoning: |
  1. RoHS指令のキーワードは「電気電子製品」「有害物質」「環境と人の健康」です。
  2. 「電気電子製品の生産から処分までの全ての段階で、有害物質が環境及び人の健康に及ぼす危険を最小化する」という<b>エ</b>が正解です。
choices:
  ア: 家電製品から有用な部分や材料をリサイクルし、廃棄物を減らして資源を有効利用するのは、<b>WEEE指令</b>や家電リサイクル法の目的です。誤り。
  イ: 機器が発生する電磁妨害が、他の機器の意図する動作を妨げるレベルを超えないようにするのは、<b>EMC規制</b>（EMC指令など）の目的です。誤り。
  ウ: 大量破壊兵器の開発・拡散などに関わるおそれがある輸出行為を防止するのは、<b>安全保障貿易管理</b>の目的です。誤り。
  エ: 電気電子製品の生産から処分までの全段階で、有害物質が環境と人の健康に及ぼす危険を最小化するのは、<b>RoHS指令</b>の目的です。<b>正解</b>。
example: |
  昔の電子機器のはんだには鉛が多く使われていましたが、捨てられた機器から鉛が土や水に溶け出すおそれがあります。RoHS指令に対応するため、現在の電子機器の多くは「鉛フリーはんだ」を使っています。
review:
  - RoHS指令＝電気電子機器の有害物質（鉛・水銀・カドミウムなど）の使用を制限し、環境と健康への危険を最小化するEUの規制。
  - WEEE（リサイクル）、EMC（電磁妨害）、安全保障貿易管理（兵器転用の防止）と区別する。
