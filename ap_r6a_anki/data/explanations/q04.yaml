q: 4
answer: ア
category: 基礎理論
theme: |
  自動車の先進運転支援システム（ADAS）で使われるセンサー（可視光カメラ、超音波センサー、ミリ波レーダー、レーザーレーダー）の特徴を正しく理解しているかを問う問題です。
basics: |
  - <b>可視光カメラ</b>：人間の目と同じように見える光で撮影する。<b>色や形、文字</b>を認識できるので、交通標識、信号の色、白線の認識に使える。一方、雨・霧・逆光・夜間など<b>天候や明るさの影響を受けやすい</b>。
  - <b>超音波センサー</b>：超音波の反射で距離を測る。測定できる距離は<b>数メートル程度と短い</b>ので、駐車時の障害物検知などに使う。
  - <b>ミリ波レーダー</b>：ミリ波帯の電波を使う。<b>雨や霧など天候の影響を受けにくく</b>、遠くの物体の距離や速度を測れる。ただし、色は判別できない。
  - <b>レーザーレーダー（LiDAR）</b>：レーザー光の反射で、物体の距離や形を細かく測る。光を使うので、霧や大雨などの天候の影響をある程度受ける。光は物体を回り込めないので、建物の後ろの物体は検知できない。
reasoning: |
  各選択肢の正誤を確認します。
  1. ア：可視光カメラは天候の影響を受けやすいが、色や形を認識できるので交通標識の認識に使える → ○。
  2. イ：超音波センサーの測定距離は数メートル程度で、500メートル以上は誤り → ×。
  3. ウ：ミリ波レーダーは天候の影響を受けにくいが、電波の反射を測るだけで色は分からないので、信号の灯色は判別できない → ×。
  4. エ：レーザーレーダーは光の反射を使うので、建物の陰（見えない場所）にある物体は検知できない。また天候の影響もある程度受ける → ×。
  5. 正解は<b>ア</b>です。
choices:
  ア: 可視光カメラは、天候などの影響を受けやすいものの、色や形を捉えられるので交通標識の認識に使用できます。<b>正解</b>。
  イ: 超音波センサーの測定可能距離は数メートル程度と短く、500メートル以上ではありません。誤り。
  ウ: ミリ波レーダーは天候の影響を受けにくい点は正しいですが、電波の反射を利用するため色の判別はできず、信号の灯色は判別できません。誤り。
  エ: レーザーレーダーは光の直進・反射を利用するため、建物の後ろにある物体は検知できません。誤り。
example: |
  人間に例えると、可視光カメラは「目」（色や文字が分かるが、霧の日は見えにくい）、ミリ波レーダーは「コウモリのような感覚」（霧でも距離は分かるが色は分からない）です。自動運転では、それぞれの得意・不得意を補い合うように組み合わせて使います。
review:
  - 可視光カメラ＝色・形・文字の認識（標識・信号・白線）が得意、天候に弱い。ミリ波レーダー＝天候に強く距離・速度が得意、色は分からない。
  - 超音波センサー＝近距離（数m）、レーザーレーダー＝距離・形状を精密に測るが、見えない場所は検知できない。
