q: 65
answer: ア
category: システム企画
theme: |
  システムに求める要件のうち、非機能要件の「使用性（使いやすさ）」に当たるものを、性能・移行性・可用性などと区別する問題です。
basics: |
  <b>機能要件</b>：システムが「何をするか」の要件（例：受注を登録できる、請求書を印刷できる）。
  <b>非機能要件</b>：機能以外の、システムの「品質」に関する要件です。主な分類は次のとおりです。
  - <b>使用性（ユーザビリティ）</b>：利用者が分かりやすく、覚えやすく、使いやすいか（操作の習得にかかる時間など）。
  - <b>性能（性能効率性）</b>：処理の速さや、決められた時間内に処理を終えられるか。
  - <b>移行性</b>：現行システムから新システムへ、データや業務をどう移すか（移行期間など）。
  - <b>可用性</b>：システムを使いたいときに使えるか、障害・災害時にどれだけで復旧できるか。
reasoning: |
  1. 各選択肢がどの非機能要件に当たるかを分類します。
  2. ア「4時間以内のトレーニングで新しい画面を操作できるようになる」→ 操作の覚えやすさ＝<b>使用性</b>
  3. イ「ピーク日でも8時間以内で夜間バッチ処理を完了できる」→ 処理時間＝性能
  4. ウ「現行システムから新システムに72時間以内で移行できる」→ 移行性
  5. エ「大規模災害時でも144時間以内に復旧できる」→ 可用性（事業継続）
  6. 正解は<b>ア</b>です。
choices:
  ア: 短時間のトレーニングで新しい画面を操作できるようになることは、操作の習得しやすさを表す<b>使用性</b>の要件です。<b>正解</b>。
  イ: ピーク時でも夜間バッチ処理を決められた時間内に終えられることは、処理能力に関する<b>性能</b>の要件です。誤り。
  ウ: 現行システムから新システムへの移行を決められた時間内に終えられることは、<b>移行性</b>の要件です。誤り。
  エ: 大規模災害時でも決められた時間内にシステムを復旧できることは、<b>可用性</b>（事業継続性）の要件です。誤り。
example: |
  新しいスマホアプリで考えると、「説明書を読まなくても5分で使い方が分かる」は使用性、「ボタンを押して1秒以内に画面が切り替わる」は性能、「古い機種からデータを1時間で引っ越しできる」は移行性、「サーバが故障しても30分で使えるようになる」は可用性の要件です。
review:
  - 使用性＝利用者の使いやすさ・習得しやすさ（トレーニング時間、操作の分かりやすさ）。
  - 性能（処理時間）、移行性（移行期間）、可用性（障害・災害時の復旧）と分類できるようにする。
