q: 29
answer: エ
category: データベース
theme: |
  UMLのクラス図で表したデータモデルについて、条件文から「多重度」（相手が何個対応するか）を読み取って当てはめる問題です。
basics: |
  <b>多重度</b>：クラス図の線の端に書く、「相手側から見て、このクラスのデータがいくつ対応するか」を表す数です。
  | 1：ちょうど1つ
  | 0..*：0個以上（なくてもよい）
  | 1..*：1個以上（少なくとも1つはある）
  線の<b>こちら側の端</b>に書かれた多重度は、「<b>反対側のデータ1つに対して、こちら側のデータがいくつ対応するか</b>」を表します。

  この図の構成：部門 ─ 所属履歴 ─ 社員。所属履歴は「どの社員が、どの部門に、いつからいつまで所属したか」を1件ずつ記録したものです。
reasoning: |
  <b>a（部門と所属履歴の間の、所属履歴側の多重度）</b>
  「1つの部門に対して、所属履歴が何件あるか」を考えます。
  | 条件(1)：部門には1人以上の社員が所属する
  | → どの部門にも、少なくとも1件の所属履歴がある → <b>1..*</b>
  <b>b（所属履歴と社員の間の、所属履歴側の多重度）</b>
  「1人の社員に対して、所属履歴が何件あるか」を考えます。
  | 条件(2)：社員はいずれか一つの部門に所属する
  | → どの社員にも、少なくとも1件の所属履歴がある。異動すれば履歴は増える → <b>1..*</b>
  a＝1..*、b＝1..* の組合せは<b>エ</b>です。
choices:
  ア: a・bとも 0..* だと、所属履歴が1件もない部門や社員を認めることになり、条件(1)(2)に反します。誤り。
  イ: a が 0..* だと、社員が1人も所属していない部門を認めることになり、条件(1)「部門には1人以上の社員が所属する」に反します。誤り。
  ウ: b が 0..* だと、どの部門にも所属していない社員を認めることになり、条件(2)「社員はいずれか一つの部門に所属する」に反します。誤り。
  エ: a＝1..*（部門ごとに履歴が1件以上）、b＝1..*（社員ごとに履歴が1件以上）。条件(1)(2)と一致します。<b>正解</b>。
example: |
  学校の「クラス ─ 在籍記録 ─ 生徒」で考えると、どのクラスにも生徒が1人以上いるなら、クラス1つに対して在籍記録は1件以上（1..*）。どの生徒もどこかのクラスに在籍し、進級するたびに記録が増えるなら、生徒1人に対しても在籍記録は1件以上（1..*）です。
review:
  - 多重度は線の「こちら側」に書き、反対側のデータ1つに対してこちら側がいくつ対応するかを表す。
  - 「必ず1つ以上ある」なら 1..*、「なくてもよい」なら 0..*。条件文の「1人以上」「いずれか一つに所属する」から判断する。
