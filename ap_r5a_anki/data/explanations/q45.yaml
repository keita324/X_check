q: 45
answer: エ
category: セキュリティ
theme: |
  DNSの応答が偽物でないことを確かめるための仕組み「DNSSEC」の説明を、他のDNSのセキュリティ対策と区別する問題です。
basics: |
  <b>DNS</b>：ドメイン名（www.example.com）をIPアドレスに変換する仕組みです。
  <b>DNSキャッシュポイズニング</b>：DNSサーバに偽の応答を覚え込ませ、利用者を偽サイトへ誘導する攻撃です。

  DNSの主なセキュリティ対策
  - <b>DNSSEC（DNS Security Extensions）</b>：DNSの応答に<b>公開鍵暗号方式によるデジタル署名</b>を付け、受け取った側（クライアント側のリゾルバ）が、署名を検証して<b>正当なDNSサーバからの改ざんされていない応答</b>であることを確認できるようにする仕組み。
  - <b>送信元ポート番号のランダム化</b>：問合せのたびに送信元ポート番号を変えて、攻撃者が偽の応答を当てにくくする対策（キャッシュポイズニング対策）。
  - <b>再帰問合せを受け付けるクライアントの制限</b>：誰からの問合せにも答えるオープンリゾルバにしないことで、DNSを悪用したDoS攻撃（リフレクション攻撃）を防ぐ対策。
reasoning: |
  1. DNSSECは、公開鍵暗号方式によるデジタル署名で、応答の正当性を検証できるようにする仕組みです。
  2. 「公開鍵暗号方式によるデジタル署名を用いることによって、正当なDNSサーバからの応答であることをクライアントが検証できる」という<b>エ</b>が正解です。
choices:
  ア: 問合せ時の送信元ポート番号をランダムに選ぶのは、<b>送信元ポートランダム化</b>によるキャッシュポイズニング対策で、DNSSECではありません。誤り。
  イ: 再帰的な問合せを許可するクライアントを制限して、DNSを悪用したDoS攻撃を防ぐのは、<b>オープンリゾルバ対策</b>で、DNSSECではありません。誤り。
  ウ: DNSSECは、共通鍵暗号方式のメッセージ認証ではなく、<b>公開鍵暗号方式</b>のデジタル署名を使います（共通鍵によるメッセージ認証は、DNSサーバ間の通信を保護するTSIGなどの仕組みです）。誤り。
  エ: 公開鍵暗号方式によるデジタル署名を用いて、正当なDNSサーバからの応答であることをクライアントが検証できるのは<b>DNSSEC</b>です。<b>正解</b>。
example: |
  電話帳の各ページに、発行元の正式な押印（デジタル署名）があれば、誰かが偽の電話番号を書き込んだページに差し替えても、押印を確かめることで偽物だと分かります。DNSSECは、このように「電話帳」の内容が本物かを確かめられるようにする仕組みです。
review:
  - DNSSEC＝DNS応答に公開鍵暗号のデジタル署名を付け、応答の正当性（改ざん・なりすましがないこと）を検証できるようにする。
  - 送信元ポートのランダム化（キャッシュポイズニング対策）、再帰問合せの制限（オープンリゾルバ対策）と区別する。
