q: 39
answer: ア
theme: |
  セキュリティ事故（インシデント）に対応する組織体制「CSIRT」づくりを支援するために、JPCERTコーディネーションセンターが作成した資料を選ぶ問題です。どの団体がどの資料を作ったかの知識問題です。
basics: |
  <b>インシデント</b>：情報漏えい、マルウェア感染、不正アクセスなど、情報セキュリティ上の事故や事件です。
  <b>CSIRT（シーサート）</b>：Computer Security Incident Response Team。組織の中で、インシデントが起きたときに受付・分析・対応・再発防止を行う専門チームです。
  <b>JPCERTコーディネーションセンター（JPCERT/CC）</b>：日本のインシデント対応を支援する中立的な組織。国内外のCSIRTとの連絡調整役を務めます。

  資料と作成元の対応
  - <b>CSIRTマテリアル</b>：JPCERT/CC（CSIRTの構築・運用を支援する資料集）
  - <b>ISMSユーザーズガイド</b>：JIPDEC（ISMS認証の要求事項の解説）
  - <b>証拠保全ガイドライン</b>：デジタル・フォレンジック研究会
  - <b>組織における内部不正防止ガイドライン</b>：IPA（情報処理推進機構）
reasoning: |
  1. 「組織的なインシデント対応体制」＝CSIRTのことです。
  2. JPCERT/CCは、組織がCSIRTを作り、運用するための考え方や手順をまとめた「CSIRTマテリアル」を公開しています。
  3. 正解は<b>ア</b>です。
choices:
  ア: CSIRTマテリアルは、JPCERT/CCが組織内CSIRTの構築・運用を支援するために作成した資料です。<b>正解</b>。
  イ: ISMSユーザーズガイドは、ISMS（情報セキュリティマネジメントシステム）認証制度を運営するJIPDECが作成した、要求事項の解説資料です。誤り。
  ウ: 証拠保全ガイドラインは、デジタル・フォレンジック研究会が作成した、事故時に電子的な証拠を正しく保全するための指針です。誤り。
  エ: 組織における内部不正防止ガイドラインは、IPAが作成した、従業員などによる情報の持出しや不正を防ぐための指針です。誤り。
example: |
  CSIRTは、会社の中の「消防隊」のようなものです。火事（インシデント）が起きたときに駆けつけ、消火し、原因を調べ、再発防止策を考えます。CSIRTマテリアルは、その消防隊の作り方・訓練の仕方をまとめた教本にあたります。
review:
  - CSIRT＝組織内のインシデント対応チーム。その構築支援資料「CSIRTマテリアル」はJPCERT/CCが作成。
  - ISMSユーザーズガイド＝JIPDEC、証拠保全ガイドライン＝デジタル・フォレンジック研究会、内部不正防止ガイドライン＝IPA、と作成元をセットで覚える。
