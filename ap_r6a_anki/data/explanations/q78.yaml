q: 78
answer: イ
category: 法務
theme: |
  著作権法で保護される対象と、保護されない対象（アルゴリズム・プログラム言語・プロトコル）を区別する問題です。
basics: |
  <b>著作権法</b>は、思想や感情を<b>創作的に表現</b>したもの（著作物）を保護します。<b>アイデアそのものは保護されず</b>、表現したものが保護されます。
  <b>プログラム</b>は著作物として保護されます。ただし、著作権法第10条第3項により、プログラムを作るための次のものは保護の対象外です。
  - <b>プログラム言語</b>：プログラムを表現する手段としての文字や記号、その体系（例：C言語の文法そのもの）。
  - <b>規約</b>：プログラム間のインタフェースや<b>プロトコル</b>などの約束事。
  - <b>解法</b>：プログラムの処理手順、つまり<b>アルゴリズム</b>。
  アルゴリズムなどのアイデアは、要件を満たせば<b>特許権</b>で保護される場合があります。
reasoning: |
  1. コンパイラ（プログラム言語を機械語に翻訳するソフトウェア）は、それ自体が<b>プログラム</b>なので、著作物として保護されます。
  2. アルゴリズム（解法）、プログラム言語、プロトコル（規約）は、著作権法でプログラムの著作物の保護対象外と明記されています。
  3. 正解は<b>イ</b>です。
choices:
  ア: アルゴリズムは著作権法上の「解法」に当たり、保護の対象外です（アイデアは著作権では保護されません）。誤り。
  イ: コンパイラのプログラムは、創作的に表現されたプログラムの著作物として著作権法で保護されます。<b>正解</b>。
  ウ: プログラム言語は、プログラムを表現する手段としての文字・記号やその体系であり、著作権法の保護の対象外です。誤り。
  エ: プロトコルは、プログラムで用いる約束事である「規約」に当たり、著作権法の保護の対象外です。誤り。
example: |
  料理で例えると、「肉じゃがの作り方の手順」（アルゴリズム）や「日本語」（言語）は誰でも使えますが、ある料理研究家が書いたレシピ本の文章（表現）は勝手にコピーできません。同じように、Pythonの文法やソートの手順は自由に使えますが、他人が書いたコンパイラのソースコードは無断で複製できません。
review:
  - プログラムは著作物として保護される。ただし、プログラム言語・規約（プロトコル）・解法（アルゴリズム）は保護対象外。
  - アイデア（アルゴリズムなど）は著作権ではなく、特許権で保護される可能性がある。
