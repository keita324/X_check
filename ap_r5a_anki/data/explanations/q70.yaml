q: 70
answer: ウ
category: 技術戦略マネジメント
theme: |
  自社だけでなく外部の技術やアイディアも取り込んで新しい価値を生み出す「オープンイノベーション」の説明を選ぶ問題です。
basics: |
  <b>イノベーション</b>：新しい技術や考え方で、新しい価値（製品、サービス、仕組みなど）を生み出すことです。
  - <b>クローズドイノベーション</b>：研究開発から製品化までを、<b>自社の中だけ</b>で行うやり方。
  - <b>オープンイノベーション</b>：自社の技術やアイディアと、<b>外部の組織</b>（他社、大学、スタートアップなど）の技術やアイディアを<b>組み合わせて</b>新しい価値を生み出し、さらにそれを外部にも提供・活用していくやり方。自社の技術を他社にライセンスしたり、外部の知恵を取り入れたりして、双方向に知識をやり取りするのが特徴。
  関連する取組み
  - <b>アウトソーシング</b>：業務の一部を外部に任せること（単なる外部委託は、オープンイノベーションとは別）。
  - <b>BPR（業務改革）</b>：業務の工程を見直して生産性を上げること。
reasoning: |
  1. オープンイノベーションの要点は「自社と外部組織の技術やアイディアを組み合わせる」「創出した価値をさらに外部へ提供する」ことです。
  2. これを述べているのは<b>ウ</b>です。
choices:
  ア: 外部企業に製品開発の一部を任せて短期間で市場投入するのは、開発の<b>アウトソーシング</b>（外部委託）で、外部の知恵を組み合わせて新たな価値を共創するオープンイノベーションの説明としては不十分です。誤り。
  イ: 製品やサービスを自社だけで開発して新たな価値を創出するのは、<b>クローズドイノベーション</b>の考え方です。誤り。
  ウ: 自社と外部組織の技術やアイディアを組み合わせて価値を創出し、さらに外部組織へ提供するのは、<b>オープンイノベーション</b>です。<b>正解</b>。
  エ: 自社の業務の工程を見直して生産性向上とコスト削減を実現するのは、<b>業務改善（BPR）</b>の取組みです。誤り。
example: |
  自動車メーカーが、大学の電池研究とIT企業のソフトウェア技術を組み合わせて新しい電気自動車を開発し、その電池技術を他のメーカーにも提供する、というのがオープンイノベーションの例です。社内の研究所だけで全部開発するのは、クローズドイノベーションです。
review:
  - オープンイノベーション＝自社と外部（他社・大学・スタートアップ）の技術やアイディアを組み合わせて価値を創出し、外部にも提供する。
  - クローズドイノベーション（自社内で完結）、アウトソーシング（外部委託）、業務改善と区別する。
