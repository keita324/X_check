q: 16
answer: エ
category: ソフトウェア
theme: |
  仮想記憶のページフォールト処理には「ページインだけで済む場合」と「ページアウトも必要な場合」があり、平均処理時間からそれぞれの割合を逆算する問題です。
basics: |
  <b>ページング方式の仮想記憶</b>：プログラムをページ単位に分け、必要なページだけを主記憶に置いて実行します。
  <b>ページフォールト</b>：必要なページが主記憶にないこと。補助記憶からそのページを読み込みます（<b>ページイン</b>）。
  - 主記憶に空きがあれば、ページインだけで済みます（この問題では20ミリ秒）。
  - 空きがなければ、追い出すページを選んで補助記憶に書き出し（<b>ページアウト</b>）、それからページインします（この問題では合計60ミリ秒）。
  <b>平均処理時間（期待値）</b>：それぞれの処理時間に、それが起こる割合を掛けて足したものです。
reasoning: |
  1. ページアウトを伴わない（ページインだけの）割合を p とすると、ページアウトを伴う割合は 1 − p です。
  2. 平均処理時間が30ミリ秒なので、
  | 20 × p ＋ 60 × (1 − p) ＝ 30
  | 20p ＋ 60 − 60p ＝ 30
  | −40p ＝ −30
  | p ＝ <b>0.75</b>
  3. 検算：20×0.75 ＋ 60×0.25 ＝ 15 ＋ 15 ＝ 30 ✓
  4. 正解は<b>エ</b>です。
choices:
  ア: 0.25は、ページアウトを<b>伴う</b>場合の割合（1−0.75）です。問題はページアウトを伴わない割合を問うているので誤り。
  イ: 0.33（＝1/3）なら、平均は 20×1/3 ＋ 60×2/3 ≒ 46.7ミリ秒となり、30ミリ秒になりません。誤り。
  ウ: 0.67（＝2/3）なら、平均は 20×2/3 ＋ 60×1/3 ≒ 33.3ミリ秒となり、30ミリ秒になりません。誤り。
  エ: 0.75なら、平均は 20×0.75 ＋ 60×0.25 ＝ 30ミリ秒となり、条件と一致します。<b>正解</b>。
example: |
  通勤で、空いている日は20分、渋滞の日は60分かかり、平均すると30分だったとします。空いている日の割合を p とすると 20p＋60(1−p)＝30 から p＝0.75、つまり4日に3日は空いていると分かります。
review:
  - 平均（期待値）＝各場合の時間×割合の合計。求めたい割合を p とおいて方程式を立てる。
  - 求める割合がどちらの場合か（ページアウトを伴わない／伴う）を取り違えない（0.25のひっかけ）。
