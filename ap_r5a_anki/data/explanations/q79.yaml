q: 79
answer: ア
category: 法務
theme: |
  個人を特定できないように加工した「匿名加工情報」を第三者に提供するとき、個人情報保護法で事業者に課されている義務を選ぶ問題です。
basics: |
  <b>匿名加工情報</b>：個人情報を、特定の個人を識別できず、元の個人情報に<b>復元できないように加工</b>した情報です。例：購買履歴から氏名や住所を削除し、年齢を「30代」のように丸めたデータ。個人の権利を守りつつ、ビッグデータとして活用しやすくするための制度です。
  匿名加工情報を<b>第三者に提供する</b>ときの主な義務
  - 提供する匿名加工情報に含まれる<b>個人に関する情報の項目</b>と、<b>提供の方法</b>を、あらかじめ<b>公表</b>する。
  - 提供先に対して、その情報が匿名加工情報であることを<b>明示</b>する。
  一方で、個人情報の第三者提供とは異なり、<b>本人の同意は不要</b>です。また、提供のたびに個人情報保護委員会へ報告する義務や、提供手段を物理的な媒体に限る決まりはありません。
reasoning: |
  1. 匿名加工情報を第三者に提供する事業者は、提供する情報の項目と提供方法を<b>公表</b>しなければなりません。
  2. 「第三者に提供される匿名加工情報に含まれる個人に関する情報の項目及び提供方法を公表しなければならない」という<b>ア</b>が正解です。
choices:
  ア: 第三者に提供する匿名加工情報に含まれる個人に関する情報の項目と提供方法を公表することは、個人情報保護法で定められた義務です。<b>正解</b>。
  イ: 第三者に提供するたびに個人情報保護委員会へ報告する義務はありません。誤り。
  ウ: 提供の手段を、ハードコピーなどの物理的な媒体に限るという決まりはありません。電子的な提供も可能です。誤り。
  エ: 匿名加工情報は、個人を特定できないように加工されているため、第三者提供に本人の事前の承諾（同意）は不要です。誤り。
example: |
  コンビニが「30代男性、平日夜、弁当とお茶を購入」のように個人が分からない形に加工した購買データを、食品メーカーに提供する場合、「どんな項目のデータを、どういう方法で提供するか」をホームページなどで公表しておく必要があります。一人ひとりに同意を取る必要はありません。
review:
  - 匿名加工情報の第三者提供＝含まれる情報の項目と提供方法の公表、提供先への匿名加工情報である旨の明示が必要。
  - 本人の同意は不要、委員会への都度の報告や物理媒体への限定もない。
