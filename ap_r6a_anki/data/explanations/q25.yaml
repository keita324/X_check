q: 25
answer: イ
category: ユーザーインタフェース
theme: |
  Webページの部品（UI要素）のうち、固定された枠の中で、複数の画像などを横方向に順番に切り替えて表示する「カルーセル」を、アコーディオン・タブ・モーダルウィンドウと区別する問題です。
basics: |
  Webページでよく使われるUI（ユーザインタフェース）の部品
  - <b>カルーセル</b>：決まった表示領域の中で、複数の画像やコンテンツを<b>横方向にスライド</b>させて順番に表示する部品。左右の矢印やスワイプ、下の丸印（インジケーター）で切り替える。トップページの新着情報やキャンペーン画像によく使われる。carousel は「回転木馬（メリーゴーランド）」の意味。
  - <b>アコーディオン</b>：見出しをクリックすると、その下の内容が<b>縦方向に開いたり閉じたり</b>する部品（よくある質問のページなど）。
  - <b>タブ</b>：見出しのタブを切り替えると、同じ領域の内容が切り替わる部品。
  - <b>モーダルウィンドウ</b>：元の画面の上に重ねて表示され、<b>閉じるまで元の画面を操作できない</b>小さなウィンドウ（確認ダイアログなど）。
reasoning: |
  1. 図の特徴は「固定の表示領域」「左右の矢印」「画像が横に並び順次表示」「下に現在位置を示す丸印」です。
  2. これは<b>カルーセル</b>です。正解は<b>イ</b>です。
choices:
  ア: アコーディオンは、見出しをクリックすると内容が縦方向に開閉する部品で、横方向に画像を順次表示するものではありません。誤り。
  イ: カルーセルは、固定の表示領域内で、マウス操作やタッチ操作によって複数の画像などを横方向に順次表示する部品です。<b>正解</b>。
  ウ: タブは、見出しのタブを選んで表示内容を切り替える部品で、スクロールして横に順次表示するものではありません。誤り。
  エ: モーダルウィンドウは、元の画面の上に重ねて表示し、閉じるまで元の画面を操作できなくするウィンドウです。誤り。
example: |
  ネットショップのトップページで、「セール中」「新商品」「送料無料」の画像が数秒ごとに横に流れて切り替わり、下の丸印で今何枚目かが分かる部品がカルーセルです。
review:
  - カルーセル＝固定領域で複数の画像などを横方向にスライドして順次表示する部品（矢印・インジケーター付き）。
  - アコーディオン（縦に開閉）、タブ（見出しで切替え）、モーダルウィンドウ（閉じるまで元画面を操作不可）と区別する。
