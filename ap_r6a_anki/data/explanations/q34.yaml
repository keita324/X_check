q: 34
answer: ウ
category: ネットワーク
theme: |
  IPv4ネットワークの「ICMP」の機能を、RARP・NAT・DHCPと区別する問題です。
basics: |
  <b>ICMP（Internet Control Message Protocol）</b>：IPの通信で、<b>エラーの報告や制御用のメッセージ</b>を送るプロトコル（ネットワーク層）です。例えば、パケットが宛先に届かなかったときに「宛先到達不能」を送信元ホストに知らせたり、pingコマンドで疎通確認（エコー要求・エコー応答）をしたりします。
  他のプロトコル・技術
  - <b>RARP</b>：MACアドレスから、自分のIPアドレスを知るためのプロトコル（ARPの逆）。
  - <b>NAT</b>：グローバルIPアドレスとプライベートIPアドレスを相互に変換する技術。
  - <b>DHCP</b>：ネットワーク内のIPアドレスを一元管理し、クライアントに動的に割り当てるプロトコル。
reasoning: |
  1. ICMPの機能は「送信元ホストへ、IPパケットの送信エラー報告などの制御メッセージを通知する」ことです。
  2. これは<b>ウ</b>です。
choices:
  ア: MACアドレスだけが分かっているときにIPアドレスを解決するのは、<b>RARP</b>の機能です。誤り。
  イ: グローバルIPアドレスとプライベートIPアドレスを相互に変換するのは、<b>NAT</b>の機能です。誤り。
  ウ: 送信元ホストへIPパケットの送信エラー報告などの制御メッセージを通知するのは、<b>ICMP</b>の機能です。<b>正解</b>。
  エ: ネットワーク内のIPアドレスを一元管理し、クライアントに動的に割り当てるのは、<b>DHCP</b>の機能です。誤り。
example: |
  郵便で、宛先不明の手紙が「あて所に尋ねあたりません」というハンコ付きで差出人に戻ってくるのがICMPのエラー通知にあたります。届いたかどうかを確かめる「返信はがき」のような使い方がpingです。
review:
  - ICMP＝IPのエラー報告や制御メッセージを送信元に通知する（ping・宛先到達不能など）。
  - RARP（MAC→IP）、NAT（グローバル/プライベート変換）、DHCP（IPアドレスの動的割当て）と区別する。
