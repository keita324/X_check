q: 33
answer: イ
category: ネットワーク
theme: |
  トランスポート層のプロトコルとして、TCPではなくUDPを使っているアプリケーションプロトコルを選ぶ問題です。
basics: |
  <b>TCP</b>：通信前に接続を確立し、確認応答・再送・順序制御を行う、信頼性重視のプロトコル。ファイル転送やメールなど、データの欠けが許されない通信に使われます。
  <b>UDP</b>：接続の確立や確認応答をしない、軽くて速いプロトコル。少量のデータを素早くやり取りする通信や、多少欠けても速さが大事な通信に使われます。

  主なアプリケーションプロトコルと使うトランスポート層
  | TCP：FTP（ファイル転送）、POP3（メール受信）、SMTP（メール送信）、TELNET（遠隔ログイン）、HTTP など
  | UDP：<b>NTP（時刻同期）</b>、DNS（名前解決の問合せ）、DHCP、SNMP など
reasoning: |
  1. 選択肢のうち、FTP・POP3・TELNETは、データを確実にやり取りする必要があるのでTCPを使います。
  2. <b>NTP（Network Time Protocol）</b>は、時刻サーバに問い合わせてコンピュータの時計を合わせるプロトコルで、<b>UDPの123番ポート</b>を使います。小さなデータを素早くやり取りし、通信にかかった時間も計算に使うため、接続確立の手間がないUDPが適しています。
  3. 正解は<b>イ</b>です。
choices:
  ア: FTPは、ファイルを確実に転送するためにTCP（制御用21番、データ用20番）を使います。誤り。
  イ: NTPは、時刻同期のためにUDP（123番ポート）を使います。<b>正解</b>。
  ウ: POP3は、メールサーバからメールを受信するプロトコルで、TCP（110番）を使います。誤り。
  エ: TELNETは、遠隔のコンピュータにログインして操作するプロトコルで、TCP（23番）を使います。誤り。
example: |
  パソコンやスマホの時計が自動で正確に合うのは、NTPで時刻サーバに「今何時？」と問い合わせているからです。この問合せは一言で済むので、毎回丁寧に「もしもし、聞こえますか？」と接続を確認するTCPより、すぐ聞いてすぐ答えてもらえるUDPの方が向いています。
review:
  - UDPを使う代表例：NTP（123番）、DNS（53番）、DHCP、SNMP。
  - TCPを使う代表例：FTP、POP3、SMTP、TELNET、HTTP。
