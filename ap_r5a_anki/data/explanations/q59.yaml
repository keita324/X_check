q: 59
answer: ウ
category: システム監査
theme: |
  販売管理システムで、受注伝票の入力が「漏れなく、重複なく」行われていること（網羅性と正確性）を確かめるための監査手続を選ぶ問題です。
basics: |
  <b>監査手続</b>：監査人が監査証拠を集めるための具体的な手順です。確かめたい内容（監査の要点）に合った手続を選ぶ必要があります。
  <b>プルーフリスト</b>：システムに入力されたデータを一覧表として出力したものです。元の伝票と1件ずつ<b>照合</b>（突き合わせ）すれば、「伝票はあるのに入力されていない（漏れ）」「同じ伝票が2回入力されている（重複）」を見つけられます。照合した証拠として、照合印を押します。

  他の監査手続（技法）
  - <b>例外取引の承認確認</b>：値引きなどの特別な取引が、正しく承認されているかを確かめる（承認の適切性）。
  - <b>テストデータ法</b>：監査人が用意したテストデータをプログラムに処理させ、入力チェックなどの機能が正しく働くかを確かめる。
  - <b>並行シミュレーション法</b>：監査人が用意したプログラムと本番のプログラムで同じデータを処理させ、結果を比較してプログラムの論理の正確性を確かめる。
reasoning: |
  1. 確かめたいのは「起票された受注伝票が、<b>漏れなく、重複なく</b>入力されていること」です。
  2. そのためには、入力結果（プルーフリスト）と元の受注伝票を突き合わせる照合が行われているかを確認するのが適切です。照合印がその証拠になります。
  3. 正解は<b>ウ</b>です。
choices:
  ア: 例外取引データを抽出して承認の記録を確かめる手続は、取引が正しく承認されているか（承認の適切性）を確かめるもので、入力の漏れや重複は確認できません。誤り。
  イ: 入力時の論理チェックやフォーマットチェックをテストデータ法で確かめる手続は、入力値が正しい形式かをチェックする機能を確認するもので、伝票の入力漏れ・重複は確認できません。誤り。
  ウ: プルーフリストと受注伝票の照合が行われているかを照合印で確かめるのは、入力が漏れなく重複なく行われていることを確かめる監査手続として適切です。<b>正解</b>。
  エ: 並行シミュレーション法でプログラムの論理の正確性を確かめる手続は、処理の正しさを確認するもので、伝票の入力漏れ・重複の確認には向きません。誤り。
example: |
  レジで打ったレシートの控え（プルーフリスト）と、実際に売った商品の伝票の束を1枚ずつ突き合わせれば、「打ち忘れ」や「二重打ち」が見つかります。確認したしるしにハンコを押しておけば、後から監査人が「突き合わせが行われていたか」を確かめられます。
review:
  - 入力の網羅性（漏れなし）と重複なしは、入力結果（プルーフリスト）と原始伝票の照合で確かめる。
  - テストデータ法・並行シミュレーション法（処理・チェック機能の正確性）、承認記録の確認（承認の適切性）と、確かめる内容で使い分ける。
