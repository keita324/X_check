q: 12
answer: エ
category: システム構成要素
theme: |
  Webアプリケーションサーバの冗長構成（コールドスタンバイ、クラスタ構成）で、1台に障害が起きたときに、サービスと処理中のトランザクションが継続できるかを判断する問題です。
basics: |
  <b>サービスの継続</b>：利用者がシステムを使い続けられること。
  <b>トランザクションの継続</b>：処理の途中だった取引（例：ネットショップで商品をカートに入れ、購入手続を進めている途中）を、障害後もそのまま続けられること。
  <b>セッション</b>：Webアプリで、同じ利用者の一連のやり取り（ログイン状態、カートの中身など）を覚えておくための情報です。

  冗長構成の種類
  - <b>コールドスタンバイ</b>：予備機は電源を切った（またはシステムを起動していない）状態で待機する。障害時は予備機を起動・準備するので、切替えに時間がかかり、<b>サービスは中断</b>し、処理中の<b>トランザクションも引き継げない</b>。
  - <b>クラスタ構成</b>：複数のサーバが同時に稼働して処理を分担する。1台が故障しても、残りのサーバがサービスを続けられる。
  　- <b>セッションを共有する</b>場合：他のサーバも利用者のセッション情報を持っているので、処理中のトランザクションも引き継げる。
  　- <b>セッションを共有しない</b>場合：サービスは継続できるが、故障したサーバにあったセッション情報は失われ、トランザクションは継続できない（ログインし直しなど）。
reasoning: |
  1. ア：コールドスタンバイでは、予備機を立ち上げるまでサービスは<b>中断</b>するので、「中断しない」は誤り。
  2. イ：コールドスタンバイでは、処理中のトランザクションの情報は引き継がれないので、「継続できる」は誤り。
  3. ウ：クラスタ構成なら、セッションを共有しなくても残りのサーバでサービスは継続できます。一方、セッションを共有しないのでトランザクションは継続できません。記述は逆です。
  4. エ：セッションを共有するクラスタ構成なら、残りのサーバがセッション情報を使って処理を引き継げるので、<b>サービスもトランザクションも継続できる</b> → ○。
  5. 正解は<b>エ</b>です。
choices:
  ア: コールドスタンバイ構成では、予備機を起動して切り替えるまでの間、サービスは中断します。誤り。
  イ: コールドスタンバイ構成では、障害が起きたサーバで処理中だったトランザクションは引き継がれず、継続できません。誤り。
  ウ: セッションを共有しないクラスタ構成では、残りのサーバでサービスは継続できますが、セッション情報が失われるためトランザクションは継続できません。記述が逆なので誤り。
  エ: セッションを共有するクラスタ構成では、1台に障害が起きても、他のサーバがセッション情報を引き継ぐので、サービスもトランザクションも継続できます。<b>正解</b>。
example: |
  銀行の窓口に例えると、窓口が複数あり、お客さんの手続き内容を全窓口で共有していれば（セッション共有）、担当者が急に席を外しても、隣の窓口でそのまま手続きを続けられます。共有していなければ、隣の窓口は開いていても、最初から書類を書き直しになります。
review:
  - コールドスタンバイ＝切替えに時間がかかりサービス中断、トランザクションも継続不可。
  - クラスタ構成はサービス継続が可能。トランザクションまで継続できるのはセッションを共有している場合。
