q: 67
answer: ウ
category: 経営戦略マネジメント
theme: |
  Web広告の費用対効果を表す指標「ROAS（広告費用対効果）」を計算する問題です。
basics: |
  <b>ROAS（Return On Advertising Spend：広告費用対効果）</b>：広告に使った費用1円あたり、どれだけの<b>売上</b>が得られたかを表す指標です。
  | ROAS ＝ 広告経由の売上高 ÷ 広告費 × 100（%）
  100%を超えていれば、広告費以上の売上が得られたことを意味します（ただし、売上なので、商品の原価などを引いた利益ではありません）。

  似た指標
  - <b>ROI（投資利益率）</b>：利益 ÷ 投資額。ROASは「売上」で、ROIは「利益」で計算する点が違います。
reasoning: |
  1. 広告経由の売上高を求めます。
  | 単価 1,500円 × 1,000個 ＝ 1,500,000円
  2. ROASを計算します。
  | ROAS ＝ 1,500,000 ÷ 600,000 × 100 ＝ <b>250%</b>
  3. 正解は<b>ウ</b>です。
choices:
  ア: 40%は、600,000 ÷ 1,500,000（広告費÷売上高）で、分子と分母が逆です。誤り。
  イ: 60%は、(1,500,000 − 600,000) ÷ 1,500,000 で、売上から広告費を引いた額の売上に対する割合です。ROASの計算式ではありません。誤り。
  ウ: 250%。売上高1,500,000円÷広告費600,000円×100 で、計算結果と一致します。<b>正解</b>。
  エ: 600%は、計算結果の250%と一致しません。誤り。
example: |
  ネット広告に1万円かけて、その広告を見た人から3万円分の注文があれば、ROASは300%です。「広告費の3倍の売上があった」と、広告の効き目を比べるのに使います。
review:
  - ROAS＝広告経由の売上高÷広告費×100（%）。分子は「売上」、分母は「広告費」。
  - ROI（利益÷投資額）との違い、分子と分母の取り違え（40%のひっかけ）に注意する。
