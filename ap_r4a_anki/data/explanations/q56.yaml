q: 56
answer: ウ
theme: |
  24時間・年中無休のサービスデスクで、シフト表と労働時間の上限から、1週間に必要な最少の要員数を計算する問題です。
basics: |
  <b>サービスデスク</b>：利用者からの問合せや障害の連絡を受け付ける窓口です。
  <b>シフト制</b>：時間帯を区切って、交替で勤務する方式です。この問題では早番・日中・遅番の3交替です。

  <b>勤務時間と労働時間の違い</b>
  - 勤務時間（表の8.5時間）：職場にいる時間。
  - 労働時間（7.5時間）：勤務時間から休憩1時間を引いた、実際に働いた時間。労働時間の上限（週40時間）は、こちらで判断します。
  なお、交替時の30分の引継ぎは、各シフトの勤務時間帯が30分重なっていることで既に表に含まれています。
reasoning: |
  <b>(1) 1週間に必要なシフト（1人が1回勤務する枠）の数</b>
  | 1日に必要な人数：早番2 ＋ 日中4 ＋ 遅番2 ＝ 8人分（8枠）
  | 年中無休なので1週間＝7日：8 × 7 ＝ <b>56枠</b>

  <b>(2) 1人が1週間に入れるシフトの数</b>
  | 1回のシフトの労働時間：8.5 − 休憩1 ＝ 7.5時間
  | 週40時間以内：40 ÷ 7.5 ＝ 5.33…
  | 5回なら 7.5 × 5 ＝ 37.5時間（OK）、6回なら 45時間（超過）
  | → 1人あたり最大 <b>5枠</b>

  <b>(3) 必要な人数</b>
  | 56 ÷ 5 ＝ 11.2 → 人数は整数なので<b>切り上げて12人</b>
  （11人だと 11×5＝55枠で、1枠足りません。）
  正解は<b>ウ</b>です。
choices:
  ア: 8人は、1日に同時に必要な延べ人数（2＋4＋2）です。1人が毎日働くことはできない（週5回まで）ので足りません。誤り。
  イ: 11人では、11×5＝55枠しか埋められず、必要な56枠に1枠足りません。11.2を切り捨ててしまった値です。誤り。
  ウ: 12人。56枠÷5枠＝11.2を切り上げた値です。<b>正解</b>。
  エ: 14人でも勤務表は埋められますが、12人で足りるので「少なくとも何人か」の答えにはなりません。誤り。
example: |
  コンビニのアルバイトのシフトを組むときと同じです。「1週間で埋めるべき枠の数」を数え、「1人が週に何回まで入れるか」で割れば、最低何人雇えばよいかが分かります。割り切れないときは、必ず切り上げます。
review:
  - 必要人数＝（1週間に埋めるべきシフト枠の総数）÷（1人が週に入れるシフト数）、端数は切り上げ。
  - 労働時間（休憩を除く7.5時間）で週40時間の上限を判定する（勤務時間8.5時間で計算しない）。
