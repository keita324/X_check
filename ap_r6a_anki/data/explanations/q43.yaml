q: 43
answer: エ
category: セキュリティ
theme: |
  ソフトウェアのセキュリティ管理で注目されている「SBOM（ソフトウェア部品表）」が何かを、SIEM・IT資産管理・脆弱性管理と区別する問題です。
basics: |
  現代のソフトウェアは、自社で書いたコードだけでなく、オープンソースのライブラリなど、多くの<b>部品（コンポーネント）</b>を組み合わせて作られています。ある部品に脆弱性が見つかると、それを使っているソフトウェアすべてに影響します。
  <b>SBOM（Software Bill of Materials：ソフトウェア部品表）</b>：ソフトウェアを構成する<b>コンポーネント</b>（名前、バージョン、提供元、ライセンスなど）と、<b>相互の依存関係</b>をリスト化した一覧です。製造業の部品表（BOM）のソフトウェア版で、脆弱性が公表されたときに「自社のどのソフトウェアが影響を受けるか」を素早く特定できます。

  関連する仕組み
  - <b>SIEM</b>：セキュリティアラートやログを集約・分析し、潜在的な脅威を見つけるシステム。
  - <b>IT資産管理（CMDBなど）</b>：組織内のソフトウェアを含むIT資産をリスト化したデータベース。
  - <b>脆弱性管理</b>：脆弱性や設定ミスを特定・評価・処理・報告するためのプロセス・ツール・戦略。
reasoning: |
  1. SBOMは「ソフトウェアを構成するコンポーネントと、相互の依存関係などをリスト化した一覧」です。
  2. 正解は<b>エ</b>です。
choices:
  ア: セキュリティアラートやログを集約・分析し、潜在的な脅威を見つけるシステムは、<b>SIEM</b>です。誤り。
  イ: 組織内のソフトウェアを含むIT資産をリスト化したデータベースは、<b>IT資産管理</b>のデータベースで、1つのソフトウェアの中身（部品）を表すSBOMではありません。誤り。
  ウ: ソフトウェアの脆弱性と設定ミスを特定・評価・処理・報告するためのプロセス・ツール・戦略は、<b>脆弱性管理</b>の説明です。誤り。
  エ: ソフトウェアを構成するコンポーネントと相互の依存関係などをリスト化した一覧は、<b>SBOM</b>です。<b>正解</b>。
example: |
  加工食品の「原材料表示」のようなものです。ある原材料に問題が見つかったとき、原材料表示があれば、どの商品に使われているかがすぐ分かります。SBOMがあれば、「Log4jの脆弱性」のような問題が公表されたとき、自社のどの製品に影響があるかをすぐ調べられます。
review:
  - SBOM＝ソフトウェアを構成するコンポーネント（名前・バージョン等）と依存関係をリスト化した部品表。脆弱性の影響範囲の特定に役立つ。
  - SIEM（ログの集約・分析）、IT資産管理（組織のIT資産の一覧）、脆弱性管理（特定・評価・処理のプロセス）と区別する。
