q: 7
answer: ア
category: アルゴリズムとプログラミング
theme: |
  クイックソートで、基準値を使ってデータを「小さいグループ」と「大きいグループ」に分割する処理を、指示どおりに2回行った結果を追う問題です。
basics: |
  <b>クイックソート</b>：次の手順を繰り返して整列する方法です。
  1. グループの中から<b>基準値（ピボット）</b>を1つ選ぶ（この問題では<b>グループの左端の値</b>）。
  2. 基準値より小さい値のグループと、大きい値のグループに分け、「小さいグループ、基準値、大きいグループ」の順に並べる。
  3. 分けた各グループに対して、同じ処理を繰り返す（要素が1つのグループは分割不要）。
  この問題では、各グループ内の値の順番は<b>元の配列での順番のまま</b>にします。
reasoning: |
  元の配列：2, 3, 5, 4, 1

  <b>1回目の分割</b>（全体が対象、基準値は左端の2）
  | 2より小さい値：1
  | 2より大きい値：3, 5, 4（元の順番のまま）
  | 結果：<b>1</b>, 2, <b>3, 5, 4</b>
  <b>2回目の分割</b>
  左のグループ {1} は要素が1つなので分割の必要がありません。次に分割するのは右のグループ {3, 5, 4} で、基準値は左端の3です。
  | 3より小さい値：なし
  | 3より大きい値：5, 4（元の順番のまま）
  | 結果：1, 2, 3, <b>5, 4</b>
  2回目の分割が終わった状態は「1, 2, 3, 5, 4」で、<b>ア</b>です。
choices:
  ア: 1, 2, 3, 5, 4。1回目で基準値2により {1} と {3,5,4} に分け、2回目で基準値3により {3,5,4} を 3 と {5,4} に分けた状態です。<b>正解</b>。
  イ: 1, 2, 5, 4, 3 では、基準値3が5と4より右にあります。基準値3による分割では「3より大きい5, 4」が3の右に来るはずなので、分割の結果と一致しません。誤り。
  ウ: 2, 3, 1, 4, 5 は、基準値2による分割が行われていない（1が2より右にある）ので誤り。
  エ: 2, 3, 4, 5, 1 も、基準値2より小さい1が右端に残っており、分割の結果になっていません。誤り。
example: |
  背の順に並べるとき、まず列の先頭の人を基準にして「その人より低い人は前、高い人は後ろ」と2つに分け、次に後ろのグループの先頭の人を基準に同じことをする…と、グループを小さくしながら繰り返すのがクイックソートです。
review:
  - クイックソートは「基準値で小さいグループ・大きいグループに分割」を各グループで繰り返す。
  - 問題の条件（基準値＝左端、グループ内は元の順番）どおりに1回ずつ手で追う。要素1つのグループは分割しない。
