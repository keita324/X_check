q: 8
answer: イ
theme: |
  ディープラーニング（深層学習）の計算に、なぜGPUが向いているのかを問う問題です。
basics: |
  <b>GPU（Graphics Processing Unit）</b>：もともとは画面の描画専用のプロセッサです。画面は数百万個の画素の色を一斉に計算する必要があるため、GPUは「単純な計算をする演算器を何千個も並べ、同じ種類の計算を大量に同時に行う」構造になっています。
  <b>CPU</b>：少数の高性能なコアで、複雑な処理や条件分岐の多い処理を順番に素早くこなすのが得意です。

  <b>ディープラーニング</b>：人間の脳の神経回路をまねた多層のニューラルネットワークで学習する方法です。中身の計算のほとんどは「たくさんの数値を掛けて足す」計算、つまり<b>行列演算</b>（表の形に並べた数どうしの掛け算・足し算）です。
reasoning: |
  1. ディープラーニングの学習では、巨大な行列の掛け算（積和演算）を何億回も繰り返します。
  2. 行列演算は、各要素の計算がお互いに独立しているので、多数の演算器で同時に（並列に）処理できます。
  3. GPUはまさにこの「同じ計算を大量に並列実行する」ことが得意で、行列演算ユニット（NVIDIAのTensorコアなど）も備えています。
  4. よって「行列演算を高速に実行できる」とする<b>イ</b>が正解です。
choices:
  ア: 各コアが独立して<b>異なるプログラム</b>を実行し異なるデータを処理するのは、マルチコアCPU（MIMD型）の特徴です。GPUは多数の演算器で<b>同じ命令</b>を異なるデータに適用する方式（SIMD/SIMT型）が得意です。誤り。
  イ: 行列演算ユニットで行列演算を高速に実行できることは、ディープラーニングにGPUを使う最大の利点です。<b>正解</b>。
  ウ: 浮動小数点演算ユニットをコプロセッサ（補助プロセッサ）として使うのは、昔のCPUに数値計算用チップを追加した構成の説明です。浮動小数点演算は今のCPUでも普通にできるので、GPUを使う理由になりません。誤り。
  エ: 分岐予測でパイプラインの効率を高めるのはCPUの高速化技術です。GPUは分岐の多い処理がむしろ苦手です。誤り。
example: |
  1万枚のテストの採点をするとき、天才の先生1人（CPU）より、単純な丸付けができるアルバイト1000人（GPU）に分担させた方が圧倒的に早く終わります。ディープラーニングの行列計算は、この「単純だが大量の丸付け」に似ています。
review:
  - ディープラーニングの計算の中心は行列演算（積和演算）で、並列に処理しやすいことを理解する。
  - GPUは「同じ計算を大量に並列実行」、CPUは「複雑な処理・分岐処理」が得意、と区別する。
  - 分岐予測・パイプラインはCPUの高速化技術であり、GPUの利点ではないことに注意する。
