q: 15
answer: エ
category: システム構成要素
theme: |
  システムの信頼性を高める考え方（フェールセーフ、フェールソフト、フォールトアボイダンス、フォールトトレランス）の説明として正しいものを選ぶ問題です。選択肢では用語と説明が入れ替えられています。
basics: |
  - <b>フォールトアボイダンス（故障回避）</b>：高品質な部品を使うなどして、<b>故障そのものが起きないようにする</b>考え方。
  - <b>フォールトトレランス（耐故障）</b>：重要な部品を<b>多重化（二重化など）</b>しておき、故障が起きても<b>システム全体は正常に動き続ける</b>ようにする考え方。
  - <b>フェールセーフ</b>：故障したときに、<b>安全な状態</b>になるようにする設計（例：故障したら信号を赤にする）。
  - <b>フェールソフト</b>：故障したときに、機能や性能を落としてでも（<b>縮退運転</b>）、システムを動かし続ける設計。
reasoning: |
  1. ア：構成部品の信頼性を高めて故障が起きないようにする → これは<b>フォールトアボイダンス</b>なので×。
  2. イ：ソフトウェアに起因するシステムフォールトに対処する技術 → フェールソフトは「故障時に縮退して運転を続ける」考え方で、ソフトウェアの障害に限ったものではないので×。
  3. ウ：構成部品が故障しても運用を継続できるようにする → これは<b>フォールトトレランス</b>（またはフェールソフト）の考え方で、フォールトアボイダンスではないので×。
  4. エ：重要部品を多重化して故障に備える → <b>フォールトトレランス</b>の説明として正しいので○。
  5. 正解は<b>エ</b>です。
choices:
  ア: 構成部品の信頼性を高めて故障が起きないようにするのは、<b>フォールトアボイダンス</b>です。フェールセーフは、故障時に安全側に動作させる考え方です。誤り。
  イ: フェールソフトは、故障時に機能を縮退させてでも運転を続ける考え方で、ソフトウェアに起因する障害への対処技術という意味ではありません。誤り。
  ウ: 故障が発生しても運用を継続できるようにするのは、<b>フォールトトレランス</b>の考え方です。フォールトアボイダンスは、故障を起こさないようにする考え方です。誤り。
  エ: 重要部品を多重化して故障に備えるのは、<b>フォールトトレランス</b>の技術です。<b>正解</b>。
example: |
  飛行機で考えると、エンジンや操縦系統を複数持ち、1つが壊れても飛び続けられるようにしているのがフォールトトレランスです。高品質な部品を使い、整備で故障を防ぐのがフォールトアボイダンス、異常時にエンジンを安全に停止させるのがフェールセーフです。
review:
  - フォールトトレランス＝多重化で、故障しても正常に動き続ける。フォールトアボイダンス＝故障を起こさない。
  - フェールセーフ＝故障時に安全側へ、フェールソフト＝故障時に縮退して運転継続。
