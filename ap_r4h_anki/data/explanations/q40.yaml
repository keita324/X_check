q: 40
answer: イ
category: セキュリティ
theme: |
  Webブラウザのcookie設定のうち、「サードパーティcookieのブロック」によって何が防げるかを問う問題です。
basics: |
  <b>cookie（クッキー）</b>：Webサイトが、ブラウザに保存させる小さなデータです。ログイン状態の維持や、カートの中身の記憶などに使われます。
  - <b>ファーストパーティcookie</b>：今見ているWebサイト自身が発行するcookie。
  - <b>サードパーティcookie</b>：今見ているサイトに埋め込まれた広告などの<b>別のドメイン（第三者）</b>が発行するcookie。

  <b>トラッキング</b>：同じ広告会社の広告が、たくさんのWebサイトに埋め込まれているとします。広告会社のサードパーティcookieが同じブラウザに付いていると、広告会社は「このブラウザはサイトA、サイトB、サイトCを見た」と、<b>サイトをまたいで閲覧履歴を追跡</b>できます。これがトラッキングです。
reasoning: |
  1. サイトをまたいだ追跡（トラッキング）に使われるのはサードパーティcookieです。
  2. これをブロックすれば、第三者がcookieを使って複数のサイトの閲覧を結び付けることが難しくなります。
  3. 「サードパーティcookieをブロックする設定によって、複数のWebサイトを閲覧したときにトラッキングされないようになる」という<b>イ</b>が正解です。
choices:
  ア: cookieをブロックしても、閲覧したコンテンツのキャッシュ（一時保存データ）が保持されなくなるわけではありません。キャッシュとcookieは別の仕組みです。誤り。
  イ: サードパーティcookieをブロックすると、第三者による複数サイトをまたいだトラッキングを防げます。<b>正解</b>。
  ウ: cookieは利用者の情報を保存するためのもので、Webサイトの改ざんを検知する機能はありません。誤り。
  エ: デジタル証明書の失効情報の確認は、CRLやOCSPで行うもので、cookieとは関係ありません。誤り。
example: |
  ショッピングサイトで靴を見た後、ニュースサイトやSNSでも同じ靴の広告が表示されることがあります。これは、両方のサイトに埋め込まれた広告会社のサードパーティcookieで、閲覧履歴が追跡されているためです。サードパーティcookieをブロックすると、このような追跡が難しくなります。
review:
  - サードパーティcookie＝閲覧中サイト以外（広告など）が発行するcookie。ブロックするとサイト横断のトラッキングを防げる。
  - cookieはキャッシュ、改ざん検知、証明書の失効確認とは無関係。
