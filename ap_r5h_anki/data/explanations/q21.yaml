q: 21
answer: イ
category: ハードウェア
theme: |
  NAND素子だけで組んだ回路の出力を、論理式に直して求める問題です。NANDの入力を2本ともつなぐと何になるかがポイントです。
basics: |
  <b>NAND（ナンド）</b>：AND（論理積）の結果を反転したもの。「両方1のときだけ0、それ以外は1」です。
  | NAND(A, B) ＝ (A・B) の否定
  <b>入力を2本ともつないだNAND</b>：NAND(X, X) ＝ (X・X)の否定 ＝ X の否定 ＝ <b>X̅</b>。つまり<b>NOT（否定）回路</b>として働きます。
  <b>ド・モルガンの法則</b>：(A・B)の否定 ＝ A̅ ＋ B̅、(A＋B)の否定 ＝ A̅・B̅。
  否定を2回すると元に戻ります（X̅の否定＝X）。
reasoning: |
  1. 左上のNANDは、XをNANDの2つの入力に両方つないでいるので、出力は <b>X̅</b>（Xの否定）です。
  2. 左下のNANDも同様に、出力は <b>Y̅</b> です。
  3. 右のNANDに X̅ と Y̅ を入力すると、
  | Z ＝ (X̅・Y̅) の否定
  | ＝ X̅の否定 ＋ Y̅の否定（ド・モルガンの法則）
  | ＝ <b>X ＋ Y</b>
  4. 真理値表で確認：X＝0,Y＝0 → X̅＝1,Y̅＝1 → Z＝NAND(1,1)＝0。X＝1,Y＝0 → X̅＝0,Y̅＝1 → Z＝1。いずれも X＋Y（OR）と一致します。
  5. 正解は<b>イ</b>です。
choices:
  ア: X・Y（AND）は、X＝1,Y＝0 で0ですが、この回路では Z＝1 になるので誤り。
  イ: X＋Y（OR）。入力をそれぞれ否定してからNANDを取ると、ド・モルガンの法則によりORになります。<b>正解</b>。
  ウ: X・Y の否定（NAND）は、X＝0,Y＝0 で1ですが、この回路では Z＝0 になるので誤り。
  エ: X＋Y の否定（NOR）は、X＝1,Y＝0 で0ですが、この回路では Z＝1 になるので誤り。
example: |
  「雨が降っていない、かつ、風が吹いていない、ということはない」と二重否定で言うと、「雨が降っている、または風が吹いている」と同じ意味になります。入力を否定してからNAND（否定付きのAND）をとると、ORになるのはこの関係です。
review:
  - NANDの2入力を同じ信号につなぐと NOT（否定）になる。
  - 否定した入力のNAND＝OR（ド・モルガンの法則）。迷ったら真理値表で確かめる。
