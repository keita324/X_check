q: 17
answer: ア
category: ソフトウェア
theme: |
  仮想記憶で、ページの入れ替えが頻繁に起こりすぎて、システムの処理能力が急激に落ちる現象の名前を問う用語問題です。
basics: |
  <b>ページング方式の仮想記憶</b>：プログラムをページに分け、必要なページだけを主記憶に置いて実行します。主記憶にないページが必要になると（<b>ページフォールト</b>）、補助記憶から読み込み、代わりに別のページを補助記憶へ追い出します（<b>ページ置換え</b>）。
  - <b>スラッシング</b>：主記憶の容量に対して、同時に実行するプログラムが多すぎるなどの理由で、<b>ページ置換えが頻繁に発生</b>し、補助記憶との読み書きばかりに時間を取られて、本来の処理がほとんど進まなくなり、<b>処理能力が急激に低下</b>する現象。
  - <b>スワップアウト</b>：プログラム（プロセス）全体などを主記憶から補助記憶へ追い出すこと。
  - <b>フラグメンテーション</b>：空き領域が細切れになり、まとまった領域を確保できなくなる現象。
  - <b>ページフォールト</b>：参照したページが主記憶にないこと（スラッシングのきっかけになるが、現象全体の名前ではない）。
reasoning: |
  1. 問題文のキーワードは「ページ置換えの発生頻度が高くなり」「システムの処理能力が急激に低下」です。
  2. これは<b>スラッシング</b>です。正解は<b>ア</b>です。
choices:
  ア: ページ置換えが頻発してシステムの処理能力が急激に低下する現象は、<b>スラッシング</b>です。<b>正解</b>。
  イ: スワップアウトは、プロセスなどを主記憶から補助記憶へ追い出す操作のことで、性能低下の現象そのものではありません。誤り。
  ウ: フラグメンテーションは、メモリの空き領域が細切れになる現象です。誤り。
  エ: ページフォールトは、参照したページが主記憶にない状態のことで、1回1回の出来事を指します。頻発して処理能力が落ちる現象全体はスラッシングと呼びます。誤り。
example: |
  狭い机（主記憶）で、教科書を5冊同時に使って勉強しようとすると、机に載り切らず、本棚（補助記憶）との出し入ればかりしてしまい、肝心の勉強がほとんど進みません。これがスラッシングです。机を広くする（主記憶を増やす）か、同時に使う本を減らす（同時実行数を減らす）のが対策です。
review:
  - スラッシング＝ページ置換えが頻発し、処理能力が急激に低下する現象。対策は主記憶の増設や多重度の削減。
  - スワップアウト（追い出す操作）、フラグメンテーション（空き領域の細切れ）、ページフォールト（ページ不在の発生）と区別する。
