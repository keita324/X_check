q: 43
answer: ア
theme: |
  家庭用の無線LANルーターが持つ機能（IPマスカレード、PPPoE、WPA、WPS）のセキュリティ上の効果を正しく理解しているかを問う問題です。
basics: |
  - <b>IPマスカレード（NAPT）</b>：家庭内の複数のPCが持つプライベートIPアドレス（192.168.x.x など）を、ルーターが持つ1つのグローバルIPアドレス（インターネット上の住所）に変換して通信させる機能。家庭内のPCからの通信に対する<b>返事だけ</b>を中に通すため、インターネット側から勝手に家庭内のPCへ接続を始めることが難しくなります。
  - <b>PPPoE</b>：光回線などで、プロバイダに接続するときの認証（ID・パスワード）などに使う接続方式。通信内容を暗号化する機能ではありません。
  - <b>WPA（WPA2/WPA3）</b>：PCとルーターの間の<b>無線区間</b>を暗号化し、接続できる機器を認証する方式。
  - <b>WPS</b>：ボタンを押すだけで無線LANの接続設定を簡単にできる機能。
reasoning: |
  1. インターネット側からは、家庭内のPCのプライベートIPアドレスは見えず、ルーターのアドレスしか分かりません。
  2. IPマスカレードは、内側から始めた通信の応答だけを内部へ通すので、外部から家庭内のPCへの直接の接続（侵入）を防ぐ効果が期待できます。
  3. よって<b>ア</b>が適切です。他の機能は、書かれている効果を持ちません。
choices:
  ア: IPマスカレードにより、インターネット側から家庭内のPCへ直接接続されにくくなり、侵入を防ぐ効果が期待できます。<b>正解</b>。
  イ: PPPoEはプロバイダへの接続と認証のための方式で、通信を暗号化しないため、経路上の盗聴は防げません。誤り。
  ウ: WPAは無線区間（PC〜ルーター間）の暗号化と認証の仕組みです。利用者が不正なWebサイトにアクセスすることは防げません。誤り。
  エ: WPSは無線LANの接続設定を簡単にする機能で、マルウェア感染を防ぐ機能はありません。誤り。
example: |
  IPマスカレードは、マンションの「受付（コンシェルジュ）」のようなものです。住人が外に出した手紙の返事は部屋に届けてくれますが、外部の人がいきなり「○号室に入れて」と来ても、部屋番号（内部のアドレス）が外から分からないので通しません。
review:
  - IPマスカレード（NAPT）は、外部から内部PCへの直接接続を防ぐ効果がある（内側発の通信の応答のみ通す）。
  - PPPoE＝接続・認証方式（暗号化ではない）、WPA＝無線区間の暗号化、WPS＝無線接続設定の簡略化、と区別する。
