q: 49
answer: エ
category: ソフトウェア開発管理技術
theme: |
  アジャイル開発のスクラムで、一定期間にチームがどれだけの作業をこなせたか（生産量）を表す尺度「ベロシティ」を選ぶ用語問題です。
basics: |
  <b>スクラム</b>：短い期間を区切って、計画・開発・振り返りを繰り返すアジャイル開発の枠組みです。
  主な用語
  - <b>スプリント</b>：1〜4週間程度の、区切られた開発期間（反復の単位）。
  - <b>プロダクトバックログ</b>：作るべき機能や要望を、優先順位を付けて並べた一覧。
  - <b>スプリントレトロスペクティブ</b>：スプリントの最後に、チームの仕事の進め方を振り返る会議。
  - <b>ストーリーポイント</b>：各作業の大きさ（難しさ・量）を、相対的な数値で見積もったもの。
  - <b>ベロシティ</b>：1スプリントの間にチームが完了させたストーリーポイントの合計。チームの<b>生産量（開発速度）</b>を相対的に表す尺度です。
reasoning: |
  1. 「決められた期間（スプリント）」における「チームの生産量」を「相対的に表現する尺度」は、完了したストーリーポイントの合計である<b>ベロシティ</b>です。
  2. 例：あるスプリントで 3点・5点・8点 の作業を完了したら、ベロシティは 16 です。過去のベロシティから、次のスプリントでどれくらいの量をこなせるかを計画できます。
  3. 正解は<b>エ</b>です。
choices:
  ア: スプリントは、開発を区切る「期間」そのものであり、生産量を表す尺度ではありません。誤り。
  イ: スプリントレトロスペクティブは、スプリントの最後に行う「振り返りの会議」です。誤り。
  ウ: バックログは、これから行う作業や要望の「一覧」であり、生産量の尺度ではありません。誤り。
  エ: ベロシティは、1スプリントで完了した作業量（ストーリーポイントの合計）で、チームの生産量を相対的に表す尺度です。<b>正解</b>。
example: |
  夏休みの宿題で、ドリル1ページを「1点」、作文を「5点」と決めておき、1週間で終わらせた点数の合計が「ベロシティ」です。先週16点こなせたなら、今週も16点分くらいを計画すれば無理がない、と予定を立てられます。
review:
  - ベロシティ＝1スプリントで完了したストーリーポイントの合計（チームの開発速度の尺度）。
  - スプリント（期間）、バックログ（作業一覧）、レトロスペクティブ（振り返り会議）と区別する。
