q: 11
answer: イ
theme: |
  電子書籍リーダーなどで使われる「電気泳動型電子ペーパー」の表示の仕組みを、他の表示デバイス（液晶・有機EL・DMD）と区別する問題です。
basics: |
  <b>電子ペーパー</b>：紙のように見える表示装置です。自分では光らず、周囲の光の反射で見えるため目が疲れにくく、表示を保つだけなら電力をほとんど使いません。

  <b>電気泳動</b>：電気を帯びた（帯電した）小さな粒子が、電圧をかけると反対の電気の電極へ引き寄せられて移動する現象です。プラスとマイナスが引き合う性質を利用します。

  <b>電気泳動型電子ペーパーの仕組み</b>：例えば「白い粒子はプラス、黒い粒子はマイナス」に帯電させ、液体の入った小さなカプセルに閉じ込めます。表面側の電極にかける電圧を変えると、白か黒の粒子が表面に集まり、白や黒の点として見えます。電圧を切っても粒子はその場に残るので、表示が消えません。
reasoning: |
  1. 「電気泳動」＝帯電した粒子を電圧で動かすこと、と分かれば答えが決まります。
  2. 「電圧を印加した電極に、着色した帯電粒子を集めて表示する」という<b>イ</b>がこの仕組みそのものです。
  3. 他の選択肢は、液晶・有機EL・DMDという別の表示方式の説明です。
choices:
  ア: 電圧で光の<b>透過状態</b>（光を通すか遮るか）を変えて表示するのは<b>液晶ディスプレイ（LCD）</b>です。液晶は自分では光らず、背面のバックライトの光を通したり遮ったりします。誤り。
  イ: 電圧をかけた電極に、色の付いた帯電粒子を集めて表示する。<b>電気泳動型電子ペーパー</b>の説明です。<b>正解</b>。
  ウ: 電圧をかけると<b>発光する薄膜</b>を使うのは<b>有機EL（OLED）ディスプレイ</b>です。自ら光るのでバックライトが不要です。誤り。
  エ: 半導体上の微小な鏡（マイクロミラー）の向きを変えて光を反射させるのは<b>DMD（Digital Micromirror Device）</b>で、プロジェクターに使われます。誤り。
example: |
  電子書籍リーダー（Kindleなど）や、スーパーの電子棚札が電気泳動型電子ペーパーの代表例です。ページを表示したまま電源を切っても文字が残るのは、粒子がその位置に留まっているからです。
review:
  - 電気泳動型電子ペーパー＝「帯電した着色粒子を電圧で電極に集める」。表示の維持に電力がほぼ不要。
  - 液晶（光の透過を制御）、有機EL（自ら発光）、DMD（微小な鏡の反射）の4方式を一言で区別できるようにする。
