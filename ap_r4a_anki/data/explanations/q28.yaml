q: 28
answer: ウ
theme: |
  副問合せ（SQLの中に入れ子にしたSQL）とDISTINCT（重複の除去）を含むSQL文を、表に当てはめて実行結果を求める問題です。
basics: |
  <b>SELECT 列 FROM 表 WHERE 条件</b>：表の中から、条件に合う行の指定した列を取り出す命令です。
  <b>DISTINCT</b>：結果の中で同じ値が重複したら1つにまとめます。
  <b>AVG(式)</b>：その式の値の平均を求める集計関数です。
  <b>副問合せ</b>：( ) の中の SELECT 文を先に実行し、その結果を外側の条件に使います。

  このSQL文は、<b>「1個あたりの利益（販売単価−仕入単価）が、全商品の平均利益より大きい商品について、その仕入先コードを重複なしで取り出す」</b>という意味です。
reasoning: |
  1. まず各商品の「販売単価−仕入単価」（利益）を計算します。
  | A：1,000−800＝200（S1）　 B：2,500−2,300＝200（S2）
  | C：1,500−1,400＝100（S2） D：2,500−1,600＝900（S1）
  | E：2,000−1,600＝400（S1） F：3,000−2,800＝200（S3）
  | G：2,500−2,200＝300（S3） H：2,500−2,000＝500（S4）
  | I：2,500−2,000＝500（S5） J：1,300−1,000＝300（S6）
  2. 副問合せで平均を求めます。
  | 合計＝200+200+100+900+400+200+300+500+500+300＝3,600
  | 平均＝3,600÷10＝<b>360</b>
  3. 利益が360より大きい（＞360、360ちょうどは含まない）商品を選びます。
  | D(900, S1)、E(400, S1)、H(500, S4)、I(500, S5)
  4. その仕入先コードは S1, S1, S4, S5。DISTINCTで重複を除くと <b>S1, S4, S5 の3つ</b>。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 1つ。条件を満たす商品は4つあり、仕入先も3種類あるので誤り。
  イ: 2つ。条件を満たす仕入先コードは S1、S4、S5 の3種類あるので誤り。
  ウ: 3つ（S1、S4、S5）。計算結果と一致します。<b>正解</b>。
  エ: 4つ。条件を満たす<b>商品の数</b>（D、E、H、I）を数えてしまい、DISTINCTによる重複除去（S1が2回）を忘れた値です。誤り。
example: |
  「平均より利益率の良い商品の仕入れ先を、重複なしで一覧にして」と上司に頼まれた場面です。同じ仕入れ先が2回出てきても、仕入れ先の一覧としては1社と数えます。
review:
  - 副問合せは ( ) の中を先に計算し、その結果（ここでは平均360）を外側の条件に使う。
  - DISTINCTは重複を除く。「商品数（4）」と「仕入先コード数（3）」を取り違えない。
  - 「＞」は平均ちょうどを含まないことにも注意する。
