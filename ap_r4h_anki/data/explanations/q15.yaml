q: 15
answer: エ
category: システム構成要素
theme: |
  2台のプリンタの稼働率から、「どちらか一方だけが動いていて、もう一方は故障している」確率を求める確率計算の問題です。
basics: |
  <b>稼働率</b>：機器が正常に動いている確率です。稼働率0.7なら、70%の確率で動いていて、30%（1−0.7）の確率で故障しています。
  <b>独立</b>：一方の状態が、もう一方の状態に影響しないこと。独立なら「Aが動いている、かつBが故障している」確率は、それぞれの確率の<b>掛け算</b>で求められます。
  <b>「または」の確率</b>：同時には起こらない2つの場合のどちらかが起こる確率は、それぞれの確率の<b>足し算</b>で求めます。
reasoning: |
  プリンタAの稼働率を0.7、Bを0.6とします。
  1. 「いずれか一方が稼働していて、他方が故障している」には2つの場合があります。
  | ① Aが稼働 かつ Bが故障：0.7 × (1 − 0.6) ＝ 0.7 × 0.4 ＝ 0.28
  | ② Aが故障 かつ Bが稼働：(1 − 0.7) × 0.6 ＝ 0.3 × 0.6 ＝ 0.18
  2. ①と②は同時には起こらないので、足し合わせます。
  | 0.28 ＋ 0.18 ＝ <b>0.46</b>
  3. 検算：4つの状態（両方稼働0.42、Aのみ0.28、Bのみ0.18、両方故障0.12）の合計は 1.00 になります。
  4. 正解は<b>エ</b>です。
choices:
  ア: 0.18は、「Aが故障していてBだけが稼働している」場合（②）だけの確率です。①を足し忘れています。誤り。
  イ: 0.28は、「Aだけが稼働している」場合（①）だけの確率です。②を足し忘れています。誤り。
  ウ: 0.42は、0.7×0.6で「2台とも稼働している」確率です。誤り。
  エ: 0.46。①0.28と②0.18の合計で、計算結果と一致します。<b>正解</b>。
example: |
  晴れる確率70%の町Aと、60%の町Bがあるとします。「片方だけが晴れる」確率は、「Aだけ晴れ（70%×40%）」と「Bだけ晴れ（30%×60%）」を合わせた46%です。「両方晴れ」や「両方雨」は含みません。
review:
  - 独立した事象の「かつ」は掛け算、同時に起こらない場合の「または」は足し算。
  - 「一方だけ稼働」は「Aのみ」と「Bのみ」の2通りを足す。4状態の合計が1になることで検算する。
