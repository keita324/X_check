q: 73
answer: エ
category: ビジネスインダストリ
theme: |
  現実の機器から集めたデータで、仮想空間に「双子」のようなモデルを作ってシミュレーションする技術「デジタルツイン」を選ぶ問題です。
basics: |
  <b>デジタルツイン（Digital Twin）</b>：現実世界の機器や設備、都市などに取り付けたセンサー（IoT）からデータを集め、<b>仮想空間に現実とそっくりのモデル（デジタル上の双子）</b>を作り、リアルタイムに再現する技術です。仮想空間のモデルでシミュレーションを行い、故障の予測、保守時期の決定、改善策の検証などに役立てます。

  他の用語
  - <b>サーバ仮想化</b>：1台の物理サーバで複数の仮想サーバを動かす技術。
  - <b>スマートグリッド</b>：IT技術を使って電力の需要と供給を最適に制御する次世代の電力網。
  - <b>スマートメーター</b>：通信機能を持つ電力量計。電気の使用量を自動で検針・送信する。
reasoning: |
  1. 問題文のキーワードは「センサーで飛行中のデータを収集」「仮想空間に構築したエンジンのモデルに反映してシミュレーション」「現実世界をリアルタイムに仮想空間で忠実に再現」です。
  2. これは<b>デジタルツイン</b>の説明です。正解は<b>エ</b>です。
choices:
  ア: サーバ仮想化は、1台の物理サーバ上で複数の仮想サーバを動かす技術で、現実の機器を仮想空間で再現する技術ではありません。誤り。
  イ: スマートグリッドは、電力網をITで制御して需要と供給を最適化する仕組みです。誤り。
  ウ: スマートメーターは、通信機能付きの電力量計で、電気の使用量を自動で計測・送信する機器です。誤り。
  エ: IoTで集めたデータで、現実の機器や物理現象を仮想空間にリアルタイムに忠実に再現するのは<b>デジタルツイン</b>です。<b>正解</b>。
example: |
  F1チームは、走行中のマシンから送られるセンサーデータで、仮想空間に同じマシンを再現し、「このままだと何周後にタイヤが限界になるか」をシミュレーションしてピットインのタイミングを決めています。現実のマシンの「デジタルの双子」を使って先を予測するのがデジタルツインです。
review:
  - デジタルツイン＝IoTで集めたデータで、現実の機器・現象を仮想空間にリアルタイムに再現し、シミュレーションや予測に使う。
  - サーバ仮想化、スマートグリッド（電力網の最適制御）、スマートメーター（通信機能付き電力量計）と区別する。
