q: 50
answer: エ
category: ユーザーインタフェース
theme: |
  1つのHTML文書で、スマートフォンからパソコンまで、画面の大きさに合わせて表示を変える「レスポンシブWebデザイン」を実現するための機能を選ぶ問題です。
basics: |
  <b>レスポンシブWebデザイン</b>：1つのHTML文書（同じURL）で、閲覧する端末の画面の大きさに応じて、レイアウトや文字の大きさを自動的に切り替えるWebデザインの手法です。
  <b>メディアクエリ</b>：CSS（Webページの見た目を指定する言語）の機能で、「画面の幅が600ピクセル以下なら、このデザインを適用する」のように、<b>表示する端末の画面の幅などの条件に応じて、適用するスタイルを切り替える</b>ことができます。レスポンシブWebデザインの中心となる技術です。

  他の用語
  - <b>User-Agent</b>：ブラウザがWebサーバに送る、ブラウザやOSの種類を示す情報。サーバ側で端末を判定して、端末ごとに別のページを返すのに使われることがあるが、レスポンシブWebデザインの「単一のHTML文書」で表示を変える仕組みではない。
  - <b>WebSocket</b>：ブラウザとサーバの間で、双方向のリアルタイム通信を行うための仕組み。
  - <b>マッシュアップ</b>：複数のWebサービスやAPIを組み合わせて、新しいサービスを作ること。
reasoning: |
  1. 「単一のHTML文書を用いて、各種端末のディスプレイの大きさに合わせた形式で表示する」には、画面の大きさに応じてCSSを切り替える<b>メディアクエリ</b>を使います。
  2. 正解は<b>エ</b>です。
choices:
  ア: User-Agentは、ブラウザやOSの種類をサーバに伝える情報で、端末ごとに別のHTMLを返す方式に使われます。単一のHTML文書で表示を切り替えるレスポンシブWebデザインの仕組みではありません。誤り。
  イ: WebSocketは、ブラウザとサーバ間で双方向のリアルタイム通信を行う仕組みで、表示のレイアウトとは関係ありません。誤り。
  ウ: マッシュアップは、複数のWebサービスを組み合わせて新しいサービスを作ることで、画面サイズへの対応とは関係ありません。誤り。
  エ: メディアクエリは、画面の幅などの条件に応じて適用するCSSを切り替える機能で、レスポンシブWebデザインの実現に使います。<b>正解</b>。
example: |
  同じニュースサイトを、パソコンでは3列、タブレットでは2列、スマホでは1列で表示できるのは、メディアクエリで「画面が狭いときは1列にする」とCSSに書いてあるからです。ブラウザの幅を狭めていくと、レイアウトが途中で切り替わるのが確かめられます。
review:
  - レスポンシブWebデザインは、CSSのメディアクエリで画面の幅などに応じてスタイルを切り替え、単一のHTMLで各端末に対応する。
  - User-Agent（端末の種類の通知）、WebSocket（双方向通信）、マッシュアップ（サービスの組合せ）と区別する。
