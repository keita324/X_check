q: 35
answer: エ
category: ネットワーク
theme: |
  IPv4アドレスのクラス分け（クラスA〜E）のうち、「クラスD」が何に使われるかを問う問題です。
basics: |
  IPv4アドレスは、昔は先頭のビットの並びによって次のクラスに分けられていました。
  | クラスA（先頭ビット0）：1つのネットワークに約1,677万台。大規模ネットワーク用
  | クラスB（先頭10）：約65,000台。中規模ネットワーク用
  | クラスC（先頭110）：254台まで。小規模ネットワーク用
  | <b>クラスD（先頭1110）</b>：224.0.0.0〜239.255.255.255。<b>マルチキャスト</b>用
  | クラスE（先頭1111）：実験用（予約）
  <b>マルチキャスト</b>：特定のグループに属する複数の相手に、1回の送信で同じデータを送る通信です（動画配信や、ルータ同士の経路情報の交換など）。
  <b>プライベートアドレス</b>：組織内だけで使うアドレスで、クラスA・B・Cの範囲の中にそれぞれ用意されています（10.x.x.x、172.16〜31.x.x、192.168.x.x）。
reasoning: |
  1. クラスDは、ホストを割り振るためのアドレスではなく、<b>マルチキャストアドレス</b>として使われます。
  2. 「マルチキャストアドレスを割り振り、マルチキャスト通信を行う」という<b>エ</b>が正解です。
choices:
  ア: 端末数250台程度までの小規模ネットワークにホストアドレスを割り振るのは、<b>クラスC</b>の使い方です。誤り。
  イ: 端末数65,000台程度の中規模ネットワークにホストアドレスを割り振るのは、<b>クラスB</b>の使い方です。誤り。
  ウ: プライベートアドレスは、クラスA・B・Cの範囲の中に用意されたもので、ユニキャスト通信に使います。クラスDではありません。誤り。
  エ: クラスDのアドレスはマルチキャストアドレスとして割り振り、マルチキャスト通信を行うために使います。<b>正解</b>。
example: |
  クラスA〜Cは「家の住所」（1軒ずつ届ける：ユニキャスト）、クラスDは「町内会の回覧板の宛名」（登録しているメンバー全員に同じ内容を届ける：マルチキャスト）のようなものです。
review:
  - クラスD（224.0.0.0〜239.255.255.255）＝マルチキャスト用アドレス。
  - クラスA（大規模）、B（約65,000台）、C（254台）はホストに割り振るユニキャスト用、クラスEは実験用。
