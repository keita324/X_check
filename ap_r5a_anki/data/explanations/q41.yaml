q: 41
answer: イ
category: セキュリティ
theme: |
  暗号機能をもつIoT機器への攻撃のうち、機器から漏れる物理的な情報を利用する「サイドチャネル攻撃」を、暗号理論への攻撃（線形解読法・差分解読法）や総当たり攻撃と区別する問題です。
basics: |
  <b>サイドチャネル攻撃</b>：暗号の理論そのものではなく、暗号を実装した<b>機器から副次的に漏れる情報</b>（処理時間、消費電力、<b>電磁波</b>、音など）を測定・分析して、秘密鍵などを推測する攻撃です。
  暗号への他の主な攻撃
  - <b>線形解読法</b>：暗号化関数を線形の式で近似し、その近似式から鍵の情報を得る、暗号アルゴリズムへの数学的な攻撃。
  - <b>差分解読法</b>：2つの平文の差と、それぞれの暗号文の差の関係を分析して鍵を推測する、数学的な攻撃。
  - <b>総当たり攻撃（ブルートフォース）</b>：あり得る鍵をすべて試す攻撃。
reasoning: |
  1. 「機器が発する電磁波を測定する」のは、暗号の数学ではなく、機器から漏れる物理的な情報を利用する攻撃＝サイドチャネル攻撃です。
  2. 正解は<b>イ</b>です。
choices:
  ア: 暗号化関数を線形近似する式を導き、その式から秘密情報を得ようとするのは、<b>線形解読法</b>です。暗号アルゴリズムへの数学的な攻撃で、サイドチャネル攻撃ではありません。誤り。
  イ: 機器が発する電磁波を測定して秘密情報を得ようとするのは、<b>サイドチャネル攻撃</b>です。<b>正解</b>。
  ウ: 2つの平文の差とそれぞれの暗号文の差の関係から秘密情報を得ようとするのは、<b>差分解読法</b>です。誤り。
  エ: 理論的にあり得る復号鍵をすべて試すのは、<b>総当たり攻撃（ブルートフォース攻撃）</b>です。誤り。
example: |
  金庫の構造（暗号のアルゴリズム）を数式で分析するのが線形解読法・差分解読法、ダイヤルを全部の番号で回してみるのが総当たり攻撃、ダイヤルを回すときのわずかな音や手応え（電磁波や消費電力）から番号を当てるのがサイドチャネル攻撃です。
review:
  - サイドチャネル攻撃＝機器から漏れる電磁波・消費電力・処理時間などの物理的な情報から秘密を推測する攻撃。
  - 線形解読法（線形近似）、差分解読法（平文と暗号文の差）、総当たり攻撃（全鍵を試す）と区別する。
