q: 31
answer: イ
category: ネットワーク
theme: |
  通信技術の略語「PLC」が何を指すかを、VoIP・Wi-Fi・無線の暗号化技術と区別する用語問題です。
basics: |
  <b>PLC（Power Line Communication：電力線通信）</b>：家庭やビルの<b>電力線（コンセントにつながる電気の配線）</b>を通信回線として利用し、データを送る技術です。電気が流れている線に、高い周波数の通信信号を重ねて送ります。コンセントにPLCアダプターを挿すだけで、LANケーブルを新たに引かずにネットワークを作れます。

  紛らわしい技術
  - <b>VoIP</b>：音声データをIPネットワークで伝送する技術（IP電話など）。
  - <b>Wi-Fi</b>：無線LANの標準規格IEEE 802.11シリーズに基づく製品の総称（相互接続が認証されたもの）。
  - <b>WPA2/WPA3</b>：無線LANの通信を暗号化する技術。
  ※情報処理の分野では、工場の機械を制御する「プログラマブルロジックコントローラ」もPLCと呼びますが、この問題では「通信技術」としてのPLCを問うています。
reasoning: |
  1. 「通信技術の一つであるPLC」は Power Line Communication、つまり電力線通信です。
  2. 「電力線を通信回線として利用する技術」という<b>イ</b>が正解です。
choices:
  ア: 音声データをIPネットワークで伝送する技術は<b>VoIP</b>です。誤り。
  イ: 電力線を通信回線として利用する技術は<b>PLC（電力線通信）</b>です。<b>正解</b>。
  ウ: 無線LANの標準規格IEEE 802.11シリーズに関わる総称は<b>Wi-Fi</b>です。誤り。
  エ: 無線通信における暗号化技術は、<b>WPA2・WPA3</b>などです。誤り。
example: |
  Wi-Fiの電波が届きにくい離れの部屋でも、家の電気配線はつながっています。PLCアダプターを親機の近くと離れの部屋のコンセントに挿すと、電気配線を通してインターネットが使えるようになります。
review:
  - PLC（電力線通信）＝家庭の電力線を通信回線として利用する技術。
  - VoIP（IP電話）、Wi-Fi（無線LAN規格の総称）、WPA（無線の暗号化）と区別する。
