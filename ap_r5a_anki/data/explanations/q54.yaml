q: 54
answer: エ
category: プロジェクトマネジメント
theme: |
  プロジェクトのリスクマネジメントの流れ（特定→評価→対応→管理）のうち、「コンティンジェンシー計画」を作るのはどのプロセスかを問う問題です。
basics: |
  <b>リスクマネジメントのプロセス</b>（JIS Q 21500 などの考え方）
  | リスクの特定：どんなリスクがあるかを洗い出す
  | リスクの評価：発生確率と影響の大きさを分析し、優先順位を付ける
  | <b>リスクへの対応</b>：優先度の高いリスクについて、対応策を決め、計画する（回避・転嫁・軽減・受容など）
  | リスクの管理：対応策を実行し、リスクの状況を監視・管理する
  <b>コンティンジェンシー計画</b>：リスクが<b>実際に起きたとき（あらかじめ決めた条件を満たしたとき）に実行する対応策</b>を、前もって決めておく計画です。対応策を決める「リスクへの対応」のプロセスで作成します。
reasoning: |
  1. コンティンジェンシー計画は「リスクが顕在化したらどう対応するか」という<b>対応策の計画</b>です。
  2. 対応策を策定するのは<b>リスクへの対応</b>のプロセスです。正解は<b>エ</b>です。
choices:
  ア: リスクの管理は、対応策を実行し、リスクの状況や対応の効果を監視・管理するプロセスです。コンティンジェンシー計画を作成するのは、その前の対応のプロセスです。誤り。
  イ: リスクの特定は、リスクを洗い出すプロセスです。対応策はまだ決めません。誤り。
  ウ: リスクの評価は、リスクの発生確率や影響度を分析して優先順位を付けるプロセスです。誤り。
  エ: リスクへの対応は、リスクへの対応策を決めるプロセスで、コンティンジェンシー計画はここで作成します。<b>正解</b>。
example: |
  遠足の計画で、「雨が降るかも」と考える（特定）→「梅雨時期なので降る確率は高い」と見積もる（評価）→「雨なら科学館に行き先を変える」と決める（対応＝コンティンジェンシー計画）→当日の天気を見て判断する（管理）、という流れです。
review:
  - リスクマネジメントの流れ：特定→評価→対応→管理。コンティンジェンシー計画は「リスクへの対応」で作成する。
  - コンティンジェンシー計画＝リスクが顕在化したときに実行する対応策を事前に決めた計画。
