q: 32
answer: ウ
category: ネットワーク
theme: |
  電話回線などのシリアル回線で使われるPPPの機能を、LAN（イーサネット）上で使えるようにしたプロトコル「PPPoE」を選ぶ問題です。
basics: |
  <b>シリアル回線</b>：2地点を1対1でつなぐ通信回線です（昔のダイヤルアップ接続の電話回線など）。
  <b>データリンク層</b>：直接つながった機器同士で、データを確実に受け渡すための層です。

  関連するプロトコル
  - <b>PPP（Point-to-Point Protocol）</b>：シリアル回線で2地点を結ぶためのデータリンク層のプロトコル。接続の確立、ユーザ認証（ID・パスワード）、IPアドレスの割当てなどを行う。
  - <b>PPPoE（PPP over Ethernet）</b>：PPPの仕組みを<b>イーサネット（LAN）上で</b>使えるようにしたもの。光回線などでプロバイダに接続するときの認証に広く使われている。
  - <b>MPLS</b>：パケットにラベルを付けて高速に転送する技術。
  - <b>PPTP</b>：PPPのデータを暗号化してIPネットワーク上を運び、VPNを作るためのプロトコル。
reasoning: |
  1. 「シリアル回線で使用するもの（＝PPP）と同じ」コネクション確立やデータ転送を、「LAN上で」実現するもの、という条件です。
  2. PPPを「over Ethernet」、つまりイーサネット（LAN）上で使えるようにしたのが<b>PPPoE</b>です。
  3. 正解は<b>ウ</b>です。
choices:
  ア: MPLSは、パケットにラベルを付けて、ルータでの転送を高速化する技術です。PPPをLAN上で実現するものではありません。誤り。
  イ: PPPそのものは、シリアル回線で使われるプロトコルです。問題は「LAN上で実現する」ものを問うているので誤り。
  ウ: PPPoEは、PPPのコネクション確立や認証、データ転送の仕組みをイーサネット（LAN）上で実現するプロトコルです。<b>正解</b>。
  エ: PPTPは、PPPのデータをIPネットワーク上でトンネリング（カプセル化）してVPNを作るプロトコルです。LAN上でPPPを実現するものではありません。誤り。
example: |
  家庭で光回線を契約したとき、ルーターに「プロバイダのユーザIDとパスワード」を設定することがあります。この設定が、PPPoEでプロバイダと接続・認証するためのものです。昔の電話回線のダイヤルアップ接続（PPP）と同じ仕組みを、LANケーブルの先で使っているわけです。
review:
  - PPPoE＝PPP（シリアル回線用の接続・認証プロトコル）をイーサネット（LAN）上で使えるようにしたもの。
  - MPLS（ラベルによる高速転送）、PPTP（PPPを使ったVPN）と区別する。
