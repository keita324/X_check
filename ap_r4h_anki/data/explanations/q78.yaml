q: 78
answer: ア
category: 法務
theme: |
  不正アクセス禁止法で禁止されている行為のうち、「不正アクセス行為を助長する行為」に当たるものを、他の禁止行為と区別する問題です。
basics: |
  <b>不正アクセス禁止法</b>：他人のIDやパスワードを無断で使ってシステムにログインする「不正アクセス行為」と、それにつながる行為を禁止する法律です。
  <b>識別符号</b>：利用者IDとパスワードなど、利用者を識別するための情報です。

  法律で禁止されている主な行為
  | 不正アクセス行為（他人のIDとパスワードで無断ログインなど）
  | 他人の識別符号を<b>不正に取得</b>する行為（不正アクセスの目的で）
  | 不正アクセス行為を<b>助長</b>する行為（正当な理由なく他人の識別符号を第三者に提供する）
  | 他人の識別符号を<b>不正に保管</b>する行為（不正アクセスの目的で）
  | 識別符号の入力を<b>不正に要求</b>する行為（フィッシングサイトの開設、フィッシングメールの送信など）
reasoning: |
  1. 「助長」とは、他人が不正アクセスしやすくなるように手助けすることです。
  2. 業務などの正当な理由なく、他人のIDとパスワードを、本人やシステム管理者以外の第三者に提供すると、受け取った人が不正アクセスできてしまいます。これが「不正アクセス行為を助長する行為」です。
  3. 正解は<b>ア</b>です。
choices:
  ア: 正当な理由なく、他人の利用者IDとパスワードを正規の利用者及びシステム管理者以外の者に提供するのは、<b>不正アクセス行為を助長する行為</b>です。<b>正解</b>。
  イ: 他人のIDとパスワードを不正に入手する目的でフィッシングサイトを開設するのは、<b>識別符号の入力を不正に要求する行為</b>として、別の規定で禁止されています。誤り。
  ウ: 不正アクセスの目的で他人のIDとパスワードを不正に入手するのは、<b>識別符号を不正に取得する行為</b>として、別の規定で禁止されています。誤り。
  エ: 不正アクセスの目的で、不正に入手した他人のIDとパスワードをPCに保管するのは、<b>識別符号を不正に保管する行為</b>として、別の規定で禁止されています。誤り。
example: |
  他人の家の合鍵に例えると、合鍵で勝手に入る（不正アクセス）、合鍵を盗む（不正取得）、盗んだ合鍵を隠し持つ（不正保管）、偽の鍵屋を開いて合鍵を出させる（不正要求＝フィッシング）、そして合鍵を他人に渡す（助長）は、それぞれ別の罪として決められています。
review:
  - 不正アクセスの助長＝正当な理由なく他人のID・パスワードを第三者に提供する行為。
  - フィッシングサイト開設（不正要求）、不正取得、不正保管は、それぞれ別の規定で禁止されている。
