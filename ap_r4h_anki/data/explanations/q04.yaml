q: 4
answer: ア
category: 基礎理論
theme: |
  データの誤りを自動で見つけて直す「ハミング符号」で、3つの検査式を計算して、どのビットが誤っているかを特定・訂正する問題です。
basics: |
  <b>冗長ビット（検査ビット）</b>：データ本体とは別に付け加える、誤りを見つけるためのビットです。
  <b>排他的論理和 ⊕（XOR）</b>：2つが同じなら0、違えば1。たくさんのビットのXORは「1の個数が偶数なら0、奇数なら1」になります。

  <b>ハミング符号の仕組み</b>：検査式は、正しいデータなら必ず0になるように作られています。
  - 誤りがあると、そのビットを含む検査式だけが1になります。
  - 各データビットは、どの検査式に含まれるかの組合せがすべて異なるように設計されているので、<b>どの式が1になったか</b>を見れば誤ったビットを特定できます。
reasoning: |
  1. 符号は X<sub>1</sub>X<sub>2</sub>X<sub>3</sub>P<sub>3</sub>X<sub>4</sub>P<sub>2</sub>P<sub>1</sub> の順なので、1110011 を当てはめます。
  | X<sub>1</sub>=1, X<sub>2</sub>=1, X<sub>3</sub>=1, P<sub>3</sub>=0, X<sub>4</sub>=0, P<sub>2</sub>=1, P<sub>1</sub>=1
  2. 3つの検査式を計算します。
  | 式1：X<sub>1</sub>⊕X<sub>3</sub>⊕X<sub>4</sub>⊕P<sub>1</sub> ＝ 1⊕1⊕0⊕1 ＝ 1（×）
  | 式2：X<sub>1</sub>⊕X<sub>2</sub>⊕X<sub>4</sub>⊕P<sub>2</sub> ＝ 1⊕1⊕0⊕1 ＝ 1（×）
  | 式3：X<sub>1</sub>⊕X<sub>2</sub>⊕X<sub>3</sub>⊕P<sub>3</sub> ＝ 1⊕1⊕1⊕0 ＝ 1（×）
  3. 3つの式すべてが1になりました。3つの式すべてに含まれるビットは <b>X<sub>1</sub></b> だけです（X<sub>2</sub>は式2・3、X<sub>3</sub>は式1・3、X<sub>4</sub>は式1・2、P<sub>1</sub>〜P<sub>3</sub>はそれぞれ1つの式にだけ含まれる）。
  4. X<sub>1</sub> を 1→0 に訂正すると <b>0110011</b>。確認すると3つの式はすべて0になります。
  5. 正解は<b>ア</b>です。
choices:
  ア: 0110011。X<sub>1</sub>を訂正したもので、3つの検査式がすべて0になります。<b>正解</b>。
  イ: 1010011 は X<sub>2</sub> を反転したものです。X<sub>2</sub>が誤りなら式2と式3だけが1になるはずで、式1も1である今回の結果と合いません。誤り。
  ウ: 1100011 は X<sub>3</sub> を反転したものです。X<sub>3</sub>が誤りなら式1と式3だけが1になるはずです。誤り。
  エ: 1110111 は X<sub>4</sub> を反転したものです。X<sub>4</sub>が誤りなら式1と式2だけが1になるはずです。誤り。
example: |
  3人の検査員がそれぞれ決まった数人の担当者をチェックし、「担当の中に問題あり」とだけ報告するとします。担当の組合せが全員違うように決めておけば、どの検査員が「問題あり」と言ったかの組合せから、問題の人を1人に特定できます。3人全員が「問題あり」なら、3人全員の担当になっている人が犯人です。
review:
  - 符号の並び順（X<sub>1</sub>X<sub>2</sub>X<sub>3</sub>P<sub>3</sub>X<sub>4</sub>P<sub>2</sub>P<sub>1</sub>）に注意して各ビットに値を割り当て、検査式を計算する。
  - 1になった検査式の組合せと、各ビットがどの式に含まれるかを照らし合わせて誤りビットを特定する。
  - 訂正後に全検査式が0になることを確かめる。
