q: 80
answer: イ
category: 法務
theme: |
  企業Aに雇われた労働者Cが、契約に基づいて企業Bで働くとき、契約の種類（請負・出向・労働者派遣）によって、企業BとCの間に「指揮命令関係」や「雇用関係」が生じるかを判断する問題です。
basics: |
  図の前提：企業Aと労働者Cは雇用関係にあり、企業Aと企業Bの間に何らかの「契約」があります。
  - <b>請負契約</b>：受託者（仕事を請け負う側）が仕事の完成を約束する契約。作業者への<b>指揮命令は受託者</b>が行い、委託者（発注者）は作業者に直接指示できない。
  - <b>出向（在籍出向）</b>：出向元に籍（雇用関係）を残したまま、<b>出向先とも雇用関係</b>を結んで出向先で働く。出向先は労働者に<b>指揮命令</b>できる。
  - <b>労働者派遣</b>：派遣元（企業A）が雇用する労働者を派遣先（企業B）に派遣し、<b>派遣先が指揮命令</b>する。雇用関係は<b>派遣元とだけ</b>あり、派遣先とは雇用関係がない。出向とは異なる。
reasoning: |
  1. ア：請負契約で企業Aが受託者、企業Bが委託者の場合、労働者Cに指揮命令するのは雇用主でもある企業Aです。企業B（委託者）とCの間に指揮命令関係は<b>生じません</b> → ×。
  2. イ：出向で企業AがCを企業Bに出向させた場合、出向先の企業BとCの間には雇用関係が結ばれ、<b>指揮命令関係が生じます</b> → ○。
  3. ウ：労働者派遣で企業Bが派遣先の場合、企業BとCの間には指揮命令関係は生じますが、<b>雇用関係は生じません</b>（雇用関係は派遣元Aとだけ）→ ×。
  4. エ：労働者派遣と出向は別の制度で、派遣されている状態を出向とはいいません → ×。
  5. 正解は<b>イ</b>です。
choices:
  ア: 請負契約では、委託者である企業Bは労働者Cに直接指揮命令できません。指揮命令するのは受託者の企業Aです。誤り。
  イ: 出向の場合、出向先の企業Bと労働者Cの間には指揮命令関係が生じます。<b>正解</b>。
  ウ: 労働者派遣では、派遣先の企業BとCの間には指揮命令関係はありますが、雇用関係は派遣元の企業Aとの間にだけあり、企業Bとの間には生じません。誤り。
  エ: 労働者派遣は出向とは異なる制度です。派遣先の企業Bに労働者Cが出向しているとはいえません。誤り。
example: |
  会社員が子会社に「出向」すると、子会社の上司の指示で働き、子会社の社員として扱われます。一方、派遣社員は、派遣先の上司の指示で働きますが、雇い主はあくまで派遣会社です。請負なら、発注元の会社の人は、作業している人に直接指示を出せません。
review:
  - 出向＝出向先とも雇用関係を結び、出向先が指揮命令する。労働者派遣＝派遣先が指揮命令するが、雇用関係は派遣元とだけ。
  - 請負＝委託者（発注者）は作業者に指揮命令できない（受託者が指揮命令）。
