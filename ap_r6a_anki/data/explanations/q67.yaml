q: 67
answer: エ
category: システム戦略
theme: |
  経営で使われる情報システムのうち、<b>SCM（サプライチェーンマネジメント）</b>の目的を、CRM・SFA・ERPの目的と区別する問題です。
basics: |
  <b>サプライチェーン（供給連鎖）</b>：原材料の調達 → 生産 → 物流 → 販売 → 消費者、という「モノが届くまでの鎖」のことです。通常は、部品メーカー、製造業者、卸売業者、小売業者など<b>複数の企業</b>にまたがります。
  <b>SCM（Supply Chain Management）</b>：このサプライチェーン全体の情報（需要予測、在庫、生産計画、出荷など）を、企業の枠を越えて共有・統合管理し、<b>在庫の削減、コスト低減、納期短縮</b>を目指す経営手法です。

  よく比較される仕組み
  - <b>CRM</b>（顧客関係管理）：顧客情報・購買履歴・クレームなどを一元管理し、良好な顧客関係を築く。
  - <b>SFA</b>（営業支援システム）：商談の状況や営業スケジュールを管理し、営業活動を効率化する。
  - <b>ERP</b>（企業資源計画）：生産・販売・会計・人事など<b>1つの企業内</b>の基幹業務の情報を統合し、経営効率を高める。
reasoning: |
  1. SCMのキーワードは「<b>複数の企業・組織にまたがる</b>」「調達から販売まで」「情報を統合管理」「コスト低減・納期短縮」です。
  2. ア（顧客対応・顧客関係）はCRM、イ（商談状況・営業効率）はSFA、ウ（社内の基幹業務の統合）はERPの説明です。
  3. 企業をまたいで調達〜販売までを統合管理するエが、SCMの目的です。正解は<b>エ</b>です。
choices:
  ア: 顧客情報、購買履歴、クレームを一元管理して良好な顧客関係を構築するのは、<b>CRM</b>の目的です。誤り。
  イ: 顧客情報や商談スケジュール、進捗状況を一元管理して営業活動の効率を高めるのは、<b>SFA</b>の目的です。誤り。
  ウ: 生産、販売、在庫、財務会計、人事など社内の基幹業務の情報を統合管理して経営効率を高めるのは、<b>ERP</b>の目的です。誤り。
  エ: 複数の企業や組織にまたがる調達から販売までの業務プロセス全体の情報を統合管理し、コスト低減や納期短縮を図るのが、<b>SCM</b>の目的です。<b>正解</b>。
example: |
  コンビニのおにぎりで考えると、店舗の販売データを食品工場や米の仕入先、配送会社と共有すれば、「明日はこのくらい売れる」と分かるので、作りすぎ（在庫・廃棄）や品切れが減り、配送も効率よくなります。会社の垣根を越えて情報をつなぐのがSCMです。
review:
  - SCM＝複数企業にまたがる調達〜販売の情報を統合管理し、在庫・コスト削減、納期短縮を図る。
  - CRM（顧客関係）、SFA（営業活動）、ERP（社内基幹業務の統合）と、管理対象と範囲で区別する。
