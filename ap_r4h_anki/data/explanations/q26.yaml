q: 26
answer: ウ
category: データベース
theme: |
  分散システムでは「整合性・可用性・分断耐性」の3つを同時には満たせないとする「CAP定理」を理解し、AとPを選んだシステムの性質を答える問題です。
basics: |
  <b>分散システム</b>：データを複数のサーバ（ノード）に分けて持ち、ネットワークで連携して動くシステムです。
  <b>CAP定理</b>：分散システムは、次の3つの性質のうち、<b>同時に2つまでしか満たせない</b>という定理です。
  - <b>C：Consistency（整合性・一貫性）</b>：どのサーバに問い合わせても、常に最新の同じデータが返ってくる。
  - <b>A：Availability（可用性）</b>：一部のサーバが故障しても、いつでも応答が返ってくる（使える）。
  - <b>P：Partition tolerance（分断耐性）</b>：ネットワークが途中で切れてサーバ同士が連絡できなくなっても、システムとして動き続ける。
reasoning: |
  1. 「AとPの特性をもつ」＝可用性と分断耐性を満たすシステムです。
  2. CAP定理により3つ全部は満たせないので、残りの<b>C（整合性）は満たさない</b>ことになります。
  3. 理由：ネットワークが分断されたとき、各サーバが（他と連絡が取れなくても）応答し続ける（A）と、分断された相手側での更新を反映できないため、サーバによって古いデータを返すことがあります（Cが崩れる）。
  4. 正解は<b>ウ</b>です。
choices:
  ア: CAP定理では、3つの特性すべてを同時に満たすことはできないとされています。誤り。
  イ: 可用性と整合性を満たし、分断耐性を満たさないのは、<b>CA</b>の特性をもつシステムです。AとPのシステムではありません。誤り。
  ウ: 可用性と分断耐性を満たすが、整合性は満たさない。<b>AとP</b>を選んだシステムの説明です。<b>正解</b>。
  エ: 整合性と分断耐性を満たし、可用性を満たさないのは、<b>CP</b>の特性をもつシステムです。誤り。
example: |
  全国チェーンのお店の在庫システムで、本部との通信が切れた（分断）とします。「各店舗はそのまま販売を続ける」ならAP型で、一時的に店舗ごとの在庫数が食い違う（整合性が崩れる）ことを許します。「正確な在庫が分かるまで販売を止める」ならCP型で、整合性を守る代わりに使えない時間（可用性の低下）が生じます。
review:
  - CAP定理：整合性（C）・可用性（A）・分断耐性（P）のうち同時に満たせるのは2つまで。
  - AP型は整合性を、CP型は可用性を、CA型は分断耐性をあきらめる、と組合せで覚える。
