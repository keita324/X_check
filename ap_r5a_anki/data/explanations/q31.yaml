q: 31
answer: ウ
category: ネットワーク
theme: |
  LANの速度と伝送効率から、大量のデータを送るのにかかる時間を計算する問題です。バイトとビットの換算と、伝送効率の使い方がポイントです。
basics: |
  <b>伝送速度</b>：1秒間に送れるビット数。100Mビット/秒 ＝ 1秒に 100×10<sup>6</sup> ＝ 10<sup>8</sup> ビット。
  <b>伝送効率</b>：回線の速度のうち、実際にデータを運ぶのに使える割合です。制御情報やすき間などがあるため、100%にはなりません。伝送効率50%なら、実際に使える速度は半分です。
  | 実効速度 ＝ 伝送速度 × 伝送効率
  | 伝送時間 ＝ データ量（ビット）÷ 実効速度
  <b>1バイト＝8ビット</b>：データ量がバイトで与えられたら、8倍してビットに直します。
reasoning: |
  1. 送るデータ量を求めます。
  | 1,000バイト × 1,000件 ＝ 1,000,000バイト ＝ 10<sup>6</sup>バイト
  | ビットに直す：10<sup>6</sup> × 8 ＝ 8 × 10<sup>6</sup> ビット
  2. 実効速度を求めます。
  | 100 × 10<sup>6</sup> × 0.5 ＝ 5 × 10<sup>7</sup> ビット/秒
  3. 伝送時間を求めます。
  | 8 × 10<sup>6</sup> ÷ (5 × 10<sup>7</sup>) ＝ 0.16秒
  4. 正解は<b>ウ</b>です。
choices:
  ア: 0.02秒は、10<sup>6</sup>（バイトのまま）÷ 5×10<sup>7</sup> で、バイトをビットに換算し忘れた値です。誤り。
  イ: 0.08秒は、8×10<sup>6</sup> ÷ 10<sup>8</sup> で、伝送効率50%を考慮し忘れた値です。誤り。
  ウ: 0.16秒。ビットに換算し、伝送効率50%を考慮して計算した値と一致します。<b>正解</b>。
  エ: 1.6秒は、正しい値の10倍で、桁（10のべき乗）の扱いを誤った値です。誤り。
example: |
  時速100kmの道路でも、信号や渋滞で実際の平均速度が半分の時速50kmなら、80km走るのに1.6時間かかります。ネットワークも同じで、表示上の速度に伝送効率を掛けた「実際の速さ」で計算します。
review:
  - 伝送時間＝データ量（ビット）÷（伝送速度×伝送効率）。バイト×8＝ビットの換算を忘れない。
  - 換算忘れ（0.02）、効率の考慮忘れ（0.08）のひっかけに注意し、単位（M＝10<sup>6</sup>）を確認する。
