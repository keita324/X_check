q: 30
answer: ア
category: データベース
theme: |
  ビッグデータを活用する技術「データマイニング」の説明を、データマート・データモデル・レプリケーションと区別する問題です。
basics: |
  <b>ビッグデータ</b>：量が膨大で、種類も多様、次々に発生するデータ（購買履歴、センサデータ、SNSの投稿など）です。
  <b>データマイニング</b>：mining＝採掘。大量のデータを統計学やAIの手法で分析し、<b>人が気づいていない規則性や相関関係（隠れた知識）を掘り出す</b>ことです。単に条件を指定して探す「検索」とは違い、何が見つかるか事前には分かりません。

  関連用語
  - <b>データウェアハウス</b>：分析用に、社内の様々なデータを時系列で集めて蓄積した大きなデータベース。
  - <b>データマート</b>：データウェアハウスから、特定の部門や用途向けに一部を切り出したもの。
  - <b>データモデル</b>：データの構造・意味・操作の枠組み（関係モデルなど）。
  - <b>レプリケーション</b>：データを複数のサーバに複製すること。
reasoning: |
  1. データマイニングのポイントは「蓄積データを分析」「単なる検索では分からない」「隠れた規則や相関関係を見つける」です。
  2. これを述べているのは<b>ア</b>です。
choices:
  ア: 蓄積されたデータを分析し、単なる検索では分からない隠れた規則や相関関係を見つけ出すのは<b>データマイニング</b>です。<b>正解</b>。
  イ: データウェアハウスのデータの一部を、特定の用途や部門用に切り出して格納するのは<b>データマート</b>です。誤り。
  ウ: データ処理の対象となる情報を基に規定した、データの構造・意味・操作の枠組みは<b>データモデル</b>です。誤り。
  エ: データを複数のサーバに複製して性能と可用性を高めるのは<b>レプリケーション</b>です。誤り。
example: |
  有名な例に「スーパーの購買データを分析したら、紙おむつとビールが一緒に買われることが多かった」という話があります。誰も予想していなかった組合せを、大量のレシートデータから見つけ出すのがデータマイニングです。「ビールを買った人の一覧を出して」というのは単なる検索です。
review:
  - データマイニング＝大量データから、検索では分からない隠れた規則・相関関係を発見する分析。
  - データマート（DWHの一部を用途別に切り出し）、データモデル（構造の枠組み）、レプリケーション（複製）と区別する。
