q: 53
answer: ウ
category: プロジェクトマネジメント
theme: |
  作業ごとの開始条件（前に終わっていなければならない作業）と所要日数から、プロジェクト全体の最短期間を求める問題です。並行できる作業を見つけて、最も長い経路（クリティカルパス）を求めます。
basics: |
  <b>開始条件</b>：その作業を始める前に完了している必要がある作業です。開始条件が同じ作業同士は、<b>並行して</b>進めることができます。
  <b>最短期間</b>：並行できる作業は同時に進めたとして、すべての作業が終わるまでの日数です。複数の作業の完了を待つ作業は、<b>遅い方が終わってから</b>開始します。
  <b>クリティカルパス</b>：開始から終了までの経路のうち、最も時間がかかる経路。これが全体の最短期間を決めます。
reasoning: |
  プロジェクト開始を0日目として、各作業の開始日と終了日を求めます。
  | 要件定義：0日目開始、30日 → 30日目に終了
  | 設計：要件定義の完了後 → 30日目開始、20日 → 50日目に終了
  | 製造：設計の完了後 → 50日目開始、25日 → 75日目に終了
  | テスト：製造の完了後 → 75日目開始、15日 → 90日目に終了
  | 利用者マニュアル作成：設計の完了後 → 50日目開始、20日 → 70日目に終了（製造・テストと並行）
  | 利用者教育：テストとマニュアル作成の両方の完了後 → 遅い方の90日目に開始、10日 → <b>100日目</b>に終了
  クリティカルパスは「要件定義→設計→製造→テスト→利用者教育」（30＋20＋25＋15＋10＝100日）です。
  正解は<b>ウ</b>です。
choices:
  ア: 80日。マニュアル作成側の経路（30＋20＋20＋10）で計算した値です。より長いテスト側の経路を見落としています。誤り。
  イ: 95日。計算結果の100日と一致しません。誤り。
  ウ: 100日。クリティカルパス（要件定義→設計→製造→テスト→利用者教育）の合計で、計算結果と一致します。<b>正解</b>。
  エ: 120日は、6つの作業すべてを順番に行った場合の合計（30＋20＋25＋15＋20＋10）です。マニュアル作成は製造・テストと並行できるので誤り。
example: |
  料理で「ご飯を炊く（30分）」と「おかずを作る（20分）」を並行すれば、両方そろうのは30分後です。どちらか遅い方に合わせて「盛り付け」を始めるので、全体の時間は長い方の経路で決まります。
review:
  - 各作業の開始日＝開始条件となる作業の終了日のうち最も遅い日。表にして順に求める。
  - 全体の最短期間＝最も長い経路（クリティカルパス）の日数。並行できる作業を単純に足さない。
