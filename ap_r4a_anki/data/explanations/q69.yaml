q: 69
answer: イ
theme: |
  マーケティングの分析手法「コンジョイント分析」の説明を、ABC分析・コーホート分析・ポジショニング分析と区別する問題です。
basics: |
  <b>属性</b>：商品を構成する要素のことです。例えばスマホなら「価格」「画面の大きさ」「カメラ性能」「色」など。
  <b>コンジョイント分析</b>：属性の組合せを変えた複数の商品案（例：「5万円・大画面・高性能カメラ」「3万円・小画面・普通のカメラ」…）を消費者に評価してもらい、その結果から、<b>どの属性がどれだけ購買の決め手になっているか</b>（各属性の重要度）を統計的に推定する手法です。
  「conjoint＝結合した」という名前のとおり、属性を個別に聞くのではなく、<b>組合せ</b>全体で評価してもらう点が特徴です。
reasoning: |
  1. コンジョイント分析のキーワードは「複数の属性」「組合せ」「購入者が重視しているもの」です。
  2. 「商品がもつ価格、デザイン、使いやすさなど、購入者が重視している複数の属性の組合せを分析する手法」という<b>イ</b>が正解です。
choices:
  ア: 顧客ごとの売上高や利益額を高い順に並べ、ビジネスの中心となっている顧客を分析するのは<b>ABC分析（パレート分析）</b>です。誤り。
  イ: 価格、デザイン、使いやすさなど、購入者が重視する複数の属性の組合せを分析するのは<b>コンジョイント分析</b>です。<b>正解</b>。
  ウ: 同じ時期に生まれた世代（コーホート）が、年齢や時代が変わっても共通の行動や意識を示すことに注目して分析するのは<b>コーホート分析</b>です。誤り。
  エ: ブランドの複数のイメージ項目を散布図（ポジショニングマップ）にプロットし、各ブランドの立ち位置を分析するのは<b>ポジショニング分析</b>です。誤り。
example: |
  ノートパソコンの新製品を企画するとき、「価格を1万円下げる」のと「重さを300g軽くする」のとでは、どちらが売上に効くかを知りたいとします。いろいろな組合せの架空の商品を見せて、「どれを買いたいか」を順位付けしてもらい、その結果から各属性の効き目を数値で推定するのがコンジョイント分析です。
review:
  - コンジョイント分析＝複数の属性の組合せに対する評価から、各属性が購買にどれだけ影響するかを推定する手法。
  - ABC分析（売上順の重点分析）、コーホート分析（世代ごとの行動）、ポジショニング分析（散布図でブランドの位置付け）と区別する。
