q: 49
answer: イ
category: ソフトウェア開発管理技術
theme: |
  アジャイル開発の初期段階で、プロジェクトの目的やスコープについて関係者の共通認識を作るための手法「インセプションデッキ」を、他のアジャイルの手法と区別する問題です。
basics: |
  - <b>インセプションデッキ</b>：inception＝始まり。プロジェクトの開始時に、「我々はなぜここにいるのか」「エレベーターピッチ」「やらないことリスト」「ご近所さんを探せ」など、<b>あらかじめ決められた10個程度の設問と課題</b>に、関係者が集まって答え、プロジェクトの目的やスコープなどの<b>共通認識</b>を作り、成果を共有する手法。
  - <b>アジャイルモデリング</b>：必要十分な分だけモデル（図）を作り、変化に合わせて見直していく、アジャイルなモデリングの考え方。
  - <b>プランニングポーカー</b>：チームのメンバーが数字の書かれたカードを同時に出して、作業の大きさ（ストーリーポイント）を見積もる手法。
  - <b>ユーザーストーリーマッピング</b>：利用者の行動の流れに沿ってユーザーストーリーを並べ、全体像とリリースの優先順位を整理する手法。
reasoning: |
  1. 問題文のキーワードは「アジャイル開発の<b>初期段階</b>」「プロジェクトの目的、スコープなどに対する<b>共通認識</b>」「<b>あらかじめ設定されている設問と課題</b>について関係者が集まって確認し合い、成果を共有」です。
  2. これは<b>インセプションデッキ</b>です。正解は<b>イ</b>です。
choices:
  ア: アジャイルモデリングは、必要最小限のモデルを作って継続的に改善していくモデリングの考え方で、決められた設問に答えて共通認識を作る手法ではありません。誤り。
  イ: プロジェクトの初期に、あらかじめ設定された設問と課題に関係者が答え、目的やスコープの共通認識を得て共有する手法は、<b>インセプションデッキ</b>です。<b>正解</b>。
  ウ: プランニングポーカーは、カードを使って作業量（ストーリーポイント）を見積もる手法です。誤り。
  エ: ユーザーストーリーマッピングは、利用者の行動に沿ってストーリーを並べ、全体像と優先順位を整理する手法です。誤り。
example: |
  文化祭の出し物を決めた最初の会議で、「なぜやるのか」「誰に来てほしいか」「やらないことは何か」「困ったら誰に相談するか」といった決まった質問に全員で答え、その答えを紙にまとめて教室に貼っておくイメージです。後で意見が割れたとき、全員がその紙に立ち返れます。
review:
  - インセプションデッキ＝プロジェクト初期に、決められた設問・課題に関係者で答え、目的・スコープの共通認識を作る手法。
  - プランニングポーカー（見積り）、ユーザーストーリーマッピング（ストーリーの全体像整理）、アジャイルモデリング（必要十分なモデル）と区別する。
