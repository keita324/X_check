q: 72
answer: イ
theme: |
  部品構成表と在庫表から、製品を出荷するために新たに用意すべき部品の数（正味所要量）を求める問題です。生産管理のMRP（資材所要量計画）の基本計算です。
basics: |
  <b>構成表（部品表）</b>：製品1個を作るのに、どの部品が何個必要かを示した表です。この問題では、
  | 製品A 1個 ＝ 部品a 3個 ＋ 部品b 2個
  | 部品a 1個 ＝ 部品b 1個 ＋ 部品c 2個
  つまり、部品bは「Aに直接使う分」と「aを作るのに使う分」の2通りで必要になります。

  <b>総所要量</b>：必要な数の合計。<b>正味所要量</b>：総所要量から、すでにある在庫を差し引いた、<b>新たに用意（製造・調達）しなければならない数</b>です。
  | 正味所要量 ＝ 総所要量 − 在庫量
  上の階層（製品A）から順に、在庫を差し引きながら下の階層（部品）へ計算していくのがポイントです。
reasoning: |
  <b>(1) 製品A</b>
  | 出荷300個 − 在庫100個 ＝ 新たに作る数 <b>200個</b>
  <b>(2) 部品a</b>（Aを1個作るのに3個必要）
  | 総所要量：200 × 3 ＝ 600個
  | 正味所要量：600 − 在庫100 ＝ 新たに作る数 <b>500個</b>
  <b>(3) 部品b</b>（Aに2個ずつ、aに1個ずつ必要）
  | A用：200 × 2 ＝ 400個
  | a用：500 × 1 ＝ 500個
  | 総所要量：400 ＋ 500 ＝ 900個
  | 正味所要量：900 − 在庫300 ＝ <b>600個</b>
  正解は<b>イ</b>です。
choices:
  ア: 200個は、製品Aを新たに作る数です。部品bの正味所要量ではありません。誤り。
  イ: 600個。Aとaの在庫を差し引いた上で求めたbの総所要量900個から、bの在庫300個を引いた値です。<b>正解</b>。
  ウ: 900個は、部品bの総所要量です。b自身の在庫300個を差し引き忘れています。誤り。
  エ: 1,500個は、在庫を一切考慮せずに計算した値です（A用 300×2＝600、a用 300×3×1＝900、合計1,500）。誤り。
example: |
  カレーを300皿出したいけれど、作り置きが100皿あるなら、新たに作るのは200皿分です。その200皿分のルウの材料を計算し、冷蔵庫にある材料を差し引いた分だけを買いに行きます。上の段階から順に「在庫を引いてから下に進む」のがコツです。
review:
  - 正味所要量＝総所要量−在庫量。製品→中間部品→部品の順に、各階層で在庫を差し引いてから下の階層を計算する。
  - 部品bのように複数の親（Aとa）から使われる部品は、それぞれの所要量を合計してから在庫を引く。
