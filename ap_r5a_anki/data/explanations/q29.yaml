q: 29
answer: イ
category: データベース
theme: |
  副問合せ（NOT EXISTS）を含むSQL文を、2つの表に当てはめて実行し、結果の行数を求める問題です。
basics: |
  <b>EXISTS（副問合せ）</b>：( ) 内のSELECTの結果が<b>1行でもあれば真</b>になります。
  <b>NOT EXISTS（副問合せ）</b>：( ) 内のSELECTの結果が<b>1行もなければ真</b>になります。
  <b>相関副問合せ</b>：( ) の中で外側の表（ここでは「製品」）の値を使っているので、外側の表の<b>1行ごとに</b>副問合せを実行します。

  このSQL文の意味：「在庫表の中に、その製品で<b>在庫数が30より多い行が1つもない</b>製品」の製品番号を、重複なしで取り出す。
reasoning: |
  製品表の各製品について、在庫表に「在庫数＞30」の行があるかを調べます。
  | AB1805：WH101 に 150 → ある → 除外
  | CC5001：WH100 に 200（WH103 に 40）→ ある → 除外
  | MZ1000：在庫表に行がない → ない → <b>結果に含む</b>
  | XZ3000：WH101 に 30、WH102 に 20 → どちらも30を<b>超えない</b>（30は「＞30」を満たさない）→ ない → <b>結果に含む</b>
  | ZZ9900：WH100 に 130 → ある → 除外
  結果は MZ1000 と XZ3000 の<b>2行</b>です。正解は<b>イ</b>です。
choices:
  ア: 1行は、MZ1000（在庫表に行がない製品）だけを数えた値です。XZ3000 の在庫数30は「30より多い」に当たらないので、XZ3000も結果に含まれます。誤り。
  イ: 2行（MZ1000、XZ3000）。在庫数が30を超える在庫が1つもない製品の数と一致します。<b>正解</b>。
  ウ: 3行は、在庫数が30を超える在庫が「ある」製品（AB1805、CC5001、ZZ9900）の数で、NOT EXISTS の意味を逆に取った値です。誤り。
  エ: 4行は、計算結果の2行と一致しません。誤り。
example: |
  「どの倉庫にも30個より多くは置いていない製品」を探すイメージです。在庫がまったくない製品（MZ1000）も、どの倉庫も30個以下の製品（XZ3000）も当てはまります。「30個ちょうど」は「30個より多い」に入らない点に注意しましょう。
review:
  - NOT EXISTS は副問合せの結果が1行もないときに真。外側の表の1行ごとに副問合せを評価する（相関副問合せ）。
  - 「＞30」は30を含まない、在庫表に行がない製品も NOT EXISTS では真になる、の2点に注意する。
