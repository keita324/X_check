q: 14
answer: エ
theme: |
  稼働率（アベイラビリティ）の公式を使い、MTBFとMTTRが同じ倍率で変化したときに稼働率がどうなるかを考える問題です。
basics: |
  <b>MTBF（平均故障間隔）</b>：Mean Time Between Failures。故障が直ってから次に故障するまでの、平均の<b>正常に動いている時間</b>です。
  <b>MTTR（平均修理時間）</b>：Mean Time To Repair。故障してから修理が終わるまでの、平均の<b>止まっている時間</b>です。

  <b>稼働率（アベイラビリティ）</b>：全体の時間のうち、システムが使える時間の割合です。
  | 稼働率 ＝ MTBF ÷ (MTBF ＋ MTTR)
  （動いている時間 ÷ （動いている時間＋止まっている時間））
reasoning: |
  1. 変化前の稼働率を A とします。
  | A ＝ MTBF ÷ (MTBF ＋ MTTR)
  2. MTBF も MTTR も1.5倍になると、
  | 変化後 ＝ 1.5×MTBF ÷ (1.5×MTBF ＋ 1.5×MTTR)
  | ＝ 1.5×MTBF ÷ {1.5×(MTBF ＋ MTTR)}
  | ＝ MTBF ÷ (MTBF ＋ MTTR) ＝ A
  3. 分子と分母が同じ1.5倍になるので、1.5が約分されて消え、稼働率は<b>変わりません</b>。
  4. 数値例：MTBF=90時間、MTTR=10時間なら 90÷100=0.9。1.5倍して MTBF=135、MTTR=15 なら 135÷150=0.9。同じです。
  5. 正解は<b>エ</b>です。
choices:
  ア: 2/3（＝1÷1.5）は、稼働率が下がる場合の値です。稼働率が下がるのは、MTTR（止まっている時間）だけが長くなった場合などです。今回はMTBFも同じ倍率で長くなるので打ち消し合います。誤り。
  イ: 1.5倍になるのは、MTBFだけが増えて分母が変わらないと誤解した場合です。分母にもMTBFとMTTRが含まれます。誤り。
  ウ: 2.25は1.5×1.5で、分子と分母の倍率を掛け合わせてしまった誤りです。誤り。
  エ: 分子・分母が同じ倍率で変化するので、稼働率は変わりません。<b>正解</b>。
example: |
  テストで「100点満点中90点」は90%、「150点満点中135点」も90%です。満点（分母）と得点（分子）が同じ倍率で増えても、割合は変わりません。稼働率も同じで、「動いている時間」と「全体の時間」がともに1.5倍なら割合は同じです。
review:
  - 稼働率 ＝ MTBF ÷ (MTBF ＋ MTTR) を、MTBF・MTTRの意味とともに覚える。
  - 分子・分母が同じ倍率で変われば比率は変わらない（約分で消える）ことを理解する。
  - 稼働率を上げるには「MTBFを長く」または「MTTRを短く」すればよい。
