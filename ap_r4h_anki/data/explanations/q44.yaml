q: 44
answer: ウ
category: セキュリティ
theme: |
  Webサイトの閲覧を、PCではなくDMZに置いたVDIサーバ上のブラウザで行う「Web分離（画面転送型の分離）」が、なぜ未知のマルウェアのダウンロードを防げるのかを問う問題です。
basics: |
  <b>DMZ</b>：社内ネットワークとインターネットの間に設ける緩衝地帯のネットワークです。外部と接するサーバを置きます。
  <b>VDI（仮想デスクトップ基盤）</b>：デスクトップ環境（OSやアプリ）をサーバ上で動かし、利用者のPCには<b>画面の映像だけ</b>を送って表示する仕組みです。PCからのキーボード・マウスの操作はサーバに送られ、処理はすべてサーバ側で行われます。
  <b>未知のマルウェア</b>：まだ知られておらず、ウイルス対策ソフトのパターンで検知できない不正プログラムです。
reasoning: |
  1. VDIでは、Webサイトから受け取ったデータ（HTML、ファイルなど）はすべてVDIサーバ上のブラウザで処理されます。
  2. 利用者のPCに送られるのは、その結果として生成された<b>デスクトップ画面の画像データだけ</b>です。
  3. Webサイトのデータそのものは一切PCに届かないので、マルウェアが仕込まれていても、検知できる・できないに関係なく、PCにダウンロードされることはありません。
  4. 正解は<b>ウ</b>です。
choices:
  ア: IPsecでカプセル化（暗号化）して送っても、Webサイトのデータそのものは暗号化されたままPCに届き、PCで取り出されます。マルウェアがあればPCに入ってしまうので誤り。
  イ: 実行ファイルを削除しても、文書ファイルに埋め込まれたマルウェアやスクリプトなど、実行ファイル以外の形のマルウェアはPCに届いてしまいます。誤り。
  ウ: 受信データはVDIサーバで処理し、PCには生成した画面の画像データだけを送るので、マルウェアを含むデータそのものがPCに届きません。<b>正解</b>。
  エ: 不正なコード列（既知の攻撃パターン）を検知して止める方法では、パターンが知られていない<b>未知の</b>マルウェアは検知できず、PCに届いてしまいます。誤り。
example: |
  危険な荷物かもしれない郵便物を、別の建物（VDIサーバ）で開封してもらい、中身をビデオ通話で映して見せてもらうようなものです。たとえ中に危険物が入っていても、自分の家（PC）には映像しか届かないので安全です。
review:
  - VDI（画面転送）によるWeb分離は、Webのデータをサーバ側で処理し、PCには画面の画像だけを送るので、未知のマルウェアもPCに届かない。
  - パターン検知（エ）は未知のマルウェアに無力、実行ファイル削除（イ）は他形式のマルウェアに無力、暗号化（ア）は中身を無害化しない。
