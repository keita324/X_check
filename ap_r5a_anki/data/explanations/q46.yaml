q: 46
answer: ウ
category: システム開発技術
theme: |
  ソフトウェアのテスト手法のうち、問題を起こしそうなデータを大量に入力して脆弱性を見つける「ファジング」を、限界値分析・実験計画法・ロードテストと区別する問題です。
basics: |
  - <b>ファジング</b>：<b>ファズ</b>と呼ばれる「問題を引き起こしそうなデータ」（極端に長い文字列、想定外の記号、壊れた形式のデータなど）を<b>大量に自動で入力</b>し、異常終了や異常な応答が起きないかを<b>監視</b>して、<b>脆弱性</b>を検出するテスト手法。
  - <b>限界値分析</b>：入力値の有効な範囲の<b>境界付近</b>（例：1〜100が有効なら 0、1、100、101）をテストデータに選ぶ、ブラックボックステストの技法。境界付近は誤りが起きやすいため。
  - <b>実験計画法</b>：複数の条件（因子）の組合せを、直交表などを使って効率よく選び、少ないテスト回数で網羅的に確認する技法。
  - <b>ロードテスト（負荷テスト）</b>：大量のアクセスやデータで負荷をかけ、性能や処理能力が要件を満たすかを確認するテスト。
reasoning: |
  1. 問題文のキーワードは「問題を引き起こす可能性があるデータを大量に入力」「応答や挙動を監視」「脆弱性を検出」です。
  2. これは<b>ファジング</b>の説明です。正解は<b>ウ</b>です。
choices:
  ア: 限界値分析は、有効範囲の境界付近の値をテストデータにする技法で、脆弱性の検出を目的に大量のデータを入力する手法ではありません。誤り。
  イ: 実験計画法は、条件の組合せを効率よく選んでテストケースを減らす技法です。誤り。
  ウ: 問題を引き起こしそうなデータを大量に入力し、挙動を監視して脆弱性を検出するのはファジングです。<b>正解</b>。
  エ: ロードテストは、システムに高い負荷をかけて性能を確認するテストで、脆弱性を検出するためのものではありません。誤り。
example: |
  新しい自動販売機に、外国の硬貨、折れたお札、ボタンの連打など、ありとあらゆる「想定外の使い方」を自動で次々に試し、壊れたりお金が勝手に出てきたりしないかを確かめるのがファジングです。ロードテストは「1時間に1万本売っても止まらないか」を確かめるテストです。
review:
  - ファジング＝問題を起こしそうなデータを大量に入力し、挙動を監視して脆弱性を検出するテスト手法。
  - 限界値分析（境界値）、実験計画法（組合せの効率化）、ロードテスト（負荷による性能確認）と区別する。
