q: 21
answer: ウ
category: ハードウェア
theme: |
  2つのスイッチを直列につないだ回路で、LEDが点灯する条件を論理演算として捉え、正しいタイミングチャート（時間とともに変わる信号の図）を選ぶ問題です。
basics: |
  <b>直列接続</b>：電流の通り道が1本で、途中の部品を順番に通ります。スイッチを2つ直列にすると、<b>両方がオン</b>のときだけ電流が流れます。これは論理演算の<b>AND（論理積）</b>と同じです。
  | Y ＝ A AND B（A＝1 かつ B＝1 のときだけ Y＝1）
  （参考：スイッチを並列にすると、どちらか一方がオンなら電流が流れるので OR になります。）
  <b>タイミングチャート</b>：横軸を時間として、各信号が0か1かを上下の線で表した図です。点線で区切られた各区間ごとに、A・B・Y の値を読み取ります。
reasoning: |
  1. 回路図では、電池 → スイッチA → スイッチB → 抵抗 → LED が一続きにつながっています（直列）。
  2. よって LED が点灯する（Y＝1）のは、A＝1 かつ B＝1 のときだけです。
  3. 各選択肢で、「Yが1の区間」が「AもBも1の区間」と一致しているかを確認します。
  | ア：Aだけ1、Bだけ1の区間でもYが1 → OR の動き
  | イ：AもBも0の区間でYが1 → AND ではない
  | ウ：AとBが両方1の区間だけYが1、それ以外は0 → <b>AND の動き</b>
  | エ：AとBが両方1の区間でYが0、それ以外で1 → NAND（ANDの反転）の動き
  4. 正解は<b>ウ</b>です。
choices:
  ア: AとBのどちらか一方が1のときにもYが1になっており、OR（並列接続）の動きです。直列接続ではAとBが両方1のときだけ点灯するので誤り。
  イ: AもBも0の区間でYが1になっており、スイッチがどちらもオフなのに点灯していることになります。誤り。
  ウ: AとBが両方1の区間だけYが1になっており、直列接続（AND）の動きと一致します。<b>正解</b>。
  エ: AとBが両方1のときにYが0、それ以外で1になっており、ANDを反転したNANDの動きです。誤り。
example: |
  家の玄関に「門の鍵」と「ドアの鍵」の2つがあり、両方開けないと家に入れない、というのが直列（AND）です。どちらか一方の入口から入れる家なら並列（OR）です。
review:
  - スイッチの直列接続＝AND（両方オンで点灯）、並列接続＝OR（どちらかオンで点灯）。
  - タイミングチャートは点線の区間ごとにA・B・Yの値を読み取り、論理演算と一致するかを確認する。
