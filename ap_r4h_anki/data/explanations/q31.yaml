q: 31
answer: イ
category: ネットワーク
theme: |
  次世代のIPアドレス「IPv6」の正しい書き方（表記ルール）を問う問題です。特に「::」による省略のルールがポイントです。
basics: |
  <b>IPv6アドレス</b>：128ビットのアドレスです。IPv4（32ビット）では足りなくなったアドレスを大幅に増やすために作られました。
  <b>表記ルール</b>
  - 128ビットを<b>16ビットずつ8つ</b>に区切り、それぞれを<b>16進数</b>で書いて「<b>:</b>（コロン）」でつなぎます。
  | 例：2001:0db8:0000:0000:0000:0000:03ab:ff01
  - 各区切りの<b>先頭の0は省略</b>できます（0db8→db8、03ab→3ab）。
  - 0だけが連続する区切りは、まとめて「<b>::</b>」に省略できます。ただし、<b>「::」は1つのアドレスの中で1回しか使えません</b>（2回使うと、それぞれ何個の0を省略したのか分からなくなるため）。
  | 上の例 → 2001:db8::3ab:ff01
  IPv4の「.（ピリオド）」区切りとは違う点にも注意します。
reasoning: |
  1. ア「2001:db8::3ab::ff01」は「::」を2回使っています。省略された0の区切りの数が決まらないので不適切です。
  2. イ「2001:db8::3ab:ff01」は「::」が1回だけで、残りは「:」で区切られています。省略を戻すと、2001:db8:0:0:0:0:3ab:ff01 の8区切りになり、正しい表記です。
  3. ウ・エは区切りに「.」を使っており、IPv6の表記ではありません。
  4. 正解は<b>イ</b>です。
choices:
  ア: 「::」を2回使っています。どこに何個の0の区切りがあるのか特定できないため、IPv6の表記として不適切です。誤り。
  イ: 「::」の省略が1回だけで、16進数を「:」で区切った正しいIPv6の表記です。<b>正解</b>。
  ウ: 「db8.3ab」のように区切りに「.」が混ざっています。IPv6は「:」で区切るので不適切です。誤り。
  エ: すべての区切りが「.」で、IPv4のような書き方になっています。IPv6の表記ではありません。誤り。
example: |
  長い電話番号「03-0000-0000-1234」の「0000-0000」を「…」と略すとき、1か所だけなら元の桁数から何個略したか分かります。でも「03-…-12-…-34」と2か所で略すと、それぞれ何桁を略したのか分からなくなります。IPv6の「::」が1回だけというのは、これと同じ理由です。
review:
  - IPv6は16ビットずつ8区切り・16進数・「:」区切り。先頭の0は省略可。
  - 0の連続は「::」で省略できるが、1つのアドレスで1回だけ。
