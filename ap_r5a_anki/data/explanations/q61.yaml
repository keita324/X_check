q: 61
answer: イ
category: システム戦略
theme: |
  未来のありたい姿から逆算して今やるべきことを考える思考方法「バックキャスティング」の説明を選ぶ問題です。
basics: |
  将来を考える方法には、出発点の違う2つのやり方があります。
  - <b>フォアキャスティング</b>：<b>現在</b>の状況や過去のデータから出発し、その延長線上に未来を予測する。「今できることを積み上げると、将来どうなるか」。
  - <b>バックキャスティング</b>：まず<b>未来のありたい姿（目標）</b>を描き、そこから<b>現在に向かって逆算</b>して、目標に近づくために解決すべき課題や、取るべき解決策を考える。前提として受け入れるべき制約（例：資源の限界、環境規制）を踏まえた上で考えるのが特徴。現状の延長では達成できない大きな目標（脱炭素社会など）を考えるときに使われる。
reasoning: |
  1. バックキャスティングの要点は「制約を受け入れた上で、未来のありたい姿を描く」「そこから課題や可能性を洗い出し、解決策を検討する」「ありたい姿に近づける」ことです。
  2. これを述べているのは<b>イ</b>です。
choices:
  ア: 先にプロジェクト要員を確定し、リソースの範囲内で優先すべき機能から順次提供する開発手法は、アジャイル開発のタイムボックス的な進め方の説明で、バックキャスティングではありません。誤り。
  イ: 前提となる制約を受け入れた上で未来のありたい姿を描き、課題や可能性を洗い出して解決策を検討し、ありたい姿に近づける思考方法は、<b>バックキャスティング</b>です。<b>正解</b>。
  ウ: 下位から上位への発議を受け付けて経営の意思決定に反映するのは、<b>ボトムアップ</b>型のマネジメント手法です。誤り。
  エ: 過去のデータを用いて投資戦略の有効性をシミュレーションで検証するのは、<b>バックテスト</b>です。名前が似ていますが別物です。誤り。
example: |
  「10年後に自分の家を建てる」というゴールを先に決め、「そのためには8年後に頭金が必要」「だから毎月○万円貯金する」「今の支出のここを見直す」と、ゴールから逆算して今やることを決めるのがバックキャスティングです。「今の貯金ペースだと10年後にいくらになるか」と考えるのはフォアキャスティングです。
review:
  - バックキャスティング＝未来のありたい姿（制約を前提）から逆算して、今取り組む課題と解決策を考える思考方法。
  - フォアキャスティング（現在からの延長で予測）、ボトムアップ（下からの発議）、バックテスト（過去データでの検証）と区別する。
