q: 33
answer: ウ
theme: |
  「192.168.16.40/29」という表記（CIDR表記）から、サブネットマスク、ホスト部のビット数、使えるIPアドレスの範囲を求める問題です。
basics: |
  <b>IPv4アドレス</b>：32ビットの数で、8ビットずつ4つに区切って10進数で書きます（192.168.16.40）。
  <b>ネットワーク部とホスト部</b>：IPアドレスの前半は「どのネットワークか」（ネットワーク部）、後半は「そのネットワーク内のどの機器か」（ホスト部）を表します。
  <b>/29（プレフィックス長）</b>：先頭から29ビットがネットワーク部、という意味です。残り 32−29＝<b>3ビットがホスト部</b>です。

  <b>使えるホストアドレスの数</b>：ホスト部がnビットなら 2<sup>n</sup> 個のアドレスがありますが、ホスト部が全部0（ネットワークアドレス）と全部1（ブロードキャストアドレス）の2つは機器に割り当てられないので、<b>2<sup>n</sup>−2個</b>です。
reasoning: |
  1. ホスト部のビット数：32 − 29 ＝ <b>3ビット</b>
  2. アドレスの個数：2<sup>3</sup> ＝ 8個。使えるのは 8 − 2 ＝ <b>6個</b>。
  3. サブネットマスク：先頭29ビットが1、残り3ビットが0。最後の8ビットは 11111000（2進数）＝ 128+64+32+16+8 ＝ 248。
  | サブネットマスク ＝ 255.255.255.<b>248</b>
  4. アドレスの範囲：192.168.16.40 から8個分。
  | 192.168.16.40（ネットワークアドレス）
  | 192.168.16.41 〜 .46（ホストに割り当て可能：6個）
  | 192.168.16.47（ブロードキャストアドレス）
  5. 各選択肢と照らし合わせると、正しいのは<b>ウ</b>「使用可能なホストアドレスは最大6個」です。
choices:
  ア: このサブネットは .40〜.47 の範囲です。192.168.16.48 は次のサブネット（.48〜.55）に属するので、同一サブネットではありません。誤り。
  イ: 255.255.255.240 は最後の8ビットが 11110000 で、/28 のサブネットマスクです。/29 なら 255.255.255.248 です。誤り。
  ウ: ホスト部3ビットで 2<sup>3</sup>−2＝6個。<b>正解</b>。
  エ: 29ビットはネットワーク部（プレフィックス）の長さです。ホスト部は 32−29＝3ビットです。誤り。
example: |
  マンションの部屋番号に例えると、/29は「8部屋ある1フロア」です。ただし、1つはフロア全体の名前（ネットワークアドレス）、1つは全館放送用（ブロードキャストアドレス）に使われるので、住人が入れるのは6部屋です。
review:
  - ホスト部のビット数＝32−プレフィックス長。使えるホスト数＝2<sup>ホスト部</sup>−2。
  - /29→255.255.255.248、/28→255.255.255.240 のように、プレフィックス長とサブネットマスクを相互に変換できるようにする。
  - アドレス範囲（.40〜.47）を求めて、ネットワークアドレスとブロードキャストアドレスを特定できるようにする。
