q: 3
answer: ウ
category: 基礎理論
theme: |
  ふつうの書き方（中置記法）の式 A＋B×C を、演算子を後ろに置く「逆ポーランド表記法（後置記法）」に変換する問題です。演算の優先順位がポイントです。
basics: |
  <b>中置記法</b>：A＋B のように、演算子を数の間に置く書き方。
  <b>逆ポーランド表記法（後置記法）</b>：AB＋ のように、演算子を2つの数の<b>後ろ</b>に置く書き方。かっこを使わなくても計算の順序が一意に決まります。

  <b>変換の手順</b>
  1. 演算の優先順位を確認する（×・÷ は ＋・− より先に計算する）。
  2. 先に計算する部分から、「数 数 演算子」の形に直していく。
  <b>計算の確かめ方（スタック）</b>：左から読み、数は積み、演算子が来たら上の2つを取り出して計算し、結果を積む。
reasoning: |
  1. A＋B×C は、掛け算が先なので A＋(B×C) です。
  2. まず B×C を後置記法にすると <b>BC×</b>。
  3. 全体は A と (BC×) の足し算なので、<b>A BC× ＋</b> → <b>ABC×＋</b>。
  4. 確かめ：A,B,C を積む → × で B×C を計算 → ＋ で A＋(B×C)。元の式と一致します。
  5. 正解は<b>ウ</b>です。
choices:
  ア: ＋×CBA は、演算子が先頭にある前置記法のような並びで、逆ポーランド表記法ではありません。誤り。
  イ: ×＋ABC も演算子が先頭に来ており、逆ポーランド表記法ではありません。誤り。
  ウ: ABC×＋ は、B×C を先に計算し、その結果を A に足す、という A＋B×C の正しい後置記法です。<b>正解</b>。
  エ: CBA＋× をスタックで計算すると、B＋A を先に計算してから C を掛ける C×(B＋A) となり、A＋B×C とは異なります。誤り。
example: |
  「りんご1個とみかん3袋（1袋2個）」の数を計算するとき、先に「3×2」をしてから「1＋6」をします。後置記法では「1 3 2 × ＋」と書き、左から順にお皿を積み重ねて計算するだけで、かっこなしでも正しい順序で計算できます。
review:
  - 中置記法→後置記法は、優先順位の高い演算から「数 数 演算子」に直す。A＋B×C → ABC×＋。
  - 変換結果はスタックで計算し直して、元の式と一致するか確かめる。
