q: 67
answer: エ
theme: |
  企業の合併・買収（M&A）で、買収する側が相手企業の実態を詳しく調べる行為「デューデリジェンス」を選ぶ用語問題です。
basics: |
  <b>M&A（Mergers and Acquisitions）</b>：企業の合併と買収のことです。他社を買収して、技術や顧客、販路などを一気に手に入れる経営戦略として使われます。
  <b>デューデリジェンス（Due Diligence：DD）</b>：買収の前に、買い手が対象企業の<b>財務状況（資産・負債）、収益力、法的な問題、事業の実態</b>などを詳しく調査することです。「払うべき（due）注意（diligence）」という意味で、買ってから「こんなはずではなかった」とならないための調査です。
reasoning: |
  1. 問題文の「買収対象企業の経営実態、資産や負債、期待収益性といった企業価値などを買手が詳細に調査する」は、デューデリジェンスの定義そのものです。
  2. 正解は<b>エ</b>です。
choices:
  ア: 株主総会招集請求は、一定の株式を持つ株主が、会社に対して株主総会を開くよう求めることです。調査行為ではありません。誤り。
  イ: 公開買付開始公告は、TOB（株式公開買付け：期間・価格・株数を公表して、市場外で株式を買い集める方法）を始めるときに、その内容を公に知らせる手続です。調査ではありません。誤り。
  ウ: セグメンテーションは、マーケティングで市場を年齢・地域・ニーズなどで細かく分けることです。M&Aの調査とは関係ありません。誤り。
  エ: デューデリジェンスは、買収対象企業の価値やリスクを買手が詳細に調査することです。<b>正解</b>。
example: |
  中古住宅を買う前に、専門家に頼んで、建物の傷み具合、雨漏り、シロアリ、土地の権利関係などを細かく調べてもらう「住宅診断（インスペクション）」に似ています。会社を買うときにこれを行うのがデューデリジェンスです。
review:
  - デューデリジェンス＝M&Aの前に、買手が対象企業の財務・法務・事業の実態や価値を詳細に調査すること。
  - TOB（公開買付け）の公告、株主総会招集請求、セグメンテーション（市場細分化）と区別する。
