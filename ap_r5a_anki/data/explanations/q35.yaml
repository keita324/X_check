q: 35
answer: エ
category: ネットワーク
theme: |
  IPv4で、特定のグループの複数の相手に1回で同じデータを送る「マルチキャスト」が使われる場面を、ブロードキャストやユニキャストの例と区別する問題です。
basics: |
  IPの送り方は、宛先の数で3つに分けられます。
  - <b>ユニキャスト</b>：特定の<b>1台</b>に送る（ふつうの通信）。
  - <b>ブロードキャスト</b>：同じネットワーク内の<b>全員</b>に送る。
  - <b>マルチキャスト</b>：あらかじめ決めた<b>グループに属する複数の相手</b>に、1回の送信で送る。IPv4では 224.0.0.0〜239.255.255.255 のアドレスを使う。
  <b>RIP-2</b>：ルータどうしが経路情報を交換するルーティングプロトコルです。RIP-2では、経路の更新情報を、RIP-2のルータのグループ宛てのマルチキャストアドレス（224.0.0.9）に送ります。
reasoning: |
  各選択肢の通信がどの送り方かを判断します。
  1. ア：DHCPでIPアドレスを取得するとき、PCはまだDHCPサーバの場所を知らないので、<b>ブロードキャスト</b>で呼びかけます。
  2. イ：ARPで、IPアドレスに対応するMACアドレスを問い合わせるリクエストは、<b>ブロードキャスト</b>で送ります。
  3. ウ：メーリングリストのメールは、SMTPで各メンバーのメールサーバへ（または配信サーバへ）送るので、IPとしては<b>ユニキャスト</b>の通信です。
  4. エ：RIP-2で隣接するルータのグループに経路の更新情報を送るのは、<b>マルチキャスト</b>の使用例です。
  5. 正解は<b>エ</b>です。
choices:
  ア: DHCPでIPアドレスを取得する際の要求（DHCPDISCOVERなど）は、ブロードキャストで送信します。マルチキャストではありません。誤り。
  イ: ARPリクエストは、同じネットワーク内の全員に送るブロードキャストです。誤り。
  ウ: メーリングリストの一斉送信は、メールとしては複数人宛てですが、SMTPの通信はサーバ同士の1対1（ユニキャスト）で行われます。誤り。
  エ: ルータがRIP-2で、隣接するルータのグループに経路の更新情報を送る際に、マルチキャストを使用します。<b>正解</b>。
example: |
  校内放送に例えると、全校生徒に流す放送がブロードキャスト、特定の生徒を職員室に呼ぶのがユニキャスト、「吹奏楽部員だけが持っている受信機」に流す連絡がマルチキャストです。RIP-2のルータたちは、この「部員専用の受信機」で経路情報を受け取っています。
review:
  - マルチキャスト＝特定のグループ宛てに1回で送る（例：RIP-2の経路更新、224.0.0.9）。
  - DHCPの要求・ARPリクエストはブロードキャスト、メール（SMTP）はユニキャスト、と区別する。
