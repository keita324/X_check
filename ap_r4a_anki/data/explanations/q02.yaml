q: 2
answer: エ
theme: |
  カルノー図（論理式を表の形で表したもの）を読み取り、同じ働きをする論理式を選ぶ問題です。デジタル回路を簡単にする（部品を減らす）ための基本技術です。
basics: |
  <b>論理変数</b>：0（偽）か1（真）だけを取る変数です。
  <b>論理積「・」（AND）</b>：両方1のときだけ1。<b>論理和「＋」（OR）</b>：どちらかが1なら1。<b>上線（否定、NOT）</b>：0と1を反転。

  <b>カルノー図</b>：入力の全組合せについて、出力が1か0かを表にしたものです。行がABの値、列がCDの値です。
  並び順が 00, 01, 11, 10 となっている点が重要です。隣り合うマスは<b>1つの変数だけ</b>が違うように並べてあります。さらに、表の左端と右端、上端と下端もつながっている（隣どうし）とみなします。

  <b>まとめ方のルール</b>：1のマスを、1・2・4・8個の長方形のかたまりで囲みます。かたまりの中で値が変化しない変数だけが式に残ります。
reasoning: |
  1. 1が入っているマスを確認します。
  | AB=00 の行：CD=00 と CD=10 が1
  | AB=01 の行：CD=01 と CD=11 が1
  | AB=11 の行：CD=01 と CD=11 が1
  2. <b>中央の4マス</b>（AB=01,11 × CD=01,11）をまとめます。この4マスで常に B=1、D=1 です（AとCは0と1の両方がある）。→ <b>B・D</b>
  3. <b>上の行の左端と右端</b>（AB=00、CD=00 と 10）は、左右の端がつながっているので隣どうしです。この2マスで A=0、B=0、D=0 は共通で、Cだけ変化します。→ <b>A̅・B̅・D̅</b>
  4. 2つのかたまりを論理和でつなぎます。
  | A̅・B̅・D̅ ＋ B・D
  5. これは選択肢<b>エ</b>と一致します。
choices:
  ア: 「A・B・C̅・D＋B̅・D̅」。A・B・C̅・D はAB=11、CD=01 の1マスしか表さず、中央の他の1を表せません。またB̅・D̅ はAB=10の行（すべて0）でも1になってしまいます。誤り。
  イ: 「A̅・B̅・C̅・D̅＋B・D」。B・Dは正しいですが、A̅・B̅・C̅・D̅ はAB=00、CD=00の1マスだけで、AB=00、CD=10 の1が抜けます。誤り。
  ウ: 「A・B・D＋B̅・D̅」。A・B・D はAB=11の行の2マスだけでAB=01の行の1が抜け、B̅・D̅ はAB=10の行の0のマスまで1にしてしまいます。誤り。
  エ: 「A̅・B̅・D̅＋B・D」。上の手順で求めた式そのものです。<b>正解</b>。
example: |
  カルノー図は「1が書かれたマス目を、なるべく大きな長方形の付箋で覆う」作業と考えると分かりやすいです。付箋が大きいほど式は短くなります。表は筒のように左右・上下がつながっているので、端と端のマスも同じ付箋で覆えます。
review:
  - カルノー図の並びは 00→01→11→10（隣は1ビット違い）で、左右端・上下端もつながっていることを覚える。
  - かたまりの中で「値が変わらない変数だけを残す」手順で、自分で式を導けるようにする。
  - 選択肢の各項がどのマスを表すかを図に当てはめて、0のマスを含んでいないか検算する。
