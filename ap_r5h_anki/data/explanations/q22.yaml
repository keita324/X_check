q: 22
answer: ア
category: ハードウェア
theme: |
  抵抗とダイオードを使った回路に交流（正負に振れる波）を入力したとき、出力電圧がどんな波形になるかを読み取る問題です。
basics: |
  <b>ダイオード</b>：電流を一方向（順方向：三角形の頂点の向き）にだけ流し、逆方向には流さない部品です。問題文の条件では、順方向に電流が流れるときの電圧降下（順電圧）は0Vとします。
  <b>回路図の読み方</b>（図2）
  - 入力は抵抗を通って出力につながっている。
  - 出力の線とアース（0V）の間に、ダイオードが入っている。ダイオードの向きは、<b>アース側から出力の線側へ</b>電流が流れる向き（アノードがアース、カソードが出力側）。
reasoning: |
  入力電圧が正のときと負のときに分けて考えます。
  1. <b>入力が正（プラス）のとき</b>：ダイオードには逆方向の電圧がかかるので電流は流れません。出力には抵抗を通して入力電圧がそのまま現れます（出力側に電流は流れない前提）。→ <b>出力＝入力と同じ正の波形</b>
  2. <b>入力が負（マイナス）のとき</b>：アース（0V）の方が出力の線より電圧が高くなるので、ダイオードの順方向に電流が流れ、出力の線はダイオードを通してアースとつながります。順電圧0Vなので、<b>出力は0V</b>に抑えられます（電圧の差は抵抗にかかる）。
  3. したがって、正の半波はそのまま出て、負の半波は0Vに切り取られた波形になります。
  4. これは<b>ア</b>の波形です。
choices:
  ア: 正の部分はそのまま、負の部分は0Vになった波形です。上の分析と一致します。<b>正解</b>。
  イ: 負の部分だけが残り、正の部分が0Vになった波形です。ダイオードの向きが逆なら、この波形になります。誤り。
  ウ: 全体が0V以上に持ち上げられた（正の方向にずらされた）ような波形で、この回路の動作ではありません。誤り。
  エ: 負の部分が正に折り返された波形（全波整流）で、ダイオード4個のブリッジ回路などで得られます。この回路はダイオード1個で負の部分を0Vにするだけなので誤り。
example: |
  水路に「逆流防止弁つきの排水口」があるイメージです。水位（電圧）がプラスのときは弁が閉じたままで水位はそのまま、マイナスになろうとすると弁が開いて地面（0V）とつながり、それ以上下がりません。結果として、マイナス側だけが平らに切り取られます。
review:
  - ダイオードは順方向だけ電流を通す。回路図で向き（アノード→カソード）を確認し、入力が正のとき・負のときに分けて考える。
  - 出力とアースの間のダイオードが導通すると、出力は0V（順電圧）に抑えられる。
