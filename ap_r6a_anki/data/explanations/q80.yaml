q: 80
answer: ウ
category: 法務
theme: |
  デジタル社会形成基本法の基本理念に含まれる内容を、プロバイダ責任制限法・特定電子メール法・特定商取引法の目的と区別する問題です。
basics: |
  <b>デジタル社会形成基本法</b>（2021年施行）：デジタル社会の形成について、基本理念や国・自治体・事業者の責務などを定めた法律です。デジタル庁の設置もこの流れの中で行われました（IT基本法の後継）。
  基本理念には、例えば次のような内容が含まれます。
  - 全ての国民が<b>情報通信技術の恵沢を享受</b>できる社会の実現
  - 信頼性のある情報の<b>自由かつ安全な流通</b>の確保
  - 経済の持続的・健全な発展、国民の安全で安心な暮らし
  - 利用の機会等の格差の是正、個人・法人の権利利益の保護
  ほかの法律の目的
  - <b>プロバイダ責任制限法</b>（現 情報流通プラットフォーム対処法）：権利侵害があった場合のプロバイダ等の損害賠償責任の制限と、<b>発信者情報の開示請求</b>。
  - <b>特定電子メール法</b>：広告宣伝メール（迷惑メール）の送信の適正化。
  - <b>特定商取引法</b>：通信販売や訪問販売などの取引を公正にし、購入者の利益を守る。
reasoning: |
  1. ア：プロバイダ等の責任の制限と発信者情報の開示請求 → プロバイダ責任制限法 → ×。
  2. イ：広告宣伝メールの適正化 → 特定電子メール法 → ×。
  3. ウ：全ての国民が情報通信技術の恵みを享受できる社会、信頼性のある情報の自由かつ安全な流通の確保 → <b>デジタル社会形成基本法の基本理念</b> → ○。
  4. エ：通信販売などの取引の公正と購入者の利益保護 → 特定商取引法 → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: インターネット上の権利侵害についてプロバイダ等の責任範囲を制限し、発信者情報の開示請求権を定めるのは、プロバイダ責任制限法の内容です。誤り。
  イ: 広告宣伝目的の電子メールの適正化を図り、電子メールの利用環境を整備するのは、特定電子メール法の目的です。誤り。
  ウ: 全ての国民が情報通信技術の恵沢を享受できる社会の実現を目指し、信頼性のある情報の自由かつ安全な流通の確保を図ることは、<b>デジタル社会形成基本法</b>の基本理念に含まれています。<b>正解</b>。
  エ: 通信販売などの取引を公正にし、購入者等の損害の防止と利益の保護を図るのは、特定商取引法の目的です。誤り。
example: |
  高齢者でもスマホで行政手続きができるように支援したり、マイナンバーカードで本人確認を安全に行えるようにしたりする取組みは、「誰もがデジタル技術の恵みを受けられ、情報が安全に流通する社会」というデジタル社会形成基本法の理念に沿ったものです。
review:
  - デジタル社会形成基本法の基本理念＝全国民がICTの恵沢を享受、信頼性ある情報の自由かつ安全な流通の確保など。
  - 発信者情報開示＝プロバイダ責任制限法、迷惑メール＝特定電子メール法、通信販売＝特定商取引法。
