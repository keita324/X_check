q: 41
answer: イ
theme: |
  リスクマネジメントの国際規格（JIS Q 31000）で、「リスクアセスメント」がどの3つのプロセスで構成されるかを問う知識問題です。
basics: |
  <b>リスク</b>：起こるかもしれない「好ましくないこと」（目的に対する不確かさの影響）。例：サーバ故障、情報漏えい、地震。
  <b>リスクマネジメント</b>：リスクを洗い出し、どれだけ危ないかを見積もり、対策を決めて実行・監視する一連の活動です。

  JIS Q 31000では、リスクマネジメントのプロセスを次のように整理しています。
  | リスクアセスメント ＝ ①リスク特定 → ②リスク分析 → ③リスク評価
  | その後に → リスク対応（低減・回避・移転・受容など）
  - <b>リスク特定</b>：どんなリスクがあるかを洗い出す。
  - <b>リスク分析</b>：起こりやすさ（発生確率）と、起きたときの影響の大きさを調べ、リスクの大きさ（レベル）を決める。
  - <b>リスク評価</b>：分析結果を基準と比べ、対応が必要か、どれを優先するかを決める。
reasoning: |
  1. リスクアセスメントは「特定・分析・評価」の3つです（覚え方：<b>とく・ぶん・ひょう</b>）。
  2. 「リスク対応」や「リスク受容」は、アセスメントの<b>後</b>に行う「リスク対応」のプロセスに属します。
  3. 3つすべてがアセスメントの要素になっている選択肢は<b>イ</b>だけです。
choices:
  ア: リスク特定・リスク評価は含まれますが、「リスク受容」はリスク対応の選択肢の1つで、アセスメントには含まれません。また「リスク分析」が抜けています。誤り。
  イ: リスク特定・リスク分析・リスク評価。リスクアセスメントを構成する3つのプロセスそのものです。<b>正解</b>。
  ウ: 「リスク対応」「リスク受容」はアセスメントの後の段階です。「特定」「評価」も抜けています。誤り。
  エ: 「リスク対応」がアセスメントの後の段階であり、「リスク特定」が抜けています。誤り。
example: |
  健康診断に例えると、
  - リスク特定：検査項目を洗い出して、異常のある箇所を見つける。
  - リスク分析：その異常がどれくらい進行しそうか、重いかを調べる。
  - リスク評価：基準値と比べて「要治療」「経過観察」を判定する。
  ここまでが「アセスメント（診断）」。その後の「治療する・様子を見る」がリスク対応にあたります。
review:
  - リスクアセスメント＝リスク特定・リスク分析・リスク評価（この順番）。
  - リスク対応（低減・回避・移転・受容）はアセスメントの後の別プロセスであることを区別する。
