q: 61
answer: エ
theme: |
  災害や事故に備える「BCP（事業継続計画）」の説明を、BSC・BPM・BPOという似た略語の経営手法と区別する問題です。
basics: |
  <b>BCP（Business Continuity Plan：事業継続計画）</b>：地震、火災、感染症の流行、システム障害、サイバー攻撃などで事業が中断・阻害されたときに、重要な業務をできるだけ早く復旧・再開し、<b>あらかじめ決めたレベルまで回復させる</b>ための手順をまとめた計画書です。
  BCPでは、「どの業務を優先して復旧するか」「何時間以内に、どのレベルまで戻すか（目標復旧時間・目標復旧レベル）」などを事前に決めておきます。

  紛らわしい略語
  - <b>BSC（バランススコアカード）</b>：財務・顧客・内部ビジネスプロセス・学習と成長の4つの視点で戦略を管理する手法。
  - <b>BPM（ビジネスプロセスマネジメント）</b>：業務プロセスを可視化し、PDCAサイクルで継続的に改善する手法。
  - <b>BPO（ビジネスプロセスアウトソーシング）</b>：業務プロセスの一部（経理、コールセンターなど）を外部の専門業者に委託すること。
reasoning: |
  1. BCPのキーワードは「事業の中断・阻害に対応」「復旧・再開」「あらかじめ定めたレベルに回復」「手順の文書化」です。
  2. これらがすべて含まれているのは<b>エ</b>です。
  3. ア・イ・ウは、それぞれBSC・BPM・BPOの説明です。
choices:
  ア: 財務、顧客、内部ビジネスプロセス、学習と成長の4つの視点から戦略を検討するのは<b>BSC（バランススコアカード）</b>です。誤り。
  イ: 業務内容や業務の流れを可視化し、一定のサイクルで継続的に業務プロセスを改善するのは<b>BPM（ビジネスプロセスマネジメント）</b>です。誤り。
  ウ: 業務効率の向上やコスト削減のために業務プロセスを外部に委託するのは<b>BPO（ビジネスプロセスアウトソーシング）</b>です。誤り。
  エ: 事業の中断・阻害に対応し、事業を復旧・再開し、あらかじめ定めたレベルに回復するよう組織を導く手順を文書化したもの。<b>BCP</b>の説明です。<b>正解</b>。
example: |
  大地震で本社が使えなくなったとき、「受注業務は48時間以内に大阪支社で再開する」「データはクラウドのバックアップから復元する」「社員の安否確認はこのアプリで行う」と、あらかじめ決めて文書にしておくのがBCPです。
review:
  - BCP＝事業が中断したときに、重要業務を目標の時間・レベルまで復旧・継続させる計画（手順の文書化）。
  - BSC（4つの視点の戦略管理）、BPM（業務プロセスの継続的改善）、BPO（業務の外部委託）と略語を区別する。
