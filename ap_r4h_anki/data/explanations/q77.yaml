q: 77
answer: エ
category: 法務
theme: |
  プログラムの作成を外部に委託したとき、契約で何も決めていなければ、プログラムの著作権が最初に誰のものになるか（原始的帰属）を問う問題です。
basics: |
  <b>著作権</b>：プログラムは著作物として著作権法で保護されます。著作権は、契約や登録の手続をしなくても、<b>著作物を創作した時点で、創作した人（著作者）に自動的に発生</b>します。
  <b>原始的帰属</b>：著作権が「最初に」誰のものになるか、という意味です。
  <b>委託開発の場合</b>：お金を払って作ってもらう発注者（委託元）ではなく、<b>実際にプログラムを作成した受託者</b>に著作権が発生します。
  - 受託者の社員が仕事として作った場合は、職務著作（法人著作）として受託者の会社が著作者になります。
  - 発注者が著作権を持ちたいときは、契約で「著作権を譲渡する」と取り決める必要があります。
reasoning: |
  1. A社は要求仕様を示してB社に委託しただけで、プログラムを実際に作成したのはB社です。
  2. 著作権の帰属について特段の取決めがないので、著作権は創作したB社に原始的に帰属します。
  3. 正解は<b>エ</b>です。
choices:
  ア: 著作権は創作と同時に法律に基づいて発生するので、後から話し合って原始的な帰属先を決めるものではありません（譲渡の取決めは可能ですが、それは原始的帰属ではありません）。誤り。
  イ: 要求仕様を示しただけでは、A社は創作に関わったことにならず、共有にはなりません。誤り。
  ウ: 発注者であるA社は、お金を払って委託しただけでは著作権を得られません。誤り。
  エ: 実際にプログラムを作成したB社に、著作権が原始的に帰属します。<b>正解</b>。
example: |
  イラストレーターに似顔絵を描いてもらい、料金を払っても、特に契約で決めていなければ、その絵の著作権は描いたイラストレーターにあります。依頼者は絵（作品そのもの）を受け取れますが、勝手にグッズにして売るには、著作権の譲渡や利用許諾を受ける必要があります。
review:
  - 委託開発のプログラムの著作権は、特段の取決めがなければ実際に作成した受託者に原始的に帰属する。
  - 発注者が著作権を得るには、契約で著作権の譲渡を定める必要がある。要求仕様を示しただけでは著作者にならない。
