q: 2
answer: ア
category: 基礎理論
theme: |
  平均と標準偏差という2つの数値から、正規分布のグラフの形（中心の位置・左右対称性・広がり）を読み取る問題です。
basics: |
  <b>正規分布</b>：身長やテストの点数など、多くのデータが従う分布です。次の特徴があります。
  - 平均の位置に山の頂点があり、<b>左右対称</b>の釣鐘型になる。
  - 山は<b>1つ</b>だけ（2つの山はない）。
  <b>平均</b>：データの中心の位置。
  <b>標準偏差</b>：データの散らばり具合。大きいほど山は低く横に広がり、小さいほど高く細くなります。正規分布では、<b>平均から標準偏差1つ分離れた位置</b>で、曲線の曲がり方が変わります（変曲点）。

  平均±1標準偏差の範囲に、全体の約68%のデータが入ります。
reasoning: |
  1. 平均60 → 山の頂点（中心線）が60にあること。
  2. 正規分布 → 左右対称で、山が1つであること。
  3. 標準偏差10 → 中心60から10離れた70（と50）の位置が、曲線の曲がり方が変わる位置として示されていること。
  4. この3つを満たすのは<b>ア</b>です（中心60、60〜70の幅が10）。
choices:
  ア: 中心が60で左右対称の山が1つ、60から70までの幅10が標準偏差として示されています。平均60・標準偏差10の正規分布です。<b>正解</b>。
  イ: 中心は60ですが、55〜65の幅（中心から5）が示されており、標準偏差5の、より細い山です。誤り。
  ウ: 山が10と60の2か所にある（二峰性）ので、正規分布ではありません。誤り。
  エ: 山が左右非対称（左側にすそが長い）で、正規分布ではありません。また50〜60の幅が示されているだけで、対称な形になっていません。誤り。
example: |
  あるクラスのテストの平均点が60点、標準偏差が10点で正規分布しているとすると、50〜70点の間に約68%の生徒がいる、という釣鐘型のグラフになります。標準偏差が5点なら、点数がもっと平均付近に集まり、山は細く高くなります。
review:
  - 正規分布の特徴：平均の位置に頂点、左右対称、山は1つ。
  - 標準偏差は「平均から変曲点までの距離」。大きいほど山が低く広い、小さいほど高く細い。
