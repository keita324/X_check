q: 43
answer: エ
category: セキュリティ
theme: |
  カフェや駅などの公衆無線LANのアクセスポイントで行うセキュリティ対策と、その効果の組合せとして正しいものを選ぶ問題です。対策が本当にその効果を生むかを1つずつ検討します。
basics: |
  <b>アクセスポイント</b>：スマホやPCが無線でつながる親機です。<b>SSID</b>はアクセスポイントの名前（ネットワーク名）です。
  - <b>MACアドレスフィルタリング</b>：登録されたMACアドレス（機器固有の番号）の端末だけ接続を許可する。ただし、MACアドレスは無線の通信から簡単に読み取れ、<b>偽装も容易</b>。
  - <b>SSIDの秘匿（ステルス）</b>：SSIDを周囲に知らせないようにする。ただし、接続時のやり取りからSSIDは分かってしまう。
  - <b>悪意のあるアクセスポイント（なりすましAP、イービルツイン）</b>：正規のものと同じSSIDを名乗る偽のアクセスポイント。SSIDは誰でも自由に設定できる。
  - <b>端末間通信の遮断（プライバシーセパレーター）</b>：同じアクセスポイントにつながった端末同士の通信を遮断する機能。
reasoning: |
  各組合せで、対策が本当にその効果を生むかを確認します。
  1. ア：MACアドレスフィルタリングは、正規の端末のMACアドレスに<b>偽装</b>されると通してしまうので、偽装した攻撃者の接続は遮断できません → ×。
  2. イ：SSIDは暗号化するものではなく、秘匿しても接続時の通信などから知られてしまうので、盗聴を防ぐ効果はありません → ×。
  3. ウ：SSIDは誰でも自由に設定できるので、ドメイン名をSSIDにしても、同じSSIDの偽アクセスポイントの設置は防げません → ×。
  4. エ：同じアクセスポイントに接続している端末同士の通信を遮断すれば、他の利用者の端末へアクセスされることを防げます → ○。
  5. 正解は<b>エ</b>です。
choices:
  ア: MACアドレスは通信から読み取って簡単に偽装できるため、MACアドレスフィルタリングでは、正規の端末に偽装した攻撃者の接続を遮断できません。誤り。
  イ: SSIDを秘匿しても、接続する端末とのやり取りからSSIDは分かってしまうため、盗聴を防ぐ効果はありません（そもそもSSIDは暗号化の対象ではありません）。誤り。
  ウ: SSIDは誰でも任意に設定できるため、ドメイン名をSSIDにしても、同じSSIDを設定した悪意のあるアクセスポイントの設置は防げません。誤り。
  エ: アクセスポイント経由の端末同士の通信を遮断すれば、同じ公衆無線LANを使う他人の端末へのアクセスを防止できます。<b>正解</b>。
example: |
  カフェのWi-Fiで、隣の席の見知らぬ人のノートPCから自分のスマホに直接アクセスされたら困ります。端末間の通信を遮断する設定は、「同じ店にいても、お客さん同士の電話はつながず、外線（インターネット）にだけつなぐ交換台」のようなものです。
review:
  - 公衆無線LANでは、端末間通信の遮断（プライバシーセパレーター）で利用者同士の不正アクセスを防ぐ。
  - MACアドレスは偽装可能、SSIDの秘匿は盗聴対策にならない、SSIDの名前で偽アクセスポイントは防げない、という限界を理解する。
