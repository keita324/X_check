q: 27
answer: ア
category: データベース
theme: |
  データベースの構造を3つの階層で捉える「ANSI/SPARC 3層スキーマ」のうち、内部スキーマ（物理的な格納方法）の設計に含まれる作業を選ぶ問題です。
basics: |
  <b>スキーマ</b>：データベースの構造の定義（設計図）です。ANSI/SPARCは、これを3つの層に分けて考えます。
  - <b>外部スキーマ</b>：利用者やアプリケーションから見たデータの見え方（ビューなど）。
  - <b>概念スキーマ</b>：組織全体のデータの論理的な構造。表、項目、主キー・外部キー、制約、正規化、E-Rモデルなど。
  - <b>内部スキーマ</b>：データを<b>ディスク上にどう格納するか</b>という物理的な構造。ファイルの配置、レコードの格納方式、<b>インデックス</b>（索引）などで、主に性能に関わります。
  3層に分けることで、物理的な格納方法を変えても、利用者側のプログラムを変えずに済みます（データ独立性）。
reasoning: |
  1. 各選択肢が「論理的な構造（概念スキーマ）」か「物理的な格納（内部スキーマ）」かを分類します。
  2. ア インデックスの定義：検索を速くするための物理的な索引 → <b>内部スキーマ</b>
  3. イ E-Rモデルの作成：データ同士の関係の論理的な表現 → 概念スキーマ（概念設計）
  4. ウ 一意性制約・参照制約の設定：データの論理的なルール → 概念スキーマ
  5. エ 正規化：表の論理的な構造を整理する作業 → 概念スキーマ
  6. 正解は<b>ア</b>です。
choices:
  ア: SQL問合せの応答時間を短くするためのインデックスの定義は、物理的なデータ格納方法の設計なので<b>内部スキーマ</b>に含まれます。<b>正解</b>。
  イ: エンティティ間の関連（1対多、多対多など）を表すE-Rモデルの作成は、データの論理構造を決める<b>概念スキーマ</b>（概念設計）の作業です。誤り。
  ウ: 一意性制約や参照制約の設定は、データの整合性を保つ論理的なルールで、<b>概念スキーマ</b>の設計に含まれます。誤り。
  エ: データの冗長性を除く正規化は、表の論理構造を整える<b>概念スキーマ</b>の設計作業です。誤り。
example: |
  図書館に例えると、外部スキーマは「利用者が見る検索画面」、概念スキーマは「本・著者・貸出をどう分類し関係づけるかのルール」、内部スキーマは「本棚の配置や索引カードの作り方」です。索引カード（インデックス）を増やすと本が早く見つかりますが、分類のルール自体は変わりません。
review:
  - 内部スキーマ＝物理的な格納構造（インデックス、ファイル編成など、性能に関わる設計）。
  - 概念スキーマ＝論理構造（E-Rモデル、正規化、一意性制約・参照制約）、外部スキーマ＝利用者から見たビュー。
