q: 43
answer: ア
category: セキュリティ
theme: |
  データを勝手に暗号化して身代金を要求する「ランサムウェア」の被害を減らすのに効果があるバックアップの方法を選ぶ問題です。
basics: |
  <b>ランサムウェア</b>：感染したPCや、そのPCからアクセスできるストレージのデータを<b>暗号化</b>して使えなくし、元に戻すことと引き換えに金銭（身代金）を要求するマルウェアです。
  対策の基本は、<b>ランサムウェアに書き換えられないバックアップ</b>を持っておくことです。感染したPCから普通に書き込める場所にあるバックアップは、一緒に暗号化されてしまいます。
  <b>WORM（Write Once Read Many）</b>：一度書き込んだデータは、決められた期間、<b>変更も削除もできない</b>（何度でも読める）ストレージの機能です。
  <b>RAID5</b>：ディスクの<b>故障</b>に備える仕組みで、データを書き換えるランサムウェアに対しては、暗号化されたデータがそのまま冗長化されるだけです。
  <b>レプリケーション</b>：データを別の場所に常に複製すること。暗号化されたデータも即座に複製されてしまいます。
reasoning: |
  1. WORM機能をもつストレージにバックアップすれば、ランサムウェアが感染してもバックアップを書き換え（暗号化）できないので、そこから元のデータを復元できます。
  2. RAID5、常時レプリケーション、ネットワークドライブとして割り当てた共有フォルダは、いずれも感染したPCから書き換えられる、または暗号化された内容がそのまま反映されてしまいます。
  3. 正解は<b>ア</b>です。
choices:
  ア: WORM機能のストレージにバックアップすれば、書き込んだデータを変更・削除できないため、ランサムウェアによる暗号化を受けず、被害を低減できます。<b>正解</b>。
  イ: RAID5はディスクの故障に備える仕組みで、ランサムウェアがデータを暗号化すれば、その暗号化されたデータが冗長化されるだけです。被害の低減には効果がありません。誤り。
  ウ: 常時レプリケーションでは、ランサムウェアに暗号化されたデータも即座に複製先へ反映されるため、効果がありません。誤り。
  エ: ネットワークドライブとして割り当てた共有フォルダは、感染したPCから普通にアクセスでき、ランサムウェアに暗号化される対象になります。誤り。
example: |
  大事な書類のコピーを、自分の机の引き出し（いつでも書き換えられる場所）ではなく、一度入れたら決められた期間は誰も中身を変えられない金庫（WORM）に保管しておくようなものです。たとえ机の書類がいたずらで塗りつぶされても、金庫のコピーから元に戻せます。
review:
  - ランサムウェア対策のバックアップは、感染したPCから書き換えられない場所（WORM、オフライン、世代管理）に取る。
  - RAID（故障対策）、常時レプリケーション、ネットワークドライブは、暗号化されたデータも反映・対象となるため効果がない。
