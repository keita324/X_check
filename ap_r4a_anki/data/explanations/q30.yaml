q: 30
answer: イ
theme: |
  データベースのトランザクションが満たすべき4つの性質「ACID特性」を問う問題です。含まれない（仲間外れの）ものを選びます。
basics: |
  <b>トランザクション</b>：「口座Aから1万円引く」と「口座Bに1万円足す」のように、まとめて実行しなければ意味をなさない一連の処理です。
  データベースは、トランザクションを安全に処理するために次の4つの性質を保証します。頭文字をとって<b>ACID（アシッド）特性</b>と呼びます。
  - <b>A：Atomicity（原子性）</b>：全部実行されるか、全く実行されないかのどちらか。途中で止まった中途半端な状態を残さない。
  - <b>C：Consistency（一貫性）</b>：処理の前後でデータの整合性（ルール）が保たれる。例：振込の前後で2口座の合計金額は変わらない。
  - <b>I：Isolation（独立性・隔離性）</b>：同時に複数のトランザクションが動いても、互いに影響しない（順番に実行したのと同じ結果になる）。
  - <b>D：Durability（耐久性・永続性）</b>：コミット（確定）した結果は、障害が起きても失われない。
reasoning: |
  1. ACIDの4つは「原子性・一貫性・独立性・耐久性」です。
  2. 選択肢のうち、ア一貫性（C）、ウ原子性（A）、エ耐久性（D）はACIDに含まれます。
  3. イ「可用性」（Availability：システムを使いたいときに使える度合い）は、ACIDではなく情報セキュリティの3要素（機密性・完全性・可用性）やRASISなどで使われる言葉です。
  4. よって、含まれないのは<b>イ</b>です。
choices:
  ア: 一貫性（Consistency）はACIDの「C」です。含まれます。
  イ: 可用性（Availability）はACID特性には含まれません。情報セキュリティの3要素（CIA：機密性・完全性・可用性）の1つです。<b>正解</b>。
  ウ: 原子性（Atomicity）はACIDの「A」です。含まれます。
  エ: 耐久性（Durability）はACIDの「D」です。含まれます。
example: |
  銀行振込で考えると、
  - 原子性：「引き落とし」だけ成功して「入金」が失敗、という状態は許されない。
  - 一貫性：振込の前後で、お金の総額が勝手に増えたり減ったりしない。
  - 独立性：同じ口座に同時に2件の振込が来ても、残高計算が混ざらない。
  - 耐久性：「振込完了」と表示された後に停電しても、振込は取り消されない。
review:
  - ACID＝原子性（Atomicity）・一貫性（Consistency）・独立性（Isolation）・耐久性（Durability）を英語と日本語でセットで覚える。
  - 可用性（Availability）はセキュリティのCIA（機密性・完全性・可用性）の仲間で、ACIDには含まれない。
