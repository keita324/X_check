q: 51
answer: エ
category: プロジェクトマネジメント
theme: |
  プロジェクトの進み具合とお金の使い方を金額で管理する「アーンドバリューマネジメント（EVM）」で、今のコスト効率が続いた場合の完成時総コスト見積り（EAC）を計算する問題です。
basics: |
  <b>アーンドバリューマネジメント（EVM）</b>では、次の金額を使って進捗とコストを管理します。
  - <b>BAC（完成時総予算）</b>：プロジェクト全体の予算。ここでは100万円。
  - <b>PV（プランドバリュー）</b>：今の時点までに<b>終わっている予定だった</b>作業の予算額。50万円。
  - <b>EV（アーンドバリュー）</b>：今の時点までに<b>実際に終わった</b>作業の予算額（出来高）。40万円。
  - <b>AC（実コスト）</b>：今の時点までに<b>実際に使ったお金</b>。60万円。

  <b>CPI（コスト効率指数）</b>：使ったお金に対して、どれだけの作業価値を生み出せたか。
  | CPI ＝ EV ÷ AC（1より小さいと予算超過のペース）
  <b>EAC（完成時総コスト見積り）</b>：今のコスト効率が続くと仮定した、最終的な総コストの予測。
  | EAC ＝ BAC ÷ CPI
reasoning: |
  1. コスト効率指数を求めます。
  | CPI ＝ EV ÷ AC ＝ 40 ÷ 60 ＝ 2/3（≒0.67）
  40万円分の作業をするのに60万円かかっている、つまり予算の1.5倍のペースでお金を使っています。
  2. この効率が続くとして、完成時の総コストを求めます。
  | EAC ＝ BAC ÷ CPI ＝ 100 ÷ (2/3) ＝ 100 × 3/2 ＝ <b>150万円</b>
  3. 別の求め方（検算）：残りの作業 BAC−EV ＝ 60万円分を、同じ効率（1.5倍）で行うと 90万円かかるので、
  | EAC ＝ AC ＋ (BAC − EV) ÷ CPI ＝ 60 ＋ 60 × 1.5 ＝ 150万円
  4. 正解は<b>エ</b>です。
choices:
  ア: 110万円は、実コスト60万円に、残りの「予定」作業分（BAC−PV＝50万円）を足した値です。コスト効率の悪化を反映していません。誤り。
  イ: 120万円は、実コスト60万円に、残りの作業分（BAC−EV＝60万円）を予算どおりの効率で行うとした値です。「今のコスト効率が今後も続く」という条件を反映していません。誤り。
  ウ: 135万円は、計算結果の150万円と一致しません。誤り。
  エ: 150万円。今のコスト効率（CPI＝2/3）が続くとした完成時総コストで、計算結果と一致します。<b>正解</b>。
example: |
  100万円の予算で家をリフォームしている途中、全体の4割（40万円分）の工事が終わったところで、すでに60万円払っているとします。このペースが続けば、全部終わるころには 60万円 ÷ 0.4 ＝ 150万円 かかる見込みです。
review:
  - CPI＝EV÷AC、EAC＝BAC÷CPI（今のコスト効率が続く場合）。
  - PV（予定の出来高）、EV（実際の出来高）、AC（実際の支出）の意味を区別する。
  - 「今後は予算どおり」と仮定する場合は EAC＝AC＋(BAC−EV)（＝120万円）になるので、問題の前提を確認する。
