q: 60
answer: イ
category: システム監査
theme: |
  金融庁の「財務報告に係る内部統制の評価及び監査に関する実施基準」で示される「ITへの対応」について、正しい記述を選ぶ問題です。
basics: |
  <b>内部統制</b>：会社の業務が適正に行われ、財務報告（決算書など）が信頼できるものになるように、社内に作る仕組みです。
  内部統制の基本的要素の一つが<b>ITへの対応</b>で、次のように整理されています。
  - <b>IT環境への対応</b>：組織を取り巻くIT環境（社会や市場でのITの浸透度、組織が利用するITの状況、外部委託の状況など）を理解し、適切に対応すること。<b>企業内部に限らず</b>、外部も含めたIT環境が対象です。
  - <b>ITの利用及び統制</b>：ITの統制は、<b>IT全般統制</b>と<b>IT業務処理統制</b>から成る。
  | IT全般統制：システムの開発・保守、運用管理、アクセス管理、外部委託管理など、業務処理統制が有効に働く環境を保証する統制
  | IT業務処理統制：個々の業務システムで、入力データの網羅性・正確性のチェック、例外処理の管理など、業務処理が正しく行われるようにする統制
  ITを使えば統制活動を自動化できますが、IT全般統制が有効でなければ、その自動化された統制も有効とはいえません。また、ITを使わず手作業で行っていても、統制が有効なら不備ではありません。
reasoning: |
  1. ア：IT環境は、企業内部に限らず、社会や市場、外部委託先なども含めた環境です → ×。
  2. イ：ITの統制は、IT全般統制とIT業務処理統制から成る → ○。
  3. ウ：自動化しただけで有効と評価されるわけではなく、IT全般統制の有効性などを含めて評価します → ×。
  4. エ：手作業だけで運用していても、統制が有効に機能していれば、直ちに不備とはなりません → ×。
  5. 正解は<b>イ</b>です。
choices:
  ア: IT環境とは、組織が活動する上で必然的に関わる内外のITの利用状況のことで、企業内部に限られた範囲ではありません。誤り。
  イ: ITの統制は、IT全般統制とIT業務処理統制から成ります。<b>正解</b>。
  ウ: 統制活動をITで自動化していても、その前提となるIT全般統制などが有効でなければ、有効とは評価されません。自動化しただけで有効と評価されるわけではないので誤り。
  エ: ITを利用せず手作業だけで内部統制を運用していても、それが有効に機能していれば、直ちに不備とはなりません。誤り。
example: |
  お店のレジで考えると、「レジのソフトの更新はテストしてから行う」「レジにログインできる人を限定する」がIT全般統制、「金額欄に数字以外は入力できない」「値引きには店長の承認が必要」というレジ自体のチェック機能がIT業務処理統制です。レジ自体のチェックが優れていても、誰でもソフトを書き換えられるなら信頼できません。
review:
  - ITの統制＝IT全般統制（開発・運用・アクセス管理など環境側）＋IT業務処理統制（個々の業務システム内のチェック）。
  - IT環境は企業内外を含む。自動化＝即有効ではなく、手作業＝即不備でもない。
