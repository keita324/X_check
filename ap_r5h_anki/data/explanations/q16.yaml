q: 16
answer: エ
category: システム構成要素
theme: |
  直列・並列を組み合わせた2つのシステムA、Bの稼働率を式で表し、どちらが常に高いかを比べる問題です。
basics: |
  <b>稼働率</b>：装置が正常に動いている確率です（0より大きく1より小さい）。X、Y、Zの稼働率を x、y、z とします。
  - <b>直列接続</b>：すべてが動かないとシステムが動かない。稼働率は掛け算。
  | 直列（PとQ）の稼働率 ＝ p × q
  - <b>並列接続</b>：どちらか一方が動けばよい。「両方とも止まる確率」を1から引く。
  | 並列（PとQ）の稼働率 ＝ 1 − (1 − p)(1 − q) ＝ p ＋ q − pq
reasoning: |
  <b>システムA</b>：XとYの並列部分に、Zを直列につないだ構成
  | A ＝ (x ＋ y − xy) × z ＝ xz ＋ yz − xyz
  <b>システムB</b>：XとZの直列部分に、Yを並列につないだ構成
  | XとZの直列：xz
  | B ＝ xz ＋ y − xz・y ＝ xz ＋ y − xyz
  <b>差を取る</b>
  | B − A ＝ (xz ＋ y − xyz) − (xz ＋ yz − xyz)
  | 　　　＝ y − yz ＝ y(1 − z)
  y＞0、z＜1 なので、y(1 − z) は<b>常に正</b>です。つまり、どんな稼働率でも<b>Bの方が常に高い</b>ことになります。
  数値例：x＝y＝z＝0.9 なら A＝0.99×0.9＝0.891、B＝1−(1−0.81)(1−0.9)＝1−0.019＝0.981。
  正解は<b>エ</b>です。
choices:
  ア: B − A ＝ y(1 − z) は、稼働率が0より大きく1より小さい限り常に正なので、どちらが高いかが値によって変わることはありません。誤り。
  イ: B − A は常に正で、0（等しい）にはなりません。誤り。
  ウ: Aの方が高くなることはありません。誤り。
  エ: B − A ＝ y(1 − z) ＞ 0 なので、常にBの稼働率はAより高くなります。<b>正解</b>。
example: |
  Aは「XかYのどちらかが動けばよいが、Zが止まると全部止まる」構成で、Zが弱点（単一障害点）になっています。Bは「XとZのセット」か「Y単独」のどちらかが動けばよい構成なので、Zが止まってもYが動いていれば大丈夫です。弱点がない分、Bの方が止まりにくくなります。
review:
  - 直列の稼働率は積、並列の稼働率は 1−(1−p)(1−q)。
  - 2つのシステムを比べるときは、式の差を取って符号を調べる（ここでは B−A＝y(1−z)＞0）。
  - 1台だけで直列につながる部分（単一障害点）がある構成は稼働率が下がりやすい。
