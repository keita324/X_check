q: 63
answer: イ
category: システム戦略
theme: |
  業務改善の4原則「ECRS（Eliminate・Combine・Rearrange・Simplify）」のうち、「Rearrange（入れ替え）」を適用した例を選ぶ問題です。
basics: |
  <b>ECRS（イクルス）</b>：業務改善を考えるときの4つの視点です。この順番で検討すると効果が大きいとされます。
  - <b>E：Eliminate（排除）</b>：その作業をやめられないか（不要な作業・手順をなくす）。
  - <b>C：Combine（結合）</b>：複数の作業をまとめられないか（重複する作業を1つにする）。
  - <b>R：Rearrange（交換・入替え）</b>：作業の<b>順番や担当、場所を入れ替えて</b>効率化できないか。
  - <b>S：Simplify（簡素化）</b>：作業をもっと簡単にできないか（自動化、手順の単純化）。
reasoning: |
  各改善例がECRSのどれに当たるかを判断します。
  1. ア：決裁に不要な人を申請フローから外す → 不要な手順をなくす＝<b>Eliminate</b>。
  2. イ：配送順を入れ替えて、移動距離の無駄をなくす → 順番を入れ替える＝<b>Rearrange</b>。
  3. ウ：関数で関連項目を自動計算する → 作業を簡単にする＝<b>Simplify</b>。
  4. エ：各部門で別々に作っていた議事録を代表者1名が作って共有 → 重複作業をまとめる＝<b>Combine</b>。
  5. Rearrangeの例は<b>イ</b>です。
choices:
  ア: 決裁に不要な人を申請フローから外すのは、不要な手順をなくす<b>Eliminate（排除）</b>の例です。誤り。
  イ: 配送ルートを可視化して配送順を入れ替え、1日に配送できる件数を増やすのは、<b>Rearrange（入替え）</b>の例です。<b>正解</b>。
  ウ: 関数を設定して関連項目を自動計算させ、手入力の手間を減らすのは、<b>Simplify（簡素化）</b>の例です。誤り。
  エ: 各部門が別々に作成していた議事録を、代表者1名が作成して共有するのは、重複作業をまとめる<b>Combine（結合）</b>の例です。誤り。
example: |
  朝の支度で考えると、「見ない朝のテレビをやめる」がE、「歯みがきしながら天気予報を聞く」がC、「着替えてから朝食」を「朝食の後に着替え」にして服を汚さないようにするのがR、「前の晩に服を用意しておく」がSです。
review:
  - ECRS：Eliminate（なくす）、Combine（まとめる）、Rearrange（順番・担当を入れ替える）、Simplify（簡単にする）。
  - 改善例が「なくす・まとめる・入れ替える・簡単にする」のどれかで分類する。
