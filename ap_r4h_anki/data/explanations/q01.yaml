q: 1
answer: ア
category: 基礎理論
theme: |
  浮動小数点数の計算で、仮数部（有効数字を入れる部分）のビット数が足りずに下の桁が切り捨てられる「情報落ち」が起きるかどうかを、実際に2進数で計算して判定する問題です。
basics: |
  <b>浮動小数点数</b>：数を「1.xxxx × 2<sup>指数</sup>」の形で表す方法です。10進数の「1.23×10<sup>5</sup>」と同じ考え方を2進数で行います。
  この問題の形式は (1.X<sub>1</sub>X<sub>2</sub>…X<sub>7</sub>)<sub>2</sub>×2<sup>Y</sup> なので、<b>小数点より下に7ビットまで</b>しか覚えておけません。

  <b>情報落ち</b>：大きさが大きく違う数を足したり引いたりすると、結果の有効数字が仮数部に収まらず、小さい方の数の情報（下の桁）が切り捨てられてしまう現象です。
  判定方法：計算結果を「1.xxxx×2<sup>指数</sup>」の形に直したとき、小数点以下の<b>最後の1が何ビット目にあるか</b>を数えます。7ビット目以内なら情報落ちなし、8ビット目以降に1があれば情報落ちが発生します。

  <b>2進数の小数</b>：0.1<sub>2</sub>＝1/2、0.01<sub>2</sub>＝1/4、0.001<sub>2</sub>＝1/8、0.0001<sub>2</sub>＝1/16。
  また (1.1)<sub>2</sub>×2<sup>−3</sup>＝0.0011<sub>2</sub>、(1.0)<sub>2</sub>×2<sup>−4</sup>＝0.0001<sub>2</sub>、(1.0)<sub>2</sub>×2<sup>5</sup>＝100000<sub>2</sub> です。
reasoning: |
  { } 内を先に計算し、その結果と残りの数を足して、最終結果の有効ビット数を数えます。各段階で7ビットに収まるかを確認します。

  <b>ア</b>
  | { 0.0011 ＋ 0.0001 } ＝ 0.0100 ＝ 1.0×2<sup>−2</sup>（収まる）
  | 100000 ＋ 0.01 ＝ 100000.01 ＝ 1.0000001×2<sup>5</sup>
  | 小数点以下は「0000001」でちょうど<b>7ビット</b> → 情報落ちなし
  <b>イ</b>
  | { 0.0011 − 0.0001 } ＝ 0.0010 ＝ 1.0×2<sup>−3</sup>
  | 100000 ＋ 0.001 ＝ 100000.001 ＝ 1.00000001×2<sup>5</sup>
  | 小数点以下が<b>8ビット</b>必要 → 最後の1が落ちる（情報落ち）
  <b>ウ</b>
  | { 100000 ＋ 0.0011 } ＝ 100000.0011 ＝ 1.000000011×2<sup>5</sup>
  | 小数点以下が<b>9ビット</b>必要 → { } 内の時点で情報落ち
  <b>エ</b>
  | { 100000 − 0.0001 } ＝ 11111.1111 ＝ 1.11111111×2<sup>4</sup>
  | 小数点以下が<b>8ビット</b>必要 → { } 内の時点で情報落ち
  情報落ちが発生しないのは<b>ア</b>です。
choices:
  ア: 途中も最終結果も小数点以下7ビット以内（1.0000001×2<sup>5</sup>）に収まるので、情報落ちは発生しません。<b>正解</b>。
  イ: 最終結果が 1.00000001×2<sup>5</sup> となり、小数点以下8ビット目の1が仮数部に入りきらず切り捨てられます。情報落ちが発生します。誤り。
  ウ: 2<sup>5</sup>（大きい数）に 2<sup>−3</sup> 程度の小さい数を先に足すため、{ } 内で小数点以下9ビットが必要になり、情報落ちが発生します。誤り。
  エ: 32 − 1/16 ＝ 31.9375 ＝ 11111.1111<sub>2</sub> は、正規化すると小数点以下8ビットが必要になり、情報落ちが発生します。誤り。
example: |
  有効数字3桁の電卓で「1000＋0.5」を計算すると、本当は1000.5ですが「1.00×10<sup>3</sup>」としか表せず、0.5が消えてしまいます。これが情報落ちです。小さい数どうしを先に足してから大きい数に足す（アの順序）と、情報落ちを防ぎやすくなります。
review:
  - 計算結果を「1.xxx×2<sup>n</sup>」に正規化し、小数点以下の最後の1が仮数部のビット数（ここでは7）以内かで情報落ちを判定する。
  - 大きさが大きく違う数の加減算で情報落ちが起きる。小さい数どうしを先に計算するのが対策。
