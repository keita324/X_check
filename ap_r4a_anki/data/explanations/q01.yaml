q: 1
answer: イ
theme: |
  「nビットで表せる数を2乗すると、2進数で最大何桁（何ビット）になるか」を問う問題です。
  掛け算の結果を格納するのに必要な桁数（メモリの幅）を見積もる、コンピュータの基礎となる考え方です。
basics: |
  <b>2進数とビット</b>：コンピュータは数を0と1だけで表します。0か1の1桁を<b>1ビット</b>と呼びます。nビットとは「0か1をn個並べた数」です。

  <b>nビットで表せる範囲</b>：例えば3ビットなら 000〜111（10進数の0〜7）です。一般に、最大値は全部1のときで <b>2<sup>n</sup>−1</b> です。
  問題文では「aを2進数で表すとnビット」なので、先頭のビットは1です。つまり aは 2<sup>n−1</sup> 以上、2<sup>n</sup>−1 以下です（3ビットなら4〜7）。

  <b>「2<sup>k</sup>未満の数はkビットに収まる」</b>：例えば16（=2<sup>4</sup>）未満の数は4ビット（最大1111=15）で表せます。
reasoning: |
  1. 条件整理：aはnビットなので、a ≦ 2<sup>n</sup>−1。bはaの2乗。
  2. bが最大になるのはaが最大のとき。bの最大値を計算します。
  | b ≦ (2<sup>n</sup>−1)<sup>2</sup> = 2<sup>2n</sup> − 2×2<sup>n</sup> + 1 = 2<sup>2n</sup> − 2<sup>n+1</sup> + 1
  3. n≧1なら 2<sup>n+1</sup> は1より大きいので、bは必ず <b>2<sup>2n</sup>未満</b>です。よって bは <b>2nビット以内</b>に収まります。
  4. 本当に2nビットになるか実例で確認します。n=2、a=3（11₂）なら b=9＝1001₂ で4ビット＝2×2。n=3、a=7（111₂）なら b=49＝110001₂ で6ビット＝2×3。
  5. したがって、最大で <b>2nビット</b>。正解は<b>イ</b>です。
choices:
  ア: 「n+1ビット」。n=2、a=3のとき b=9=1001₂ で4ビット必要なので、3ビット（n+1）では足りません。誤り。
  イ: 「2nビット」。上の計算どおり b＜2<sup>2n</sup> で、実例でもちょうど2nビットになる場合があるので、これが「最大」です。<b>正解</b>。
  ウ: 「n<sup>2</sup>ビット」。n=3なら9ビットになりますが、実際は最大6ビットで足ります。必要以上に大きく、「最大で何ビットになるか」の答えになりません。誤り。
  エ: 「2<sup>n</sup>ビット」。n=3なら8ビット、n=10なら1024ビットと急激に大きくなり、実際の最大（20ビット）と全く合いません。誤り。
example: |
  10進数でも同じ現象が起きます。2桁の最大値99を2乗すると9801で4桁、3桁の999を2乗すると998001で6桁です。「n桁×n桁の掛け算の答えは最大2n桁」と覚えると、2進数でも10進数でも使えます。
review:
  - nビットの数の範囲は「2<sup>n−1</sup>以上 2<sup>n</sup>−1以下」であることを言えるようにする。
  - 「n桁×n桁の積は最大2n桁」を10進数（99×99=9801）で確かめて覚える。
  - 迷ったら n=2,3 など小さい数を代入して選択肢を検算する。
