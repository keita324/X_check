q: 27
answer: イ
category: データベース
theme: |
  複数のデータベースにまたがるトランザクションを確定させる「2相コミット」で、参加者がコミットすべきかロールバックすべきか判断できなくなる（不確定状態になる）障害のタイミングを問う問題です。
basics: |
  <b>分散トランザクション</b>：複数のサーバ（データベース）にまたがる処理です。「全部のサーバで確定する」か「全部で取り消す」かのどちらかにしなければなりません（原子性）。
  <b>2相コミット</b>：全体をまとめる<b>調停者</b>（コーディネーター）と、各サーバの<b>参加者</b>の間で、2段階でやり取りして確定させる方式です。
  | <b>第1相</b>：調停者が参加者に「コミットできますか？」と<b>問い合わせ</b>る → 参加者は準備をして「できます（又はできません）」と<b>応答</b>する。
  | <b>第2相</b>：全員が「できます」なら調停者が「コミットせよ」、1人でも「できません」なら「ロールバックせよ」と<b>決定</b>を送る → 参加者は実行して<b>完了</b>を返す。
  参加者は「できます」と応答した後は、自分だけで勝手にコミットもロールバックもできず、<b>調停者の決定を待つ</b>しかありません。この間に決定が届かないと、どちらにすべきか判断できない<b>不確定状態</b>になります。
reasoning: |
  各タイミングで障害が起きた場合を考えます。
  1. ア：問合せを送る<b>前</b>の障害 → 参加者はまだ準備しておらず、自分の判断でロールバックできます。
  2. イ：参加者が「できます」と応答した後、調停者が<b>決定を送る直前</b>の障害 → 参加者は準備済みで決定を待っている状態のまま、決定が届きません。コミットかロールバックか判断できない<b>不確定状態</b>になります。
  3. ウ：参加者が<b>応答を返す前</b>の障害 → 調停者は応答が来ないのでロールバックを決定でき、参加者側も未応答なのでロールバックできます。
  4. エ：参加者が<b>完了を返す直前</b>の障害 → 参加者は既に決定を受け取って実行しているので、判断に迷うことはありません。
  5. 正解は<b>イ</b>です。
choices:
  ア: 調停者が問合せを送る直前の障害なら、参加者はまだ準備段階に入っていないので、自分でロールバックを判断できます。誤り。
  イ: 調停者が決定を参加者に送る直前に障害が起きると、準備を終えて決定を待つ参加者は、コミットすべきかロールバックすべきか判断できなくなります。<b>正解</b>。
  ウ: 参加者が可否の応答を返す直前の障害なら、調停者は応答なしとしてロールバックを決定でき、参加者もまだ「できます」と約束していないので判断に迷いません。誤り。
  エ: 参加者が完了を返す直前の障害なら、参加者は既に決定を受け取って処理しているので、判断できなくなることはありません。誤り。
example: |
  結婚式で、司会者（調停者）が新郎新婦（参加者）に「誓いますか？」と聞き、2人とも「誓います」と答えた（準備完了）後、司会者が「ここに夫婦となったことを宣言します」と言う直前に倒れてしまったら、2人は結婚が成立したのかどうか分からず、宙ぶらりんの状態になります。これが2相コミットの不確定状態です。
review:
  - 2相コミット：第1相＝問合せと可否の応答、第2相＝決定（コミット/ロールバック）と完了の応答。
  - 参加者が「可」と応答した後、調停者の決定が届く前に障害が起きると、参加者は判断できない不確定状態になる。
