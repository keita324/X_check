q: 46
answer: ウ
category: システム開発技術
theme: |
  モジュール（プログラムの部品）同士で情報をやり取りする方法のうち、結び付きの強さ（モジュール結合度）が最も低いものを選ぶ問題です。
basics: |
  <b>モジュール結合度</b>：モジュール同士がどれだけ強く依存し合っているかの尺度です。低いほど、1つを修正しても他に影響しにくく、独立性が高い良い設計です。
  結合度の強い順（悪い順）
  | 内容結合 ＞ 共通結合 ＞ 外部結合 ＞ 制御結合 ＞ スタンプ結合 ＞ データ結合
  - <b>共通結合</b>：共通域（グローバル領域）に定義したデータ構造を、複数のモジュールが参照する。
  - <b>外部結合</b>：外部宣言した単一のデータを、複数のモジュールで共有する。
  - <b>制御結合</b>：処理の流れを切り替えるための制御パラメータ（フラグなど）を引数で渡す。
  - <b>データ結合</b>：入出力に必要な単純なデータ項目だけを引数で渡す。
reasoning: |
  1. 各選択肢がどの結合に当たるかを判断します。
  | ア 共通域に定義したデータを参照 → 共通結合
  | イ 制御パラメータを引数で渡して実行順序を制御 → 制御結合
  | ウ 入出力に必要なデータ項目だけを引数で渡す → データ結合
  | エ 必要なデータを外部宣言して共有 → 外部結合
  2. このうち結合度が最も低いのはデータ結合です。正解は<b>ウ</b>です。
choices:
  ア: 共通域のデータを複数のモジュールが参照するのは<b>共通結合</b>で、結合度が高い（独立性が低い）方法です。誤り。
  イ: 制御パラメータを引数で渡して相手の処理の流れを左右するのは<b>制御結合</b>で、データ結合より結合度が高い方法です。誤り。
  ウ: 入出力に必要なデータ項目だけを引数で渡すのは<b>データ結合</b>で、結合度が最も低い方法です。<b>正解</b>。
  エ: 必要なデータを外部宣言して共有するのは<b>外部結合</b>で、結合度が高い方法です。誤り。
example: |
  同僚に計算を頼むとき、「この2つの数を掛けて結果を教えて」と必要な数字だけを渡すのがデータ結合です。「共有フォルダのこのファイルを直接書き換えて」（共通結合・外部結合）や、「このフラグが1ならA、2ならBの手順でやって」（制御結合）となるほど、相手の作業に深く入り込み、どちらかの変更が他方に影響しやすくなります。
review:
  - 結合度の順（強→弱）：内容＞共通＞外部＞制御＞スタンプ＞データ。データ結合が最も低く独立性が高い。
  - 引数で渡すもの（必要なデータだけ＝データ結合、制御フラグ＝制御結合）と、共有するもの（共通域＝共通結合、外部宣言＝外部結合）で分類する。
