q: 30
answer: ア
category: データベース
theme: |
  DBMSの障害回復で、ロールフォワード（やり直し）とロールバック（取消し）が必要なトランザクションを、コミットの時刻と「データを書き込んだかどうか」から判断する問題です。
basics: |
  <b>トランザクション</b>：ひとまとまりの処理単位。<b>コミット</b>すると処理が確定します。
  <b>チェックポイント</b>：メモリ上の更新内容を、ディスク上のデータベースに書き出す時点です。
  障害発生後の再立上げでは、ログを使って次の回復処理を行います。
  - <b>ロールフォワード</b>：チェックポイント<b>後</b>、障害発生前に<b>コミットした</b>トランザクション。更新がディスクに反映されていない可能性があるので、ログの更新後情報でやり直す。
  - <b>ロールバック</b>：障害発生時に<b>コミットしていない</b>トランザクション。途中までの更新を、ログの更新前情報で取り消す。
  - チェックポイント前にコミット済みのトランザクションは、回復処理が不要。
  ただし、<b>Read（読込み）だけでWrite（書込み）をしていない</b>トランザクションは、データベースを何も変更していないので、ロールフォワードもロールバックも<b>不要</b>です。
reasoning: |
  図と表から、各トランザクションを分類します。
  | T1（Write あり）：チェックポイント前にコミット → 処理不要
  | T2（Write あり）：チェックポイント後にコミット → <b>ロールフォワード</b>
  | T3（Read のみ）：未コミット → 書込みがないので処理不要
  | T4（Read のみ）：未コミット → 書込みがないので処理不要
  | T5（Write あり）：チェックポイント後にコミット → <b>ロールフォワード</b>
  | T6（Write あり）：未コミット → <b>ロールバック</b>
  ロールフォワードは T2・T5、ロールバックは T6 です。正解は<b>ア</b>です。
choices:
  ア: ロールフォワード T2・T5、ロールバック T6。チェックポイント後にコミットした更新はやり直し、未コミットで書込みのある T6 だけを取り消します。<b>正解</b>。
  イ: T3 は Read のみでデータベースを変更していないため、ロールバックする必要はありません。誤り。
  ウ: T1 はチェックポイントより前にコミットしており、その更新はチェックポイントでディスクに書き出し済みなので、ロールフォワードは不要です。誤り。
  エ: T1 のロールフォワードも、T3 のロールバックも不要です。誤り。
example: |
  ゲームのセーブ（チェックポイント）後に、クリアしたクエスト（T2・T5）は記録を見て再現し、途中で中断したクエストのうち、アイテムを消費していたもの（T6）は元に戻します。地図を眺めていただけ（Read のみ：T3・T4）なら、何も戻す必要はありません。
review:
  - ロールフォワード＝チェックポイント後〜障害前にコミット、ロールバック＝障害時に未コミット、チェックポイント前のコミットは処理不要。
  - Read のみ（Write なし）のトランザクションはデータを変えていないので、ロールバックも不要。
