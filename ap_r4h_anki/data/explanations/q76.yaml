q: 76
answer: エ
category: 企業活動
theme: |
  価格を上げると売れる数が減る、という関係の表から、利益が最大になる価格を計算で求める問題です。
basics: |
  <b>固定費</b>：作る数に関係なくかかる費用（工場の家賃、設備費など）。ここでは100万円。
  <b>変動費</b>：1個作るごとにかかる費用（材料費など）。ここでは1個600円。
  <b>利益</b>の求め方
  | 利益 ＝ 売上高 − 変動費 − 固定費
  | 　　 ＝ （価格 − 600円）× 販売数 − 1,000,000円
  （価格−変動費）を<b>1個あたりの限界利益</b>と呼びます。1個売るごとに、固定費の回収と利益に回せる金額です。
reasoning: |
  各価格で利益を計算します（単位：円）。
  | 1,000円：(1,000 − 600) × 80,000 ＝ 400 × 80,000 ＝ 32,000,000 → 利益 31,000,000
  | 1,200円：(1,200 − 600) × 70,000 ＝ 600 × 70,000 ＝ 42,000,000 → 利益 41,000,000
  | 1,400円：(1,400 − 600) × 60,000 ＝ 800 × 60,000 ＝ 48,000,000 → 利益 47,000,000
  | 1,600円：(1,600 − 600) × 50,000 ＝ 1,000 × 50,000 ＝ 50,000,000 → 利益 <b>49,000,000</b>
  価格を上げると販売数は減りますが、1個あたりの限界利益の増え方の方が大きいため、1,600円のとき利益が最大になります。
  正解は<b>エ</b>です。
  （固定費はどの価格でも同じ100万円なので、比較するだけなら限界利益の合計だけを比べても結論は同じです。）
choices:
  ア: 1,000円の利益は3,100万円で、4つの中で最も小さいです。販売数は最も多いですが、1個あたりの限界利益（400円）が小さすぎます。誤り。
  イ: 1,200円の利益は4,100万円で、最大ではありません。誤り。
  ウ: 1,400円の利益は4,700万円で、1,600円の4,900万円より小さいです。誤り。
  エ: 1,600円の利益は4,900万円で、最大です。<b>正解</b>。
example: |
  文化祭でクッキーを売るとき、材料費が1袋60円なら、100円で800袋売る（利益3.2万円）より、160円で500袋売る（利益5万円）方が儲かることがあります。「たくさん売れる＝たくさん儲かる」とは限らず、1個あたりの儲けと販売数の掛け算で比べるのがポイントです。
review:
  - 利益＝（価格−変動費）×販売数−固定費。各価格で計算して比べる。
  - 販売数が最大の価格が利益最大とは限らない。1個あたりの限界利益×数量で判断する。
