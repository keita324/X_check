q: 8
answer: エ
category: コンピュータ構成要素
theme: |
  プロセッサ（CPU）の高速化技法のうち、同時に実行できる複数の動作を「コンパイルの段階で」1つの長い命令にまとめる方式（VLIW）を選ぶ問題です。
basics: |
  <b>コンパイル</b>：人が書いたプログラムを、CPUが実行できる機械語の命令に変換することです。
  <b>命令レベルの並列処理</b>：CPU内には演算器が複数あるので、互いに関係のない命令は同時に実行できます。問題は「どの命令を同時に実行できるか」を<b>誰が判断するか</b>です。
  - <b>VLIW（Very Long Instruction Word）</b>：<b>コンパイラ</b>が事前に同時実行できる命令を調べ、それらを1つの非常に長い命令（複合命令）にまとめておく方式。CPUは判断の手間が要らず、回路を簡単にできます。
  - <b>スーパースカラ</b>：CPU自身が実行中に同時実行できる命令を判断する方式（参考）。

  他の用語
  - <b>CISC</b>：複雑で高機能な命令を多数持つCPU設計。
  - <b>RISC</b>：単純な命令に絞り、1命令を短時間で実行するCPU設計。
  - <b>MIMD</b>：複数のプロセッサが、それぞれ異なる命令で異なるデータを処理する並列処理方式。
reasoning: |
  1. キーワードは「コンパイルの段階で」「まとめて一つの複合命令」です。
  2. これは、コンパイラが並列実行できる命令を詰め込んだ長い命令語を作るVLIWの説明です。
  3. 正解は<b>エ</b>です。
choices:
  ア: CISCは、1つの命令で複雑な処理を行える命令セットの設計方針です。同時実行可能な動作をコンパイル時にまとめる方式ではありません。誤り。
  イ: MIMDは、複数のプロセッサがそれぞれ別々の命令・データを処理する並列コンピュータの分類です。誤り。
  ウ: RISCは、命令を単純で長さのそろったものに限定して高速化する設計方針です。誤り。
  エ: VLIWは、コンパイラが同時に実行可能な複数の動作を1つの長い複合命令にまとめ、並列に実行させる方式です。<b>正解</b>。
example: |
  引っ越し業者に例えると、VLIWは「事前に段取り表（コンパイル）を作り、『この3つの荷物は同時に運べる』と1枚の指示書にまとめておく」方式です。作業員（CPU）は指示書どおりに動くだけなので迷いません。スーパースカラは、現場で作業員が自分で判断して同時に運ぶ方式です。
review:
  - VLIW＝コンパイラが同時実行可能な命令を1つの長い命令にまとめる（並列性の判断はコンパイル時）。
  - CISC（複雑な命令）、RISC（単純な命令）、MIMD（複数プロセッサが別々の命令）と区別する。
