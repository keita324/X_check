q: 10
answer: エ
theme: |
  キャッシュが2段（L1とL2）ある場合に、システム全体としてのヒット率（キャッシュでデータが見つかる割合）を計算する問題です。
basics: |
  <b>ヒット率</b>：CPUが欲しいデータがキャッシュにあった割合です。見つからない場合を<b>ミス</b>と呼び、その割合（ミス率）は 1−ヒット率 です。
  <b>L1・L2キャッシュ</b>：CPUに近い順にL1（最も速く小さい）、L2（少し遅く大きい）です。CPUはまずL1を探し、なければL2を探し、それでもなければ主記憶へ行きます。

  <b>ここでの「L2のヒット率0.6」の意味</b>：L1でミスしてL2まで探しに来たアクセスのうち、60%がL2で見つかる、という意味です。
reasoning: |
  1. 条件整理：L1ヒット率 0.95、L2ヒット率 0.6（L1でミスしたアクセスに対して）。
  2. L1でヒットする割合：0.95
  3. L1でミスする割合：1 − 0.95 ＝ 0.05
  4. そのうちL2でヒットする割合：0.05 × 0.6 ＝ 0.03
  5. キャッシュシステム全体（L1かL2のどちらか）でヒットする割合は、両者を足します。
  | 全体のヒット率 ＝ 0.95 ＋ (1 − 0.95) × 0.6
  | ＝ 0.95 ＋ 0.05 × 0.6
  | ＝ 0.95 ＋ 0.03 ＝ <b>0.98</b>
  6. 確認：主記憶まで行く割合は 0.05 × (1−0.6) ＝ 0.02 で、1 − 0.02 ＝ 0.98 と一致します。正解は<b>エ</b>です。
choices:
  ア: 0.57 は 0.95 × 0.6 で、「L1とL2の両方でヒットする確率」のように掛け算してしまった値です。L2はL1でミスしたときだけ使われるので、この計算は誤り。
  イ: 0.6 は L2 単独のヒット率で、L1の効果を無視しています。誤り。
  ウ: 0.95 は L1 単独のヒット率で、L2で救われる0.03の分を足していません。誤り。
  エ: 0.95 ＋ 0.05 × 0.6 ＝ 0.98。計算結果と一致します。<b>正解</b>。
example: |
  探し物をするとき、まず机の上（L1）を見ると95%の確率で見つかります。見つからなかった5%のときだけ本棚（L2）を探し、そのうち6割が見つかります。机か本棚のどちらかで見つかる確率は 95%＋5%×60%＝98%。残り2%だけ倉庫（主記憶）まで行く、というイメージです。
review:
  - 2段キャッシュ全体のヒット率＝ L1ヒット率 ＋ (1 − L1ヒット率) × L2ヒット率 を使えるようにする。
  - L2のヒット率は「L1でミスしたアクセスに対する割合」であることを理解する。
  - 検算として「主記憶まで行く割合＝0.05×0.4＝0.02」から 1−0.02 を求める方法も覚える。
