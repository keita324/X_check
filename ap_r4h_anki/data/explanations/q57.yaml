q: 57
answer: イ
category: サービスマネジメント
theme: |
  データを管理する役割を「データ管理者（DA）」と「データベース管理者（DBA）」に分けたとき、DAが担当する仕事を選ぶ問題です。
basics: |
  <b>データ管理者（DA：Data Administrator）</b>：組織全体の視点で、<b>データそのもの</b>を管理する役割です。
  - データの意味や名前を定義し、<b>標準化</b>する（全社で同じ意味の項目には同じ名前を付ける）。
  - 業務の要件から、データ同士の関係を整理する<b>論理データベース設計</b>（概念設計）を行う。
  - データの利用ルールや管理方針を決める。

  <b>データベース管理者（DBA：Database Administrator）</b>：<b>データベースというシステム</b>を技術的に管理する役割です。
  - 物理データベース設計、性能の調整（パフォーマンスチューニング）。
  - 容量の管理（ディスクの増設計画など）。
  - バックアップ、障害時の復旧、整合性のチェック。
reasoning: |
  1. DAは「データの内容と意味（論理面）」、DBAは「データベースの運用・性能・容量（物理・技術面）」を担当する、と分けて考えます。
  2. 論理データベース設計とデータ項目の標準化は、データそのものを管理するDAの役割です。
  3. 正解は<b>イ</b>です。
choices:
  ア: データ量の増加傾向を把握して、ディスク装置の増設を計画・実施するのは、容量管理であり<b>DBA</b>の役割です。誤り。
  イ: 設計工程で論理データベース設計を行い、データ項目を管理して標準化するのは<b>DA</b>の役割です。<b>正解</b>。
  ウ: テスト工程でのパフォーマンスチューニング（応答性能の調整）は、データベースの技術的な管理であり<b>DBA</b>の役割です。誤り。
  エ: システム障害時のデータの復旧や整合性のチェックは、データベースの運用管理であり<b>DBA</b>の役割です。誤り。
example: |
  図書館で例えると、DAは「本をどう分類し、どんな名前（分類番号）を付けるか」を決める司書、DBAは「本棚の増設、本の出し入れのスピードアップ、災害時の本の修復」を担当する施設管理者です。
review:
  - DA＝データの論理面（論理データベース設計、データ項目の定義・標準化、管理方針）。
  - DBA＝データベースの物理・運用面（性能チューニング、容量管理、バックアップ・障害回復）。
