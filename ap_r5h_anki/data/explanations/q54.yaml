q: 54
answer: エ
category: プロジェクトマネジメント
theme: |
  プロジェクトのリスクを洗い出す技法の一つ「デルファイ法」の説明を、モンテカルロ法・チェックリスト分析・ブレーンストーミングと区別する問題です。
basics: |
  リスクの特定（どんなリスクがあるかを洗い出すこと）や分析には、いくつかの技法があります。
  - <b>デルファイ法</b>：複数の専門家に<b>匿名で</b>意見を求め、その結果を<b>要約して全員にフィードバック</b>し、再び意見を求めることを繰り返して、意見を収束させる手法。他人の権威や声の大きさに左右されにくい。
  - <b>モンテカルロ法</b>：確率分布に従う乱数を使ってシミュレーションを何度も行い、結果のばらつきを分析する手法。
  - <b>チェックリスト分析</b>：過去の経験からまとめたリスクのチェックリストと照らし合わせて、リスクを識別する手法。
  - <b>ブレーンストーミング</b>：複数人で、他人の意見を批判せずに自由に多くのアイデアを出し合う手法。
reasoning: |
  1. デルファイ法のキーワードは「複数の専門家」「見解を要約して再配布」「何度か繰り返して収束させる」です。
  2. これを述べているのは<b>エ</b>です。
choices:
  ア: 確率分布を使ったシミュレーションを行うのは、<b>モンテカルロ法</b>です。誤り。
  イ: 過去の情報や知識からリスクをチェックリストにまとめ、照らし合わせてリスクを識別するのは、<b>チェックリスト分析</b>です。誤り。
  ウ: 何人かが集まり、他人のアイデアを批判せずに自由に多くのアイデアを出し合うのは、<b>ブレーンストーミング</b>です。誤り。
  エ: 複数の専門家の見解を要約して再配布し、再度見解を求めることを繰り返して収束させるのは、<b>デルファイ法</b>です。<b>正解</b>。
example: |
  新しいシステム開発で「どんなトラブルが起こり得るか」を、社外の専門家5人に匿名のアンケートで聞きます。集まった意見を整理して全員に見せ、「他の人の意見を見て、考えを変えますか？」ともう一度聞く…を繰り返すと、偏りの少ないリスクの一覧にまとまっていきます。
review:
  - デルファイ法＝専門家への匿名アンケートを、結果をフィードバックしながら繰り返して意見を収束させる。
  - モンテカルロ法（確率シミュレーション）、チェックリスト分析（過去のリストと照合）、ブレーンストーミング（批判なしで自由に発想）と区別する。
