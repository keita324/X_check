q: 54
answer: ウ
theme: |
  複数の評価項目に「重み」を付けて製品を総合評価する「加重総和法」で、最も評価の高い製品を選ぶ計算問題です。
basics: |
  <b>多基準意思決定分析</b>：価格、機能、品質など、いくつもの基準を同時に考えて選択肢を比べる方法です。
  <b>加重総和法</b>：評価項目ごとに「どれだけ重要か」を表す<b>重み</b>を決めておき、
  | 総合評価 ＝ （重み × 評価点数）を全項目について足し合わせたもの
  で比較します。重要な項目の点数ほど、総合評価に大きく効きます。
reasoning: |
  各製品について「重み×点数」を計算して合計します（重み：機能要件5、非機能要件1、導入費用の安さ4）。
  | 製品A：5×7 ＋ 1×9 ＋ 4×8 ＝ 35 ＋ 9 ＋ 32 ＝ <b>76</b>
  | 製品B：5×8 ＋ 1×10 ＋ 4×5 ＝ 40 ＋ 10 ＋ 20 ＝ <b>70</b>
  | 製品C：5×9 ＋ 1×4 ＋ 4×7 ＝ 45 ＋ 4 ＋ 28 ＝ <b>77</b>
  | 製品D：5×9 ＋ 1×7 ＋ 4×6 ＝ 45 ＋ 7 ＋ 24 ＝ <b>76</b>
  最も高いのは製品Cの77点です。正解は<b>ウ</b>です。

  参考：重みを付けずに単純に合計すると、A＝24、B＝23、C＝20、D＝22 となり、Aが最高になってしまいます。重みを掛けるかどうかで結論が変わる点が、この問題のひっかけです。
choices:
  ア: 製品Aは76点で、Cの77点より1点低いです。重みを掛けずに単純合計（24点で最高）すると選んでしまう、ひっかけの選択肢です。誤り。
  イ: 製品Bは70点で最下位です。非機能要件（重み1）の10点は総合評価への影響が小さく、導入費用（重み4）の5点が大きく響いています。誤り。
  ウ: 製品Cは77点で最高です。<b>正解</b>。
  エ: 製品Dは76点で、Cより1点低いです。誤り。
example: |
  スマホ選びで「カメラ性能をとても重視（重み5）、デザインは少し（重み1）、価格はかなり重視（重み4）」という場合、デザインが満点でもカメラが弱い機種は総合点が伸びません。自分にとって大事な項目の点数を大きく数えるのが加重総和法です。
review:
  - 加重総和法＝Σ（重み×評価点数）。必ず重みを掛けてから合計する。
  - 単純合計と加重合計で結論が変わる場合がある（この問題ではA→C）ことを意識する。
