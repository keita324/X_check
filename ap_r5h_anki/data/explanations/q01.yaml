q: 1
answer: ア
category: 基礎理論
theme: |
  「n＋1、ただし255の次は0に戻る」という計算（8ビットのカウンタ）を、ビットごとの論理演算（AND・OR）で表す方法を問う問題です。
basics: |
  <b>2進数と8ビット</b>：0〜255は、2進数8ビット（00000000〜11111111）で表せる範囲です。255は 1111 1111、256は 1 0000 0000（9ビット目だけが1）です。

  <b>ビットごとの論理演算</b>：2つの数を2進数で縦に並べ、桁ごとに計算します。
  - <b>AND（論理積）</b>：両方1のときだけ1。「必要な桁だけを残し、他を0にする」ために使う（<b>マスク</b>）。
  - <b>OR（論理和）</b>：どちらかが1なら1。「特定の桁を1にする」ために使う。

  255（1111 1111）とANDを取ると、<b>下位8ビットだけが残り、9ビット目以上は0</b>になります。
reasoning: |
  next(n) は「n＜255 なら n＋1、n＝255 なら 0」です。各選択肢に代入して確かめます。

  <b>ア (n＋1) AND 255</b>
  | n＝10：11＝0000 1011、AND 1111 1111 → 0000 1011＝11（n＋1と一致）
  | n＝255：256＝1 0000 0000、AND 0 1111 1111 → 0 0000 0000＝0（一致）
  n＋1 が255以下なら下位8ビットがそのまま残り、256になったときだけ9ビット目が消えて0になります。next(n) と完全に一致します。

  <b>イ (n＋1) AND 256</b>
  | n＝10：0000 1011 AND 1 0000 0000 → 0（本来は11なので不一致）
  <b>ウ (n＋1) OR 255</b>
  | n＝10：0000 1011 OR 1111 1111 → 1111 1111＝255（不一致）
  <b>エ (n＋1) OR 256</b>
  | n＝10：0000 1011 OR 1 0000 0000 → 1 0000 1011＝267（不一致）
  正解は<b>ア</b>です。
choices:
  ア: 255（1111 1111）とのANDで下位8ビットだけを残すので、n＝255のときだけ256が0に戻り、それ以外は n＋1 のままです。next(n) と一致します。<b>正解</b>。
  イ: 256（1 0000 0000）とのANDは、9ビット目だけを残し、他を0にします。n＜255 では結果が0になってしまうので誤り。
  ウ: 255とのORは、下位8ビットをすべて1にするので、結果は常に255以上になります。誤り。
  エ: 256とのORは、9ビット目を1にするので、n＋1 に256を足した値になります（n＝10なら267）。誤り。
example: |
  車の走行距離メーターが「999999 km」の次に「000000 km」に戻るのと同じ仕組みです。桁数（ここでは8ビット）からあふれた分を捨てるのが「AND 255」の役割で、「下8桁だけを見る窓」を当てているイメージです。
review:
  - x AND 255 は x の下位8ビットだけを取り出す（マスク）。256（9ビット目）が消えて0に戻る仕組みを理解する。
  - AND＝必要な桁を残す（他を0）、OR＝特定の桁を1にする、という使い分けを覚える。
  - 迷ったら n＝10 と n＝255 など具体的な値を代入して確かめる。
