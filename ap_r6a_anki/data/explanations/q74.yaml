q: 74
answer: ウ
category: 経営戦略マネジメント
theme: |
  経営理念・経営戦略・事業戦略の3つが、どのような上下関係（ピラミッド）になっているかを問う問題です。
basics: |
  企業の方針は、抽象的で長期的なものから、具体的で短期的なものへと段階的に分解されます。
  | <b>経営理念</b>（最上位）：企業の存在意義や価値観。「何のために存在するか」。最も抽象的で長期的。
  | ↓ 理念を実現するために
  | <b>経営戦略</b>（全社戦略）：企業全体として、どの事業領域で、どう経営資源を配分するか。
  | ↓ 経営戦略を達成するために
  | <b>事業戦略</b>：個々の事業ごとに、どのように競争に勝つか。より具体的。
  さらにその下に、機能別戦略（生産・販売・人事など）や具体的な実行計画が続きます。
  つまり、<b>上位ほど抽象的・長期的</b>、<b>下位ほど具体的・短期的</b>です。
reasoning: |
  1. ア：上位ほど「具体的」は逆です。上位ほど抽象的です → ×。
  2. イ：上位ほど「短期的」も逆です。上位ほど長期的です → ×。
  3. ウ：経営理念を達成するために経営戦略を策定し、経営戦略を達成するために事業戦略に分解する → ピラミッドの順番どおり → ○。
  4. エ：経営戦略と事業戦略の上下関係が逆です → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: ピラミッドは上位ほど抽象的、下位ほど具体的です。記述は上下が逆になっています。誤り。
  イ: ピラミッドは上位ほど中長期的、下位ほど短期的な視点です。記述は逆です。誤り。
  ウ: 経営理念を達成するために経営戦略を策定し、経営戦略を達成するために事業戦略に分解する、という関係が正しい階層構造です。<b>正解</b>。
  エ: 事業戦略を経営戦略より上位に置いており、経営戦略と事業戦略の関係が逆です。誤り。
example: |
  「食を通じて人々を健康にする」が経営理念だとすると、経営戦略は「健康食品事業とレストラン事業に資源を集中する」、事業戦略は「レストラン事業では低カロリーメニューで都市部の会社員を狙う」のようになります。上に行くほど大きな方向性、下に行くほど具体的な打ち手です。
review:
  - 経営理念 → 経営戦略 → 事業戦略 の順に、上位を達成するために下位へ分解する。
  - 上位ほど抽象的・長期的、下位ほど具体的・短期的。
