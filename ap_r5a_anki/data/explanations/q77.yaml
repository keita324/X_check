q: 77
answer: エ
category: 企業活動
theme: |
  定額法で減価償却しているPCを途中で廃棄したとき、帳簿上の残りの価値と廃棄費用から「固定資産除却損」を計算する問題です。
basics: |
  <b>減価償却</b>：PCなどの固定資産は、使うにつれて価値が減っていくと考え、購入代金（取得原価）を使用する年数（耐用年数）にわたって少しずつ費用にしていきます。
  <b>定額法</b>：毎年<b>同じ額</b>を費用にする方法です。
  | 1年分の減価償却費 ＝ 取得原価 × 償却率（残存価額が0円の場合）
  <b>帳簿価額（未償却残高）</b>：取得原価から、これまでの減価償却費の合計を引いた、帳簿上の残りの価値です。
  <b>固定資産除却損</b>：資産を廃棄（除却）したときに、まだ費用になっていない帳簿価額が損失になります。廃棄に費用がかかった場合は、それも損失に含めます。
  | 除却損 ＝ 廃棄時の帳簿価額 ＋ 廃棄費用
reasoning: |
  1. 1年分の減価償却費：
  | 30万円 × 0.250 ＝ 7.5万円
  2. 2年間使用したので、減価償却費の合計：
  | 7.5万円 × 2年 ＝ 15万円
  3. 廃棄時の帳簿価額：
  | 30万円 − 15万円 ＝ 15万円
  4. 固定資産除却損（廃棄費用を含む）：
  | 15万円 ＋ 2万円 ＝ <b>17.0万円</b>
  5. 正解は<b>エ</b>です。
choices:
  ア: 9.5万円は、計算結果の17.0万円と一致しません。誤り。
  イ: 13.0万円は、帳簿価額15万円から廃棄費用2万円を<b>引いて</b>しまった値です。廃棄費用は損失に加えます。誤り。
  ウ: 15.0万円は、帳簿価額だけで、廃棄費用2万円を含めていない値です。問題は「廃棄費用も含めて」と指定しています。誤り。
  エ: 17.0万円。帳簿価額15万円に廃棄費用2万円を加えた値です。<b>正解</b>。
example: |
  4年使う予定で30万円の自転車を買い、毎年7.5万円ずつ「使った分」として計上してきたとします。2年で手放すと、まだ計上していない15万円分の価値が無駄になり、さらに処分料2万円もかかるので、損失は合計17万円です。
review:
  - 定額法の減価償却費＝取得原価×償却率（毎年同額）。帳簿価額＝取得原価−減価償却累計額。
  - 固定資産除却損＝除却時の帳簿価額＋廃棄費用（廃棄費用を引かない・忘れない）。
