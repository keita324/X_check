q: 3
answer: ウ
category: 基礎理論
theme: |
  窓口が1つの待ち行列（M/M/1モデル）で、窓口の利用率が上がると平均待ち時間がどれだけ増えるかを、公式を使って計算する問題です。
basics: |
  <b>待ち行列</b>：レジやATM、サーバへの処理要求のように、「サービスを受けるために並ぶ列」のことです。
  <b>M/M/1モデル</b>：客がランダムに到着し（1つ目のM）、サービス時間もランダムにばらつき（2つ目のM）、窓口が1つ（1）である待ち行列の基本モデルです。
  <b>利用率 ρ（ロー）</b>：窓口が忙しく働いている時間の割合。ρ＝0.25なら、全体の25%の時間は誰かの対応をしています。

  <b>平均待ち時間の公式</b>（M/M/1）
  | 平均待ち時間 Tw ＝ ρ ÷ (1 − ρ) × 平均サービス時間 Ts
  利用率が1（100%）に近づくほど、分母(1−ρ)が0に近づき、待ち時間は急激に長くなります。
reasoning: |
  1. 平均サービス時間 Ts は窓口の能力で決まり、変わらないとします。
  2. 利用率25%（ρ＝0.25）のとき
  | Tw ＝ 0.25 ÷ (1 − 0.25) × Ts ＝ 0.25 ÷ 0.75 × Ts ＝ (1/3)Ts
  3. 利用率40%（ρ＝0.40）のとき
  | Tw ＝ 0.40 ÷ (1 − 0.40) × Ts ＝ 0.40 ÷ 0.60 × Ts ＝ (2/3)Ts
  4. 何倍になったか
  | (2/3)Ts ÷ (1/3)Ts ＝ <b>2.00倍</b>
  5. 正解は<b>ウ</b>です。
choices:
  ア: 1.25倍は、(1−0.25)÷(1−0.40)＝0.75÷0.6 の値で、分母部分だけの比です。分子 ρ の変化（0.25→0.40）も考える必要があります。誤り。
  イ: 1.60倍は、利用率そのものの比（0.40÷0.25）です。待ち時間は利用率に比例するのではなく、ρ/(1−ρ) に比例するので誤り。
  ウ: 2.00倍。(2/3)÷(1/3)＝2 で、計算結果と一致します。<b>正解</b>。
  エ: 3.00倍。計算結果の2倍と一致しません。誤り。
example: |
  空いているコンビニのレジ（利用率25%）では、並んでもすぐ順番が来ます。お客さんが少し増えて利用率40%になっただけで、待ち時間は2倍になります。さらに利用率80%なら ρ/(1−ρ)＝4 で、25%のときの12倍です。「少し混むと急に待たされる」のが待ち行列の特徴です。
review:
  - M/M/1の平均待ち時間 Tw ＝ ρ/(1−ρ) × Ts を覚え、利用率を代入して比を求められるようにする。
  - 待ち時間は利用率に比例しない（1.6倍ではない）。ρが1に近づくと急激に増える。
