q: 22
answer: ウ
category: ハードウェア
theme: |
  スマートフォンなどで使われる「SoC（System on a Chip）」の説明を、組込みソフトウェアやマイコンボード、SiPと区別する問題です。
basics: |
  <b>LSI（大規模集積回路）</b>：多数のトランジスタを1つのチップにまとめた電子部品です。
  - <b>SoC（System on a Chip）</b>：CPU、GPU、メモリコントローラ、通信機能など、<b>以前は複数のチップで構成していたコンピュータシステムを、1つのチップ（シリコン）上に実現したLSI</b>です。小型・省電力にでき、スマートフォンやタブレット、家電などで使われます。
  - <b>SiP（System in a Package）</b>：別々に作った<b>複数のチップ</b>を、<b>1つのパッケージ</b>（外側の容器）の中に封入して、1つの部品のように扱えるようにしたもの。チップ自体は複数のままである点がSoCとの違いです。
  - <b>MCU（マイクロコントローラ、マイコン）</b>：CPU、メモリ、入出力機能を1チップにまとめた、機器制御用の小さなコンピュータ。
reasoning: |
  1. SoCのキーワードは「複数のチップで構成していたシステムを」「<b>一つのチップ</b>で実現したLSI」です。
  2. これを述べているのは<b>ウ</b>です。
  3. エは「複数のチップを単一のパッケージに封入」なので、チップ自体は複数のまま＝<b>SiP</b>の説明です。
choices:
  ア: システムLSIに内蔵されたソフトウェアは、ファームウェア（組込みソフトウェア）のことで、SoCというハードウェアそのものの説明ではありません。誤り。
  イ: 複数のMCUを搭載したボード（基板）は、複数のチップを基板上で組み合わせたもので、1つのチップで実現したSoCではありません。誤り。
  ウ: 複数のチップで構成していたコンピュータシステムを、一つのチップで実現したLSIは、<b>SoC</b>です。<b>正解</b>。
  エ: 複数のチップを単一のパッケージに封入してシステム化したデバイスは、<b>SiP</b>です。チップ自体は複数のままです。誤り。
example: |
  SoCは「台所・寝室・浴室を全部1部屋にまとめたワンルーム」、SiPは「別々の小部屋を1つの建物の中にまとめたアパート」のようなものです。スマホが小さくて電池が長持ちするのは、多くの機能を1つのチップにまとめたSoCのおかげです。
review:
  - SoC＝複数チップで構成していたシステムを1つのチップ上に実現したLSI（小型・省電力）。
  - SiP（複数チップを1パッケージに封入）、MCU（制御用マイコン）、ファームウェア（内蔵ソフト）と区別する。
