q: 78
answer: エ
category: 法務
theme: |
  プログラムの著作物について、著作権法上許される行為（適法な行為）を選ぶ問題です。
basics: |
  <b>プログラムの著作権</b>：プログラムは著作物として保護され、著作権者に無断で複製・配布・改変などをすることは原則として禁止されています。ただし、次のような例外や注意点があります。
  - <b>プログラムの複製物の所有者による複製・翻案（改変）</b>：購入したプログラムの所有者は、自分のコンピュータで<b>利用するために必要な限度</b>で、複製したり改変（翻案）したりできます（例：バックアップの作成、処理速度を上げるための改変）。
  - <b>海賊版の業務使用</b>：違法に複製されたプログラムであることを<b>知りながら</b>入手し、業務で使用することは、著作権の侵害とみなされます。
  - <b>許諾範囲を超えた複製</b>：1台分のライセンスで買ったプログラムを複製して社内に配布することは、複製権の侵害です。
  - <b>職務著作</b>：社員が仕事として作ったプログラムの著作権は会社にあり、作成した社員個人が勝手に複製・貸与することはできません。
reasoning: |
  1. ア：海賊版と知りながら入手して業務で使用するのは、著作権侵害とみなされる行為です → 違法。
  2. イ：購入したプログラムを複製して各部門に配布するのは、利用に必要な限度を超えた複製で、複製権の侵害です → 違法。
  3. ウ：職務著作のプログラムの著作権は会社にあるので、作成した担当者が独断で複製・貸与するのは侵害です → 違法。
  4. エ：購入したプログラムを、自分が利用する上で処理速度を向上させるために改変するのは、プログラムの複製物の所有者に認められた範囲の改変です → <b>適法</b>。
  5. 正解は<b>エ</b>です。
choices:
  ア: 海賊版と知りながらプログラムを入手し業務で使用することは、著作権法で著作権の侵害とみなされる行為です。誤り。
  イ: 購入したプログラムを複製して社内の各部門に配布するのは、利用に必要な限度を超えた無断複製で、著作権の侵害です。誤り。
  ウ: 職務著作のプログラムの著作権は会社（法人）にあり、作成した担当者が独断で複製して他社に貸与することは侵害です。誤り。
  エ: 購入したプログラムを、より効果的に利用するため（処理速度の向上）に改変することは、複製物の所有者に認められており、適法です。<b>正解</b>。
example: |
  買った本に自分でメモを書き込んだり、自分用にコピーを取ったりするのは自由ですが、コピーをクラスの全員に配るのは許されません。プログラムも、自分が使うために動作を速くするように手を加えるのは認められていますが、勝手に複製して配るのは違法です。
review:
  - プログラムの複製物の所有者は、自ら利用するために必要な限度で複製・改変（処理速度の向上など）ができる。
  - 海賊版と知りながらの業務使用、ライセンスを超えた複製・配布、職務著作の無断複製・貸与は著作権侵害。
