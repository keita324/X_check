q: 62
answer: ア
category: システム戦略
theme: |
  B.H.シュミットが提唱した「CEM（カスタマーエクスペリエンスマネジメント）」における「カスタマーエクスペリエンス（顧客体験）」の意味を問う問題です。
basics: |
  <b>カスタマーエクスペリエンス（CX：顧客体験）</b>：顧客が商品やサービスを知り、購入し、使い、アフターサービスを受けるまでの一連の過程で感じる<b>満足、感動、楽しさなどの体験価値</b>のことです。商品の機能や価格（機能的価値）だけでなく、「使って楽しい」「気持ちよく買い物できた」といった<b>感情的・心理的な価値</b>を重視します。
  <b>CEM（Customer Experience Management）</b>：この顧客体験を企業が意識的に設計・管理し、顧客の満足やロイヤルティ（愛着）を高める経営手法です。B.H.シュミットは、体験価値を「感覚・情緒・思考・行動・関係」の5つの側面で捉えました。
reasoning: |
  1. カスタマーエクスペリエンスは「顧客が購入・使用・利用する際に感じる体験価値（満足や感動）」です。
  2. 「顧客が商品・サービスを購入・使用・利用する際の、満足や感動」という<b>ア</b>が正解です。
choices:
  ア: 顧客が商品・サービスを購入・使用・利用する際の満足や感動は、<b>カスタマーエクスペリエンス（顧客体験）</b>です。<b>正解</b>。
  イ: 商品購入時のトラブルは、体験価値を損なう要因の一つではありますが、カスタマーエクスペリエンスそのものの説明ではありません。誤り。
  ウ: 購入数や購入金額などの数値で表される購買履歴は、<b>顧客データ</b>（CRMなどで管理する情報）であり、顧客が感じる体験価値ではありません。誤り。
  エ: 販売員や接客員の重要顧客への対応経験は、<b>従業員側</b>の経験やスキルの話で、顧客の体験価値ではありません。誤り。
example: |
  同じコーヒーでも、自動販売機で買う場合と、居心地の良いカフェで店員さんと会話しながら飲む場合とでは、満足感が違います。この「買う・飲む過程で感じる心地よさ」がカスタマーエクスペリエンスで、それを意識的に作り込むのがCEMです。
review:
  - カスタマーエクスペリエンス＝顧客が購入・使用・利用する過程で感じる満足や感動などの体験価値（感情的価値を重視）。
  - 購買履歴（データ）、従業員の経験、購入時のトラブル（体験を損なう要因）とは区別する。
