q: 74
answer: ウ
category: 企業活動
theme: |
  会議を円滑に進める役割「ファシリテータ」が何をする人かを問う問題です。
basics: |
  <b>ファシリテータ</b>：facilitate（促進する・容易にする）に由来する言葉で、会議やワークショップで<b>中立的な立場</b>から議論を進行し、参加者の意見を引き出し、合意形成を支援する役割です。
  主な役割
  - 参加者全員に<b>発言を促す</b>（一部の人だけが話す状態を防ぐ）。
  - 出た意見を整理し、<b>議論の流れを整える</b>（論点のずれを戻す、時間配分を管理する）。
  - 自分の意見で結論を誘導せず、<b>参加者自身が結論を出せるように</b>支える。
reasoning: |
  1. ファシリテータの要点は「中立公平」「発言を促す」「議論を整理する」です。
  2. 「中立公平な立場から、会議の参加者に発言を促したり、議論の流れを整理したりする」という<b>ウ</b>が正解です。
choices:
  ア: 自分の専門領域についてだけ助言を行うのは、<b>専門家（アドバイザ）</b>の役割です。ファシリテータは特定の分野に限らず、議論全体の進行を支援します。誤り。
  イ: 経営層の意向に合致した結論を導くように議論をコントロールするのは、中立性を欠き、ファシリテータの役割に反します。誤り。
  ウ: 中立公平な立場から、参加者に発言を促し、議論の流れを整理するのが、<b>ファシリテータ</b>の役割です。<b>正解</b>。
  エ: 日程調整、資料準備、議事録作成など事務的作業に特化した支援をするのは、<b>事務局（会議の書記・運営担当）</b>の役割です。誤り。
example: |
  クラスの話し合いで、司会役の人が「まだ意見を言っていない人はどう思う？」と声をかけたり、「今は文化祭の出し物の話なので、予算の話は後にしよう」と流れを整えたりするのが、ファシリテータの働きです。自分の好きな案に誘導しないのがポイントです。
review:
  - ファシリテータ＝中立の立場で発言を促し、議論を整理して、参加者による合意形成を支援する役割。
  - 結論を誘導する（イ）、専門分野だけ助言する（ア）、事務作業だけ行う（エ）はファシリテータではない。
