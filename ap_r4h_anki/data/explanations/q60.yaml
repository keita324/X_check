q: 60
answer: ア
category: システム監査
theme: |
  システム監査基準（平成30年）に照らして、監査証拠の入手と評価に関する記述のうち<b>適切でないもの</b>を選ぶ問題です。否定形の問題なので注意が必要です。
basics: |
  <b>監査証拠</b>：監査人が結論を出すための根拠となる情報（文書、記録、ログ、関係者への質問の回答、現場の観察結果など）です。システム監査基準では、<b>十分かつ適切な監査証拠</b>を入手することを求めています。
  <b>予備調査と本調査</b>：まず予備調査で監査対象の実態を把握し、その結果を踏まえて本調査で詳しく監査証拠を集めます。
  <b>監査手続</b>：監査証拠を集めるための具体的な手順（閲覧、質問、観察、突合など）です。1つの監査目的に対して、通常は複数の手続を組み合わせます。
  <b>アジャイル開発</b>：短い期間で開発を繰り返す手法で、形式的な文書を大量に作らないことも多い開発方法です。
reasoning: |
  1. ア：アジャイル開発では、正式な管理用ドキュメントが整っていないことも多いですが、作業記録、会議のメモ、課題管理ツールの記録なども監査証拠として利用できます。「体裁が整っているものだけ」に限るのは<b>適切でない</b>。
  2. イ：委託先の業務について、第三者の保証報告書（外部の専門家が委託先の管理状況を評価した報告書）に依拠できると判断すれば、現地調査を省略できる → 適切。
  3. ウ：本調査の前に予備調査で実態を把握する → 適切。
  4. エ：1つの監査目的に対して複数の監査手続を組み合わせる → 適切。
  5. 適切でないものは<b>ア</b>です。
choices:
  ア: アジャイル開発では、体裁の整った管理用ドキュメントがなくても、開発の実態を示す記録（タスクボード、会議メモ、ツールのログなど）を監査証拠として利用できます。「体裁が整っているものだけ」とするのは<b>適切でない</b>記述です。<b>正解</b>。
  イ: システム監査人が、第三者の保証報告書に依拠できると判断すれば、委託先への現地調査を省略できます。システム監査基準に沿った適切な記述です。
  ウ: 本調査の前に予備調査を行い、監査対象の実態を把握するのは、システム監査の標準的な進め方で適切です。
  エ: 1つの監査目的に対して、通常は複数の監査手続を組み合わせて十分かつ適切な証拠を集めるので、適切です。
example: |
  学校の部活動の活動状況を確認する監査で、「正式な活動報告書」がなくても、練習メニューを書いたホワイトボードの写真や、部員同士の連絡記録から実態を確かめることはできます。形式的な書類がないからといって、証拠がないとは限りません。
review:
  - アジャイル開発の監査では、体裁の整った文書に限らず、実態を示す記録も監査証拠として使える。
  - 第三者の保証報告書への依拠、予備調査→本調査、複数の監査手続の組合せは、いずれも適切な監査の進め方。
  - 「適切でないもの」を選ぶ否定形の問題では、選択肢ごとに○×を付けて確認する。
