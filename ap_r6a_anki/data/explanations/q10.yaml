q: 10
answer: イ
category: コンピュータ構成要素
theme: |
  キャッシュメモリのヒット率とアクセス時間から、CPUから見た平均のメモリアクセス時間（実効アクセス時間）を計算する問題です。
basics: |
  <b>キャッシュメモリ</b>：CPUと主記憶の間にある、小容量で高速なメモリです。
  <b>ヒット率</b>：欲しいデータがキャッシュにあった割合。ない場合（ミス）は主記憶まで取りに行きます。

  <b>実効アクセス時間の公式</b>
  | 実効アクセス時間 ＝ キャッシュの時間 × ヒット率 ＋ 主記憶の時間 × (1 − ヒット率)
  （ヒットしたときとミスしたときの時間の、割合に応じた平均）
reasoning: |
  1. 主記憶のアクセス時間を <b>1</b> とおくと、キャッシュのアクセス時間は <b>1/30</b> です。
  2. 公式に代入します。
  | 実効アクセス時間 ＝ (1/30) × 0.95 ＋ 1 × (1 − 0.95)
  | ＝ 0.95 ÷ 30 ＋ 0.05
  | ≒ 0.0317 ＋ 0.05
  | ≒ 0.0817 → 約 <b>0.08</b>
  3. 主記憶の時間を1としたので、この値がそのまま「主記憶の何倍か」を表します。正解は<b>イ</b>です。
choices:
  ア: 0.03は、キャッシュにヒットした分（約0.0317）だけで、ミスしたときに主記憶へアクセスする分（0.05）を足し忘れた値です。誤り。
  イ: 0.08。(1/30)×0.95＋1×0.05≒0.0817 で、計算結果と一致します。<b>正解</b>。
  ウ: 0.37は、計算結果の約0.08と一致しません。誤り。
  エ: 0.95はヒット率そのものです。アクセス時間ではありません。誤り。
example: |
  よく使う文房具を机の引き出し（キャッシュ）に入れておくと、95%は引き出しから1秒で取り出せ、残り5%だけ倉庫（主記憶、30秒）まで取りに行くことになります。平均すると 1×0.95＋30×0.05＝2.45秒で、毎回倉庫に行く（30秒）場合の約0.08倍で済みます。
review:
  - 実効アクセス時間＝キャッシュ時間×ヒット率＋主記憶時間×（1−ヒット率）。
  - 主記憶の時間を1とおくと「主記憶の何倍か」がそのまま求まる。
  - ミスした分（1−ヒット率）の主記憶アクセスを足し忘れない。
