q: 55
answer: ウ
category: サービスマネジメント
theme: |
  障害からの復旧目標を表す「RTO（目標復旧時間）」と「RPO（目標復旧時点）」の意味を理解し、バックアップを取る間隔を決める問題です。
basics: |
  <b>RTO（Recovery Time Objective：目標復旧時間）</b>：障害が発生してから、システムを<b>何時間以内に</b>復旧させるかの目標です。「どれだけ長く止まってよいか」を表します。
  <b>RPO（Recovery Point Objective：目標復旧時点）</b>：障害が起きたとき、<b>どの時点の状態までデータを戻せればよいか</b>の目標です。「どれだけのデータを失ってよいか」を表します。
  RPO＝12時間前なら、障害発生時刻の12時間前までのデータは必ず復元できる必要があります（失ってよいのは直近12時間分まで）。

  バックアップから復元できるのは、<b>最後にバックアップを取った時点</b>のデータです。
reasoning: |
  1. RPOを守るには、障害がいつ起きても、最後のバックアップが「12時間前より新しい」必要があります。
  2. バックアップをT時間ごとに取ると、障害が次のバックアップの直前に起きた場合、最後のバックアップは約T時間前のものです。
  3. これが12時間以内であるためには、T ≦ 12。つまりバックアップは<b>最長でも12時間ごと</b>に取得する必要があります。
  4. RTO（3時間）は「復旧作業にかけてよい時間」の目標で、バックアップの取得間隔とは直接関係しません。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 3時間はRTO（目標復旧時間）の値です。復旧にかけてよい時間であり、バックアップの間隔を決めるものではありません。誤り。
  イ: 9時間は、RPOの12時間からRTOの3時間を引いた値です。RTOはバックアップ間隔とは関係がないので、引く必要はありません。誤り。
  ウ: 12時間。RPO（12時間前）を満たすには、少なくとも12時間ごとにバックアップを取得すればよいので、最長は12時間です。<b>正解</b>。
  エ: 15時間は、RPOとRTOを足した値です。15時間ごとでは、障害時に最大15時間分のデータを失い、RPO（12時間）を守れません。誤り。
example: |
  ゲームのセーブに例えると、RPO＝「最悪でも何時間前のセーブデータから再開できればよいか」、RTO＝「停電後、何時間以内にゲームを再開できればよいか」です。「12時間前までの進行は失いたくない」なら、少なくとも12時間ごとにセーブする必要があります。
review:
  - RPO（目標復旧時点）＝失ってよいデータの時間幅。バックアップ間隔はRPO以下にする。
  - RTO（目標復旧時間）＝停止してよい時間。バックアップ間隔の計算には使わない（足したり引いたりしない）。
