q: 36
answer: ア
category: ネットワーク
theme: |
  同じLANにあるプリンターのMACアドレスを、PCから調べるときに使うコマンドを選ぶ問題です。ARPの仕組みと、各ネットワークコマンドの用途がポイントです。
basics: |
  <b>MACアドレス</b>：ネットワーク機器ごとに割り当てられた固有の番号で、同じLAN内での通信に使います。
  <b>ARP（Address Resolution Protocol）</b>：IPアドレスから、そのIPアドレスをもつ機器のMACアドレスを調べるプロトコルです。PCは、調べた結果を一定時間<b>ARPテーブル（ARPキャッシュ）</b>に保存しておきます。
  主なネットワークコマンド
  - <b>arp</b>（arp -a）：PCのARPテーブルを表示する。直前に通信した相手の<b>IPアドレスとMACアドレスの対応</b>が分かる。
  - <b>ipconfig</b>（Windows）／<b>ifconfig</b>（UNIX系）：<b>自分のPC</b>のIPアドレスやMACアドレスなどの設定を表示する。
  - <b>netstat</b>：自分のPCの通信の接続状況や、待ち受けているポートなどを表示する。
  - <b>ping</b>：相手に届くか（疎通）と応答時間を確認する。MACアドレスは表示しない。
reasoning: |
  1. PCは直前にプリンターを使っているので、通信の際に ARP でプリンターのMACアドレスを調べ、ARPテーブルに保存しています。
  2. arpコマンドでARPテーブルを表示すれば、プリンターのIPアドレスに対応するMACアドレスが分かります。
  3. 正解は<b>ア</b>です。
choices:
  ア: arpコマンドでARPテーブルを表示すると、直前に通信したプリンターのIPアドレスとMACアドレスの対応が確認できます。<b>正解</b>。
  イ: ipconfig／ifconfigは、自分のPCのネットワーク設定（自分のIPアドレスやMACアドレス）を表示するコマンドで、相手のプリンターのMACアドレスは分かりません。誤り。
  ウ: netstatは、自分のPCの通信の接続状況や待ち受けポートを表示するコマンドで、相手のMACアドレスは表示しません。誤り。
  エ: pingは、相手に届くかどうかと応答時間を確認するコマンドで、MACアドレスは表示しません（pingの後にarpを使えば確認できます）。誤り。
example: |
  arpテーブルは、PCの中の「最近やり取りした相手の住所録」のようなものです。「192.168.1.50（プリンター）の部屋番号はAA-BB-CC-…」と控えてあるので、arp -a で一覧を見れば、プリンターのMACアドレスが分かります。
review:
  - 相手のMACアドレスはarpコマンド（ARPテーブル）で確認する。直前に通信していればテーブルに残っている。
  - ipconfig/ifconfig（自分の設定）、netstat（接続状況）、ping（疎通確認）と用途を区別する。
