q: 76
answer: イ
category: 業務分析・データ利活用
theme: |
  事前分布・事後分布という考え方に基づく「ベイズ統計」の説明を、貿易統計・記述統計などの説明と区別する問題です。
basics: |
  <b>ベイズ統計</b>：「ベイズの定理」に基づく統計の考え方です。最初に持っている見込み（<b>事前確率・事前分布</b>）を、新しく得られたデータで更新し、より確からしい見込み（<b>事後確率・事後分布</b>）を求めます。
  | 事前の見込み ＋ 新しいデータ → 更新された見込み（事後）
  データが増えるたびに推定を更新できるため、<b>機械学習</b>や<b>迷惑メールフィルター</b>（ベイジアンフィルター）などで利用されています。
  比較される統計
  - <b>記述統計</b>：集めたデータの平均値・中央値・最頻値、度数分布表、ヒストグラムなどで、データの特徴を要約する。
  - <b>貿易統計</b>：輸出入の実態を把握するために国が作成する統計。
reasoning: |
  1. ベイズ統計のキーワードは「<b>事前分布・事後分布</b>」「確率の考え方」「機械学習・迷惑メールフィルター」です。
  2. これらを含むのは<b>イ</b>です。
  3. ウは記述統計、アは貿易統計の説明です。正解は<b>イ</b>です。
choices:
  ア: 国際条約に基づいて貿易の実態を把握し、経済政策などの資料とする指標を作成するのは、貿易統計の説明です。誤り。
  イ: 事前分布・事後分布といった確率の考え方に基づいて体系化され、機械学習や迷惑メールフィルターなどに利用されているのが、<b>ベイズ統計</b>です。<b>正解</b>。
  ウ: 平均値・中央値・最頻値を求めたり、度数分布表やヒストグラムを作成してデータの特徴を捉えたりするのは、記述統計の説明です。誤り。
  エ: ベイズ統計は、分析対象をオープンデータに限定する手法ではありません。対象データの種類を限定することは、ベイズ統計の特徴と無関係です。誤り。
example: |
  迷惑メールフィルターは、最初「メールの20%が迷惑メール」という事前の見込みを持っています。そこに「無料」「当選」という単語が含まれているという新しい情報が加わると、「このメールが迷惑メールである確率は90%」のように見込みを更新します。これがベイズ統計の考え方です。
review:
  - ベイズ統計＝事前分布をデータで更新して事後分布を求める。機械学習や迷惑メールフィルターに利用。
  - 平均値・ヒストグラムなどでデータを要約するのは記述統計。
