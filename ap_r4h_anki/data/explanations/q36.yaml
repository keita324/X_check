q: 36
answer: エ
category: セキュリティ
theme: |
  複数のWebサービスの間でログイン情報を安全に受け渡し、シングルサインオンを実現するための仕様「SAML」が何かを問う問題です。
basics: |
  <b>認証</b>：「あなたは本当に本人か」を確かめること（ログイン）。
  <b>認可</b>：認証された人に「何をしてよいか」の権限を与えること。
  <b>シングルサインオン（SSO）</b>：一度ログインすれば、連携している複数のサービスを、改めてログインせずに使える仕組みです。

  <b>SAML（Security Assertion Markup Language）</b>：XMLをベースにした、<b>認証・認可に関する情報（アサーション＝「この人はログイン済みです」という証明）を、異なるシステムやサービスの間で交換するための仕様</b>です。ログインを担当するサービス（IdP）が発行した証明を、各サービス（SP）が受け取って利用者を信頼します。
reasoning: |
  1. 名前の「Security Assertion（セキュリティに関する主張・証明）」が示すとおり、SAMLは「この利用者は認証済みで、こういう権限がある」という情報をやり取りするための仕様です。
  2. 「認証や認可に関する情報を交換するための仕様」という<b>エ</b>が正解です。
choices:
  ア: システムの負荷や動作状況に関する情報を送信するための仕様は、SNMP（ネットワーク機器の監視）やsyslog（ログの転送）などです。誤り。
  イ: 脆弱性に関する情報や脅威情報を交換するための仕様は、STIX（脅威情報の記述形式）やTAXII（その交換手順）などです。誤り。
  ウ: 通信を暗号化してVPNを実装するための仕様は、IPsecなどです。誤り。
  エ: 認証や認可に関する情報を交換するための仕様は<b>SAML</b>です。シングルサインオンの実現に使われます。<b>正解</b>。
example: |
  会社の社員証で、本社でも支社でも食堂でも入れるようにする仕組みに似ています。受付（IdP）で一度本人確認をすると「この人は社員です」という証明（アサーション）が発行され、各施設（SP）はその証明を信用して入館を許可します。社内システムにログインすると、別のクラウドサービスにもそのまま入れるのはSAMLのおかげです。
review:
  - SAML＝認証・認可情報（アサーション）をサービス間で交換するXMLベースの仕様。シングルサインオンに使う。
  - SNMP/syslog（稼働状況）、STIX/TAXII（脅威情報）、IPsec（VPN）と区別する。
