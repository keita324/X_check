q: 58
answer: ア
category: システム監査
theme: |
  システム監査で使う技法のうち、データの発生から活用までの流れと、そこに組み込まれたコントロール（管理の仕組み）を追いかけて確かめる「ウォークスルー法」を選ぶ問題です。
basics: |
  <b>監査技法</b>：監査人が監査証拠を集めるための手法です（システム監査基準の解説などに例示）。
  - <b>ウォークスルー法</b>：データの<b>生成から入力、処理、出力、活用まで</b>の一連のプロセスと、そこに組み込まれた<b>コントロール</b>（入力チェック、承認など）を、<b>書面上で、又は実際に追跡</b>して確かめる技法。
  - <b>チェックリスト法</b>：監査人が作成したチェックリストに、監査対象部門が回答する形で調べる技法。
  - <b>突合・照合法</b>：関連する複数の記録（伝票と帳簿、システムの出力など）を突き合わせて、内容が一致しているかを確かめる技法。
  - <b>ドキュメントレビュー法</b>：規程、マニュアル、設計書などの文書を閲覧して調べる技法。
  ※ソフトウェア開発のレビュー手法にも「ウォークスルー」がありますが、ここでは監査技法のウォークスルー法を指しています。
reasoning: |
  1. 問題文のキーワードは「データの生成から入力、処理、出力、活用までのプロセス」「組み込まれているコントロール」「書面上で、又は実際に追跡する」です。
  2. これは<b>ウォークスルー法</b>です。正解は<b>ア</b>です。
choices:
  ア: データの生成から活用までのプロセスと組み込まれたコントロールを、書面上で又は実際に追跡するのは、<b>ウォークスルー法</b>です。<b>正解</b>。
  イ: チェックリスト法は、監査人が作成したチェックリストに監査対象部門が回答する方法で、プロセスを追跡する技法ではありません。誤り。
  ウ: 突合・照合法は、関連する記録を突き合わせて一致しているかを確かめる技法です。誤り。
  エ: ドキュメントレビュー法は、規程やマニュアル、設計書などの文書を閲覧して調べる技法です。誤り。
example: |
  1枚の注文書が、受付→システム入力→在庫引当→出荷→請求と流れていく道筋を、監査人がその書類と一緒に「歩いてたどる（walk through）」イメージです。途中の「上司の承認印」や「入力チェック」がちゃんと機能しているかも、たどりながら確かめます。
review:
  - ウォークスルー法＝データの生成〜活用のプロセスと組み込まれたコントロールを、書面上又は実際に追跡する監査技法。
  - チェックリスト法（質問票への回答）、突合・照合法（記録の突き合わせ）、ドキュメントレビュー法（文書の閲覧）と区別する。
