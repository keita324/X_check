q: 28
answer: ア
category: データベース
theme: |
  SQLで作るビュー（仮想的な表）のうち、ビューを通じてデータを更新（挿入・更新・削除）できるもの（更新可能なビュー）を選ぶ問題です。
basics: |
  <b>ビュー</b>：SELECT文の結果を、あたかも1つの表のように扱えるようにしたものです。実際のデータは元の表（<b>基底表</b>）にあります。
  <b>更新可能なビュー</b>：ビューに対してUPDATEなどを実行したとき、その変更を<b>基底表のどの行のどの列に反映すればよいかが一意に決まる</b>ビューです。
  次のようなビューは、ビューの1行が基底表のどの行に対応するか決められないため、一般に<b>更新できません</b>。
  - <b>DISTINCT</b>（重複除去）を使っている：ビューの1行が、基底表の複数の行をまとめたものになる。
  - <b>GROUP BY</b> や <b>集合関数</b>（SUM、AVG、COUNTなど）を使っている：集計結果は、基底表の特定の行に対応しない。
  単一の表から、行を条件で絞り込み、列をそのまま選んだだけのビューは、更新可能です。
reasoning: |
  1. ア：商品表から、商品単価＞1000 の行を選び、列をそのまま取り出しているだけ → ビューの各行が基底表の1行に対応するので<b>更新可能</b>。
  2. イ：SELECT DISTINCT → 重複を除いた結果で、基底表の行と1対1に対応しない → 更新不可。
  3. ウ：SUM と GROUP BY → 集計結果なので、基底表の行と対応しない → 更新不可。
  4. エ：AVG（集合関数）→ 集計結果なので更新不可。
  5. 正解は<b>ア</b>です。
choices:
  ア: 単一の表から条件で行を選び、列をそのまま取り出したビューなので、ビューの行が基底表の行に1対1で対応し、更新可能です。<b>正解</b>。
  イ: DISTINCTで重複を除いているため、ビューの1行が受注表のどの行に対応するか決まらず、更新できません。誤り。
  ウ: GROUP BYとSUMで集計しているため、合計値を変更しても、元の受注表のどの行をどう変えればよいか決まらず、更新できません。誤り。
  エ: AVGで平均を求めているため、平均値を変更しても、元のどの行をどう変えればよいか決まらず、更新できません。誤り。
example: |
  クラスの名簿から「身長170cm以上の人」を抜き出した一覧（ア）なら、そこに書かれた山田さんの電話番号を直せば、元の名簿の山田さんの欄を直せます。でも「クラスの平均身長」（エ）を書き換えても、誰の身長をどう直せばよいかは決まりません。
review:
  - 更新可能なビュー＝ビューの各行が基底表の行に一意に対応するもの（単一表からの選択・射影）。
  - DISTINCT、GROUP BY、集合関数（SUM・AVGなど）を含むビューは更新できない。
