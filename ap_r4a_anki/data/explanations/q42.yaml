q: 42
answer: イ
theme: |
  Webアプリケーション専用のファイアウォール「WAF」が防御に役立つ攻撃を選ぶ問題です。WAFが何を検査するのかを理解しているかが問われます。
basics: |
  <b>WAF（Web Application Firewall）</b>：Webサーバ（Webアプリ）の手前に置き、<b>HTTP/HTTPSの通信の中身</b>（URL、入力フォームの値、リクエストの内容など）を検査して、攻撃らしいパターンを遮断する仕組みです。
  通常のファイアウォールが「どの住所（IPアドレス）・どの窓口（ポート番号）からの通信か」を見るのに対し、WAFは「Webの手紙の中身」まで読む点が違います。
  WAFで防ぎやすい攻撃の例：SQLインジェクション、クロスサイトスクリプティング、Web APIの脆弱性を狙った攻撃など。

  <b>REST API</b>：WebアプリがHTTPを使って他のプログラムとデータをやり取りするための窓口（API）の代表的な設計方式です。通信はHTTP/HTTPSで行われます。
reasoning: |
  1. WAFが検査できるのは、HTTP/HTTPSで送られてくるWebアプリ向けのリクエストです。
  2. REST APIはHTTP/HTTPSで呼び出されるので、APIの脆弱性を狙った不正なリクエストはWAFで検知・遮断できます。
  3. DNS（ア）、SMTP（ウ）、電子メール（エ）は、Web（HTTP）以外のプロトコルによる攻撃なので、WAFの守備範囲外です。
  4. 正解は<b>イ</b>です。
choices:
  ア: DNSキャッシュポイズニングは、DNSサーバに偽の情報を覚えさせて利用者を偽サイトに誘導する攻撃です。DNSのプロトコルを使うので、HTTPを検査するWAFでは防げません。対策はDNSSECやDNSサーバの設定です。誤り。
  イ: REST APIはHTTP/HTTPSで提供されるため、APIの脆弱性を狙った攻撃はWAFで防御できます。<b>正解</b>。
  ウ: SMTPサーバの第三者中継（オープンリレー）の悪用は、メールサーバの設定の問題です。対策はメールサーバで中継を制限することで、WAFの対象ではありません。誤り。
  エ: 電子メール爆弾（大量のメールを送りつけてメールボックスやサーバをパンクさせる攻撃）はメールの通信で行われるため、WAFでは防げません。誤り。
example: |
  WAFは、Webショップの入口にいる「注文書チェック係」のようなものです。注文書（HTTPリクエスト）の記入内容に不審な命令文が書かれていないかを読んで、怪しいものを止めます。ただし、郵便受け（メール）や電話帳（DNS）への攻撃は、この係の担当外です。
review:
  - WAF＝HTTP/HTTPSの中身を検査してWebアプリ（Web APIを含む）への攻撃を防ぐ。
  - DNS・SMTP・メールなどWeb以外のプロトコルへの攻撃は、WAFの対象外。
