q: 47
answer: ウ
category: システム開発技術
theme: |
  システムを小さな独立したサービスの組合せで作る「マイクロサービスアーキテクチャ」の利点を問う問題です。何が得意で、何が苦手かを区別します。
basics: |
  <b>モノリシック（一枚岩）なシステム</b>：すべての機能を1つの大きなプログラムとして作る方式。一部を直しても全体をテスト・リリースし直す必要があります。
  <b>マイクロサービスアーキテクチャ</b>：システムを、機能ごとの<b>小さな独立したサービス</b>（例：注文サービス、在庫サービス、決済サービス）に分け、サービス同士はAPI（ネットワーク経由の呼出し）で連携して動かす方式です。
  利点
  - 各サービスを<b>独立して変更・デプロイ（リリース）</b>できる。1つのサービスの変更が他に影響しにくい。
  - サービスごとに、適した<b>プログラム言語やミドルウェアを自由に選べる</b>。
  - 負荷の高いサービスだけを増やす（スケールさせる）ことができる。
  苦手な点
  - 各サービスが自分のデータをもつので、<b>サービスをまたいだデータの整合性の確保が難しい</b>。
  - サービス間の呼出しがネットワーク経由で<b>回数も増える</b>ので、通信のオーバーヘッドが増える。
reasoning: |
  1. ア：サービスごとに言語やミドルウェアを自由に選べるのが特徴で、統一しやすいわけではない → ×。
  2. イ：データがサービスごとに分散するので、整合性の確保はむしろ難しくなる → ×。
  3. ウ：各サービスが独立しているので、個別に変更しやすい → ○（利点）。
  4. エ：サービス同士の呼出しが増え、通信のオーバーヘッドは増える → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: マイクロサービスでは、サービスごとに適したプログラム言語やライブラリ、ミドルウェアを選べるのが特徴で、統一しやすくなるわけではありません。誤り。
  イ: 各サービスがそれぞれデータを保有するため、サービス間でデータの整合性を確保するのはむしろ難しくなります。誤り。
  ウ: 各サービスが独立しているので、1つのサービスを他に影響を与えずに変更しやすいのが、マイクロサービスの利点です。<b>正解</b>。
  エ: 機能を細かいサービスに分けると、サービス間の呼出し回数が増え、ネットワーク通信のオーバーヘッドは増加します。誤り。
example: |
  フードコートに例えると、モノリシックは「1つの大きな厨房で全メニューを作るレストラン」で、メニューを1つ変えるにも厨房全体を止めることになりがちです。マイクロサービスは「ラーメン店、カレー店、クレープ店が並ぶフードコート」で、ラーメン店だけ改装しても他の店は営業を続けられます。ただし、お店をまたいだセット注文の管理（データの整合性）は難しくなります。
review:
  - マイクロサービスの利点＝サービスごとに独立して変更・リリース・スケールでき、技術も個別に選べる。
  - 苦手な点＝サービス間のデータ整合性の確保、呼出し増加による通信オーバーヘッド。
