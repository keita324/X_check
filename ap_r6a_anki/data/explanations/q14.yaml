q: 14
answer: イ
category: システム構成要素
theme: |
  稼働率が等しい装置Xを直列・並列に組み合わせた3つのシステムA、B、Cの稼働率を式で表し、高い順に並べる問題です。
basics: |
  装置Xの稼働率を x（0＜x＜1）とします。
  - <b>直列接続</b>：すべてが動かないとシステムが動かない → 稼働率は<b>掛け算</b>。
  | 直列2台：x × x ＝ x<sup>2</sup>
  - <b>並列接続</b>：どれか1つ動けばよい → 「全部止まる確率」を1から引く。
  | 並列2台：1 − (1 − x)<sup>2</sup> ＝ 2x − x<sup>2</sup>
reasoning: |
  <b>(1) 各システムの稼働率</b>
  | A（Xの並列2台）：2x − x<sup>2</sup>
  | B（X 1台と、Xの並列2台を直列）：x × (2x − x<sup>2</sup>) ＝ 2x<sup>2</sup> − x<sup>3</sup>
  | C（Xの直列2台を、2組並列）：1 − (1 − x<sup>2</sup>)<sup>2</sup> ＝ 2x<sup>2</sup> − x<sup>4</sup>
  <b>(2) 比較する（差を取る）</b>
  | C − B ＝ (2x<sup>2</sup> − x<sup>4</sup>) − (2x<sup>2</sup> − x<sup>3</sup>) ＝ x<sup>3</sup> − x<sup>4</sup> ＝ x<sup>3</sup>(1 − x) ＞ 0 → C ＞ B
  | A − C ＝ (2x − x<sup>2</sup>) − (2x<sup>2</sup> − x<sup>4</sup>) ＝ x(x − 1)<sup>2</sup>(x ＋ 2) ＞ 0 → A ＞ C
  <b>(3) 数値で確認</b>（x ＝ 0.9）
  | A ＝ 1 − 0.01 ＝ 0.99
  | C ＝ 1 − (1 − 0.81)<sup>2</sup> ＝ 1 − 0.0361 ＝ 0.9639
  | B ＝ 0.9 × 0.99 ＝ 0.891
  高い順は <b>A、C、B</b> で、正解は<b>イ</b>です（x＝0.5 などほかの値でも同じ順になります）。
choices:
  ア: A、B、C の順では、B と C の大小が逆です。C − B ＝ x<sup>3</sup>(1 − x) ＞ 0 なので、C の方が高くなります。誤り。
  イ: A、C、B。A＞C＞B が、どの x（0＜x＜1）でも成り立ちます。<b>正解</b>。
  ウ: C、A、B では、A と C の大小が逆です。A − C ＝ x(x − 1)<sup>2</sup>(x ＋ 2) ＞ 0 なので、A の方が高くなります。誤り。
  エ: C、B、A は、並列2台だけで構成された A が最も低いとしており、計算結果と逆です。誤り。
example: |
  A は「2本の橋のどちらかが通れればよい」道、B は「必ず通る1本の橋の先に、2本の橋がある」道、C は「2本の橋を続けて渡るルートが2つある」道です。必ず通らなければならない橋が1本でもあると（B）、そこが弱点になって全体の通りやすさが下がります。
review:
  - 直列の稼働率は積、並列の稼働率は 1−(1−x)<sup>n</sup>。各構成を式で表し、差を取るか具体的な値で比較する。
  - 必ず通過する1台（単一障害点）があると稼働率は下がる（B が最も低い）。
