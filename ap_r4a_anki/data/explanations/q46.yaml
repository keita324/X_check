q: 46
answer: ア
theme: |
  仕様書やソースコードを、作成者を含む複数人で机上で追いかけて問題点を見つけるレビュー手法「ウォークスルー」を選ぶ問題です。
basics: |
  <b>レビュー</b>：プログラムを実際に動かす前に、設計書やソースコードを人が読んで誤りを見つける活動です。早い段階で誤りを見つけるほど、修正の手間が小さくて済みます。
  <b>ウォークスルー</b>：作成者が主体となり、複数人で成果物を前に「この入力ならこう処理されて…」と<b>処理の流れを机上でシミュレーション（追跡）</b>しながら、問題点を探すレビュー手法です。

  <b>テストの用語</b>（他の選択肢）
  - <b>トップダウンテスト</b>：上位のモジュールから順に結合していく結合テストの方法。未完成の下位モジュールの代わりに<b>スタブ</b>（仮の部品）を使う。
  - <b>ボトムアップテスト</b>：下位のモジュールから順に結合する方法。上位の代わりに<b>ドライバ</b>を使う。
  - <b>サンドイッチテスト</b>：トップダウンとボトムアップを組み合わせ、上下両方から結合する方法。
  - <b>並行シミュレーション</b>：システム監査の技法で、監査人が用意したプログラムと本番のプログラムに同じデータを処理させ、結果を比べる方法。
reasoning: |
  1. 問題文のキーワードは「作成者を含めた複数人」「振る舞いを<b>机上で</b>シミュレート」「問題点を発見」。
  2. コンピュータで実行するテストではなく、人が机上で処理の流れをたどるレビュー手法なので、<b>ウォークスルー</b>です。
  3. 正解は<b>ア</b>です。
choices:
  ア: ウォークスルーは、作成者を含む複数人で成果物の振る舞いを机上で追跡し、問題点を発見するレビュー手法です。<b>正解</b>。
  イ: サンドイッチテストは、上位・下位の両方向からモジュールを結合していく<b>結合テスト</b>の手法で、実際にプログラムを動かして行います。誤り。
  ウ: トップダウンテストは、上位モジュールから順に結合していく<b>結合テスト</b>の手法です。机上のレビューではありません。誤り。
  エ: 並行シミュレーションは、<b>システム監査</b>で、監査人のプログラムと本番プログラムの処理結果を比較する技法です。誤り。
example: |
  旅行の計画書を、家族みんなで「朝8時に出発して、ここで電車に乗り換えて…あれ、この乗り換えは3分しかないよ」と、地図の上で指でたどりながら確認するのがウォークスルーです。実際に出かける（プログラムを実行する）前に、問題を見つけられます。
review:
  - ウォークスルー＝作成者を含む複数人で、成果物の処理の流れを机上でたどって問題点を見つけるレビュー。
  - トップダウン／ボトムアップ／サンドイッチは結合テストの方式、並行シミュレーションは監査技法、と分類する。
