q: 76
answer: ア
category: 企業活動
theme: |
  製品を作るのにかかった費用（製造原価）に含める「経費」として、どの費用が該当するかを原価計算基準に従って判断する問題です。
basics: |
  <b>原価計算基準</b>：製品の原価をどう計算するかのルールを定めた、日本の会計の基準です。
  <b>製造原価</b>：製品を<b>製造するため</b>にかかった費用で、材料費・労務費・<b>経費</b>からなります。経費には、工場の機械の減価償却費、<b>修繕費</b>、電力料、工場の賃借料などが含まれます。

  原価計算基準では、次のような費用は<b>原価に含めない</b>（<b>非原価項目</b>）とされています。
  - <b>異常な状態</b>を原因とする損失（例：火災・台風などの災害による損失や修繕費）
  - <b>経営目的に関連しない</b>費用（例：投資や賃貸目的の不動産の費用）
  - <b>財務活動</b>の費用（例：借入金の支払利息）
reasoning: |
  1. ア：製品を生産している機械装置の修繕費用は、製品の製造のために通常発生する費用なので、製造原価の経費に算入します → ○。
  2. イ：台風という異常な状態による被害の修繕費用は、非原価項目です → ×。
  3. ウ：賃貸目的で購入した倉庫の管理費用は、製品の製造（経営目的）に関係しないので、非原価項目です → ×。
  4. エ：借入金の支払利息は財務活動の費用で、非原価項目（営業外費用）です → ×。
  5. 正解は<b>ア</b>です。
choices:
  ア: 製品を生産している機械装置の修繕費用は、製造のために通常かかる費用で、製造原価の経費に算入します。<b>正解</b>。
  イ: 台風による被害は異常な状態による損失なので、その修繕費用は原価には算入しません（非原価項目）。誤り。
  ウ: 賃貸目的で購入した倉庫は製造に使われていないので、その管理費用は製造原価には算入しません。誤り。
  エ: 借入金の支払利息は財務活動による費用（営業外費用）で、製造原価には算入しません。誤り。
example: |
  パン屋で考えると、パンを焼くオーブンの修理代はパンの原価に含めます。でも、台風で壊れた倉庫の修理代、副業で貸している駐車場の管理費、お店のローンの利息は、「パンを作るための普段の費用」ではないので、パンの原価には入れません。
review:
  - 製造原価の経費＝製造のために通常発生する費用（機械の修繕費、減価償却費など）。
  - 異常な損失（災害）、経営目的外の費用（賃貸用資産）、財務費用（支払利息）は非原価項目。
