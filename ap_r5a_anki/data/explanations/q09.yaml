q: 9
answer: ウ
category: コンピュータ構成要素
theme: |
  パイプライン処理の性能を上げる技法のうち、分岐の結果が出る前に分岐先を予測して命令を先に実行してしまう「投機実行」を選ぶ問題です。
basics: |
  <b>パイプライン</b>：命令の処理を複数の段階（ステージ）に分け、複数の命令を少しずつずらして重ねて実行する方式です。
  <b>分岐ハザード</b>：「もし〜なら、ここへジャンプ」という分岐命令では、条件の結果が出るまで次にどの命令を実行すべきか分かりません。待っているとパイプラインが止まってしまいます。

  パイプラインの性能を上げる主な技法
  - <b>投機実行</b>：分岐の結果が決まる<b>前に</b>、分岐先を<b>予測</b>して、その先の命令を実行しておく。予測が当たればそのまま使い、外れたら実行結果を捨ててやり直す。
  - <b>遅延分岐</b>：分岐命令の直後に、分岐の結果に関係なく実行してよい命令を置き、待ち時間を有効に使う。
  - <b>アウトオブオーダー実行</b>：命令の順序にこだわらず、実行できる命令から先に実行する。
  - <b>レジスタリネーミング</b>：同じレジスタ名の使い回しによる見かけ上の依存関係を、別の物理レジスタに割り当てて解消する。
reasoning: |
  1. 問題文のキーワードは「分岐条件の結果が決定する<b>前に</b>」「分岐先を<b>予測</b>して命令を実行」です。
  2. これは<b>投機実行</b>の説明です（分岐予測と組み合わせて使われます）。正解は<b>ウ</b>です。
choices:
  ア: アウトオブオーダー実行は、命令の依存関係を見て、実行可能な命令から順序を入れ替えて実行する技法で、分岐先の予測そのものではありません。誤り。
  イ: 遅延分岐は、分岐命令の直後に、分岐結果にかかわらず実行される命令を配置する技法で、分岐先を予測するものではありません。誤り。
  ウ: 分岐条件の結果が決まる前に、分岐先を予測して命令を実行しておくのは投機実行です。<b>正解</b>。
  エ: レジスタリネーミングは、レジスタの使い回しによる見かけ上の依存を解消する技法で、分岐とは関係ありません。誤り。
example: |
  レストランの厨房で、常連さんが席に着いた時点で「いつものカレーだろう」と予想して作り始めるのが投機実行です。予想が当たればすぐに出せ、外れたらそのカレーは使わずに注文の料理を作り直します。
review:
  - 投機実行＝分岐結果の確定前に分岐先を予測して命令を実行し、外れたら結果を破棄する。
  - 遅延分岐（分岐直後に必ず実行する命令を置く）、アウトオブオーダー実行（実行順の入替え）、レジスタリネーミング（依存の解消）と区別する。
