q: 18
answer: エ
category: ソフトウェア
theme: |
  仮想記憶の2つの方式「ページング方式」と「セグメンテーション方式」を比べたときの、ページング方式の長所を問う問題です。
basics: |
  <b>ページング方式</b>：プログラムを、意味とは関係なく<b>固定長</b>の「ページ」に区切って管理する方式です。主記憶も同じ大きさの枠（ページ枠）に区切るので、どの空き枠にもページを置けます。
  <b>セグメンテーション方式</b>：プログラムを、プログラム部・データ部・スタックなど<b>論理的な意味のまとまり</b>（セグメント）ごとに、<b>可変長</b>で管理する方式です。
  それぞれの長所
  | ページング：固定長なので、空き領域が細切れになって使えなくなる<b>外部断片化（外部フラグメンテーション）が発生しない</b>。管理が簡単。
  | セグメンテーション：意味のまとまり単位なので、<b>論理的な単位でのアクセス保護</b>（このセグメントは読取り専用など）や、<b>プログラム間での共用</b>、<b>大きさの動的な変更</b>がしやすい。
reasoning: |
  1. ア・イ・ウは、論理的なまとまりで管理する<b>セグメンテーション方式</b>の長所です。
  2. エ「主記憶の外部断片化が発生しない」は、固定長で管理する<b>ページング方式</b>の長所です。
  3. 正解は<b>エ</b>です。
choices:
  ア: 記憶領域へのアクセス保護を論理的な単位で行えるのは、意味のまとまりで管理する<b>セグメンテーション方式</b>の長所です。誤り。
  イ: 記憶領域をプログラム間で容易に共用できるのも、論理的なまとまり単位で扱える<b>セグメンテーション方式</b>の長所です。誤り。
  ウ: 実行時に記憶領域の大きさを動的に変えられるのは、可変長で管理する<b>セグメンテーション方式</b>の長所です。誤り。
  エ: 固定長のページで管理するので、主記憶の外部断片化が発生しないのは、<b>ページング方式</b>の長所です。<b>正解</b>。
example: |
  駐車場に例えると、ページングは「全区画が同じ大きさの駐車場」で、空いている区画ならどこにでも停められ、中途半端な隙間は生まれません。セグメンテーションは「車の大きさに合わせて区画を切る駐車場」で、ぴったり使えますが、出入りを繰り返すうちに、どの車も入らない小さな隙間が点在するようになります。
review:
  - ページング（固定長）の長所＝外部断片化が発生しない、管理が簡単。
  - セグメンテーション（論理単位・可変長）の長所＝論理単位での保護・共用、大きさの動的変更。
