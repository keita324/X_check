q: 13
answer: ウ
theme: |
  システムの信頼性を高める設計の考え方（フェールセーフ、フェールソフト、フォールトアボイダンス、フォールトトレランス）の意味を区別する問題です。選択肢の説明が少しずつ入れ替えられているのがひっかけです。
basics: |
  <b>フォールト（fault）</b>＝故障・障害、<b>フェール（fail）</b>＝故障して機能を失うこと、と考えると整理しやすくなります。

  - <b>フォールトアボイダンス（故障回避）</b>：部品の品質を上げる、十分にテストするなどして、そもそも<b>故障が起きないようにする</b>考え方。
  - <b>フォールトトレランス（耐故障）</b>：故障は起きるものとして、<b>故障しても機能を維持できる</b>ようにする考え方（装置の二重化など）。
  - <b>フェールセーフ</b>：故障したときに、<b>安全な側</b>に倒れるようにする設計（信号機が故障したら全部赤にするなど）。
  - <b>フェールソフト</b>：故障したときに、一部の機能を止めたり性能を落としたり（<b>縮退</b>）しながらも、<b>運転を続ける</b>設計。
  - <b>フールプルーフ</b>：利用者が<b>誤操作</b>をしても問題が起きないようにする設計（ドアが閉まらないと動かない電子レンジなど）。
reasoning: |
  1. 各選択肢の「用語」と「説明」の組合せが正しいかをチェックします。
  2. ア：誤操作への対策は「フールプルーフ」なのに、フェールセーフと書かれている → ×
  3. イ：フェールソフトは機能を「縮退させて」継続するのに、「縮退させることなく」と書かれている → ×
  4. ウ：フォールトアボイダンス＝個々の品質を高めて故障が起きないようにする → ○
  5. エ：「安全状態に固定」はフェールセーフの説明なのに、フォールトトレランスと書かれている → ×
  6. 正解は<b>ウ</b>です。
choices:
  ア: 利用者の誤操作でシステムが異常終了しないよう、単純なミスを起こさせない設計は<b>フールプルーフ</b>です。フェールセーフではありません。誤り。
  イ: フェールソフトは、故障時に機能を<b>縮退させて</b>（一部をあきらめて）稼働を続ける考え方です。「縮退させることなく」が誤り。機能を落とさずに継続するのはフォールトトレランスに近い考え方です。
  ウ: フォールトアボイダンスは、構成要素の品質を高めて故障そのものを避ける考え方です。<b>正解</b>。
  エ: 故障時にあらかじめ決めた安全状態に固定するのは<b>フェールセーフ</b>の説明です。フォールトトレランスは、冗長化などで故障しても正常に処理を続けられるようにする考え方です。誤り。
example: |
  自動車で考えると、
  - 品質の高い部品を使い、故障しないようにする → フォールトアボイダンス
  - タイヤがパンクしても一定距離を走れるランフラットタイヤ → フェールソフト（速度を落として走行継続）
  - エンジン制御が異常になったら停止させる → フェールセーフ
  - ブレーキを踏まないとエンジンがかからない → フールプルーフ
review:
  - 「アボイダンス＝避ける（故障させない）」「トレランス＝耐える（故障しても動く）」と英語の意味で覚える。
  - フェールセーフ（安全側に倒す）とフェールソフト（縮退して続ける）の違いを具体例で説明できるようにする。
  - 誤操作への対策は「フールプルーフ」であることを覚える。
