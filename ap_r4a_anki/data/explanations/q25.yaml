q: 25
answer: エ
theme: |
  動画の規格名「H.264/MPEG-4 AVC」が何のための技術かを問う問題です。動画の「圧縮方式」と、配信・通信を制御する「プロトコル」などを区別します。
basics: |
  <b>動画の圧縮（符号化）</b>：動画をそのまま保存すると非常に大きなデータになるため、人間の目で気づきにくい情報を省いたり、前後のコマ（フレーム）で変化のない部分を使い回したりして、データ量を大幅に減らします。この仕組みを<b>圧縮符号化方式（コーデック）</b>と呼びます。

  <b>H.264/MPEG-4 AVC</b>：代表的な動画圧縮符号化方式です。2つの標準化団体（ITU-TとISO/IEC）が共同で定めたため、2つの名前が併記されています。ワンセグ放送、Blu-ray、YouTubeなどのインターネット動画で広く使われています。
reasoning: |
  1. H.264/MPEG-4 AVCは、動画データを小さくする「圧縮符号化方式」です。
  2. 配信の制御（どう送るか）や、番組情報（メタデータ）の記述方式ではありません。
  3. 「ワンセグやインターネットで用いられる動画データの圧縮符号化方式」の<b>エ</b>が正解です。
choices:
  ア: インターネットで動画・音声のストリーミング配信を制御する通信方式は、RTSP（Real Time Streaming Protocol）などのプロトコルの説明です。誤り。
  イ: テレビ会議やテレビ電話で双方向のビデオ通信を制御する方式は、H.323やSIPなどの説明です。名前が似ていますが、H.264とは別物です。誤り。
  ウ: テレビの電子番組表（EPG）で番組内容のメタデータ（番組名や出演者などの付加情報）を記述する方式は、H.264の役割ではありません。誤り。
  エ: ワンセグやインターネットで使われる動画データの圧縮符号化方式。H.264/MPEG-4 AVCの説明です。<b>正解</b>。
example: |
  動画ファイルを、引っ越しの荷物に例えると、H.264は「荷物を小さく圧縮して梱包する方法」です。トラックでどう運ぶか（配信の制御＝ア・イ）や、段ボールに貼る中身のラベル（メタデータ＝ウ）とは別の話です。
review:
  - H.264/MPEG-4 AVC＝動画の圧縮符号化方式（コーデック）。ワンセグ、Blu-ray、ネット動画で使われる。
  - 配信制御のプロトコル（RTSP）、テレビ会議の通信方式（H.323、SIP）と混同しない。
