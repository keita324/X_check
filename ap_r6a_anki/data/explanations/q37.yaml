q: 37
answer: ウ
category: セキュリティ
theme: |
  企業内のクライアントからクラウドサービスを使うときに、SAML認証（シングルサインオン）がどのように動作するかを問う問題です。パスワードがどこに送られるか（送られないか）がポイントです。
basics: |
  <b>SAML</b>：異なるサービスの間で、認証の結果（「この人はログイン済みです」という証明＝<b>アサーション</b>）を受け渡すための仕様です。シングルサインオンに使われます。
  登場人物
  - <b>認証サーバ（IdP：Identity Provider）</b>：企業内にあり、ディレクトリサービスの利用者IDとパスワードで利用者を認証し、認証結果（アサーション）を発行する。
  - <b>クラウドサービス（SP：Service Provider）</b>：認証結果を受け取り、信頼して利用を許可する。
  <b>SAML認証の流れ（代表的な例）</b>
  1. 利用者がクライアント（ブラウザ）でクラウドサービスにアクセスする。
  2. クラウドサービスは、クライアントを企業内の認証サーバへ<b>リダイレクト</b>する。
  3. 利用者は認証サーバで利用者IDとパスワードを入力して認証を受ける。
  4. 認証サーバは、デジタル署名付きの<b>認証結果（アサーション）</b>を発行し、<b>クライアント経由</b>でクラウドサービスに渡す。
  5. クラウドサービスは署名を検証し、利用を許可する。
  クラウドサービスには、<b>利用者IDやパスワードは送られません</b>。
reasoning: |
  1. SAMLでは、認証サーバが認証を行い、その<b>結果（アサーション）</b>を、ブラウザのリダイレクトなどで<b>クライアント経由</b>でクラウドサービスに送ります。
  2. 「認証サーバから認証結果をクライアント経由でクラウドサービスに送信する」という<b>ウ</b>が正解です。
choices:
  ア: SAMLでは、クラウドサービスが企業内のディレクトリサービスに利用者IDとパスワードを要求することはありません。パスワードは企業内でのみ扱われます。誤り。
  イ: 認証サーバがクラウドサービスに送るのは認証結果（アサーション）で、利用者IDとパスワードそのものは送りません。誤り。
  ウ: 認証サーバから認証結果を、クライアント（ブラウザ）経由でクラウドサービスに送信するのが、SAML認証の動作です。<b>正解</b>。
  エ: パスワードとクラウドサービスからの乱数を組み合わせ、ハッシュ値をクライアントから送るのは、<b>チャレンジレスポンス認証</b>の動作です。誤り。
example: |
  会社の受付（認証サーバ）で社員証を見せて入館証（アサーション）をもらい、それを持って（クライアント経由で）提携先の施設（クラウドサービス）に行けば、施設はあなたの社員証の暗証番号を知らなくても、入館証を見て入れてくれます。
review:
  - SAML＝企業内の認証サーバ（IdP）が認証し、認証結果（アサーション）をクライアント経由でクラウドサービス（SP）に渡す。
  - パスワードはクラウドサービスに送られない。チャレンジレスポンス認証（乱数＋パスワードのハッシュ）とは別の仕組み。
