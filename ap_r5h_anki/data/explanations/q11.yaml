q: 11
answer: ア
category: コンピュータ構成要素
theme: |
  書き換え回数に限りがあるフラッシュメモリ（SSDなど）を長持ちさせる技術「ウェアレベリング」の意味を問う問題です。
basics: |
  <b>フラッシュメモリ</b>：USBメモリやSSDに使われる、電源を切ってもデータが消えないメモリです。データは<b>ブロック単位で消去してから書き込む</b>仕組みで、消去・書込みを繰り返すと素子が劣化するため、<b>ブロックごとの書換え回数に上限</b>があります。

  <b>ウェアレベリング（wear leveling）</b>：wear＝すり減り、leveling＝平らにならす。特定のブロックに書込みが集中すると、そこだけ早く寿命が来てしまうので、<b>書込み先をあちこちに分散</b>させ、各ブロックの書込み回数がなるべく均等になるようにする技術です。これにより、メモリ全体の寿命を延ばせます。
reasoning: |
  1. ウェアレベリングの目的は「書込み回数を均等にして、特定のブロックだけが早く劣化するのを防ぐ」ことです。
  2. 「各ブロックの書込み回数がなるべく均等になるように、物理的な書込み位置を選択する」という<b>ア</b>が正解です。
choices:
  ア: 各ブロックの書込み回数がなるべく均等になるように物理的な書込み位置を選ぶのは、<b>ウェアレベリング</b>です。<b>正解</b>。
  イ: セルに蓄える電子の量を何段階かに分けて、1つのセルに複数ビットを記録するのは、<b>多値記録（MLC・TLCなど）</b>の技術です。誤り。
  ウ: 不良ブロックを検出して、予備の正常なブロックに置き換えるのは、<b>不良ブロック管理（代替処理）</b>です。誤り。
  エ: ブロック単位でデータを消去してから新しいデータを書き込むのは、フラッシュメモリの<b>基本的な書込みの仕組み</b>そのものであり、ウェアレベリングの説明ではありません。誤り。
example: |
  机の天板の同じ場所でばかり作業すると、そこだけ傷んでしまいます。毎日作業する位置を少しずつずらせば、机全体が均等に使われて長持ちします。これがウェアレベリングの考え方です。
review:
  - ウェアレベリング＝書込み位置を分散させ、ブロックごとの書込み回数を均等にしてフラッシュメモリの寿命を延ばす技術。
  - 多値記録（1セルに複数ビット）、不良ブロックの代替、ブロック単位の消去と区別する。
