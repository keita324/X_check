q: 33
answer: イ
category: ネットワーク
theme: |
  ネットワークの疎通確認に使うコマンド「ping」が、どのプロトコルを使っているかを問う問題です。
basics: |
  <b>ping</b>：相手のホスト（コンピュータ）に「届いていますか？」という小さなパケットを送り、返事が返ってくるかどうかで、<b>通信できるか（疎通）</b>と<b>応答時間</b>を確認するコマンドです。
  <b>ICMP（Internet Control Message Protocol）</b>：IPの通信で、エラーの通知や制御用のメッセージをやり取りするプロトコル（ネットワーク層）です。pingは、ICMPの<b>エコー要求（Echo Request）</b>を送り、相手から<b>エコー応答（Echo Reply）</b>が返るかを確かめます。

  他のプロトコル
  - <b>CHAP</b>：チャレンジレスポンス方式でユーザを認証するプロトコル（PPPなどで使用）。
  - <b>SMTP</b>：電子メールを送信・転送するプロトコル。
  - <b>SNMP</b>：ネットワーク機器の状態を監視・管理するプロトコル。
reasoning: |
  1. pingは、ICMPのエコー要求とエコー応答を使って接続を確認します。
  2. 正解は<b>イ</b>です。
choices:
  ア: CHAPは、パスワードを直接送らずに認証するためのプロトコルで、接続確認には使いません。誤り。
  イ: ICMPは、pingがエコー要求・エコー応答を送受信するのに使うプロトコルです。<b>正解</b>。
  ウ: SMTPは、メールの送信・転送に使うプロトコルです。誤り。
  エ: SNMPは、ネットワーク機器の監視・管理に使うプロトコルで、pingで使うものではありません。誤り。
example: |
  pingは、潜水艦のソナーの「ピン」という音が名前の由来とされています。音を出して跳ね返りを聞くように、相手に「やまびこ（エコー）」を送り、返ってくれば「つながっている」、返ってこなければ「どこかで通信が途切れている」と分かります。
review:
  - ping＝ICMPのエコー要求／エコー応答で疎通と応答時間を確認する。ICMPはネットワーク層のプロトコル。
  - CHAP（認証）、SMTP（メール送信）、SNMP（機器の監視・管理）と区別する。
