q: 41
answer: エ
category: セキュリティ
theme: |
  リバースプロキシサーバを使ったシングルサインオン（SSO）で、クライアント証明書や利用者IDが「誰から誰へ」送られるのかを理解しているかを問う問題です。
basics: |
  <b>リバースプロキシサーバ</b>：Webサーバの手前に置かれ、利用者からのアクセスをいったん受け付けて、代わりに奥のWebサーバへ中継するサーバです。
  <b>クライアント証明書</b>：利用者（のPC）が本人であることを証明する電子的な証明書です。利用者のPCにインストールされており、<b>PCから</b>認証する側（サーバ）へ提示します。
  <b>シングルサインオン（SSO）</b>：一度の認証で、複数のサービスを使えるようにする仕組みです。

  <b>リバースプロキシ型SSOの流れ</b>
  1. 利用者のPCが、クライアント証明書をリバースプロキシに提示して認証を受ける。
  2. 認証に成功すると、リバースプロキシが利用者の代わりに、<b>利用者IDなどの情報を付けて</b>各Webサーバへアクセスを中継する。
  3. Webサーバは、リバースプロキシから渡された利用者IDを信頼して処理する。
  こうして、利用者は各Webサーバに個別にログインしなくて済みます。
reasoning: |
  1. クライアント証明書は、利用者のPCが持っていて、PCからリバースプロキシへ送るものです。サーバからPCへ送るものではないので、ア・イは誤りです。
  2. 認証はリバースプロキシで一括して行い、その結果として利用者IDなどの情報をWebサーバへ送るのはリバースプロキシです。PCではありません（ウは誤り）。
  3. 「利用者IDなどの情報をWebサーバに送信するのは、利用者のPCではなく、リバースプロキシサーバである」という<b>エ</b>が正解です。
choices:
  ア: クライアント証明書は利用者のPCにあり、PCから認証のために提示するものです。リバースプロキシがPCへ送信するのではありません。誤り。
  イ: Webサーバがクライアント証明書をPCに送信するのでもありません。証明書はPC側からリバースプロキシへ提示します。誤り。
  ウ: 利用者のPCはリバースプロキシに対して認証を受けるだけで、各Webサーバに直接ID情報を送るわけではありません。誤り。
  エ: 認証済みの利用者IDなどの情報をWebサーバに送るのは、利用者に代わってアクセスを中継するリバースプロキシサーバです。<b>正解</b>。
example: |
  オフィスビルの受付（リバースプロキシ）で社員証（クライアント証明書）を見せると、受付係が各フロアに「〇〇さんが行きます」と連絡（利用者IDの送信）してくれるので、各フロア（Webサーバ）では改めて社員証を見せなくて済む、という仕組みです。
review:
  - クライアント証明書は利用者のPCが持ち、PC→リバースプロキシへ提示する（サーバからPCへ送るものではない）。
  - リバースプロキシ型SSOでは、認証後に利用者IDなどをWebサーバへ送るのはリバースプロキシ。
