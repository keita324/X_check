q: 54
answer: エ
category: プロジェクトマネジメント
theme: |
  プロジェクトのスケジュール短縮技法「ファストトラッキング」の例を、クラッシングや期間延長などと区別する問題です。
basics: |
  スケジュールを短縮する代表的な技法は2つあります。
  - <b>ファストトラッキング</b>：本来は<b>順番に</b>行う作業を、一部<b>重ねて（並行して）</b>進めることで、全体の期間を短縮する。例：設計がすべて終わるのを待たずに、設計が終わったモジュールから順にプログラム開発を始める。手戻りのリスクは増える。
  - <b>クラッシング</b>：作業に<b>資源（人員・設備など）を追加</b>して、所要期間を短縮する。コストは増える。
  そのほか、完了予定日の延期はスケジュールの変更（ベースラインの変更）であって短縮技法ではなく、残業の禁止はコスト削減策です。
reasoning: |
  1. ア：クリティカルパス上の作業に人的資源を追加 → 資源の追加による短縮＝<b>クラッシング</b>。
  2. イ：残業を禁止 → コスト削減策で、スケジュールの短縮ではない。
  3. ウ：完了予定日を延期 → スケジュールの延長で、短縮ではない。
  4. エ：設計が終わったモジュールから順にプログラム開発を始める → 設計と開発を<b>並行して</b>進める＝<b>ファストトラッキング</b>。
  5. 正解は<b>エ</b>です。
choices:
  ア: クリティカルパス上のアクティビティに人的資源を追加して期間を縮めるのは、<b>クラッシング</b>の例です。誤り。
  イ: 承認されていた残業を禁止するのは、コストを削減するための施策で、スケジュール短縮の技法ではありません。誤り。
  ウ: プロジェクトの完了予定日を延期するのは、スケジュールの延長であり、短縮の技法ではありません。誤り。
  エ: 設計が終わったモジュールから順にプログラム開発を実施し、設計と開発を並行させてスケジュールを短縮するのは、<b>ファストトラッキング</b>の例です。<b>正解</b>。
example: |
  料理で、全部の野菜を切り終えてから炒め始めるのではなく、玉ねぎを切り終えたらすぐに炒め始め、その間に人参を切るのがファストトラッキングです。手伝いの人を呼んで同時に切ってもらうのがクラッシングです。
review:
  - ファストトラッキング＝順番に行う作業を並行させて期間を短縮（手戻りリスク増）。
  - クラッシング＝資源を追加して期間を短縮（コスト増）。延期やコスト削減策は短縮技法ではない。
