q: 66
answer: エ
category: 経営戦略マネジメント
theme: |
  半導体業界の「ファウンドリーサービス」が何かを、フランチャイズ・垂直統合型の企業・ファブレス企業の説明と区別する問題です。
basics: |
  半導体業界では、設計と製造の分業が進んでいます。
  - <b>ファウンドリー</b>：自社製品は持たず、<b>他社からの製造委託を受けて</b>半導体製品を<b>製造</b>する企業やサービス。多くの顧客の注文をまとめて生産し、最新の高価な製造設備を効率よく使う。
  - <b>ファブレス</b>：製造設備（fab）を持たず、半導体製品の<b>企画・設計・開発</b>に専念し、製造はファウンドリーに委託する企業。
  - <b>垂直統合型（IDM）</b>：企画・設計から製造・販売までを<b>自社で一貫して</b>行う企業。
  - <b>フランチャイズ</b>：本部が加盟店に、商号や商標の使用権と一定地域での販売権などを与え、対価を受け取る仕組み。
reasoning: |
  1. ファウンドリーのキーワードは「他社からの製造委託を受けて、製造を行う」ことです。
  2. 「他社からの製造委託を受けて、半導体製品の製造を行う」という<b>エ</b>が正解です。
choices:
  ア: 商号や商標の使用権とともに、一定地域内での独占販売権を与えるのは、<b>フランチャイズ</b>の説明です。誤り。
  イ: 企画・設計から製造までを自社で一貫して行い、自社ブランドで販売するのは、<b>垂直統合型</b>の企業の説明です。誤り。
  ウ: 製造設備を持たず、企画・設計・開発を専門に行うのは、<b>ファブレス</b>企業の説明です。ファウンドリーはその製造を引き受ける側です。誤り。
  エ: 他社からの製造委託を受けて半導体製品の製造を行うのは、<b>ファウンドリーサービス</b>です。<b>正解</b>。
example: |
  出版に例えると、本の企画・編集をする出版社がファブレス、さまざまな出版社から注文を受けて印刷だけを請け負う大きな印刷会社がファウンドリーです。編集から印刷・販売まで全部自社で行う出版社は垂直統合型です。
review:
  - ファウンドリー＝他社から製造委託を受けて半導体を製造する（製造専門）。
  - ファブレス（設計専門・製造は委託）、垂直統合型（一貫して自社）、フランチャイズ（商標・販売権の供与）と区別する。
