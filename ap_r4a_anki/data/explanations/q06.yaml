q: 6
answer: エ
theme: |
  流れ図（フローチャート）の処理を追いかけて、それがどの整列（ソート）アルゴリズムかを見分ける問題です。
basics: |
  <b>整列（ソート）</b>：バラバラに並んだデータを小さい順（昇順）などに並べ替える処理です。
  <b>配列 A[i]</b>：番号付きの箱が並んだもの。A[1]が1番目、A[n]が最後の箱です。

  <b>ループ端の書き方</b>：「i：1, 1, n−1」は「iを1から始めて1ずつ増やし、n−1まで繰り返す」。「j：n, −1, i+1」は「jをnから始めて1ずつ減らし、i+1まで繰り返す」という意味です（図の注記）。
  <b>交換（スワップ）</b>：「w←A[j]、A[j]←A[j−1]、A[j−1]←w」は、作業用の変数wを使ってA[j]とA[j−1]の中身を入れ替える定番の手順です。

  <b>代表的なソート</b>
  - バブルソート：<b>隣どうし</b>を比べて、順序が逆なら交換、を繰り返す。
  - 選択ソート：残りの中から最小値を<b>探して</b>、先頭と1回だけ交換する。
  - 挿入ソート：整列済みの部分に、新しい要素を適切な位置へ<b>差し込む</b>。
  - クイックソート：基準値（ピボット）より小さいグループと大きいグループに<b>分割</b>し、それぞれを再帰的に整列する。
reasoning: |
  1. 比較しているのは A[j] と A[j−1]、つまり<b>隣り合う2つ</b>です。
  2. A[j] ＜ A[j−1]（後ろの方が小さい＝順序が逆）なら交換し、そうでなければ何もしません。
  3. jは n から i+1 まで後ろから前へ動くので、小さい値が交換のたびに1つずつ前へ移動し、ループ2が1回終わると、範囲内の最小値が A[i] に到達します（泡が浮かび上がるイメージ）。
  4. ループ1で i を1つずつ進め、まだ整列していない範囲で同じことを繰り返します。
  5. 具体例：A=[3,1,2]（n=3）。i=1のとき、j=3：A[3]=2＜A[2]=1？いいえ。j=2：A[2]=1＜A[1]=3？はい→交換して[1,3,2]。i=2のとき、j=3：2＜3→交換して[1,2,3]。完成。
  6. 「隣どうしの比較と交換を繰り返す」のはバブルソートなので、正解は<b>エ</b>です。
choices:
  ア: クイックソートは、基準値（ピボット）でデータを2つのグループに分け、それぞれを再帰的に整列します。流れ図には基準値の選択や分割の処理がないので誤り。
  イ: 選択ソートは、最小値の位置を探し終えてから1回だけ交換します。流れ図は比較のたびに隣と交換しているので誤り。
  ウ: 挿入ソートは、未整列部分から要素を1つ取り出し、それを<b>整列済みの部分</b>の正しい位置まで差し込みます（差し込む位置が決まった時点でその要素の処理は終わり）。この流れ図の内側のループは、配列の末尾nから i+1 まで<b>未整列の部分全体</b>を必ず最後まで走査して最小値を前へ運んでおり、挿入ソートの動きではありません。誤り。
  エ: 隣り合う要素を比較し、逆順なら交換する処理を繰り返すので<b>バブルソート</b>です。<b>正解</b>。
example: |
  背の順に並ぶとき、列の後ろから順に「隣の人と比べて、自分の方が低ければ前の人と入れ替わる」を繰り返すと、一番背の低い人が先頭へ浮かび上がってきます。これを何周か繰り返すのがバブルソートです。
review:
  - 「隣どうし（A[j]とA[j−1]）を比較して交換」が出てきたらバブルソートと判断する。
  - 選択ソート（最小値を探してから1回交換）、挿入ソート（差し込む）、クイックソート（基準値で分割）の違いを一言で言えるようにする。
  - w を使った3行の交換処理（スワップ）の意味を理解する。
