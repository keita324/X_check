q: 26
answer: エ
category: データベース
theme: |
  データベースの検索を速くする索引（インデックス）の2つの方式、「B<sup>+</sup>木インデックス」と「ハッシュインデックス」の得意・不得意を理解し、ハッシュインデックスが適した検索を選ぶ問題です。
basics: |
  <b>インデックス</b>：本の巻末の索引のように、データを素早く探すための仕組みです。
  - <b>ハッシュインデックス</b>：キーの値をハッシュ関数で計算して格納場所を決める。<b>「〜と等しい」（完全一致）</b>の検索は非常に速い（ほぼ1回で見つかる）。しかし、ハッシュ値は元の値の大小や並び順を保たないので、<b>範囲検索</b>（〜以上、〜の間）や<b>前方一致</b>（〜で始まる）には使えない。
  - <b>B<sup>+</sup>木インデックス</b>：キーの値を<b>大小順に並べた木構造</b>で管理する。完全一致も速く、葉の部分が順にたどれるので、<b>範囲検索や前方一致、並べ替え</b>にも強い。
reasoning: |
  各検索が「完全一致」か「範囲・前方一致」かを判断します。
  1. ア：売上金額が1万円<b>以上</b> → 範囲検索 → B<sup>+</sup>木向き。
  2. イ：売上年月日が<b>今月</b>（今月1日〜月末） → 範囲検索 → B<sup>+</sup>木向き。
  3. ウ：商品名が 'DB' で<b>始まる</b> → 前方一致 → B<sup>+</sup>木向き。
  4. エ：利用者IDが '1001' <b>と等しい</b> → 完全一致 → <b>ハッシュインデックス向き</b>。
  5. 正解は<b>エ</b>です。
choices:
  ア: 「1万円以上」は範囲検索です。ハッシュインデックスは値の大小関係を保たないため使えず、B<sup>+</sup>木インデックスが適しています。誤り。
  イ: 「今月の売上」は日付の範囲検索です。B<sup>+</sup>木インデックスが適しています。誤り。
  ウ: 「'DB'で始まる」は前方一致検索で、値の並び順を使って探す必要があるため、B<sup>+</sup>木インデックスが適しています。誤り。
  エ: 「利用者IDが'1001'」は完全一致検索なので、ハッシュインデックスが適しています。<b>正解</b>。
example: |
  コインロッカーの番号が名前から計算で決まる仕組み（ハッシュ）なら、「山田さんの荷物」はすぐ見つかりますが、「名前が『や』で始まる人全員」を探すにはロッカーを全部見る必要があります。五十音順に並んだ名簿（B<sup>+</sup>木）なら、「や」で始まる人の範囲をまとめて取り出せます。
review:
  - ハッシュインデックス＝完全一致（＝）の検索に最適。範囲検索・前方一致・並べ替えには使えない。
  - B<sup>+</sup>木インデックス＝値の順序を保つので、範囲検索（以上・以下・期間）や前方一致にも使える。
