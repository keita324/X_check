q: 18
answer: ア
category: ソフトウェア
theme: |
  仮想記憶方式に関する用語（LRU、ページテーブル、ページフォールト、フラグメンテーション）の正しい理解を問う問題です。
basics: |
  <b>仮想記憶方式（ページング）</b>：プログラムを固定長の<b>ページ</b>に分け、必要なページだけを主記憶に置いて実行する方式です。
  - <b>ページ置換えアルゴリズム</b>：主記憶が満杯のとき、どのページを追い出すかを決める方法。
  　<b>LRU</b>：最後に使われてから最も時間がたったページを追い出す。<b>FIFO</b>：最も早く読み込まれたページを追い出す。
  - <b>ページテーブル</b>：仮想アドレスのページ番号を、主記憶上の実際の位置に変換するための表。
  - <b>ページフォールト</b>：参照したページが主記憶にないこと。補助記憶から読み込む（ページイン）。
  - <b>フラグメンテーション（断片化）</b>：空き領域が細切れになること。ページングはすべて同じ大きさのページで管理するので、空き領域が細切れになる問題（外部断片化）は起きない。
reasoning: |
  1. ア：LRUは「使用後の経過時間が最長のページ（最も長く使われていないページ）」を置き換える → 定義どおりで○。
  2. イ：ページテーブルは、主記憶に存在するページだけでなく、仮想空間の全ページ分が必要 → ×。
  3. ウ：ページフォールトでは、ページを補助記憶から読み込む（必要なら置換え）。ガーベジコレクションではない → ×。
  4. エ：ページングでは固定長で管理するので、小さな空き領域が多数発生する（外部断片化）ことはない → ×。
  5. 正解は<b>ア</b>です。
choices:
  ア: LRUは、最後に使われてからの経過時間が最も長いページを置き換えるページ置換えアルゴリズムです。<b>正解</b>。
  イ: ページテーブルでアドレスを変換する場合は、主記憶に存在するページだけでなく、仮想アドレス空間の<b>全ページ分</b>の情報（主記憶にあるかないかも含めて）が必要です。誤り。
  ウ: ページフォールトが発生したときは、必要なページを補助記憶から主記憶へ読み込む（ページイン）処理を行います。ガーベジコレクション（不要になったメモリ領域の回収）は必要ありません。誤り。
  エ: ページングはすべて同じ大きさのページで管理するので、多数の小さな空き領域が生まれる（外部）フラグメンテーションは起きません。これは可変長で割り当てる方式で起きる現象です。誤り。
example: |
  図書館の閲覧席（主記憶）が満席のとき、「一番長く本を開いていない人」に席を譲ってもらうのがLRU、「一番早く来た人」に譲ってもらうのがFIFOです。
review:
  - LRU＝最後に使われてから最も時間がたったページを置き換える。FIFOとの違いも押さえる。
  - ページフォールト時はページイン（読み込み）。ページングは固定長なので外部フラグメンテーションは起きない。
