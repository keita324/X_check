q: 6
answer: エ
category: アルゴリズムとプログラミング
theme: |
  表を先頭から順に調べる「線形探索」の平均比較回数を、探す値が表に「ある場合」と「ない場合」の確率を考えて式で表す問題です。
basics: |
  <b>線形探索</b>：表の先頭から1件ずつ順に比較して、目的のデータを探す方法です。

  <b>比較回数の考え方</b>（表の件数 n）
  - <b>探す値が表にある場合</b>：1件目で見つかれば1回、n件目なら n回。どこにあるかはランダムなので、平均は
  | (1 ＋ 2 ＋ … ＋ n) ÷ n ＝ n(n＋1)/2 ÷ n ＝ (n＋1)/2 回
  - <b>探す値が表にない場合</b>：最後まで調べて初めて「ない」と分かるので、必ず <b>n回</b>比較します。

  <b>期待値（平均）</b>：それぞれの場合の回数に、その場合が起こる確率を掛けて足し合わせます。
reasoning: |
  1. 存在しない確率は a、存在する確率は 1 − a です。
  2. 存在する場合の平均比較回数は (n＋1)/2、存在しない場合は n 回です。
  3. 全体の平均比較回数（期待値）は
  | (n＋1)/2 × (1 − a) ＋ n × a
  | ＝ (n＋1)(1 − a)/2 ＋ na
  4. この式は<b>エ</b>です。
  5. 検算：a＝0（必ず存在する）なら (n＋1)/2、a＝1（必ず存在しない）なら n になり、どちらも直感と一致します。
choices:
  ア: (n＋1)na/2 は、存在しない確率 a に存在する場合の平均回数を掛けたような形で、存在する場合（1−a）の項も、存在しない場合の n 回の項も正しく表していません。誤り。
  イ: (n＋1)(1−a)/2 は、存在する場合の項だけです。存在しない場合の比較回数 na を足し忘れています。誤り。
  ウ: 存在しない場合の項を n/2 としていますが、存在しないときは必ず n 回比較し、それが確率 a で起こるので na が正しいです。誤り。
  エ: (n＋1)(1−a)/2 ＋ na。存在する場合と存在しない場合の期待値を足した正しい式です。<b>正解</b>。
example: |
  100人分の名簿から名前を探すとき、名簿に載っている人なら平均して50人目あたりで見つかりますが、載っていない人だと100人全員を確認して初めて「いない」と分かります。「いない人を探すことがどれくらいあるか（a）」で、平均の手間が変わります。
review:
  - 線形探索の平均比較回数：存在する場合 (n＋1)/2、存在しない場合 n。
  - 期待値＝各場合の回数×その確率の合計。a＝0、a＝1 を代入して検算する。
