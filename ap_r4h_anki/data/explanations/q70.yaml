q: 70
answer: エ
category: 技術戦略マネジメント
theme: |
  半導体産業で、製造を専門に請け負う「ファウンドリ企業」のビジネスモデルを、工場を持たない「ファブレス企業」と比べて理解する問題です。
basics: |
  半導体（ICチップ）の産業では、設計と製造の役割分担が進んでいます。
  - <b>ファブレス企業</b>：fab（製造工場）を less（持たない）。チップの<b>設計・開発・マーケティング・販売</b>に集中し、製造は外部に委託する。工場への巨額の投資が不要。
  - <b>ファウンドリ企業</b>：自社製品は持たず、<b>複数の企業から製造だけを専門に請け負う</b>。多くの顧客の注文をまとめて大量に生産するため、最新の高価な設備を効率よく使い、低コストで生産できる。
reasoning: |
  1. ファウンドリ企業の特徴は「生産だけを専門に」「複数の企業から請け負う」「規模を生かして低コストで生産する」ことです。
  2. 「複数の企業から生産だけを専門に請け負い、多くの製品を低コストで生産する」という<b>エ</b>が正解です。
  3. ア・イ・ウは、いずれも製造を外部に任せて設計・販売に集中する<b>ファブレス企業</b>側の特徴です。
choices:
  ア: 工場での生産をアウトソーシング（外部委託）して、生産設備への投資を抑えるのは、<b>ファブレス企業</b>の特徴です。ファウンドリは逆に生産設備に投資して製造を引き受ける側です。誤り。
  イ: 自社製品の設計やマーケティングに注力して新市場を開拓するのは、<b>ファブレス企業</b>の特徴です。誤り。
  ウ: 自社製品の販売に注力して売上げを拡大するのは、自社製品を持つ<b>ファブレス企業</b>などの特徴です。ファウンドリは自社製品を持ちません。誤り。
  エ: 複数の企業から生産だけを専門に請け負い、多くの製品を低コストで生産するのは、<b>ファウンドリ企業</b>の特徴です。<b>正解</b>。
example: |
  出版に例えると、ファブレス企業は「本の企画・編集・宣伝をする出版社」、ファウンドリ企業は「いろいろな出版社から注文を受けて印刷だけを行う大きな印刷会社」です。印刷会社は、たくさんの出版社の本をまとめて刷ることで、1冊あたりのコストを下げられます。
review:
  - ファウンドリ＝複数企業から製造だけを請け負う（規模の経済で低コスト生産）。
  - ファブレス＝工場を持たず、設計・開発・販売に集中し、製造を委託する（設備投資を抑える）。
