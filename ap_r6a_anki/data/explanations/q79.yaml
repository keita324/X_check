q: 79
answer: ア
category: 法務
theme: |
  労働者派遣法に照らして、派遣先企業（A社）が行ってよいこと・行ってはいけないことを判断する問題です。
basics: |
  <b>労働者派遣</b>：派遣元（B社）が雇用している労働者を、派遣先（A社）に送り、派遣先の<b>指揮命令</b>の下で働かせる形態です。
  | 雇用関係：派遣元（B社）と派遣労働者
  | 指揮命令関係：派遣先（A社）と派遣労働者
  派遣先が守るべき主なルール
  - <b>派遣期間の制限</b>：同じ事業所で派遣を受け入れられる期間は、原則として<b>3年が上限</b>です（3年を超える場合は過半数労働組合などへの意見聴取が必要）。同じ派遣労働者を同じ組織単位で受け入れる期間も3年が上限です。
  - <b>特定する行為の禁止</b>：派遣先は、派遣労働者を<b>事前に面接したり、履歴書を求めたり</b>して、派遣される人を選ぶような行為をしないよう努めなければなりません（紹介予定派遣を除く）。
  - <b>差別の禁止</b>：性別を理由に派遣労働者を指定することは禁止され、年齢の指定も原則として認められません。
  - <b>苦情処理</b>：派遣先は、派遣労働者からの苦情を受けたとき、派遣元と連携して<b>適切かつ迅速に処理</b>しなければなりません。
reasoning: |
  1. ア：派遣期間を3年とする契約は、派遣期間の上限（3年）の範囲内なので認められます → ○。
  2. イ：履歴書・職務経歴書の提出を求めて書類選考や面接を行うのは、派遣労働者を特定する行為で、してはいけません → ×。
  3. ウ：「20代男性」と年齢・性別を指定するのは、差別的な取扱いとして認められません → ×。
  4. エ：派遣先は、自社の指揮命令に関する苦情にも、派遣元と連携して対応する義務があります。B社に任せきりにはできません → ×。
  5. 正解は<b>ア</b>です。
choices:
  ア: 派遣可能期間の上限は原則3年なので、派遣期間を3年とする契約を結ぶことは労働者派遣法に照らして適切です。<b>正解</b>。
  イ: 派遣先が履歴書の提出を求めて書類選考や面接を行うことは、派遣労働者を特定する行為に当たり、行ってはいけません（紹介予定派遣を除く）。誤り。
  ウ: 性別や年齢を指定して派遣を求めることは、差別的な取扱いに当たり認められません。誤り。
  エ: 派遣先は、派遣労働者の苦情に対して派遣元と連携し、適切かつ迅速に処理する義務があります。自社で対応せず派遣元に任せるのは不適切です。誤り。
example: |
  派遣社員を受け入れる会社は、「どんな人が来るか」を自分で面接して選ぶことはできません。人選は派遣会社の役割です。一方、来てくれた人に仕事の指示を出すのは受入れ先の役割なので、「指示がきつい」という苦情には受入れ先も責任を持って対応する必要があります。
review:
  - 派遣受入れ期間の上限は原則3年。事前面接・履歴書による選考や、性別・年齢の指定はしない。
  - 派遣先は指揮命令をする立場として、派遣労働者の苦情を派遣元と連携して処理する義務がある。
