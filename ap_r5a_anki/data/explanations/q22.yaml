q: 22
answer: ウ
category: ハードウェア
theme: |
  ANDとNOTの組合せ（NAND）を2つたすき掛けにつないだ回路（フリップフロップ）で、入力Sを一旦0にして1に戻した後に、出力X・Yがどうなるかを追う問題です。出力が入力に戻ってくるので、状態を「記憶」する回路です。
basics: |
  図の回路は、ANDの後ろにNOTが付いているので、それぞれ<b>NAND</b>（ANDの結果を反転）として働きます。
  | X ＝ NOT(S AND Y)
  | Y ＝ NOT(R AND X)
  NANDの性質：入力に1つでも0があれば出力は1、入力が両方1のときだけ出力は0。
  このように出力が互いの入力に戻る回路は、入力が変わっても前の状態を保つことができ、<b>フリップフロップ（ラッチ）</b>と呼ばれます。1ビットを記憶する回路の基本です。
reasoning: |
  <b>(1) 初めの状態</b>：S＝1、R＝1、X＝0、Y＝1
  | X ＝ NOT(1 AND 1) ＝ 0、Y ＝ NOT(1 AND 0) ＝ 1 で安定しています。
  <b>(2) S を 0 にする</b>
  | X ＝ NOT(0 AND Y) ＝ 1（Sが0なのでYに関係なく1）
  | Y ＝ NOT(R AND X) ＝ NOT(1 AND 1) ＝ 0
  | 確認：X ＝ NOT(0 AND 0) ＝ 1 で安定 → X＝1、Y＝0
  <b>(3) S を 1 に戻す</b>
  | X ＝ NOT(1 AND Y) ＝ NOT(1 AND 0) ＝ 1
  | Y ＝ NOT(1 AND 1) ＝ 0
  Sを1に戻しても、X＝1、Y＝0 のまま変わりません（Sを0にしたことが「記憶」されている）。
  正解は<b>ウ</b>です。
choices:
  ア: X＝0、Y＝0 は、X＝NOT(S AND Y) に代入すると NOT(1 AND 0)＝1 となり矛盾するので、この回路で安定しない状態です。誤り。
  イ: X＝0、Y＝1 は操作前の状態です。Sを一旦0にしたことでXが1に変わり、その状態が保持されるので、元には戻りません。誤り。
  ウ: X＝1、Y＝0。Sを0にしたときにセットされた状態が、Sを1に戻した後も保持されます。<b>正解</b>。
  エ: X＝1、Y＝1 は、Y＝NOT(R AND X)＝NOT(1 AND 1)＝0 となり矛盾するので、この回路で安定しない状態です。誤り。
example: |
  押しボタン式の照明スイッチの「点灯ボタン」を一瞬押して離しても、照明は点いたままです。押した（S＝0にした）という出来事を回路が覚えているからです。フリップフロップは、このように一瞬の入力を記憶し続ける回路で、レジスタやSRAMの基本になっています。
review:
  - たすき掛けのNAND回路（SRラッチ）は、S・Rが1のとき前の状態を保持する。Sを一旦0にするとX＝1にセットされ、1に戻しても保持される。
  - 出力が入力に戻る回路は、X・Yの式に値を代入して「安定するか」を確かめながら1段階ずつ追う。
