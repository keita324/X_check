q: 35
answer: イ
category: ネットワーク
theme: |
  スマートフォンなどの移動通信で、移動しながら通信を続けるために、接続する基地局を切り替える仕組みの名前を問う用語問題です。
basics: |
  <b>基地局</b>：携帯電話やスマホと電波でやり取りする、通信会社の無線設備です。1つの基地局がカバーできる範囲（セル）には限りがあります。

  移動通信の主な用語
  - <b>ハンドオーバー</b>：移動中の端末が、通信を<b>切らずに</b>、今の基地局から別の基地局へ接続を引き継ぐこと。
  - <b>ローミング</b>：契約している通信会社のサービス範囲外（海外など）で、<b>提携している別の通信会社</b>の設備を使って通信すること。
  - <b>テザリング</b>：スマホをアクセスポイント（親機）にして、パソコンなど他の機器をインターネットにつなぐこと。
  - <b>フォールバック</b>：障害時や新方式が使えないときに、機能を落とした方式（例：5Gが使えないとき4Gへ）に切り替えて通信を続けること。
reasoning: |
  1. 問題文のキーワードは「移動中」「通信相手との接続を維持したまま」「ある基地局経由から別の基地局経由に切り替える」です。
  2. これは<b>ハンドオーバー</b>です。正解は<b>イ</b>です。
choices:
  ア: テザリングは、スマホを親機にして他の機器をインターネットに接続することです。基地局の切替えではありません。誤り。
  イ: 移動中に、接続を維持したまま別の基地局経由の通信に切り替えることは<b>ハンドオーバー</b>です。<b>正解</b>。
  ウ: フォールバックは、障害時や新しい方式が使えないときに、機能を落とした方式に切り替えて通信を続けることです。誤り。
  エ: ローミングは、契約している通信会社の範囲外で、提携する他の通信会社の設備を使って通信することです。誤り。
example: |
  新幹線で通話しながら移動すると、数分おきに近くの基地局が変わりますが、通話は途切れません。これは、基地局がリレーのバトンを渡すように接続を引き継ぐ（ハンドオーバー）からです。海外旅行先で日本のスマホがそのまま使えるのはローミングです。
review:
  - ハンドオーバー＝移動中に接続を維持したまま基地局を切り替えること。
  - ローミング（他社設備の利用）、テザリング（スマホを親機に）、フォールバック（機能を落とした方式への切替え）と区別する。
