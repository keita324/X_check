q: 45
answer: ウ
category: セキュリティ
theme: |
  ソフトウェアの脆弱性を発見するテスト手法「ファジング」を、ポートスキャン・ログ解析・侵入検知（IDS）と区別する問題です。
basics: |
  <b>脆弱性</b>：ソフトウェアのセキュリティ上の欠陥です。想定外の入力を受けたときに、異常終了したり、乗っ取られたりする原因になります。
  <b>ファジング</b>：ソフトウェアに、<b>ファズ</b>と呼ばれる「問題を引き起こしそうな多様なデータ」（極端に長い文字列、想定外の記号、壊れた形式のデータなど）を大量に自動で入力し、<b>挙動（異常終了・フリーズなど）を監視</b>して、脆弱性を見つけ出すテスト手法です。開発者が気づいていない弱点を、攻撃者より先に発見するために使います。
reasoning: |
  1. ファジングのキーワードは「問題を引き起こしそうな多様なデータを入力」「挙動を監視」「脆弱性を見つけ出す」です。
  2. これをそのまま述べているのは<b>ウ</b>です。
choices:
  ア: サーバにFINパケットを送り、応答から稼働しているサービス（開いているポート）を見つけるのは、<b>ポートスキャン</b>（FINスキャン）です。誤り。
  イ: OSやアプリのログやコマンド履歴を解析して、ファイルの改ざんを検知するのは、<b>ログ分析</b>やホスト型の侵入検知（改ざん検知）です。誤り。
  ウ: 問題を引き起こしそうな多様なデータを入力し、挙動を監視して脆弱性を見つけ出すのは<b>ファジング</b>です。<b>正解</b>。
  エ: ネットワーク上のパケットを収集し、登録された攻撃パターンと一致するものを検出するのは、シグネチャ型の<b>ネットワーク型侵入検知システム（NIDS）</b>です。誤り。
example: |
  新しく作ったアンケートフォームに、空欄、1万文字の文章、絵文字だらけの文字列、数字欄に文字…と、ありとあらゆる「変な入力」を自動で何万通りも送り込み、システムがエラーで落ちないかを確かめるのがファジングです。落ちた入力が見つかれば、そこに弱点があります。
review:
  - ファジング＝想定外の多様なデータ（ファズ）を大量に入力し、挙動を監視して脆弱性を発見するテスト手法。
  - ポートスキャン（稼働サービスの探索）、ログ解析（改ざん検知）、IDS（攻撃パターンとの照合）と区別する。
