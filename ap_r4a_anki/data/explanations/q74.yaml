q: 74
answer: イ
theme: |
  ハーシィとブランチャードが提唱した「SL理論（状況対応型リーダーシップ）」の説明を、ジョハリの窓・SECIモデル・マズローの欲求5段階説と区別する問題です。
basics: |
  <b>SL理論（Situational Leadership：状況対応型リーダーシップ理論）</b>：最適なリーダーシップのスタイルは1つではなく、<b>部下の成熟度</b>（能力と意欲）に応じて変えるべきだ、という理論です。
  部下の成熟度が低い順に、次の4つのスタイルを使い分けます。
  | ①教示的（指示型）：やり方を具体的に教え、細かく指示する
  | ②説得的（コーチ型）：考えを説明し、質問に答えながら導く
  | ③参加的（援助型）：部下の考えを聞き、一緒に決める
  | ④委任的：仕事を任せ、責任も委ねる
reasoning: |
  1. SL理論のキーワードは「部下の成熟度」と「教示的・説得的・参加的・委任的の4スタイル」です。
  2. これを述べているのは<b>イ</b>です。
  3. ア＝ジョハリの窓、ウ＝SECIモデル（野中郁次郎）、エ＝マズローの欲求5段階説の説明です。
choices:
  ア: 開放・秘密・未知・盲点の4つの窓で、自己理解と対人関係を説明するのは<b>ジョハリの窓</b>です。誤り。
  イ: 教示的・説得的・参加的・委任的の4つに、部下の成熟度レベルによってリーダーシップスタイルを分類した理論。<b>SL理論</b>です。<b>正解</b>。
  ウ: 共同化・表出化・連結化・内面化の4つのプロセスで個人と組織に新たな知識が創造されるとしたのは、<b>SECIモデル</b>（ナレッジマネジメントの理論）です。誤り。
  エ: 生理的・安全・所属と愛情・承認と自尊・自己実現の5段階で欲求が発達するとしたのは、<b>マズローの欲求5段階説</b>です。誤り。
example: |
  自転車の教え方に例えると、
  ①初めての子には、ペダルのこぎ方から手取り足取り教える（教示的）
  ②少し乗れるようになったら、コツを説明して励ます（説得的）
  ③自分で乗れるようになったら、どこに行きたいか一緒に考える（参加的）
  ④すっかり上達したら、一人で行かせる（委任的）
  相手の成長に合わせて関わり方を変えるのがSL理論です。
review:
  - SL理論＝部下の成熟度に応じて、教示的→説得的→参加的→委任的とリーダーシップスタイルを変える。
  - ジョハリの窓（4つの窓）、SECIモデル（知識創造の4プロセス）、マズロー（欲求5段階）と区別する。
