q: 49
answer: エ
theme: |
  アジャイル開発手法のエクストリームプログラミング（XP）で採用されている「テスト駆動開発（TDD）」の特徴を問う問題です。
basics: |
  <b>アジャイル開発</b>：短い期間で「作る→動かす→改善する」を繰り返し、変化に素早く対応する開発の進め方です。
  <b>XP（エクストリームプログラミング）</b>：アジャイル開発の代表的な手法の1つで、ペアプログラミング、テスト駆動開発、リファクタリングなどの具体的な実践（プラクティス）を定めています。

  <b>テスト駆動開発（TDD：Test-Driven Development）</b>：プログラム本体を書く<b>前に</b>、まず「こう動くべき」というテストコードを書く開発方法です。次の短いサイクルを繰り返します。
  1. まだ本体がないので失敗するテストを書く（レッド）
  2. テストに合格する最小限のコードを書く（グリーン）
  3. 動作を保ったままコードを整理する（リファクタリング）
reasoning: |
  1. TDDの最大の特徴は「テストが先、プログラムが後」という順番です。
  2. テストを先に書くことで、作るべき機能の仕様が明確になり、作った後もすぐに正しさを確認できます。
  3. 「プログラムを書く前にテストコードを記述する」という<b>エ</b>が正解です。
choices:
  ア: 最初のテストでなるべく多くのバグを見つけることは、TDDの目的ではありません。TDDは小さなテストを1つずつ書いて少しずつ機能を作っていく方法です。誤り。
  イ: TDDで繰り返すのは「テスト作成→実装→リファクタリング（プログラムの改善）」のサイクルで、テストケースの改善そのものを繰り返す手法ではありません。誤り。
  ウ: カバレージ（網羅率）を高めることが目的ではありません。TDDの目的は、テストを先に書いて仕様を明確にし、正しく動くコードを少しずつ作ることです。結果としてカバレージが高くなることはあります。誤り。
  エ: プログラムを書く前にテストコードを記述する。<b>テスト駆動開発</b>の特徴です。<b>正解</b>。
example: |
  料理に例えると、作り始める前に「味見の基準（甘さはこのくらい、塩加減はこのくらい）」を先に決めておき、その基準を満たすように調理し、合格したら盛り付けを整える（リファクタリング）、という順番です。
review:
  - テスト駆動開発（TDD）＝プログラムを書く前にテストコードを書く。「テスト→実装→リファクタリング」の短いサイクルを回す。
  - TDDはXPのプラクティスの1つ。目的はバグの大量摘出やカバレージ向上ではない。
