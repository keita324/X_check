q: 50
answer: ウ
theme: |
  アジャイル開発のスクラムで、スプリント（短い開発期間）の振り返りに使う「KPT手法」の「T（Try）」に当たる例を選ぶ問題です。
basics: |
  <b>スクラム</b>：アジャイル開発の代表的な枠組み。1〜4週間程度の<b>スプリント</b>という短い期間ごとに、計画・開発・レビュー・振り返りを繰り返します。
  <b>スプリントレトロスペクティブ</b>：スプリントの最後に行う、チームの「仕事の進め方」の振り返りの会議です。
  <b>スタンドアップミーティング（デイリースクラム）</b>：毎日短時間、立ったまま行う進捗確認の打合せ。

  <b>KPT（ケプト）手法</b>：振り返りの内容を3つに分けて整理する方法です。
  - <b>K（Keep）</b>：うまくいったので、今後も<b>続けること</b>。
  - <b>P（Problem）</b>：うまくいかなかった<b>問題点</b>。
  - <b>T（Try）</b>：問題を解決するため、または良くするために、次に<b>新しく試すこと</b>（具体的な改善策）。
reasoning: |
  各選択肢をK・P・Tに分類します。
  1. ア「欠陥が少なかったので、今後もペアプログラミングを継続」→ 良かったことを続ける → <b>K</b>
  2. イ「スタンドアップミーティングにメンバー全員が集まらないことが多かった」→ 問題点 → <b>P</b>
  3. ウ「次のスプリントからは、タイムキーパーを置き、終了5分前を知らせる」→ 次に新しく試す改善策 → <b>T</b>
  4. エ「テストコードの作成に見積り以上の時間が掛かった」→ 問題点 → <b>P</b>
  よって「T」に該当するのは<b>ウ</b>です。
choices:
  ア: うまくいったこと（欠陥が少ない）を今後も続ける内容なので、K（Keep）です。誤り。
  イ: うまくいかなかった事実（全員が集まらない）を挙げているので、P（Problem）です。誤り。
  ウ: 次のスプリントから新たに実施する具体的な改善策なので、T（Try）です。<b>正解</b>。
  エ: うまくいかなかった事実（時間が見積りを超えた）を挙げているので、P（Problem）です。誤り。
example: |
  部活の試合の反省会で考えると、
  - K：「声を掛け合う作戦は良かったから続けよう」
  - P：「後半にスタミナが切れた」
  - T：「来週から練習の最後に走り込みを10分追加しよう」
  Tは「次に何をするか」が具体的に書かれているのが特徴です。
review:
  - KPT＝Keep（続けること）・Problem（問題点）・Try（次に試す改善策）。
  - 「次から〜する」という未来の具体的な行動はTry、「〜だった」という事実の指摘はKeepかProblem。
