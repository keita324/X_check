q: 48
answer: ア
category: ソフトウェア開発管理技術
theme: |
  ソフトウェア保守の4分類（是正・予防・適応・完全化）のうち、「問題は起きていないが、仕様書とソースコードの不整合を解消する」作業がどれに当たるかを問う問題です。
basics: |
  <b>ソフトウェア保守</b>：システムを使い始めた後（引渡し後）に行う修正作業です。JIS X 0161では、目的によって次の4つに分類しています。
  - <b>是正保守</b>：発見された<b>障害（不具合）を修正</b>する。
  - <b>予防保守</b>：潜在的な障害が、実際の故障として現れる<b>前に</b>発見して修正する。
  - <b>適応保守</b>：OSの更新や法改正など、<b>環境の変化</b>に合わせて修正する。
  - <b>完全化保守</b>：<b>性能や保守性を改善</b>するために修正する。

  <b>リバースエンジニアリング</b>：既にあるソースコードなどを解析して、その仕様や設計を明らかにすることです。
reasoning: |
  1. 問題文の状況は「問題は発生していない」「仕様書と現状のソースコードの不整合を解消する」「仕様書を作り直す」です。
  2. 障害の修正（是正）でも、環境変化への対応（適応）でもありません。また、不整合の解消は故障を防ぐための修正というより、今後の修正作業をしやすくする（保守性を高める）ための作業です。
  3. 保守性の改善を目的とする修正は<b>完全化保守</b>です。正解は<b>ア</b>です。
choices:
  ア: 正しい仕様書を整備して保守性を改善する作業なので、<b>完全化保守</b>に当たります。<b>正解</b>。
  イ: 是正保守は、発見された障害を修正するものです。問題は発生していないので誤り。
  ウ: 適応保守は、OSやハードウェア、法制度などの環境変化に合わせる修正です。環境は変わっていないので誤り。
  エ: 予防保守は、プログラムに潜む障害を、故障として現れる前に見つけて直すものです。今回はプログラムではなく、仕様書の不整合を解消して保守性を上げる作業なので誤り。
example: |
  家に例えると、雨漏りを直すのが是正保守、雨漏りしそうな屋根を先に補修するのが予防保守、法律が変わって手すりを付けるのが適応保守です。そして「実際の配管と違っていた家の図面を、今の状態に合わせて描き直し、次のリフォームをしやすくする」のが完全化保守です。
review:
  - 是正（障害修正）・予防（潜在障害を事前修正）・適応（環境変化対応）・完全化（性能・保守性の改善）の4分類を区別する。
  - 問題が起きていない状態で、仕様書の整備など保守性を高める作業は完全化保守。
