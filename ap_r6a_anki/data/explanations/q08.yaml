q: 8
answer: ウ
category: コンピュータ構成要素
theme: |
  RISCプロセッサの代表的な5段パイプラインで、命令が処理される各ステージの正しい順序を問う問題です。
basics: |
  <b>パイプライン</b>：1つの命令の処理を複数の段階（ステージ）に分け、複数の命令を少しずつずらして重ねて実行する方式です。
  <b>RISCの代表的な5段パイプライン</b>は、次の順で進みます。
  | ① 命令フェッチ（IF）：主記憶（キャッシュ）から命令を取り出す
  | ② 命令デコードとレジスタファイル読出し（ID）：命令を解読し、必要なレジスタの値を読み出す
  | ③ 実行とアドレス生成（EX）：演算を行う。メモリを使う命令ならアドレスを計算する
  | ④ メモリアクセス（MEM）：ロード・ストア命令なら、メモリの読み書きをする
  | ⑤ 書込み（WB）：結果をレジスタに書き戻す
  「取り出す→読む→計算する→メモリを使う→結果を書き戻す」という自然な流れで覚えます。
reasoning: |
  1. 問題の番号で並べると、
  | ④ 命令フェッチ → ③ 命令デコードとレジスタファイル読出し → ② 実行とアドレス生成 → ⑤ メモリアクセス → ① 書込み
  2. この順序は「④、③、②、⑤、①」で、<b>ウ</b>です。
choices:
  ア: ③（デコード）が④（フェッチ）より先になっています。命令は取り出してからでないと解読できないので誤り。
  イ: ③（デコード）が最初で、④（フェッチ）が書込みの直前になっており、順序が成り立ちません。誤り。
  ウ: ④命令フェッチ→③デコード・レジスタ読出し→②実行・アドレス生成→⑤メモリアクセス→①書込み。RISCの5段パイプラインの正しい順序です。<b>正解</b>。
  エ: ⑤（メモリアクセス）が③（デコード）より前にあります。メモリのアドレスは、デコードと実行（アドレス生成）の後でないと分からないので誤り。
example: |
  料理に例えると、レシピカードを取り出す（フェッチ）→読んで材料を確認する（デコード）→切ったり炒めたりする（実行）→冷蔵庫から追加の材料を出し入れする（メモリアクセス）→お皿に盛り付ける（書込み）、という流れです。
review:
  - RISC 5段パイプライン：命令フェッチ→デコード・レジスタ読出し→実行・アドレス生成→メモリアクセス→書込み（IF→ID→EX→MEM→WB）。
  - アドレスは実行段階で生成されるので、メモリアクセスはその後になる。
