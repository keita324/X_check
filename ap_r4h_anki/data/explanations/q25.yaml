q: 25
answer: ア
category: 情報メディア
theme: |
  3次元CG（コンピュータグラフィックス）で、物体の見え方を計算して画像を作る方法のうち「レイトレーシング法」の説明を選ぶ問題です。
basics: |
  3次元CGでは、手前の物体に隠れて見えない部分（隠面）を消し、見える面だけを描く必要があります。代表的な手法は次のとおりです。
  - <b>レイトレーシング法</b>：視点から画面の各画素に向けて視線（レイ＝光線）を飛ばし、最初にぶつかる物体を求め、さらに反射や透過（屈折）した光の行方も追跡して色を決める。映り込みや透明感をリアルに表現できるが、計算量が多い。
  - <b>Zバッファ法</b>：画素ごとに「視点からの距離（奥行き＝Z値）」を記録しておき、より近い面の色で上書きしていく。
  - <b>スキャンライン法</b>：画面の走査線（横1列）ごとに、物体との交わりを求めて奥行き判定を行う。
  - <b>Zソート法（ペインタアルゴリズム）</b>：遠い物体から順に描き、近い物体で上から重ね描きする。
reasoning: |
  1. レイトレーシングの特徴は「画素ごとに視線と物体の交点を計算する」「反射・透明（透過）も含めて計算する」「視点に最も近い交点を選ぶ」ことです。
  2. これをすべて述べているのは<b>ア</b>です。
  3. イ＝スキャンライン法、ウ＝Zソート法、エ＝Zバッファ法の説明です。
choices:
  ア: 全ての画素について、視線と物体との交点を反射や透明の属性も含めて計算し、視点に最も近い交点を選ぶ。<b>レイトレーシング法</b>の説明です。<b>正解</b>。
  イ: 走査線ごとに走査面を作り、物体との交差線分を求めて奥行き判定を行うのは<b>スキャンライン法</b>です。誤り。
  ウ: 遠くの物体を先に描いてから近くの物体を重ね書きするのは<b>Zソート法（ペインタアルゴリズム）</b>です。画家が背景から描くのと同じ考え方です。誤り。
  エ: ピクセルごとに視点までの距離を計算し、その最小値を作業領域（Zバッファ）に保持して最も近い面を求めるのは<b>Zバッファ法</b>です。誤り。
example: |
  レイトレーシングは、目（カメラ）から見えている方向に1本1本レーザーポインタを当てて、「どの物にまず当たり、そこで鏡のように反射したら次に何に当たるか」を追いかけるようなものです。ゲームで水面や車のボディに周りの景色がリアルに映り込むのは、この手法の成果です。
review:
  - レイトレーシング＝視点から画素ごとに光線を追跡し、反射・透過も計算して最も近い交点の色を求める。
  - スキャンライン法（走査線ごと）、Zソート法（遠い順に重ね描き）、Zバッファ法（画素ごとに最小距離を保持）と区別する。
