q: 37
answer: ア
category: セキュリティ
theme: |
  公開鍵暗号の一種「楕円曲線暗号」の特徴を、RSA暗号や共通鍵暗号と比べて問う問題です。
basics: |
  <b>公開鍵暗号</b>：暗号化に使う鍵（公開鍵）と復号に使う鍵（秘密鍵）が異なる暗号方式です。代表例が<b>RSA暗号</b>と<b>楕円曲線暗号</b>です。
  - <b>RSA暗号</b>：大きな数の素因数分解が難しいことを安全性の根拠にする。安全性を保つには、2048ビット以上の長い鍵が必要。
  - <b>楕円曲線暗号</b>：楕円曲線という数学的な曲線上の計算（離散対数問題）が難しいことを根拠にする。RSAと比べて<b>短い鍵長で同じレベルの安全性</b>が得られる（例：楕円曲線暗号の256ビット鍵が、RSAの3072ビット鍵とほぼ同等）。鍵が短いので計算が軽く、ICカードやスマートフォンなどでよく使われる。
  <b>共通鍵暗号</b>：暗号化と復号に同じ鍵を使う方式（AESなど）。処理は高速だが、鍵を秘密に共有する必要がある。
reasoning: |
  1. 楕円曲線暗号の最大の特徴は「RSA暗号と比べて、短い鍵長で同じレベルの安全性を実現できる」ことです。
  2. 正解は<b>ア</b>です。
choices:
  ア: 楕円曲線暗号は、RSA暗号よりも短い鍵長で同じレベルの安全性を実現できます。<b>正解</b>。
  イ: 楕円曲線暗号は<b>公開鍵暗号</b>方式です。共通鍵暗号方式ではありません。誤り。
  ウ: 楕円曲線暗号の安全性は、現在知られている方法では解読に膨大な計算が必要であることに基づいており、総当たりによる解読が不可能であることが数学的に証明されているわけではありません。誤り。
  エ: 公開鍵暗号でデータを秘匿する場合、受信者の公開鍵で暗号化し、受信者の<b>秘密鍵</b>で復号します。復号鍵（秘密鍵）は秘密にしておく必要があります。誤り。
example: |
  同じ強さの錠前を作るのに、RSAは大きくて重い錠前、楕円曲線暗号は小さくて軽い錠前、というイメージです。小さくても同じくらい破られにくいので、計算能力の小さいICカードやスマホに向いています。
review:
  - 楕円曲線暗号＝公開鍵暗号の一種。RSAより短い鍵長で同等の安全性（計算が軽い）。
  - 公開鍵暗号でも復号鍵（秘密鍵）は秘密にする。「解読不可能が数学的に証明済み」ではない。
