q: 53
answer: ア
category: プロジェクトマネジメント
theme: |
  プロジェクトチームのパフォーマンスを高めるために、メンバーを同じ作業場所に集めることを何と呼ぶかを問う用語問題です。
basics: |
  - <b>コロケーション</b>：co（共に）＋location（場所）。プロジェクトチームのメンバーを、<b>物理的に同じ場所</b>に集めて作業させること。すぐに相談できるので、コミュニケーションが活発になり、チームの一体感やパフォーマンスが高まります（「タイト・マトリックス」とも呼ばれます）。
  - <b>バーチャルチーム</b>：メンバーが<b>別々の場所</b>にいながら、ITツールなどを使って共同で作業するチーム。コロケーションと対になる考え方です。
  - <b>ネットワーキング</b>：人脈を作り、情報交換や協力関係を築く活動。
  - <b>ファシリテーション</b>：会議などで、中立的な立場から議論を進行し、合意形成を支援すること。
reasoning: |
  1. 「チームメンバーを同じ作業場所に集めること」は<b>コロケーション</b>です。
  2. 正解は<b>ア</b>です。
choices:
  ア: プロジェクトチームのメンバーを同じ作業場所に集めて、パフォーマンスを高めることを<b>コロケーション</b>といいます。<b>正解</b>。
  イ: ネットワーキングは、人脈を作って情報交換や協力関係を築く活動で、メンバーを同じ場所に集めることではありません。誤り。
  ウ: バーチャルチームは、メンバーが別々の場所にいながらITツールで協働するチームで、同じ場所に集めるのとは逆の形態です。誤り。
  エ: ファシリテーションは、会議の議論を進行し、合意形成を支援することです。誤り。
example: |
  文化祭の準備で、クラス全員が同じ教室に集まって作業すれば、「これどうする？」とすぐに相談でき、作業が早く進みます。これがコロケーションです。家で各自作業して、メッセージアプリでやり取りするのがバーチャルチームです。
review:
  - コロケーション＝チームメンバーを同じ作業場所に集め、コミュニケーションとパフォーマンスを高めること。
  - バーチャルチーム（離れた場所で協働）、ネットワーキング（人脈づくり）、ファシリテーション（会議の進行支援）と区別する。
