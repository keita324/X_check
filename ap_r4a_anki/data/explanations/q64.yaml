q: 64
answer: イ
theme: |
  将来受け取るお金を「今の価値」に換算して投資を比べる「正味現在価値（NPV）法」で、最も得な投資シナリオを選ぶ計算問題です。
basics: |
  <b>お金の時間価値</b>：今の100万円と1年後の100万円は同じ価値ではありません。今の100万円を年5%で運用すれば1年後には105万円になるので、逆に言えば「1年後の105万円」は「今の100万円」と同じ価値です。
  <b>割引率</b>：将来のお金を今の価値に換算するときに使う率（ここでは5%）。
  <b>現在価値</b>：将来のお金を今の価値に直したもの。
  | n年後のお金の現在価値 ＝ 金額 ÷ 1.05<sup>n</sup>
  | 1年後：÷1.05（×約0.9524）、2年後：÷1.1025（×約0.9070）、3年後：÷1.157625（×約0.8638）
  <b>正味現在価値（NPV）</b>：
  | NPV ＝ 回収額の現在価値の合計 − 投資額
  NPVがプラスなら得な投資、マイナスなら損な投資です。
reasoning: |
  各シナリオの回収額を現在価値に直して合計し、投資額220万円を引きます（単位：万円、小数第2位で四捨五入）。

  <b>シナリオA</b>（40, 80, 120）
  | 40×0.9524 ＋ 80×0.9070 ＋ 120×0.8638
  | ≒ 38.10 ＋ 72.56 ＋ 103.66 ＝ 214.32 → NPV ≒ <b>−5.68</b>
  <b>シナリオB</b>（120, 80, 40）
  | 120×0.9524 ＋ 80×0.9070 ＋ 40×0.8638
  | ≒ 114.29 ＋ 72.56 ＋ 34.55 ＝ 221.40 → NPV ≒ <b>＋1.40</b>
  <b>シナリオC</b>（80, 80, 80）
  | 80×(0.9524 ＋ 0.9070 ＋ 0.8638)
  | ≒ 76.19 ＋ 72.56 ＋ 69.11 ＝ 217.86 → NPV ≒ <b>−2.14</b>
  <b>投資をしない</b>：NPV ＝ <b>0</b>

  NPVが最大なのはシナリオB（＋1.40）です。正解は<b>イ</b>です。
  ポイント：回収額の単純合計はA・B・Cとも240万円で同じですが、早く多く回収するほど割り引かれる量が少ないので、1年目に120万円回収するBが最も有利になります。
choices:
  ア: シナリオAは、回収が後半（3年目に120万円）に偏っているため、割引の影響を大きく受けてNPVが約−5.68万円になり、最も不利です。誤り。
  イ: シナリオBは、1年目に最も多く回収するため割引の影響が小さく、NPVが約＋1.40万円で唯一プラスになります。<b>正解</b>。
  ウ: シナリオCは、NPVが約−2.14万円でマイナスです。誤り。
  エ: 投資をしない場合のNPVは0です。シナリオBの＋1.40万円の方が大きいので、投資した方が得です。誤り。
example: |
  友達に220万円貸して、合計240万円返してもらう約束をするとします。「1年目に120万円」と「3年目に120万円」なら、早く返してもらう方がうれしいですよね。早く戻ったお金はまた運用できるからです。NPVは、この「早くもらう方が価値が高い」という感覚を数字にしたものです。
review:
  - NPV＝Σ（回収額÷(1＋割引率)<sup>年数</sup>）−投資額。プラスなら投資する価値がある。
  - 回収総額が同じなら、早く多く回収するシナリオほどNPVが大きい。
  - 「投資しない」のNPVは0として比較に含める（全シナリオがマイナスなら「投資しない」が最善になる）。
