q: 42
answer: イ
category: セキュリティ
theme: |
  事件や事故の後に、コンピュータに残された証拠を集めて調べる「デジタルフォレンジックス」の手順（収集・検査・分析・報告）に含まれる作業を選ぶ問題です。
basics: |
  <b>デジタルフォレンジックス</b>：不正アクセスや情報漏えいなどが起きた<b>後に</b>、コンピュータやネットワーク機器に残された電子的な証拠（ログ、ファイル、メールなど）を、法的にも通用する方法で<b>収集・保全し、調査・分析</b>して、何が起きたかを明らかにする技術や手順です。
  主な手順
  | 収集：証拠となるデータを、改変しないように複製・保全する
  | 検査：収集したデータから、関係する情報を取り出す（削除されたファイルの復元など）
  | 分析：取り出した情報から、何が起きたかを明らかにする
  | 報告：結果を報告書にまとめる
  ポイントは、<b>事後に証拠を調べて痕跡を明らかにする</b>ことで、リアルタイムの監視や予防の対策とは違います。
reasoning: |
  1. イ「ハードディスクを解析し、削除されたログファイルを復元して、不正アクセスの痕跡を発見する」は、証拠の検査・分析にあたり、デジタルフォレンジックスの手順に含まれます。
  2. ア（リアルタイムの相関分析で検出）は SIEM による監視、ウ（メールの暗号化）は情報漏えいの予防、エ（ハッシュ値と脅威情報の照合）はマルウェア対策で、いずれも事後の証拠調査ではありません。
  3. 正解は<b>イ</b>です。
choices:
  ア: ログをログ管理サーバに集約し、リアルタイムに相関分析して不正アクセスを検出するのは、<b>SIEM</b>などによるセキュリティ監視です。事後に証拠を調べるフォレンジックスの手順ではありません。誤り。
  イ: サーバのハードディスクを解析し、削除されたログファイルを復元して不正アクセスの痕跡を発見するのは、<b>デジタルフォレンジックス</b>の検査・分析の作業です。<b>正解</b>。
  ウ: 電子メールの本文や添付ファイルを暗号化して情報漏えいを防ぐのは、<b>予防的なセキュリティ対策</b>です。誤り。
  エ: プログラムのハッシュ値を脅威情報と照合してマルウェアかを検査するのは、<b>マルウェア対策</b>（実行前の検査）です。誤り。
example: |
  事件現場の鑑識に例えると、指紋や足跡を、現場を荒らさずに採取し（収集）、拭き取られた跡からも指紋を浮かび上がらせ（検査）、犯人の行動を推理し（分析）、報告書にまとめる（報告）、という流れです。防犯カメラでリアルタイムに見張るのは「監視」で、鑑識とは別の仕事です。
review:
  - デジタルフォレンジックス＝事後に電子的証拠を収集・検査・分析・報告し、何が起きたかを明らかにする（削除データの復元など）。
  - リアルタイム監視（SIEM）、予防策（暗号化）、マルウェア検査とは区別する。
