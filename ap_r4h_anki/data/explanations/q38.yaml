q: 38
answer: エ
category: セキュリティ
theme: |
  パスワードそのものをネットワークに流さずに本人確認する「チャレンジレスポンス認証方式」の仕組みを選ぶ問題です。
basics: |
  単純なパスワード認証では、パスワードがそのまま通信路を流れるため、盗聴されると悪用されてしまいます。
  <b>チャレンジレスポンス認証</b>は、次の手順でこの問題を防ぎます。
  1. サーバが、毎回異なるランダムなデータ（<b>チャレンジ</b>）をクライアントに送る。
  2. クライアントは、利用者が入力したパスワードとチャレンジを組み合わせて計算（ハッシュ関数などで演算）し、結果（<b>レスポンス</b>）をサーバに送る。
  3. サーバも、登録されているパスワードとチャレンジで同じ計算をし、結果が一致すれば本人と認める。
  通信路にはパスワードそのものが流れず、チャレンジが毎回変わるのでレスポンスも毎回変わり、盗聴したレスポンスを使い回すこと（リプレイ攻撃）もできません。
reasoning: |
  1. チャレンジレスポンス認証の特徴は「サーバから受け取ったランダムなデータ（チャレンジ）」と「パスワード」を<b>クライアントで演算</b>し、その結果を送ることです。
  2. これを述べているのは<b>エ</b>です。
choices:
  ア: 固定パスワードをTLSで暗号化して送り、サーバで検証するのは、暗号化された通信路を使った通常のパスワード認証です。チャレンジ（ランダムデータ）を使っていないので誤り。
  イ: 端末のシリアル番号を秘密鍵で暗号化して送るのは、秘密鍵を使った端末認証の一種で、サーバからのチャレンジを使っていません。誤り。
  ウ: トークンが表示する、認証のたびに異なる数字列をパスワードとして送るのは、<b>ワンタイムパスワード</b>（時刻同期方式など）です。サーバからチャレンジを受け取る方式ではないので誤り。
  エ: 入力したパスワードと、サーバから受け取ったランダムなデータとをクライアントで演算し、その結果を送ってサーバで検証する。<b>チャレンジレスポンス認証</b>の説明です。<b>正解</b>。
example: |
  合言葉の確認で、門番が毎回違う数字（例：「今日は37」）を言い、訪問者は「合言葉の文字数×37」のような決まった計算をした答えだけを返すようなものです。合言葉そのものを口にしないので、近くで聞かれても合言葉は漏れず、次回は数字が変わるので同じ答えは使えません。
review:
  - チャレンジレスポンス認証＝サーバのランダムなチャレンジとパスワードをクライアントで演算し、その結果だけを送る。パスワードが通信路に流れない。
  - ワンタイムパスワード（トークンの数字列）、TLSでのパスワード送信と区別する。
