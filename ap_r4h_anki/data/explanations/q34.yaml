q: 34
answer: ア
category: ネットワーク
theme: |
  「192.168.30.32/28」というネットワークに、IPアドレスを割り当てて接続できるホスト（機器）の最大数を求める問題です。
basics: |
  <b>/28（プレフィックス長）</b>：IPv4アドレス32ビットのうち、先頭28ビットがネットワーク部（どのネットワークか）を表すという意味です。残りの <b>32 − 28 ＝ 4ビット</b>がホスト部（そのネットワーク内のどの機器か）です。

  <b>接続できるホスト数</b>：ホスト部がnビットなら、アドレスは2<sup>n</sup>通りあります。ただし、
  - ホスト部がすべて0：<b>ネットワークアドレス</b>（ネットワーク自体を表す）
  - ホスト部がすべて1：<b>ブロードキャストアドレス</b>（全員宛ての一斉送信用）
  の2つは機器に割り当てられないので、
  | 接続可能なホスト数 ＝ 2<sup>n</sup> − 2
reasoning: |
  1. ホスト部のビット数：32 − 28 ＝ <b>4ビット</b>
  2. アドレスの総数：2<sup>4</sup> ＝ 16個
  3. ネットワークアドレスとブロードキャストアドレスを除く：
  | 16 − 2 ＝ <b>14台</b>
  4. 具体的な範囲：192.168.30.32（ネットワークアドレス）〜 .47（ブロードキャストアドレス）。機器に割り当てられるのは .33〜.46 の14個です。
  5. 正解は<b>ア</b>です。
choices:
  ア: 14台。2<sup>4</sup>−2＝14 で、計算結果と一致します。<b>正解</b>。
  イ: 16台は、ホスト部4ビットのアドレス総数（2<sup>4</sup>）です。ネットワークアドレスとブロードキャストアドレスの2つを引き忘れています。誤り。
  ウ: 28は、プレフィックス長（ネットワーク部のビット数）の数字です。ホスト数ではありません。誤り。
  エ: 30台は、ホスト部が5ビット（/27）の場合の 2<sup>5</sup>−2 です。/28 ではホスト部は4ビットなので誤り。
example: |
  16部屋あるアパートで、1部屋は「アパート全体の名前を書いた看板（ネットワークアドレス）」、もう1部屋は「全戸に放送するスピーカー（ブロードキャストアドレス）」に使うので、住人が入れるのは14部屋、というイメージです。
review:
  - 接続可能なホスト数＝2<sup>(32−プレフィックス長)</sup>−2。/28なら14台、/27なら30台、/29なら6台。
  - ネットワークアドレス（ホスト部すべて0）とブロードキャストアドレス（すべて1）は機器に割り当てられない。
