q: 45
answer: エ
category: セキュリティ
theme: |
  フリーアドレス制のオフィスで、幹部のPCだけを特定のネットワーク（IPセグメント）に所属させ、一部のサーバにアクセスできるようにする技術を選ぶ問題です。
basics: |
  <b>VLAN（仮想LAN）</b>：1台のネットワークスイッチの中を、論理的に複数のネットワークに分ける技術です。同じスイッチにつながっていても、別のVLANの機器同士は直接通信できません。VLANごとに別のIPセグメント（アドレスの範囲）を割り当てることができます。
  - <b>スタティックVLAN（ポートVLAN）</b>：スイッチの<b>ポート（差込口）ごと</b>に、所属するVLANを固定で決める。どの席のLANポートかで所属が決まる。
  - <b>認証VLAN</b>：PCがネットワークに接続したときに<b>利用者や端末を認証</b>し、その結果に応じて所属するVLANを<b>動的に</b>割り当てる。どの席でも、認証した人に応じたVLANに入れる。

  <b>フリーアドレス制</b>：日によって座る席が変わる働き方です。
reasoning: |
  1. 条件：幹部と一般従業員は同じフロアで、日によって席が変わる。各席のLANポートにPCをつなぐ。スイッチは1台。
  2. スタティックVLANでは席（ポート）ごとにVLANが固定されるので、幹部がどの席に座るか分からないフリーアドレス制では、幹部のPCだけを特定のIPセグメントに入れられません。
  3. 認証VLANなら、PCを接続したときに利用者（幹部か一般従業員か）を認証し、幹部なら幹部用のVLAN（特定のIPセグメント）を動的に割り当てられます。
  4. そのIPセグメントからだけ一部のサーバへのアクセスを許可すれば、幹部のPCだけがアクセスできます。正解は<b>エ</b>です。
choices:
  ア: IDS（侵入検知システム）は、不正な通信を検知して通知する仕組みで、PCに特定のIPセグメントを割り当てる機能はありません。誤り。
  イ: IPマスカレード（NAPT）は、複数のプライベートIPアドレスを1つのグローバルIPアドレスに変換して外部と通信する技術で、幹部のPCだけを区別する目的には使えません。誤り。
  ウ: スタティックVLANは、スイッチのポートごとにVLANを固定するため、席が毎日変わるフリーアドレス制では、幹部のPCだけを特定のVLANに割り当てられません。誤り。
  エ: 認証VLANなら、接続時の認証結果に応じて幹部のPCを特定のVLAN（IPセグメント）に動的に割り当てられるので、どの席でも幹部のPCだけがサーバにアクセスできます。<b>正解</b>。
example: |
  ホテルのカードキーで考えると、スタティックVLANは「部屋の場所でサービスが決まる」方式で、VIPルームに泊まった人だけがラウンジに入れます。認証VLANは「会員カードを見せた人によってサービスが決まる」方式で、どの部屋に泊まってもVIP会員ならラウンジに入れます。席が毎日変わるなら、後者でなければ困ります。
review:
  - 認証VLAN＝接続時の利用者・端末の認証結果でVLANを動的に割り当てる（フリーアドレス制に向く）。
  - スタティックVLAN＝ポートごとにVLANを固定（席が固定の場合向け）。IDS（検知）、IPマスカレード（アドレス変換）とは目的が違う。
