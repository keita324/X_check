q: 47
answer: イ
category: システム開発技術
theme: |
  流れ図の2つの判定について、YesとNoの両方を少なくとも1回ずつ通す「判定条件網羅（分岐網羅）」を、最少のテストケースで満たす組合せを選ぶ問題です。
basics: |
  <b>判定条件網羅（分岐網羅、C1）</b>：プログラム中のすべての判定（ひし形）について、<b>Yesの分岐とNoの分岐を、それぞれ少なくとも1回は通る</b>ようにテストすることです。
  判定が2つあるので、「判定1のYes・No」「判定2のYes・No」の4つの分岐をすべて通す必要があります。

  流れ図の処理
  | まず C←1
  | 判定1：A＞0 かつ B＝0 → Yes：C←A×C、No：C←2
  | 判定2：A＞0 かつ C＝1 → Yes：何もしない、No：C←C²
  判定2の条件にはCが含まれるので、判定1の結果でCがどう変わるかを追う必要があります。
reasoning: |
  各テストケースで、2つの判定がどちらに進むかを計算します。
  | A＝1, B＝0：判定1 Yes（C＝1×1＝1）→ 判定2（A＞0 かつ C＝1）Yes
  | A＝1, B＝1：判定1 No（C＝2）→ 判定2（C＝1でない）No
  | A＝0, B＝0：判定1 No（C＝2）→ 判定2（A＞0でない）No
  | A＝0, B＝1：判定1 No（C＝2）→ 判定2 No
  1. 判定1・判定2とも、<b>Yesになるのは A＝1, B＝0 のときだけ</b>です。
  2. Noの分岐は、他のどのケースでも通ります。
  3. よって「A＝1, B＝0」と、Noを通す1ケース（例：A＝1, B＝1）の<b>2ケース</b>で4つの分岐をすべて通せます。これが最少です（1ケースではYesとNoを両方通せない）。
  4. この組合せは<b>イ</b>です。
choices:
  ア: (1)A＝0,B＝0 も (2)A＝1,B＝1 も、判定1・判定2ともNoになります。Yesの分岐を一度も通らないので、分岐網羅を満たしません。誤り。
  イ: (1)A＝1,B＝0 で判定1・2ともYes、(2)A＝1,B＝1 で判定1・2ともNoを通り、2ケースで全分岐を網羅します。最少です。<b>正解</b>。
  ウ: (3)A＝1,B＝0 でYesを、(1)や(2)でNoを通るので分岐網羅は満たしますが、3ケースあり、最少ではありません（(1)と(2)はどちらもNo/Noで重複）。誤り。
  エ: (3)A＝1,B＝0 でYesを、(1)(2)でNoを通るので分岐網羅は満たしますが、3ケースで最少ではありません。誤り。
example: |
  分かれ道が2か所ある散歩コースで「両方の分かれ道で、右にも左にも一度は進む」ことを目標にするようなものです。「右・右」と進むコースと「左・左」と進むコースの2回歩けば、最少の回数で目標を達成できます。
review:
  - 分岐網羅（C1）は、全判定のYes・Noを各1回以上通すこと。各テストケースで判定がどちらに進むかを表にして確認する。
  - 判定の条件に前の処理で変わる変数（ここではC）がある場合は、値の変化を追ってから判定する。
  - 網羅を満たす組合せのうち「最少」のケース数を選ぶ（3ケースの選択肢は不可）。
