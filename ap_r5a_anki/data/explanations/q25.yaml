q: 25
answer: イ
category: 情報メディア
theme: |
  バーチャルリアリティ（VR）を構成する処理のうち、「レンダリング」が何をする処理かを問う問題です。
basics: |
  <b>バーチャルリアリティ（VR）</b>：コンピュータが作った仮想世界を、現実のように体験できる技術です。次のような処理を組み合わせて実現します。
  - <b>レンダリング</b>：仮想世界の情報（物体の形、色、光源、視点など）から、ディスプレイに表示できる<b>画像を生成する</b>（描画する）処理。
  - <b>トラッキング・センシング</b>：カメラや慣性センサー（加速度・角速度センサー）で、利用者の頭の向き、手の動き、身振りなどを認識する処理。
  - <b>位置合わせ（レジストレーション）</b>：現実世界と仮想世界を重ね合わせる（AR・MRで重要）ために、両者の3次元座標を一致させる処理。
  - <b>シミュレーション</b>：物の移動など時間とともに起こる変化を、物理法則などに当てはめて計算する処理。
reasoning: |
  1. レンダリングは「仮想世界の情報を、ディスプレイに描画できる画像に変換する」処理です。
  2. 「仮想世界の情報をディスプレイに描画可能な形式の画像に変換する処理」という<b>イ</b>が正解です。
choices:
  ア: ウェアラブルカメラや慣性センサーで身振りなどの非言語情報を認識するのは、<b>トラッキング（センシング）</b>の処理です。誤り。
  イ: 仮想世界の情報をディスプレイに描画可能な形式の画像に変換するのは、<b>レンダリング</b>です。<b>正解</b>。
  ウ: 現実世界と仮想世界を視覚的に融合させるために、それぞれの3次元座標を一致させるのは、<b>位置合わせ（レジストレーション）</b>の処理です。誤り。
  エ: 時間経過とともに生じる物の移動などの変化を、モデルを物理法則に当てはめて変化させるのは、<b>シミュレーション</b>の処理です。誤り。
example: |
  VRゲームで、利用者が頭を右に向けると（トラッキング）、ボールが重力で落ちる様子を計算し（シミュレーション）、その場面を利用者の視点から見た映像として1秒に何十回も描き直す（レンダリング）、という流れで処理が行われています。
review:
  - レンダリング＝仮想世界の情報（形状・光・視点）からディスプレイに表示する画像を生成する処理。
  - トラッキング（動きの認識）、位置合わせ（現実と仮想の座標一致）、シミュレーション（物理法則による変化）と区別する。
