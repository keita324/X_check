q: 64
answer: ウ
category: システム戦略
theme: |
  IT投資の効果を評価する指標のうち、「最初の投資額を何年で回収できるか」を表す指標を選ぶ問題です。
basics: |
  <b>キャッシュフロー</b>：お金の出入り。投資で出ていくお金を<b>キャッシュアウト</b>、投資の効果で入ってくるお金を<b>キャッシュイン</b>と呼びます。

  IT投資の主な評価指標
  - <b>PBP（Pay Back Period：回収期間）</b>：投資額（キャッシュアウト）を、毎年のキャッシュインで<b>何年後に回収できるか</b>。短いほど早く元が取れる。
  - <b>ROI（Return On Investment：投資利益率）</b>：投資額に対して、どれだけの利益が得られたかの割合（利益÷投資額）。
  - <b>NPV（Net Present Value：正味現在価値）</b>：将来のキャッシュインを現在の価値に割り引いて合計し、投資額を引いた金額。
  - <b>IRR（Internal Rate of Return：内部収益率）</b>：NPVがちょうど0になる割引率。この率が目標の利回りより高ければ投資する価値があると判断する。
reasoning: |
  1. 問題文は「キャッシュフローベースで、初年度の投資によるキャッシュアウトを何年後に回収できるか」という指標です。
  2. これは名前のとおり「回収（Pay Back）にかかる期間（Period）」＝<b>PBP</b>です。
  3. 例：1,000万円を投資し、毎年400万円のキャッシュインがあれば、400＋400＝800（2年）、＋400＝1,200（3年）なので、3年目に回収できます。
  4. 正解は<b>ウ</b>です。
choices:
  ア: IRR（内部収益率）は、NPVが0になる割引率で、投資の「利回り」を表す指標です。回収にかかる年数ではありません。誤り。
  イ: NPV（正味現在価値）は、将来のキャッシュインの現在価値の合計から投資額を引いた「金額」です。回収年数ではありません。誤り。
  ウ: PBP（回収期間）は、初年度の投資によるキャッシュアウトを何年後に回収できるかを表す指標です。<b>正解</b>。
  エ: ROI（投資利益率）は、投資額に対する利益の「割合」です。回収年数ではありません。誤り。
example: |
  10万円の太陽光パネル付き充電器を買って、毎年2万円の電気代が浮くなら、5年で元が取れます。この「5年」がPBP（回収期間）です。ROIは「投資額に対して何％得したか」、NPVは「将来浮くお金を今の価値に直すといくら得か」を表します。
review:
  - PBP（回収期間）＝投資額を何年で回収できるか。ROI＝利益÷投資額（割合）。
  - NPV＝割引後のキャッシュインの合計−投資額（金額）、IRR＝NPVが0になる割引率（利回り）。
