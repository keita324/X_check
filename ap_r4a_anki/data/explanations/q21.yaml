q: 21
answer: ウ
theme: |
  電子回路の基本部品（コイル・コンデンサ・ダイオード・抵抗器）の働きを区別し、「整流作用」をもつ部品を選ぶ問題です。
basics: |
  <b>交流と直流</b>：家庭のコンセントの電気は、電流の向きが1秒間に何十回も入れ替わる<b>交流</b>です。一方、電池やスマホ・パソコンの内部回路は、向きが一定の<b>直流</b>で動きます。
  <b>整流</b>：交流を直流に変えること。そのために「電流を<b>一方向にだけ</b>流し、逆方向には流さない」性質（<b>整流作用</b>）をもつ部品を使います。

  <b>4つの部品の働き</b>
  - <b>コイル</b>：電線を巻いたもの。電流の変化を妨げる性質があり、ノイズ除去や変圧器などに使う。
  - <b>コンデンサ</b>：電気を一時的に蓄えたり放出したりする。電圧を平らにならす用途などに使う。
  - <b>ダイオード</b>：電流を一方向（順方向）にだけ流し、逆方向には流さない半導体素子。
  - <b>抵抗器</b>：電流を流れにくくして、電流や電圧の大きさを調整する。
reasoning: |
  1. 「整流作用」＝電流を一方向にだけ通す性質です。
  2. 4つのうち、向きによって電流を通したり止めたりできるのはダイオードだけです。
  3. 正解は<b>ウ</b>です。（実際の電源回路では、ダイオードで向きを揃えた後、コンデンサで電圧の凸凹をならして直流にします。）
choices:
  ア: コイルは電流の変化を妨げる性質（インダクタンス）をもちますが、電流の向きを一方向に制限する働きはありません。誤り。
  イ: コンデンサは電気を蓄え・放出する部品で、整流後の電圧を平滑化（なめらかに）する役には使いますが、整流作用そのものはもちません。誤り。
  ウ: ダイオードは順方向にだけ電流を流す整流作用をもちます。<b>正解</b>。
  エ: 抵抗器は電流を流れにくくして大きさを調整するだけで、向きによる違いはありません。誤り。
example: |
  ダイオードは、電気の「逆止弁」や、駅の「一方通行の改札（出口専用ゲート）」のようなものです。一方向からは通れますが、逆方向からは通れません。スマホの充電器（ACアダプター）の中で、コンセントの交流を直流に変えるのに使われています。
review:
  - 整流＝交流→直流。整流作用をもつのはダイオード（電流を一方向にだけ流す）。
  - コイル（電流の変化を妨げる）・コンデンサ（電気を蓄える）・抵抗器（電流を制限する）の役割を一言で区別できるようにする。
