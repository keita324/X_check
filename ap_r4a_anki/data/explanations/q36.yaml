q: 36
answer: ウ
theme: |
  誰からの問合せにも答えてしまう「オープンリゾルバ」状態のDNSサーバが悪用される攻撃（DNSリフレクション攻撃／DNSアンプ攻撃）を選ぶ問題です。
basics: |
  <b>DNS</b>：「www.example.com」のようなドメイン名を、IPアドレスに変換する仕組み（インターネットの電話帳）です。
  <b>DNSサーバ（リゾルバ）</b>：利用者の代わりにドメイン名を調べて答えるサーバ。本来は自社の社員など決まった利用者からの問合せにだけ答えるべきものです。
  <b>オープンリゾルバ</b>：設定の不備などで、<b>インターネット上の誰からの問合せにも答えてしまう</b>DNSサーバです。

  <b>送信元IPアドレスの偽装</b>：パケットの「差出人」欄を他人のアドレスに書き換えることです。UDPを使うDNSの問合せは、接続確認をしないため偽装しやすいという弱点があります。
  <b>DDoS攻撃</b>：大量のデータを送りつけて、相手のサーバや回線をパンクさせる攻撃です。
reasoning: |
  1. 攻撃者は、問合せの送信元IPアドレスを<b>攻撃対象のアドレスに偽装</b>して、多数のオープンリゾルバにDNS問合せを送ります。
  2. オープンリゾルバは、偽装された「送信元」＝攻撃対象へ応答を返します。
  3. DNSの応答は問合せより何倍も大きくできるので、攻撃者が送った量の何十倍ものデータが攻撃対象に集中します（反射＝リフレクション、増幅＝アンプ）。
  4. この手口の説明は<b>ウ</b>です。
choices:
  ア: ICMPパケット（pingなど）の送信元を偽装し、多数の宛先に送って攻撃対象に応答を集中させるのは<b>smurf（スマーフ）攻撃</b>です。DNSサーバは使わないので誤り。
  イ: PC内のhostsファイル（ドメイン名とIPアドレスの対応表）を書き換えて偽サイトに誘導するのは、マルウェアなどによる<b>ファーミング</b>の手口です。オープンリゾルバとは関係ありません。誤り。
  ウ: 送信元IPアドレスを偽装したDNS問合せを多数のDNSサーバ（オープンリゾルバ）に送り、攻撃対象に大量の応答を送りつける。<b>DNSリフレクション（アンプ）攻撃</b>です。<b>正解</b>。
  エ: 誰でもメールを送信できるメールサーバを踏み台にするのは、<b>オープンリレー（第三者中継）</b>の悪用です。DNSのオープンリゾルバではなくメールサーバの問題です。誤り。
example: |
  いたずら者が、大勢の通販会社に「カタログを送ってください」と、差出人を他人の住所にして葉書を出すようなものです。被害者の家には、頼んでもいない分厚いカタログ（大きな応答）が大量に届きます。誰の依頼でも受け付けてしまう通販会社（オープンリゾルバ）が、知らないうちに攻撃の道具にされています。
review:
  - オープンリゾルバ悪用＝送信元IPを攻撃対象に偽装したDNS問合せ→大量の応答が攻撃対象に集中（DNSリフレクション/アンプ攻撃）。
  - smurf攻撃（ICMP）、ファーミング（hostsファイル・DNSの書換え）、オープンリレー（メールサーバ）と区別する。
  - 対策は、DNSサーバが応答する相手を自組織に限定する（オープンリゾルバにしない）こと。
