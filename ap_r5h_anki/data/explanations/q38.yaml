q: 38
answer: ウ
category: セキュリティ
theme: |
  RSA方式のデジタル署名で、署名を確かめるための「検証鍵」が誰のどの鍵で、何に使うのかを問う問題です。
basics: |
  <b>公開鍵暗号（RSAなど）</b>では、ペアになった2つの鍵を使います。
  - <b>秘密鍵</b>：本人だけが持つ。デジタル署名では<b>署名鍵</b>として、署名を作るのに使う。
  - <b>公開鍵</b>：誰でも入手できる。デジタル署名では<b>検証鍵</b>として、署名を確かめるのに使う。

  <b>メッセージダイジェスト</b>：メッセージをハッシュ関数にかけて得られる、短い固定長の値です。メッセージが1文字でも変わると、全く違う値になります。

  <b>デジタル署名の流れ</b>
  1. 送信者：メッセージダイジェストを作り、<b>送信者の秘密鍵</b>（署名鍵）で処理してデジタル署名を作る。メッセージと署名を送る。
  2. 受信者：デジタル署名を<b>送信者の公開鍵</b>（検証鍵）で処理してメッセージダイジェストを取り出す。受け取ったメッセージから自分でもダイジェストを計算し、両者が一致すれば「送信者本人が署名し、改ざんされていない」と確認できる。
reasoning: |
  1. 検証鍵は「送信者の公開鍵」です。誰でも入手できるので、受信者は送信者本人の署名かを確かめられます。
  2. 使い方は「受信者が、デジタル署名からメッセージダイジェストを取り出す（復元する）」ことです。
  3. 「送信者の公開鍵であり、受信者がデジタル署名からメッセージダイジェストを取り出す際に使用する」という<b>ウ</b>が正解です。
choices:
  ア: 受信者の公開鍵は、受信者宛てにメッセージを<b>暗号化</b>するときに使う鍵です。デジタル署名の作成にも検証にも使いません。誤り。
  イ: 受信者の秘密鍵は、受信者の公開鍵で暗号化されたメッセージを<b>復号</b>するときに使う鍵です。デジタル署名の検証には使いません。誤り。
  ウ: 検証鍵は送信者の公開鍵で、受信者がデジタル署名からメッセージダイジェストを取り出す際に使います。<b>正解</b>。
  エ: 送信者の秘密鍵で、メッセージダイジェストからデジタル署名を作成するのは、<b>署名鍵</b>の使い方です。問題は検証鍵を問うているので誤り。
example: |
  送信者の秘密鍵は「本人だけが持つ実印」、公開鍵は「役所に登録された印鑑証明」です。手紙に実印を押す（署名作成）のは送信者、受け取った人が印鑑証明と照らし合わせて本物の印かを確かめる（検証）のに使うのが、送信者の公開鍵です。
review:
  - デジタル署名：署名鍵＝送信者の秘密鍵（署名作成）、検証鍵＝送信者の公開鍵（受信者が署名からダイジェストを取り出して照合）。
  - 暗号化（受信者の公開鍵で暗号化、受信者の秘密鍵で復号）と鍵の使い方を混同しない。
