q: 36
answer: ア
category: セキュリティ
theme: |
  マルウェアに感染したコンピュータの集団「ボットネット」で、司令塔となる「C&amp;Cサーバ」がどんな役割を担うかを問う問題です。
basics: |
  <b>ボット</b>：感染したコンピュータを、外部から<b>遠隔操作</b>できるようにしてしまうマルウェアです。感染したPCの持ち主は、気づかないうちに攻撃に加担させられます。
  <b>ボットネット</b>：ボットに感染した多数のコンピュータで構成されるネットワークです。
  <b>C&amp;Cサーバ（Command and Control サーバ）</b>：攻撃者が用意する<b>司令塔</b>のサーバです。ボットに感染したPCはC&amp;Cサーバと通信し、命令を受け取ります。命令の例：
  - 感染PC内の情報を集めて送らせる（情報収集）
  - 一斉に特定のサイトへアクセスさせる（DDoS攻撃）、迷惑メールを送らせる（攻撃活動）
  - 新しいマルウェアをダウンロードさせる
reasoning: |
  1. C&amp;Cサーバの役割は、ボットネットを構成する感染PC（遠隔操作が可能なマルウェア）に対して<b>命令を出す</b>ことです。
  2. 「遠隔操作が可能なマルウェアに、情報収集及び攻撃活動を指示する」という<b>ア</b>が正解です。
choices:
  ア: 遠隔操作が可能なマルウェア（ボット）に、情報収集や攻撃活動を指示するのがC&amp;Cサーバの役割です。<b>正解</b>。
  イ: 攻撃の踏み台となった複数のサーバからの通信を制御して遮断するのは、ファイアウォールやIPSなど<b>防御側</b>の機器の役割です。C&amp;Cサーバは攻撃者側の司令塔です。誤り。
  ウ: 偽のデジタル証明書の発行を命令することは、C&amp;Cサーバの役割ではありません。証明書を発行するのは認証局です。誤り。
  エ: Webコンテンツのテキスト・画像・レイアウト情報を一元的に管理するのは<b>CMS（コンテンツ管理システム）</b>の役割です。誤り。
example: |
  ボットネットは「眠っているスパイの集団」、C&amp;Cサーバは「スパイに指令を出す本部」です。普段はおとなしくしている感染PCが、本部から「○月○日にこのサイトへ一斉にアクセスせよ」と指令を受けると、何千台ものPCが同時に動き出します。
review:
  - C&amp;Cサーバ＝ボットネットの司令塔。感染PC（ボット）に情報収集や攻撃（DDoS、スパム送信など）を指示する。
  - 対策として、C&amp;Cサーバとの通信を検知・遮断することが重要。
