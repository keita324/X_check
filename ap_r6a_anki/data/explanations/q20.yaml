q: 20
answer: ウ
category: ソフトウェア
theme: |
  手続型言語（C言語など）のコンパイラが、ソースプログラムを機械語に変換する過程で行う処理の順番を理解し、コード生成の直前（最後）に行う処理を選ぶ問題です。
basics: |
  <b>コンパイラ</b>：人が書いたソースプログラムを、コンピュータが実行できる目的プログラム（機械語）に変換するプログラムです。一般に次の順で処理を行います。
  | ① <b>字句解析</b>：ソースプログラムの文字の並びを、意味のある最小単位（<b>トークン</b>：変数名、数値、演算子、予約語など）に分解する。
  | ② <b>構文解析</b>：トークンの並びが文法に合っているかを調べ、構文木（文の構造）を作る。
  | ③ <b>意味解析</b>：変数の型が合っているか、宣言されているかなど、意味的な正しさを調べる。
  | ④ <b>最適化</b>：実行速度が速く、使うメモリが少なくなるように、プログラムを改善する。
  | ⑤ <b>コード生成</b>：目的プログラム（機械語）を生成する。
  覚え方：「字・構・意・最・コード」（字句→構文→意味→最適化→コード生成）。
reasoning: |
  1. コンパイラの処理順は、字句解析 → 構文解析 → 意味解析 → 最適化 → コード生成 です。
  2. コード生成までに行う処理のうち、最後に行うのは<b>最適化</b>です。
  3. 正解は<b>ウ</b>です。
choices:
  ア: 意味解析は、構文解析の後に行いますが、その後に最適化があるので最後ではありません。誤り。
  イ: 構文解析は、字句解析の次に行う処理で、最後ではありません。誤り。
  ウ: 最適化は、意味解析の後、コード生成の直前に行う処理で、コード生成までの処理の中で最後に行います。<b>正解</b>。
  エ: 字句解析は、コンパイラが最初に行う処理です。誤り。
example: |
  英文を日本語に翻訳する作業に例えると、単語に区切る（字句解析）→文の構造を把握する（構文解析）→意味が通るか確かめる（意味解析）→読みやすく言い回しを整える（最適化）→日本語の文章として書き出す（コード生成）、という流れです。
review:
  - コンパイラの処理順：字句解析→構文解析→意味解析→最適化→コード生成。
  - 字句解析はトークンへの分解、構文解析は文法チェック（構文木）、意味解析は型などの意味チェック、最適化は効率化。
