q: 47
answer: ウ
category: システム開発技術
theme: |
  複数の条件の組合せと、それぞれのときに行う動作を表にまとめた「決定表（デシジョンテーブル）」を、値引き条件から正しく完成させる問題です。
basics: |
  <b>決定表</b>：上半分に<b>条件</b>の組合せ（Y＝成り立つ、N＝成り立たない）、下半分に各組合せで行う<b>動作</b>（X＝実行する、−＝実行しない）を並べた表です。条件の見落としや矛盾を防ぐのに使います。
  この問題の値引き条件
  - ①上得意客なら3%、②高額取引なら3%、③現金取引なら3%を値引きする。
  - ④①〜③は<b>同時に適用</b>する（当てはまる条件の数×3%を値引きする）。
  つまり、Yの数が0個なら値引きなし、1個なら3%、2個なら6%、3個なら9%です。
reasoning: |
  決定表の8つの列について、Yの数を数えて値引き率を決めます（列は左から1〜8）。
  | 列1：Y Y Y → 3個 → 9%
  | 列2：Y Y N → 2個 → 6%
  | 列3：Y N Y → 2個 → 6%
  | 列4：Y N N → 1個 → 3%
  | 列5：N Y Y → 2個 → 6%
  | 列6：N Y N → 1個 → 3%
  | 列7：N N Y → 1個 → 3%
  | 列8：N N N → 0個 → 値引きしない
  動作指定部の各行にXが入るべき列は、
  | 値引きしない：列8
  | 3%：列4・6・7
  | 6%：列2・3・5
  | 9%：列1
  この並びになっているのは<b>ウ</b>です。
choices:
  ア: 3%の行に列3（Y N Y、本来は6%）が、6%の行に列7（N N Y、本来は3%）が、9%の行に列5（N Y Y、本来は6%）が入っているなど、Yの数と値引き率が対応していません。誤り。
  イ: 値引きしない行に列3（Y N Y、本来は6%）が入っているなど、対応が誤っています。誤り。
  ウ: 値引きしない＝列8、3%＝列4・6・7、6%＝列2・3・5、9%＝列1で、Yの数×3%と完全に一致します。<b>正解</b>。
  エ: 値引きしない行に列4（Y N N、本来は3%）が入っているなど、対応が誤っています。誤り。
example: |
  スーパーで「会員なら3%引き、1万円以上なら3%引き、現金払いなら3%引き、全部重ねて使える」というルールがあると、「会員で現金払い（1万円未満）」なら6%引きです。8通りの組合せを表にしておけば、レジ係が迷わずに済み、計算ミスも防げます。
review:
  - 決定表は「条件の組合せ（Y/N）」と「動作（X/−）」を列ごとに対応させる表。
  - 同時適用の条件では、Yの数を数えて動作を決める。各列を1つずつ確認して選択肢と照合する。
