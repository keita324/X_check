q: 56
answer: イ
category: サービスマネジメント
theme: |
  サービスの可用性（稼働率）99%以上という条件を守るために、1か月に許容されるサービスの停止時間を、計画停止を除いて計算する問題です。
basics: |
  <b>可用性</b>：サービスを提供すべき時間のうち、実際に提供できた時間の割合です。
  | 可用性 ＝ 実際に提供できた時間 ÷ 提供すべき時間
  <b>計画停止</b>：メンテナンスなどのため、あらかじめ決めて利用者に知らせてある停止です。サービス提供条件で「計画停止時間を除いて提供する」とされているので、計画停止の時間は<b>提供すべき時間に含めません</b>。
  したがって、可用性99%以上を守るために許容される（計画外の）停止時間は、
  | 許容停止時間 ＝ 提供すべき時間 × (1 − 0.99)
reasoning: |
  1. 1か月の総時間：30日 × 24時間 ＝ 720時間
  2. 計画停止の時間：毎週月曜日の0時〜6時（6時間）× 4回 ＝ 24時間
  3. サービスを提供すべき時間：720 − 24 ＝ <b>696時間</b>
  4. 可用性99%以上を守るための許容停止時間：
  | 696 × (1 − 0.99) ＝ 696 × 0.01 ＝ 6.96時間
  5. 小数第1位を切り捨てると <b>6時間</b>（7時間にすると可用性が99%を下回るので、切り捨てが条件を満たす側）。
  6. 正解は<b>イ</b>です。
choices:
  ア: 0時間では、停止を全く許さないことになります。可用性99%なら、6.96時間までの停止は許容されます。誤り。
  イ: 6時間。提供すべき時間696時間の1%（6.96時間）の小数第1位を切り捨てた値です。<b>正解</b>。
  ウ: 7時間は、計画停止を除かずに 720×0.01＝7.2時間 とした値（または6.96を四捨五入した値）です。7時間停止すると、(696−7)÷696≒98.99%となり、99%を下回ります。誤り。
  エ: 13時間停止すると、可用性は (696−13)÷696 ≒ 98.1% となり、99%を下回ります。誤り。
example: |
  1か月に696時間営業すると決めたお店で、「営業時間の99%以上は開けておく」と約束したなら、臨時休業してよいのは合計6.96時間まで、つまり6時間までです。定休日（計画停止）は、そもそも営業時間に含めません。
review:
  - 計画停止は提供すべき時間から除く：696時間＝720−24。許容停止時間＝提供すべき時間×（1−可用性）。
  - 端数は「条件を満たす側」に処理する（6.96→6時間）。7時間では99%を下回ることを確認する。
