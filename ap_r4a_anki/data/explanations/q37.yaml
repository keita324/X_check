q: 37
answer: ア
theme: |
  「サイドチャネル攻撃」がどのような攻撃かを、ソーシャルエンジニアリングや中間者攻撃、SQLインジェクションと区別する問題です。
basics: |
  <b>暗号</b>：データを第三者に読まれないよう変換する技術。安全性は「秘密の鍵」を知られないことに支えられています。
  <b>サイドチャネル（副次的な経路）</b>：本来の入出力（暗号文など）ではない、「横から漏れてくる情報」のことです。例えば、
  - 処理にかかった<b>時間</b>（鍵の値によって計算時間がわずかに変わる）
  - <b>消費電力</b>の変化
  - 機器から出る<b>電磁波</b>や音
  - <b>エラーメッセージ</b>の違い
  <b>サイドチャネル攻撃</b>：暗号の理論そのものを破るのではなく、暗号を実装した機器（ICカードなど）を観測して、こうした物理量の変化から秘密鍵などを推測する攻撃です。
reasoning: |
  1. 「サイドチャネル」＝処理時間・消費電力・電磁波など、機器から副次的に漏れる情報。
  2. それを使って秘密情報を得る、と説明しているのは<b>ア</b>です。
  3. 他の選択肢は、別の名前の攻撃手法です。
choices:
  ア: 暗号を実装した機器から得られる物理量（処理時間、消費電力など）やエラーメッセージから秘密情報を得る。<b>サイドチャネル攻撃</b>の説明です。<b>正解</b>。
  イ: オフィスの紙ごみの中から捨てられた秘密情報の印刷物を探し出すのは、<b>トラッシング（スキャビンジング）</b>と呼ばれるソーシャルエンジニアリングの手口です。誤り。
  ウ: 通信する2者の間に割り込み、情報をすり替えて気付かれずに盗聴するのは、<b>中間者攻撃（MITM：Man-in-the-Middle攻撃）</b>です。誤り。
  エ: Webサイトの入力欄にSQL文の断片を送り込み、データベースを不正に操作するのは<b>SQLインジェクション</b>です。誤り。
example: |
  金庫のダイヤルを回すとき、正しい番号でだけ「カチッ」と音がわずかに違うとしたら、その音を聞き分けて番号を当てられます。これがサイドチャネル攻撃の発想です。暗号そのもの（金庫の構造）は強くても、作動するときに漏れる手がかりから秘密を推測します。
review:
  - サイドチャネル攻撃＝処理時間・消費電力・電磁波などの物理的な「漏れ」から秘密鍵などを推測する攻撃。
  - トラッシング（ごみ箱あさり）、中間者攻撃（通信の割込み）、SQLインジェクション（SQL文の注入）と区別する。
