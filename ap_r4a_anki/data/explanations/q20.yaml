q: 20
answer: ウ
theme: |
  IoT機器や制御システムで使われる「アクチュエーター」の役割を、センサーやA/D変換器などと区別する問題です。
basics: |
  コンピュータが現実世界とやりとりするには、「現実を読み取る部品」と「現実を動かす部品」が必要です。
  - <b>センサー</b>：温度・光・圧力などの<b>物理量を検出して電気信号に変える</b>部品（現実 → コンピュータ）。
  - <b>A/D変換器</b>：連続的に変化するアナログ信号を、コンピュータが扱える0と1のデジタル信号に変える部品。
  - <b>アクチュエーター</b>：コンピュータからの<b>電気信号を、モーターの回転や弁の開閉などの物理的な動き（力学的な運動）に変える</b>部品（コンピュータ → 現実）。
  - <b>入力装置</b>：キーボードやタッチパネルなど、人が情報をコンピュータに入れるための装置。
reasoning: |
  1. 「アクチュエーター（actuator）」は「act＝動かす」に由来し、何かを<b>動かす</b>装置です。
  2. コンピュータの出力（電気信号）を受け取り、モーターやシリンダーなどで物を動かします。
  3. この説明は「コンピュータが出力した電気信号を力学的な運動に変える」の<b>ウ</b>です。
choices:
  ア: アナログ電気信号をデジタル信号に変えるのは<b>A/D変換器</b>（アナログ/デジタル変換器）です。誤り。
  イ: キーボードやタッチパネルなどで情報を入力するのは<b>入力装置</b>です。誤り。
  ウ: コンピュータが出力した電気信号を力学的な運動に変える。<b>アクチュエーター</b>の説明です。<b>正解</b>。
  エ: 物理量を検出して電気信号に変えるのは<b>センサー</b>です。アクチュエーターと逆向きの働きをします。誤り。
example: |
  エアコンの自動運転を例にすると、温度センサーが室温を測り（センサー）、その値をデジタル化して（A/D変換）、コンピュータが判断し、ルーバー（風向き板）のモーターを動かします（アクチュエーター）。スマートロックで鍵を回すモーターも、アクチュエーターです。
review:
  - センサー＝「物理量→電気信号」（入口）、アクチュエーター＝「電気信号→動き」（出口）と、向きで区別する。
  - A/D変換器（アナログ→デジタル）も含め、IoTの「読み取り→判断→動かす」流れの中での位置づけを覚える。
