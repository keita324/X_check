q: 24
answer: ア
category: ユーザーインタフェース
theme: |
  アイコンの評価基準を定めたJIS X 9303-1で、アイコンの「習得性」が何を意味するかを、他のアイコンの性質と区別する問題です。
basics: |
  <b>アイコン</b>：機能や対象を小さな図柄で表したもの（ゴミ箱のアイコン＝削除、など）。
  <b>JIS X 9303-1</b>：ユーザインタフェースで使うアイコンについて、望ましい性質を定めた規格です。アイコンの良し悪しを、いくつかの観点で評価します。
  - <b>習得性</b>：アイコンが表す機能を一度理解した後に、それを<b>どれだけ容易に思い出せるか</b>（覚えやすさ）。
  - そのほか、アイコンの図柄の細部をどれだけ容易に区別できるか（見分けやすさ）、以前の経験からどれだけ容易にアイコンを識別できるか、近くに表示された他のアイコンとどれだけ容易に区別できるか、といった観点もあります。
  「習得」は「習って身に付ける」ことなので、<b>一度学んだことを覚えていられるか</b>がポイントです。
reasoning: |
  1. 習得性は「理解した後に、どれだけ容易に思い出すことができるか」を示します。
  2. 「アイコンによって表現されたシステム機能が、それが理解された後に、どれだけ容易に思い出すことができるかを示す」という<b>ア</b>が正解です。
  3. イ・ウ・エは、いずれもアイコンを「見分ける・区別する」ことに関する別の性質の説明です。
choices:
  ア: 理解した後に、そのアイコンが表す機能をどれだけ容易に思い出せるかを示すのは、<b>習得性</b>です。<b>正解</b>。
  イ: アイコンの図柄の詳細をどれだけ容易に区別できるかは、図柄の見分けやすさに関する別の性質で、習得性（覚えやすさ）ではありません。誤り。
  ウ: 同じ又は類似したアイコンを使った以前の経験から、どれだけ容易にアイコンを識別できるかは、経験に基づく識別のしやすさに関する別の性質で、習得性ではありません。誤り。
  エ: 近くに表示された別のアイコンから、どれだけ容易に区別できるかは、他のアイコンとの見分けやすさに関する別の性質で、習得性ではありません。誤り。
example: |
  初めてスマホを使う人が「歯車のマーク＝設定」と一度教わったら、次からはすぐに思い出せる。これが習得性の高いアイコンです。意味を毎回確認しないと分からないアイコンは、習得性が低いといえます。
review:
  - 習得性＝アイコンが表す機能を一度理解した後、どれだけ容易に思い出せるか（覚えやすさ）。
  - 図柄の細部の区別、経験による識別、近くのアイコンとの区別は、見分けやすさに関する別の性質。
