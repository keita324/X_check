q: 67
answer: ア
category: 経営戦略マネジメント
theme: |
  H.I.アンゾフの「成長マトリクス」の説明を、ポーターの競争戦略・PPM・SWOT分析と区別する問題です。
basics: |
  <b>アンゾフの成長マトリクス</b>：<b>製品軸</b>（既存製品か新製品か）と<b>市場軸</b>（既存市場か新市場か）の2軸で、事業の成長戦略を4つに分ける手法です。
  | 既存製品×既存市場：市場浸透
  | 既存製品×新市場：市場開拓（新市場開拓）
  | 新製品×既存市場：製品開発
  | 新製品×新市場：多角化

  紛らわしいフレームワーク
  - <b>ポーターの競争戦略（3つの基本戦略）</b>：コストで優位に立つか、コスト以外で差別化するか、ターゲットを広くするか集中するかで、コストリーダーシップ・差別化・集中の戦略を考える。
  - <b>PPM</b>：市場成長率と相対的市場シェアの2軸で事業を分類し、資源配分を考える（花形・金のなる木・問題児・負け犬）。
  - <b>SWOT分析</b>：内部環境の強み・弱み、外部環境の機会・脅威を抽出して戦略を考える。
reasoning: |
  1. アンゾフの成長マトリクスのキーワードは「製品軸（既存か新か）」と「市場軸（既存か新か）」の2軸、「事業成長戦略」です。
  2. これを述べているのは<b>ア</b>です。
choices:
  ア: 既存製品か新製品かという製品軸と、既存市場か新市場かという市場軸の両軸で事業成長戦略を考えるのは、<b>アンゾフの成長マトリクス</b>です。<b>正解</b>。
  イ: コストで優位に立つか差別化するか、ターゲットを広くするか集中するかで戦略を考えるのは、<b>ポーターの競争戦略</b>（3つの基本戦略）です。誤り。
  ウ: 市場成長率と相対的市場シェアで事業を捉え、資源配分を考えるのは、<b>PPM</b>です。誤り。
  エ: 内部環境の強み・弱みと外部環境の機会・脅威を抽出して戦略を考えるのは、<b>SWOT分析</b>です。誤り。
example: |
  パン屋で考えると、常連さんにもっと買ってもらう（市場浸透）、隣町に出店する（市場開拓）、今のお客さん向けにケーキを始める（製品開発）、カフェ事業を新しい客層向けに始める（多角化）、と整理できます。
review:
  - アンゾフの成長マトリクス＝製品軸（既存・新）×市場軸（既存・新）で、市場浸透・市場開拓・製品開発・多角化の4戦略。
  - ポーターの競争戦略（コスト・差別化・集中）、PPM（成長率×シェア）、SWOT（強み・弱み・機会・脅威）と区別する。
