q: 6
answer: イ
category: アルゴリズムとプログラミング
theme: |
  ハッシュ表でデータの格納場所がぶつかる「衝突（シノニム）」が起きる条件を、割り算の余り（mod）の性質から考える問題です。
basics: |
  <b>ハッシュ表</b>：データを高速に探すための表です。キー（例：会員番号）を<b>ハッシュ関数</b>という計算式に入れ、その計算結果を「格納する場所の番号」として使います。探すときも同じ計算をすれば、表の全体を順番に調べなくても一発で場所が分かります。

  <b>x mod n</b>：xをnで割った余りです。例：17 mod 5 = 2（17=5×3+2）。余りは必ず 0〜n−1 の範囲になるので、大きさnの表の番号として使えます。

  <b>衝突</b>：異なるキーなのに、ハッシュ関数の結果（格納場所）が同じになってしまうことです。
reasoning: |
  1. 衝突の条件は「a mod n ＝ b mod n」、つまり<b>aとbをnで割った余りが等しい</b>ことです。
  2. 余りが同じ r だとすると、次のように書けます（p, q は商）。
  | a = n×p + r
  | b = n×q + r
  3. 引き算すると余りrが消えます。
  | a − b = n×p − n×q = n×(p − q)
  4. つまり a−b は n の倍数です。逆に a−b が nの倍数なら、aとbの余りは等しくなります。
  5. 具体例：n=5、a=17、b=7 → 17 mod 5=2、7 mod 5=2 で衝突。a−b=10 は5の倍数。
  6. 正解は<b>イ</b>「a−bがnの倍数」です。
choices:
  ア: 「a+bがnの倍数」。n=5、a=1、b=4 なら a+b=5 は5の倍数ですが、1 mod 5=1、4 mod 5=4 で余りが違い、衝突しません。誤り。
  イ: 「a−bがnの倍数」。上の式変形のとおり、余りが等しいことと同じ意味です。<b>正解</b>。
  ウ: 「nがa+bの倍数」。nとa+bの関係が逆です。n=10、a=2、b=3（a+b=5、10は5の倍数）なら余りは2と3で衝突しません。誤り。
  エ: 「nがa−bの倍数」。これも関係が逆です。n=10、a=5、b=3（a−b=2、10は2の倍数）なら余りは5と3で衝突しません。誤り。
example: |
  時計は「12で割った余り」の世界です。13時と1時は時計の針が同じ位置（衝突）になります。13−1=12 は12の倍数です。同様に、25時（翌日の1時）と1時の差24も12の倍数です。
review:
  - 「aとbの余りが等しい」⇔「a−bがnの倍数」を、a=np+r、b=nq+r の式で説明できるようにする。
  - 「Xの倍数」と「XがYの倍数」の向きの違い（ウ・エのひっかけ）に注意する。
