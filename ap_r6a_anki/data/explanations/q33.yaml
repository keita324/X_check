q: 33
answer: ウ
category: ネットワーク
theme: |
  ドメイン名とIPアドレスを対応付けるDNSの用語（レコードの種類、リゾルバ、逆引き）を正しく理解しているかを問う問題です。
basics: |
  <b>DNS</b>：ドメイン名（ホスト名）とIPアドレスを対応付ける仕組みです。
  - <b>正引き</b>：ホスト名から、対応する<b>IPアドレス</b>を調べること。
  - <b>逆引き</b>：IPアドレスから、対応する<b>ホスト名</b>を調べること。
  - <b>リゾルバ</b>：DNSサーバに問い合わせを行うソフトウェア（PCのOSに組み込まれているものなど）。「レゾリューション（resolution）」は名前解決という処理の名前で、ソフトウェアの名前ではありません。
  主なDNSのレコード（登録する情報の種類）
  | A：ホスト名に対応するIPv4アドレス
  | <b>NS</b>：そのドメインを管理する<b>DNSサーバ</b>のホスト名
  | <b>MX</b>：そのドメイン宛てのメールを受け取る<b>メールサーバ</b>のホスト名
  | <b>CNAME</b>：ホスト名に対する<b>別名</b>
  | PTR：IPアドレスに対応するホスト名（逆引き用）
reasoning: |
  1. ア：DNSサーバのホスト名を登録するのは<b>NS</b>レコード。MXはメールサーバ → ×。
  2. イ：DNSサーバに問い合わせを行うソフトウェアは<b>リゾルバ</b> → ×。
  3. ウ：IPアドレスに対応するホスト名を調べることを<b>逆引き</b>という → ○。
  4. エ：ホスト名に対する別名を登録するのは<b>CNAME</b>レコード。NSはDNSサーバ → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: DNSサーバのホスト名を登録するレコードは<b>NSレコード</b>です。MXレコードは、メールサーバのホスト名を登録するレコードです。誤り。
  イ: DNSサーバに問い合わせを行うソフトウェアは<b>リゾルバ</b>です。レゾリューションは名前解決という処理のことです。誤り。
  ウ: IPアドレスに対応するホスト名を調べることを<b>逆引き</b>といいます。<b>正解</b>。
  エ: ホスト名に対して別名を登録するレコードは<b>CNAMEレコード</b>です。NSレコードはDNSサーバを示すレコードです。誤り。
example: |
  電話帳に例えると、名前から電話番号を調べるのが正引き、電話番号から誰の番号かを調べるのが逆引きです。「この地域の電話帳を管理している人」がNS、「この会社の郵便受付窓口」がMX、「あだ名」がCNAMEです。
review:
  - 正引き＝ホスト名→IPアドレス、逆引き＝IPアドレス→ホスト名。DNSに問い合わせるソフトウェアはリゾルバ。
  - レコード：A（IPv4アドレス）、NS（DNSサーバ）、MX（メールサーバ）、CNAME（別名）、PTR（逆引き）。
