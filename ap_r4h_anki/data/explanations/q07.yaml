q: 7
answer: エ
category: アルゴリズムとプログラミング
theme: |
  プログラム言語の書き方の特徴として、ブロック（処理のまとまり）の範囲を「字下げ（インデント）」で表す言語を選ぶ問題です。
basics: |
  <b>ブロック</b>：if文やfor文の中で実行される処理のまとまりです。どこからどこまでがブロックかを、言語ごとの決まりで示します。
  - <b>記号で示す言語</b>：C、Java、PHP などは、波かっこ <code>{ }</code> でブロックの始まりと終わりを示します。字下げは見やすさのためで、文法上の意味はありません。
  - <b>予約語で示す言語</b>：Ruby や Visual Basic などは <code>end</code> や <code>End If</code> などの決まった単語でブロックの終わりを示します。
  - <b>字下げで示す言語</b>：<b>Python</b> は、同じ文字数だけ字下げされた行を1つのブロックとみなします。字下げが文法そのものです。
reasoning: |
  1. 問題文の「特定の記号や予約語を用いず、等しい文字数の字下げを用いる」は、オフサイドルールと呼ばれる書き方です。
  2. 代表的な言語はPythonです。例えば
  | if x > 0:
  | 　　print("正")
  | 　　print("終わり")
  のように、字下げをそろえた2行がifのブロックになります。
  3. 正解は<b>エ</b>です。
choices:
  ア: C言語は、ブロックを波かっこ { } で囲んで示します。誤り。
  イ: Javaも、ブロックを波かっこ { } で示します。誤り。
  ウ: PHPも、ブロックを主に波かっこ { } で示します（endif などの予約語を使う書き方もあります）。誤り。
  エ: Pythonは、記号や予約語ではなく、等しい文字数の字下げ（インデント）でブロックを示します。<b>正解</b>。
example: |
  文章で例えると、C言語は「（ここから）…（ここまで）」とかっこで囲んで範囲を示し、Pythonは箇条書きの「段下げ」だけで、どこまでが同じ項目かを示すイメージです。Pythonで字下げがずれると、エラーになったり、意図しない動作になったりします。
review:
  - Pythonは字下げ（インデント）でブロックを表す。字下げが文法上の意味を持つ。
  - C・Java・PHPは波かっこ { } でブロックを表す。
