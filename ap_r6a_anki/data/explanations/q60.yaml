q: 60
answer: ウ
category: システム監査
theme: |
  システム監査基準（令和5年）における「フォローアップ」の意味を、改善計画の策定や監査の品質管理などと区別する問題です。誰が何をするかがポイントです。
basics: |
  システム監査は、おおまかに次の流れで進みます。
  | 監査計画 → 予備調査・本調査 → 監査報告（指摘事項・改善提案） → <b>フォローアップ</b>
  - <b>改善計画の策定・実施</b>：監査報告書の指摘事項や改善提案を受けて、<b>監査対象先（被監査部門）</b>が行う。
  - <b>フォローアップ</b>：<b>システム監査人</b>が、監査報告書に記載した改善提案の<b>実施状況に関する情報を収集</b>し、改善が進んでいるかを<b>モニタリング</b>すること。監査人自身が改善を実施するのではなく、状況を確認する立場です。
  - <b>監査の品質管理</b>：監査部門の責任者が、監査の実施状況や指摘事項の妥当性を確認すること。
reasoning: |
  1. ア：改善計画を策定するのは監査対象先で、フォローアップ（監査人の活動）そのものではありません → ×。
  2. イ：監査部門の責任者が監査の実施状況や指摘の妥当性を確認するのは、監査の品質管理です → ×。
  3. ウ：システム監査人が、改善提案の実施状況の情報を収集し、改善状況をモニタリングする → <b>フォローアップ</b> → ○。
  4. エ：時間の関係で終わらなかった監査項目を追跡調査するのは、監査の継続（追加の監査）で、改善状況のフォローアップではありません → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 監査報告書の指摘事項や改善提案を基に改善計画を策定するのは、監査対象先が行うことで、システム監査人によるフォローアップの説明ではありません。誤り。
  イ: 監査部門の責任者が、監査の実施状況や指摘事項の妥当性を確認するのは、監査の品質管理の活動です。誤り。
  ウ: システム監査人が、監査報告書に記載した改善提案の実施状況に関する情報を収集し、改善状況をモニタリングするのが、<b>フォローアップ</b>です。<b>正解</b>。
  エ: 時間の関係で終わらなかった監査項目を追跡調査して報告するのは、未了の監査手続の実施であり、改善提案の実施状況を確認するフォローアップではありません。誤り。
example: |
  学校の先生（監査人）が、生徒（監査対象先）の通知表に「計算ミスが多いので見直しを習慣にしましょう」と書いた（改善提案）後、次の学期に「見直しはできるようになったかな？」と様子を確認するのがフォローアップです。見直しの計画を立てて実行するのは生徒自身です。
review:
  - フォローアップ＝システム監査人が、改善提案の実施状況の情報を収集し、改善状況をモニタリングすること。
  - 改善計画の策定・実施は監査対象先の役割。監査の品質管理や未了項目の追跡調査とは区別する。
