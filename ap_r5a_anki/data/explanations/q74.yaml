q: 74
answer: エ
category: 企業活動
theme: |
  事業継続マネジメント（BCM）で重視される「レジリエンス」の意味を、コアコンピタンスやBCPなどと区別する問題です。
basics: |
  <b>BCM（Business Continuity Management：事業継続マネジメント）</b>：災害や事故などで事業が中断する事態に備え、事業を継続・早期に復旧させるための計画（BCP）を作り、訓練や見直しを続ける管理の仕組みです。
  <b>レジリエンス（resilience）</b>：「回復力」「しなやかさ」という意味です。BCMでは、<b>予期しない事態が起きたときに組織として対応し、支障の生じた事業を元に戻す（復元する）力</b>を指します。すべてのリスクを避けることはできないので、「起きてしまっても立ち直れる力」が重要とされます。

  関連用語
  - <b>コアコンピタンス</b>：他社に真似できない、競争力の源泉となる自社固有の強み。
  - <b>BCP（事業継続計画）</b>：大規模災害などの発生時に事業の継続を可能にするために事前に策定する計画。
reasoning: |
  1. レジリエンスは「不測の事態に対応し、事業を復元させる力」です。
  2. 「不測の事態が生じた場合の組織的対応力や、支障が生じた事業を復元させる力」という<b>エ</b>が正解です。
choices:
  ア: 他社に真似のできない自社固有の強みで、競争力の源泉となるものは、<b>コアコンピタンス</b>です。誤り。
  イ: 想定されるすべてのリスクを回避することは現実には不可能で、レジリエンスは「リスクが顕在化しても対応・回復できる力」を指します。リスクをすべて回避する方針ではありません。誤り。
  ウ: 大規模災害などの発生時に事業の継続を可能にするために事前に策定する計画は、<b>BCP（事業継続計画）</b>です。誤り。
  エ: 不測の事態が生じた場合の組織的対応力や、支障が生じた事業を復元させる力は、<b>レジリエンス</b>です。<b>正解</b>。
example: |
  竹は強風でしなっても折れずに元に戻ります。台風を完全に避けることはできなくても、しなって受け流し、また立ち上がる力がレジリエンスです。会社でいえば、地震で工場が止まっても、代わりの拠点で生産を続け、早く元の状態に戻せる力です。
review:
  - レジリエンス＝不測の事態への組織的対応力と、支障が生じた事業を復元させる力（回復力）。
  - コアコンピタンス（自社固有の強み）、BCP（事前に策定する事業継続計画）と区別する。全リスクの回避は前提ではない。
