q: 24
answer: ウ
category: ユーザーインタフェース
theme: |
  画面などの使いやすさ（ユーザビリティ）を評価する手法を、「利用者が参加する手法」と「専門家だけで行う手法」に正しく分類する問題です。
basics: |
  <b>ユーザビリティ</b>：システムや画面が、目的を達成するために使いやすいかどうかの度合いです。
  <b>利用者が参加する手法</b>（実際のユーザに使ってもらう）
  - <b>思考発話法</b>：利用者に操作してもらいながら、考えていることを声に出して話してもらい、どこで迷ったかを観察する。
  - <b>回顧法</b>：操作が終わった後に、利用者に「どこが分かりにくかったか」などを振り返って話してもらう。
  - <b>アンケート</b>：利用者に質問票で使い心地を答えてもらう。
  <b>専門家だけで行う手法</b>（利用者を使わない）
  - <b>ヒューリスティック評価</b>：専門家が、経験則（ヒューリスティクス）に基づくチェック項目に照らして問題点を洗い出す。
  - <b>認知的ウォークスルー</b>：専門家が利用者になったつもりで操作手順をたどり、つまずきそうな点を探す。
reasoning: |
  1. 各組合せの左側（利用者が参加）・右側（専門家だけ）が正しく分類されているかを確認します。
  2. ア：回顧法は利用者が参加する手法なので、右側に置くのは誤り。
  3. イ：思考発話法は利用者が参加する手法なので、右側に置くのは誤り。
  4. ウ：思考発話法（利用者参加）・ヒューリスティック評価（専門家のみ）。正しい組合せです。
  5. エ：認知的ウォークスルーは専門家だけで行う手法なので、左側に置くのは誤り。
  6. 正解は<b>ウ</b>です。
choices:
  ア: アンケートは利用者参加で正しいですが、回顧法も利用者が操作を振り返って話す、利用者参加の手法です。専門家だけの手法ではないので誤り。
  イ: 回顧法は利用者参加で正しいですが、思考発話法も利用者参加の手法です。専門家だけの手法ではないので誤り。
  ウ: 思考発話法（利用者が参加）とヒューリスティック評価（専門家だけで実施）の組合せは適切です。<b>正解</b>。
  エ: ヒューリスティック評価は専門家のみで正しいですが、認知的ウォークスルーも専門家が利用者の立場を想定して行う手法で、利用者は参加しません。誤り。
example: |
  新しい券売機を評価するとき、実際のお客さんに「今、どのボタンを押せばいいか迷っています」と声に出しながら操作してもらうのが思考発話法、操作後に感想を聞くのが回顧法です。デザインの専門家が「ボタンの表示は分かりやすいか」などのチェックリストで確認するのがヒューリスティック評価です。
review:
  - 利用者参加：思考発話法（操作中に発話）、回顧法（操作後に振り返り）、アンケート。
  - 専門家のみ：ヒューリスティック評価（経験則のチェック）、認知的ウォークスルー（利用者を想定して手順をたどる）。
