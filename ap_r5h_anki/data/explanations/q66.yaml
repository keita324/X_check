q: 66
answer: エ
category: システム企画
theme: |
  組込み機器の開発をベンダーに外注するとき、見積りを依頼する段階で発注側が用意すべき文書を、開発の流れ（共通フレーム2013）に沿って考える問題です。
basics: |
  <b>共通フレーム2013（SLCP-JCF2013）</b>：システム・ソフトウェアの開発・取引で使う作業や用語を標準化した枠組みです。発注者（取得者）とベンダー（供給者）が同じ言葉で話せるようにします。
  外注の大まかな流れ
  | 発注者がシステムへの要求を整理し、<b>要件定義書</b>にまとめる
  | → 要件定義書を示してベンダーに<b>見積りを依頼</b>する
  | → ベンダーが<b>見積書</b>を作成・提出する
  | → 契約 → 開発 → ベンダーが成果物と<b>納品書</b>を納める → 発注者が<b>評価仕様書</b>などに基づいて受入れ検査を行う
  ベンダーは「何を作るのか」が分からないと、作業量やコストを見積もれません。
reasoning: |
  1. 見積りを依頼する時点で、ベンダーに「何を作ってほしいか」を伝える必要があります。そのための文書が<b>要件定義書</b>です。
  2. 納品書・見積書はベンダーが作る文書で、評価仕様書は受入れ検査など後の段階で使う文書です。
  3. 正解は<b>エ</b>です。
choices:
  ア: 納品書は、開発が終わって成果物を納めるときに<b>ベンダー</b>が作る書類です。見積り依頼の段階では存在しません。誤り。
  イ: 評価仕様書は、完成した機器やソフトウェアを評価・検査（受入れテストなど）するための仕様をまとめた文書で、開発の後の段階で使います。見積り依頼に必要な文書ではありません。誤り。
  ウ: 見積書は、見積り依頼を受けた<b>ベンダー</b>が作成して提出する書類です。発注側が見積り依頼に添えるものではありません。誤り。
  エ: 要件定義書は、システムに求める機能や性能などを定めた文書で、ベンダーが見積りを行うために必要です。<b>正解</b>。
example: |
  家を建てるとき、工務店に「いくらかかりますか？」と聞くには、まず「3LDKで、床暖房付き、予算はこのくらい」という要望をまとめた資料（要件定義書）が必要です。それを見て工務店が見積書を出し、完成したら引渡し書類（納品書）が届きます。
review:
  - 見積り依頼には、何を作るかを示す要件定義書が必要（発注側が作成）。
  - 見積書・納品書はベンダーが作成、評価仕様書は受入れ・評価の段階で使う、と作成者とタイミングで区別する。
