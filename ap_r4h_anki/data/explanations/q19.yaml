q: 19
answer: イ
category: ソフトウェア
theme: |
  サーバが同時に処理できるタスクの数（多重度）が1の場合と2の場合で、すべての処理が終わるまでの時間がどれだけ違うかを、時間の流れを追って求める問題です。
basics: |
  <b>多重度</b>：同時に並行して処理できるタスクの数です。多重度1なら1件ずつ順番に、多重度2なら2件まで同時に処理できます。
  問題文の条件では、多重度が2以下なら、1件の処理時間は<b>常に4秒</b>です（同時に処理しても遅くならない）。
  処理要求は1秒間隔で4件届くので、時刻0、1、2、3秒に1件ずつ到着します。
reasoning: |
  <b>(1) 多重度1のとき</b>（1件ずつ順番に処理）
  | 1件目：0〜4秒
  | 2件目：4〜8秒（1秒に到着し、4秒まで待つ）
  | 3件目：8〜12秒
  | 4件目：12〜<b>16秒</b>
  <b>(2) 多重度2のとき</b>（2件まで同時に処理）
  | 1件目：0〜4秒
  | 2件目：1〜5秒（到着してすぐ開始できる）
  | 3件目：2秒に到着、空きがないので4秒まで待つ → 4〜8秒
  | 4件目：3秒に到着、5秒まで待つ → 5〜<b>9秒</b>
  <b>(3) 差</b>
  | 16 − 9 ＝ <b>7秒</b>
  正解は<b>イ</b>です。
choices:
  ア: 6秒。計算結果の7秒と一致しません。誤り。
  イ: 7秒。多重度1では16秒、多重度2では9秒で、その差です。<b>正解</b>。
  ウ: 8秒は、多重度2のとき全体がちょうど半分（16÷2＝8秒）で終わると考えた場合の差です。実際は要求が1秒ずつずれて到着するので、多重度2でも9秒かかります。誤り。
  エ: 9秒は、多重度2のときの終了時刻そのものです。差ではありません。誤り。
example: |
  1人で営業しているラーメン屋（多重度1）に1分おきに4人のお客さんが来て、1杯4分かかるなら、最後の人が食べ始めるのは16分後です。2人で作れば（多重度2）、9分後には4杯目ができあがります。
review:
  - 到着時刻と処理の空き時刻を時系列で並べ、各要求の開始・終了時刻を求める（待ち時間を忘れない）。
  - 多重度を2倍にしても、到着のずれがあるので終了時間はちょうど半分にはならない。
