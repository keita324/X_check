q: 9
answer: ウ
category: コンピュータ構成要素
theme: |
  量子コンピュータに関する用語「量子超越性（Quantum Supremacy）」の意味を問う問題です。
basics: |
  <b>量子コンピュータ</b>：量子力学の性質（<b>重ね合わせ</b>：0と1を同時に表せる、<b>量子もつれ</b>など）を利用して計算するコンピュータです。特定の種類の問題では、従来のコンピュータより圧倒的に速く計算できる可能性があります。
  <b>量子超越性</b>：<b>従来のコンピュータ（スーパーコンピュータを含む）では実用的な時間で解けない計算を、量子コンピュータが高速に実行できること</b>、またはそれを実証した状態のことです。2019年にGoogleが「スーパーコンピュータで1万年かかる計算を約200秒で行った」と発表したことで注目されました（その評価には議論もあります）。
  <b>量子暗号</b>：量子の性質を使って、盗聴されると必ず痕跡が残るようにした暗号通信の技術です。量子超越性とは別の概念です。
reasoning: |
  1. 量子超越性は「従来のコンピュータでは実用的な時間で処理できない計算を、量子コンピュータが高速に実行できること」です。
  2. 正解は<b>ウ</b>です。
choices:
  ア: 重ね合わせを用いた量子暗号が現在の暗号より安全であることは、量子暗号（量子鍵配送）の話で、量子超越性の説明ではありません。誤り。
  イ: 量子コンピュータが量子力学に依拠して作られていることは、量子コンピュータの原理の説明であり、「従来のコンピュータを計算能力で上回る」という量子超越性の意味ではありません。誤り。
  ウ: 従来のコンピュータでは実用的な時間で処理できない計算を、量子コンピュータで高速に実行できることが量子超越性です。<b>正解</b>。
  エ: 量子超越性は計算能力について述べた言葉で、物理的な大きさを小さくできることではありません。実際、現在の量子コンピュータは冷却装置などを含めると大型です。誤り。
example: |
  何万通りもある迷路の道を、従来のコンピュータは1本ずつ順番に試すのに対し、量子コンピュータは重ね合わせを使って多くの道を同時に試すようなイメージです。従来の方法では何千年もかかる計算を、現実的な時間で解けることを示したとき、「量子超越性を達成した」といいます。
review:
  - 量子超越性＝従来のコンピュータでは実用的な時間で解けない計算を、量子コンピュータが高速に実行できること。
  - 量子暗号（盗聴検知が可能な暗号通信）や、量子コンピュータの原理・大きさの話とは区別する。
