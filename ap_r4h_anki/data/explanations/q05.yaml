q: 5
answer: ア
category: アルゴリズムとプログラミング
theme: |
  データ構造「リスト」を、配列で作った場合とポインタで作った場合の違いを理解し、配列版の特徴を選ぶ問題です。
basics: |
  <b>リスト</b>：データ（要素）を順番に並べて管理するデータ構造です。
  <b>配列で実現したリスト</b>：メモリ上の連続した場所に要素を並べて格納します。番号（添字）で何番目の要素にも直接アクセスできますが、<b>あらかじめ最大個数分の領域を確保</b>しておく必要があります。途中に挿入するには、後ろの要素を1つずつずらす必要があります。
  <b>ポインタで実現したリスト（連結リスト）</b>：各要素が「データ」と「次の要素の場所（ポインタ）」を持ち、鎖のようにつながっています。必要な分だけ領域を使え、挿入はポインタの付け替えだけで済みますが、中間の要素に行くには先頭から順にたどる必要があります。
reasoning: |
  各選択肢が配列版・ポインタ版のどちらの特徴かを判断します。
  1. ア「最大個数に対応した領域を確保し、使われない領域が発生する可能性がある」→ 配列は事前に大きさを決めて確保するので<b>配列版</b>の特徴。
  2. イ「中間要素の参照に先頭からたどる必要がある」→ <b>ポインタ版</b>。配列なら添字で直接アクセスできる。
  3. ウ「次の要素を指し示す領域が別途必要」→ ポインタを格納する領域なので<b>ポインタ版</b>。
  4. エ「挿入位置が分かれば一定時間で挿入できる」→ ポインタの付け替えだけで済む<b>ポインタ版</b>。配列は後ろの要素をずらすので要素数に比例した時間がかかる。
  5. 正解は<b>ア</b>です。
choices:
  ア: 配列は最大個数分の領域を先に確保するため、実際の要素数が少ないと使われない領域が生じます。配列版の特徴です。<b>正解</b>。
  イ: 先頭から順にたどる必要があるのはポインタ版です。配列版は添字を使って中間要素に直接（一定時間で）アクセスできます。誤り。
  ウ: 次の要素を指すポインタ用の領域が必要なのはポインタ版です。配列版は要素が連続して並ぶので不要です。誤り。
  エ: 挿入位置が分かれば一定時間で挿入できるのはポインタ版です。配列版では、挿入位置より後ろの要素をすべて1つずつずらす必要があります。誤り。
example: |
  配列版は「座席番号付きの映画館」：何番の席にもすぐ行けますが、座席数は最初に決まっていて、空席が出ることもあります。途中に1人割り込むには、後ろの人全員に1つずつずれてもらう必要があります。
  ポインタ版は「手をつないだ行列」：途中に入るには両隣の手をつなぎ直すだけですが、10番目の人に会うには先頭から順にたどる必要があります。
review:
  - 配列版リスト：最大個数分を事前確保（無駄な領域が出得る）、添字で直接アクセス、挿入・削除は要素の移動が必要。
  - ポインタ版リスト：ポインタ領域が必要、先頭から順にたどる、挿入・削除はポインタ付け替えで一定時間。
