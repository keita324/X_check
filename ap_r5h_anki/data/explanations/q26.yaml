q: 26
answer: ウ
category: データベース
theme: |
  項目の数や内容が商品ごとにバラバラで、事前に予測できないJSON形式のデータを蓄積するのに適したデータベースの種類を選ぶ問題です。
basics: |
  <b>JSON</b>：{ "項目名":値, … } の形でデータを表す形式です。図1と図2のように、データごとに項目の種類や数が違っていても表現できます。
  主なデータベースの種類
  - <b>関係データベース（RDB）</b>：あらかじめ列（項目）を決めた<b>表</b>にデータを格納する。全行が同じ列構成になるので、項目が予測できないデータには向かない。
  - <b>ドキュメントデータベース</b>：JSONなどの<b>文書（ドキュメント）単位</b>でデータを格納する。ドキュメントごとに項目構成が違ってもよく、どの項目でも検索できる（NoSQLの一種。例：MongoDB）。
  - <b>グラフデータベース</b>：データを<b>ノード（点）</b>と<b>エッジ（関係）</b>で表し、つながりの検索が得意（SNSの友人関係など）。
  - <b>階層型データベース</b>：データを親子関係の木構造で格納する。
reasoning: |
  1. 条件は「Webサービスが随時変更され、項目数や内容は予測できない」「検索キーにあらかじめ制限を設けない」です。
  2. 項目構成が商品ごとに違うデータを、決まった表の形に当てはめずにそのまま格納でき、どの項目でも検索できるのは<b>ドキュメントデータベース</b>です。
  3. 「項目構成の違いを区別せず、商品データ単位にデータを格納する」という<b>ウ</b>が正解です。
choices:
  ア: 階層型データベースで「項目名を上位、値を下位」の2階層にすると、1つの商品のデータが項目ごとにばらばらになり、商品単位でまとめて扱えません。また "関連商品id" のような配列（入れ子）も表しにくく、適切ではありません。誤り。
  イ: 項目名の集合のノードと値の集合のノードを関係付けても、どの値がどの商品のものかという商品単位のまとまりが失われます。グラフデータベースは関係（つながり）の検索に向く方式で、この用途には適しません。誤り。
  ウ: ドキュメントデータベースなら、項目構成の違いを気にせず、商品データ（JSONの1件）単位にそのまま格納でき、どの項目でも検索できます。<b>正解</b>。
  エ: 関係データベースで項目名を列名にした表を定義すると、項目が予測できないので、新しい項目が出るたびに表の定義を変更する必要があり、列も空欄だらけになります。誤り。
example: |
  関係データベースは「決まった欄がある申込用紙の束」、ドキュメントデータベースは「自由に書いたメモを1枚ずつクリアファイルに入れた束」です。商品ごとに書くことが違うなら、決まった用紙よりメモの方が素直に保存でき、後から「生産地が青森のもの」のように探すこともできます。
review:
  - 項目構成が不定・変化するJSONデータの蓄積には、ドキュメントデータベース（NoSQL）が適する。
  - 関係DB（固定の列）、グラフDB（ノードと関係）、階層型DB（木構造）の特徴と向き不向きを区別する。
