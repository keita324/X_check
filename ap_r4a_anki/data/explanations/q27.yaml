q: 27
answer: イ
theme: |
  関係データベースの集合演算のうち「差集合（差）」の結果を、2つの表から求める問題です。
basics: |
  <b>表（テーブル）</b>は、行（1件のデータ）の集まりとみなせます。そのため、集合の考え方で表どうしを演算できます。
  - <b>和集合</b>：どちらかの表にある行をすべて集める（重複は1つにする）。
  - <b>積集合（共通集合）</b>：両方の表にある行だけを残す。
  - <b>差集合</b>：「A − B」なら、<b>Aにあって、Bにない行</b>だけを残す。

  「従業員表に対して異動表による差集合」＝ 従業員 − 異動 です。順序を逆にすると結果が変わる点に注意します。
reasoning: |
  1. 従業員表の5行を、1行ずつ「異動表にもあるか」で確認します（3列すべてが一致する行が同じ行です）。
  | A001 情報太郎 人事部 → 異動表にない → 残す
  | A005 情報花子 経理部 → 異動表にある → 除く
  | B010 情報次郎 総務部 → 異動表にある → 除く
  | C003 試験桃子 人事部 → 異動表にない → 残す
  | C011 試験一郎 経理部 → 異動表にない → 残す
  2. 異動表にしかない D080 技術桜子 は、差集合では結果に入りません（「従業員にあるもの」から引くだけなので）。
  3. 結果は A001、C003、C011 の3行で、選択肢<b>イ</b>と一致します。
choices:
  ア: 従業員表と異動表の行をすべて集めた<b>和集合</b>の結果です。誤り。
  イ: 従業員表にあって異動表にない行（A001、C003、C011）。<b>差集合（従業員−異動）</b>の結果です。<b>正解</b>。
  ウ: 両方の表に共通する行（A005、B010）だけを残した<b>積集合（共通集合）</b>の結果です。誤り。
  エ: 異動表にあって従業員表にない行（D080）。逆向きの差集合（異動−従業員）の結果です。誤り。
example: |
  クラスの名簿（従業員表）から、転校した人のリスト（異動表）に載っている人を消すと、残るのが差集合です。転校リストにしか載っていない人（D080）は、もともと名簿にいないので結果には出てきません。
review:
  - 差集合 A−B は「Aにあり、Bにない行」。順番を逆にすると結果が変わる（エがひっかけ）。
  - 和集合（ア）・積集合（ウ）・差集合（イ）の結果をそれぞれ言えるようにする。
