q: 75
answer: イ
category: 企業活動
theme: |
  リーダーシップ理論のうち、三隅二不二（みすみじゅうじ）が提唱した「PM理論」の特徴を、特性理論・SL理論・フィードラーの理論と区別する問題です。
basics: |
  <b>PM理論</b>：リーダーシップを次の2つの能力（機能）の組合せで捉える理論です。
  - <b>P（Performance）：目標達成能力</b>：計画を立て、指示を出し、成果を上げさせる働き。
  - <b>M（Maintenance）：集団維持能力</b>：メンバーの人間関係に配慮し、チームのまとまりを保つ働き。
  P・Mそれぞれの大小で4つのタイプ（PM型、Pm型、pM型、pm型）に分け、両方が高い<b>PM型</b>が最も望ましいとされます。

  他のリーダーシップ理論
  - <b>特性理論</b>：優れたリーダーは、性格・知性などの個人的な資質を持っているとする考え方。
  - <b>SL理論</b>（ハーシィとブランチャード）：部下の成熟度（自律性）に応じて、有効なリーダーシップのスタイルが変わるとする理論。
  - <b>フィードラーのコンティンジェンシー理論</b>：リーダーの性格（パーソナリティ）と、リーダーが状況をどれだけ統制できるかの組合せで、有効性が決まるとする理論。
reasoning: |
  1. PM理論のキーワードは「目標達成能力（P）」と「集団維持能力（M）」の<b>2つの次元</b>です。
  2. 「リーダーシップのスタイルについて、目標達成能力と集団維持能力の二つの次元に焦点を当てている」という<b>イ</b>が正解です。
choices:
  ア: リーダー個人の性格、知性、外観などの個人的資質の分析に焦点を当てるのは、<b>特性理論（資質論）</b>です。誤り。
  イ: リーダーシップのスタイルを、目標達成能力（P）と集団維持能力（M）の2つの次元で捉えるのは<b>PM理論</b>です。<b>正解</b>。
  ウ: リーダーシップの有効性が、部下の成熟（自律性）の度合いという状況要因に依存するとするのは<b>SL理論</b>です。誤り。
  エ: リーダーシップの有効性が、リーダーのパーソナリティと、リーダーが統制力や影響力をどれだけ行使できるかという状況要因に依存するとするのは、<b>フィードラーのコンティンジェンシー理論</b>です。誤り。
example: |
  部活動のキャプテンで考えると、練習メニューを決めて試合に勝たせる力が「P」、部員の悩みを聞いて部の雰囲気を良くする力が「M」です。勝つことばかりでも、仲が良いだけでもなく、両方を兼ね備えた「PM型」のキャプテンが理想とされます。
review:
  - PM理論＝目標達成能力（P）と集団維持能力（M）の2次元でリーダーシップを捉え、PM型が最も望ましい。
  - 特性理論（個人の資質）、SL理論（部下の成熟度）、フィードラー理論（パーソナリティと状況の統制力）と区別する。
