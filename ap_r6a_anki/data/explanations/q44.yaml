q: 44
answer: イ
category: セキュリティ
theme: |
  DNSの応答の正しさを確かめる仕組み「DNSSEC」の仕様を、送信元ポートのランダム化・SPF・DKIMと区別する問題です。
basics: |
  <b>権威DNSサーバ</b>：そのドメインの正式な情報（リソースレコード）を管理するDNSサーバです。
  <b>DNSキャッシュサーバ</b>：利用者の代わりに権威DNSサーバへ問い合わせ、結果を一時的に記憶するサーバです。
  <b>DNSSEC（DNS Security Extensions）</b>：
  - 権威DNSサーバが<b>公開鍵を公開</b>し、<b>秘密鍵</b>を使って、リソースレコードに<b>デジタル署名</b>を付ける。
  - DNSキャッシュサーバは、受け取ったリソースレコードの署名を公開鍵で<b>検証</b>し、改ざんされていない正当な応答かを確認する。
  これにより、DNSキャッシュポイズニングなどの偽の応答を見破れます。

  紛らわしい仕組み
  - <b>送信元ポートランダム化</b>：キャッシュサーバの問合せごとに送信元ポート番号を変え、偽の応答を推測しにくくする。
  - <b>SPF</b>：メールサーバのIPアドレスをDNSに登録し、受信側で送信元サーバのIPアドレスを照合する。
  - <b>DKIM</b>：メールサーバの公開鍵をDNSで公開し、メールに付けたデジタル署名を受信側で検証する。
reasoning: |
  1. DNSSECは「権威DNSサーバがリソースレコードにデジタル署名を付け、キャッシュサーバがその署名を検証する」仕組みです。
  2. これを述べているのは<b>イ</b>です。
  3. エも「公開鍵を公開し、秘密鍵で署名、受信側で検証」と似ていますが、署名の対象が<b>電子メール</b>なのでDKIMです。
choices:
  ア: 問合せのたびに送信元ポート番号をランダムに変えるのは、<b>送信元ポートランダム化</b>によるキャッシュポイズニング対策で、DNSSECではありません。誤り。
  イ: 権威DNSサーバが公開鍵を公開し、秘密鍵でリソースレコードにデジタル署名を付与し、キャッシュサーバが署名を検証するのは、<b>DNSSEC</b>の仕様です。<b>正解</b>。
  ウ: メールサーバのIPアドレスを権威DNSサーバに登録し、受信側で送信元メールサーバのIPアドレスを検証するのは、<b>SPF</b>の仕様です。誤り。
  エ: メールサーバの公開鍵を権威DNSサーバで公開し、秘密鍵でメールに署名、受信側で検証するのは、<b>DKIM</b>の仕様です。誤り。
example: |
  市役所（権威DNSサーバ）が発行する住民票（リソースレコード）に、正式な公印（デジタル署名）が押してあれば、受け取った人（キャッシュサーバ）は公印を照合して、偽造された住民票でないことを確かめられます。
review:
  - DNSSEC＝権威DNSサーバが秘密鍵でリソースレコードに署名し、キャッシュサーバが公開鍵で検証する。
  - 送信元ポートランダム化（推測困難化）、SPF（メール送信元IPの照合）、DKIM（メールへの署名）と、署名の対象と目的で区別する。
