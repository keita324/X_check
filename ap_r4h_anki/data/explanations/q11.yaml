q: 11
answer: イ
category: システム構成要素
theme: |
  複数のディスクを組み合わせて信頼性を高めるRAID5で、予備ディスク（ホットスペア）を含めた構成のときに、実際にデータを保存できる容量を計算する問題です。
basics: |
  <b>RAID</b>：複数のディスクを1台の大きなディスクのように使い、速度や信頼性を高める技術です。
  <b>RAID5</b>：データと<b>パリティ</b>（誤り訂正用の情報）を複数のディスクに分散して記録します。ディスクが1台故障しても、残りのディスクとパリティから元のデータを復元できます。パリティの分として、<b>ディスク1台分の容量</b>が使われます。
  | RAID5の実効容量 ＝ (RAIDを構成するディスク台数 − 1) × 1台の容量
  <b>ホットスペア（予備ディスク）</b>：普段は使わずに待機し、どれかのディスクが故障したら自動的に代わりに組み込まれるディスクです。普段はデータを保存しないので、容量には含めません。
reasoning: |
  1. 6台のうち1台はホットスペア（待機用）なので、RAID5を構成するのは 6 − 1 ＝ <b>5台</b>です。
  2. RAID5では、そのうち1台分がパリティに使われます。データに使えるのは 5 − 1 ＝ <b>4台分</b>です。
  3. 実効データ容量を計算します。
  | 4台 × 8Tバイト ＝ <b>32Tバイト</b>
  4. 正解は<b>イ</b>です。
choices:
  ア: 24Tバイト（3台分）は、ホットスペアとパリティのほかに、さらに1台分を余計に引いた値です。RAID5のパリティは1台分だけなので誤り。
  イ: 32Tバイト。(6−1−1)×8 ＝ 32 で、計算結果と一致します。<b>正解</b>。
  ウ: 40Tバイト（5台分）は、ホットスペアかパリティのどちらか一方しか引いていない値です。誤り。
  エ: 48Tバイト（6台分）は、全ディスクの単純合計です。ホットスペアもパリティも考慮していないので誤り。
example: |
  6人のチームで、1人は控え選手（ホットスペア）としてベンチで待機し、試合に出る5人のうち1人分の労力は「誰かが倒れたときのためのメモ係（パリティ）」に使う、というイメージです。実際に得点（データ保存）に使える力は4人分になります。
review:
  - RAID5の実効容量＝（構成台数−1）×1台の容量。パリティ分として1台分が減る。
  - ホットスペアは待機用なので、まず台数から除いてから計算する（6台→5台→4台分）。
