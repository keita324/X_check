q: 25
answer: ウ
category: 情報メディア
theme: |
  3次元CG（コンピュータグラフィックス）の技法（テクスチャマッピング、メタボール、ラジオシティ法、レイトレーシング）の説明を、正しく組み合わせられるかを問う問題です。選択肢では用語と説明が入れ替えられています。
basics: |
  - <b>レイトレーシング</b>：視点から画素ごとに視線（光線）を飛ばし、物体との交点や反射・透過（屈折）を追跡して、色や明るさを計算する。映り込みや透明感を表現できる。
  - <b>ラジオシティ法</b>：光が面と面の間で何度も跳ね返る（<b>拡散反射面どうしの相互反射</b>）効果を計算して、各面の明るさ（輝度）を決める。間接光による柔らかい明るさを表現できる。
  - <b>テクスチャマッピング</b>：物体の表面に、別に用意した模様や画像（テクスチャ）を張り付けて、質感を表現する。
  - <b>メタボール</b>：複数の球（ボール）が影響し合う「場」を考え、それらが溶け合ったような滑らかな曲面の<b>形状を表現する</b>手法。水滴や生物の形などに使う。
reasoning: |
  1. ア：全ピクセルで視線と物体の交点を計算し、視点に最も近い交点を選ぶ → <b>レイトレーシング</b>の説明で、テクスチャマッピングではない → ×。
  2. イ：メタボールは形状をモデル化する手法で、輝度（明るさ）を計算する手法ではない → ×。
  3. ウ：拡散反射面間の相互反射の効果を考慮して輝度を決める → <b>ラジオシティ法</b>の説明として正しい → ○。
  4. エ：形状が定義された物体の表面に模様を張り付ける → <b>テクスチャマッピング</b>の説明で、レイトレーシングではない → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 視線と全物体の交点を計算し、最も近い交点を選んで隠面消去を行うのは<b>レイトレーシング</b>（の考え方）です。テクスチャマッピングは模様を張り付ける手法です。誤り。
  イ: メタボールは、球の影響が溶け合った滑らかな形状を表現するモデリング手法です。空間中のデータから輝度を計算する手法ではありません。誤り。
  ウ: ラジオシティ法は、拡散反射面の間の相互反射の効果を考慮して、拡散反射面の輝度を決めます。<b>正解</b>。
  エ: 物体の表面に別に定義した模様を張り付けるのは<b>テクスチャマッピング</b>です。レイトレーシングは視線（光線）を追跡して描画する手法です。誤り。
example: |
  白い壁に囲まれた部屋では、窓から入った光が壁から壁へ何度も跳ね返り、直接光の当たらない部屋の隅もほんのり明るくなります。この「間接光による明るさ」を計算するのがラジオシティ法です。CGの部屋が自然な明るさに見えるのは、この計算のおかげです。
review:
  - ラジオシティ法＝拡散反射面どうしの相互反射を計算して輝度を決める（間接光の表現）。
  - レイトレーシング（視線を追跡）、テクスチャマッピング（模様を張り付け）、メタボール（滑らかな形状の表現）と区別する。
