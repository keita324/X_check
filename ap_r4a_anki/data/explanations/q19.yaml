q: 19
answer: ウ
theme: |
  3台のプリンターに印刷データを順番に割り当てていくとき、プリンターCが印刷に使う合計時間を、時間の流れを追って求める問題（シミュレーション問題）です。
basics: |
  <b>割り当てのルール</b>（問題文より）
  - 印刷データは 4, 6, 3, 2, 5, 3, 4, 3, 1（分）の順に処理する。
  - 空いているプリンターが複数あれば A → B → C の優先順で割り当てる。
  - 1台も空いていなければ、どれかが空くまで待つ。
  - 最初は3台とも空いている。

  このような問題は、頭の中で考えずに「時刻」と「各プリンターがいつ空くか」を表に書いて追いかけるのが確実です。
reasoning: |
  各プリンターが空く時刻を記録しながら、データを1つずつ割り当てます。
  | 時刻0：データ①4分→A（Aは4に空く）
  | 時刻0：データ②6分→B（Bは6に空く）
  | 時刻0：データ③3分→C（Cは3に空く）
  | 時刻3：Cが最初に空く → データ④2分→C（Cは5に空く）
  | 時刻4：Aが空く → データ⑤5分→A（Aは9に空く）
  | 時刻5：Cが空く → データ⑥3分→C（Cは8に空く）
  | 時刻6：Bが空く → データ⑦4分→B（Bは10に空く）
  | 時刻8：Cが空く → データ⑧3分→C（Cは11に空く）
  | 時刻9：Aが空く → データ⑨1分→A（Aは10に空く）

  プリンターCが印刷したのは ③3分、④2分、⑥3分、⑧3分 です。
  | 3 ＋ 2 ＋ 3 ＋ 3 ＝ <b>11分</b>
  正解は<b>ウ</b>です。
choices:
  共通: |
    数値を選ぶ問題なので、上のシミュレーション結果（Cの合計＝11分）と比べます。ア 7分・イ 9分・エ 12分は、空く時刻の順番を取り違えたり、1件割り当てを漏らしたり重複させたりすると出てくる値です。毎回「一番早く空くプリンター」を選び直すことが大切です。
  ア: 7分。Cの印刷合計11分と一致しません。誤り。
  イ: 9分。Cの印刷合計11分と一致しません。誤り。
  ウ: 11分。シミュレーション結果と一致します。<b>正解</b>。
  エ: 12分。Cの印刷合計11分と一致しません。誤り。
example: |
  スーパーのレジが3台あり、お客さんが並んだ順に「空いたレジ」へ案内されるのと同じです。各レジの会計時間を記録していけば、レジCが何分働いたかが分かります。
review:
  - 「各資源がいつ空くか」を時刻順の表にして、1件ずつ割り当てるシミュレーションの手順を身につける。
  - 同時に空いた場合の優先順（A→B→C）と、「一番早く空いたもの」に割り当てるルールを守る。
