q: 48
answer: イ
category: ソフトウェア開発管理技術
theme: |
  アジャイル開発のスクラムで、1回のスプリント（短い開発期間）の中で行うイベント（会議）の正しい順番を問う問題です。
basics: |
  <b>スクラム</b>：1〜4週間程度の<b>スプリント</b>を繰り返して開発を進めるアジャイル開発の枠組みです。1つのスプリントの中で、次のイベントを行います。
  - <b>スプリントプランニング</b>：スプリントの<b>最初</b>に、このスプリントで何を作るか・どう進めるかを計画する。
  - <b>デイリースクラム</b>：スプリント期間中、<b>毎日</b>短時間（15分程度）で進捗や問題を共有する。
  - <b>スプリントレビュー</b>：スプリントの終わりに、できあがった成果物を関係者に見せて、フィードバックを受ける（「何を作ったか」の確認）。
  - <b>スプリントレトロスペクティブ</b>：スプリントの<b>最後</b>に、チームの仕事の進め方を振り返り、改善策を決める（「どう作ったか」の振り返り）。
reasoning: |
  1. 最初に計画する → スプリントプランニング（1）
  2. 期間中は毎日 → デイリースクラム（4）
  3. 終わりに成果物を確認 → スプリントレビュー（3）
  4. 最後に進め方を振り返る → スプリントレトロスペクティブ（2）
  順序は 1 → 4 → 3 → 2 で、<b>イ</b>です。
choices:
  ア: 1→4→2→3 は、レトロスペクティブ（振り返り）をレビュー（成果物の確認）より先に行っています。成果物を確認した後に、進め方を振り返るのが正しい順序です。誤り。
  イ: プランニング→デイリースクラム→レビュー→レトロスペクティブ。スクラムイベントの正しい順序です。<b>正解</b>。
  ウ: デイリースクラムをプランニングより前に行っています。計画を立てる前に毎日の進捗確認はできません。また、レトロスペクティブとレビューの順序も逆です。誤り。
  エ: デイリースクラムをプランニングより前に行っている点が誤りです。誤り。
example: |
  文化祭の準備を2週間単位で進めると考えると、最初の日に「この2週間で看板と衣装を作る」と計画し（プランニング）、毎朝5分集まって進み具合を確認し（デイリースクラム）、2週間の終わりに先生や他のクラスに作った物を見てもらい（レビュー）、最後にチームで「次はもっと早く材料を買おう」と振り返る（レトロスペクティブ）、という流れです。
review:
  - スプリント内のイベント順：スプリントプランニング→デイリースクラム（毎日）→スプリントレビュー→スプリントレトロスペクティブ。
  - レビュー＝成果物（何を作ったか）の確認、レトロスペクティブ＝進め方（どう作ったか）の振り返り。
