q: 14
answer: エ
category: システム構成要素
theme: |
  サーバやネットワークなどのインフラを、プログラムのコードとして管理する考え方「IaC（Infrastructure as Code）」の説明を選ぶ問題です。
basics: |
  <b>インフラストラクチャ（インフラ）</b>：アプリケーションを動かす土台。サーバ、ネットワーク、OS、ミドルウェアなどです。
  <b>IaC（Infrastructure as Code）</b>：インフラの<b>構成や状態</b>（どのサーバに何をインストールし、どう設定するか）を、手作業の手順書ではなく<b>コード（設定ファイル）として定義</b>し、ツールで<b>自動的に構築・変更</b>できるようにする考え方です。
  - 同じ環境を何度でも正確に再現できる。
  - コードとしてバージョン管理でき、変更履歴やレビューが可能になる。
  - 例：Terraform、Ansible、AWS CloudFormation。

  関連用語
  - <b>CI（継続的インテグレーション）</b>：コードの変更のたびに、アプリのビルドやテストを自動で行うこと。
reasoning: |
  1. IaCの要点は「システム（インフラ）の構成や状態をコードに定義」「ソフトウェアによる自動実行を可能にする」ことです。
  2. 「ソフトウェアによる自動実行を可能にするために、システムの構成や状態をコードに定義すること」という<b>エ</b>が正解です。
choices:
  ア: インシデントへの対応手順をコードに定義することは、運用の自動化（ランブックの自動化など）の話で、インフラの構成や状態を定義するIaCの説明としては最も適切とはいえません。誤り。
  イ: 開発支援ツールの連携手順をコードに定義することは、ツールチェーンの自動化の話で、IaCの説明ではありません。誤り。
  ウ: アプリケーションの生成（ビルド）手順や試験の手順をコードに定義して継続的インテグレーションを実現するのは、<b>CI</b>のパイプラインの説明です。誤り。
  エ: システムの構成や状態をコードに定義し、ソフトウェアによる自動実行を可能にすることは、<b>IaC</b>の説明です。<b>正解</b>。
example: |
  家具の組立てに例えると、毎回職人が記憶を頼りに組み立てる（手作業でサーバ設定）のではなく、正確な設計図（コード）を書いておき、ロボット（ツール）がその通りに組み立てるようにするのがIaCです。設計図があれば、同じ家具を何台でも同じように作れ、変更点も設計図の差分で確認できます。
review:
  - IaC＝インフラ（サーバ・ネットワーク等）の構成や状態をコードで定義し、ツールで自動構築・変更する。
  - アプリのビルド・テストの自動化はCI。インシデント対応手順やツール連携の自動化とは区別する。
