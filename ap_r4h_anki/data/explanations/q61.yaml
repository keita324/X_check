q: 61
answer: ア
category: システム戦略
theme: |
  経済産業省のシステム管理基準（平成30年）に基づき、ITシステムの運用・利用における「ログ」の正しい管理方法を選ぶ問題です。
basics: |
  <b>ログ</b>：システムで「いつ、誰が、何をしたか」を自動的に記録したものです（アクセスログ、操作ログ、エラーログなど）。
  ログの主な役割
  - 不正アクセスや規則違反を<b>発見</b>する。
  - 障害や事故が起きたときに、原因を<b>調査</b>する証拠になる。
  - 「記録されている」ことで、不正を<b>抑止</b>する。

  ログ管理のポイント
  - ログが改ざん・削除されると証拠として使えないので、<b>不正なアクセスから保護</b>し、改ざんされないように保管する。
  - 通常の範囲を超えたアクセスや違反行為、<b>特権的アクセス</b>（管理者権限での操作）のログは特に重要なので、必ず記録・分析する。
  - 事故が起きたときだけでなく、<b>定期的に分析</b>して、異常の兆候を早く見つける。
reasoning: |
  1. ア：ログを不正アクセスから保護し、改ざんされないように保管する → 証拠としての価値を守るために必要なので<b>適切</b>。
  2. イ：違反行為に関するログを除外する → 最も重要なログを捨てることになるので不適切。
  3. ウ：特権的アクセスのログを分析対象から除外する → 管理者権限は悪用されたときの影響が大きく、特に重要なので不適切。
  4. エ：インシデント発生時にだけ分析する → 定期的に分析しないと、不正の兆候を見逃すので不適切。
  5. 正解は<b>ア</b>です。
choices:
  ア: 取得したログを不正なアクセスから保護し、改ざんされないように保管するのは、システム管理基準に沿った適切な管理です。<b>正解</b>。
  イ: 通常の運用範囲を超えたアクセスや違反行為のログは、不正の発見や原因調査に最も重要なログです。除外してはいけません。誤り。
  ウ: 特権的アクセス（管理者権限での操作）は、悪用されると被害が大きいため、そのログは特に重要です。分析対象から除外するのは不適切です。誤り。
  エ: ログはインシデントが起きたときだけでなく、定期的に分析して、不正や異常の兆候を早期に発見すべきです。誤り。
example: |
  お店の防犯カメラに例えると、録画データ（ログ）は誰にも消されたり編集されたりしないよう、鍵のかかった場所に保存します。また、レジの金庫を開けた記録（特権的アクセス）は特に重要で、事件が起きてからだけでなく、普段から定期的に見直すことで不正を早く見つけられます。
review:
  - ログは不正アクセスから保護し、改ざんされないように保管する。
  - 違反行為や特権的アクセスのログは特に重要。インシデント時だけでなく定期的に分析する。
