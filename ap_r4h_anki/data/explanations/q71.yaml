q: 71
answer: ウ
category: ビジネスインダストリ
theme: |
  企業の財務情報をやり取りするためのデータ記述言語「XBRL」が、主に何の情報を扱うかを問う用語問題です。
basics: |
  <b>XML</b>：タグでデータを囲み、データの意味や構造を表す汎用の記述言語です。
  <b>XBRL（eXtensible Business Reporting Language）</b>：XMLをもとに作られた、<b>企業の財務情報</b>（貸借対照表や損益計算書などの財務諸表）を記述するための国際的な標準言語です。
  - 「売上高」「営業利益」などの項目に、共通の名前（タグ）を付けて記述するので、コンピュータで自動的に集計・比較・分析できます。
  - 日本では、金融庁の電子開示システム<b>EDINET</b>（有価証券報告書の提出）や、東京証券取引所の決算短信の開示などで使われています。
reasoning: |
  1. XBRLの「Business Reporting（事業報告）」が示すとおり、企業が外部に報告する財務情報を扱う言語です。
  2. 正解は<b>ウ</b>です。
choices:
  ア: 医療機関のカルテ情報は、HL7やSS-MIXなど医療情報の交換標準で扱われるもので、XBRLの対象ではありません。誤り。
  イ: 企業の顧客情報は、各社のCRM（顧客関係管理）システムなどで管理する情報で、XBRLの主要な対象ではありません。誤り。
  ウ: 企業の財務情報（財務諸表など）は、XBRLの主要な取扱い対象です。<b>正解</b>。
  エ: 自治体の住民情報は、住民基本台帳システムなどで扱う情報で、XBRLの対象ではありません。誤り。
example: |
  たくさんの会社の決算書がPDFだけで公開されていると、「売上高」を比べるには人が1社ずつ数字を読み取る必要があります。XBRLで公開されていれば、プログラムで全社の「売上高」タグを一気に読み込み、ランキングを作ったり分析したりできます。
review:
  - XBRL＝XMLベースの財務情報（財務諸表）記述言語。EDINETや決算短信の電子開示で使われる。
  - 財務項目に共通のタグを付けるので、コンピュータで自動集計・比較・分析ができる。
