q: 32
answer: ウ
category: ネットワーク
theme: |
  決められた時間内にデータを送るのに必要な回線速度を、伝送効率を考慮して計算し、条件を満たす最も遅い回線サービスを選ぶ問題です。
basics: |
  <b>1バイト＝8ビット</b>：回線速度はビット/秒で表すので、データ量はビットに直して計算します。1Mバイト＝8Mビット。
  <b>伝送効率</b>：回線の速度のうち、実際にデータを送るのに使える割合です。伝送効率60%なら、10Mビット/秒の回線でも実際に使えるのは6Mビット/秒です。
  | 実効速度 ＝ 回線速度 × 伝送効率
  | 必要な回線速度 ＝ 必要な実効速度 ÷ 伝送効率
reasoning: |
  1. 送るデータ量：1Mバイト × 8 ＝ <b>8Mビット</b>
  2. 5秒以内に送るのに必要な実効速度：
  | 8Mビット ÷ 5秒 ＝ 1.6Mビット/秒
  3. 伝送効率60%を考慮した、必要な回線速度：
  | 1.6 ÷ 0.6 ≒ 2.67Mビット/秒
  4. 2.67Mビット/秒以上の回線のうち、最も遅いのは <b>4Mビット/秒</b> です（2Mビット/秒では足りない）。
  5. 確認：4Mビット/秒×0.6＝2.4Mビット/秒 → 8Mビット÷2.4≒3.3秒で、5秒以内に送れます。
  6. 正解は<b>ウ</b>です。
choices:
  ア: 1Mビット/秒の回線では、実効速度は0.6Mビット/秒で、8Mビットを送るのに約13.3秒かかり、5秒以内に送れません。誤り。
  イ: 2Mビット/秒の回線では、実効速度は1.2Mビット/秒で、約6.7秒かかり、5秒以内に送れません。伝送効率を考えないと 8÷2＝4秒で足りるように見えてしまう、ひっかけの選択肢です。誤り。
  ウ: 4Mビット/秒の回線なら、実効速度2.4Mビット/秒で約3.3秒で送れます。条件を満たす最も遅い回線です。<b>正解</b>。
  エ: 10Mビット/秒の回線でも送れますが、条件を満たす最低速度の回線ではありません。誤り。
example: |
  80kmの道のりを5時間以内に行きたいとき、平均時速16km以上が必要です。信号や渋滞で、実際には最高速度の6割しか出せないなら、最高速度は16÷0.6≒27km以上の乗り物が必要です。時速20kmの自転車では間に合わず、時速40kmの原付なら間に合います。
review:
  - 必要な回線速度＝（データ量[ビット]÷制限時間）÷伝送効率。バイト×8＝ビットの換算を忘れない。
  - 「最低速度」を問う問題は、計算値以上で最も小さい選択肢を選ぶ。伝送効率を無視すると遅すぎる回線を選んでしまう。
