q: 51
answer: エ
category: プロジェクトマネジメント
theme: |
  PMBOKガイド第7版で、プロジェクトの作業範囲を記した「プロジェクト・スコープ記述書」に書く項目を、WBS・コスト見積り・ステークホルダー分類と区別する問題です。
basics: |
  <b>スコープ</b>：プロジェクトで「何を作り、どこまでの作業をするか」という範囲です。
  <b>プロジェクト・スコープ記述書</b>：プロジェクトのスコープを文書にしたもので、主に次の内容を記します。
  - プロダクト・スコープの記述（何を作るか）
  - 成果物
  - 受入れ基準
  - <b>プロジェクトの除外事項</b>（スコープに<b>含まないもの</b>）
  除外事項を明記しておくことで、「それもやってくれると思っていた」という認識のずれ（スコープの膨張）を防げます。

  関連する成果物
  - <b>WBS</b>：スコープ記述書を基に、作業を階層的に分解したもの（スコープ記述書とは別の成果物）。
  - <b>コスト見積り</b>：コストの見積りの成果物。
  - <b>ステークホルダー分類</b>：ステークホルダー（利害関係者）の特定・分析の成果物（ステークホルダー登録簿など）。
reasoning: |
  1. プロジェクト・スコープ記述書には、成果物や受入れ基準とともに、<b>プロジェクトの除外事項</b>を記述します。
  2. WBS・コスト見積額・ステークホルダー分類は、それぞれ別の計画プロセスの成果物です。
  3. 正解は<b>エ</b>です。
choices:
  ア: WBSは、スコープ記述書を基に作業を分解した別の成果物で、スコープ記述書そのものに記述する項目ではありません（スコープ記述書・WBS・WBS辞書をまとめてスコープ・ベースラインと呼びます）。誤り。
  イ: コスト見積額は、コストの見積りの成果物です。誤り。
  ウ: ステークホルダー分類は、ステークホルダーの特定・分析の成果物です。誤り。
  エ: プロジェクトの除外事項（スコープに含まないもの）は、プロジェクト・スコープ記述書に記述する項目です。<b>正解</b>。
example: |
  リフォームの契約書に「キッチンの交換を行う。ただし、床の張替えは含まない」と書いておくのが除外事項です。書いていないと、完成後に「床もきれいにしてくれると思っていた」というトラブルになりがちです。
review:
  - プロジェクト・スコープ記述書＝成果物、受入れ基準、プロジェクトの除外事項などを記す。
  - WBS（作業の分解）、コスト見積り、ステークホルダー分類は別の成果物。
