q: 40
answer: イ
theme: |
  JPCERT/CCとIPAが共同で運営する脆弱性情報サイト「JVN」の目的を、CVSSやCWEなど似た名前の仕組みと区別する問題です。
basics: |
  <b>脆弱性（ぜいじゃくせい）</b>：ソフトウェアのセキュリティ上の欠陥（弱点）です。攻撃者に悪用されると、不正アクセスや情報漏えいにつながります。

  脆弱性に関する主な仕組み
  - <b>JVN（Japan Vulnerability Notes）</b>：日本で使われているソフトウェアの<b>脆弱性情報と、その対策情報</b>（修正版の有無など）を公開するポータルサイト。JPCERT/CCとIPAが共同運営。
  - <b>CVSS</b>：脆弱性の<b>深刻度を評価する</b>共通の手法（0.0〜10.0の点数で表す）。
  - <b>CWE</b>：脆弱性の<b>種類（タイプ）を分類・識別する</b>ための共通の基準（例：SQLインジェクション、バッファオーバーフロー）。
  - <b>CVE</b>：個々の脆弱性に付ける<b>共通の識別番号</b>。
reasoning: |
  1. JVNは「Vulnerability Notes（脆弱性に関する覚え書き）」という名前のとおり、脆弱性の情報を集めて公開するサイトです。
  2. 製品開発者と調整した上で、脆弱性の内容と対策方法（アップデートなど）を提供し、利用者のセキュリティ対策に役立てます。
  3. この目的を述べているのは<b>イ</b>です。
choices:
  ア: ソフトウェアの脆弱性を<b>検出</b>するのは、脆弱性スキャナや診断ツール、セキュリティ診断サービスの役割です。JVNは見つかった脆弱性の情報を提供するもので、検出は行いません。誤り。
  イ: ソフトウェアの脆弱性関連情報とその対策情報とを提供し、情報セキュリティ対策に資する。<b>JVN</b>の目的です。<b>正解</b>。
  ウ: 脆弱性に対する汎用的な評価手法を確立するのは<b>CVSS</b>（共通脆弱性評価システム）です。誤り。
  エ: 脆弱性のタイプを識別するための基準を提供するのは<b>CWE</b>（共通脆弱性タイプ一覧）です。誤り。
example: |
  JVNは、家電の「リコール情報サイト」のようなものです。どの製品にどんな欠陥があり、どう対処すればよいか（修理・交換）を知らせてくれます。CVSSは欠陥の「危険度ランク」、CWEは欠陥の「種類（発火、部品脱落など）」の分類表にあたります。
review:
  - JVN＝脆弱性情報と対策情報を提供するポータル（JPCERT/CCとIPAの共同運営）。
  - CVSS＝深刻度の評価手法、CWE＝脆弱性タイプの分類基準、CVE＝個別の脆弱性の識別番号、と区別する。
