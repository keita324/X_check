q: 70
answer: ウ
category: 技術戦略マネジメント
theme: |
  企業と大学が一緒に研究を行う「産学連携の共同研究」について、正しい記述を選ぶ問題です。TLOの役割や特許の発明者の考え方がポイントです。
basics: |
  <b>共同研究</b>：企業と大学が、共通のテーマについて研究者を出し合い、一緒に研究を行うことです。企業は研究費を負担することが多いですが、費用を出したからといって研究の主従関係が決まるわけではなく、<b>大学と企業の研究者は対等の立場</b>で研究を進めます。

  関連する仕組み
  - <b>TLO（Technology Licensing Organization：技術移転機関）</b>：大学の研究成果を特許にし、それを企業にライセンス（使用許諾）して<b>技術を移転</b>する機関です。全ての大学に設置されているわけではなく、企業のニーズを受け入れて共同研究を実施するための機関でもありません。
  - <b>特許の発明者</b>：実際に発明をした<b>個人（自然人）</b>です。会社や大学などの法人は発明者になれません（法人は、特許を受ける権利を譲り受けて出願人・特許権者になることはできます）。
reasoning: |
  1. ア：TLOは大学の研究成果を企業に技術移転する機関で、共同研究を実施するための機関ではなく、全大学に設置されてもいません → ×。
  2. イ：特許の発明者は、実際に発明した研究者個人（自然人）で、法人は発明者になれません → ×。
  3. ウ：企業が経費を全て負担しても、研究は大学の教職員と企業の研究者が対等の立場で行う → ○。
  4. エ：国立大学法人が共同研究を行う場合も、費用を全て国が負担しなければならないという決まりはなく、企業が負担することも多い → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: TLOは、大学の研究成果を特許化して企業に技術移転する機関です。共同研究を実施するための機関ではなく、各大学に必ず設置されているわけでもありません。誤り。
  イ: 特許出願における発明者は、実際に発明を行った個人（自然人）です。企業や大学などの法人は発明者にはなれません。誤り。
  ウ: 共同研究に必要な経費を企業が全て負担した場合でも、実際の研究は大学の教職員と企業の研究者が対等の立場で行います。<b>正解</b>。
  エ: 国立大学法人の共同研究でも、費用を全て国が負担しなければならないという決まりはありません。企業が研究費を負担する共同研究も広く行われています。誤り。
example: |
  自動車メーカーが大学と新しい電池の共同研究を行う場合、研究費をメーカーが全部出しても、大学の先生がメーカーの部下になるわけではありません。お互いの知識を持ち寄り、対等に議論して研究を進めます。成果が特許になれば、発明者として名前が載るのは、実際にアイデアを出した研究者たち個人です。
review:
  - 共同研究は、費用負担にかかわらず大学と企業の研究者が対等の立場で行う。
  - TLO＝大学の研究成果を企業へ技術移転する機関。特許の発明者は自然人（法人は発明者になれない）。
