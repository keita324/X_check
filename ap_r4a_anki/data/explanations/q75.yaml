q: 75
answer: エ
theme: |
  将来予測の手法「デルファイ法」の説明を選ぶ問題です。
basics: |
  <b>デルファイ法</b>：複数の専門家に同じ質問のアンケートを行い、その集計結果を回答者全員に<b>フィードバック</b>して、再びアンケートに答えてもらう、という手順を<b>何度も繰り返す</b>ことで、意見を一定の範囲に収束させて将来を予測する手法です。
  アンケートは匿名で行うため、声の大きい人や偉い人の意見に引きずられにくいという特徴があります。技術の将来予測などに使われます。

  他の予測手法
  - <b>先行指標による予測</b>：景気より先に動く指標（例：新規求人数）に注目して将来を予測する。
  - <b>計量経済モデル</b>：経済の仕組みを連立方程式で表したモデルを解いて予測する。
  - <b>クロスセクション分析</b>：同じ時点の複数のデータ（地域ごとのデータなど）を比較分析する。
reasoning: |
  1. デルファイ法のキーワードは「複数の専門家」「アンケートの繰返し」「回答の収束」です。
  2. これらをすべて含むのは<b>エ</b>です。
choices:
  ア: 現状の指標の中に将来の動向を示す指標（先行指標）があることに注目して予測するのは、<b>先行指標による予測</b>です。誤り。
  イ: 将来予測のためにモデル化した連立方程式を解いて予測するのは、<b>計量経済モデル（シミュレーション）</b>による予測です。誤り。
  ウ: 同時点における複数の観測データを統計的に比較分析するのは、<b>クロスセクション分析</b>です。誤り。
  エ: 複数の専門家へのアンケートを繰り返し、回答を収束させて将来を予測する。<b>デルファイ法</b>です。<b>正解</b>。
example: |
  「10年後に自動運転車は普及しているか？」を10人の専門家に匿名で聞き、「みんなの予想の平均は2032年、ばらつきはこのくらい」と結果を見せてから、もう一度聞きます。自分の予想が大きく外れていた人は理由を考え直すので、何回か繰り返すうちに意見がまとまっていきます。
review:
  - デルファイ法＝専門家への匿名アンケートを、結果をフィードバックしながら繰り返し、意見を収束させる予測手法。
  - 先行指標（ア）、計量経済モデル（イ）、クロスセクション分析（ウ）と区別する。
