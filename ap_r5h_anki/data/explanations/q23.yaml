q: 23
answer: エ
category: ハードウェア
theme: |
  自動運転車に使われるセンサー「LiDAR（ライダー）」の仕組みを、超音波センサー・カメラ・ミリ波レーダーと区別する問題です。
basics: |
  自動運転では、周囲の物体を検知するために複数のセンサーを組み合わせます。
  - <b>LiDAR（Light Detection And Ranging）</b>：<b>レーザー光</b>をパルス状に照射し、物体に当たって戻ってくるまでの時間から距離を測る。多数の方向に照射して、物体の<b>方向・距離・形状</b>を3次元的に把握できる。
  - <b>超音波センサー</b>：超音波を出して反射を測る。近距離の検知に使う（駐車時の障害物センサーなど）。
  - <b>ミリ波レーダー</b>：ミリ波帯の電波を出して反射を測る。雨や霧に強く、遠くの物体の距離や速度の計測に使う。
  - <b>カメラ</b>：画像を解析して、白線や標識、物体を認識する（遠近法を使った距離推定も行う）。
reasoning: |
  1. LiDARの「Light（光）」が示すとおり、使うのは<b>レーザー光</b>です。
  2. 「レーザー光をパルス状に照射し、その反射光を測定することによって、対象物の方向、距離及び形状を計測する」という<b>エ</b>が正解です。
choices:
  ア: 超音波を送り出して反射波から対象物の有無や距離を測るのは、<b>超音波センサー（ソナー）</b>です。誤り。
  イ: 道路の幅や車線が消失点に収束するという遠近法の原理で距離を測るのは、<b>カメラ（画像処理）</b>による方法です。誤り。
  ウ: ミリ波帯の電磁波を送り出して反射波から対象物の有無や距離を測るのは、<b>ミリ波レーダー</b>です。誤り。
  エ: レーザー光をパルス状に照射し、反射光から対象物の方向・距離・形状を計測するのは<b>LiDAR</b>です。<b>正解</b>。
example: |
  暗い部屋で、レーザーポインタを素早くあちこちに向け、光が返ってくるまでの時間から「どの方向の、どれだけ先に、どんな形の物があるか」を地図にしていくのがLiDARです。自動運転車の屋根で回っている装置や、一部のスマホの3Dスキャン機能にも使われています。
review:
  - LiDAR＝レーザー光のパルスの反射で、物体の方向・距離・形状を計測する。
  - 超音波センサー（超音波）、ミリ波レーダー（電波）、カメラ（画像・遠近法）と、使う波・原理で区別する。
