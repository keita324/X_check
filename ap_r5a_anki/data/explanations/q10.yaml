q: 10
answer: ア
category: コンピュータ構成要素
theme: |
  フラッシュメモリを使ったファイルシステムで、ブロックごとの書換え回数を管理して寿命を延ばす技術を、ジャーナリング・デフラグ・ライトアンプリフィケーションと区別する問題です。
basics: |
  <b>フラッシュメモリ</b>（SSDやUSBメモリ）は、データを<b>ブロック単位で消去してから書き込む</b>仕組みで、ブロックごとの<b>書換え回数に上限</b>があります。特定のブロックばかり書き換えると、そこだけが早く使えなくなります。
  - <b>ウェアレベリング</b>：ブロックごとの書換え回数を管理し、書込み先を分散させて、回数が均等になるようにする技術。全体の寿命を延ばす。
  - <b>ジャーナリング</b>：ファイルシステムの更新内容を先にログ（ジャーナル）に記録しておき、障害時に素早く整合性を回復できるようにする技術。
  - <b>デフラグ</b>：ハードディスク上でバラバラに配置されたファイルを、連続した領域に並べ直して読み書きを速くする処理。フラッシュメモリでは書換え回数を増やすため、通常は不要とされる。
  - <b>ライトアンプリフィケーション（書込み増幅）</b>：フラッシュメモリで、ブロック単位の消去・再書込みのために、実際に書き込まれるデータ量が、書き込もうとしたデータ量より大きくなってしまう<b>現象</b>。寿命を縮める要因であり、寿命を延ばす技術ではない。
reasoning: |
  1. 問題文のキーワードは「ブロックごとの書換え回数を管理」「フラッシュメモリの寿命を延ばす」です。
  2. これは<b>ウェアレベリング</b>の説明です。正解は<b>ア</b>です。
choices:
  ア: ブロックごとの書換え回数を管理し、書込みを分散させて寿命を延ばすのはウェアレベリングです。<b>正解</b>。
  イ: ジャーナリングは、更新内容をログに記録して障害時のファイルシステムの整合性を保つ技術で、寿命を延ばすものではありません。誤り。
  ウ: デフラグは、断片化したファイルを連続領域に並べ直す処理です。フラッシュメモリでは書換え回数を増やすため、寿命を延ばす目的では使いません。誤り。
  エ: ライトアンプリフィケーションは、実際の書込み量が増えてしまう現象で、むしろ寿命を縮める要因です。誤り。
example: |
  畳の同じ場所ばかり歩くとそこだけすり減るので、ときどき畳を入れ替えて、すり減り方を均等にするようなものです。ウェアレベリングは、コントローラが自動でこの「入れ替え」を行っています。
review:
  - ウェアレベリング＝ブロックごとの書換え回数を均等化してフラッシュメモリの寿命を延ばす技術。
  - ジャーナリング（障害回復用のログ）、デフラグ（断片化解消）、ライトアンプリフィケーション（書込み量が増える現象）と区別する。
