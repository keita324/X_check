q: 19
answer: ウ
category: ソフトウェア開発管理技術
theme: |
  各開発者の手元に、全履歴を含むリポジトリの完全な複製をもつ「分散型」のバージョン管理ツールを選ぶ問題です。
basics: |
  <b>バージョン管理ツール</b>：ソースコードなどの変更履歴を記録・管理するツールです。「いつ、誰が、何を変えたか」を残し、過去の状態に戻したり、複数人の変更をまとめたりできます。
  <b>リポジトリ</b>：変更履歴を保存しておく場所です。
  - <b>集中型</b>：リポジトリは<b>中央のサーバに1つ</b>だけ。開発者は必要なファイルを取り出して作業し、変更を中央に登録する。中央サーバに接続できないと、履歴の参照や変更の記録（コミット）ができない。例：<b>Apache Subversion</b>、<b>CVS</b>。
  - <b>分散型</b>：各開発者が、<b>全履歴を含むリポジトリの完全な複製</b>（ローカルリポジトリ）を手元にもつ。中央リポジトリにつながらなくても、履歴の調査や変更の記録ができ、後で中央と同期する。例：<b>Git</b>、Mercurial。
  - <b>RCS</b>：個々のファイル単位で履歴を管理する、初期のローカルなバージョン管理ツール。
reasoning: |
  1. 問題文のキーワードは「各開発者のローカル環境に全履歴を含んだ中央リポジトリの完全な複製」「中央リポジトリにアクセスできないときでも履歴の調査や変更の記録が可能」で、分散型の特徴です。
  2. 選択肢のうち分散型は<b>Git</b>です。正解は<b>ウ</b>です。
choices:
  ア: Apache Subversion（SVN）は集中型のバージョン管理ツールで、履歴は中央リポジトリにあり、通常はアクセスできないと履歴の参照やコミットができません。誤り。
  イ: CVSも集中型のバージョン管理ツールです。誤り。
  ウ: Gitは分散型のバージョン管理ツールで、各開発者が全履歴を含むリポジトリの完全な複製をもち、オフラインでも履歴の調査や変更の記録ができます。<b>正解</b>。
  エ: RCSは、ファイル単位で履歴を管理する初期のツールで、中央リポジトリの複製をもつ分散型ではありません。誤り。
example: |
  集中型は「みんなで1冊の共有ノートに書き込む」方式で、ノートが置いてある部屋に行かないと過去のページも見られません。分散型は「全員が共有ノートの完全なコピーを持ち歩き、各自のコピーに書き込んで、後で突き合わせる」方式で、電車の中でも過去のページを見たり、書き込んだりできます。
review:
  - 分散型（Git）＝各開発者が全履歴を含むリポジトリの完全な複製をもち、オフラインでも履歴参照・コミットができる。
  - 集中型（Subversion、CVS）＝中央リポジトリにアクセスしないと履歴参照・コミットができない。
