q: 74
answer: ウ
category: 企業活動
theme: |
  企業の組織形態のうち「事業部制組織」の特徴を、プロジェクト組織・職能別組織・ネットワーク組織と区別する問題です。
basics: |
  代表的な組織形態
  - <b>事業部制組織</b>：製品別、地域別、顧客別などで<b>事業部</b>を作り、各事業部に開発・製造・販売などの機能を持たせて、<b>利益責任</b>を負わせる組織。事業部ごとに独立した会社のように運営し、市場の変化に素早く対応できる。
  - <b>職能別組織（機能別組織）</b>：開発、製造、販売、経理など、<b>業務の機能</b>ごとに部門を分ける組織。専門性は高まるが、部門間の調整が必要。
  - <b>プロジェクト組織</b>：特定の課題を解決するために一定期間だけ結成し、目的を達成したら解散する組織。
  - <b>ネットワーク組織</b>：戦略的提携や共同開発など、外部の企業と柔軟に連携して経営資源を活用する組織。
reasoning: |
  1. 事業部制組織の特徴は「製品や地域などで構成された組織単位（事業部）」に「利益責任をもたせる」ことです。
  2. これを述べているのは<b>ウ</b>です。
choices:
  ア: ある問題を解決するために一定期間だけ結成され、解決後に解散するのは<b>プロジェクト組織</b>です。誤り。
  イ: 業務を機能別に分け、各機能について部下に命令・指導するのは<b>職能別組織（機能別組織）</b>です。誤り。
  ウ: 製品や地域などで構成された組織単位に利益責任をもたせるのは<b>事業部制組織</b>です。<b>正解</b>。
  エ: 戦略的提携や共同開発など、外部の経営資源を積極的に活用して経営環境に対応するのは<b>ネットワーク組織</b>の特徴です。誤り。
example: |
  家電メーカーで「テレビ事業部」「冷蔵庫事業部」「エアコン事業部」のように製品ごとに分け、それぞれが開発から販売まで担当し、「今年はテレビ事業部が○億円の利益を出す」と責任を持つのが事業部制組織です。「開発部」「製造部」「営業部」と機能で分けるのは職能別組織です。
review:
  - 事業部制組織＝製品・地域・顧客などの単位で事業部を作り、利益責任をもたせる組織。
  - 職能別組織（機能ごと）、プロジェクト組織（期間限定）、ネットワーク組織（外部との連携）と区別する。
