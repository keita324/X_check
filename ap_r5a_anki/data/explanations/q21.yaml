q: 21
answer: ウ
category: ハードウェア
theme: |
  集積回路の基本部品である「MOSトランジスタ」の構造上の特徴を、発光ダイオード・フォトダイオード・ツェナーダイオードと区別する問題です。
basics: |
  <b>半導体</b>：電気を通す導体と通さない絶縁体の中間の性質をもつ物質（シリコンなど）。混ぜる不純物によって、電子が多いn型と、正孔（電子の抜けた穴）が多いp型が作れます。
  <b>pn接合</b>：p型とn型の半導体をくっつけたもの。ダイオードの基本構造です。

  主な半導体素子
  - <b>MOSトランジスタ（MOSFET）</b>：<b>Metal（金属）−Oxide（酸化物）−Semiconductor（半導体）</b>の頭文字。ゲート電極（金属）と半導体の間に、薄い<b>酸化物の絶縁体</b>（酸化シリコン）を挟んだ構造をもつ。ゲートに電圧をかけると、絶縁体の下に電流の通り道ができ、電流をオン・オフできる。CPUやメモリなどの集積回路の大部分を構成する。
  - <b>発光ダイオード（LED）</b>：pn接合で電子と正孔が再結合するときに光を放つ。
  - <b>フォトダイオード</b>：pn接合部に光が当たると電流が発生する。光センサーやカメラの撮像素子に使う。
  - <b>ツェナーダイオード（定電圧ダイオード）</b>：逆方向にある電圧以上をかけると電流が流れ、電圧がほぼ一定に保たれる。電圧を安定させる回路に使う。
reasoning: |
  1. MOSトランジスタの名前そのものが構造を表しています。金属（M）と半導体（S）の間に酸化物（O）の絶縁体を挟んだ構造です。
  2. 「金属と半導体との間に酸化物絶縁体を挟んだ構造をもつことが特徴の半導体素子」という<b>ウ</b>が正解です。
choices:
  ア: pn接合で電子と正孔が再結合するときに光を放出する性質を利用するのは、<b>発光ダイオード（LED）</b>です。誤り。
  イ: pn接合部に光が当たると電流が発生する性質を利用するのは、<b>フォトダイオード</b>です。誤り。
  ウ: 金属と半導体の間に酸化物絶縁体を挟んだ構造が特徴なのは、<b>MOSトランジスタ</b>です。<b>正解</b>。
  エ: 逆方向電圧をある電圧以上かけると、電流だけが増えて電圧がほぼ一定に保たれるのは、<b>ツェナーダイオード（定電圧ダイオード）</b>です。誤り。
example: |
  MOSトランジスタは、水道管（半導体）の上に、薄い膜（酸化物絶縁体）を挟んで蛇口のハンドル（金属のゲート）が付いているようなものです。ハンドルに力（電圧）をかけると、膜越しに管が開いて水（電流）が流れます。この小さな蛇口が、CPUの中に何十億個も並んでいます。
review:
  - MOSトランジスタ＝金属・酸化物（絶縁体）・半導体の構造。ゲート電圧で電流をオン・オフし、集積回路の基本素子となる。
  - LED（再結合で発光）、フォトダイオード（光で電流発生）、ツェナーダイオード（逆方向で定電圧）と区別する。
