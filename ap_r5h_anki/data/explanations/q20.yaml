q: 20
answer: ア
category: ソフトウェア
theme: |
  コンテナ型仮想化のプラットフォームとなるオープンソースソフトウェア（OSS）を、ハイパーバイザやエミュレータと区別して選ぶ問題です。
basics: |
  <b>OSS（オープンソースソフトウェア）</b>：ソースコードが公開され、誰でも利用・改変・再配布できるソフトウェアです。
  <b>仮想化の方式</b>
  - <b>コンテナ型</b>：ホストOSのカーネルを共有し、アプリの実行環境だけを分離する。ゲストOSが不要で軽い。代表例：<b>Docker</b>。
  - <b>ハイパーバイザ型</b>：ハードウェアの上でハイパーバイザが動き、その上で複数のゲストOSを動かす。代表例：<b>Xen</b>、<b>KVM</b>（Linuxカーネルに組み込まれたハイパーバイザ機能）。
  - <b>エミュレータ</b>：別の種類のCPUの動作をソフトウェアで再現する。代表例：<b>QEMU</b>（KVMと組み合わせて仮想マシンの実行にも使われる）。
reasoning: |
  1. 「コンテナ型仮想化の環境」で「アプリの構築・実行・管理を行うプラットフォーム」を提供するOSSは<b>Docker</b>です。Dockerでは、アプリと必要なライブラリを「コンテナイメージ」にまとめ、どこでも同じように動かせます。
  2. KVM、QEMU、Xenは、ゲストOSを動かす仮想マシン（ハイパーバイザ型など）のための技術です。
  3. 正解は<b>ア</b>です。
choices:
  ア: Dockerは、コンテナ型仮想化でアプリケーションの構築・実行・管理を行うプラットフォームを提供するOSSです。<b>正解</b>。
  イ: KVMは、Linuxカーネルに組み込まれたハイパーバイザ機能で、ゲストOSを動かす仮想マシン（ハイパーバイザ型）の技術です。誤り。
  ウ: QEMUは、CPUなどのハードウェアをソフトウェアで再現するエミュレータで、仮想マシンを動かすために使われます。コンテナ型のプラットフォームではありません。誤り。
  エ: Xenは、ハードウェア上で直接動くハイパーバイザ型の仮想化ソフトウェアです。誤り。
example: |
  Dockerは「引っ越し用の標準コンテナ」のようなものです。アプリと必要な道具一式を1つの箱（コンテナ）に詰めれば、開発者のパソコンでも本番のサーバでも同じように動きます。家（ゲストOS）ごと運ぶ仮想マシンより軽く、すぐに起動できます。
review:
  - Docker＝コンテナ型仮想化のプラットフォーム（OSS）。
  - KVM・Xen＝ハイパーバイザ型の仮想化、QEMU＝エミュレータ。コンテナ型（ゲストOSなし）と区別する。
