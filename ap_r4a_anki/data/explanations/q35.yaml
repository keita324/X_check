q: 35
answer: エ
theme: |
  URL（Webページの住所）の構成要素を理解し、Webサーバのポート番号をどこに書くかを問う問題です。
basics: |
  URLは、次のような部品の組合せでできています。
  | https :// www.example.com :8080 /member/login ?id=user
  | スキーム　 ホスト名　　　 ポート番号　パス　　　クエリ文字列
  - <b>スキーム</b>（https）：通信方式。httpsなら暗号化されたHTTP。
  - <b>ホスト名</b>（www.example.com）：接続するサーバの名前。
  - <b>ポート番号</b>（:8080）：サーバ内のどのサービスに接続するかの番号。<b>ホスト名の直後に「:」（コロン）を付けて</b>書きます。省略すると、httpsなら443番、httpなら80番が使われます。
  - <b>パス</b>（/member/login）：サーバ内のどのページ（資源）か。
  - <b>クエリ文字列</b>（?id=user）：「?」の後に付ける追加の情報（検索条件など）。
reasoning: |
  1. ポート番号は「どのサーバのどの部屋（サービス）に行くか」を決めるものなので、サーバの名前（ホスト名）とセットで書きます。
  2. URLの規則では「ホスト名:ポート番号」の形で、ホスト名の直後に書きます。
  | https://www.example.com:8080/member/login?id=user
  3. 正解は<b>エ</b>です。
choices:
  ア: クエリ文字列の後ろの「:8080」は、id の値が「user:8080」という文字列だと解釈されるだけで、ポート番号の指定にはなりません。誤り。
  イ: スキームの直後（https:8080://）は、URLの書式として正しくなく、ポート番号の指定位置ではありません。誤り。
  ウ: パスの後ろの「:8080」は、パスの一部（login:8080 という名前のページ）と解釈され、ポート番号にはなりません。誤り。
  エ: ホスト名の直後に「:8080」と書くのが、ポート番号を指定する正しい書き方です。<b>正解</b>。
example: |
  URLを手紙の宛先に例えると、ホスト名が「建物の住所」、ポート番号が「部屋番号」、パスが「部屋の中の棚の場所」です。部屋番号は住所のすぐ後ろに書きますよね。開発中のWebアプリを http://localhost:8080/ で開くのも、この書き方です。
review:
  - URLの順番「スキーム://ホスト名:ポート番号/パス?クエリ」を書けるようにする。
  - ポート番号はホスト名の直後にコロンで書く。省略時は http＝80番、https＝443番。
