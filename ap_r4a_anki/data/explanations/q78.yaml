q: 78
answer: ウ
theme: |
  システム開発を何段階にも外部委託したときに、開発したプログラムの著作権が誰に帰属するかを問う、著作権法の問題です。
basics: |
  <b>著作権</b>：プログラムも、小説や音楽と同じく著作物として著作権法で保護されます。原則として、<b>実際に作った人（著作者）</b>に著作権が発生します。お金を払って作らせた<b>発注者には、契約で取り決めない限り、著作権は移りません</b>。

  <b>職務著作（法人著作）</b>：会社の社員が仕事として作ったプログラムは、次の条件を満たせば、社員個人ではなく<b>会社が著作者</b>になります（著作権法第15条）。
  - 会社の発意に基づく
  - 会社の業務に従事する者が職務上作成する
  - （プログラムの場合）契約や就業規則などに別段の定めがない
reasoning: |
  1. 委託の流れを整理します。
  | A社 →（開発を委託）→ B社 →（設計・プログラミング・テストを委託）→ C社 →（担当させる）→ 社員D
  2. 実際にプログラムを作ったのは、C社の社員Dです。
  3. 社員Dは、C社の業務として（職務上）プログラムを作成しており、特段の取決めもないので<b>職務著作</b>が成立し、著作者・著作権者は<b>C社</b>になります。
  4. A社やB社は、お金を払って委託しただけで、著作権の帰属について特段の取決めがない以上、著作権は持ちません。
  5. 正解は<b>ウ</b>です。
choices:
  ア: A社は最初の発注者ですが、開発を委託しただけでは著作権は移転しません。誤り。
  イ: B社は要件定義を行いましたが、プログラムそのもの（ソフトウェア設計以降）はC社に委託しています。委託しただけでは著作権は得られません。誤り。
  ウ: C社の社員Dが職務として作成したので、職務著作により<b>C社</b>に著作権が帰属します。<b>正解</b>。
  エ: 社員Dは実際に作成した人ですが、職務上の作成なので職務著作が成立し、著作権は個人ではなく会社（C社）に帰属します。誤り。
example: |
  結婚式のアルバム作りを写真館に頼み、写真館が提携カメラマン事務所に撮影を任せた場合、写真の著作権は、契約で決めていなければ実際に撮影したカメラマン事務所側にあります。お金を払った新郎新婦（発注者）が自由に写真を加工・販売したい場合は、著作権を譲ってもらう契約が必要です。
review:
  - 委託開発のプログラムの著作権は、特段の取決めがなければ「実際に作成した側」に帰属し、発注者には移らない。
  - 社員が職務として作成した場合は職務著作となり、著作者・著作権者は会社（この問題ではC社）。
  - 発注者が著作権を得たい場合は、契約で著作権の譲渡を定める必要がある。
