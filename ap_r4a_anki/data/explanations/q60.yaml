q: 60
answer: ア
theme: |
  経済産業省が定める「システム監査基準」の意義（何のための基準か）を問う問題です。よく似た名前の「システム管理基準」との区別がポイントです。
basics: |
  システム監査に関しては、経済産業省が2つの基準を定めています。
  - <b>システム監査基準</b>：<b>監査人のための</b>基準。システム監査人が監査を行うときに守るべき行為規範（監査の進め方、独立性、品質の確保など）を定めたもの。
  - <b>システム管理基準</b>：<b>監査する側が物差しとして使う</b>基準。組織が情報システムを管理する上で留意すべき事項をまとめたもので、監査人はこれを「判断の尺度」として使い、対象の情報システムを評価します。

  覚え方：<b>「監査基準＝監査人の守るルール」「管理基準＝監査対象を測る物差し」</b>
reasoning: |
  1. システム監査基準は、監査業務の品質を確保し、有効かつ効率的な監査を実現するための、システム監査人の行為規範です。
  2. この説明は<b>ア</b>です。
  3. ウとエは、「情報システムをどう管理すべきか」についての基準＝システム管理基準の説明です。
choices:
  ア: システム監査業務の品質を確保し、有効かつ効率的な監査を実現するためのシステム監査人の行為規範。<b>システム監査基準</b>の意義です。<b>正解</b>。
  イ: 監査人が持つべき専門的知識・技能の水準を定めることは、システム監査基準の意義そのものではありません（監査基準の中で監査人の専門能力に触れてはいますが、基準全体の目的は監査業務の品質確保と行為規範です）。誤り。
  ウ: 情報システムのガバナンス、マネジメント、コントロールを点検・評価・検証する際の<b>判断の尺度</b>となるのは、<b>システム管理基準</b>です。誤り。
  エ: どのような組織体でも情報システムの管理において共通して留意すべき基本事項を体系化・一般化したものも、<b>システム管理基準</b>の説明です。誤り。
example: |
  スポーツに例えると、システム監査基準は「審判が守るべきルール（公平に判定する、試合中の振る舞いなど）」、システム管理基準は「選手のプレーが反則かどうかを判断するための競技規則」です。審判（監査人）は競技規則（管理基準）を物差しに、選手（組織の情報システム）を評価します。
review:
  - システム監査基準＝システム監査人の行為規範（監査業務の品質確保のため）。
  - システム管理基準＝監査の判断の尺度（情報システムの管理で留意すべき事項）。名前が似ているので「監査人のルール」か「対象を測る物差し」かで区別する。
