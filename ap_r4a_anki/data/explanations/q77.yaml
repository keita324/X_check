q: 77
answer: イ
theme: |
  機械の使用時間に上限がある中で、2つの製品をどう作り分ければ営業利益が最大になるかを求める問題です。「制約1単位当たりの限界利益」で比べるのがポイントです。
basics: |
  <b>変動費</b>：作る数に比例して増える費用（材料費など）。
  <b>固定費</b>：作る数に関係なくかかる費用（設備費、人件費の一部など）。ここでは年間10,000千円。
  <b>限界利益</b>：売上 − 変動費。1個売るごとに、固定費の回収と利益に回せる金額です。
  | 営業利益 ＝ 限界利益の合計 − 固定費

  <b>制約がある場合の考え方</b>：使える資源（ここでは機械の時間10,000時間）に限りがあるときは、「1個当たりの限界利益」ではなく、<b>「制約となる資源1単位（機械1時間）当たりの限界利益」</b>が大きい製品を優先して作ると、利益が最大になります。
reasoning: |
  <b>(1) 1個当たりの限界利益</b>
  | 甲：30 − 18 ＝ 12千円
  | 乙：25 − 14 ＝ 11千円
  1個当たりでは甲の方が大きいですが、機械時間が制約なので、時間当たりで比べます。

  <b>(2) 機械1時間当たりの限界利益</b>
  | 甲：12 ÷ 10時間 ＝ 1.2千円/時間
  | 乙：11 ÷ 8時間 ＝ 1.375千円/時間
  → 乙の方が効率が良いので、機械時間をすべて乙に使います（甲・乙とも、機械時間以外に制約はない）。

  <b>(3) 乙だけを作る場合</b>
  | 作れる個数：10,000時間 ÷ 8時間 ＝ 1,250個
  | 限界利益：11千円 × 1,250個 ＝ 13,750千円
  | 営業利益：13,750 − 固定費10,000 ＝ <b>3,750千円</b>

  （参考：甲だけなら 10,000÷10＝1,000個、12×1,000−10,000＝2,000千円で、乙だけの方が多い。）
  正解は<b>イ</b>です。
choices:
  ア: 2,000千円は、甲だけを作った場合の営業利益です。1個当たりの限界利益（甲12千円＞乙11千円）だけで判断すると選んでしまう、ひっかけの値です。誤り。
  イ: 3,750千円。機械1時間当たりの限界利益が大きい乙だけを1,250個作ったときの営業利益で、これが最大です。<b>正解</b>。
  ウ: 4,750千円。計算で求めた最大値3,750千円を上回っており、機械時間10,000時間の制約の下では実現できません。誤り。
  エ: 6,150千円。これも最大値3,750千円を上回っており、実現できません。誤り。
example: |
  1日8時間しか使えないキッチンカーで、ケーキ（1個の儲け300円・作るのに30分）とクッキー（1袋の儲け200円・作るのに10分）を売るなら、1時間当たりの儲けはケーキ600円、クッキー1,200円です。1個の儲けが大きいケーキより、時間当たりで稼げるクッキーを作った方が1日の儲けは多くなります。
review:
  - 制約（機械時間など）がある場合は「制約1単位当たりの限界利益」が大きい製品を優先する。
  - 限界利益＝売上−変動費、営業利益＝限界利益の合計−固定費。固定費の引き忘れに注意。
  - 1個当たりの限界利益だけで判断すると甲を選んで誤る（2,000千円のひっかけ）。
