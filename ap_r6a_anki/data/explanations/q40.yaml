q: 40
answer: ウ
category: セキュリティ
theme: |
  パスワードを狙う攻撃のうち、「パスワードリスト攻撃」の説明を、辞書攻撃・レインボーテーブル攻撃・ショルダーハッキングなどと区別する問題です。
basics: |
  - <b>パスワードリスト攻撃（リスト型攻撃）</b>：どこかのWebサイトから<b>流出した利用者IDとパスワードの組</b>のリストを使って、<b>他のWebサイト</b>へのログインを試みる攻撃。多くの人が<b>同じIDとパスワードを使い回している</b>ことを狙う。
  - <b>辞書攻撃</b>：一般的な単語や人名など、パスワードに使われやすい文字列のリスト（辞書）を作って、ログインを試みる攻撃。
  - <b>レインボーテーブル攻撃</b>：パスワード候補とそのハッシュ値の対応表を事前に作っておき、盗んだハッシュ値から元のパスワードを効率的に割り出す攻撃。
  - <b>ショルダーハッキング（のぞき見）</b>：入力の様子を後ろからのぞいたり、録画したりしてパスワードを盗む手口。
reasoning: |
  1. パスワードリスト攻撃のキーワードは「どこかのWebサイトから<b>流出した利用者IDとパスワードのリスト</b>」「<b>他のWebサイト</b>に対してログインを試行」です。
  2. この条件を満たす記述は<b>ウ</b>です。
choices:
  ア: 一般的な単語や人名からパスワードのリストを作ってログインを試すのは、<b>辞書攻撃</b>です。誤り。
  イ: 想定し得るパスワードとそのハッシュ値の対のリストを用いて、入手したハッシュ値からパスワードを解析するのは、<b>レインボーテーブル攻撃</b>です。誤り。
  ウ: どこかのWebサイトから流出した利用者IDとパスワードのリストを用いて、他のWebサイトにログインを試みるのは、<b>パスワードリスト攻撃</b>です。<b>正解</b>。
  エ: ピクチャパスワードの入力を録画してリスト化し、タブレットへのログインを試みるのは、入力ののぞき見（<b>ショルダーハッキング</b>）を利用した手口です。誤り。
example: |
  1つの鍵（同じIDとパスワード）を家・車・会社のロッカーで使い回していると、どこか1か所で鍵の型を取られた（流出した）だけで、他のすべての場所も開けられてしまいます。パスワードリスト攻撃への一番の対策は、サービスごとに違うパスワードを使うことと、多要素認証の利用です。
review:
  - パスワードリスト攻撃＝流出したIDとパスワードの組を他サイトで試す（使い回しを狙う）。対策はパスワードの使い回し禁止、多要素認証。
  - 辞書攻撃（単語リスト）、レインボーテーブル攻撃（ハッシュの対応表）、ショルダーハッキング（のぞき見）と区別する。
