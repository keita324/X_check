q: 44
answer: エ
category: セキュリティ
theme: |
  スパムメール対策として、メール送信用の「サブミッションポート（587番）」を導入する目的を問う問題です。
basics: |
  <b>SMTP</b>：メールを送信・転送するプロトコルです。本来、SMTPの25番ポートでは<b>送信者の認証がなかった</b>ため、他人のメールサーバを勝手に使ってスパムメールを送られる問題がありました。
  <b>OP25B（Outbound Port 25 Blocking）</b>：プロバイダが、利用者のPCから外部のメールサーバの25番ポートへの直接の通信を遮断する対策です。
  <b>サブミッションポート（587番）</b>：利用者のPC（メールソフト）が、自分の契約しているメールサーバに<b>メールを送信するための専用ポート</b>です。このポートでは、<b>SMTP-AUTH（SMTP認証）</b>でユーザIDとパスワードによる送信者の認証を行い、正規の利用者だけがメールを送れるようにします。
reasoning: |
  1. サブミッションポートを導入する目的は、メール送信時に送信者を認証し、正規の利用者以外による不正な送信（スパム）を防ぐことです。
  2. そのための認証方式は <b>SMTP-AUTH</b> です。
  3. 「SMTP-AUTHを使用して、メール送信者を認証する」という<b>エ</b>が正解です。
choices:
  ア: DNSサーバにSPFレコードを問い合わせるのは、<b>受信側</b>のメールサーバが送信元のなりすましを確認する<b>SPF</b>（送信ドメイン認証）の仕組みです。サブミッションポートの目的ではありません。誤り。
  イ: DNSに登録された公開鍵でデジタル署名を検証するのは、<b>DKIM</b>（送信ドメイン認証）の仕組みです。誤り。
  ウ: POP before SMTP は、メール受信（POP）の認証に成功したIPアドレスからの送信を一定時間許可する方式で、サブミッションポートで使う認証方式ではありません（SMTP自体には認証を行いません）。誤り。
  エ: サブミッションポートでは、SMTP-AUTHでメール送信者を認証し、正規の利用者だけが送信できるようにします。<b>正解</b>。
example: |
  マンションの宅配ボックス（メールサーバ）に荷物を預けて発送してもらうとき、昔は誰でも使えたので、部外者が勝手に大量の荷物を送っていました（スパム）。そこで、住民専用の入口（587番ポート）を作り、カードキー（SMTP-AUTH）で住民であることを確認してから使わせるようにしたのがサブミッションポートです。
review:
  - サブミッションポート（587番）＝メールソフトからメールサーバへの送信用ポート。SMTP-AUTHで送信者を認証する。
  - SPF・DKIMは受信側での送信ドメイン認証、POP before SMTPは別の送信者認証方式、と区別する。
