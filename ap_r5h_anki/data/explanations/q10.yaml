q: 10
answer: イ
category: コンピュータ構成要素
theme: |
  キャッシュメモリへの書込み方式「ライトスルー」と「ライトバック」の特徴を、正しく区別できるかを問う問題です。
basics: |
  <b>キャッシュメモリ</b>：CPUと主記憶の間に置く、小容量で高速なメモリです。よく使うデータのコピーを置いておきます。
  データを書き換えるときの方式は2つあります。
  - <b>ライトスルー方式</b>：書き込むたびに、キャッシュと主記憶の<b>両方に同時に</b>書き込む。主記憶の内容は常にキャッシュと一致する。ただし、毎回主記憶に書くので書込みは遅め。
  - <b>ライトバック方式</b>：まずキャッシュにだけ書き込む。そのデータがキャッシュから<b>追い出されるとき</b>に、主記憶に書き戻す。書込みは速いが、それまでの間、主記憶の内容は古いまま（不一致）になる。
reasoning: |
  1. ア：「ライトスルーではキャッシュだけに書き込む」→ キャッシュだけに書くのはライトバックなので×。
  2. イ：「ライトスルーでは両方に同時に書き込むので、主記憶の内容は常にキャッシュと一致する」→ ライトスルーの説明として○。
  3. ウ：「ライトバックでは両方に同時に書き込む」→ 両方に書くのはライトスルーなので×。
  4. エ：「ライトバックでは、追い出されるときに主記憶へ書き戻す必要がない」→ 追い出されるときこそ書き戻す必要があるので×。
  5. 正解は<b>イ</b>です。
choices:
  ア: キャッシュだけに書き込んで高速に書き込めるのは、<b>ライトバック方式</b>の特徴です。ライトスルー方式ではありません。誤り。
  イ: ライトスルー方式では、キャッシュと主記憶の両方に同時に書き込むので、主記憶の内容は常にキャッシュの内容と一致します。<b>正解</b>。
  ウ: 両方に同時に書き込むので遅いのは、<b>ライトスルー方式</b>の特徴です。ライトバック方式ではありません。誤り。
  エ: ライトバック方式では、書き換えられたデータがキャッシュから追い出されるときに、主記憶に書き戻す<b>必要があります</b>。そうしないと変更が失われます。誤り。
example: |
  手帳（キャッシュ）と家の大きなカレンダー（主記憶）で予定を管理するとき、
  - ライトスルー：手帳に書くたびに、すぐカレンダーにも書く。両方いつも同じ内容。
  - ライトバック：手帳にだけ書いておき、手帳のページを破って捨てるとき（追い出し）にカレンダーへ書き写す。書き写さずに捨てると予定が消えてしまう。
review:
  - ライトスルー＝毎回キャッシュと主記憶の両方に書く（常に一致・書込みは遅め）。
  - ライトバック＝キャッシュだけに書き、追い出し時に主記憶へ書き戻す（高速・一時的に不一致）。
