q: 67
answer: ウ
category: 経営戦略マネジメント
theme: |
  複数の事業への資源配分を考える分析手法「PPM（プロダクトポートフォリオマネジメント）」で、他の事業への投資資金を生み出す役割の事業（金のなる木）を選ぶ問題です。
basics: |
  <b>PPM</b>：自社の事業や製品を、<b>市場成長率</b>（縦軸）と<b>相対的市場占有率</b>（横軸、シェア）の2軸で4つに分類し、どこにお金を使い、どこからお金を得るかを考える手法です。
  | 花形（スター）：成長率 高・シェア 高 → 利益は大きいが、競争維持にも投資が必要
  | 問題児：成長率 高・シェア 低 → 投資が必要。育てれば花形に、失敗すれば負け犬に
  | 金のなる木：成長率 低・シェア 高 → 投資をあまり必要とせず、安定して大きな資金を生む
  | 負け犬：成長率 低・シェア 低 → 撤退・縮小を検討
  ポイント：市場の成長率が<b>低い</b>と、新たな設備投資や広告競争の必要が少なく、シェアが<b>高い</b>と、大量生産で効率よく利益を上げられます。
reasoning: |
  1. 投資用の資金源になるのは、「稼ぐ力が大きく、その割に投資が少なくて済む」事業です。
  2. それは、シェアが高く（稼げる）、市場成長率が低い（追加投資が少ない）<b>金のなる木</b>です。
  3. 金のなる木で得た資金を、問題児や花形の事業に投資するのが、PPMの基本的な考え方です。
  4. 正解は<b>ウ</b>です。
choices:
  ア: 市場成長率が高く、シェアも高いのは<b>花形</b>です。稼ぐ力は大きいものの、成長市場でシェアを守るための投資も大きく、資金源とは位置付けられません。誤り。
  イ: 市場成長率が高く、シェアが低いのは<b>問題児</b>です。シェアを伸ばすために多くの投資が必要で、資金を生む側ではなく使う側です。誤り。
  ウ: 市場成長率が低く、シェアが高いのは<b>金のなる木</b>で、投資用の資金源と位置付けられます。<b>正解</b>。
  エ: 市場成長率が低く、シェアも低いのは<b>負け犬</b>で、撤退や縮小を検討する事業です。誤り。
example: |
  文房具メーカーで考えると、定番の鉛筆（市場は伸びないが国内シェア1位）は、宣伝しなくても売れ続ける「金のなる木」です。そこで稼いだお金を、伸び盛りだがまだシェアの低い電子文具（問題児）の開発に投資します。
review:
  - PPMの4分類：花形（高成長・高シェア）、問題児（高成長・低シェア）、金のなる木（低成長・高シェア）、負け犬（低成長・低シェア）。
  - 投資の資金源＝金のなる木。その資金を問題児・花形へ投資する。
