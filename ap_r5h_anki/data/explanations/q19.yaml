q: 19
answer: エ
category: アルゴリズムとプログラミング
theme: |
  ハッシュ表でデータを探すときの時間が、表のデータ数によってどう変わるかを、グラフで選ぶ問題です。
basics: |
  <b>ハッシュ表</b>：キー（例：会員番号）を<b>ハッシュ関数</b>で計算し、その結果を格納場所の番号として使う表です。探すときも同じ計算をすれば、格納場所が<b>一発で</b>分かります。
  <b>衝突（シノニム）</b>：異なるデータが同じハッシュ値になること。衝突があると、同じ場所に入ったデータを順に調べる必要があり、探索時間が延びます。この問題では「衝突しない」と仮定しています。

  データ数 n と探索時間の関係（代表例）
  | 線形探索：n に比例して増える（直線）
  | 2分探索：log n に比例して、ゆるやかに増える
  | ハッシュ表（衝突なし）：n に関係なく<b>一定</b>
reasoning: |
  1. 衝突がなければ、どのデータもハッシュ関数を1回計算するだけで格納場所が決まります。
  2. ハッシュ関数の計算時間は、表に何個データが入っているかとは関係ありません。
  3. したがって、データ1個当たりの探索時間は、データ数によらず<b>一定</b>です。グラフは横軸に平行な直線になります。
  4. 正解は<b>エ</b>です。
choices:
  ア: データ数が増えるほど急激に探索時間が増えるグラフで、ハッシュ表（衝突なし）の性質ではありません。誤り。
  イ: データ数に比例して探索時間が増える直線のグラフで、<b>線形探索</b>の性質です。誤り。
  ウ: 最初は大きく増え、だんだん増え方がゆるやかになるグラフで、<b>2分探索</b>（log n）に近い性質です。誤り。
  エ: データ数に関係なく探索時間が一定のグラフで、衝突のないハッシュ表の性質です。<b>正解</b>。
example: |
  ロッカーの番号が会員番号から計算で決まっていれば、会員が10人でも1万人でも、自分のロッカーへはまっすぐ行けます。名簿を先頭から探す（線形探索）と、人数が増えるほど時間がかかります。
review:
  - 衝突のないハッシュ表の探索時間は、データ数によらず一定（O(1)）。
  - 線形探索は n に比例（直線）、2分探索は log n（ゆるやかに増加）と、グラフの形で区別する。
