q: 55
answer: ア
category: サービスマネジメント
theme: |
  サービスマネジメントシステム（SMS）の用語「是正処置」の意味を、構成管理・継続的改善・問題管理の説明と区別する問題です。
basics: |
  <b>不適合</b>：要求事項（規格やルール、合意したサービスレベルなど）を満たしていないことです。
  サービスマネジメント（JIS Q 20000など）の主な用語
  - <b>是正処置</b>：検出された不適合や、その他の望ましくない状況の<b>原因を除去</b>し、<b>再発の起こりやすさを低減</b>するための処置。「同じことを二度と起こさない」ための対策です。（参考：起きたこと自体を直すのは「修正」。）
  - <b>継続的改善</b>：パフォーマンスを向上するために繰り返し行われる活動。
  - <b>構成管理</b>：サービスを構成する要素（構成品目）の情報を管理し、変更に合わせて構成情報を更新する活動。
  - <b>問題管理</b>：問題（インシデントの根本原因）を記録・分類し、優先度を付け、必要ならエスカレーションし、可能なら解決する一連の活動。
reasoning: |
  1. 是正処置は「不適合や望ましくない状況の原因を除去し、再発を防ぐ（起こりやすさを下げる）」処置です。
  2. 正解は<b>ア</b>です。
choices:
  ア: 検出された不適合や望ましくない状況の原因を除去する、または再発の起こりやすさを低減するための処置は、<b>是正処置</b>です。<b>正解</b>。
  イ: 構成品目の変更の展開に伴って構成情報を更新するのは、<b>構成管理</b>の活動です。誤り。
  ウ: パフォーマンスを向上するために繰り返し行われる活動で、SMSとサービスの適切性・妥当性・有効性を継続的に改善するのは、<b>継続的改善</b>です。誤り。
  エ: 問題を記録・分類し、優先度付けし、必要ならエスカレーションし、可能なら解決する一連の活動は、<b>問題管理</b>です。誤り。
example: |
  お店で「お客様に間違った商品を渡した」というミス（不適合）があったとき、正しい商品に交換するのが修正、ミスの原因（似た商品が隣に並んでいた）を調べて陳列を変え、二度と起きないようにするのが是正処置です。
review:
  - 是正処置＝不適合の原因を除去し、再発を防止（起こりやすさを低減）する処置。起きたことを直す「修正」と区別する。
  - 継続的改善（繰り返しの改善活動）、構成管理（構成情報の更新）、問題管理（根本原因の記録・解決）と区別する。
