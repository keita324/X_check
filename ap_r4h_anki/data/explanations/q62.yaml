q: 62
answer: エ
category: システム戦略
theme: |
  業務システムを独立した部品（サービス）の組合せとして作る考え方「SOA（サービス指向アーキテクチャ）」の説明を、ERP・フィットギャップ分析・BPMと区別する問題です。
basics: |
  <b>SOA（Service Oriented Architecture：サービス指向アーキテクチャ）</b>：業務システムの機能を、利用者（業務）の視点で意味のあるまとまり＝<b>サービス</b>（例：「在庫を確認する」「受注を登録する」）に分け、それらを<b>独立した部品</b>として作り、組み合わせてシステムを構築する考え方です。
  - 業務プロセスの各手順とサービスが対応するので、業務の変更に合わせてサービスを組み替えやすい。
  - 標準的な方法でサービスを呼び出せるので、他のソフトウェアとの連携や再利用がしやすい。

  関連用語
  - <b>ERP</b>：会計・人事・製造・販売などの基幹業務を一元管理し、経営資源の全体最適を図る手法（そのためのパッケージ）。
  - <b>フィットギャップ分析</b>：自社の業務ニーズとパッケージの機能がどれだけ合う（フィット）か、ずれる（ギャップ）かを分析する手法。
  - <b>BPM</b>：業務プロセスに、計画・実行・評価・改善のサイクルを適用して継続的に改善する手法。
reasoning: |
  1. SOAのキーワードは「利用者の視点」「機能を独立した部品（サービス）に分ける」「業務プロセスとの対応付け」「他ソフトウェアとの連携が容易」です。
  2. これをすべて述べているのは<b>エ</b>です。
choices:
  ア: 会計、人事、製造、購買、在庫管理、販売などの業務プロセスを一元管理し、経営資源の全体最適を図るのは<b>ERP</b>です。誤り。
  イ: 業務プロセスやシステム化要求と、ソフトウェアパッケージの機能の適合度・かい離を分析するのは<b>フィットギャップ分析</b>です。誤り。
  ウ: 業務プロセスの問題点を洗い出し、目標設定・実行・チェック・修正行動のサイクルで継続的に改善するのは<b>BPM（ビジネスプロセスマネジメント）</b>です。誤り。
  エ: 利用者の視点から業務システムの機能を独立した部品に分け、業務プロセスとの対応付けや他ソフトウェアとの連携を容易にするのは<b>SOA</b>です。<b>正解</b>。
example: |
  SOAは、レゴブロックで業務システムを作るようなものです。「顧客を検索する」「請求書を作る」「在庫を引き当てる」といったブロック（サービス）を用意しておけば、新しい業務が始まっても、ブロックを組み替えるだけで対応でき、他社のブロックともつなぎやすくなります。
review:
  - SOA＝業務システムの機能を、利用者視点の独立したサービス（部品）に分け、組み合わせて構築する考え方。業務との対応付けや連携が容易。
  - ERP（基幹業務の一元管理）、フィットギャップ分析（パッケージとの適合度）、BPM（業務の継続的改善）と区別する。
