q: 57
answer: イ
category: サービスマネジメント
theme: |
  フルバックアップと差分バックアップを組み合わせた運用で、障害からの復旧手順やバックアップ時間の特徴を正しく理解しているかを問う問題です。
basics: |
  バックアップの主な方式
  - <b>フルバックアップ</b>：対象のデータを<b>すべて</b>バックアップする。時間はかかるが、それ1つで復元できる。
  - <b>差分バックアップ</b>：<b>最後のフルバックアップ以降に変更された部分</b>をすべてバックアップする。毎回フルより少ない量なので短時間で済むが、日数がたつと差分の量はだんだん増える。
  - <b>増分バックアップ</b>（参考）：<b>前回のバックアップ（フルでも増分でも）以降</b>に変更された部分だけをバックアップする。
  <b>差分バックアップからの復旧手順</b>
  | ① 最後のフルバックアップを復元する
  | ② その後の最新の差分バックアップを1つ反映する
  差分だけでは、変更されていない部分のデータがないので復元できません。
reasoning: |
  1. ア：差分バックアップのデータだけでは復旧できず、フルバックアップの復元が必要です。フルバックアップ単独からの復旧より手順が増え、復旧時間は短くなりません → ×。
  2. イ：フルバックアップのデータで復元した後に、差分バックアップのデータを反映させて復旧する → 正しい手順 → ○。
  3. ウ：フルバックアップと差分バックアップは、週1回フル＋毎日差分、のように<b>併用するのが一般的</b>です → ×。
  4. エ：差分バックアップは変更部分だけなので、フルバックアップより<b>バックアップに要する時間は短い</b>です → ×。
  5. 正解は<b>イ</b>です。
choices:
  ア: 差分バックアップのデータだけでは復旧できず、フルバックアップを復元した上で差分を反映する必要があります。毎回フルバックアップを取る方式と比べて、復旧時間は長くなります。誤り。
  イ: フルバックアップのデータで復元した後に、差分バックアップのデータを反映させて復旧します。<b>正解</b>。
  ウ: フルバックアップ方式と差分バックアップ方式は、組み合わせて運用するのが一般的です。誤り。
  エ: 差分バックアップは、最後のフルバックアップ以降の変更部分だけを保存するので、フルバックアップよりバックアップに要する時間は短くなります。誤り。
example: |
  日記帳を週に1回まるごとコピー（フル）し、毎日は「日曜のコピー以降に書き足したページ」だけをコピー（差分）するとします。木曜に日記帳をなくしたら、日曜のコピーを用意し、水曜分の差分コピーを付け足せば元どおりになります。
review:
  - 差分バックアップの復旧＝フルバックアップを復元＋最新の差分を1つ反映。差分だけでは復旧できない。
  - 差分はフルよりバックアップ時間が短く、復旧はフル単独より手順が増える。増分（前回以降の変更のみ）との違いも押さえる。
