q: 75
answer: ウ
category: 企業活動
theme: |
  デシジョンツリー（決定木）を使って、2つのマーケティング施策の利益の期待値を計算し、最も有利な施策を選ぶ問題です。
basics: |
  <b>デシジョンツリー</b>：意思決定の選択肢と、その後に起こり得る出来事を木の枝のように描いた図です。
  - <b>□（意思決定の分岐点）</b>：自分で選べる分かれ道。期待値が大きい方を<b>選ぶ</b>。
  - <b>○（発生し得る可能性の分岐点）</b>：確率で起こる分かれ道。各結果に確率を掛けて足し合わせ、<b>期待値</b>を求める。
  <b>期待値</b>：起こり得る結果の値に、それぞれの確率を掛けて合計したもの（平均的に見込める値）。
  計算は、<b>木の右端（結果）から左へ</b>さかのぼって行います。費用は、その枝を選んだときに差し引きます。
  | 利益増加額 ＝ 売上増加額 − 費用
reasoning: |
  <b>施策a</b>（初期費用30億円）
  | 確率0.4の枝の先の□：追加費用60億円をかける場合
  | 　○の期待値：0.3×200 ＋ 0.7×100 ＝ 60 ＋ 70 ＝ 130 → 130 − 60 ＝ 70
  | 　追加費用なしの場合：50
  | 　→ 大きい方の70を選ぶ
  | 最初の○の期待値：0.4×70 ＋ 0.6×120 ＝ 28 ＋ 72 ＝ 100
  | 施策aの利益増加額の期待値：100 − 30 ＝ <b>70億円</b>
  <b>施策b</b>（初期費用40億円）
  | 確率0.3の枝の先の□：追加費用40億円をかける場合
  | 　○の期待値：0.4×150 ＋ 0.6×100 ＝ 60 ＋ 60 ＝ 120 → 120 − 40 ＝ 80
  | 　追加費用なしの場合：70
  | 　→ 大きい方の80を選ぶ
  | 最初の○の期待値：0.3×80 ＋ 0.7×140 ＝ 24 ＋ 98 ＝ 122
  | 施策bの利益増加額の期待値：122 − 40 ＝ <b>82億円</b>
  期待値が大きいのは施策b（82億円）です。正解は<b>ウ</b>です。
choices:
  ア: 施策aの期待値70億円は正しく計算された値ですが、施策bの82億円の方が大きいので、最大の施策ではありません。誤り。
  イ: 施策aで160億円という期待値は、上の計算結果（70億円）と一致しません。誤り。
  ウ: 施策b、期待値82億円。2つの施策のうち利益増加額の期待値が最大です。<b>正解</b>。
  エ: 162億円は、施策bの売上の期待値122億円に初期費用40億円を「足して」しまった値です。費用は差し引く必要があります。誤り。
example: |
  「お祭りに屋台を出すか」を考えるとき、晴れの確率と雨の確率、それぞれの売上を見積もり、途中で「人が多ければ追加で材料を仕入れるか」も選べるとします。右端の結果から順に計算し、選べる分岐では得な方を選び、最後に出店料を引くと、どちらの屋台が得かが分かります。
review:
  - デシジョンツリーは右端から左へ計算する。○は「確率×値」の合計（期待値）、□は大きい方を選ぶ。
  - 追加費用・初期費用は、その枝を選んだ時点で差し引く（足さない）。
