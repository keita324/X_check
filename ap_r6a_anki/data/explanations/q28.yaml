q: 28
answer: ウ
category: データベース
theme: |
  3つの表の項目（列）から、どの情報が得られ、どの情報が得られないかを判断する問題です。表を結び付けるキーと、各表がもっている項目に注目します。
basics: |
  関係データベースでは、共通の項目（顧客IDなど）で表どうしを結び付け（結合）、情報を組み合わせて分析します。ただし、<b>どの表にも存在しない項目の情報は得られません</b>。
  3つの表の項目
  | 顧客：顧客ID、氏名、性別、生年月日
  | 販売代理店別日別販売：販売代理店ID、<b>日付</b>、商品ID、販売数量
  | 商品購入：顧客ID、販売代理店ID、商品ID、購入数量（<b>日付がない</b>）
  ポイント：「誰が買ったか（顧客ID）」が分かるのは商品購入表だけですが、この表には<b>日付がありません</b>。一方、日付がある販売代理店別日別販売表には、<b>誰が買ったか（顧客ID）がありません</b>。
reasoning: |
  各情報が得られるかを確認します。
  1. ア：商品ごとの販売数量の日別差異 → 販売代理店別日別販売表に「日付・商品ID・販売数量」があるので<b>得られる</b>。
  2. イ：性別ごとの売れ筋商品 → 商品購入表と顧客表を顧客IDで結合すれば、性別ごとの商品の購入数量が分かるので<b>得られる</b>。
  3. ウ：販売代理店ごとの購入者数の日別差異 → 購入者（顧客ID）が分かる商品購入表には日付がなく、日付がある表には購入者が分からないので、<b>得られない</b>。
  4. エ：販売代理店ごとの売れ筋商品 → 販売代理店別日別販売表（または商品購入表）の販売代理店IDと商品ID・数量から<b>得られる</b>。
  5. 得ることのできない情報は<b>ウ</b>です。
choices:
  ア: 販売代理店別日別販売表に日付・商品ID・販売数量があるので、商品ごとの販売数量の日別差異は得られます。誤り。
  イ: 商品購入表と顧客表を顧客IDで結合すれば、性別ごとに商品の購入数量を集計でき、性別ごとの売れ筋商品が得られます。誤り。
  ウ: 購入者を表す顧客IDは商品購入表にしかなく、その表には日付がないため、販売代理店ごとの購入者数を日別に比較することはできません。<b>正解</b>（得られない情報）。
  エ: 販売代理店IDと商品ID、数量があるので、販売代理店ごとの売れ筋商品は得られます。誤り。
example: |
  お店の記録が「日ごとの商品別の売上個数」（日付あり・客不明）と「会員ごとの購入記録」（客あり・日付なし）の2冊に分かれていると、「月曜日に何人の会員が買い物に来たか」は、どちらの記録からも分かりません。日付と会員の両方が載った記録が必要です。
review:
  - 必要な項目（ここでは「購入者」と「日付」）が、同じ表にあるか、結合できる表にそろっているかを確認する。
  - 結合は共通の項目（顧客ID、販売代理店IDなど）でしかできない。日付のように片方の表にしかない項目の組合せには注意する。
