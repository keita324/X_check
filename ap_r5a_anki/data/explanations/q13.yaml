q: 13
answer: イ
category: システム構成要素
theme: |
  サーバの台数を増やして性能を上げる「スケールアウト」が、どんな性質のシステムに向いているかを判断する問題です。
basics: |
  性能を上げる方法は2つあります。
  - <b>スケールアウト</b>：サーバの<b>台数を増やし</b>、処理を分散させる。処理を分けて並列に実行しやすいシステムに向く。
  - <b>スケールアップ</b>：1台のサーバの<b>性能（CPU、メモリなど）を上げる</b>。処理を分割しにくいシステムや、データの整合性を1か所で保ちたいシステムに向く。

  <b>参照系と更新系</b>
  - 参照系トランザクション：データを読むだけ（検索・閲覧）。データを変えないので、同じデータを複数のサーバに置いて分散させても、整合性の問題が起きにくい。
  - 更新系トランザクション：データを追加・変更する。複数のサーバに分散すると、サーバ間でデータを一致させる手間（整合性を取るためのオーバーヘッド）が増える。
reasoning: |
  各選択肢がスケールアウトに向くかを考えます。
  1. ア：並列処理が困難な大きな処理 → 台数を増やしても分担できないので、スケールアップ向き。
  2. イ：参照系が多く、既に複数サーバで分散処理している → サーバを増やせばそのまま処理能力が上がるので、<b>スケールアウト向き</b>。
  3. ウ：データ追加（更新系）が多く、整合性のオーバーヘッドを小さくしたい → サーバを増やすと整合性を取る手間が増えるので、スケールアップ向き。
  4. エ：複数配置したマスターデータベースの整合性を保つ必要がある → 台数を増やすほど同期の負担が増えるので、スケールアウトには向かない。
  5. 正解は<b>イ</b>です。
choices:
  ア: 一連の大きな処理を一括で行う必要があり並列処理が困難なシステムでは、台数を増やしても処理を分担できないため、スケールアウトは適しません（スケールアップが適する）。誤り。
  イ: 参照系トランザクションが多く、複数のサーバで分散処理しているシステムは、サーバを追加して負荷を分散させやすいので、スケールアウトが適しています。<b>正解</b>。
  ウ: データを追加する更新系が多く、整合性を取るオーバーヘッドを小さくしたいシステムでは、サーバを増やすと整合性の手間が増えるため、スケールアウトは適しません。誤り。
  エ: 複数配置されたマスターデータベース間の整合性を保つ必要があるシステムでは、台数を増やすほど同期の負担が大きくなるため、スケールアウトは適しません。誤り。
example: |
  図書館の閲覧カウンター（参照系）は、同じ本のコピーを置いた窓口を増やせば、多くの人に対応できます（スケールアウト）。一方、1冊の台帳に全員の貸出記録を書き込む作業（更新系）は、窓口を増やすと台帳の内容を合わせる手間が増えるので、1人の職員の処理を速くする方が向いています（スケールアップ）。
review:
  - スケールアウトは、処理を分散しやすい参照系中心のシステムに向く。
  - 更新が多く整合性の維持が必要なシステムや、並列化が難しい処理は、スケールアップが向く。
