q: 34
answer: エ
category: ネットワーク
theme: |
  IPネットワークのプロトコルが、OSI基本参照モデルのどの層に当たるかを判断し、トランスポート層のものを選ぶ問題です。
basics: |
  <b>OSI基本参照モデル</b>：通信の機能を7つの層に分けたモデルです。主な層とプロトコルは次のとおりです。
  | 第7層 アプリケーション層：HTTP（Web）、SMTP（メール送信）、FTP、DNS など
  | 第4層 <b>トランスポート層</b>：<b>TCP</b>、<b>UDP</b>（通信の信頼性や、どのアプリ宛てかをポート番号で区別）
  | 第3層 ネットワーク層：IP、<b>ICMP</b>（宛先までの経路を決めて届ける。ICMPはエラー通知やping）
  | 第2層 データリンク層：イーサネット など
reasoning: |
  1. トランスポート層の代表的なプロトコルはTCPとUDPです。
  2. 選択肢の中では<b>UDP</b>がトランスポート層に位置します。
  3. 正解は<b>エ</b>です。
choices:
  ア: HTTPは、WebブラウザとWebサーバの間でやり取りするための<b>アプリケーション層</b>のプロトコルです。誤り。
  イ: ICMPは、エラーの通知や疎通確認（ping）に使う、IPと同じ<b>ネットワーク層</b>のプロトコルです。誤り。
  ウ: SMTPは、電子メールを送信・転送するための<b>アプリケーション層</b>のプロトコルです。誤り。
  エ: UDPは、コネクションレスで軽量な通信を行う<b>トランスポート層</b>のプロトコルです。<b>正解</b>。
example: |
  宅配便に例えると、アプリケーション層は「荷物の中身（Webページやメール）」、トランスポート層は「どの部屋宛てか（ポート番号）と配達方法（書留＝TCP、普通郵便＝UDP）」、ネットワーク層は「住所（IPアドレス）と配送ルート」です。
review:
  - トランスポート層＝TCP・UDP。ネットワーク層＝IP・ICMP。アプリケーション層＝HTTP・SMTP・FTP・DNS。
  - ICMPはネットワーク層である点（トランスポート層と混同しやすい）に注意する。
