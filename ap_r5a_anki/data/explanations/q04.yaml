q: 4
answer: ア
category: 基礎理論
theme: |
  データを正方形に並べて、行と列のそれぞれにパリティビットを付ける方式（水平垂直パリティ）で、何ビットまでの誤りを訂正できるかを問う問題です。
basics: |
  <b>パリティビット</b>：データの「1の個数」が偶数（または奇数）になるように付け加える検査用のビットです。図では、各行・各列の1の個数が偶数になるようにパリティビット（網掛け部分）が付いています（偶数パリティ）。
  受信側で1の個数を数え、偶数になっていなければ「その行（列）のどこかに誤りがある」と分かります。

  <b>水平垂直パリティ</b>：行（水平）と列（垂直）の両方にパリティを付ける方式です。
reasoning: |
  1. <b>1ビットの誤り</b>：あるビットが反転すると、そのビットを含む<b>行</b>と<b>列</b>のパリティがそれぞれ1つずつ合わなくなります。行と列の交点が誤りのビットだと特定できるので、反転させて訂正できます。
  2. <b>2ビットの誤り</b>：例えば同じ行の2ビットが反転すると、その行の1の個数の偶奇は変わらず、行のパリティでは検出できません。列のパリティは2つ合わなくなりますが、どの行にあるかが分からないので、場所を特定できません。違う行・違う列の2ビットの場合も、行2つ・列2つが合わなくなり、交点の候補が4つできて特定できません。
  3. よって、誤りを<b>訂正</b>できるのは<b>1ビットまで</b>です（2ビットの誤りは、多くの場合「誤りがあること」の検出までしかできません）。
  4. 正解は<b>ア</b>です。
choices:
  ア: 1ビット。誤ったビットは、合わなくなった行と列の交点として一意に特定できるので訂正できます。<b>正解</b>。
  イ: 2ビットの誤りでは、誤りの位置の候補が複数になる（または同じ行・列で打ち消し合う）ため、位置を特定できず訂正できません。誤り。
  ウ: 3ビットの誤りは、位置の特定がさらに困難で訂正できません。誤り。
  エ: 4ビットの誤りは、長方形の4隅の誤りのように、すべての行・列のパリティが合ってしまい、検出すらできない場合があります。誤り。
example: |
  クロスワードの縦と横のヒントのようなものです。「3行目がおかしい」「2列目がおかしい」と分かれば、間違いは3行2列のマス1つだと特定できます。間違いが2マス以上あると、「どの行のどの列か」の組合せが決まらなくなります。
review:
  - 水平垂直パリティは、1ビットの誤りを「行と列の交点」として特定し訂正できる。
  - 2ビット以上の誤りは位置を特定できず訂正できない（偶数個の誤りは同じ行・列で検出できないこともある）。
