q: 11
answer: ウ
category: コンピュータ構成要素
theme: |
  サーバとストレージを高速に接続するインタフェース「FC（ファイバチャネル）」の特徴を問う問題です。
basics: |
  <b>FC（ファイバチャネル）</b>：サーバとストレージ（ディスク装置）を高速・高信頼に接続するための規格で、SAN（ストレージ専用のネットワーク）でよく使われます。
  主な特徴
  - 名前に「ファイバ（光ファイバ）」とありますが、<b>光ケーブルだけでなく電気（銅線）ケーブルも使える</b>。
  - TCP/IPとは別の、<b>独自のプロトコル体系</b>（物理層から上位層まで）をもつ。SCSIのコマンドを運ぶのに使われる。
  - 接続形態（トポロジ）は、<b>1対1のポイントツーポイント</b>、<b>ループ（アービトレーテッドループ）</b>、<b>スイッチを使ったファブリック</b>の3種類がある。
  - 物理層もFC独自の規格で、昔の<b>パラレルSCSI</b>（幅の広いケーブルで並列に送る方式）を物理層に使うわけではない。
reasoning: |
  1. ア：FCはTCP/IPの上位層ではなく、独自のプロトコル体系です（FCをIP上で運ぶFCIPなどは別の規格）→ ×。
  2. イ：接続形態は、スイッチ（ファブリック）のほか、ポイントツーポイントやループもあるので「限られる」は誤り → ×。
  3. ウ：伝送媒体には電気ケーブル又は光ケーブルを使える → ○。
  4. エ：物理層はFC独自のシリアル伝送で、パラレルSCSIではない → ×。
  5. 正解は<b>ウ</b>です。
choices:
  ア: FCはTCP/IPの上位層として作られた規格ではなく、物理層から上位層までを独自に定めたプロトコル体系です。誤り。
  イ: FCの接続形態には、スイッチを使ったファブリックのほか、1対1のポイントツーポイントやループもあり、n対n接続に限られません。誤り。
  ウ: FCの伝送媒体には、電気（銅線）ケーブル又は光ケーブルを用いることができます。<b>正解</b>。
  エ: FCの物理層はFC独自のシリアル伝送の規格で、パラレルSCSIを用いるものではありません（SCSIのコマンドをFC上で運ぶことはあります）。誤り。
example: |
  FCは「ストレージ専用の高速道路」のようなものです。道路の舗装（伝送媒体）には、近距離なら安い銅線、長距離なら光ファイバと使い分けられ、2点を直結する道、環状道路、インターチェンジ（スイッチ）を使った道路網と、いろいろな形で作れます。
review:
  - FC＝ストレージ接続用の独自プロトコル体系。電気ケーブル・光ケーブルの両方を使える。
  - 接続形態はポイントツーポイント・ループ・ファブリック（スイッチ）。TCP/IPの上位層でもパラレルSCSIでもない。
