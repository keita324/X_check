q: 77
answer: ア
category: 企業活動
theme: |
  売上高・営業利益が同じ2社について、変動費と固定費の割合の違いから、限界利益率・損益分岐点・売上変動に対する利益の動き方を比較する問題です。
basics: |
  <b>変動費</b>：売上（生産量）に比例して増減する費用（材料費など）。
  <b>固定費</b>：売上に関係なく一定の費用（人件費、設備の減価償却費など）。
  <b>限界利益</b>＝売上高 − 変動費、<b>限界利益率</b>＝限界利益 ÷ 売上高。売上が1増えたときに利益がいくら増えるかの割合です。
  <b>損益分岐点売上高</b>＝固定費 ÷ 限界利益率。利益がちょうど0になる売上高です。
  固定費の割合が大きい会社は、限界利益率が高くなり、売上の増減が利益に大きく響きます（<b>営業レバレッジが大きい</b>）。
reasoning: |
  <b>① 限界利益率</b>
  | A社：(1,000 − 500) ÷ 1,000 ＝ <b>50%</b>
  | B社：(1,000 − 800) ÷ 1,000 ＝ <b>20%</b>
  <b>② 損益分岐点売上高</b>
  | A社：400 ÷ 0.5 ＝ <b>800億円</b>
  | B社：100 ÷ 0.2 ＝ <b>500億円</b>
  <b>③ 売上高が10%（100億円）変化したときの営業利益</b>
  | A社：100 × 50% ＝ 50億円増減 → 増加なら150億円、減少なら50億円
  | B社：100 × 20% ＝ 20億円増減 → 増加なら120億円、減少なら80億円
  A社は売上の増加が大きな利益に結び付きやすい（その反面、減少にも弱い）会社です。正解は<b>ア</b>です。
choices:
  ア: A社の限界利益率は50%でB社（20%）より高く、売上高が増えると利益が大きく増えます。<b>正解</b>。
  イ: A社の限界利益率は50%で、B社の20%より高いので、「低い」は誤りです。誤り。
  ウ: A社の損益分岐点売上高は800億円で、B社の500億円より高いので、「低い」は誤りです。誤り。
  エ: A社は限界利益率が高く損益分岐点も高いため、売上高が減ると利益が大きく減り、不況抵抗力は弱いといえます。記述は逆です。誤り。
example: |
  家賃の高い大型店（固定費が大きいA社タイプ）は、お客さんが増えれば1人当たりの儲けが大きいので大きく稼げますが、お客さんが減ると家賃が重くのしかかり、すぐ赤字になります。仕入れ中心の小さな店（変動費が大きいB社タイプ）は、儲けの伸びは小さいものの、不況でも赤字になりにくいのです。
review:
  - 限界利益率＝(売上高−変動費)÷売上高、損益分岐点売上高＝固定費÷限界利益率。
  - 固定費が大きく限界利益率が高い会社は、売上増で利益が伸びやすい反面、損益分岐点が高く不況に弱い。
