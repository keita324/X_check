q: 46
answer: エ
category: システム開発技術
theme: |
  プログラムの部品（モジュール）同士の結び付きの強さ「モジュール結合度」の種類を理解し、最も独立性が高い（結合度が低い）ものを選ぶ問題です。
basics: |
  <b>モジュール</b>：プログラムを機能ごとに分けた部品です。
  <b>モジュール結合度</b>：モジュール同士がどれだけ強く依存し合っているかを表す尺度です。結合度が<b>低い</b>ほど、一方を修正しても他方に影響しにくく、<b>独立性が高い</b>良い設計です。

  結合度の強い順（悪い順）
  | 内容結合 ＞ 共通結合 ＞ 外部結合 ＞ 制御結合 ＞ スタンプ結合 ＞ データ結合
  - <b>内容結合</b>：他のモジュールの内部を直接参照・変更する。
  - <b>共通結合</b>：複数のモジュールが、共通の大域データ（データ構造）を共有する。
  - <b>外部結合</b>：複数のモジュールが、外部宣言された単一のデータを共有する。
  - <b>制御結合</b>：処理の流れを切り替えるためのフラグなどを引数で渡す。
  - <b>スタンプ結合</b>：構造体などのデータ構造を丸ごと引数で渡し、その一部だけを使う。
  - <b>データ結合</b>：必要な単純なデータだけを引数で渡す。
reasoning: |
  1. 独立性が最も高い＝結合度が最も低い結合を選びます。
  2. 上の順序のとおり、最も結合度が低いのは、必要なデータ項目だけを引数でやり取りする<b>データ結合</b>です。
  3. 正解は<b>エ</b>です。
choices:
  ア: 外部結合は、外部宣言されたデータを複数モジュールで共有する結合で、比較的結合度が高い（独立性が低い）です。誤り。
  イ: 共通結合は、共通の大域データ構造を共有する結合で、内容結合に次いで結合度が高く、独立性は低いです。誤り。
  ウ: スタンプ結合は、データ構造を丸ごと受け渡す結合で、データ結合よりは結合度が高いです。誤り。
  エ: データ結合は、必要な単純データだけを引数で受け渡す、最も結合度が低く独立性が高い結合です。<b>正解</b>。
example: |
  同僚に仕事を頼むとき、「この3つの数字を足して」と必要な情報だけを渡す（データ結合）のが一番影響範囲が小さく、頼まれた側も他を気にせず作業できます。「ファイル一式を渡すから、必要なところを使って」（スタンプ結合）や、「みんなが共用している書類棚を直接書き換えて」（共通結合）となるほど、誰かの変更が他の人に影響しやすくなります。
review:
  - 結合度の順（強→弱）：内容＞共通＞外部＞制御＞スタンプ＞データ。データ結合が最も独立性が高い。
  - 「結合度が低い＝独立性が高い＝良い設計」の関係を押さえる。
