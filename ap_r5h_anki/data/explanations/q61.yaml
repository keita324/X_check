q: 61
answer: ア
category: システム戦略
theme: |
  IT投資の効果を評価する指標「ROI（投資利益率）」の意味を、ベンチマーキング・NPV・機会損失の考え方と区別する問題です。
basics: |
  <b>情報化投資</b>：業務システムの導入など、ITにお金をかけることです。投資する価値があるかを、いくつかの指標で評価します。
  - <b>ROI（Return On Investment：投資利益率）</b>：投資によって生み出された<b>利益額を、投資額で割った</b>もの。投資額に対してどれだけの利益が得られたかの割合です。
  | ROI ＝ 利益額 ÷ 投資額 × 100（%）
  - <b>NPV（正味現在価値）</b>：将来の現金の流入（キャッシュイン）と流出（キャッシュアウト）を現在の価値に割り引いて差し引いた金額。
  - <b>ベンチマーキング</b>：自社の指標（売上高に対するIT投資額の比率など）を他社と比較すること。
reasoning: |
  1. ROIは「投資に対するリターン（利益）の割合」です。
  2. 「売上増やコスト削減などによって創出された利益額を投資額で割ったもの」という<b>ア</b>が正解です。
  3. 例：1,000万円のシステム投資で、年間200万円のコスト削減（利益）が生まれれば、ROIは 200÷1,000＝20% です。
choices:
  ア: 売上増やコスト削減などによって創出された利益額を投資額で割ったものは、<b>ROI（投資利益率）</b>です。<b>正解</b>。
  イ: 売上高投資金額比や従業員当たりの投資金額などを他社と比較するのは、<b>ベンチマーキング</b>（他社比較）の考え方です。誤り。
  ウ: 現金流入の現在価値から、現金流出の現在価値を差し引いたものは、<b>NPV（正味現在価値）</b>です。誤り。
  エ: プロジェクトを実施しない場合の市場での競争力を表すものは、投資しないことによる<b>機会損失</b>などを考える視点で、ROIではありません。誤り。
example: |
  100万円で業務を自動化するソフトを導入し、残業代が年間30万円減ったなら、ROIは30%です。同じ100万円を別の投資に回した場合のROIと比べて、どちらが効率よく利益を生むかを判断できます。
review:
  - ROI＝投資によって得られた利益額÷投資額（割合で表す）。
  - NPV（割り引いた現金の流入−流出の金額）、ベンチマーキング（他社比較）と区別する。
