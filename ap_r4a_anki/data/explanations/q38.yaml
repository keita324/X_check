q: 38
answer: ウ
theme: |
  デジタル証明書が失効（無効化）していないかを、オンラインでその場で問い合わせるためのプロトコル「OCSP」を選ぶ問題です。
basics: |
  <b>デジタル証明書</b>：「この公開鍵は確かにこのWebサイト（人）のものです」と、認証局（CA）が保証する電子的な身分証明書です。HTTPS通信などで使われます。
  <b>失効</b>：有効期限内でも、秘密鍵が漏えいした、会社が廃業した、などの理由で、認証局が証明書を途中で無効にすることです。運転免許証の「取消し」のようなものです。

  失効しているかを確認する方法は2つあります。
  - <b>CRL（証明書失効リスト）</b>：認証局が公開する「失効した証明書の一覧表」をダウンロードして調べる。
  - <b>OCSP（Online Certificate Status Protocol）</b>：「この証明書は有効ですか？」と、1枚ずつ<b>オンラインで</b>OCSPレスポンダ（応答サーバ）に問い合わせる。
reasoning: |
  1. 「失効しているかどうかをオンラインで確認するためのプロトコル」は、その名前（Online Certificate Status Protocol＝証明書の状態をオンラインで確かめるプロトコル）どおりOCSPです。
  2. 正解は<b>ウ</b>です。
choices:
  ア: CHAPは、パスワードをそのまま送らずに、チャレンジ（乱数）とレスポンスでユーザーを認証するプロトコル（PPPなどで使用）です。証明書の失効確認ではありません。誤り。
  イ: LDAPは、ユーザー情報などを管理するディレクトリサービスにアクセスするためのプロトコルです。CRLの配布に使われることはありますが、失効をオンラインで問い合わせるプロトコルそのものではありません。誤り。
  ウ: OCSPは、証明書の失効状態をオンラインで問い合わせるプロトコルです。<b>正解</b>。
  エ: SNMPは、ネットワーク機器の監視・管理のためのプロトコルです。誤り。
example: |
  お店でクレジットカードを使うとき、昔は「使用停止カードの一覧表」（CRL）と照らし合わせていましたが、今は端末からカード会社にオンラインで「このカードは使えますか？」と1枚ずつ問い合わせます（OCSP）。
review:
  - OCSP＝証明書の失効状態を1枚ずつオンラインで問い合わせる。CRL＝失効した証明書の一覧を取得して調べる。
  - CHAP（チャレンジレスポンス認証）、LDAP（ディレクトリアクセス）、SNMP（ネットワーク管理）の用途を区別する。
