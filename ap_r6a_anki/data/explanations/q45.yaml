q: 45
answer: イ
category: セキュリティ
theme: |
  1台のスイッチのポートをVLANで複数のセグメントに分けたときに得られるセキュリティ上の効果を問う問題です。VLANが何を分けるのかがポイントです。
basics: |
  <b>VLAN（仮想LAN）</b>：1台のスイッチの中を、論理的に複数のネットワーク（セグメント）に分ける機能です。スイッチのポートをグループ化して、グループごとに別のネットワークとして扱います。
  <b>ブロードキャスト</b>：同じネットワーク内の全員に一斉に送る通信です（ARPの問合せなど）。ブロードキャストが届く範囲を<b>ブロードキャストドメイン</b>と呼びます。
  VLANで分けると、
  - ブロードキャストは<b>同じVLAN内にしか届かなくなる</b>（ブロードキャストドメインが分割される）。
  - 他のVLANの機器に、IPアドレスやMACアドレスなどの情報が不要に流れなくなり、盗聴や探索のリスクを減らせる。
  - 異なるVLAN間の通信は、レイヤー3スイッチやルータを経由するので、そこでアクセス制御もできる。
  VLANは「ネットワークを分ける」機能で、ICMPの遮断や、MACアドレス・IPアドレスによる接続制限は、それぞれ別の機能です。
reasoning: |
  1. VLANでセグメントを分けたときの効果は、ブロードキャストパケットの到達範囲が同じセグメント内に制限されることです。
  2. これにより、アドレス情報などが他のセグメントへ不要に流出するリスクを減らせます。
  3. 正解は<b>イ</b>です。
choices:
  ア: VLANで分けても、同じセグメント内のICMPパケットまで全て遮断するわけではありません。ICMPの遮断はフィルタリングの設定による別の機能です。誤り。
  イ: VLANでセグメントを分けると、PCからのブロードキャストパケットの到達範囲が制限され、アドレス情報の不要な流出のリスクを低減できます。<b>正解</b>。
  ウ: MACアドレスで接続の可否を判別するのは、<b>MACアドレス認証（MACアドレスフィルタリング）</b>の機能で、VLANでポートを分けることによる効果ではありません。誤り。
  エ: 物理ポートごとに決まったIPアドレスの接続だけを許可するのは、ポートセキュリティやIPアドレスによるアクセス制御の機能で、VLANでセグメントを分けることによる効果ではありません。誤り。
example: |
  1つの大部屋（スイッチ）にパーティションを立てて、部署ごとの区画（VLAN）に分けるイメージです。区画の中で大声で呼びかけ（ブロードキャスト）ても、他の区画には聞こえなくなるので、余計な情報が他部署に漏れにくくなります。
review:
  - VLANでセグメントを分けると、ブロードキャストドメインが分割され、アドレス情報などの不要な流出を減らせる。
  - ICMPの遮断、MACアドレス認証、ポートごとのIPアドレス制限は、VLANとは別の機能。
