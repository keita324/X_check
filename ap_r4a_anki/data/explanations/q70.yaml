q: 70
answer: エ
theme: |
  企業が自社のサービスの機能を「API」として外部に公開し、他社のサービスと組み合わせて新しい価値を生み出す「APIエコノミー」の事例を選ぶ問題です。
basics: |
  <b>API（Application Programming Interface）</b>：あるソフトウェアの機能やデータを、別のソフトウェアから呼び出して使えるようにするための窓口（決められた呼び出し方）です。
  <b>APIエコノミー</b>：企業が自社サービスのAPIを<b>外部（他社）に公開</b>し、他の企業がそれを自社のサービスに組み込むことで、企業の枠を超えたサービスの連携が広がり、新たな価値やビジネス（経済圏）が生まれることです。
  例：地図サービスのAPIを使った店舗検索、決済サービスのAPIを使ったネットショップ、SNSのAPIを使ったログイン機能など。

  <b>EAI</b>：社内の複数のシステムを連携・統合するためのツールや仕組み。
  <b>BIツール</b>：社内のデータを集計・分析・可視化するツール。
reasoning: |
  1. APIエコノミーのポイントは「<b>他社が公開しているAPI</b>を使う（または自社のAPIを他社に公開する）」ことで、<b>企業の枠を超えて</b>サービスがつながることです。
  2. エは、ホテル事業者が<b>他社</b>のタクシー配車アプリの公開APIを自社アプリに組み込み、宿泊客にタクシー配車という新しいサービスを提供しています。これがAPIエコノミーの典型例です。
  3. ア・イ・ウは、いずれも自社内（学内・社内）でのAPI活用やツール利用にとどまっています。
  4. 正解は<b>エ</b>です。
choices:
  ア: 学内データベースのAPIとEAIツールで、大学<b>内部</b>の業務システムを再構築した事例です。企業（組織）の枠を超えたサービス連携ではないので、APIエコノミーの事例とはいえません。誤り。
  イ: 自部門で開発したAPIを<b>自社内</b>の他部署に提供しただけで、社外に公開して新たな経済圏を生むものではありません。誤り。
  ウ: 自社の顧客データをBIツールで可視化・分析した事例で、社内のデータ分析です。APIエコノミーの事例ではありません。誤り。
  エ: ホテル事業者が、他社が公開しているタクシー配車アプリのAPIを自社アプリに組み込み、サービスを提供した。企業の枠を超えたAPI連携で、<b>APIエコノミー</b>の事例です。<b>正解</b>。
example: |
  グルメサイトのお店のページに、地図会社の地図が表示され、そのまま予約サービスで席を予約し、決済会社のサービスで支払いができる…。1つのアプリの中で、何社ものサービスがAPIでつながっています。このように、各社の得意な機能を部品として組み合わせ、新しい便利さを生む仕組みがAPIエコノミーです。
review:
  - APIエコノミー＝APIを外部に公開・利用し、企業の枠を超えたサービス連携で新たな価値を生むこと。
  - 社内だけのAPI活用、EAI（社内システム統合）、BI（社内データ分析）はAPIエコノミーの事例ではない。
