q: 3
answer: ア
theme: |
  抜取検査（全部ではなく一部だけを調べて全体の合否を決める検査）で、不良品を含むロットが「合格」と判定されてしまう確率を求める問題です。
basics: |
  <b>ロット</b>：同じ条件でまとめて生産した製品のかたまり。ここでは100個で1ロットです。
  <b>確率</b>：「起こり得る全体」のうち「その事象が起こる場合」の割合です。100個中90個が良品なら、1個取り出して良品の確率は 90/100 です。

  <b>「戻さない」抽出（非復元抽出）</b>：抜き出したサンプルは元に戻しません。そのため、2個目を取るときは残りが99個、3個目は98個になり、良品の数も1個ずつ減ります。
  <b>「かつ」の確率は掛け算</b>：「1個目が良品」かつ「2個目も良品」かつ「3個目も良品」の確率は、それぞれの確率を順に掛けて求めます。
reasoning: |
  1. 条件整理：全体100個、不良品10個、良品90個。3個取り出し、3個とも良品なら合格。
  2. 1個目が良品：90/100
  3. 2個目が良品（残り99個のうち良品89個）：89/99
  4. 3個目が良品（残り98個のうち良品88個）：88/98
  5. 掛け合わせます。約分しながら計算すると楽です。
  | 90/100 × 89/99 × 88/98
  | = (9/10) × (89/99) × (44/49)
  | 9/99 = 1/11 なので = (1/10) × (89/11) × (44/49)
  | 44/11 = 4 なので = 89 × 4 / (10 × 49) = 356/490 = <b>178/245</b>
  6. 選択肢<b>ア</b>と一致します（約0.727、つまり約73%）。
choices:
  ア: 178/245。上記の計算結果と一致します。<b>正解</b>。
  イ: 405/539（約0.751）。正しい値178/245（約0.727）と一致しません。分母539=11×49は途中計算に出てくる数なので、約分や掛け算の途中で間違えるとこの形になりやすい、ひっかけの値です。誤り。
  ウ: 89/110。90/100×89/99 ＝ 89/110 で、<b>2個目まで</b>しか掛けていない値です。3個目の 88/98 を掛け忘れています。誤り。
  エ: 87/97（約0.897）。1回分の確率（約0.9）に近い値で、3回連続で良品を引く確率にしては大きすぎます。3回とも良品である確率は、1回分の確率より必ず小さくなります。誤り。
example: |
  トランプで考えると分かりやすいです。52枚からハートを引く確率は13/52ですが、引いたカードを戻さずにもう1枚ハートを引く確率は12/51です。枚数も当たりの数も1つずつ減る点が、この問題と同じです。
review:
  - 「戻さない抽出」では分母・分子が1ずつ減る（90/100→89/99→88/98）ことを理解する。
  - 「AかつBかつC」の確率は掛け算で求める。
  - 2個目までで止めた値（89/110＝ウ）がひっかけになっていることを覚えておく。
