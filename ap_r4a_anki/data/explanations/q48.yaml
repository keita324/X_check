q: 48
answer: イ
theme: |
  流れ図と2つのテストケースから、テストの網羅率（カバレッジ）を「命令網羅（C0）」と「分岐網羅（C1）」の2つの基準で計算する問題です。
basics: |
  <b>テストカバレッジ（網羅率）</b>：プログラムのうち、テストで実際に通った部分の割合です。
  - <b>C0（命令網羅）</b>：すべての<b>命令</b>のうち、1回以上実行された命令の割合。
  - <b>C1（分岐網羅）</b>：すべての<b>分岐の行き先</b>（各判定のYesとNo）のうち、1回以上通った行き先の割合。判定が5つあれば、行き先は 5×2＝10通りです。

  流れ図の判定（ひし形）は5つ、命令は1〜5の5つです。
reasoning: |
  <b>(1) テストケース1（V〜Zすべて0）の通り道</b>
  | 判定①V=0 → Yes → 命令1
  | 判定②(W=0 and X=0) → Yes → 命令2
  | 判定④(Y=0 and Z=0) → Yes → 命令4
  <b>(2) テストケース2（V〜Zすべて1）の通り道</b>
  | 判定①V=0 → No
  | 判定②(W=0 and X=0) → No → 判定③(W≠0 and X≠0) → Yes → 命令3
  | 判定④(Y=0 and Z=0) → No → 判定⑤(Y≠0 and Z≠0) → Yes → 命令5

  <b>(3) C0（命令網羅）</b>
  命令1・2・4（ケース1）と命令3・5（ケース2）で、5つすべてが実行されました。
  | C0 ＝ 5 ÷ 5 ＝ <b>100%</b>

  <b>(4) C1（分岐網羅）</b>
  | 判定①：Yes○ No○
  | 判定②：Yes○ No○
  | 判定③：Yes○ No×（WとXの片方だけ0のケースがない）
  | 判定④：Yes○ No○
  | 判定⑤：Yes○ No×（YとZの片方だけ0のケースがない）
  | 通った行き先 8個 ÷ 全10個 ＝ <b>80%</b>

  C0＝100%、C1＝80%の組合せは<b>イ</b>です。
choices:
  ア: C0もC1も100%にするには、判定③と⑤のNo（例：W=0でX=1のようなケース）を通るテストケースが必要です。今回の2ケースでは通らないので誤り。
  イ: C0＝100%（命令5つすべて実行）、C1＝80%（10の行き先のうち8つ）。<b>正解</b>。
  ウ: C0が80%になるのは命令が1つ実行されない場合ですが、実際は5つすべて実行されています。また、C1が100%ならすべての分岐を通るので、必ず全命令も実行されC0も100%になります（C1＞C0となることはない）。誤り。
  エ: C0は100%なので誤り。
example: |
  町内の道路点検に例えると、C0は「すべての家（命令）の前を一度は通ったか」、C1は「すべての交差点で、右にも左にも一度は曲がったか」です。家は全部回れても、曲がっていない道が残っていればC1は100%になりません。
review:
  - C0（命令網羅）＝全命令を1回以上実行、C1（分岐網羅）＝全判定のYes/Noを1回以上通過、と定義を区別する。
  - 判定の数×2が分岐の総数。どの判定のどちらに進んだかを表にして数える。
  - C1を100%にすると必ずC0も100%になる（逆は成り立たない）。
