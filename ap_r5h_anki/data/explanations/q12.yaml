q: 12
answer: ア
category: コンピュータ構成要素
theme: |
  ディスプレイの表示方式のうち、有機ELディスプレイの仕組みを、CRT・液晶・プラズマと区別する問題です。
basics: |
  代表的なディスプレイの表示方式
  - <b>有機EL（OLED）</b>：電圧をかけると<b>自ら発光する</b>有機化合物（発光素子）を使う。バックライトが不要なので、薄く、黒をはっきり表現でき、曲げられる画面も作れる。スマートフォンなどで使われる。
  - <b>CRT（ブラウン管）</b>：電子ビームを蛍光体に当てて光らせる。昔のテレビ。
  - <b>液晶（LCD）</b>：液晶は自分では光らず、背面のバックライトの光が<b>透過する量</b>を電圧で制御して表示する。
  - <b>プラズマ（PDP）</b>：ガスの放電で発生した紫外線を蛍光体に当てて光らせる。
reasoning: |
  1. 有機ELの特徴は「電圧をかけると自ら発光する素子で表示する」ことです（自発光型）。
  2. 「電圧をかけて発光素子を発光させて表示する」という<b>ア</b>が正解です。
choices:
  ア: 電圧をかけて発光素子を発光させて表示するのは、<b>有機ELディスプレイ</b>です。<b>正解</b>。
  イ: 電子ビームが発光体（蛍光体）に衝突して生じる発光で表示するのは、<b>CRT（ブラウン管）</b>です。誤り。
  ウ: 透過する光の量を制御して表示するのは、<b>液晶ディスプレイ</b>です。誤り。
  エ: 放電によって発生した紫外線で蛍光体を発光させて表示するのは、<b>プラズマディスプレイ</b>です。誤り。
example: |
  有機ELは「一つ一つが自分で光る小さな電球を並べた看板」、液晶は「後ろから照らした光をシャッターで通したり遮ったりする看板」のイメージです。有機ELは光らせない部分が完全に消えるので、真っ黒をきれいに表示できます。
review:
  - 有機EL＝電圧で自ら発光する素子（自発光、バックライト不要）。
  - CRT（電子ビーム）、液晶（光の透過量を制御）、プラズマ（放電の紫外線で蛍光体）と区別する。
