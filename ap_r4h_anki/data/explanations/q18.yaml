q: 18
answer: ウ
category: ソフトウェア
theme: |
  メモリの空き領域がバラバラに細切れになる「フラグメンテーション（断片化）」の性質と、メモリ管理方式との関係を問う問題です。
basics: |
  <b>メモリプール</b>：プログラムが必要に応じてメモリ領域を借り（獲得）、使い終わったら返す（返却）ための、あらかじめ用意したメモリの置き場です。
  - <b>可変長ブロック方式</b>：要求された大きさに合わせて、ちょうどの大きさの領域を切り出して貸す方式。無駄は少ないが、獲得と返却を繰り返すと、空き領域が小さな断片に分かれていきます。
  - <b>固定長ブロック方式</b>：決まった大きさのブロック単位で貸す方式。管理が単純で獲得・返却が速く、空きがどれも同じ大きさなので細切れの問題が起きにくい。

  <b>フラグメンテーション（断片化）</b>：使用中の領域の間に小さな空き領域が点在する状態です。空きの合計は十分でも、<b>連続した大きな領域</b>が確保できなくなります。
  <b>ガーベジコレクション</b>：使われなくなった領域を回収し、空き領域を整理する処理です。
reasoning: |
  1. 断片化の本質は「空き領域の合計は足りているのに、それが細切れなので、必要な大きさの連続領域を確保できない」ことです。
  2. これを述べているのは<b>ウ</b>です。
  3. 数値例：空き領域が 10KB・10KB・10KB と離れて3つあると、合計30KBあっても、20KBの連続した領域は確保できません。
choices:
  ア: 可変長ブロック方式では、さまざまな大きさの領域の獲得・返却を繰り返すと、空き領域が細切れになりフラグメンテーションが<b>発生します</b>。「発生しない」は誤り。
  イ: 固定長ブロック方式は獲得・返却が速いという点は正しいですが、ブロックの大きさが一定なので空き領域の細切れ（断片化）は<b>起きにくい</b>方式です。「発生しやすい」は誤り。
  ウ: フラグメンテーションにより、空き領域の合計は十分でも、必要な大きさの連続領域を獲得できないことがあります。<b>正解</b>。
  エ: 返却のたびにガーベジコレクションを行うと処理の負荷が大きく、その必要はありません。通常は空きが足りなくなったときなどにまとめて行います。誤り。
example: |
  映画館で、空席が1席ずつバラバラに10席あっても、4人家族が並んで座れる席はありません。席の合計は足りているのに、まとまった席がない状態がフラグメンテーションです。全員に少しずつ詰めてもらう（空きをまとめる）と、4席並びを作れます。
review:
  - フラグメンテーション＝空き領域の合計は十分でも、連続した領域を確保できなくなる現象。
  - 可変長ブロック方式は断片化が起きやすく、固定長ブロック方式は高速で断片化が起きにくい。
