q: 12
answer: ウ
category: システム構成要素
theme: |
  プロセッサ（CPU）を増やしたときに処理がどれだけ速くなるかを表す「アムダールの法則」の意味を問う問題です。
basics: |
  <b>並列化</b>：1つの処理を分割して、複数のプロセッサで同時に実行することです。ただし、処理の中には順番に実行するしかない（並列化できない）部分もあります。
  <b>速度向上比</b>：プロセッサ1台のときと比べて、何倍速くなったか。

  <b>アムダールの法則</b>：並列化できる部分の割合を r、プロセッサ数を n とすると、
  | 速度向上比 ＝ 1 ÷ { (1 − r) ＋ r ÷ n }
  並列化できる部分（r）はnで割られて短くなりますが、並列化できない部分（1−r）はいくらプロセッサを増やしても短くなりません。
reasoning: |
  1. 並列化できない部分がある（r＜1）とき、nをどんどん大きくすると r÷n は0に近づきます。
  | 速度向上比 → 1 ÷ (1 − r)
  つまり、速度向上比は<b>ある上限（1÷(1−r)）に漸近的に近づく</b>だけで、それ以上は速くなりません。
  2. 数値例：r＝0.9（90%を並列化できる）なら、上限は 1÷0.1 ＝ 10倍。
  | n＝10：1÷(0.1＋0.09)≒5.3倍
  | n＝100：1÷(0.1＋0.009)≒9.2倍
  | n＝1000：1÷(0.1＋0.0009)≒9.9倍（10倍に近づく）
  3. 「並列化できない計算処理がある場合、速度向上比は、プロセッサ数を増やしてもある水準に漸近的に近づく」という<b>ウ</b>が正解です。
choices:
  ア: 全ての計算処理が並列化できる（r＝1）なら、速度向上比 ＝ n となり、プロセッサ数に比例して増え続けます。ある水準に近づくのではないので誤り。
  イ: 並列化できない部分があると、速度向上比はプロセッサ数に比例しては増えず、上限に近づいて頭打ちになります。誤り。
  ウ: 並列化できない部分がある場合、速度向上比は 1÷(1−r) という水準に漸近的に近づきます。<b>正解</b>。
  エ: 並列化できる割合が増えると、速度向上比は大きくなります。プロセッサ数に反比例して減少することはありません。誤り。
example: |
  10人で引っ越しをしても、「トラックの運転（1人しかできない）」に1時間かかるなら、全体は1時間より短くなりません。荷物運び（並列化できる部分）は人数を増やすほど短くなりますが、運転の時間がボトルネックとして残ります。
review:
  - アムダールの法則：速度向上比＝1÷{(1−r)＋r÷n}。並列化できない部分があると上限 1÷(1−r) に頭打ちになる。
  - 全てが並列化できる場合だけ、速度向上比はプロセッサ数に比例する。
