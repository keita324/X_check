q: 39
answer: ア
category: セキュリティ
theme: |
  JPCERT/CCの「CSIRTガイド」で、CSIRTの6つの分類のうち「コーディネーションセンター」の機能とサービス対象の組合せを選ぶ問題です。
basics: |
  <b>CSIRT（シーサート）</b>：セキュリティ事故（インシデント）に対応する専門チームです。JPCERT/CCの「CSIRTガイド」では、機能とサービス対象によって6つに分類しています。主なものは次のとおりです。
  - <b>組織内CSIRT</b>：自組織の従業員・システムを対象に、インシデントに対応する。
  - <b>国際連携CSIRT</b>：国や地域を代表して、他国のCSIRTとの連絡窓口となる。
  - <b>コーディネーションセンター</b>：<b>他のCSIRT</b>を対象に、インシデント対応の中で<b>CSIRT間の情報連携や調整</b>を行う（JPCERT/CC自身がその例）。
  - <b>分析センター</b>：インシデントの傾向分析やマルウェアの解析、攻撃の痕跡の分析を行い、必要に応じて注意を喚起する。
  - <b>ベンダーチーム（PSIRTなど）</b>：自社製品の脆弱性に対応し、パッチの作成や注意喚起を行う。
  - <b>インシデントレスポンスプロバイダ</b>：組織内CSIRTの機能の一部または全部を、サービスとして有償で請け負う。
reasoning: |
  1. 「コーディネーション（coordination）」は「調整」の意味です。コーディネーションセンターは、他のCSIRT同士の情報連携や調整を担います。
  2. 機能「インシデント対応の中で、CSIRT間の情報連携、調整を行う」、サービス対象「他のCSIRT」の組合せである<b>ア</b>が正解です。
choices:
  ア: CSIRT間の情報連携・調整を行い、他のCSIRTを対象とするのは、<b>コーディネーションセンター</b>です。<b>正解</b>。
  イ: インシデントの傾向分析やマルウェア解析、攻撃の痕跡の分析を行い注意を喚起するのは、<b>分析センター</b>の機能です。誤り。
  ウ: 自社製品の脆弱性に対応し、パッチ作成や注意喚起を行い、自社製品の利用者を対象とするのは、<b>ベンダーチーム</b>（PSIRTなど）です。誤り。
  エ: 組織内CSIRTの機能の一部または全部をサービスプロバイダとして有償で請け負い、顧客を対象とするのは、<b>インシデントレスポンスプロバイダ</b>です。誤り。
example: |
  消防に例えると、各会社の自衛消防隊が組織内CSIRT、消防の装置メーカーの対応窓口がベンダーチーム、火災原因を分析する研究所が分析センターです。コーディネーションセンターは、複数の消防隊の間で「どこで何が起きているか」を共有し、連携を取り持つ指令センターのような役割です。
review:
  - コーディネーションセンター＝他のCSIRTを対象に、CSIRT間の情報連携・調整を行う（例：JPCERT/CC）。
  - 分析センター（傾向・マルウェア分析）、ベンダーチーム（自社製品の脆弱性対応）、インシデントレスポンスプロバイダ（有償で請負）と区別する。
