q: 19
answer: エ
category: ソフトウェア
theme: |
  OSの中核部分である「Linuxカーネル」の役割を、シェル・デスクトップ環境・アプリケーションと区別する問題です。
basics: |
  <b>カーネル（kernel＝核）</b>：OSの<b>中核部分</b>で、ハードウェアとアプリケーションの間に立ち、次のような基本機能を提供します。
  - <b>プロセス管理</b>：どのプログラムをいつCPUで実行するかを管理する。
  - <b>メモリ管理</b>：各プログラムにメモリを割り当てる。
  - ファイルシステム、デバイス（入出力装置）の管理、ネットワークなど。
  <b>Linuxカーネル</b>は、このカーネル部分だけを指します。実際に使うLinux（Ubuntuなどの<b>ディストリビューション</b>）は、カーネルに次のようなソフトウェアを組み合わせたものです。
  - <b>シェル</b>（bashなど）：コマンドを文字で入力して操作するためのソフトウェア（CUI）。
  - <b>デスクトップ環境</b>（GNOMEなど）：マウスで操作できる画面（GUI）。
  - <b>アプリケーション</b>：Webブラウザ、ワープロ、表計算ソフトなど。
reasoning: |
  1. Linuxカーネルが担うのは、プロセス管理やメモリ管理などの、アプリケーションが動作するための基本機能です。
  2. シェル、デスクトップ環境、各種アプリケーションは、カーネルの上で動く別のソフトウェアで、カーネルには含まれません。
  3. 正解は<b>エ</b>です。
choices:
  ア: シェルは、カーネルの上で動く別のプログラムで、Linuxカーネルに組み込まれているわけではありません。誤り。
  イ: GUIのデスクトップ環境（GNOMEなど）も、カーネルとは別のソフトウェアです。誤り。
  ウ: Webブラウザやワープロ、表計算ソフトはアプリケーションで、Linuxカーネルには含まれません。カーネルだけでは業務は行えません。誤り。
  エ: プロセス管理やメモリ管理などの、アプリケーションが動作するための基本機能を提供するのがLinuxカーネルです。<b>正解</b>。
example: |
  ビルに例えると、カーネルは「電気・水道・エレベーターなどを管理する設備の中枢」です。テナントのお店（アプリケーション）や受付カウンター（シェル）、ロビーの案内画面（デスクトップ環境）は、その設備の上で営業している別のものです。
review:
  - カーネル＝OSの中核。プロセス管理・メモリ管理・ファイル・デバイス管理など、アプリが動くための基本機能を提供する。
  - シェル（CUI）、デスクトップ環境（GUI）、アプリケーションはカーネルの外のソフトウェア。
