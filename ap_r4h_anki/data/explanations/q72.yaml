q: 72
answer: ウ
category: ビジネスインダストリ
theme: |
  トヨタ生産方式で知られる「かんばん方式」の説明を選ぶ問題です。部品をどちらの工程が、どのタイミングで動かすのかがポイントです。
basics: |
  <b>生産ライン</b>：部品の加工から組立てまで、製品を作る工程の流れです。前の工程を<b>前工程</b>、後の工程を<b>後工程</b>と呼びます。
  <b>中間在庫</b>：工程と工程の間にたまっている、作りかけの部品や半製品です。多すぎると置き場所や管理の手間がかかり、無駄になります。

  <b>かんばん方式</b>：「必要なものを、必要なときに、必要な量だけ」作るジャストインタイム生産を実現する仕組みです。
  1. 後工程が、使った分の部品を前工程に<b>取りに行く</b>（後工程引取り）。
  2. そのとき、部品の種類や数量を書いた<b>かんばん</b>（作業指示書）を前工程に渡す。
  3. 前工程は、かんばんで指示された分だけを作る。
  こうすると、前工程が勝手に作り過ぎることがなく、中間在庫を最小限に抑えられます。
reasoning: |
  1. かんばん方式の要点は「中間在庫を減らす」「後工程が必要な部品だけを前工程から調達する」ことです。
  2. 「中間在庫を極力減らすために、生産ラインにおいて、後工程が必要とする部品を自工程で生産できるように、必要な部品だけを前工程から調達する」という<b>ウ</b>が正解です。
choices:
  ア: 作業効率を上げるために仕様が統一された部品・半製品を調達するのは、部品の<b>標準化（共通化）</b>の説明です。かんばん方式の説明ではありません。誤り。
  イ: 関連会社から部品を調達するのは、調達先の選び方の話で、かんばん方式の仕組みとは関係ありません。誤り。
  ウ: 中間在庫を減らすために、後工程が必要な部品だけを前工程から調達するのは、<b>かんばん方式</b>の説明です。<b>正解</b>。
  エ: 品質の高い部品を得るために納入業者を複数定めて競争入札で調達するのは、購買管理（調達方法）の説明です。誤り。
example: |
  コンビニのおにぎりの補充に似ています。棚（後工程）で売れた分だけ、「鮭を5個」と書いた伝票（かんばん）を工場（前工程）に送り、工場はその分だけを作ります。売れる前にどんどん作って倉庫に積み上げる（作り過ぎ）ことがないので、廃棄や在庫の無駄が減ります。
review:
  - かんばん方式＝後工程が必要な分だけを前工程から引き取る（後工程引取り）ことで、中間在庫を最小化するジャストインタイムの仕組み。
  - 部品の標準化、関連会社からの調達、競争入札は、かんばん方式とは別の調達の話。
