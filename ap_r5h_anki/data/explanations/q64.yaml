q: 64
answer: エ
category: システム企画
theme: |
  システム要件定義で「トレーサビリティ（追跡可能性）が確保されている」とはどういう状態かを問う問題です。
basics: |
  <b>トレーサビリティ（traceability）</b>：trace＝たどる、ability＝できること。システム開発では、<b>要求（なぜその機能が必要か）と、成果物（要件定義書、設計書、プログラム、テスト）との対応関係</b>を、前にも後ろにもたどれる状態のことです。
  トレーサビリティが確保されていると、
  - 「この設計は、どの要求に基づくものか」を確認できる。
  - 仕様変更があったとき、「どの成果物に影響するか」「元の要求や品質を満たしているか」を検証できる。
  - 要求の実装漏れや、不要な機能の作り込みを防げる。
reasoning: |
  1. トレーサビリティのポイントは「要求の根拠と成果物の相互関係が文書化され、たどれること」です。
  2. 「利害関係者の要求の根拠と成果物の相互関係が文書化されており、開発の途中で生じる仕様変更をシステムに求められる品質に立ち返って検証できる」という<b>エ</b>が正解です。
choices:
  ア: 移行マニュアルや運用マニュアルの文書化が完了し、利用者が業務の実施方法を確認できるのは、<b>利用者向け文書の整備</b>の話で、要求と成果物の対応関係をたどれることではありません。誤り。
  イ: 内外作基準に基づいて外部に発注する部分や調達先が決まっているのは、<b>調達</b>の状況です。トレーサビリティとは関係ありません。誤り。
  ウ: モジュールの相互依存関係が確定して仕様を変更できないのは、変更の自由がない状態の説明です。トレーサビリティは、むしろ変更が生じたときに影響を検証できるようにするためのものです。誤り。
  エ: 要求の根拠と成果物の相互関係が文書化され、仕様変更を要求された品質に立ち返って検証できる状態は、<b>トレーサビリティが確保されている</b>状態です。<b>正解</b>。
example: |
  食品のトレーサビリティでは、スーパーの牛肉から「どの牧場の、どの牛か」をたどれます。システム開発でも、ある画面の機能から「どの部署の、どんな要望に基づくものか」をたどれるようにしておけば、「この要望が取り下げられたら、どの機能を直せばよいか」がすぐに分かります。
review:
  - トレーサビリティ＝要求とその根拠、各成果物（要件・設計・プログラム・テスト）の対応関係を文書化し、双方向にたどれること。
  - 仕様変更時に、影響範囲や要求品質への適合を検証できることが目的。
