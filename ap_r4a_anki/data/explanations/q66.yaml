q: 66
answer: エ
theme: |
  経済産業省の「情報システム・モデル取引・契約書」で、システム開発のどの工程に「請負契約」が適しているとされるかを問う問題です。請負契約と準委任契約の違いがポイントです。
basics: |
  システム開発を外部に頼むときの代表的な契約形態は2つです。
  - <b>請負契約</b>：ベンダが<b>成果物の完成</b>を約束し、完成したものに対して代金が支払われる契約。何を作るかが<b>はっきり決まっている</b>作業に向いています。
  - <b>準委任契約</b>：ベンダが専門家として<b>作業を誠実に行うこと</b>（事務処理）を約束する契約で、完成責任は負いません。何を作るかがまだ固まっていない作業や、ユーザが主体となる作業に向いています。

  <b>ウォーターフォールモデル</b>：要件定義→設計→プログラミング→テスト…と、工程を上から順番に進める開発方法です。
  <b>モデル取引・契約書の考え方</b>
  | システム化計画・要件定義：ユーザが主体で内容が未確定 → 準委任
  | システム外部設計：準委任または請負（状況に応じて選択）
  | システム内部設計〜システム結合：作るものが確定 → <b>請負</b>
  | システムテスト：準委任または請負
  | 受入・導入支援：ユーザが主体 → 準委任
reasoning: |
  1. 請負契約は「何を完成させればよいか」が明確でなければ結べません。
  2. 要件定義や外部設計が終わり、仕様が固まった後の「システム内部設計」から「システム結合」までは、ベンダが責任をもって完成させられる範囲なので、請負型が適切とされています。
  3. システム化計画や要件定義（ア・イ・ウに含まれる）は、ユーザ自身が業務の要求をまとめる作業で、成果物の内容を事前に確定できないため準委任型が適切です。
  4. 正解は<b>エ</b>です。
choices:
  ア: システム化計画から受入・導入支援まで全体を請負にすると、内容が確定していない上流工程（計画・要件定義）や、ユーザ主体の受入作業まで完成責任を負わせることになり、適切ではありません。誤り。
  イ: 要件定義はユーザが主体となって要求をまとめる工程で、準委任型が適切とされます。受入・導入支援も同様です。誤り。
  ウ: システム結合までは請負に適しますが、要件定義を含んでいる点が不適切です。誤り。
  エ: システム内部設計からシステム結合までは、作るものが確定しており、請負型の契約が適切とされます。<b>正解</b>。
example: |
  家を建てるときに例えると、「どんな家にしたいか」を家族と相談しながら決める段階（要件定義）は、建築士に相談料を払う形（準委任）が自然です。設計図が完成し、「この図面どおりに建てる」と決まってから、工務店に「完成させて引き渡す」契約（請負）をします。
review:
  - 請負＝成果物の完成責任あり（作るものが確定している工程に向く）、準委任＝作業遂行の責任（完成責任なし）。
  - モデル契約では、システム内部設計〜システム結合が請負型、要件定義や受入・導入支援は準委任型が適切とされる。
