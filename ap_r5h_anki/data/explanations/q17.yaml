q: 17
answer: ウ
category: ソフトウェア
theme: |
  仮想記憶のページ置換えアルゴリズム「FIFO」で、ページ参照を順に処理したときの実記憶の状態を追う問題です。
basics: |
  <b>仮想記憶</b>：プログラムを<b>ページ</b>という単位に分け、必要なページだけを実記憶（主記憶）に置いて実行する仕組みです。この問題では実記憶に3ページ分の枠があります。
  <b>ページフォールト</b>：参照したページが実記憶にないこと。空き枠があればそこに読み込み、なければどれかのページを追い出して（置換え）読み込みます。参照したページが既に実記憶にあれば、何も変わりません。
  <b>FIFO（First In First Out）</b>：<b>最も早く実記憶に読み込まれたページ</b>を追い出す方式です。最近使われたかどうかは関係ありません（最後に使われてから最も時間がたったページを追い出すのはLRU）。
  追い出したページの枠に、新しいページが入ります。
reasoning: |
  表のステップ3までで、実記憶は [1, 4, 2]（読み込まれた順は 1 → 4 → 2）です。
  | ステップ4：ページ4を参照 → 既に実記憶にある → 変化なし [1, 4, 2]
  | ステップ5：ページ1を参照 → 既に実記憶にある → 変化なし [1, 4, 2]
  | ステップ6：ページ3を参照 → 実記憶にない（ページフォールト）、空き枠もない
  | 　FIFOなので、最も早く読み込まれたページ1を追い出し、その枠にページ3を入れる
  | 　→ [<b>3</b>, 4, 2]
  ステップ5でページ1を参照していますが、FIFOでは「いつ読み込まれたか」だけで判断するので、ページ1が追い出されます。
  正解は<b>ウ</b>です。
choices:
  ア: 状態 [1, 3, 4] は、ページ2を追い出した形で、FIFOの「最も早く読み込まれたもの（ページ1）を追い出す」というルールに合いません。誤り。
  イ: 状態 [1, 4, 3] は、ページ2の枠にページ3を入れた形です。これは最後に使われてから最も時間がたったページ（2）を追い出す<b>LRU</b>の結果にあたり、FIFOではありません。誤り。
  ウ: 状態 [3, 4, 2]。最も早く読み込まれたページ1を追い出し、その枠にページ3を入れた状態で、FIFOの結果です。<b>正解</b>。
  エ: 状態 [4, 1, 3] は、直近に参照された3ページ（4→1→3）を並べたもので、ページ2を追い出す<b>LRU</b>の考え方に基づく内容です。FIFOでは最も早く読み込まれたページ1が追い出されるので、ページ1が残ることはありません。誤り。
example: |
  3人掛けのベンチで、新しい人が来たら「一番最初に座った人」に立ってもらうルール（FIFO）を考えます。途中で最初の人が話しかけられても（参照されても）、座った順番は変わらないので、やはり最初の人が立ちます。「一番長く話しかけられていない人」に立ってもらうのはLRUです。
review:
  - FIFOは「最も早く実記憶に読み込まれたページ」を追い出す。途中で参照されても順番は変わらない。
  - LRUは「最後に参照されてから最も時間がたったページ」を追い出す。結果の違い（ここではFIFO＝ウ、LRU＝イ）を確認する。
  - 既に実記憶にあるページの参照では、状態は変化しない。
