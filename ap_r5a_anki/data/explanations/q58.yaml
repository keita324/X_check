q: 58
answer: ウ
category: システム監査
theme: |
  システム監査人が作成する「監査調書」の役割と内容について、正しい記述を選ぶ問題です。
basics: |
  <b>監査調書</b>：システム監査人が、監査の過程で実施した監査手続、入手した監査証拠、<b>発見した事実と、それに対する監査人の所見（判断）</b>などを記録した文書です。
  主なポイント
  - 監査の結論（監査報告書の内容）を支える<b>合理的な根拠</b>になる。そのため、<b>必ず作成</b>する。
  - 監査チームの中で<b>共有</b>し、上位者によるレビューなどで監査の品質を保つ。
  - 監査の後も、結論の根拠として、決められた期間<b>適切に保管</b>する（機密を保持して管理する）。
reasoning: |
  1. 監査調書は、監査の結論を支える合理的な根拠とするために、発見した事実と、その事実に関する監査人の所見を記載します。
  2. 「監査の結論を支える合理的な根拠とするために、発見した事実及び発見事実に関する所見を記載する」という<b>ウ</b>が正解です。
choices:
  ア: 監査調書は、監査の結論の根拠となる重要な記録で、必ず作成しなければなりません。「作成は任意」は誤り。
  イ: 監査調書は、監査チーム内で共有され、レビューを受けることで監査の品質が確保されます。「共有すべきではない」は誤り。
  ウ: 監査の結論を支える合理的な根拠とするために、発見した事実と、それに関する所見を記載します。<b>正解</b>。
  エ: 監査調書は、監査の結論の根拠として、一定期間適切に保管する必要があります。「保管の必要がない備忘録」は誤り。
example: |
  理科の実験レポート（監査報告書）の結論を裏付けるのが、実験ノート（監査調書）です。どんな手順で何を測り、どんな結果が出て、自分はそれをどう考えたか（所見）を記録し、先生や班のメンバーとも共有し、後から確かめられるよう保管しておきます。
review:
  - 監査調書＝監査の結論を支える合理的な根拠。発見した事実と、それに関する監査人の所見を記載する。
  - 作成は必須、チーム内で共有・レビュー、一定期間の適切な保管が必要。
