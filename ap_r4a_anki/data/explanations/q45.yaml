q: 45
answer: イ
theme: |
  ソフトウェアの脆弱性を見つけるテスト手法「ファジング」がどのようなものかを、負荷テスト・辞書攻撃・エスケープ処理と区別する問題です。
basics: |
  <b>脆弱性</b>：ソフトウェアのセキュリティ上の欠陥です。開発者が想定していない入力を受けたときに、異常終了したり、攻撃者に乗っ取られたりする原因になります。

  <b>ファジング（Fuzzing）</b>：ソフトウェアに、<b>ファズ</b>と呼ばれる「問題を起こしそうなデータ」（極端に長い文字列、想定外の記号、壊れた形式のデータ、ランダムなデータなど）を大量に自動で入力し、異常終了やハングアップなどの異常な動作が起きないかを監視して、脆弱性を発見する手法です。
reasoning: |
  1. ファジングのポイントは「様々な種類の、問題を起こしそうなデータを入力する」「動作を監視する」「脆弱性を発見する」の3つです。
  2. これをそのまま説明しているのは<b>イ</b>です。
  3. 他の選択肢は、負荷テスト（ア）、辞書攻撃（ウ）、エスケープ処理（エ）の説明です。
choices:
  ア: 大量のリクエストを送り付けて一定時間内の処理量を測り、DDoS攻撃への耐性を調べるのは<b>負荷テスト（ストレステスト）</b>です。誤り。
  イ: 問題を起こしそうな様々なデータを入力し、動作を監視して脆弱性を発見する。<b>ファジング</b>の説明です。<b>正解</b>。
  ウ: よく使われるパスワードのリストを使って不正ログインを試みるのは<b>辞書攻撃</b>です。テストではなく攻撃手法です。誤り。
  エ: マークアップ言語（HTMLなど）で特別な意味をもつ文字（&lt; や &gt; など）を別の文字列に置き換えて無害化するのは<b>エスケープ処理（サニタイジング）</b>で、クロスサイトスクリプティングなどへの対策です。誤り。
example: |
  新しい自動販売機に、1円玉、外国のコイン、折れたお札、ボタンの連打など、ありとあらゆる「想定外の使い方」を自動で次々に試して、故障したりお金が出てきたりしないかを確かめるようなものです。異常が起きた入力が、そのまま弱点（脆弱性）の手がかりになります。
review:
  - ファジング＝想定外・異常なデータ（ファズ）を大量に入力し、動作を監視して脆弱性を見つけるテスト手法。
  - 負荷テスト（大量リクエスト）、辞書攻撃（パスワードリスト）、エスケープ処理（特殊文字の置換）と区別する。
