q: 7
answer: イ
category: アルゴリズムとプログラミング
theme: |
  JavaScriptのオブジェクトの書き方を基にしたデータ記述形式「JSON」を、DOM・SOAP・XMLと区別する問題です。
basics: |
  <b>JSON（JavaScript Object Notation）</b>：JavaScriptのオブジェクトの表記法を基にした、軽量なデータ記述形式です。次の2つの構造でデータを表します。
  | オブジェクト（名前と値の組みの集まり）：{ "name": "山田", "age": 20 }
  | 配列（値の順序付きリスト）：[ "りんご", "みかん", "ぶどう" ]
  Web APIのデータのやり取りなど、言語を問わず広く使われています。

  他の用語
  - <b>XML</b>：&lt;name&gt;山田&lt;/name&gt; のように、タグでデータを囲んで構造を表すマークアップ言語。
  - <b>DOM（Document Object Model）</b>：HTMLやXML文書を、プログラムから木構造として操作するための仕組み（API）。
  - <b>SOAP</b>：XMLを使ってメッセージをやり取りする、Webサービスの通信プロトコル。
reasoning: |
  1. 問題文のキーワードは「JavaScriptのオブジェクトの表記法を基に規定」「名前と値との組みの集まり」と「値の順序付きリスト」の2つの構造です。
  2. これは<b>JSON</b>の定義そのものです。正解は<b>イ</b>です。
choices:
  ア: DOMは、HTMLやXMLの文書をプログラムから操作するためのインタフェースで、データ記述の仕様ではありません。誤り。
  イ: JSONは、JavaScriptのオブジェクト表記法を基にし、「名前と値の組みの集まり」と「値の順序付きリスト」でデータを表す記述仕様です。<b>正解</b>。
  ウ: SOAPは、XML形式のメッセージでWebサービスを呼び出すための通信プロトコルです。誤り。
  エ: XMLは、タグで要素を囲んで構造を表すマークアップ言語で、JavaScriptのオブジェクト表記法を基にしたものではありません。誤り。
example: |
  天気予報のWeb APIから「{ "city": "東京", "temps": [18, 21, 19] }」のようなデータが返ってくるのがJSONの典型です。"city":"東京" が名前と値の組み、[18, 21, 19] が値の順序付きリストです。
review:
  - JSON＝JavaScriptのオブジェクト表記法が基。{ } で名前と値の組み（オブジェクト）、[ ] で値の順序付きリスト（配列）。
  - XML（タグで構造化）、DOM（文書を操作するAPI）、SOAP（XMLメッセージの通信プロトコル）と区別する。
