q: 38
answer: ウ
category: セキュリティ
theme: |
  インターネット上で、どの機器にも割り当てられていない（使われていない）IPアドレス空間に、大量に届くパケットの正体を問う問題です。サイバー攻撃の観測方法「ダークネット観測」の考え方です。
basics: |
  <b>ダークネット</b>：インターネット上で到達可能でありながら、<b>どの機器（ホスト）にも割り当てられていない</b>IPアドレスの空間です。
  正規の通信は、実在するWebサイトやサーバなど<b>実在する相手</b>に送られるので、本来ダークネットにパケットが届く理由はありません。それでも大量のパケットが届くのは、
  - 攻撃者やマルウェアが、攻撃できる機器を探すために、IPアドレスを<b>片っ端から（ランダムや連番で）</b>調べる<b>スキャン</b>
  - 送信元を偽装した攻撃に対する応答の跳ね返り（バックスキャッタ）
  などのためです。そのため、ダークネットに届くパケットを観測すると、マルウェアの感染拡大や攻撃の動向を把握できます（NICTのNICTERなど）。
reasoning: |
  1. 使われていないIPアドレスに正規の通信が送られることはありません。
  2. 届くのは、攻撃者やマルウェアが攻撃対象を探すために、アドレスを無差別にスキャンするパケットなどです。
  3. 正解は<b>ウ</b>です。
choices:
  ア: 公開されているWebサイトへのアクセスは、実在するWebサーバのIPアドレス宛てに送られるので、使われていないIPアドレス空間には届きません。誤り。
  イ: 実在するIoT機器から実在するサーバへの通信は、そのサーバのIPアドレス宛てで、使われていないアドレス空間には届きません。誤り。
  ウ: 攻撃者やマルウェアが攻撃対象を探すために送信するスキャンのパケットは、アドレスを無差別に調べるため、使われていないIPアドレス空間にも大量に届きます。<b>正解</b>。
  エ: 標的型攻撃メールは、有効なメールアドレスの持ち主（実在するメールサーバ）に向けて送られるので、使われていないIPアドレス空間には届きません。誤り。
example: |
  誰も住んでいない空き家の郵便受けに、毎日たくさんのチラシや「留守かどうか確かめる」手紙が届くとしたら、それは住所を順番に回って空き巣先を探している人の仕業かもしれません。空き家の郵便受けを見張れば、怪しい活動の動きが分かります。これがダークネット観測の考え方です。
review:
  - ダークネット＝どの機器にも割り当てられていないIPアドレス空間。届くパケットは主にマルウェアや攻撃者のスキャン。
  - 正規の通信（Web閲覧、IoTとサーバの通信、メール）は実在する宛先に送られるので、ダークネットには届かない。
