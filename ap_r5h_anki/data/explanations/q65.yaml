q: 65
answer: ア
category: システム企画
theme: |
  情報システムを外部から調達するときに、発注側（調達者）がベンダ（供給者候補）に出す文書のうち「RFI（情報提供依頼書）」の意味を問う問題です。
basics: |
  システムを外部に発注するときの、主な文書と順番
  | <b>RFI（Request For Information：情報提供依頼書）</b>
  | 　調達者が、システム化の目的や業務内容などを示し、供給者候補に<b>情報（技術動向、製品、実績など）の提供</b>を依頼する。発注の準備段階で、どんな解決策があるかを調べるため。
  | ↓
  | <b>RFP（Request For Proposal：提案依頼書）</b>
  | 　対象システムや調達条件を具体的に示し、供給者候補に<b>提案書の提出</b>を依頼する。
  | ↓
  | 提案の評価・選定 → <b>契約の締結</b>
  契約後に契約内容を変えるときは、変更を要請して合意します。
reasoning: |
  1. RFIは、Information（情報）の提供を依頼する文書です。
  2. 「調達者から供給者候補に対して、システム化の目的や業務内容などを示し、必要な情報の提供を依頼すること」という<b>ア</b>が正解です。
choices:
  ア: システム化の目的や業務内容を示して、供給者候補に必要な情報の提供を依頼するのは<b>RFI</b>です。<b>正解</b>。
  イ: 対象システムや調達条件などを示して、提案書の提出を依頼するのは<b>RFP（提案依頼書）</b>です。誤り。
  ウ: 契約で取り決めた内容について変更を要請するのは、契約後の<b>変更要請</b>です。RFIではありません。誤り。
  エ: 双方の役割分担などを確認して契約の締結を要請するのは、<b>契約締結</b>の段階の手続です。RFIではありません。誤り。
example: |
  家のリフォームに例えると、まず複数の工務店に「キッチンを新しくしたいのですが、どんな方法や商品がありますか？」とカタログや事例を送ってもらうのがRFI、内容が固まってから「この条件で見積りと提案をください」と依頼するのがRFP、提案を比べて1社を選んで契約する、という流れです。
review:
  - RFI＝情報提供依頼（目的・業務内容を示して、技術や製品の情報を集める）。RFP＝提案依頼（具体的な条件を示して提案書を求める）。
  - 調達の流れ：RFI → RFP → 提案評価・選定 → 契約。
