q: 23
answer: ア
category: ハードウェア
theme: |
  3つの入力のうち2つ以上が1のときに1を出力する「多数決回路」を、論理回路図から選ぶ問題です。
basics: |
  <b>真理値表</b>から、出力Yが1になるのは、A・B・Cのうち<b>2つ以上が1</b>のときです（011, 101, 110, 111）。
  これを論理式で表すと
  | Y ＝ A・B ＋ B・C ＋ A・C
  （「AとBが1」または「BとCが1」または「AとCが1」）
  です。「・」はAND（論理積）、「＋」はOR（論理和）です。

  回路図の記号
  - <b>AND</b>：平らな背の半円形。
  - <b>OR</b>：矢じり形。
  - <b>XOR</b>（排他的論理和）：ORの入力側にもう1本の曲線がある形。入力が異なるとき1。
  - 出力に小さな丸が付いたものは、結果を反転（NOT）したもの（NANDなど）。
reasoning: |
  各回路を論理式に直して、真理値表と照らし合わせます。
  1. <b>ア</b>：3つのANDで A・B、B・C、A・C を作り、ORでまとめている → Y ＝ A・B ＋ B・C ＋ A・C。多数決回路の式そのものです。
  2. <b>イ</b>：3つのXORで A⊕B、B⊕C、A⊕C を作りORでまとめる。入力が全部同じ（000、111）のときだけ0になるので、111 で 1 になりません。
  3. <b>ウ</b>：(A＋B)・(B＋C) をANDし、さらに (A＋C) とNANDを取る形で、Y ＝ NOT{(A＋B)(B＋C)(A＋C)}。(A＋B)(B＋C)(A＋C) は多数決の式と同じ値になるので、ウはその<b>反転</b>になってしまいます（111 で 0）。
  4. <b>エ</b>：XORの結果をANDしてNANDを取る形。3つのXORが同時に1になることはないので、出力は常に1になります。
  5. 正解は<b>ア</b>です。
choices:
  ア: AND3つとORで Y＝A・B＋B・C＋A・C となり、2つ以上が1のときに1を出力する多数決回路です。<b>正解</b>。
  イ: XORをORでまとめた回路は、入力が全部同じとき以外に1を出すので、入力111で出力が0になってしまい、真理値表と一致しません。誤り。
  ウ: 多数決と同じ値になる (A＋B)(B＋C)(A＋C) を、最後のNANDで反転しているため、真理値表の出力が逆になります（例：111で0）。誤り。
  エ: 3つのXORが同時に1になることはないため、ANDの結果は常に0で、最後のNANDの出力は常に1になります。誤り。
example: |
  3人の審判の多数決で判定を出す機械を考えると、「審判1と2が賛成」「2と3が賛成」「1と3が賛成」のどれかが成り立てば「賛成」です。この3つの組合せをANDで作り、ORで「どれか1つ」をまとめたのがアの回路です。
review:
  - 3入力多数決回路の式は Y＝A・B＋B・C＋A・C（ANDを3つ作ってORでまとめる）。
  - 回路図は各ゲートの出力を論理式に直し、000・111 など特徴的な入力で検算する。
