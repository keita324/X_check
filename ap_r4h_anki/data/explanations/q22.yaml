q: 22
answer: ウ
category: ハードウェア
theme: |
  制御システムで「動き」を作り出す部品アクチュエータの説明を、制御器・センサ・増幅器と区別する問題です。
basics: |
  機械を自動で制御する仕組みは、次のような部品の組合せでできています。
  - <b>センサ</b>：位置、速度、温度などの物理量を検出し、電気信号に変換する（現実→電気信号）。
  - <b>増幅器（アンプ）</b>：センサやマイクが出す弱い電気信号を大きくする。
  - <b>制御器（コントローラ）</b>：目標値とセンサの測定値を比べて、そのずれをなくすように「どれだけ動かすか」（操作量）を計算する。
  - <b>アクチュエータ</b>：電気・油圧・空気圧などのエネルギーを使って、<b>回転や直進などの機械的な動き</b>に変換する（モーター、シリンダーなど）。
reasoning: |
  1. アクチュエータ（actuator）は「act＝動かす」に由来し、エネルギーを物理的な動きに変える装置です。
  2. 「エネルギー源からのパワーを、回転、直進などの動きに変換する」という<b>ウ</b>が正解です。
choices:
  ア: 目標量と制御量（センサで測った値）を比べ、一致させるように操作量を出力するのは、<b>制御器（コントローラ）</b>の働きです（フィードバック制御）。誤り。
  イ: 位置、角度、速度、温度などを検出して電気的な情報に変換するのは<b>センサ</b>です。アクチュエータとは逆向きの変換です。誤り。
  ウ: エネルギー源からのパワーを回転や直進などの動きに変換するのは<b>アクチュエータ</b>です。<b>正解</b>。
  エ: マイクロフォンやセンサが出す微小な電気信号を増幅するのは<b>増幅器（アンプ）</b>です。誤り。
example: |
  エアコンの風向きを自動で変える仕組みでは、温度センサが室温を測り（センサ）、制御基板が「設定温度との差」から風向きを決め（制御器）、モーター（アクチュエータ）がルーバーを動かします。ロボットの腕を動かすモーターや、自動ドアを開け閉めするモーターもアクチュエータです。
review:
  - アクチュエータ＝エネルギーを回転・直進などの機械的な動きに変換する部品（モーター、シリンダーなど）。
  - センサ（物理量→電気信号）、制御器（目標と測定値を比べて操作量を出す）、増幅器（信号を大きくする）と区別する。
