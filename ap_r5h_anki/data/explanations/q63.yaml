q: 63
answer: ウ
category: システム戦略
theme: |
  ビッグデータの活用を進める仕組みの一つ「情報銀行（情報利用信用銀行）」の説明を、オープンデータやデータ取引市場などと区別する問題です。
basics: |
  <b>パーソナルデータ</b>：個人に関するデータ（購買履歴、位置情報、健康データなど）です。多くの企業が活用したいと考えていますが、本人の同意や安全な管理が欠かせません。
  <b>情報銀行</b>：個人との契約に基づいて個人のデータを<b>預かり（預託され）</b>、<b>本人の指示や、本人があらかじめ指定した条件</b>に基づいて、そのデータを他の事業者に提供する事業者です。お金を銀行に預けて運用してもらうように、自分のデータを預けて活用してもらい、本人はその見返り（便益）を受け取れます。

  関連する取組
  - <b>オープンデータ</b>：国や自治体が保有する公共データを、誰でも二次利用できる形で公開すること。
  - <b>データ取引市場</b>：事業者がデータを売買するための市場。
reasoning: |
  1. 情報銀行のキーワードは「個人との契約に基づき個人情報を預託」「本人の指示又は指定した条件に基づいて」「他の事業者に提供」です。
  2. これをすべて述べているのは<b>ウ</b>です。
choices:
  ア: 金融機関が自ら保有する顧客の決済データを分析して、自社の営業活動に活用するのは、企業による<b>自社データの活用</b>で、情報銀行ではありません。誤り。
  イ: 国や自治体が公共データに匿名加工を施して、民間に二次利用できるよう提供するのは、<b>オープンデータ</b>の取組です。誤り。
  ウ: 事業者が個人との契約に基づき個人情報を預託され、本人の指示又は指定した条件に基づいて他の事業者に提供できるようにする取組は、<b>情報銀行</b>です。<b>正解</b>。
  エ: 事業者が工場のIoT機器から集めた産業用データを、インターネット上の取引市場を介して他の事業者に提供するのは、<b>データ取引市場</b>の取組です。個人の情報を預かる情報銀行ではありません。誤り。
example: |
  自分の健康アプリの歩数データを情報銀行に預け、「スポーツ用品メーカーにだけ、名前を伏せて提供してよい」と条件を指定します。情報銀行がその条件でデータを提供し、自分はポイントやクーポンを受け取る、という仕組みです。
review:
  - 情報銀行＝個人との契約で個人データを預かり、本人の指示・指定条件に基づいて他の事業者に提供する事業者。
  - オープンデータ（公共データの公開）、データ取引市場（事業者間のデータ売買）、自社データの活用と区別する。
