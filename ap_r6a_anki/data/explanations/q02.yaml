q: 2
answer: エ
category: 基礎理論
theme: |
  AIの教師あり学習で、作ったモデルが未知のデータにどれだけ通用するか（汎化性能）を確かめる方法「交差検証」の説明を、正則化・アンサンブル学習・マルチタスク学習と区別する問題です。
basics: |
  <b>教師あり学習</b>：正解ラベル付きのデータ（例：画像と「猫」「犬」のラベル）からモデルを学習させる方法です。
  <b>汎化性能</b>：学習に使っていない<b>未知のデータ</b>に対しても正しく予測できる能力です。学習に使ったデータで評価すると、丸暗記（過学習）していても高い点が出てしまうので、評価には学習に使っていないデータを使う必要があります。
  <b>交差検証（クロスバリデーション）</b>：データを複数（k個）のグループに分け、<b>1つを評価用、残りを学習用</b>にして学習と評価を行い、評価用のグループを<b>順に入れ替えて</b>k回繰り返し、その結果を平均して汎化性能を評価する方法です（k分割交差検証）。限られたデータを無駄なく使えます。

  関連する手法
  - <b>正則化</b>：モデルの複雑さに応じたペナルティ項を加えて、過学習を防ぐ。
  - <b>アンサンブル学習</b>：複数のモデルの予測を組み合わせて精度を高める。
  - <b>マルチタスク学習</b>：関連する複数の課題を1つのモデルで同時に学習し、共通の特徴を獲得する。
reasoning: |
  1. 交差検証のキーワードは「汎化性能を<b>評価</b>する」「データを複数のグループに分割」「一部を学習、残りを評価」「グループを入れ替えて繰り返す」です。
  2. これを述べているのは<b>エ</b>です。
choices:
  ア: 過学習を防ぐために、回帰モデルに複雑さのペナルティ項を加えるのは<b>正則化</b>です。誤り。
  イ: 複数の異なるアルゴリズムのモデルで学習し、結果を組み合わせるのは<b>アンサンブル学習</b>です。誤り。
  ウ: 単一のモデルで関連する複数の課題を学習し、共通する要因を獲得するのは<b>マルチタスク学習</b>です。誤り。
  エ: 汎化性能を評価するために、データを複数のグループに分割し、学習用と評価用を入れ替えながら学習と評価を繰り返すのは<b>交差検証</b>です。<b>正解</b>。
example: |
  問題集100問を5冊（各20問）に分け、4冊で勉強して残りの1冊でテストする、を5回、テストに使う冊を入れ替えながら繰り返し、平均点で実力を測るのが交差検証です。勉強した問題でテストするより、本当の実力（汎化性能）が分かります。
review:
  - 交差検証＝データをk分割し、評価用を入れ替えながら学習・評価を繰り返して汎化性能を評価する方法。
  - 正則化（ペナルティ項で過学習防止）、アンサンブル学習（複数モデルの組合せ）、マルチタスク学習（複数課題の同時学習）と区別する。
