q: 43
answer: イ
category: セキュリティ
theme: |
  情報セキュリティの用語規格JIS Q 27000で、「リスクレベル」がどのように定義されているかを問う問題です。
basics: |
  <b>JIS Q 27000</b>：情報セキュリティマネジメントシステム（ISMS）で使う用語を定義した規格です。
  関連する主な用語
  - <b>リスク</b>：目的に対する不確かさの影響。
  - <b>リスクレベル</b>：<b>結果（起きたときの影響の大きさ）と、その起こりやすさの組合せ</b>として表現される、リスクの大きさ。
  - <b>脆弱性</b>：一つ以上の脅威によって付け込まれる可能性のある、資産又は管理策の弱点。
  - <b>リスク基準</b>：リスクの重大性を評価するための目安とする条件（判断基準）。
reasoning: |
  1. リスクの大きさは「起きたらどれだけ困るか（結果）」と「どれだけ起きやすいか（起こりやすさ）」の2つの組合せで決まります。
  | 例：影響「大」×起こりやすさ「高」→ リスクレベル「高」
  2. 「結果とその起こりやすさの組合せとして表現される、リスクの大きさ」という<b>イ</b>が、リスクレベルの定義です。
choices:
  ア: 脅威によって付け込まれる可能性のある、資産又は管理策の弱点は<b>脆弱性</b>の定義です。誤り。
  イ: 結果とその起こりやすさの組合せとして表現される、リスクの大きさは<b>リスクレベル</b>の定義です。<b>正解</b>。
  ウ: 対応すべきリスクに付与する優先順位は、リスク評価の結果として決めるものですが、リスクレベルの定義ではありません。誤り。
  エ: リスクの重大性を評価するための目安とする条件は<b>リスク基準</b>の定義です。誤り。
example: |
  自転車通学で考えると、「転倒してけがをする」リスクは、けがの重さ（結果）と、雨の日の滑りやすさなどによる起こりやすさの組合せで、大きさ（リスクレベル）が決まります。「ブレーキがすり減っている」のは弱点（脆弱性）、「レベル高なら対策する」という線引きがリスク基準です。
review:
  - リスクレベル＝結果（影響の大きさ）と起こりやすさの組合せで表すリスクの大きさ。
  - 脆弱性（付け込まれる弱点）、リスク基準（重大性を評価する目安）と用語の定義を区別する。
