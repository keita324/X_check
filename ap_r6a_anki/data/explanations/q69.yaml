q: 69
answer: ウ
category: 経営戦略マネジメント
theme: |
  顧客や他企業と一緒に価値をつくる<b>コ・クリエーション（共創）戦略</b>の特徴を、自前主義・顧客主導の製造委託・M&Aと区別する問題です。
basics: |
  <b>コ・クリエーション（Co-Creation：価値共創）</b>：企業が単独で価値を作って顧客に売るのではなく、<b>顧客や取引先、他企業などのネットワーク</b>と協力しながら、一緒に新しい価値を生み出す考え方です。
  ポイントは次の2つです。
  - <b>外部の力を活用する</b>：顧客の意見・アイデア、他社の技術やサービスと連携する。
  - <b>体験まで含めた価値</b>：商品・サービスそのものだけでなく、それを使う<b>顧客の経験（体験）</b>まで含めて、他社にまねされにくい価値をつくる。

  比較すると分かりやすい考え方
  - <b>自前主義</b>：すべて社内の資源だけで行う（共創とは逆）。
  - <b>M&A</b>：他社を買収・合併して経営資源を取り込む（協働ではなく取得）。
reasoning: |
  1. コ・クリエーションのキーワードは「顧客や企業ネットワークの力を活用」「顧客の経験まで含めた価値の創造」です。
  2. ア：自前主義にこだわるのは、外部と共創する考え方と正反対です → ×。
  3. イ：顧客がアイデアを仕様に落とし込み、企業は製造を請け負うだけで、企業と顧客がともに価値をつくり出す関係ではありません → ×。
  4. ウ：顧客や企業ネットワークの力を活用し、顧客の経験まで含めて差別化可能な価値を創造する → ○。
  5. エ：M&Aで経営資源を取得するのは、買収による強化で、共創ではありません → ×。
  6. 正解は<b>ウ</b>です。
choices:
  ア: 営業部門と製造部門の協働にとどまり、さらに徹底した自前主義を取るのは、外部と価値を共創するコ・クリエーションとは逆の考え方です。誤り。
  イ: 顧客がアイデアを具体的な仕様にして企業に製造だけを任せる形は、顧客主導の製造委託であり、企業と顧客が対話しながら一緒に価値を生み出すコ・クリエーションの特徴ではありません。誤り。
  ウ: 顧客や企業ネットワークの力を活用し、商品・サービスだけでなく顧客の経験まで含めて差別化可能な価値を創造するのが、<b>コ・クリエーション戦略</b>の特徴です。<b>正解</b>。
  エ: 不足する経営資源をM&Aで取り込むのは、買収・合併による成長戦略で、協働による価値共創とは異なります。誤り。
example: |
  あるお菓子メーカーが、SNSでファンから新しい味のアイデアを募集し、投票で選び、パッケージデザインもファンと一緒に決めたとします。完成した商品だけでなく「自分たちも開発に参加した」という体験そのものが、ファンにとっての価値になります。これがコ・クリエーションです。
review:
  - コ・クリエーション＝顧客や企業ネットワークと共に、顧客の経験まで含めた差別化価値を創造する。
  - 自前主義（外部を使わない）やM&A（買収で資源を取得）とは考え方が異なる。
