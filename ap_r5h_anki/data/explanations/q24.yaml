q: 24
answer: エ
category: ネットワーク
theme: |
  交通系ICカードやスマホのタッチ決済で使われる近距離無線通信「NFC」の特徴を問う問題です。
basics: |
  <b>NFC（Near Field Communication）</b>：<b>10cm程度</b>のごく近い距離で使う無線通信の規格です。
  主な特徴
  - <b>非接触</b>で通信する（かざすだけ）。非接触ICカード（交通系ICカードなど）の通信方式と互換性がある。
  - 3つの動作モードがある。
  | カードエミュレーション：スマホがICカードの代わりになる（タッチ決済など）
  | リーダー／ライター：スマホでICカードを読み書きする
  | <b>ピアツーピア</b>：NFC対応機器同士で直接データをやり取りする
reasoning: |
  1. NFCには、機器同士が1対1で直接通信する<b>ピアツーピア（P2P）</b>のモードがあります。
  2. 「ピアツーピアで通信する機能を備えている」という<b>エ</b>が正解です。
  3. 他の選択肢は、NFCの特徴（非接触、通信距離約10cm）と合いません。
choices:
  ア: 静電容量式のタッチセンサーで位置を検出するのは、スマホの<b>タッチパネル</b>の仕組みです。NFCは無線通信の規格です。誤り。
  イ: NFCは<b>非接触</b>のICカードの通信に使われる方式です。接触式ICカード（端子を差し込んで読み取るもの）の通信方法ではありません。誤り。
  ウ: NFCの通信距離は<b>10cm程度</b>です。最大10m程度の通信ができるのはBluetoothなどです。誤り。
  エ: NFCは、対応機器同士が直接データをやり取りするピアツーピアの通信機能を備えています。<b>正解</b>。
example: |
  駅の改札で交通系ICカードやスマホをかざすのがNFC（カードエミュレーション）、スマホ同士を近づけて連絡先を交換したり、ワイヤレスイヤホンとスマホをタッチしてペアリングしたりするのが、機器同士の直接通信（ピアツーピア）の例です。
review:
  - NFC＝通信距離約10cmの非接触の近距離無線通信。カードエミュレーション、リーダー／ライター、ピアツーピアの3モード。
  - 接触式ではなく非接触、通信距離は10mではなく約10cm、と数字と方式で判断する。
