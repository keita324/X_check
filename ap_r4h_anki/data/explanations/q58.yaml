q: 58
answer: ア
category: システム監査
theme: |
  事業継続計画（BCP）の監査で、BCPが適切に整備・運用されていると判断できる状況を選ぶ問題です。BCPの基本的な要件を理解しているかが問われます。
basics: |
  <b>BCP（事業継続計画）</b>：災害や事故などで事業が中断したとき、重要な業務を決めた時間内に再開・継続するための計画です。
  BCPが有効に機能するための主なポイント
  - <b>連絡体制</b>：緊急時に従業員の安否確認や招集ができるよう、緊急連絡先を整備し、<b>常に最新の状態</b>に保つ。
  - <b>重要業務の優先順位</b>：すべての業務を同時には復旧できないので、事業への影響度から<b>優先順位を付け</b>、重要な業務から復旧する。
  - <b>重要情報の保護</b>：重要書類やデータは<b>複製して別の場所に保管</b>し、1か所が被災しても失われないようにする（分散保管）。
  - <b>周知と訓練</b>：BCPを従業員に<b>周知し、訓練</b>しておかなければ、いざというときに機能しない。
reasoning: |
  1. ア：緊急連絡先リストを作成し、最新版に更新している → 緊急時の連絡体制が機能するので<b>適切</b>。
  2. イ：重要書類を複製せず1か所に集中保管 → その場所が被災するとすべて失われるので不適切。
  3. ウ：全業務を優先順位なしで同一水準 → 重要業務を優先して復旧できないので不適切。
  4. エ：平時にBCPを従業員に非公開 → 従業員が内容を知らず、訓練もできないので不適切。
  5. 正解は<b>ア</b>です。
choices:
  ア: 従業員の緊急連絡先リストを作成し、最新版に更新しているのは、緊急時の連絡・安否確認のために適切な状況です。<b>正解</b>。
  イ: 重要書類を複製せず1か所で集中保管していると、その場所が災害に遭えば重要書類がすべて失われます。複製して遠隔地にも保管すべきなので不適切です。誤り。
  ウ: 全業務を優先順位なしで同一水準にすると、限られた人員や資源で重要業務を優先的に復旧できません。業務への影響度に応じて優先順位を付けるべきです。誤り。
  エ: BCPを平時に非公開にすると、従業員が自分の役割を知らず、訓練もできないため、緊急時に機能しません。周知と訓練が必要です。誤り。
example: |
  家庭の防災に例えると、家族の連絡先を最新にしておく（ア）のは正しい備えです。一方、通帳や保険証券のコピーを取らず1か所にしまう（イ）、「何から持ち出すか」を決めていない（ウ）、避難計画を家族に教えていない（エ）では、災害時に役に立ちません。
review:
  - BCPの適切な状況：緊急連絡先の最新化、重要業務の優先順位付け、重要書類・データの複製と分散保管、従業員への周知と訓練。
  - 「複製しない・1か所に集中」「優先順位なし」「非公開」はBCPの不備。
