q: 44
answer: ア
category: セキュリティ
theme: |
  送信元のなりすましメールを見破る送信ドメイン認証技術「DKIM」の説明を、SMTP-AUTH・DMARC・SPFと区別する問題です。
basics: |
  <b>送信ドメイン認証</b>：受信したメールが、本当にその送信元ドメインから送られたものかを確かめる技術です。
  - <b>DKIM（DomainKeys Identified Mail）</b>：送信側のメールサーバが、メールに<b>デジタル署名</b>を付けて送る。受信側のメールサーバは、送信元ドメインのDNSに公開された公開鍵で署名を<b>検証</b>し、送信元ドメインが正しいこと（と途中で改ざんされていないこと）を確認する。
  - <b>SPF</b>：送信元ドメインのDNSに、メールを送ってよいサーバの<b>IPアドレス</b>を登録しておき、受信側で実際の送信サーバのIPアドレスと照合する。
  - <b>DMARC</b>：SPFやDKIMで認証に失敗したメールをどう扱うか（受け取る、隔離する、拒否する）の<b>ポリシー</b>をDNSに登録し、認証結果のレポートを受け取って監視する仕組み。
  <b>SMTP-AUTH</b>：メールを送信するときに、メールサーバが<b>利用者IDとパスワード</b>で送信者を認証する仕組み（送信ドメイン認証ではない）。
reasoning: |
  1. DKIMのキーワードは「送信側でデジタル署名を付与」「受信側で署名を検証」「送信元ドメインの認証」です。
  2. これを述べているのは<b>ア</b>です。
choices:
  ア: 送信側のメールサーバでデジタル署名を付与し、受信側でそれを検証して送信元ドメインを認証するのは<b>DKIM</b>です。<b>正解</b>。
  イ: 送信側のメールサーバが、利用者IDとパスワードで送信者を認証するのは<b>SMTP-AUTH</b>です。誤り。
  ウ: 認証に失敗したメールの処理方法のポリシーをDNSに登録し、認証結果を監視するのは<b>DMARC</b>です。誤り。
  エ: メールサーバのIPアドレスをDNSに登録しておき、受信側で送信元サーバのIPアドレスと照合するのは<b>SPF</b>です。誤り。
example: |
  会社から届いた書類に押された社印（デジタル署名）を、その会社が公開している印鑑証明（DNSの公開鍵）と照らし合わせて本物か確かめるのがDKIMです。差出人の住所（送信サーバのIPアドレス）が会社の登録住所と合っているか確かめるのがSPFです。
review:
  - DKIM＝デジタル署名（送信側で付与、受信側でDNSの公開鍵で検証）による送信ドメイン認証。
  - SPF（IPアドレスの照合）、DMARC（認証失敗時のポリシーとレポート）、SMTP-AUTH（送信者のID・パスワード認証）と区別する。
