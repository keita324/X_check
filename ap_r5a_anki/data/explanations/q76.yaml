q: 76
answer: イ
category: 企業活動
theme: |
  品質管理の図法（QC七つ道具・新QC七つ道具）のうち、件数の多い順に要因を並べて「主な要因」を明確にする図法を選ぶ問題です。
basics: |
  - <b>パレート図</b>：項目（故障の要因など）を<b>件数の多い順</b>に並べた棒グラフに、<b>累積比率</b>の折れ線グラフを重ねた図。どの要因が全体の大部分を占めているか（重点的に対策すべき要因）が一目で分かる。「全体の8割は2割の要因から生じる」というパレートの法則の考え方に基づく。
  - <b>特性要因図（フィッシュボーン図）</b>：結果（特性）と、それに影響する要因の関係を、魚の骨のような形で体系的に整理した図。
  - <b>マトリックス図</b>：2つの要素（例：問題と対策）を行と列に並べ、交点で関係の有無や強さを表す図。
  - <b>連関図</b>：複雑に絡み合った原因と結果の関係を、矢印で結んで整理する図。
reasoning: |
  1. 問題文のキーワードは「発生要因ごとの件数の記録を基に」「件数で上位を占める主な要因を明確に表現する」です。
  2. 件数の多い順に並べて主要な要因を明らかにするのは<b>パレート図</b>です。正解は<b>イ</b>です。
choices:
  ア: 特性要因図は、結果と要因の関係を魚の骨の形で整理する図で、件数の大小や順位は表しません。誤り。
  イ: パレート図は、要因を件数の多い順に並べ、累積比率と合わせて主な要因を明確にする図法です。<b>正解</b>。
  ウ: マトリックス図は、2つの要素の関係を行列の形で整理する図で、件数の上位を示すものではありません。誤り。
  エ: 連関図は、原因と結果が複雑に絡み合った関係を矢印で整理する図で、件数の上位を示すものではありません。誤り。
example: |
  お店のクレーム100件を原因別に数えて、多い順に「待ち時間」50件、「品切れ」25件、「接客」10件…と棒グラフにすると、上位2つで全体の75%を占めることが分かります。まずこの2つを対策すれば効果が大きい、と判断できるのがパレート図です。
review:
  - パレート図＝項目を件数の多い順に並べた棒グラフ＋累積比率の折れ線。重点的に対策すべき主要因を明らかにする。
  - 特性要因図（結果と要因を魚の骨で整理）、マトリックス図（2要素の関係）、連関図（因果関係の絡み合い）と区別する。
