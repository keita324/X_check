q: 5
answer: ウ
category: アルゴリズムとプログラミング
theme: |
  2分探索木から、子をもつ要素（12）を削除したとき、どの要素をその位置に移動すれば2分探索木の性質を保てるかを問う問題です。
basics: |
  <b>2分探索木</b>：各節点について、<b>左の子孫はすべてその節点より小さく、右の子孫はすべて大きい</b>という性質をもつ木です。この性質のおかげで、大小を比べながら効率よく探索できます。

  <b>子を2つもつ節点を削除する方法</b>
  削除した位置には、次のどちらかを移動すれば、2分探索木の性質を保てます。
  - <b>左の部分木の最大値</b>（左の部分木で一番右にある要素）
  - <b>右の部分木の最小値</b>（右の部分木で一番左にある要素）
  これらは、削除した要素のすぐ前後の大きさの値なので、その位置に置いても「左は小さく、右は大きい」関係が崩れません。
reasoning: |
  1. 12の左の部分木は {10, 9, 11}、右の部分木は {14, 13, 15} です。
  2. 移動できる候補は、
  | 左の部分木の最大値：<b>11</b>
  | 右の部分木の最小値：<b>13</b>
  3. 選択肢（9, 10, 13, 14）のうち、候補に当たるのは <b>13</b> です。
  4. 確認：12の位置に13を移すと、左の子孫 {10, 9, 11} はすべて13より小さく、右の子孫 {14, 15} はすべて13より大きいので、性質は保たれます。また、親の8より大きいので、8の右側に置いても問題ありません。
  5. 正解は<b>ウ</b>です。
choices:
  ア: 9を移動すると、左の子孫に残る10や11が9より大きくなり、「左の子孫は小さい」という性質が崩れます。誤り。
  イ: 10を移動すると、左の子孫に残る11が10より大きくなり、性質が崩れます。誤り。
  ウ: 13は右の部分木の最小値なので、12の位置に移動しても、左はすべて小さく右はすべて大きい関係が保たれます。<b>正解</b>。
  エ: 14を移動すると、右の子孫に残る13が14より小さくなり、「右の子孫は大きい」という性質が崩れます。誤り。
example: |
  背の順に並んだ列から1人抜けたとき、その場所に入ってもらうなら、抜けた人の「すぐ下の背の人」か「すぐ上の背の人」なら、並び順が崩れません。2分探索木の削除も同じ考え方です。
review:
  - 子を2つもつ節点の削除は、左部分木の最大値か右部分木の最小値をその位置に移す。
  - 移動後に「左の子孫＜節点＜右の子孫」が保たれるかを確かめる。
