q: 44
answer: イ
theme: |
  送信元を偽った「なりすましメール」を見破る送信ドメイン認証技術のうち、「SPF」の仕組みを問う問題です。似た技術DKIMとの違いがポイントです。
basics: |
  <b>なりすましメール</b>：電子メールの送信元アドレスは、技術的には簡単に偽装できます。そのため、実在の会社を名乗った詐欺メールが送られてきます。
  <b>送信ドメイン認証</b>：受信側が「本当にそのドメインから送られたメールか」を確認する技術です。代表例が2つあります。
  - <b>SPF（Sender Policy Framework）</b>：送信元ドメインの管理者が、「うちのドメインのメールは、このIPアドレスのサーバからしか送りません」という一覧を<b>DNSに公開</b>しておきます。受信側は、実際にメールを送ってきたサーバの<b>IPアドレス</b>がその一覧に含まれるかを照合します。
  - <b>DKIM（DomainKeys Identified Mail）</b>：送信側がメールに<b>デジタル署名</b>を付け、受信側がDNSに公開された公開鍵で署名を検証します。
reasoning: |
  1. SPFで照合するのは、「メールの送信元ドメイン」と「メールを送ってきたサーバのIPアドレス」です。
  2. 受信サーバは、送信元ドメインのDNSに登録されたSPFレコード（送信を許可されたIPアドレス一覧）を調べ、実際の送信サーバのIPアドレスが含まれていれば正当、含まれていなければなりすましの疑いあり、と判断します。
  3. この説明は<b>イ</b>です。
choices:
  ア: デジタル署名を使って送信元ドメインの詐称がないことを確認するのは<b>DKIM</b>の仕組みです。SPFは署名ではなくIPアドレスで確認します。誤り。
  イ: 受信サーバが、送信元のドメイン情報と、送信したサーバのIPアドレスから詐称がないことを確認する。<b>SPF</b>の仕組みです。<b>正解</b>。
  ウ: 送信サーバがすべてのメールを保存（アーカイブ）するのは、内部統制や証跡管理のための<b>メールアーカイブ</b>の仕組みで、なりすまし対策ではありません。誤り。
  エ: 上司の承認が得られるまで送信を保留するのは、誤送信対策などのための<b>メール送信承認（上長承認）</b>の機能で、SPFではありません。誤り。
example: |
  会社の「出入り業者リスト」に例えると、SPFは「○○社の配達員は、この車両番号（IPアドレス）の車でしか来ません」とあらかじめ公表しておく仕組みです。受付は、来た車のナンバーがリストにあるか確認します。DKIMは、荷物に「本物の社印（署名）」が押してあるかを確認する仕組みです。
review:
  - SPF＝DNSに公開した送信許可IPアドレスと、実際の送信サーバのIPアドレスを照合する。
  - DKIM＝デジタル署名で送信元を検証する。SPF（IPアドレス）とDKIM（署名）を混同しない。
