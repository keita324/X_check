q: 55
answer: エ
category: サービスマネジメント
theme: |
  サービスマネジメントの規格JIS Q 20000-1で定義されている用語のうち、「継続的改善」の定義を、プロセス・SMS・可用性の定義と区別する問題です。
basics: |
  <b>JIS Q 20000-1</b>：ITサービスなどを提供する組織が、サービスを適切に管理するための仕組み（<b>SMS：サービスマネジメントシステム</b>）の要求事項を定めた規格です。用語は次のように定義されています。
  - <b>継続的改善</b>：<b>パフォーマンスを向上</b>するために<b>繰り返し行われる</b>活動。
  - <b>プロセス</b>：意図した結果を生み出すために、インプットを使用する、相互に関連する又は相互に作用する一連の活動。
  - <b>サービスマネジメント</b>：価値を提供するため、サービスの計画立案、設計、移行、提供及び改善のための組織の活動及び資源を、指揮し、管理する、一連の能力及びプロセス。
  - <b>可用性</b>：要求されたときに、要求どおりに使用可能である能力（サービスを中断なしに、又は合意した可用性を一貫して提供する能力）。
reasoning: |
  1. 「継続的改善」は、文字どおり「良くするための活動を、継続的に（繰り返し）行う」ことです。
  2. 「パフォーマンスを向上するために繰り返し行われる活動」という<b>エ</b>が、継続的改善の定義です。
choices:
  ア: 意図した結果を得るためにインプットを使用する、相互に関連する又は相互に作用する一連の活動は、<b>プロセス</b>の定義です。誤り。
  イ: 価値を提供するため、サービスの計画立案・設計・移行・提供・改善のための活動と資源を指揮し管理する一連の能力及びプロセスは、<b>サービスマネジメント</b>の定義です。誤り。
  ウ: サービスを中断なしに、又は合意した可用性を一貫して提供する能力は、<b>可用性</b>（サービス継続）に関する説明です。誤り。
  エ: パフォーマンスを向上するために繰り返し行われる活動は、<b>継続的改善</b>の定義です。<b>正解</b>。
example: |
  部活動で、試合のたびに「今日の課題」を見つけて練習メニューを見直し、また次の試合で確かめる…を繰り返して少しずつ強くなっていくのが継続的改善です。1回だけの大改革ではなく、PDCAサイクルを回し続けることがポイントです。
review:
  - 継続的改善＝パフォーマンスを向上するために繰り返し行われる活動（PDCAの継続）。
  - プロセス（インプットを使う一連の活動）、サービスマネジメント（サービスの計画〜改善を指揮・管理する能力）、可用性（使える能力）と区別する。
