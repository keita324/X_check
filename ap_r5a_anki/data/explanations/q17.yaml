q: 17
answer: ア
category: ソフトウェア
theme: |
  優先度の高いタスクが低いタスクを中断（プリエンプション）して実行されるスケジューリングで、優先度の低いタスクBが自分の周期内に処理を終えられる組合せを、時間の流れを追って判定する問題です。
basics: |
  <b>周期タスク</b>：決められた周期ごとに起動され、次の周期が来るまでに処理を終える必要があるタスクです（リアルタイムシステムで使われる）。
  <b>プリエンプティブな優先度ベースのスケジューリング</b>：優先度の高いタスクが実行可能になると、低いタスクを<b>中断</b>して、高いタスクを先に実行します。
  この問題では、タスクA（優先度高）とタスクBはどちらも時刻0に起動するとして、
  - Aは、自分の周期ごとに起動し、最大実行時間だけCPUを使う。
  - Bは、Aが動いていない時間にだけ実行できる。
  - Bの周期内に、Bの最大実行時間分のCPU時間を確保できれば「周期内に完了できる」。
reasoning: |
  各組合せについて、Bの周期の間にBが使える時間を数えます（単位：ミリ秒）。
  <b>ア</b>（A：実行2・周期4、B：実行3・周期8）
  | A：0〜2、4〜6 に実行 → Bは 2〜4、6〜8 に実行できる
  | Bは2〜4で2、6〜7で1、合計3を7ミリ秒の時点で完了（周期8以内）→ <b>完了できる</b>
  <b>イ</b>（A：3・6、B：4・9）
  | A：0〜3、6〜9 → Bが使えるのは 3〜6 の3だけ → 4に足りない
  <b>ウ</b>（A：3・5、B：5・13）
  | A：0〜3、5〜8、10〜13 → Bが使えるのは 3〜5、8〜10 の4だけ → 5に足りない
  <b>エ</b>（A：4・6、B：5・15）
  | A：0〜4、6〜10、12〜15（15で周期終了）→ Bが使えるのは 4〜6、10〜12 の4だけ → 5に足りない
  Bが周期内に処理を完了できるのは<b>ア</b>だけです（プログラムで1ミリ秒ずつシミュレーションしても同じ結果になります）。
choices:
  ア: Bは8ミリ秒の周期内に、Aが動いていない2〜4と6〜7の合計3ミリ秒で処理を完了できます。<b>正解</b>。
  イ: Bの周期9ミリ秒の間に、Aが0〜3と6〜9を使うため、Bが使えるのは3ミリ秒だけで、必要な4ミリ秒に足りません。誤り。
  ウ: Bの周期13ミリ秒の間に、Aが3回（計9ミリ秒）実行するため、Bが使えるのは4ミリ秒だけで、必要な5ミリ秒に足りません。誤り。
  エ: Bの周期15ミリ秒の間に、Aが計11ミリ秒使うため、Bが使えるのは4ミリ秒だけで、必要な5ミリ秒に足りません。誤り。
example: |
  社長（タスクA）から定期的に急ぎの仕事が入る社員が、合間に自分の仕事（タスクB）を締切までに終えられるかを考えるのと同じです。社長の仕事の時間を時間割に先に書き込み、残った空き時間の合計が自分の仕事の時間以上あれば間に合います。
review:
  - プリエンプティブな優先度スケジューリングでは、高優先度タスクの実行時間を先に時間軸に配置し、低優先度タスクは残りの時間で実行する。
  - 低優先度タスクの周期内の空き時間の合計が、その実行時間以上あるかで判定する。
