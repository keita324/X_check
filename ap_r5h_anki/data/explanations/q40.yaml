q: 40
answer: イ
category: セキュリティ
theme: |
  ソフトウェアの既知の脆弱性に付けられる「共通の識別番号」がどれかを、脆弱性に関する似た略語（CCE、CVSS、CWE）と区別する問題です。
basics: |
  <b>脆弱性</b>：ソフトウェアのセキュリティ上の欠陥です。同じ脆弱性について、セキュリティ製品やニュース、ベンダーの情報で話がかみ合うように、共通の基準や番号が定められています。
  - <b>CVE（Common Vulnerabilities and Exposures）</b>：個々の<b>既知の脆弱性に付ける一意の識別番号</b>。例：CVE-2021-44228（Log4jの脆弱性）。
  - <b>CVSS（Common Vulnerability Scoring System）</b>：脆弱性の<b>深刻度を評価</b>する共通の手法（0.0〜10.0で点数化）。
  - <b>CWE（Common Weakness Enumeration）</b>：脆弱性の<b>種類（タイプ）</b>を分類した一覧（例：SQLインジェクション、バッファオーバーフロー）。
  - <b>CCE（Common Configuration Enumeration）</b>：セキュリティに関係する<b>設定項目</b>を識別するための一覧。
reasoning: |
  1. 「既知の脆弱性を一意に識別する」ための情報は、脆弱性1つ1つに付ける識別番号＝<b>CVE</b>です。
  2. 正解は<b>イ</b>です。
choices:
  ア: CCEは、OSやソフトウェアのセキュリティ設定項目を識別するための一覧です。脆弱性そのものの識別番号ではありません。誤り。
  イ: CVEは、個々の既知の脆弱性に付けられる一意の識別番号です。<b>正解</b>。
  ウ: CVSSは、脆弱性の深刻度を点数で評価する手法です。脆弱性を識別する番号ではありません。誤り。
  エ: CWEは、脆弱性の種類（タイプ）を分類した一覧です。個々の脆弱性を一意に識別するものではありません。誤り。
example: |
  病院に例えると、CVEは「患者一人一人の診察券番号」、CWEは「病気の分類（風邪、骨折など）」、CVSSは「重症度（軽症〜重症）」、CCEは「健康診断の検査項目」です。「CVE-2021-44228の対策は済んだ？」と番号で話せば、誰とでも同じ脆弱性の話ができます。
review:
  - CVE＝個々の既知の脆弱性の一意な識別番号（CVE-年-番号）。
  - CVSS（深刻度の評価）、CWE（脆弱性の種類の分類）、CCE（セキュリティ設定項目の識別）と区別する。
