q: 4
answer: イ
theme: |
  AI（機械学習）でよく起こる失敗パターン「過学習（オーバーフィッティング）」の意味を問う問題です。他の選択肢には機械学習の代表的な手法が並んでいます。
basics: |
  <b>機械学習</b>：人がルールを1つずつ書く代わりに、大量のデータ（例：猫の写真と「猫」という正解ラベル）をコンピュータに見せて、規則性を自動で見つけさせる技術です。学習の結果できあがった判断の仕組みを<b>モデル</b>と呼びます。

  <b>訓練データ</b>：学習に使うデータ。<b>未知のデータ（テストデータ）</b>：学習には使っていない新しいデータ。AIの本当の実力は、未知のデータに正しく答えられるか（<b>汎化性能</b>）で測ります。

  <b>過学習</b>：訓練データに合わせすぎて、そのデータ特有の細かなクセや偶然の誤差（ノイズ）まで覚え込んでしまう状態です。その結果、訓練データでは高精度なのに、未知のデータでは精度が落ちます。
reasoning: |
  1. 過学習の特徴は「訓練データでは成績が良い」「未知のデータでは成績が悪い」という<b>ギャップ</b>です。
  2. この2つを同時に述べている選択肢を探すと、イ「訓練データに対しては精度が高い一方で、未知のデータに対しては精度が下がる」が当てはまります。
  3. 他の選択肢は、それぞれ別の学習手法の説明です。正解は<b>イ</b>です。
choices:
  ア: 学習済みモデルを別の領域に再利用して効率よく学習させるのは<b>転移学習</b>です。例えば、一般的な画像で学習したモデルを医療画像用に少しだけ追加学習させる方法です。過学習ではありません。
  イ: 訓練データでは高精度、未知のデータでは低精度。これが<b>過学習</b>の定義どおりです。<b>正解</b>。
  ウ: 期待する結果とのずれ（誤差）を、出力側から入力側へ逆向きに伝えて調整するのは<b>誤差逆伝播法（バックプロパゲーション）</b>です。ニューラルネットワークの学習方法そのもので、失敗状態を指す言葉ではありません。
  エ: 成功したら「報酬」を与えて、どう行動すれば良いかを試行錯誤で学ばせるのは<b>強化学習</b>です（囲碁AIなど）。過学習ではありません。
example: |
  過去問の「答えの記号の並び」だけを丸暗記した受験生を想像してください。同じ過去問なら満点ですが、本番で新しい問題が出ると解けません。これが過学習です。理屈を理解して初めて、見たことのない問題（未知のデータ）にも対応できます。
review:
  - 過学習＝「訓練データでは高精度、未知のデータでは低精度」と、2つの精度の差で説明できるようにする。
  - 転移学習（別領域へ再利用）・誤差逆伝播法（誤差を逆向きに伝える）・強化学習（報酬）の3つを区別する。
