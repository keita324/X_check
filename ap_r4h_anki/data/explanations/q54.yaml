q: 54
answer: ア
category: プロジェクトマネジメント
theme: |
  プロジェクトのリスク対応で作る「コンティンジェンシ計画」に何を決めるかを、資源計画・品質計画・コミュニケーション計画と区別する問題です。
basics: |
  <b>リスク</b>：プロジェクトの目標に影響する、まだ起きていない不確かな出来事です（例：主要メンバーの離脱、納品の遅れ）。
  <b>コンティンジェンシ計画（緊急時対応計画）</b>：特定のリスクが<b>実際に起きたとき（あらかじめ決めた条件を満たしたとき）にだけ実行する対応策</b>を、前もって決めておく計画です。
  例：「外注先の納品が予定より1週間以上遅れたら（条件）、社内要員2名を追加投入する（対応策）」

  プロジェクトの計画には、ほかにも次のようなものがあります。
  - <b>資源計画</b>：各活動に必要な人員・設備・材料などを決める。
  - <b>品質計画</b>：適用する品質の要求事項や規格、品質の確認方法を決める。
  - <b>コミュニケーション計画</b>：ステークホルダ（利害関係者）の情報や、誰にどんな情報をどう伝えるかを決める。
reasoning: |
  1. コンティンジェンシ計画の特徴は「条件付き」の対応策であることです。リスクが顕在化したとき（条件を満たしたとき）にだけ実行します。
  2. 「あらかじめ定義された、ある条件のときにだけ実行する対応策」という<b>ア</b>が正解です。
choices:
  ア: あらかじめ定義された条件のときにだけ実行する対応策は、コンティンジェンシ計画で決める内容です。<b>正解</b>。
  イ: 活動リストの活動ごとに必要な資源を決めるのは、<b>資源計画</b>（資源の見積り）の内容です。誤り。
  ウ: プロジェクトに適用する品質の要求事項や規格を決めるのは、<b>品質マネジメント計画</b>の内容です。誤り。
  エ: ステークホルダの情報やコミュニケーションのニーズを決めるのは、<b>ステークホルダ登録簿・コミュニケーション計画</b>の内容です。誤り。
example: |
  遠足の計画で、「降水確率が50%以上なら（条件）、行き先を科学館に変更する（対応策）」と決めておくのがコンティンジェンシ計画です。晴れた日には実行されず、条件を満たしたときにだけ発動します。
review:
  - コンティンジェンシ計画＝リスクが顕在化した（決めた条件を満たした）ときにだけ実行する対応策を、事前に決めておく計画。
  - 資源計画（活動ごとの資源）、品質計画（要求事項・規格）、コミュニケーション計画（ステークホルダと情報伝達）と区別する。
