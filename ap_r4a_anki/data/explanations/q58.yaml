q: 58
answer: エ
theme: |
  ISMS（情報セキュリティマネジメントシステム）の内部監査で、規格（JIS Q 27001）の要求事項に合っていない＝「指摘事項」にすべき状況を選ぶ問題です。
basics: |
  <b>ISMS</b>：組織が情報セキュリティを管理するための仕組み（ルール・体制・手順）。その要求事項を定めた規格が <b>JIS Q 27001</b>（ISO/IEC 27001）です。
  <b>内部監査</b>：組織が自分たちのISMSが規格や社内ルールどおりに運用されているかを点検する活動。規格や手順に<b>違反している状況</b>を見つけたら「指摘事項」として報告書に書きます。

  <b>リスクアセスメントの手順</b>（JIS Q 27001 6.1.2）
  規格では、リスクアセスメントを行う前に、次のような基準を<b>あらかじめ確立しておく</b>ことを求めています。
  - <b>リスク受容基準</b>：「このレベルまでのリスクなら受け入れる」という判断基準
  - 情報セキュリティリスクアセスメントを実施するための基準
  基準が先にないと、リスクを評価するときの「物差し」がなく、評価結果が恣意的になってしまいます。
reasoning: |
  1. ア・イ・ウは、いずれも「ルールどおりに正しく運用されていた」状況なので、指摘する必要はありません。
  2. エ「リスクアセスメントを実施した<b>後に</b>、リスク受容基準を決めていた」は、規格が求める順序（基準を決めてからアセスメントを行う）に反しています。
  3. 規格との不適合なので、指摘事項として報告書に記載すべきなのは<b>エ</b>です。
choices:
  ア: USBメモリの使用を、定められた手順に従って許可していたのは、ルールどおりの適切な運用です。指摘事項ではありません。
  イ: 個人情報の誤廃棄事故を、規定どおりに主務官庁などへ報告していたのは、適切なインシデント対応です。事故自体は問題ですが、この記述は「規定どおり報告していた」という適切な状況です。
  ウ: マルウェアスキャンでスパイウェアを検知し駆除していたのは、管理策が有効に機能している状況です。指摘事項ではありません。
  エ: リスク受容基準は、リスクアセスメントの前に確立しておく必要があります。順序が逆なのは規格の要求事項への不適合なので、指摘事項として記載すべきです。<b>正解</b>。
example: |
  試験の採点で、答案を全部見てから「合格点を何点にするか」を決めたら、特定の人を合格させるために基準を動かせてしまいます。合格基準（リスク受容基準）は、採点（リスクアセスメント）の前に決めておかなければなりません。
review:
  - JIS Q 27001では、リスク受容基準をリスクアセスメントの「前」に確立する必要がある。順序が逆なら不適合（指摘事項）。
  - 監査の指摘事項は「規格・ルールに違反している状況」。ルールどおり運用されている記述（ア・イ・ウ）は指摘しない。
