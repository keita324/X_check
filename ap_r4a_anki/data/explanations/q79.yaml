q: 79
answer: エ
theme: |
  請負契約で、受注者の作業者が発注者の事業所で働く場合に、「指揮命令権」と「雇用契約」がどうなるかを問う問題です。偽装請負にならないための基本ルールです。
basics: |
  <b>請負契約</b>：受注者が仕事の完成を約束する契約です。作業のやり方や作業者への指示は、<b>受注者が自分で行います</b>。
  <b>指揮命令権</b>：作業者に「この作業をこう進めて」「何時まで残業して」などと、仕事の指示を出す権限です。
  <b>雇用契約</b>：作業者と会社との間の、働く・給料を払う関係の契約です。

  <b>請負と派遣の違い</b>
  | 請負：指揮命令するのは受注者。作業者は受注者に雇われたまま。
  | 労働者派遣：派遣先（発注者側）が作業者に指揮命令できる。
  請負契約なのに発注者が作業者に直接指示を出すと、実態は労働者派遣なのに派遣法のルールを守っていない<b>偽装請負</b>となり、違法になります。
reasoning: |
  1. 請負契約では、作業場所が発注者の事業所であっても、<b>指揮命令権は受注者</b>にあり、発注者にはありません。
  2. 作業者は受注者に雇われたままで、作業場所が変わるからといって発注者と新たに雇用契約を結ぶ必要はありません。
  3. 「指揮命令権は発注者になく、作業者は新たな雇用契約を発注者と結ぶことなく、発注者の事業所で作業を実施する」という<b>エ</b>が正解です。
choices:
  ア: 請負契約では発注者に指揮命令権はありません。また、発注者と新たな雇用契約を結ぶ必要もありません。誤り。
  イ: 雇用契約の点は正しいですが、発注者に指揮命令権があるとしている点が誤りです。発注者が直接指揮命令すると偽装請負になります。誤り。
  ウ: 指揮命令権の点は正しいですが、作業場所が発注者の事業所であっても、発注者と新たに雇用契約を結ぶ必要はありません。誤り。
  エ: 指揮命令権は発注者になく（受注者にある）、作業者は発注者と雇用契約を結ばずに発注者の事業所で作業する。<b>正解</b>。
example: |
  家のリフォームを工務店に頼んだ場合、工事は施主の家で行われますが、職人に「今日はここを塗って」と指示するのは工務店の現場監督です。施主が直接職人に指示を出したり、職人を施主が雇い直したりはしません。施主が要望を伝えたいときは、工務店の責任者を通します。
review:
  - 請負契約では、作業場所が発注者の事業所でも、指揮命令権は受注者にあり、発注者は作業者に直接指示できない。
  - 作業者の雇用契約は受注者との間のまま。発注者が直接指揮命令すると偽装請負になる。
