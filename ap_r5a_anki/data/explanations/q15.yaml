q: 15
answer: エ
category: システム構成要素
theme: |
  アクティブ−スタンバイ構成（本番機と待機機の2台）のシステムで、故障時の切替え（フェールオーバー）時間を考慮して、システム全体の稼働率を計算する問題です。
basics: |
  <b>稼働率</b>：全体の時間のうち、システムが使える時間の割合です。
  | 稼働率 ＝ MTBF ÷ (MTBF ＋ MTTR)
  （MTBF：平均故障間隔＝動いている時間、MTTR：平均修理時間＝止まっている時間）

  <b>アクティブ−スタンバイ構成</b>：普段はアクティブ（本番）側のサーバが処理し、スタンバイ（待機）側は待っています。アクティブ側が故障すると、<b>フェールオーバー</b>（待機側への切替え）を行い、待機側が処理を引き継ぎます。故障したサーバの修理は、その後、システムを止めずに行えます。
  問題の条件：MTBF 99時間、MTTR 10時間、フェールオーバーに2時間、二重障害（両方同時の故障）は起きない。
reasoning: |
  1. アクティブ側が故障しても、システムが止まるのは<b>フェールオーバーの2時間だけ</b>です。故障したサーバの修理（10時間）は、待機側に切り替わった後に行うので、システムの停止時間には含まれません（二重障害は起きない前提）。
  2. したがって、システムとしては「99時間動いて、2時間止まる」の繰り返しになります。
  | 稼働率 ＝ 99 ÷ (99 ＋ 2) ＝ 99 ÷ 101 ≒ <b>0.98</b>
  3. 正解は<b>エ</b>です。
choices:
  ア: 0.82は、1台の稼働率 99÷109≒0.91 を2回掛けた値（0.91×0.91≒0.82）で、2台を<b>直列</b>につないだ場合の計算です。アクティブ−スタンバイ構成では、どちらか一方が動けばよいので誤り。
  イ: 0.89は、99÷(99＋10＋2)≒0.89 で、修理時間10時間とフェールオーバー時間2時間の両方を停止時間に含めた値です。修理中は待機側が処理を続けているので、修理時間は停止時間に含めません。誤り。
  ウ: 0.91は、99÷(99＋10) で、サーバ1台だけの稼働率です。待機側への切替えによって停止時間が短くなる効果を考慮していません。誤り。
  エ: 0.98。システムが止まるのはフェールオーバーの2時間だけなので、99÷(99＋2)≒0.98 です。<b>正解</b>。
example: |
  タクシー会社で、走っている車（アクティブ）が故障しても、待機中の車（スタンバイ）にお客さんを乗り換えてもらえば、止まるのは乗り換えにかかる時間だけです。故障した車の修理は、お客さんを待たせずに車庫で行えます。
review:
  - アクティブ−スタンバイ構成のシステムの停止時間は、フェールオーバー（切替え）の時間だけ。修理時間は含めない（二重障害なしの前提）。
  - 稼働率＝MTBF÷(MTBF＋停止時間)。直列（0.82）、修理時間を含める（0.89）、1台のみ（0.91）のひっかけに注意する。
