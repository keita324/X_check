q: 76
answer: ウ
theme: |
  アイデア発想法のうち、たくさん出た事実やアイデアを「まとめる」ための収束技法を選ぶ問題です。アイデアを「広げる」発散技法との区別がポイントです。
basics: |
  問題解決やアイデア出しの技法は、大きく2種類に分けられます。
  - <b>発散技法</b>：アイデアをできるだけ多く、幅広く出すための技法。
  - <b>収束技法</b>：出てきたたくさんのアイデアや事実を整理し、まとめるための技法。

  <b>親和図法</b>：カードに書いた多数の事実や意見を、内容の似たもの（親和性のあるもの）どうしでグループにまとめ、グループに見出しを付けて、問題の構造を明らかにする方法です。文化人類学者の川喜田二郎が考案した<b>KJ法</b>が基になっています。代表的な<b>収束技法</b>です。
reasoning: |
  1. 問題文は「引き出された多くの事実やアイデアを、類似するものでグループピングしていく<b>収束</b>技法」です。
  2. 似たものをグループにまとめるのは親和図法です。
  3. NM法・ゴードン法・ブレーンストーミングは、いずれもアイデアを生み出す<b>発散</b>技法です。
  4. 正解は<b>ウ</b>です。
choices:
  ア: NM法は、テーマに関連する例え（類比：アナロジー）を手がかりに発想を広げる<b>発散技法</b>です（考案者 中山正和のイニシャルが由来）。誤り。
  イ: ゴードン法は、本当のテーマを参加者に知らせず、抽象的なキーワードだけを示して自由に発想させる<b>発散技法</b>です。誤り。
  ウ: 親和図法は、多くの事実やアイデアを類似するものでグループ化してまとめる<b>収束技法</b>です。<b>正解</b>。
  エ: ブレーンストーミングは、「批判しない」「自由奔放」「質より量」「結合・便乗歓迎」のルールで、たくさんのアイデアを出す<b>発散技法</b>です。誤り。
example: |
  文化祭の出し物を決める会議で、まずブレーンストーミングで「お化け屋敷」「カフェ」「迷路」「クレープ屋」…と付箋に書き出し（発散）、次に似たもの同士を「飲食系」「アトラクション系」とグループに分けて整理する（収束＝親和図法）、という流れが典型です。
review:
  - 親和図法（KJ法が基）＝多数の事実・アイデアを似たものでグループ化する収束技法。
  - ブレーンストーミング・NM法・ゴードン法は発散技法、と「広げる／まとめる」で分類する。
