q: 28
answer: ア
category: データベース
theme: |
  データベースやWeb APIの設計で重要な性質「べき等（idempotent）」の意味を問う問題です。
basics: |
  <b>べき等（冪等）</b>：同じ操作を<b>1回行っても、何回繰り返しても、結果が同じになる</b>性質です。
  - べき等な操作の例：「在庫数を10にする」（何回実行しても10）、データの検索
  - べき等でない操作の例：「在庫数を1増やす」（実行するたびに増える）
  ネットワークの障害で応答が返ってこなかったとき、べき等な操作なら<b>安心して再実行（リトライ）</b>できるので、システム設計で重視されます。

  関連用語
  - <b>原子性</b>（トランザクションのACID特性のA）：全部成功するか、何も実行されないかのどちらか。
  - <b>直列化可能性</b>：複数のトランザクションを同時に実行した結果が、順番に実行した結果と同じになること。
  - <b>レプリケーション</b>：あるノード（サーバ）での処理を、他のノードにも複製すること。
reasoning: |
  1. べき等は「複数回実行しても、1回実行した結果と同じ」という性質です。
  2. 「同一の操作を複数回実行した結果と、一回しか実行しなかった結果が同一になる操作」という<b>ア</b>が正解です。
choices:
  ア: 同一の操作を複数回実行した結果と1回だけ実行した結果が同一になる操作は、<b>べき等</b>な操作です。<b>正解</b>。
  イ: トランザクション内の全処理が成功したか、何も実行されなかったかのどちらかにしかならないのは、<b>原子性（Atomicity）</b>の説明です。誤り。
  ウ: 1つのノードへのレコード挿入を他のノードでも実行するのは、<b>レプリケーション（複製）</b>の説明です。誤り。
  エ: 複数のトランザクションを同時に実行した結果と、順番に実行した結果が同一になるのは、<b>直列化可能性</b>（独立性）の説明です。誤り。
example: |
  エレベーターの「5階」ボタンは、何回押しても5階に行くだけで、結果は変わりません（べき等）。一方、自動販売機の購入ボタンを、反応がないからと何度も押すと、その回数分だけ買えてしまうかもしれません（べき等でない）。ネット通販の「注文確定」ボタンを二重に押しても1回分の注文にするには、べき等になるような工夫が必要です。
review:
  - べき等＝同じ操作を何回実行しても、1回実行した結果と同じになる性質。障害時に安全にリトライできる。
  - 原子性（全部か無か）、直列化可能性（同時実行＝順次実行の結果）、レプリケーション（複製）と区別する。
