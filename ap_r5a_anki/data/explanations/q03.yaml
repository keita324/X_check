q: 3
answer: ア
category: 基礎理論
theme: |
  演算子を後ろに書く「逆ポーランド表記法（後置記法）」の式を、スタックを使って順に計算する問題です。
basics: |
  <b>中置記法</b>：ふだん使う書き方。演算子を数の間に置く（A＋B）。
  <b>逆ポーランド表記法（後置記法）</b>：演算子を2つの数の<b>後ろ</b>に置く（AB＋）。かっこが不要で、コンピュータが計算しやすい形です。

  <b>計算の手順（スタックを使う）</b>
  - 左から1つずつ読む。
  - 数（変数）なら、スタック（積み重ねの箱）に積む。
  - 演算子なら、スタックの<b>上から2つ</b>を取り出して計算し、結果をスタックに戻す。このとき、<b>先に積んだ方が左</b>、後に積んだ方が右になる（引き算・割り算では順序に注意）。
reasoning: |
  式 A B C D − × ＋ を、A＝16、B＝8、C＝4、D＝2 で計算します。
  | A,B,C,D を順に積む：[16, 8, 4, 2]
  | −：上の2つ C と D を取り出し C − D ＝ 4 − 2 ＝ 2 → [16, 8, 2]
  | ×：B と 2 を取り出し 8 × 2 ＝ 16 → [16, 16]
  | ＋：A と 16 を取り出し 16 ＋ 16 ＝ <b>32</b> → [32]
  中置記法に直すと A ＋ B × (C − D) です。
  正解は<b>ア</b>です。
choices:
  ア: 32。A＋B×(C−D)＝16＋8×2＝32 で、計算結果と一致します。<b>正解</b>。
  イ: 46は、計算結果の32と一致しません。演算子をどの数に適用するかを取り違えると、別の値になります。誤り。
  ウ: 48は、(A＋B)×(C−D)＝24×2 のように、足し算を先に行ってしまった値です。後置記法では、演算子は直前の2つの値に適用します。誤り。
  エ: 94は、計算結果の32と一致しません。誤り。
example: |
  お皿を積み重ねるイメージです。数のお皿を順に積み、演算子が来たら一番上の2枚を取って計算し、結果の1枚を戻します。最後に1枚だけ残ったお皿が答えです。電卓の中や、プログラミング言語の処理系でもこの方法が使われています。
review:
  - 後置記法はスタックで計算する：数は積む、演算子は上の2つを取り出して計算し結果を積む。
  - 取り出した2つは「先に積んだ方が左」。A B C D − × ＋ ＝ A＋B×(C−D) と中置記法に直せるようにする。
