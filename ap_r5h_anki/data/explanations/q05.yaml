q: 5
answer: ウ
category: アルゴリズムとプログラミング
theme: |
  メモリの空き領域の中から「要求量以上で最小のもの」を素早く見つけるには、空き領域をどんなデータ構造で管理すればよいかを問う問題です。
basics: |
  <b>可変長のメモリ割当て</b>：プログラムから「○バイト貸して」と要求されるたびに、空き領域から必要な大きさを切り出して貸す方式です。
  <b>最適適合（best-fit）</b>：要求量以上の空き領域のうち、<b>最も小さいもの</b>を選ぶ方法。無駄な余りが少なくなります。

  <b>データ構造と探索の速さ</b>（空き領域の数を n とする）
  - <b>2分探索木</b>：各節点について「左の子孫はキーが小さく、右の子孫は大きい」ように並べた木構造。キーで探すとき、比較のたびに探す範囲がおよそ半分になるので、平均 log<sub>2</sub>n 回程度の比較で見つかる。
  - <b>連結リスト</b>：先頭から順にたどるしかないので、平均で n に比例する時間がかかる。
  - <b>ビットマップ</b>：メモリの各ブロックが空きかどうかを0/1で記録した表。連続した空きを探すには表を端から調べる必要がある。
reasoning: |
  1. 最適適合では「要求量以上で最小の大きさ」を探すので、<b>空き領域の大きさ</b>で探索できる構造が適しています。
  2. 空き領域の大きさをキーとする2分探索木なら、根から「要求量より小さければ右へ、大きければ候補として記録して左へ」と進むだけで、平均 log n 程度の時間で目的の領域が見つかります。
  3. 大きさの順の連結リストでも見つけられますが、先頭から順にたどるので平均 n に比例した時間がかかります。
  4. 平均処理時間が最も短いのは<b>ウ</b>です。
choices:
  ア: アドレスをキーとする2分探索木では、大きさの順に並んでいないので、要求量以上で最小の領域を探すには全部の節点を調べる必要があります。誤り。
  イ: 大きさの小さい順の片方向連結リストなら、先頭からたどって最初に要求量以上になったものが答えですが、平均で要素数に比例した時間がかかり、2分探索木より遅くなります。誤り。
  ウ: 空き領域の大きさをキーとする2分探索木なら、大きさで効率よく探索でき、平均 log n 程度の時間で最適な領域が見つかります。<b>正解</b>。
  エ: アドレスに対応したビットマップでは、空き領域の大きさを知るために連続する0（または1）を端から数える必要があり、時間がかかります。誤り。
example: |
  大きさの違う空き箱がたくさんあり、「30cm以上で一番小さい箱」を探すとします。箱がサイズ順に分類された棚（2分探索木）なら、「30cmより小さいなら右の棚、大きいなら左の棚」と数回たどるだけで見つかります。一列に並べただけ（連結リスト）なら端から順に見ていくしかありません。
review:
  - 最適適合（best-fit）は「要求量以上で最小の空き」を探すので、大きさをキーにした2分探索木が速い（平均 O(log n)）。
  - 連結リストは先頭から順にたどる（O(n)）。探すキー（大きさかアドレスか）と構造のキーが一致しているかに注目する。
