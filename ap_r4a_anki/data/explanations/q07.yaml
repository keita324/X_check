q: 7
answer: エ
theme: |
  XML文書の先頭に書く「XML宣言」で、文字コードの指定（符号化宣言）を省略してよいのはどの文字コードか、を問う問題です。
basics: |
  <b>XML</b>：&lt;name&gt;山田&lt;/name&gt; のようにタグでデータを囲んで構造を表す、データ交換用の言語です。
  <b>XML宣言</b>：文書の先頭に書く &lt;?xml version="1.0" encoding="Shift_JIS"?&gt; のような1行です。
  <b>符号化宣言</b>：その中の encoding="…" の部分で、文書がどの<b>文字コード</b>で書かれているかを示します。

  <b>文字コード</b>：文字をコンピュータ上の数値（バイト列）に対応させるルールです。同じ「あ」でも、文字コードが違えば別のバイト列になります。だから読み手は、どの文字コードかを知る必要があります。

  <b>XMLの決まり</b>：XMLの仕様では、すべてのXML処理系（パーサ）は<b>UTF-8とUTF-16</b>を必ず読めなければなりません。UTF-16はファイル先頭のBOM（バイト順マーク）で、UTF-8は先頭の並びから判別できるため、この2つは符号化宣言を省略できます。
reasoning: |
  1. 符号化宣言を省略できるのは、XML仕様で全処理系の対応が必須とされ、自動判別できる UTF-8 と UTF-16 です。
  2. 選択肢のうち、この2つに当てはまるのは「UTF-16」だけです。
  3. EUC-JP、ISO-2022-JP、Shift-JIS は日本語用のローカルな文字コードで、必ず encoding で明示する必要があります。
  4. 正解は<b>エ</b>です。
choices:
  ア: EUC-JP は主にUNIX系で使われてきた日本語の文字コードです。XMLで使うには符号化宣言が必要です。誤り。
  イ: ISO-2022-JP は主に電子メールで使われてきた日本語の文字コード（JIS コード）です。符号化宣言が必要です。誤り。
  ウ: Shift-JIS は主にWindowsで使われてきた日本語の文字コードです。符号化宣言が必要です。誤り。
  エ: UTF-16 は Unicode の符号化方式の一つで、UTF-8 とともにXML処理系が必ず対応すべきものとされ、符号化宣言を省略できます。<b>正解</b>。
example: |
  国際会議で「公用語は英語」と決まっていれば、英語で話すときにわざわざ「これから英語で話します」と断る必要はありません。XMLにとってのUTF-8/UTF-16は、この「公用語」にあたります。他の言語（Shift-JISなど）を使うときだけ、最初に宣言が必要です。
review:
  - XMLで符号化宣言を省略できるのは UTF-8 と UTF-16 の2つ（Unicode系）だけ、と覚える。
  - EUC-JP・ISO-2022-JP・Shift-JIS は日本語用の文字コードで、XMLでは encoding の明示が必要。
