q: 68
answer: ウ
category: 経営戦略マネジメント
theme: |
  企業の成長の方向性を考えるフレームワーク「アンゾフの成長マトリクス」の説明を、SWOT分析・BSC・プロダクトライフサイクルと区別する問題です。
basics: |
  <b>アンゾフの成長マトリクス</b>：「製品」（既存か新規か）と「市場」（既存か新規か）の2軸で、成長戦略を4つのタイプに分類する手法です。
  | 市場浸透：既存製品 × 既存市場（今の客に今の商品をもっと売る）
  | 市場拡大（新市場開拓）：既存製品 × 新市場（今の商品を新しい客層・地域に売る）
  | 製品開発：新製品 × 既存市場（今の客に新しい商品を売る）
  | 多角化：新製品 × 新市場（新しい商品で新しい市場に出る）

  紛らわしいフレームワーク
  - <b>SWOT分析</b>：強み・弱み（内部環境）、機会・脅威（外部環境）で環境を分析する。
  - <b>BSC（バランススコアカード）</b>：財務・顧客・内部ビジネスプロセス・学習と成長の4つの視点で戦略を具体化する。
  - <b>PLC（プロダクトライフサイクル）</b>：製品の一生を導入期・成長期・成熟期・衰退期に分ける。
reasoning: |
  1. アンゾフの成長マトリクスのキーワードは「市場浸透・市場拡大・製品開発・多角化」の4つのタイプです。
  2. 4つのタイプを挙げて説明している<b>ウ</b>が、アンゾフの成長マトリクスです。
choices:
  ア: 強み・弱み・機会・脅威の4つの要因で、企業を取り巻く環境を分析するのは<b>SWOT分析</b>です。誤り。
  イ: 財務・顧客・内部ビジネスプロセス・学習と成長の4つの視点で事業活動を検討し、アクションプランまで具体化するのは<b>BSC（バランススコアカード）</b>です。誤り。
  ウ: 事業戦略を市場浸透・市場拡大・製品開発・多角化の4つのタイプに分類し、事業の方向性を検討するのは<b>アンゾフの成長マトリクス</b>です。<b>正解</b>。
  エ: 製品ライフサイクルを導入期・成長期・成熟期・衰退期に分類して戦略を立てるのは<b>プロダクトライフサイクル</b>の考え方です。誤り。
example: |
  ラーメン店の成長戦略で考えると、常連客に回数券を売る（市場浸透）、海外に出店する（市場拡大）、今のお客さん向けに餃子を新メニューにする（製品開発）、冷凍食品の工場を作ってスーパーで売る（多角化）、と4つの方向に整理できます。
review:
  - アンゾフの成長マトリクス＝製品（既存/新規）×市場（既存/新規）で、市場浸透・市場拡大・製品開発・多角化の4つに分類。
  - SWOT（強み・弱み・機会・脅威）、BSC（4つの視点）、PLC（導入期〜衰退期）と区別する。
