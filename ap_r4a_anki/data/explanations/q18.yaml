q: 18
answer: ウ
theme: |
  リアルタイムOSで、ハードウェアからの「割込み」がどのように処理されるかを問う問題です。割込み処理ルーチンとタスクの優先関係がポイントです。
basics: |
  <b>リアルタイムOS</b>：決められた時間内に必ず処理を終えることを重視したOSです。自動車のエンジン制御、家電、産業機械など、組込み機器で使われます。
  <b>タスク</b>：OSが管理する通常の処理単位（問題文の定義では「割込み処理以外のプログラム」）。
  <b>プリエンプティブ</b>：実行中のタスクを途中で止めて、より優先度の高いタスクに切り替えられる方式です（preempt＝横取りする）。

  <b>割込み</b>：キー入力、タイマー、センサーの信号など、外部で何かが起きたときに、ハードウェアがCPUに「今すぐ対応して」と知らせる仕組みです。
  <b>割込み処理ルーチン</b>：割込みが起きたときにCPUが実行する専用のプログラムです。割込みはハードウェアの機能なので、OSのタスクの優先度とは別の次元で、<b>どのタスクよりも優先して</b>起動されます。
  <b>コンテキスト</b>：あるプログラムを実行するための状態一式（レジスタの値、実行中の位置など）。
reasoning: |
  1. 問題文の条件：「割込み禁止状態は考慮しない」＝割込みはいつでも受け付けられる。
  2. 割込みが発生すると、CPUは実行中のタスク（たとえ最高優先度のタスクでも）を中断して、割込み処理ルーチンを実行します。
  3. したがって「割込み処理ルーチンは、最も優先度の高いタスクよりも優先して実行される」という<b>ウ</b>が適切です。
  4. その裏返しとして、割込み処理ルーチンが長いと、その間どのタスクも動けないため、システムの応答性が悪くなります（イが誤りの理由）。
choices:
  ア: 「タスクの切替えを禁止」しても、それはタスク同士の切替えを止めるだけで、ハードウェアの割込み自体は受け付けられます（割込み禁止は考慮しない条件）。割込み処理ルーチンは呼び出されるので誤り。
  イ: 割込み処理ルーチンを実行している間は、すべてのタスクが待たされます。処理時間が長いほど応答性は悪くなるので「影響を与えない」は誤り。だから割込み処理ルーチンは短くし、重い処理はタスク側に任せるのが設計の基本です。
  ウ: 割込み処理ルーチンは、最も優先度の高いタスクよりも優先して実行されます。<b>正解</b>。
  エ: 割込み処理ルーチンは、割り込まれたタスクとは<b>別のコンテキスト</b>で実行されます。CPUは割り込まれたタスクの状態を保存してから割込み処理を行い、終わったら状態を戻して再開します。誤り。
example: |
  社内で一番偉い人の会議（最高優先度のタスク）中でも、火災報知器（割込み）が鳴れば、まず避難対応（割込み処理ルーチン）が優先されます。避難対応が長引くと会議はずっと止まったまま（応答性の低下）なので、対応は手短に済ませる必要があります。
review:
  - 割込み処理ルーチンは、どのタスクよりも（最高優先度のタスクよりも）優先して実行される。
  - 割込み処理ルーチンが長いとシステム全体の応答性が落ちるため、短く設計するのが原則。
  - 割込み処理は割り込まれたタスクとは別のコンテキストで実行される（タスクの状態は保存・復元される）。
