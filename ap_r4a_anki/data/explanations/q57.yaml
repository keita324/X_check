q: 57
answer: イ
theme: |
  システム運用での入力データ・出力帳票の正しい管理方法を問う問題です。「情報システム部門が勝手に判断してよいこと・いけないこと」がポイントです。
basics: |
  <b>入力データ</b>：システムに取り込む元データ（伝票、申込書、取引先から受け取ったEDIファイルなど）。
  <b>出力帳票</b>：システムが印刷・出力する書類（請求書、給与明細、売上一覧など）。
  <b>EDI</b>：企業間で受発注などの取引データを電子的にやり取りする仕組み。

  <b>運用管理の基本的な考え方</b>
  - データの<b>内容</b>（正しい値は何か、帳票が必要かどうか）に責任を持つのは、そのデータを使う<b>業務部門（利用部門）</b>です。情報システム部門が独断で変えてはいけません。
  - 重要な帳票は、誰がいつ受け取ったか記録を残して（授受管理）、確実に受け渡します。
  - 入力原票などの取引の証拠は、後で確認や監査ができるよう、決められた期間<b>保管</b>します。
reasoning: |
  1. ア：帳票の出力停止を情報システム部門の判断で行う → 業務部門の確認が必要なので×。
  2. イ：授受管理表で確実に受け渡し、重要なものは業務部門の管理者に手渡し → 適切な管理なので○。
  3. ウ：入力データの誤りを情報システム部門の判断で修正 → 正しい値を知っているのは業務部門なので×。
  4. エ：入力原票を取り込み後すぐ廃棄 → 証拠として一定期間保管すべきなので×。
  5. 正解は<b>イ</b>です。
choices:
  ア: 利用されていないと判断しても、帳票が本当に不要かは業務部門でなければ分かりません。情報システム部門だけの判断で出力を停止するのは不適切で、業務部門と協議・確認してから停止すべきです。誤り。
  イ: 出力帳票を授受管理表などで確実に受け渡し、重要度に応じて業務部門の管理者に手渡しするのは、紛失や情報漏えいを防ぐ適切な管理です。<b>正解</b>。
  ウ: 入力データの誤りは、データの発生元である業務部門が正しい値を確認して修正すべきです。情報システム部門が独断で修正すると、誤った値に書き換えたり不正の温床になったりします。誤り。
  エ: 入力原票やEDI受信ファイルは、後で入力内容を検証したり監査したりするための証拠です。取り込み後すぐに廃棄せず、定められた期間、適切に保管すべきです。誤り。
example: |
  会社の経理で考えると、情報システム部門は「郵便係」、経理部（業務部門）は「書類の持ち主」です。郵便係は書類を確実に配達し、受領のサインをもらいます（イ）。しかし、書類の中身を勝手に直したり（ウ）、読まれていない書類の配達を勝手にやめたり（ア）、控えをすぐ捨てたり（エ）してはいけません。
review:
  - データ・帳票の内容（修正、要否の判断）の責任は業務部門にあり、情報システム部門が独断で変更しない。
  - 重要な出力帳票は授受管理（受渡し記録）を行い、入力原票は証拠として一定期間保管する。
