q: 17
answer: イ
category: ソフトウェア
theme: |
  1本の通信線（I<sup>2</sup>Cバス）を2つのタスクが取り合わないように、順番に使わせる（排他制御する）ためのリアルタイムOSの機能を選ぶ問題です。
basics: |
  <b>I<sup>2</sup>Cバス</b>：マイコンとセンサなどの部品を、少ない信号線でつなぐための通信路です。1本のバスを複数の機器で共有するため、同時に2つの通信を行うことはできません。
  <b>排他制御</b>：共有する資源（ここではバス）を、同時には1つのタスクだけが使えるように制御することです。2つのタスクが同時にバスを使うと、通信が混ざって正しい値を読めなくなります。

  リアルタイムOSの主な機能
  - <b>セマフォ</b>：資源の「使用中／空き」を管理する仕組み。タスクは使う前にセマフォを獲得し、使い終わったら返却します。獲得できなければ、空くまで待ちます。排他制御の代表的な手段です。
  - <b>キュー（メッセージキュー）</b>：タスク間でデータを順番に受け渡すための仕組み。
  - <b>マルチスレッド</b>：1つのプログラムの中で複数の処理の流れを並行して動かす仕組み。
  - <b>ラウンドロビン</b>：一定時間ずつ順番にタスクへCPUを割り当てるスケジューリング方式。
reasoning: |
  1. 求められているのは「2つのタスクがバスを同時に使わないようにする」排他制御の機能です。
  2. 排他制御に使うのはセマフォです。センサを読む前にセマフォを獲得し、読み終えたら返却すれば、もう一方のタスクはその間待たされ、バスの衝突が起きません。
  3. 正解は<b>イ</b>です。
choices:
  ア: キューはタスク間でデータ（メッセージ）を受け渡すための仕組みで、資源を排他的に使わせるための機能ではありません。誤り。
  イ: セマフォは、共有資源の使用権を管理し、同時に1つのタスクだけが使えるようにする排他制御の機能です。<b>正解</b>。
  ウ: マルチスレッドは処理を並行に動かす仕組みで、むしろ資源の取り合いが起こる原因になります。排他制御そのものではありません。誤り。
  エ: ラウンドロビンは、CPUを順番に一定時間ずつ割り当てるスケジューリング方式で、バスの排他制御は行いません。誤り。
example: |
  会社に1つしかない会議室を2つのチームが使う場面で、セマフォは「会議室の鍵」にあたります。鍵を持っているチームだけが会議室を使え、もう一方は鍵が返されるまで待ちます。鍵が1つなので、同時に2チームが入ることはありません。
review:
  - 共有資源（バスなど）の排他制御には、セマフォ（獲得→使用→返却）を使う。
  - キュー（データの受け渡し）、マルチスレッド（並行処理）、ラウンドロビン（CPUの順番割当て）と区別する。
