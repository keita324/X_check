q: 20
answer: エ
category: ハードウェア
theme: |
  回路の機能を後から書き換えられる集積回路「FPGA」の説明を、フラッシュメモリ・ASSP・FPUと区別する問題です。
basics: |
  <b>集積回路（IC・LSI）</b>：たくさんのトランジスタなどを1つのチップにまとめた電子部品です。
  <b>論理回路</b>：AND・OR・NOTなどを組み合わせて計算や制御を行う回路です。

  <b>FPGA（Field Programmable Gate Array）</b>：内部の論理回路の構成を、利用者が<b>後から（基板に取り付けた後でも）プログラムして書き換えられる</b>集積回路です。「Field（現場で）Programmable（プログラム可能な）」という名前のとおりです。試作品や、少量生産の機器、仕様変更が多い用途に使われます。
  対照的に、<b>ASIC</b>（特定用途向け集積回路）は、特定の用途専用に回路を作り込むため、製造後は回路を変更できません。
reasoning: |
  1. FPGAの特徴は「論理回路を、実装後でも書き換え（再プログラム）できる」ことです。
  2. 「論理回路を基板上に実装した後で再プログラムできる集積回路」という<b>エ</b>が正解です。
choices:
  ア: 電気的に記憶内容を書き換えられる不揮発性メモリは、<b>EEPROM</b>や<b>フラッシュメモリ</b>です。記憶装置であり、論理回路を構成するFPGAとは別物です。誤り。
  イ: 特定の分野やアプリケーション用に限定した特定用途向けの汎用集積回路は、<b>ASSP</b>（Application Specific Standard Product）です。回路は製造時に決まっていて書き換えられません。誤り。
  ウ: 浮動小数点数の演算を高速に実行する演算ユニットは、<b>FPU</b>（浮動小数点演算ユニット）です。誤り。
  エ: 論理回路を基板上に実装した後で再プログラムできる集積回路は<b>FPGA</b>です。<b>正解</b>。
example: |
  FPGAは「何度でも組み替えられるブロック玩具」、ASICは「金型で一体成形したプラモデル」のようなものです。ブロック玩具は形を変えて別の物を作れますが、金型の製品は大量生産には向くものの、形を変えることはできません。
review:
  - FPGA＝実装後でも論理回路を書き換えられる集積回路。ASIC/ASSPは製造時に回路が固定。
  - EEPROM・フラッシュメモリ（書換え可能な不揮発性メモリ）、FPU（浮動小数点演算装置）と区別する。
