q: 53
answer: イ
category: プロジェクトマネジメント
theme: |
  過去の実績から作った作業配分モデル（工程ごとの期間の比率）を使って、プロジェクトの全体期間と残りの日数を計算する問題です。
basics: |
  <b>作業配分モデル</b>：プロジェクト全体を1としたときに、各工程にどれだけの工数（作業量）と期間（日数）がかかるかの割合を示したものです。
  - <b>工数比</b>：作業量（人日など）の割合。
  - <b>期間比</b>：かかる日数の割合。
  この問題は「あと何<b>日</b>かかるか」を問うので、<b>期間比</b>を使います。

  期間比の合計：0.25＋0.21＋0.11＋0.11＋0.11＋0.21 ＝ 1.00
reasoning: |
  <b>(1) 全体の期間を求める</b>
  システム要件定義からシステム内部設計までの期間比の合計は
  | 0.25 ＋ 0.21 ＋ 0.11 ＝ 0.57
  これが228日にあたるので、全体の期間は
  | 228 ÷ 0.57 ＝ <b>400日</b>
  <b>(2) 残りの工程の日数</b>
  | プログラム開発：400 × 0.11 ＝ 44日。200本中100本が完了（全プログラムの期間は同一）なので、残りは半分の 22日
  | システム結合：400 × 0.11 ＝ 44日
  | システムテスト：400 × 0.21 ＝ 84日
  <b>(3) 合計</b>
  | 22 ＋ 44 ＋ 84 ＝ <b>150日</b>
  正解は<b>イ</b>です。
choices:
  ア: 140日は、計算結果の150日と一致しません。誤り。
  イ: 150日。全体400日から求めた、プログラム開発の残り22日・システム結合44日・システムテスト84日の合計です。<b>正解</b>。
  ウ: 161日は、計算結果の150日と一致しません。期間を求めるのに工数比を使うなど、比率の取り違えに注意しましょう。誤り。
  エ: 172日は、プログラム開発の期間を半分にせず44日すべてを残りとした値（44＋44＋84）です。100本は既に完了しているので誤り。
example: |
  マラソンで、全体の57%の地点まで228分かかったなら、同じペースで走ると全体は400分です。残りの区間の割合が分かれば、あと何分かかるかを計算できます。今いる区間（プログラム開発）がちょうど半分まで来ていれば、その区間の残りは半分です。
review:
  - 「何日かかるか」は期間比を使う（工数比と取り違えない）。完了した工程の期間比の合計から全体の期間を求める。
  - 途中まで進んだ工程は、進捗に応じて残りの日数だけを数える（ここではプログラム開発の半分）。
