q: 28
answer: ウ
category: データベース
theme: |
  データベースの表を整理する「正規化」の段階（第1・第2・第3正規形）と、それぞれの条件を正しく対応付ける問題です。
basics: |
  <b>正規化</b>：同じデータが何度も重複して記録されないように、表を分割・整理することです。重複があると、更新漏れなどの矛盾が起きやすくなります。
  <b>主キー</b>：表の各行を一意に特定する項目（例：社員番号）。<b>非キー属性</b>：主キー以外の項目。
  <b>関数従属</b>：Aの値が決まるとBの値が1つに決まる関係（A→B）。例：社員番号→社員名。

  正規形の条件（下の段階の条件も満たした上で）
  - <b>第1正規形</b>：<b>繰返し属性がない</b>（1つの欄に複数の値や、同じ種類の項目の繰返しがない）。
  - <b>第2正規形</b>：どの非キー属性も、<b>主キーの一部分（真部分集合）だけに関数従属しない</b>（部分関数従属がない）。主キーが複数項目でできているときに問題になります。
  - <b>第3正規形</b>：どの非キー属性も、<b>主キーに推移的に関数従属しない</b>（主キー→非キー属性X→非キー属性Y のような間接的な従属がない）。
reasoning: |
  1. c「繰返し属性が存在しない」は、表の形を整える最初の段階 → <b>第1正規形</b>
  2. a「主キーの真部分集合に対して関数従属しない」（部分関数従属の排除）→ <b>第2正規形</b>
  3. b「主キーに推移的に関数従属しない」（推移的関数従属の排除）→ <b>第3正規形</b>
  4. 第1＝c、第2＝a、第3＝b の組合せは<b>ウ</b>です。
choices:
  ア: 第1正規形にa、第3正規形にcを当てており、順番が逆です。繰返し属性の排除（c）が最初の段階です。誤り。
  イ: 第1正規形にa、第2正規形にcを当てていて誤りです。誤り。
  ウ: 第1正規形＝c（繰返し属性なし）、第2正規形＝a（部分関数従属なし）、第3正規形＝b（推移的関数従属なし）。<b>正解</b>。
  エ: 第2正規形にb、第3正規形にaを当てており、部分関数従属と推移的関数従属の順番が逆です。誤り。
example: |
  受注表 {受注番号, 商品番号, 商品名, 顧客番号, 顧客名} で考えると、
  - 主キー{受注番号, 商品番号}の一部の「商品番号」だけで「商品名」が決まる → 部分関数従属（第2正規形で分割）
  - 受注番号→顧客番号→顧客名 と、顧客名が間接的に決まる → 推移的関数従属（第3正規形で分割）
review:
  - 第1正規形＝繰返し属性の排除、第2正規形＝部分関数従属の排除、第3正規形＝推移的関数従属の排除。
  - 「主キーの一部分で決まる」が部分、「非キー属性を経由して決まる」が推移的、と言葉の意味で区別する。
