q: 35
answer: エ
category: ネットワーク
theme: |
  ネットワークをソフトウェアで柔軟に制御する「SDN」と、その代表的な技術「OpenFlow」の考え方を問う問題です。
basics: |
  従来のネットワーク機器（ルータやスイッチ）は、1台1台が次の2つの機能を内部に持ち、それぞれ個別に設定する必要がありました。
  - <b>データ転送機能（データプレーン）</b>：届いたパケットを実際に送り出す働き。
  - <b>ネットワーク制御機能（コントロールプレーン）</b>：「どのパケットをどこへ送るか」という経路を決める働き。

  <b>SDN（Software-Defined Networking）</b>：この2つを<b>分離</b>し、制御機能を<b>コントローラ</b>というソフトウェアに集約して、ネットワーク全体を一か所から集中的に制御する考え方です。
  <b>OpenFlow</b>：SDNを実現する代表的な仕組み（プロトコル）。OpenFlowコントローラが、各スイッチ（データ転送だけを担当）に「このパケットはこう転送せよ」という指示を送ります。
reasoning: |
  1. SDN/OpenFlowの要点は「データ転送機能と制御機能を分ける」「制御を集中して行う」ことです。
  2. 「データ転送機能とネットワーク制御機能を論理的に分離し、ネットワーク制御を集中的に行うことを可能にしたアーキテクチャ」という<b>エ</b>が正解です。
choices:
  ア: ドメイン名を管理する世界規模の分散データベースで、IPアドレスの代わりに名前で通信できるようにする仕組みは<b>DNS</b>です。誤り。
  イ: 携帯電話網で、回線交換ではなくパケット交換で音声通話を実現する方式は<b>VoLTE</b>（Voice over LTE）です。誤り。
  ウ: ストレージ装置とサーバを接続し、WWNでノードやポートを識別するストレージ用ネットワークは<b>FC-SAN</b>（ファイバチャネルを使ったSAN）です。誤り。
  エ: データ転送機能と制御機能を論理的に分離し、ネットワーク制御を集中的に行うアーキテクチャは<b>SDN</b>（OpenFlowはその実現技術）です。<b>正解</b>。
example: |
  道路の交通整理に例えると、従来は交差点ごとに警察官が自分の判断で手信号を出していました。SDNは、管制センター（コントローラ）が街全体の交通状況を見て、各交差点の信号機（スイッチ）を一括で制御するようなものです。信号機は指示どおりに切り替えるだけ（データ転送）で、判断は管制センター（制御）が行います。
review:
  - SDN＝データ転送機能と制御機能を分離し、コントローラでネットワーク全体を集中制御する。OpenFlowはその代表的なプロトコル。
  - DNS（名前解決）、VoLTE（パケット交換の音声通話）、FC-SAN（ストレージ用ネットワーク）と区別する。
