q: 34
answer: エ
theme: |
  IPの上の層（トランスポート層など）で動くプロトコルのうち、「コネクションレス」で「確認応答や順序制御をしない」軽量なもの、つまりUDPを選ぶ問題です。
basics: |
  <b>プロトコルの階層</b>：通信は役割ごとに層に分かれています。IP（ネットワーク層）は「宛先まで届ける」担当で、その上のトランスポート層が「届け方の品質」を担当します。
  <b>コネクション型</b>：通信の前に相手と接続を確立し（電話をかけて相手が出るのを確認するイメージ）、届いたかの確認（確認応答）や、順番の並べ直し（順序制御）、届かなかったときの再送を行います。→ <b>TCP</b>
  <b>コネクションレス型</b>：接続の確立をせず、データ（データグラム）をいきなり送ります。確認応答や順序制御はしません。その分、処理が軽く速い。→ <b>UDP</b>
reasoning: |
  1. 問題の条件は「IPの上位階層」「コネクションレス」「データグラム通信」「確認応答や順序制御をもたない」。
  2. TCPと対になるトランスポート層のプロトコルで、これらを満たすのは<b>UDP（User Datagram Protocol）</b>です。名前にも「データグラム」が入っています。
  3. 正解は<b>エ</b>です。
choices:
  ア: ICMPは、通信のエラー通知や疎通確認（pingコマンド）に使う、IPと同じネットワーク層の補助的なプロトコルです。アプリのデータを運ぶためのトランスポート層のプロトコルではありません。誤り。
  イ: PPPは、2地点間を直接つなぐためのデータリンク層のプロトコル（昔のダイヤルアップ接続など）で、IPの<b>下位</b>層です。誤り。
  ウ: TCPはコネクション型で、確認応答・順序制御・再送制御を行い、信頼性の高い通信を実現します。条件と正反対です。誤り。
  エ: UDPはコネクションレスのデータグラム通信で、確認応答や順序制御をもちません。<b>正解</b>。
example: |
  TCPは「書留郵便」：相手が受け取ったか確認でき、届かなければ再送します。
  UDPは「チラシのポスティング」：確認はしないけれど、手軽で速い。
  動画のライブ配信、オンラインゲーム、IP電話、DNSの問合せなど、多少の欠けよりも速さが大事な通信でUDPが使われます。
review:
  - UDP＝コネクションレス・確認応答なし・順序制御なし・軽くて速い。TCP＝コネクション型・信頼性重視。
  - ICMP（エラー通知・ping、ネットワーク層）、PPP（データリンク層）の位置づけも区別する。
