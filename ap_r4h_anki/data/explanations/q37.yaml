q: 37
answer: ウ
category: セキュリティ
theme: |
  標的型攻撃の流れを段階に分けて表した「サイバーキルチェーン」のうち、最初の「偵察」段階で攻撃者が行うことを選ぶ問題です。
basics: |
  <b>サイバーキルチェーン</b>：攻撃者が目的を達成するまでの行動を、軍事用語にならって7つの段階に分けたモデルです。どこか1つの段階で攻撃の鎖を断ち切れば、被害を防げる、という防御の考え方に使います。
  | ①偵察：標的の組織や人物の情報を集める
  | ②武器化：標的に合わせた攻撃用ファイル（マルウェア付き文書など）を作る
  | ③配送：メールなどで攻撃ファイルを送り付ける
  | ④攻撃（エクスプロイト）：脆弱性を突いてマルウェアを実行させる
  | ⑤インストール：マルウェアを標的のPCに常駐させる
  | ⑥遠隔操作（C&amp;C）：外部のサーバから感染PCを操る
  | ⑦目的の実行：情報の窃取や破壊などを行う
reasoning: |
  1. 偵察段階は、攻撃の準備として標的について<b>調べる</b>段階です。まだ相手のシステムには手を出しません。
  2. 「社員のSNS上の経歴や肩書などを足がかりに、関連する組織や人物の情報を洗い出す」のは、まさに情報収集＝偵察です。
  3. 正解は<b>ウ</b>です。
choices:
  ア: 公開Webサイトの脆弱性を悪用してネットワークに侵入を試みるのは、脆弱性を突く<b>攻撃（エクスプロイト）</b>の段階です。偵察ではありません。誤り。
  イ: 標的型攻撃メールを送ってPCをマルウェアに感染させ、個人情報を入手するのは、<b>配送</b>以降（攻撃・インストール・目的の実行）の段階です。誤り。
  ウ: 社員のSNS上の経歴や肩書などから、関連する組織や人物の情報を洗い出すのは、<b>偵察</b>段階の行動です。<b>正解</b>。
  エ: 攻撃対象に特化したPDFや文書ファイルにマルウェアを仕込むのは、確かに2番目の段階ですが、それは「偵察」ではなく<b>武器化</b>の段階です。問題は偵察段階を問うているので誤り。
example: |
  空き巣に例えると、①家の下見をして住人の帰宅時間を調べる（偵察）、②合鍵や道具を用意する（武器化）、③家に近づく（配送）、④鍵を破る（攻撃）…という流れです。SNSに「来週から家族旅行」と書くと、偵察段階の攻撃者に情報を与えてしまいます。
review:
  - サイバーキルチェーンの順序：偵察→武器化→配送→攻撃→インストール→遠隔操作→目的の実行。
  - 偵察＝SNSや公開情報から標的の組織・人物の情報を集める段階。マルウェア付き文書の作成は武器化。
