q: 7
answer: ウ
category: アルゴリズムとプログラミング
theme: |
  統計解析や機械学習に適し、多数のパッケージが提供され、変数に型がない（動的型付け）オープンソースのプログラム言語・実行環境「R」を選ぶ問題です。
basics: |
  <b>型</b>：変数に入れられるデータの種類（整数、文字列など）です。
  - <b>静的型付け</b>：変数の型をプログラムを書くとき（コンパイル時）に決める。誤りを早く見つけやすい。
  - <b>動的型付け</b>：変数自体には型がなく、<b>代入される値（オブジェクト）の型が実行時に決まる</b>。手軽に書ける。
  主な言語
  - <b>R</b>：<b>統計解析</b>やデータ分析、グラフ描画のための言語・実行環境。CRANというサイトから<b>多数のパッケージ</b>（追加機能）を利用でき、機械学習にも使われる。動的型付けで、オープンソース。
  - <b>Go</b>：Googleが開発した、並行処理に強く高速なコンパイル言語。静的型付け。
  - <b>Kotlin</b>：Androidアプリ開発などで使われる、JVM上で動く言語。静的型付け。
  - <b>Scala</b>：オブジェクト指向と関数型の特徴をもつ、JVM上で動く言語。静的型付け。
reasoning: |
  1. 特徴は「統計解析や機械学習に適している」「データ分析、グラフ描画などの多数のパッケージ」「変数自体には型がなく、型は実行時に決まる（動的型付け）」です。
  2. これらをすべて満たすのは<b>R</b>です（Go、Kotlin、Scalaはいずれも静的型付けの言語）。
  3. 正解は<b>ウ</b>です。
choices:
  ア: Goは、並行処理やサーバプログラムの開発に強い、静的型付けのコンパイル言語です。統計解析向けの言語ではなく、変数にも型があります。誤り。
  イ: Kotlinは、Androidアプリ開発などで使われる静的型付けの言語です。誤り。
  ウ: Rは、統計解析や機械学習に適し、データ分析・グラフ描画のパッケージが豊富で、変数の型が実行時に決まるオープンソースの言語・実行環境です。<b>正解</b>。
  エ: Scalaは、オブジェクト指向と関数型の特徴をもつ静的型付けの言語です。誤り。
example: |
  アンケート結果のデータを読み込み、平均や相関を計算して、きれいなグラフにする、といった作業がRの得意分野です。統計の研究者やデータアナリストに広く使われています。
review:
  - R＝統計解析・機械学習向け、パッケージが豊富、動的型付けのオープンソース言語・実行環境。
  - Go・Kotlin・Scalaは静的型付けの言語。「変数自体に型がない」＝動的型付けの手がかりを押さえる。
