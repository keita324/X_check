q: 68
answer: イ
category: 経営戦略マネジメント
theme: |
  バランススコアカード（BSC）で使う「戦略マップ」が何を表す図かを、ポジショニングマップ・ビジネススクリーンなどと区別する問題です。
basics: |
  <b>バランススコアカード（BSC）</b>：企業の戦略を、財務の数字だけでなく、次の<b>4つの視点</b>からバランスよく管理する手法です。
  | 財務：利益や売上をどう伸ばすか
  | 顧客：顧客にどう評価されるか
  | 内部ビジネスプロセス：どの業務を改善・強化するか
  | 学習と成長：人材や組織の能力をどう高めるか
  <b>戦略マップ</b>：この4つの視点に沿って、戦略の<b>課題・施策・目標の因果関係</b>（「社員の能力を高める→業務が速くなる→顧客満足が上がる→売上が増える」のようなつながり）を矢印で表した図です。
reasoning: |
  1. 戦略マップは、BSCの4つの視点を基に、目標同士の因果関係を表す図です。
  2. 「財務、顧客、内部ビジネスプロセス、学習と成長という四つの視点を基に、課題、施策、目標の因果関係を表現したもの」という<b>イ</b>が正解です。
choices:
  ア: 2つの要素をX軸・Y軸として、市場における自社や自社製品の位置を表すのは、<b>ポジショニングマップ</b>です。誤り。
  イ: 4つの視点を基に、課題・施策・目標の因果関係を表したものは、BSCの<b>戦略マップ</b>です。<b>正解</b>。
  ウ: 市場の魅力度と自社の優位性の2軸で自社の製品や事業を分類するのは、<b>ビジネススクリーン</b>（GEのマトリクス）などのポートフォリオ分析です。誤り。
  エ: どの顧客層に、どの経営資源を使い、どの製品・サービスを提供するかを表すのは、<b>事業ドメイン（事業領域）の定義</b>です。誤り。
example: |
  カフェの戦略マップの例：「バリスタの研修を充実させる（学習と成長）」→「注文から提供までを速く、おいしくする（内部プロセス）」→「お客様の満足度とリピート率が上がる（顧客）」→「売上と利益が増える（財務）」。下から上へ矢印でつなぐと、何のために何をするのかが一目で分かります。
review:
  - 戦略マップ＝BSCの4つの視点（財務・顧客・内部ビジネスプロセス・学習と成長）で、目標の因果関係を表した図。
  - ポジショニングマップ（2軸で位置）、ビジネススクリーン（市場魅力度×優位性）、事業ドメイン（誰に・何を・どう）と区別する。
