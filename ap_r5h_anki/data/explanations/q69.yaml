q: 69
answer: イ
category: 経営戦略マネジメント
theme: |
  新規ビジネスを始める前に行う「フィージビリティスタディ（実現可能性調査）」の意味を問う問題です。
basics: |
  <b>フィージビリティスタディ（Feasibility Study：FS）</b>：feasible＝実現可能な。新しい事業やプロジェクトを本格的に始める<b>前に</b>、それが本当に実現できるか、採算が取れるかを調べて評価することです。主に次の観点から調査・分析します。
  - 市場性：需要はあるか、競合はどうか
  - 技術：必要な技術を使えるか
  - 経済性（採算性）：投資額に見合う利益が得られるか
  - 運用・法律：体制を作れるか、法規制に問題はないか
  その結果をもとに、事業を実行するか、見直すか、中止するかを判断します。
reasoning: |
  1. フィージビリティスタディは「実行する前に、実行可能性や採算性を調べて評価する」ことです。
  2. 「新規ビジネスの採算性や実行可能性を、調査・分析し、評価すること」という<b>イ</b>が正解です。
  3. ア（IT投資）、エ（要員の教育訓練）は事業を実行すると決めた後の活動、ウ（アイデア公募）は事業の候補を探す前段階の活動です。
choices:
  ア: 新規ビジネスに必要なシステム構築へのIT投資を行うのは、実行を決めた後の<b>実施段階</b>の活動です。誤り。
  イ: 新規ビジネスの採算性や実行可能性を調査・分析し、評価するのは、<b>フィージビリティスタディ</b>です。<b>正解</b>。
  ウ: 新規ビジネスの発掘のためにアイデアを社内公募するのは、<b>事業アイデアの探索</b>の活動で、実現可能性の評価ではありません。誤り。
  エ: 新規ビジネスに必要な要員の教育訓練を行うのは、実行を決めた後の<b>準備段階</b>の活動です。誤り。
example: |
  駅前にカフェを開きたいとき、いきなり店を借りるのではなく、「1日に何人通るか」「近くにカフェは何軒あるか」「家賃と人件費を払って利益が出るか」「保健所の許可は取れるか」を先に調べて、開店するかどうかを判断するのがフィージビリティスタディです。
review:
  - フィージビリティスタディ＝事業の実行前に、市場性・技術・採算性・実行可能性を調査・分析して評価すること。
  - IT投資や教育訓練（実行後の活動）、アイデア公募（探索段階）とは区別する。
