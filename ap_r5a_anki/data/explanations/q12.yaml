q: 12
answer: イ
category: システム構成要素
theme: |
  サーバとストレージを専用のネットワークで結ぶ「SAN（Storage Area Network）」の接続形態を、DAS・NASと区別する問題です。
basics: |
  サーバとストレージ（ディスク装置）のつなぎ方は、大きく3つあります。
  - <b>DAS（Direct Attached Storage）</b>：サーバにストレージを<b>直接</b>接続する（内蔵ディスクや、シリアルATA・SASで1対1に接続）。
  - <b>SAN（Storage Area Network）</b>：<b>ファイバチャネル</b>などによる<b>ストレージ専用の高速ネットワーク</b>で、複数のサーバと複数のストレージを接続する。サーバからはブロック単位でアクセスでき、自分のディスクのように使える。iSCSI（IPネットワーク上でSCSIを使う）で構築することもある。
  - <b>NAS（Network Attached Storage）</b>：通常の<b>LAN</b>に接続するファイルサーバ専用機。<b>CIFS（SMB）</b>や<b>NFS</b>といったファイル共有プロトコルで、ファイル単位でアクセスする。
reasoning: |
  1. SANの特徴は「ストレージ専用のネットワーク」で、代表的な接続方式は<b>ファイバチャネル</b>です。
  2. 「ファイバチャネルなどによる専用ネットワークで接続する」という<b>イ</b>が正解です。
choices:
  ア: シリアルATAなどで内蔵ストレージとして1対1に接続するのは、<b>DAS</b>の形態です。誤り。
  イ: ファイバチャネルなどによる専用ネットワークでサーバとストレージを接続するのは、<b>SAN</b>の形態です。<b>正解</b>。
  ウ: CIFSを使ってLANで接続するのは、ファイル共有を行う<b>NAS</b>の形態です（主にWindows環境）。誤り。
  エ: NFSを使ってLANで接続するのも、<b>NAS</b>の形態です（主にUNIX/Linux環境）。誤り。
example: |
  社内の書類保管に例えると、DASは「各自の机の引き出し」、NASは「社内LANでつながった共有の書類棚（ファイル単位で出し入れ）」、SANは「倉庫と各部署を結ぶ専用の搬送レーン（倉庫の棚を自分の棚のように使える）」です。
review:
  - SAN＝ファイバチャネルなどのストレージ専用ネットワーク（ブロック単位でアクセス）。
  - DAS＝サーバに直接接続、NAS＝LAN経由でCIFS/NFSによりファイル単位でアクセス、と区別する。
