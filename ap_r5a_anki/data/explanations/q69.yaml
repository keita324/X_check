q: 69
answer: イ
category: 経営戦略マネジメント
theme: |
  市場を消費者の特性で細かく分ける「セグメンテーション」の4つの変数（地理的・人口統計的・心理的・行動的）のうち、人口統計的変数に当たるものを選ぶ問題です。
basics: |
  <b>市場セグメンテーション</b>：市場を、似た特性をもつ消費者のグループ（セグメント）に分けることです。分けるときの基準（変数）は、次の4つに分類されます。
  - <b>地理的変数</b>：地域、気候、<b>人口密度</b>、都市の規模など（どこに住んでいるか）。
  - <b>人口統計的変数（デモグラフィック変数）</b>：年齢、性別、<b>職業</b>、所得、学歴、家族構成など（どんな人か、統計で把握できる属性）。
  - <b>心理的変数（サイコグラフィック変数）</b>：ライフスタイル、価値観、<b>性格</b>（社交性など）、趣味など（どう考えるか）。
  - <b>行動的変数</b>：購買頻度、<b>製品の使用割合</b>、求める便益、ブランドへの忠誠度など（どう買い、どう使うか）。
reasoning: |
  1. 各選択肢を4つの変数に分類します。
  | ア 社交性などの性格 → 心理的変数
  | イ 職業 → <b>人口統計的変数</b>
  | ウ 人口密度 → 地理的変数
  | エ 製品の使用割合 → 行動的変数
  2. 正解は<b>イ</b>です。
choices:
  ア: 社交性などの性格は、消費者の内面に関わる<b>心理的変数</b>です。誤り。
  イ: 職業は、年齢や性別、所得と同じく<b>人口統計的変数</b>です。<b>正解</b>。
  ウ: 人口密度は、住んでいる地域の特徴を表す<b>地理的変数</b>です。「人口」という言葉にひっかからないよう注意します。誤り。
  エ: 製品の使用割合（ヘビーユーザーかライトユーザーか）は、消費者の購買・使用の行動を表す<b>行動的変数</b>です。誤り。
example: |
  スポーツドリンクの販売戦略なら、「暑い地域」（地理的）、「20代の会社員」（人口統計的）、「健康志向の人」（心理的）、「毎日運動して頻繁に買う人」（行動的）と、4つの切り口で狙う客層を考えられます。
review:
  - 人口統計的変数＝年齢・性別・職業・所得・家族構成など。地理的（地域・人口密度）、心理的（性格・価値観）、行動的（使用頻度・使用割合）と区別する。
  - 「人口密度」は地理的変数である点（人口統計的ではない）に注意する。
