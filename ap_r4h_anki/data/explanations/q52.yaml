q: 52
answer: ア
category: プロジェクトマネジメント
theme: |
  プロジェクトの日程を短縮する技法のうち、「資源（人や設備）を追加して作業期間を縮める」方法の名前を問う用語問題です。
basics: |
  <b>アクティビティ</b>：プロジェクトの個々の作業です。
  スケジュールを短縮する代表的な技法は2つあります。
  - <b>クラッシング</b>：作業に<b>資源（人員・設備など）を追加</b>して、その作業の所要期間を短くする。コストは増える。
  - <b>ファストトラッキング</b>：本来は順番に行う作業を、<b>並行して</b>進めることで全体の期間を短くする。手戻りのリスクが増える。

  その他の用語
  - <b>クリティカルチェーン法</b>：資源の制約も考えて最長の経路（クリティカルチェーン）を求め、個々の作業の余裕をまとめて「バッファ」として管理する手法。
  - <b>モンテカルロ法</b>：乱数を使って何度もシミュレーションし、完了日などの確率的なばらつきを分析する手法。
reasoning: |
  1. 問題文は「アクティビティに割り当てる資源を増やして、所要期間を短縮する技法」です。
  2. 資源を追加して期間を縮めるのは<b>クラッシング</b>です。
  3. 正解は<b>ア</b>です。
choices:
  ア: クラッシングは、アクティビティに資源を追加投入して所要期間を短縮する技法です。<b>正解</b>。
  イ: クリティカルチェーン法は、資源の制約を考慮した最長経路をバッファで管理するスケジュール管理手法で、資源の追加による短縮技法ではありません。誤り。
  ウ: ファストトラッキングは、順番に行う予定の作業を並行して進めることで期間を短縮する技法です。資源を増やすのではないので誤り。
  エ: モンテカルロ法は、乱数を使ったシミュレーションでスケジュールのリスクなどを分析する手法です。誤り。
example: |
  引っ越しの荷造りを早く終わらせたいとき、友達を呼んで人数を増やすのがクラッシング（人件費は増える）、荷造りが全部終わる前から、終わった部屋の荷物を先にトラックへ積み始めるのがファストトラッキング（順番が乱れて手戻りが起きるかも）です。
review:
  - クラッシング＝資源を追加して期間短縮（コスト増）、ファストトラッキング＝作業を並行させて期間短縮（手戻りリスク増）。
  - クリティカルチェーン法（バッファ管理）、モンテカルロ法（乱数シミュレーション）と区別する。
