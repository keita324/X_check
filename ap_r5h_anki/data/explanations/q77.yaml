q: 77
answer: エ
category: 企業活動
theme: |
  固定費と変動費率から、目標の利益を得るために必要な売上高を求める「損益分岐点分析」の応用問題です。
basics: |
  <b>固定費</b>：売上に関係なく一定額かかる費用（家賃、正社員の給料など）。ここでは150百万円。
  <b>変動費</b>：売上に比例して増える費用（材料費など）。
  <b>変動費率</b>：売上高に占める変動費の割合。ここでは60%なので、売上高の60%が変動費です。
  <b>利益の式</b>
  | 利益 ＝ 売上高 − 変動費 − 固定費
  | 　　 ＝ 売上高 − 売上高 × 変動費率 − 固定費
  | 　　 ＝ 売上高 × (1 − 変動費率) − 固定費
  (1 − 変動費率) を<b>限界利益率</b>と呼びます。売上1円あたり、固定費の回収と利益に回せる割合です。
reasoning: |
  1. 求める売上高を S（百万円）とします。
  2. 利益の式に代入します。
  | 50 ＝ S × (1 − 0.6) − 150
  | 50 ＝ 0.4S − 150
  | 0.4S ＝ 200
  | S ＝ 200 ÷ 0.4 ＝ <b>500</b>
  3. 検算：売上500、変動費 500×0.6＝300、固定費150 → 利益 500−300−150＝50 ✓
  4. 正解は<b>エ</b>です。
  （参考：必要な売上高 ＝ (固定費 ＋ 目標利益) ÷ (1 − 変動費率) と覚えておくと速く解けます。）
choices:
  ア: 333は、200 ÷ 0.6 のように、限界利益率（0.4）ではなく変動費率（0.6）で割ってしまった値です。誤り。
  イ: 425百万円では、利益は 425×0.4−150＝20百万円にしかなりません。誤り。
  ウ: 458百万円では、利益は 458×0.4−150≒33百万円にしかなりません。誤り。
  エ: 500百万円。(150＋50) ÷ (1−0.6) で、利益50百万円がちょうど得られる売上高です。<b>正解</b>。
example: |
  1個1,000円で売るクレープの材料費が600円（変動費率60%）なら、1個売るごとに400円が手元に残ります。屋台の出店料（固定費）1万5千円と、目標の儲け5千円を合わせた2万円を稼ぐには、2万円÷400円＝50個、つまり売上5万円が必要です。
review:
  - 目標利益を得る売上高＝（固定費＋目標利益）÷（1−変動費率）。
  - 割る数は限界利益率（1−変動費率）。変動費率で割らないように注意し、最後に検算する。
