q: 8
answer: ウ
category: コンピュータ構成要素
theme: |
  スマートフォンなどで、高性能と省電力を両立させるために、性質の違う複数の種類のコアを1つに載せたプロセッサを何と呼ぶかを問う問題です。
basics: |
  <b>コア</b>：プロセッサ（CPU）の中で、実際に命令を処理する中心部分です。1つのプロセッサに複数のコアを載せたものを<b>マルチコアプロセッサ</b>と呼びます。
  - <b>ホモジニアス（homogeneous＝同種の）マルチコア</b>：<b>同じ種類</b>のコアを複数載せたもの。
  - <b>ヘテロジニアス（heterogeneous＝異種の）マルチコア</b>：<b>異なる種類</b>のコアを組み合わせたもの。例えば、性能は高いが電力を多く使う「高性能コア」と、性能は控えめだが電力をあまり使わない「高効率コア」を組み合わせ、処理の重さに応じて使い分けます（スマホのSoCやパソコンの一部のCPUで採用）。

  他の用語
  - <b>スーパースカラ</b>：1つのコアの中で、複数の命令を同時に実行する方式。
  - <b>ソフトコアプロセッサ</b>：FPGAなどの上に、ハードウェア記述言語で論理的に構成したプロセッサ。
reasoning: |
  1. 問題文のキーワードは「高い処理性能と低消費電力の両立」「異なる目的に適した複数の<b>種類</b>のコア」です。
  2. 異なる種類のコアを組み合わせたものは<b>ヘテロジニアスマルチコアプロセッサ</b>です。正解は<b>ウ</b>です。
choices:
  ア: スーパースカラプロセッサは、1つのコア内で複数の命令を並列に実行する方式で、種類の異なるコアを組み合わせるものではありません。誤り。
  イ: ソフトコアプロセッサは、FPGAなどの上に論理回路として作ったプロセッサで、問題の説明とは関係ありません。誤り。
  ウ: 異なる目的に適した複数の種類のコアを搭載したものは、ヘテロジニアスマルチコアプロセッサです。<b>正解</b>。
  エ: ホモジニアスマルチコアプロセッサは、同じ種類のコアを複数搭載したものです。誤り。
example: |
  宅配便の会社が、重い荷物用の大型トラック（高性能コア）と、近所への小さな荷物用の電動自転車（高効率コア）を使い分けるようなものです。メールの確認のような軽い仕事は自転車で省エネに、動画編集のような重い仕事はトラックで速く片付けます。
review:
  - ヘテロジニアス＝異種のコアの組合せ（高性能コア＋高効率コアで性能と省電力を両立）、ホモジニアス＝同種のコアの組合せ。
  - スーパースカラ（1コア内の命令並列実行）、ソフトコア（FPGA上に構成）と区別する。
