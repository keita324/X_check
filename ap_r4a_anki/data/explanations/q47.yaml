q: 47
answer: イ
theme: |
  障害の原因を分析する手法「FTA（故障の木解析）」の説明を、FMEA・なぜなぜ分析・ODC分析と区別する問題です。
basics: |
  <b>FTA（Fault Tree Analysis：故障の木解析）</b>：起きてほしくない障害（トップ事象）を一番上に置き、「それはなぜ起こるか」を<b>上から下へ</b>（トップダウンで）掘り下げ、中間的な原因から基本的な原因までを木の枝のように並べた<b>樹形図（フォールトツリー）</b>で表す手法です。原因どうしの関係は、ANDゲート（全部そろうと起きる）やORゲート（どれか1つで起きる）という論理記号で表します。

  <b>FMEA（故障モード影響解析）</b>：逆に、部品1つ1つの故障の仕方（故障モード）から出発し、それがシステム全体にどう影響するかを<b>下から上へ</b>（ボトムアップで）調べる手法です。
reasoning: |
  1. FTAの特徴は「障害（結果）から原因へ」「樹形図」「論理ゲートで関連付け」の3点です。
  2. 「障害と、その中間的な原因から基本的な原因までの全ての原因とを列挙し、それらをゲート（論理を表す図記号）で関連付けた樹形図で表す」という<b>イ</b>がFTAの説明です。
choices:
  ア: 構成品目の故障モード（どのように壊れるか）に着目し、推定原因を挙げてシステムへの影響を評価するのは<b>FMEA</b>です。部品側から出発するボトムアップの手法です。誤り。
  イ: 障害と、その中間的原因から基本的原因までを列挙し、ゲートで関連付けた樹形図で表す。<b>FTA</b>の説明です。<b>正解</b>。
  ウ: 「なぜ？」を繰り返して根本原因を探るのは<b>なぜなぜ分析</b>です。樹形図とゲートで表すFTAとは別の手法です。誤り。
  エ: ODC属性（Orthogonal Defect Classification：直交欠陥分類）に従って障害を分類し、どの分類に集中しているかを調べるのは<b>ODC分析</b>です。誤り。
example: |
  「車のエンジンがかからない」（トップ事象）を一番上に書き、その下に「バッテリー上がり」OR「燃料切れ」OR「セルモーター故障」…と枝分かれさせ、さらに「バッテリー上がり」の下に「ライトの消し忘れ」OR「バッテリーの劣化」…と掘り下げていく図がFTAです。
review:
  - FTA＝障害（トップ事象）から原因へトップダウンで掘り下げ、AND/ORゲートの樹形図で表す。
  - FMEA＝部品の故障モードから影響をボトムアップで評価する。FTAとFMEAの方向の違いを区別する。
