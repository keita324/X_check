q: 26
answer: イ
theme: |
  データベースで使う「データ項目名」の付け方のルール（命名規約）が、どんな問題を防げて、どんな問題を防げないかを考える問題です。
basics: |
  <b>データ項目</b>：データベースの表の列のことです（例：「受注金額」「取引先名」）。
  <b>データ型</b>：その項目に入る値の種類（日付型、文字列型、数値型など）。
  <b>命名規約</b>：項目名の付け方を統一するルール。全員が同じルールで名前を付けると、名前を見ただけで意味や型が分かります。

  <b>異音同義語</b>：違う言葉なのに同じ意味（例：「賞与」と「ボーナス」）。<b>同音異義語</b>：同じ言葉なのに違う意味。
  <b>値域（ドメイン）</b>：その項目が取り得る値の範囲（例：金額は0〜1億円まで、など）。
reasoning: |
  2つの規約が何を防ぐかを整理します。
  - 規約(1)：項目名の末尾に「名」「コード」「金額」「年月日」などの区分語を付け、<b>区分語ごとにデータ型を決める</b>。→ 名前の末尾で種類が分かり、データ型が統一される。
  - 規約(2)：項目名と意味を<b>辞書</b>に登録し、異音同義語・同音異義語を防ぐ。→ 同じ意味の項目が別名で作られることを防ぐ。

  各選択肢を当てはめます。
  1. ア：「年月日」の区分語にはデータ型が1つに決まる（規約1）→ 混在は防げる。
  2. イ：「受注金額」の<b>取り得る値の範囲（値域）</b>は、名前やデータ型のルールでは決められない → <b>防げない</b>。
  3. ウ：「賞与金額」と「ボーナス金額」は異音同義語 → 辞書で防げる（規約2）。
  4. エ：「取引先」には区分語がない → 末尾に必ず区分語を付けるので防げる（規約1）。
  よって、回避できないのは<b>イ</b>です。
choices:
  ア: 「受信年月日」に日付型と文字列型が混在する問題は、規約(1)で区分語「年月日」ごとにデータ型を1つに決めるので回避できます。
  イ: 「受注金額」の取り得る値の範囲（値域）がテーブルによって異なる問題は、名前やデータ型の統一だけでは決められず、命名規約では回避できません。<b>正解</b>（回避できない事象）。
  ウ: 「賞与金額」と同じ意味の「ボーナス金額」がある問題は異音同義語なので、規約(2)の辞書で回避できます。
  エ: 「取引先」がコードか名前か分からない問題は、規約(1)で末尾に必ず「コード」「名」などの区分語を付けるので回避できます。
example: |
  会社の書類フォルダで「〇〇_請求書_日付」のように名前の付け方を決めておけば、中身の種類はすぐ分かります。しかし、「請求金額は100万円以下にする」といった金額の上限は、ファイル名のルールでは決められません。それは別途、入力チェック（値の範囲の制約）で決める必要があります。
review:
  - 命名規約（区分語・辞書）で防げるのは「データ型の不統一」「異音同義語・同音異義語」「項目の意味のあいまいさ」。
  - 取り得る値の範囲（値域・ドメイン）は名前のルールでは統一できない。
  - 否定形の問題（「回避できない」）では、各選択肢がどの規約で防げるかを1つずつ対応付ける。
