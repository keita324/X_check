q: 71
answer: エ
category: ビジネスインダストリ
theme: |
  現実世界（フィジカル）のデータを仮想世界（サイバー）で分析・活用する「CPS（サイバーフィジカルシステム）」の活用事例を、クラウドの仮想化・サブスクリプション型ビジネス・シンクライアントと区別する問題です。
basics: |
  <b>CPS（Cyber-Physical System）</b>：現実世界（フィジカル空間）のさまざまなデータをセンサーなどで収集し、<b>仮想世界（サイバー空間）</b>で分析・シミュレーションして、その結果を現実世界に役立てる仕組みです。現実をそっくり再現した仮想世界（デジタルツイン）を使えば、現実では試せないこともシミュレーションできます。

  他の選択肢に関係する用語
  - <b>IaaS・クラウドの仮想化</b>：仮想化したシステム資源を用意し、必要に応じてソフトウェアで構成を変える。
  - <b>サブスクリプション・従量課金</b>：機器を販売せず貸し出し、使用状況に応じて料金を徴収するビジネスモデル（IoTを活用した例）。
  - <b>シンクライアント・デスクトップ仮想化（VDI）</b>：処理やデータをサーバ側にもたせ、端末は最小限の機能だけにする。
reasoning: |
  1. CPSの要点は「現実世界のデータで仮想世界を構築」「仮想世界でシミュレーション」です。
  2. 「現実世界の都市の構造や活動状況のデータによって仮想世界を構築し、災害の発生や時間軸を自由に操作して、現実世界では実現できないシミュレーションを行う」という<b>エ</b>がCPSの活用事例です。
choices:
  ア: 仮想化された標準的なシステム資源を用意し、業務に合わせて規模や構成をソフトウェアで設定するのは、<b>クラウド（IaaSなど）やSDI</b>の活用で、現実世界のデータを仮想世界で再現するCPSではありません。誤り。
  イ: 機器を貸し出し、組み込まれたセンサーで使用状況を検知して料金を徴収するのは、IoTを使った<b>従量課金型のビジネスモデル</b>（サービス化）の例で、仮想世界でのシミュレーションは行っていません。誤り。
  ウ: 処理機能やデータをサーバにもたせ、クライアントは最小限の機能だけにしてデスクトップを仮想化するのは、<b>シンクライアント（VDI）</b>の説明です。誤り。
  エ: 現実の都市のデータで仮想世界を構築し、災害や時間軸を操作して現実ではできないシミュレーションを行うのは、<b>CPS</b>の活用事例です。<b>正解</b>。
example: |
  自治体が、建物や道路、人の流れのデータで街全体を仮想空間に再現し、「大地震が起きたら、どこで避難が渋滞するか」を何通りも試して避難計画を作る、というのがCPS（デジタルツイン）の活用例です。現実の街で災害を起こして試すことはできません。
review:
  - CPS＝現実世界のデータを集めて仮想世界を構築し、分析・シミュレーションして現実に役立てる仕組み。
  - クラウドの仮想化、IoTによる従量課金、シンクライアントは、仮想世界での現実の再現・シミュレーションではない。
