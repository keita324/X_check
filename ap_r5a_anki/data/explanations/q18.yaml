q: 18
answer: イ
category: ソフトウェア
theme: |
  あるコンピュータ上で、命令形式の異なる別のコンピュータ用のプログラムを作る言語処理プログラム（クロスコンパイラ）を選ぶ問題です。
basics: |
  <b>命令形式（命令セット）</b>：CPUの種類ごとに決まっている、機械語の命令の体系です。パソコン用のCPUとスマホや家電に入っているCPUでは、命令形式が違うことがよくあります。
  <b>コンパイラ</b>：人が書いたソースプログラムを、CPUが実行できる目的プログラム（機械語）に変換する言語処理プログラムです。
  - <b>クロスコンパイラ</b>：コンパイラを動かすコンピュータとは<b>異なる命令形式</b>のコンピュータ用の目的プログラムを生成する。組込み機器の開発でよく使う（パソコンで、家電のマイコン用のプログラムを作るなど）。
  - <b>最適化コンパイラ</b>：実行速度やメモリ使用量がよくなるように工夫した目的プログラムを生成する。
  - <b>エミュレーター</b>：別のコンピュータの動作をソフトウェア（やハードウェア）で再現し、そのコンピュータ用のプログラムを実行できるようにする。
  - <b>プログラムジェネレーター</b>：入力した条件や仕様から、プログラムを自動生成する。
reasoning: |
  1. 問題文のキーワードは「当該コンピュータとは<b>異なる命令形式</b>のコンピュータで実行できる目的プログラムを<b>生成</b>する」です。
  2. これは<b>クロスコンパイラ</b>です。正解は<b>イ</b>です。
choices:
  ア: エミュレーターは、別のコンピュータの動作を再現して、そのコンピュータ用のプログラムを<b>実行</b>するもので、目的プログラムを生成するものではありません。誤り。
  イ: クロスコンパイラは、自分とは異なる命令形式のコンピュータで実行できる目的プログラムを生成します。<b>正解</b>。
  ウ: 最適化コンパイラは、実行効率のよい目的プログラムを生成するコンパイラで、異なる命令形式向けであることが特徴ではありません。誤り。
  エ: プログラムジェネレーターは、条件や仕様からプログラムを自動生成するツールで、異なる命令形式向けの変換が特徴ではありません。誤り。
example: |
  日本語で書いた原稿を、英語圏の印刷所向けに英語に翻訳して渡すのがクロスコンパイラ、英語の原稿を日本で読めるように通訳者がその場で読み上げるのがエミュレーターのイメージです。スマホアプリを開発するときも、パソコン上でスマホ用のプログラムを作るためにクロスコンパイラが使われています。
review:
  - クロスコンパイラ＝自分と異なる命令形式（CPU）のコンピュータ用の目的プログラムを生成する（組込み開発で多用）。
  - エミュレーター（別機種の動作を再現して実行）、最適化コンパイラ（効率のよいコード生成）、プログラムジェネレーター（自動生成）と区別する。
