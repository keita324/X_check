q: 3
answer: ア
category: 基礎理論
theme: |
  AIの2クラス分類モデル（陽性か陰性かを判定するモデル）の性能を評価する「ROC曲線」が、どの2つの指標の関係を表すかを問う問題です。
basics: |
  <b>2クラス分類</b>：データを「陽性（例：病気あり、迷惑メール）」と「陰性（病気なし、通常メール）」の2つに分けることです。予測と実際の組合せは4通りです。
  | 真陽性（TP）：実際に陽性を、陽性と予測（正しく見つけた）
  | 偽陽性（FP）：実際は陰性なのに、陽性と予測（誤って警報）
  | 偽陰性（FN）：実際は陽性なのに、陰性と予測（見逃し）
  | 真陰性（TN）：実際に陰性を、陰性と予測

  主な指標
  - <b>真陽性率（再現率）</b>＝TP÷(TP＋FN)：本当の陽性のうち、正しく見つけられた割合。
  - <b>偽陽性率</b>＝FP÷(FP＋TN)：本当の陰性のうち、誤って陽性と判定した割合。
  - <b>適合率</b>＝TP÷(TP＋FP)：陽性と予測したもののうち、本当に陽性だった割合。
  - <b>正解率</b>＝(TP＋TN)÷全体：全体のうち、予測が当たった割合。

  <b>ROC曲線</b>：陽性と判定する基準（しきい値）を少しずつ変えたときの、<b>横軸＝偽陽性率、縦軸＝真陽性率</b>の変化を描いた曲線です。曲線が左上に近いほど（曲線の下の面積AUCが大きいほど）性能の良いモデルです。
reasoning: |
  1. ROC曲線は、しきい値を変えたときの「真陽性率（見つけられる割合）」と「偽陽性率（誤報の割合）」のトレードオフを表します。
  2. 基準を甘くすると真陽性率は上がりますが、偽陽性率も上がります。その関係を曲線にしたものです。
  3. 正解は<b>ア</b>です。
choices:
  ア: 真陽性率と偽陽性率の関係を示す曲線は<b>ROC曲線</b>です。<b>正解</b>。
  イ: 真陽性率（再現率）と適合率の関係を示す曲線は、<b>PR曲線</b>（Precision-Recall曲線）です。誤り。
  ウ: 正解率と適合率の関係を示す曲線は、ROC曲線ではありません。誤り。
  エ: 適合率と偽陽性率の関係を示す曲線は、ROC曲線ではありません。誤り。
example: |
  空港の金属探知機で、感度を上げると本物の危険物はほぼすべて見つかります（真陽性率が上がる）が、ベルトのバックルにも反応して誤報が増えます（偽陽性率が上がる）。感度をいろいろ変えたときのこの関係を描いたものがROC曲線です。
review:
  - ROC曲線＝横軸が偽陽性率、縦軸が真陽性率。左上に近い（AUCが大きい）ほど良いモデル。
  - 真陽性率（再現率）・偽陽性率・適合率・正解率の計算式を、混同行列（TP・FP・FN・TN）から言えるようにする。
  - 真陽性率と適合率の関係はPR曲線であり、ROC曲線と区別する。
