q: 52
answer: エ
category: プロジェクトマネジメント
theme: |
  プロジェクトの作業を階層的に分解した「WBS」で、一番下のレベルの作業を何と呼ぶかを問う用語問題です。
basics: |
  <b>WBS（Work Breakdown Structure：作業分解構造）</b>：プロジェクトで作る成果物や作業を、大きなものから小さなものへと<b>階層的に分解</b>して整理した図や一覧です。
  - <b>ワーク・パッケージ</b>：WBSの<b>最下位のレベル</b>の作業。これ以上分解せず、コストや期間を見積もり、担当者を割り当てて管理する単位になります。
  - <b>WBS辞書</b>：WBSの各要素（ワーク・パッケージなど）について、作業内容、担当、成果物、受入れ基準などの詳細を説明した文書。
  - <b>アクティビティ・リスト</b>：ワーク・パッケージをさらに具体的な作業（アクティビティ）に分けた一覧。スケジュールを作るために使う。
  - <b>プロジェクト・スコープ</b>：プロジェクトで行う作業の範囲そのもの。
reasoning: |
  1. WBSの最下位のレベルの作業は<b>ワーク・パッケージ</b>と呼びます。
  2. 正解は<b>エ</b>です。
choices:
  ア: WBS辞書は、WBSの各要素の詳細を説明した文書で、最下位の作業の名前ではありません。誤り。
  イ: アクティビティ・リストは、ワーク・パッケージをスケジュール作成のためにさらに分けた作業の一覧です。WBSの最下位のレベルそのものではありません。誤り。
  ウ: プロジェクト・スコープは、プロジェクトで行う作業の範囲全体のことです。誤り。
  エ: WBSの最下位のレベルの作業は、<b>ワーク・パッケージ</b>と呼びます。<b>正解</b>。
example: |
  引っ越しを例にすると、「引っ越し」→「荷造り」「手続き」「搬入」と分け、「荷造り」をさらに「台所の荷造り」「本の荷造り」…と、これ以上分けなくても担当と所要時間を決められるところまで分解します。この一番下の「台所の荷造り」などがワーク・パッケージです。
review:
  - ワーク・パッケージ＝WBSの最下位レベルの作業。コスト・期間の見積りや担当割当ての単位。
  - WBS辞書（各要素の詳細説明）、アクティビティ・リスト（スケジュール用の作業一覧）、プロジェクト・スコープ（作業範囲）と区別する。
