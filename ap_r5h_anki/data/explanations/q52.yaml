q: 52
answer: ア
category: プロジェクトマネジメント
theme: |
  スケジュール管理手法「クリティカルチェーン法」で使うバッファ（余裕時間）の種類のうち、クリティカルチェーンに合流する経路の直後に置くものを選ぶ問題です。
basics: |
  <b>クリティカルチェーン法</b>：作業の依存関係だけでなく、<b>人や設備などの資源の制約</b>も考慮した最長の経路（<b>クリティカルチェーン</b>）を求め、スケジュールを管理する手法です。
  個々の作業の見積りに含まれがちな「念のための余裕」を削り、その分をまとめて<b>バッファ</b>として配置し、全体で管理します。
  - <b>プロジェクトバッファ</b>：クリティカルチェーンの<b>最後</b>（プロジェクトの完了直前）に置き、プロジェクト全体の遅れを吸収する。
  - <b>合流バッファ（フィーディングバッファ）</b>：クリティカルチェーン上にない経路（合流経路）が、クリティカルチェーンに<b>合流する直前</b>に置き、合流経路の遅れがクリティカルチェーンに影響しないようにする。
  - <b>資源バッファ</b>：クリティカルチェーン上の作業に必要な資源（人など）が、必要なときに確実に使えるように、注意喚起のために置く目印。
reasoning: |
  1. 問題文は「クリティカルチェーン上にないアクティビティが遅れても、クリティカルチェーン上のアクティビティに影響しないように、クリティカルチェーンにつながっていくアクティビティの直後に設けるバッファ」です。
  2. これは合流経路の遅れを吸収する<b>合流バッファ</b>です。
  3. 正解は<b>ア</b>です。
choices:
  ア: 合流バッファは、クリティカルチェーンに合流する経路の最後（合流直前）に置き、その経路の遅れがクリティカルチェーンに影響しないようにします。<b>正解</b>。
  イ: 資源バッファは、クリティカルチェーン上の作業に必要な資源を確実に確保するための目印で、合流経路の遅れを吸収するものではありません。誤り。
  ウ: フレームバッファは、画面に表示する画像データを一時的に保持するメモリ領域のことで、スケジュール管理の用語ではありません。誤り。
  エ: プロジェクトバッファは、クリティカルチェーンの最後に置いて、プロジェクト全体の遅れを吸収するバッファです。合流経路の直後に置くものではありません。誤り。
example: |
  料理のコースで、メインディッシュ（クリティカルチェーン）に添えるソース（合流経路）を別の担当者が作っているとします。ソース作りが少し遅れてもメインの盛り付けが止まらないよう、ソースの完成予定をメインに合流する時刻より少し早めに設定しておくのが合流バッファです。コース全体の最後にとっておく予備時間がプロジェクトバッファです。
review:
  - 合流バッファ（フィーディングバッファ）＝非クリティカルな経路がクリティカルチェーンに合流する直前に置く。
  - プロジェクトバッファ＝クリティカルチェーンの最後、資源バッファ＝資源確保のための目印、と配置場所と目的で区別する。
