q: 29
answer: イ
category: データベース
theme: |
  実際のデータのつながりを表した「オブジェクト図」から、クラス間の関係（多重度）を読み取り、対応する概念データモデル（クラス図）を選ぶ問題です。
basics: |
  <b>オブジェクト図</b>：具体的なデータ（インスタンス）どうしのつながりを表したUMLの図です。「東京：地域」は「地域クラスの東京というデータ」という意味です。
  <b>概念データモデル（クラス図）</b>：データの種類（クラス）と、その間の関係を表した図です。線の両端の<b>多重度</b>で、相手側のデータ1つにいくつ対応するかを表します。
  | 1：ちょうど1つ　 *：0個以上（多数）
  線の<b>こちら側の端</b>に書かれた多重度は、「反対側のデータ1つに対して、こちら側のデータがいくつ対応するか」を表します。
reasoning: |
  オブジェクト図から、各関係の多重度を読み取ります。
  <b>(1) 地域と仕入先</b>
  | 大阪には仕入先25と37の2つ → 地域1つに仕入先は多数（*）
  | 各仕入先がつながる地域は1つ → 仕入先1つに地域は1
  | → 地域「1」―「*」仕入先
  <b>(2) 仕入先と仕入</b>
  | 仕入先11には仕入#01〜#03の3つ → 仕入先1つに仕入は多数（*）
  | 各仕入がつながる仕入先は1つ → 仕入1つに仕入先は1
  | → 仕入先「1」―「*」仕入
  <b>(3) 仕入と部品</b>
  | 部品205には仕入#02、#04、#05の3つ → 部品1つに仕入は多数（*）
  | 各仕入がつながる部品は1つ → 仕入1つに部品は1
  | → 仕入「*」―「1」部品
  この3つがすべて一致するのは<b>イ</b>です。
choices:
  ア: 地域と仕入先の関係を「1対1」としていますが、大阪には仕入先が2つ（25と37）あるので、地域側から見て仕入先は多数（*）です。誤り。
  イ: 地域1−*仕入先、仕入先1−*仕入、仕入*−1部品で、オブジェクト図のつながりと一致します。<b>正解</b>。
  ウ: 仕入先と仕入の関係を「仕入先*−1仕入」としており、向きが逆です。実際は仕入先11に仕入が3つあるので、仕入先1つに仕入が多数です。部品との関係も逆になっています。誤り。
  エ: 地域と仕入先を多対多としていますが、各仕入先がつながる地域は1つだけです。仕入先・仕入・部品の関係もオブジェクト図と一致しません。誤り。
example: |
  学校で考えると、1つの学年（地域）に複数のクラス（仕入先）があり、1つのクラスに複数の生徒（仕入）がいて、生徒はそれぞれ1つの部活（部品）に所属し、1つの部活には複数の生徒がいる、という関係です。具体的な名簿（オブジェクト図）から、「1対多」の向きを読み取ります。
review:
  - オブジェクト図の具体例から「相手1つに対していくつつながるか」を両方向で数え、多重度（1か*か）を決める。
  - 多重度は線の端の位置に注意する（こちら側の端＝反対側1つに対するこちら側の数）。
