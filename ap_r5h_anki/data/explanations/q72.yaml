q: 72
answer: ウ
category: ビジネスインダストリ
theme: |
  複数のサービスや事業者を1か所にまとめて利用者に提供する「アグリゲーションサービス」の説明を、オムニチャネル・エスクロー・フランチャイズと区別する問題です。
basics: |
  <b>アグリゲーション（aggregation）</b>：集約、寄せ集めること。
  <b>アグリゲーションサービス</b>：あちこちに分散している事業者、個人、機能などへのアクセスを<b>1か所に集約</b>して顧客に提供し、比較、まとめ、統一的な操作、最適な組合せなどを<b>ワンストップ</b>で可能にするサービスです。例：複数の銀行口座やクレジットカードの明細を1つのアプリでまとめて見られる家計簿サービス、複数の旅行サイトの料金を比較できるサイト。

  関連用語
  - <b>オムニチャネル</b>：店舗やECサイトなどのあらゆる顧客接点を統合し、どこでも同じ購買体験を提供する。
  - <b>エスクローサービス</b>：取引の間に中立的な第三者が入り、代金を一時的に預かって取引の安全を確保する。
  - <b>フランチャイズ</b>：本部と契約した加盟店が対価を払い、本部の商標やノウハウを使う権利を得る仕組み。
reasoning: |
  1. アグリゲーションサービスのキーワードは「分散している事業者・個人・機能への一括的なアクセス」「比較、まとめ、統一的な制御、最適な組合せ」「ワンストップ」です。
  2. これを述べているのは<b>ウ</b>です。
choices:
  ア: 店舗やECサイトなどのあらゆる顧客接点をシームレスに統合し、最適な購買体験を提供するのは<b>オムニチャネル</b>です。誤り。
  イ: 売買の際に、中立的な第三者が当事者の間に入って代金決済などの安全性を確保するのは<b>エスクローサービス</b>です。誤り。
  ウ: 分散した事業者・個人・機能への一括的なアクセスを提供し、比較やまとめなどをワンストップで可能にするのは<b>アグリゲーションサービス</b>です。<b>正解</b>。
  エ: 本部と契約した加盟店が対価を払って、商品やサービスを使う権利を受け取るのは<b>フランチャイズ</b>です。誤り。
example: |
  旅行の予約で、航空会社やホテルのサイトを1つずつ見て回る代わりに、1つのサイトで全社の空席と料金を比べ、飛行機とホテルを組み合わせて一度に予約できるサービスがアグリゲーションサービスです。
review:
  - アグリゲーションサービス＝分散したサービスへのアクセスを集約し、比較・まとめ・組合せをワンストップで提供する。
  - オムニチャネル（顧客接点の統合）、エスクロー（第三者による取引の安全確保）、フランチャイズ（本部と加盟店）と区別する。
