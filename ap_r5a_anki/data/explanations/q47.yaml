q: 47
answer: エ
category: システム開発技術
theme: |
  画面上で部品を組み合わせながら、必要な部分だけソースコードを書いてソフトウェアを作る「ローコード開発」を、ノーコード開発などと区別する問題です。
basics: |
  - <b>ローコード開発</b>：開発ツールの画面で、用意された部品やテンプレートを<b>GUI操作で組み合わせて</b>アプリケーションを作り、標準の部品で足りない処理だけ<b>一部ソースコードを書く</b>開発手法。少ないコード量で素早く開発できる。
  - <b>ノーコード開発</b>：ソースコードを<b>まったく書かずに</b>、GUI操作だけでアプリケーションを作る手法。手軽だが、できることは用意された機能の範囲に限られる。
  - <b>継続的インテグレーション（CI）</b>：開発者がコードを変更するたびに、ビルドやテストを自動で行い、早く問題を見つける取組み。
  - <b>プロトタイピング</b>：早い段階で試作品（プロトタイプ）を作り、利用者に確認してもらいながら要求を明確にする開発手法。
reasoning: |
  1. 問題文のキーワードは「部品やテンプレートをGUIによる操作で組み合わせる」と「<b>必要に応じて一部の処理のソースコードを記述</b>する」です。
  2. GUI操作が中心で、一部だけコードを書くのは<b>ローコード開発</b>です（コードをまったく書かないならノーコード開発）。
  3. 正解は<b>エ</b>です。
choices:
  ア: 継続的インテグレーションは、コード変更のたびにビルドとテストを自動で行う取組みで、GUIで部品を組み合わせる開発手法ではありません。誤り。
  イ: ノーコード開発は、ソースコードを一切書かずに開発する手法です。問題文には「一部の処理のソースコードを記述」とあるので当てはまりません。誤り。
  ウ: プロトタイピングは、試作品を作って利用者の確認を受けながら要求を固めていく手法で、問題文の説明とは異なります。誤り。
  エ: 部品やテンプレートをGUIで組み合わせ、必要に応じて一部のソースコードを記述して開発するのは、ローコード開発です。<b>正解</b>。
example: |
  ホームページ作成サービスで、テンプレートを選んで画像や文章をドラッグ＆ドロップで配置するだけで作るのがノーコード、さらに「問合せフォームの入力チェック」だけを自分で数行のプログラムで書き足すのがローコードのイメージです。
review:
  - ローコード開発＝GUIで部品を組み合わせ、必要な部分だけソースコードを書く。ノーコード開発＝コードを一切書かない。
  - 継続的インテグレーション（ビルド・テストの自動化）、プロトタイピング（試作で要求を明確化）と区別する。
