q: 51
answer: エ
category: プロジェクトマネジメント
theme: |
  プロジェクトの始まりに作る文書「プロジェクト憲章」の説明を、プロジェクトマネジメント計画書・スコープ記述書・WBSと区別する問題です。
basics: |
  プロジェクトマネジメント（PMBOKなど）で作る主な文書
  - <b>プロジェクト憲章</b>：プロジェクトを<b>正式に認可（スタート）</b>するための文書。ビジネスニーズ（なぜやるのか）、目標、成果物の概要、<b>プロジェクトマネージャの任命と、その責任・権限</b>などを記す。プロジェクトの「出生証明書」にあたる。
  - <b>プロジェクトマネジメント計画書</b>：プロジェクトをどう実行・監視・管理するかを定めた文書。スケジュール、コスト、リスクなどの各管理計画を含む。
  - <b>プロジェクトスコープ記述書</b>：プロジェクトのスコープ（範囲）を定義する文書。目標、成果物、要求事項、どこまでやるか（境界）などを記す。
  - <b>WBS（Work Breakdown Structure）</b>：成果物を作るための作業を、階層構造で細かく分解した図・文書。
reasoning: |
  1. プロジェクト憲章のキーワードは「プロジェクトを正式に認可する」「プロジェクトマネージャの責任・権限」です。
  2. 「プロジェクトを正式に認可するために、ビジネスニーズ、目標、成果物、プロジェクトマネージャ、及びプロジェクトマネージャの責任・権限を記した文書」という<b>エ</b>が正解です。
choices:
  ア: プロジェクトの実行・監視・管理の方法を規定し、スケジュールやリスクなどのマネジメントの役割・責任を記した文書は、<b>プロジェクトマネジメント計画書</b>です。誤り。
  イ: プロジェクトのスコープを定義するために、目標・成果物・要求事項・境界を記した文書は、<b>プロジェクトスコープ記述書</b>です。誤り。
  ウ: プロジェクトで実行する作業を階層構造で記した文書は、<b>WBS</b>です。誤り。
  エ: プロジェクトを正式に認可するために、ビジネスニーズ・目標・成果物・プロジェクトマネージャとその責任・権限を記した文書は、<b>プロジェクト憲章</b>です。<b>正解</b>。
example: |
  学校行事に例えると、校長先生が「今年の文化祭を開催する。目的は地域との交流、実行委員長は○○さんとし、予算の使い道を決める権限を与える」と正式に決める文書がプロジェクト憲章です。その後、実行委員会が作る詳しい進め方（計画書）、やることの範囲（スコープ記述書）、作業の一覧（WBS）は別の文書です。
review:
  - プロジェクト憲章＝プロジェクトを正式に認可し、PMの任命と責任・権限、目標、ビジネスニーズなどを記す最初の文書。
  - マネジメント計画書（実行・管理の方法）、スコープ記述書（範囲・境界）、WBS（作業の階層分解）と区別する。
