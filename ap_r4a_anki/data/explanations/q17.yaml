q: 17
answer: ウ
theme: |
  仮想記憶の「ページング方式」で、ページサイズ（主記憶を区切る単位の大きさ）を半分にしたときの影響を考える問題です。
basics: |
  <b>主記憶（メモリ）</b>：プログラムを実行するときに置いておく場所。容量に限りがあります。
  <b>ページング方式</b>：主記憶とプログラムを、<b>ページ</b>という決まった大きさのブロックに区切って管理する方式です。プログラムはページ単位で主記憶に割り当てられます。

  <b>内部断片化（ページ内の無駄な空き）</b>：ページは「丸ごと1ページ」単位で割り当てるので、プログラムがページより小さいと、余った部分は誰も使えない無駄な空きになります。
  <b>ページフォールト・ページ置換え</b>：必要なページが主記憶にないとき（ページフォールト）、ディスクから読み込み、代わりに別のページを追い出します（ページ置換え）。ディスクは遅いので、これが多いと性能が落ちます。
reasoning: |
  1. 条件整理：ほとんどのプログラムはページサイズの<b>半分以下</b>。主記憶は不足しがちです。
  2. 現状：プログラムが半ページ以下なのに1ページ丸ごと割り当てるので、各ページの<b>半分以上が無駄な空き</b>になっています。
  3. ページサイズを半分にすると、ほとんどのプログラムは<b>新しいページ1枚にぴったり収まります</b>（半分以下なので入る）。
  4. 数値例：ページ4KB、プログラム1.5KBなら無駄は2.5KB。ページを2KBにすると無駄は0.5KBに減ります。
  5. 1プログラムあたりの使用量が減るので、同じ主記憶により多くのプログラムを置けるようになり、<b>主記憶不足が緩和</b>されます。正解は<b>ウ</b>です。
choices:
  ア: ページサイズが小さくなると、管理すべきページの<b>数が増える</b>ため、ページ表が大きくなるなど領域管理のオーバーヘッド（管理のための余分な手間）はむしろ<b>増加</b>します。誤り。
  イ: ほとんどのプログラムは半ページ以下なので、ページを半分にしても1ページに収まります。ページが足りなくなってページ置換えが増えるわけではありません。誤り。
  ウ: ページ内の無駄な空き領域（内部断片化）が減り、主記憶を有効に使えるので主記憶不足が緩和されます。<b>正解</b>。
  エ: プログラムは相変わらず1ページに収まるので、プログラムが複数ページにまたがってページフォールトが増える、ということは起こりにくいです。むしろ主記憶に余裕ができて、ページフォールトは減る方向です。誤り。
example: |
  1台に8人乗れるワゴン車（大きいページ）で、3人ずつのグループを運ぶと、1台につき5席が空席のままです。4人乗りの車（ページ半分）に変えれば、空席は1席で済み、同じ駐車場（主記憶）にもっと多くのグループを収められます。
review:
  - ページングでは1ページ単位で割り当てるため、ページ内に使われない空き（内部断片化）が生じることを理解する。
  - プログラムがページの半分以下なら、ページを半分にしても1ページに収まり、無駄が減って主記憶不足が緩和される。
  - ページを小さくすると、ページ数が増えて管理のオーバーヘッドは増えることも覚えておく。
