q: 39
answer: ア
category: セキュリティ
theme: |
  AIで本物そっくりの偽の映像や音声を作る「ディープフェイク」を悪用した攻撃を、ランサムウェアやBEC（ビジネスメール詐欺）などと区別する問題です。
basics: |
  <b>ディープフェイク</b>：ディープラーニング（深層学習）などのAI技術で、実在する人物の<b>顔や声を本物そっくりに合成・加工した</b>偽の映像や音声です。
  悪用の例：経営者（CEO）の声をまねて従業員に電話をかけ、送金を指示する詐欺、有名人の偽動画で偽の投資話を広めるなど。

  関連する攻撃
  - <b>ランサムウェア</b>：データを暗号化し、復号の鍵と引き換えに身代金を要求する。
  - <b>暴露型の脅迫</b>：盗んだ（と主張する）データを公開しないことと引き換えに金銭を要求する。
  - <b>BEC（ビジネスメール詐欺）</b>：経営者や取引先になりすました偽のメールで、送金を指示する。不正に入手した認証情報でメールアカウントを乗っ取る手口もある。
reasoning: |
  1. ディープフェイクのキーワードは「AI技術で加工した（本物そっくりの）音声や映像」です。
  2. 「AI技術によって加工したCEOの音声を使用して従業員に電話をかけ、送金を指示した」という<b>ア</b>が、ディープフェイクを悪用した攻撃です。
choices:
  ア: AI技術で加工したCEOの音声を使って従業員に電話をかけ、送金を指示するのは、<b>ディープフェイク</b>を悪用した攻撃です。<b>正解</b>。
  イ: PCをランサムウェアに感染させ、データの復号鍵と引き換えに暗号資産を要求するのは、<b>ランサムウェア</b>による攻撃です。AIによる偽の音声・映像は使っていません。誤り。
  ウ: 秘密情報を盗んだと誤認させるメールを送り、公開しないことと引き換えに暗号資産を要求するのは、<b>脅迫（ブラフ）型の詐欺</b>です。誤り。
  エ: 不正に入手した認証情報でCEOのメールアカウントにログインし、偽のメールで送金を指示するのは、<b>BEC（ビジネスメール詐欺）</b>です。ディープフェイクは使っていません。誤り。
example: |
  ある会社の経理担当者に、社長とまったく同じ声で「急ぎの取引だから、今すぐこの口座に振り込んでくれ」と電話がかかってきたら、信じてしまうかもしれません。これがディープフェイクの悪用です。対策として、送金の指示は別の連絡手段で本人に確認する、などのルールが有効です。
review:
  - ディープフェイク＝AIで人物の顔・声を本物そっくりに合成した偽の映像・音声。CEOの声をまねた送金指示などに悪用される。
  - ランサムウェア（暗号化して身代金）、脅迫型詐欺、BEC（偽メールで送金指示）とは手口が異なる。
