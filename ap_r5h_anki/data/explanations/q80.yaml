q: 80
answer: エ
category: 法務
theme: |
  技術者倫理の遵守を妨げる要因の一つ「集団思考（グループシンク）」の意味を、自己中心的な考え方や権威への服従などと区別する問題です。
basics: |
  <b>技術者倫理</b>：技術者が、公衆の安全や健康、社会への影響を考えて、正しく行動するための考え方です。しかし、組織の中では、倫理的な判断が妨げられることがあります。その主な要因には次のようなものがあります。
  - <b>集団思考（グループシンク）</b>：<b>結束の強いチーム</b>が、仲間内の和を重んじるあまり、異論を言いにくくなり、<b>自分たちへの批判的な検討ができなくなって</b>、不合理な結論に合意してしまう現象。
  - <b>自己中心的な考え方（視野の狭さ）</b>：自分の立場からしか物事を見られず、客観性に欠けること。
  - <b>権威への服従</b>：組織内の上司や権威に、無批判に従ってしまうこと。
  - <b>意志の弱さ</b>：何が正しいかは分かっていても、それを実行する勇気や決断力に欠けること。
reasoning: |
  1. 集団思考のキーワードは「強い連帯性をもつチーム」「批判的思考を欠く」「不合理な合意」です。
  2. 「強い連帯性をもつチームが自らへの批判的思考を欠いて、不合理な合意へと達すること」という<b>エ</b>が正解です。
choices:
  ア: 自分とは違った視点から事態を見ることができず、客観性に欠けることは、<b>自己中心的な考え方（視野の狭さ）</b>の説明です。集団思考ではありません。誤り。
  イ: 組織内の権威に無批判に服従することは、<b>権威への服従</b>の説明です。誤り。
  ウ: 正しいことが何かは知っているが、それを実行する勇気や決断力に欠けることは、<b>意志の弱さ</b>の説明です。誤り。
  エ: 強い連帯性をもつチームが自らへの批判的思考を欠いて、不合理な合意へと達することは、<b>集団思考</b>の説明です。<b>正解</b>。
example: |
  仲の良い開発チームで「みんな大丈夫だと言っているし、雰囲気を壊したくないから、テスト不足は黙っておこう」と全員が考え、結局欠陥のある製品を出荷してしまう…というのが集団思考の典型です。あえて反対意見を言う役（悪魔の代弁者）を決めるなどの対策があります。
review:
  - 集団思考＝結束の強いチームが批判的な検討をしなくなり、不合理な合意に達する現象。
  - 自己中心的な考え方（客観性の欠如）、権威への服従、意志の弱さ（実行する勇気の欠如）と区別する。
