q: 16
answer: ウ
category: ソフトウェア
theme: |
  ジョブの実行順序と一時ファイルの作成・削除のルールから、ディスク上に同時に存在する一時ファイルの最大容量を求める問題です。時間の流れに沿ってジョブの状態を追うシミュレーション問題です。
basics: |
  <b>ジョブ</b>：コンピュータに実行させる仕事の単位です。図の矢印は「矢印の元のジョブが終わってから、先のジョブを実行できる」という順序関係を表します。
  <b>実行多重度2</b>：同時に実行できるジョブは2つまで、という意味です。
  <b>生起</b>：ジョブが実行待ち行列に追加されること（実行可能になること）です。

  条件を整理すると、
  - 各ジョブは同じ時間（1単位とする）で終わる。
  - 各ジョブは開始時に50Mバイトの一時ファイルを作る。
  - XのファイルはXの直後のジョブY（複数あるなら最初に生起されるもの）が参照し、<b>Yの終了時に削除</b>される。
  - 後続が複数あるときは、上に書かれたジョブから先に生起される。複数の先行ジョブがあるジョブは、全部が終わってから生起される。
reasoning: |
  まず、各ジョブのファイルを「誰が参照し、いつ消えるか」を決めます。
  | Aのファイル：後続はB・C。上のBが先に生起 → Bの終了時に削除
  | Bのファイル：後続はD・E。上のDが先に生起 → Dの終了時に削除
  | Cのファイル：後続はE → Eの終了時に削除
  | D・Eのファイル：後続はF → Fの終了時に削除
  | Fのファイル：後続なし → 削除されない

  次に、1単位時間ごとにジョブとファイルを追います（終了時の削除を先に行い、その後に開始時の作成を行う）。
  | 時刻0〜1：A実行。ファイル A → 50M
  | 時刻1〜2：B・C実行（多重度2）。ファイル A,B,C → 150M
  | 時刻2：Bの終了でAのファイルを削除。B・C両方終了 → D・Eが生起
  | 時刻2〜3：D・E実行。ファイル B,C,D,E → <b>200M</b>
  | 時刻3：Dの終了でBのファイル、Eの終了でCのファイルを削除 → Fが生起
  | 時刻3〜4：F実行。ファイル D,E,F → 150M
  | 時刻4：Fの終了でD・Eのファイルを削除。ファイル F → 50M
  最大は時刻2〜3の <b>200Mバイト</b> です。正解は<b>ウ</b>です。
choices:
  ア: 100Mバイトは、2ジョブ分（多重度2の同時実行分）しか考えていない値です。前のジョブのファイルは後続ジョブが終わるまで残るので、実際はもっと多く必要です。誤り。
  イ: 150Mバイトは、時刻1〜2（A,B,C）や時刻3〜4（D,E,F）の容量です。最大の時刻2〜3を見落としています。誤り。
  ウ: 200Mバイト。時刻2〜3に B,C,D,E の4ファイルが同時に存在し、これが最大です。<b>正解</b>。
  エ: 250Mバイトは、Bの終了時にAのファイルが削除されることを考慮せず、A,B,C,D,E の5ファイルを数えた値です。誤り。
example: |
  料理の作り置き容器に例えると、各工程（ジョブ）は始めるときに容器を1つ使い、次の工程がその中身を使い終えたら容器を洗って片付けます。同時に2工程まで進められるとき、台所に容器が最大何個並ぶかを数える問題です。
review:
  - ジョブごとに「ファイルを誰が参照し、いつ削除されるか」を先に整理してから、時刻ごとに表で追う。
  - 削除はファイルを参照する後続ジョブの「終了時」。終了時の削除を反映してから次の開始時の作成を数える。
