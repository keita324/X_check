q: 52
answer: イ
theme: |
  プレシデンスダイアグラム法（PDM）で表された作業の依存関係から、全作業の完了までにかかる最少日数を計算する問題です。「リード」と「ラグ」の意味がポイントです。
basics: |
  <b>アクティビティ</b>：プロジェクトの個々の作業です。
  <b>プレシデンスダイアグラム法（PDM）</b>：作業を四角（ノード）で表し、矢印で作業間の依存関係を表す図法です。依存関係には次の種類があります。
  - <b>終了−開始関係（FS）</b>：前の作業が<b>終わってから</b>、次の作業を開始する（最も一般的）。
  - <b>開始−開始関係（SS）</b>：前の作業が<b>始まってから</b>、次の作業を開始できる。

  <b>リード</b>：後の作業を<b>前倒し</b>して早く始められる日数。「終了−開始（リード2日）」なら、前の作業が終わる<b>2日前</b>に次を開始できます。
  <b>ラグ</b>：後の作業の開始を<b>遅らせる</b>（待つ）日数。「開始−開始（ラグ3日）」なら、前の作業が始まった<b>3日後</b>に次を開始できます。
reasoning: |
  プロジェクト開始を0日目として、各作業の開始日と終了日を計算します。
  | A：0日目に開始、6日間 → 6日目に終了
  | B：Aと終了−開始関係（リード2日）→ Aの終了の2日前に開始
  | 　 開始＝6 − 2 ＝ 4日目、7日間 → 4 ＋ 7 ＝ 11日目に終了
  | C：Bと開始−開始関係（ラグ3日）→ Bの開始の3日後に開始
  | 　 開始＝4 ＋ 3 ＝ 7日目、5日間 → 7 ＋ 5 ＝ 12日目に終了
  すべての作業が終わるのは、最も遅いCの終了＝<b>12日目</b>です。正解は<b>イ</b>です。
choices:
  ア: 11日は、Bの終了日です。Cの終了（12日目）を見落としています。誤り。
  イ: 12日。Cが最後に終わる作業で、計算結果と一致します。<b>正解</b>。
  ウ: 13日。正しく計算するとCは7日目に始まり12日目に終わるので、1日多い値です。誤り。
  エ: 14日は、リード2日を無視して、BをAの終了後（6日目）に開始した場合の値です（B：6〜13日、C：9〜14日）。誤り。
example: |
  引っ越しで考えると、A「荷造り6日」が終わる2日前から（リード2日）、B「新居の掃除7日」を始められ、掃除を始めて3日たったら（ラグ3日）、C「家具の搬入5日」を並行して始められる、という関係です。
review:
  - リード＝前倒し（開始を早める）、ラグ＝待ち時間（開始を遅らせる）。
  - 終了−開始関係は「前の作業の終了」、開始−開始関係は「前の作業の開始」を基準に開始日を計算する。
  - 最後に終わる作業の終了日が全体の所要日数になる（Bの11日で止めない）。
