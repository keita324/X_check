q: 2
answer: エ
category: 基礎理論
theme: |
  複数の変数をもつデータを分析する手法（多変量解析）のうち、「主成分分析」の説明を、因子分析・回帰分析・クラスター分析と区別する問題です。
basics: |
  <b>多変量解析</b>：身長・体重・年齢など、複数の変数をまとめて分析する手法の総称です。
  - <b>主成分分析</b>：たくさんの変数を<b>統合した新しい変数（主成分）</b>を作り、情報をなるべく失わずに<b>変数の数を減らす</b>（要約する）手法。例：国語・数学・英語・理科・社会の5科目を「総合学力」「文系・理系の傾向」の2つの指標にまとめる。
  - <b>因子分析</b>：観測された変数に共通して影響を与えている、目に見えない<b>潜在的な要因（因子）</b>を見つけ、データの背後の構造を探る手法。
  - <b>回帰分析</b>：ある変数の値から、ほかの変数の値を<b>予測</b>する式を作り、変数の関係を調べる手法。
  - <b>クラスター分析</b>：似ているデータ同士を集めて<b>グループ（クラスター）に分類</b>する手法。
reasoning: |
  1. 主成分分析のキーワードは「変数を統合した新たな変数」「変数の数を減らす（次元削減）」です。
  2. 「変数を統合した新たな変数を使用して、データがもつ変数の数を減らす方法」という<b>エ</b>が正解です。
choices:
  ア: 変数に共通して影響を与える新たな変数（因子）を計算して、データの背後にある構造を取得するのは<b>因子分析</b>です。誤り。
  イ: 変数の値からほかの変数の値を予測して、変数間の関連性を確認するのは<b>回帰分析</b>です。誤り。
  ウ: 値が互いに類似するものを集めてデータを分類するのは<b>クラスター分析</b>です。誤り。
  エ: 変数を統合した新たな変数（主成分）を使用して、変数の数を減らすのは<b>主成分分析</b>です。<b>正解</b>。
example: |
  スマホの性能を「CPU、メモリ、画面サイズ、カメラ画素数、電池容量…」と10項目で比べると分かりにくいですが、主成分分析で「総合的な性能」と「携帯性」の2つの指標にまとめれば、2次元のグラフで各機種を比較できます。
review:
  - 主成分分析＝複数の変数を統合した新しい変数（主成分）で、変数の数を減らす（要約・次元削減）。
  - 因子分析（共通の潜在要因）、回帰分析（予測）、クラスター分析（似たもの同士の分類）と区別する。
