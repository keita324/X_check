q: 71
answer: ウ
category: 技術戦略マネジメント
theme: |
  生成AIの基盤モデルを、自社の独自データで追加学習させて業務向けに特化させる手法「ファインチューニング」を問う問題です。
basics: |
  <b>基盤モデル（ファウンデーションモデル）</b>：大量のデータで事前学習された汎用的なAIモデルです。大規模言語モデル（LLM）などがあります。
  基盤モデルを自社で活用する主な方法
  - <b>ファインチューニング</b>：基盤モデルに、自社の<b>独自データを追加で学習</b>させ、モデルのパラメータ（重み）を調整して、特定の業務やサービスに特化させる。
  - <b>プロンプトエンジニアリング</b>：モデル自体は変えずに、<b>指示文（プロンプト）の書き方を工夫</b>して望む出力を得る。
  関連用語
  - <b>アノテーション</b>：学習用データに正解ラベルやタグなどの情報を付ける作業。
  - <b>クラスタリング</b>：正解ラベルなしで、似たデータ同士をグループ（クラスタ）に分ける手法（教師なし学習）。
reasoning: |
  1. 問題文のポイントは「独自のデータを<b>学習させる</b>」「基盤モデルを<b>特化したモデルへカスタマイズ</b>する」です。
  2. 既存のモデルに追加学習してモデル自体を調整するのは<b>ファインチューニング</b>です。
  3. プロンプトエンジニアリングは学習させずに指示文を工夫する方法なので当てはまりません。正解は<b>ウ</b>です。
choices:
  ア: アノテーションは、学習データに正解ラベルなどの注釈を付ける作業で、モデルを特化させる手法そのものではありません。誤り。
  イ: クラスタリングは、データを似たもの同士のグループに分ける分析手法で、基盤モデルのカスタマイズではありません。誤り。
  ウ: ファインチューニングは、基盤モデルに独自データを追加学習させ、自社の業務やサービスに特化したモデルへ調整する手法です。<b>正解</b>。
  エ: プロンプトエンジニアリングは、モデルに独自データを学習させず、入力する指示文を工夫して出力を改善する手法です。誤り。
example: |
  一般的な文章が書ける生成AIに、自社の過去の問合せと回答の記録を追加で学習させると、自社製品に詳しいサポート用AIになります。これがファインチューニングです。一方、「あなたは当社のサポート担当です。丁寧に答えてください」と指示文を工夫するだけなら、プロンプトエンジニアリングです。
review:
  - ファインチューニング＝基盤モデルに独自データを追加学習させ、特定業務に特化させる。
  - プロンプトエンジニアリング（指示文の工夫・学習なし）、アノテーション（ラベル付け）、クラスタリング（グループ分け）と区別する。
