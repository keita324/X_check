q: 23
answer: ウ
category: ハードウェア
theme: |
  ICカードや組込み機器のプロセッサを、分解・解析による秘密情報の盗み出しから守る「耐タンパ性」を高める方法を選ぶ問題です。
basics: |
  <b>タンパ（tamper）</b>：機器を不正にいじる、改ざんする、こじ開けるといった意味です。
  <b>耐タンパ性</b>：機器を分解したり、内部の信号を測ったりして、中の秘密情報（暗号鍵など）を読み取ろうとする攻撃に対する強さです。ICカード、スマートフォンの安全な領域、決済端末などで重要です。

  耐タンパ性を高める代表的な方法
  - チップを開けたり削ったりすると、内部の回路やデータが<b>自動的に壊れる・消える</b>ようにする。
  - 内部の配線やメモリの配置を<b>複雑・不規則</b>にして、解析しにくくする。
  - 解析の手がかりになる端子（検査用パッドなど）を残さない。
reasoning: |
  1. 耐タンパ性は「内部を解析されにくくすること」です。
  2. 「チップ内部を物理的に解析しようとすると、内部回路が破壊されるようにする」なら、こじ開けた時点で秘密情報が失われるので、盗み出せません。
  3. 正解は<b>ウ</b>です。
choices:
  ア: ESD（静電気放電）への耐性強化は、静電気による故障を防ぐ<b>信頼性</b>の向上策です。不正な解析を防ぐ耐タンパ性とは目的が異なります。誤り。
  イ: 検査用パッド（端子）を残しておくと、攻撃者がそこから内部の信号にアクセスできる手がかりになります。耐タンパ性を下げるので誤り。
  ウ: 物理的に解析しようとすると内部回路が破壊されるようにすれば、秘密情報を取り出せなくなります。耐タンパ性を高める手法です。<b>正解</b>。
  エ: 内部メモリの物理アドレスを整然と配置すると、どこに何があるかが推測しやすくなり、解析が容易になります。耐タンパ性を下げるので誤り。
example: |
  映画に出てくる「無理にこじ開けると中の書類にインクが吹き付けられて読めなくなる金庫」や、現金輸送ケースが不正に開けられると紙幣を染料で汚す仕組みと同じ発想です。中身を奪われそうになったら、中身自体を使えなくしてしまいます。
review:
  - 耐タンパ性＝不正な分解・解析から内部の秘密情報を守る性質。解析されると回路やデータが壊れる仕組みが代表例。
  - 検査用パッドを残す・アドレスを整然と配置するのは解析を容易にする（逆効果）。ESD耐性は信頼性の話。
