q: 79
answer: ウ
category: 法務
theme: |
  請負契約なのに、実態は労働者派遣になってしまっている「偽装請負」の状況を選ぶ問題です。誰の従業員が、誰の指揮命令を受けているかがポイントです。
basics: |
  <b>請負契約</b>：受注者（ここではB社）が仕事の完成を約束する契約です。受注者が<b>自分の従業員に自分で指揮命令</b>して仕事を進めます。作業場所が発注者（A社）の事業所であっても、指揮命令するのはB社です。
  <b>労働者派遣</b>：派遣元に雇われた労働者が、派遣先の<b>指揮命令を受けて</b>働く形態です。労働者派遣法のルール（許可の取得など）を守る必要があります。
  <b>偽装請負</b>：契約上は請負なのに、実態として<b>発注者が受注者の従業員に直接指揮命令</b>している状態です。労働者派遣法などに違反します。
reasoning: |
  1. 偽装請負かどうかは、「受注者（B社）の従業員」が「発注者（A社）の指揮命令」を受けているかで判断します。
  2. ウ：B社の従業員が、A社を作業場所として、<b>A社の責任者の指揮命令</b>に従って設計書を作成している → 発注者が受注者の従業員に直接指示しているので<b>偽装請負</b>です。
  3. エ：B社の従業員が、A社で作業していても、指揮命令するのはB社の責任者 → 適切な請負です。
  4. ア・イ：A社（発注者）自身の従業員の話なので、請負契約の偽装の問題ではありません。
  5. 正解は<b>ウ</b>です。
choices:
  ア: A社の従業員が、A社の責任者の指揮命令に従って作業するのは、自社の従業員に対する通常の業務指示です。作業場所がB社でも偽装請負には当たりません。誤り。
  イ: A社の従業員がB社の責任者の指揮命令を受けるのは、A社からB社への出向や派遣の問題であり、A社がB社に委託している請負契約の偽装請負とは異なります。誤り。
  ウ: B社（受注者）の従業員が、A社（発注者）の責任者の指揮命令に従って作業しているので、偽装請負に当たります。<b>正解</b>。
  エ: B社の従業員が、A社の事業所で作業していても、B社の責任者の指揮命令に従っているので、適正な請負です。誤り。
example: |
  家のリフォームを工務店に頼んだ施主（発注者）が、職人さんに直接「今日はこっちの壁を先に塗って」「明日は朝7時に来て」と指示を出し始めたら、それは実質的に施主が職人を雇っているのと同じです。請負なら、施主は工務店の責任者に要望を伝え、職人への指示は工務店が行います。
review:
  - 偽装請負＝請負契約なのに、発注者が受注者の従業員に直接指揮命令している状態。
  - 作業場所がどこかではなく、「誰の従業員が、誰の指揮命令を受けているか」で判断する。
